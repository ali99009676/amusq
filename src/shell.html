<!doctype html>
<!-- ملف «مراجعة — بنك الأسئلة» المبني — لا تحرّره يدويًا. مصدره في src/ ويُدمج بـ node src/build.js -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="مراجعة — بنك الأسئلة · بنوك أسئلة لكل التخصصات، يرفعها طلاب الجامعات العربية ويراجعون منها">
<meta name="theme-color" content="#0e1117">
<link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
<title>مراجعة · بنك الأسئلة</title>
<script>
/* الوضع قبل أول رسم — وإلا ومض الفاتح لحظة ثم أظلم. الليلي هو الافتراضي (هوية AMSU) */
try{
  var __t = JSON.parse(localStorage.getItem('qbank:theme') || '"dark"');
  if (__t === 'auto') __t = (matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', __t === 'light' ? 'light' : 'dark');
}catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
</script>
<style>
/*__STYLES__*/
</style>
</head>
<body>
<!-- الهيكل ثابت هنا، والمحتوى يُحقن من الموجّه. السبب: تجنّب وميض الصفحة عند أول رسم -->
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>

<header class="topbar" id="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="#/" aria-label="مراجعة — الرئيسية">
      <span class="brand__mark" aria-hidden="true">
        <!-- كتاب مفتوح: صفحتان وكعب بينهما — العلامة نفسها في الأيقونة والترويسة -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
          <path d="M12 6.2C10.3 5 8.2 4.5 5.5 4.5c-.8 0-1.5.1-2 .2v13c.5-.1 1.2-.2 2-.2 2.7 0 4.8.5 6.5 1.7"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 6.2C13.7 5 15.8 4.5 18.5 4.5c.8 0 1.5.1 2 .2v13c-.5-.1-1.2-.2-2-.2-2.7 0-4.8.5-6.5 1.7"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 6.2v13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__name">مراجعة</span>
        <span class="brand__sub">بنك الأسئلة</span>
      </span>
    </a>
    <!-- تنقّل سطح المكتب: يُملأ من buildTabbar ولا يظهر دون ٨٢٠ بكسل -->
    <nav class="topnav" id="topnav" aria-label="التنقّل"></nav>
    <div class="topbar__actions">
      <button class="iconbtn" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي" title="الوضع الليلي">
        <span class="iconbtn__ico" aria-hidden="true" data-theme-icon>☾</span>
      </button>
      <!-- يُستبدل بعد الدخول ببطاقة الحساب (انظر QBANK.authChip) -->
      <span id="authSlot"><a class="btn btn--sm" href="#/login" data-nav="#/login">دخول</a></span>
    </div>
  </div>
</header>

<main id="main" class="wrap main" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="التنقّل الرئيسي"></nav>

<footer class="footer">
  <div class="wrap">
    <p class="footer__credit">
      برمجة وتصميم
      <a href="https://wa.me/966580805553" target="_blank" rel="noopener noreferrer">علي الصقور</a>
    </p>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*__SCRIPTS__*/
</script>
</body>
</html>
