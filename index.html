<!doctype html>
<!-- ملف «مراجعة — بنك الأسئلة» المبني — لا تحرّره يدويًا. مصدره في src/ ويُدمج بـ node src/build.js -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="مراجعة — بنك الأسئلة · بنوك أسئلة لكل التخصصات، يرفعها طلاب الجامعات العربية ويراجعون منها">
<meta name="theme-color" content="#0e1117">
<link rel="manifest" href="manifest.webmanifest">
<title>مراجعة · بنك الأسئلة</title>
<script>
/* الوضع قبل أول رسم — وإلا ومض الفاتح لحظة ثم أظلم. الليلي هو الافتراضي (هوية AMSU) */
try{
  var __t = JSON.parse(localStorage.getItem('qbank:theme') || '"dark"');
  if (__t === 'auto') __t = (matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', __t === 'light' ? 'light' : 'dark');
}catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
</script>
<style>

/* ===== 00-tokens.css ===== */
/*
  مصدر واحد للمظهر. أي لون أو مسافة في المشروع يأتي من هنا حصرًا.

  هوية AMSU — منقولة حرفيًا من مشروع علي الأول (amsu.alsoqoor.com) بطلبه:
  «طريقة العرض خذها من هنا». نفس اللوحة، نفس الخط، نفس الأقطار والظلال،
  والليلي هو الافتراضي كما في AMSU، والفاتح زرّ لمن يريده.

  الأسماء مزدوجة عمدًا: أسماء المنصة التاريخية (--text --brand --sh1…)
  تبقى كي لا يُعاد فتح كل ملف مكوّنات، وأسماء AMSU (--txt --acc --shadow-sm…)
  تُعرَّف معها كي تُنقل وصفات AMSU كما هي بلا ترجمة.
*/
:root{
  /* الخطوط كما في AMSU: كوفي عربي للواجهة كلها، ولاتيني نظيف للنص الأصلي.
     لا خط خارجي — كلها أسماء نظامية تتوفر على أجهزة الطلاب أو تسقط بسلام */
  --font: "Noto Kufi Arabic", "Dubai", "Tajawal", "Cairo", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-display: var(--font);
  --font-latin: "Inter", "Poppins", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  /* الأرقام: نفس اللاتيني مع أرقام جدولية ثابتة العرض كي لا ترقص العدّادات */
  --font-num: var(--font-latin);

  /* لوحة AMSU الفاتحة */
  --bg:        #f4f6f9;
  --bg-soft:   #eaedf3;
  --surface:   #ffffff;
  --surface-2: #f8fafc;
  --line:      #e4e8ef;
  --line-soft: #eef1f5;
  --line-2:    #d6dce6;

  --text:      #141821;
  --text-2:    #5a6273;
  --text-3:    #8c94a5;

  /* المِحور اللوني: رمادي أردوازي محايد في العموم، وتلوّنه كل مادة بلونها
     عبر --acc محلّيًا — هذه فكرة AMSU المركزية: الحياد في الهيكل واللون للمادة */
  --brand:      #4b5563;
  --brand-2:    #374151;
  --brand-soft: #eef1f5;
  --on-brand:   #ffffff;

  --gold:      #e8a317;
  --gold-soft: #fdf3dd;

  --ok:      #12805c; --ok-soft:   #e6f6ef;
  --warn:    #b06d1e; --warn-soft: #fdf0dc;
  --bad:     #d92020; --bad-soft:  #fdecec;
  --star:    #e8a317;

  /* سلّم المسافات */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 22px; --s6: 30px; --s7: 44px; --s8: 68px;

  /* أقطار AMSU وظلالها */
  --r1: 10px; --r2: 14px; --r3: 20px; --r4: 26px; --r-pill: 999px;
  --sh1: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --sh2: 0 4px 12px rgba(16,24,40,.07), 0 2px 4px rgba(16,24,40,.04);
  --sh3: 0 18px 44px rgba(16,24,40,.12), 0 4px 12px rgba(16,24,40,.06);
  --ring: 0 0 0 3px color-mix(in srgb, var(--acc) 18%, transparent);

  /* قياسات القراءة الأكاديمية */
  --measure: 64ch;
  --read-lh: 1.85;
  --read-size: 1.02rem;

  --rule: color-mix(in srgb, var(--acc) 30%, transparent);
  --rule-soft: color-mix(in srgb, var(--acc) 12%, transparent);

  --wrap: 1080px;
  --topbar-h: 60px;
  --tabbar-h: 62px;

  --t-fast: 140ms;
  --t: 240ms;
  --t-slow: 420ms;
  --ease: cubic-bezier(.22,.61,.36,1);

  /* نص فوق الملوّن، وتدرّج علامة AMSU (بنفسجي ← فيروزي) */
  --on-acc: #ffffff;
  --mark-1: #6d5efc;
  --mark-2: #2ec5c0;

  /* ألوان المواد — حيوية مثل بطاقات AMSU: كل مادة تصبغ بطاقتها ورأسها */
  --subject-1: #059669; --subject-2: #8b5cf6; --subject-3: #f59e0b;
  --subject-4: #d946ef; --subject-5: #0ea5e9; --subject-6: #14b8a6;

  /* ═══ أسماء AMSU كما هي — كي تُلصق وصفاتها بلا ترجمة ═══ */
  --bg2: var(--bg-soft);
  --surface2: var(--surface-2);
  --txt: var(--text); --txt2: var(--text-2); --txt3: var(--text-3);
  --line2: var(--line-2);
  --ok-bg: var(--ok-soft); --bad-bg: var(--bad-soft);
  --shadow-sm: var(--sh1); --shadow-md: var(--sh2); --shadow-lg: var(--sh3);
  --r-sm: var(--r1); --r: var(--r2); --r-lg: var(--r3); --r-xl: var(--r4);
  --maxw: var(--wrap);

  /* --acc: لون السياق الحالي. افتراضه المحور المحايد، وكل بطاقة مادة أو
     رأس مادة يضبطه محليًا style="--acc:…" فيتلوّن كل ما بداخله.
     الغامق والناعم يُشتقّان منه آليًا — في AMSU كانت ثلاثة متغيرات تُضبط
     يدويًا معًا، وضبطُ ثلاثة يدويًا ينسى أحدها يومًا */
  --acc: var(--brand);
  --acc-d: color-mix(in srgb, var(--acc) 78%, #000);
  --acc-soft: color-mix(in srgb, var(--acc) 9%, var(--surface));
}

/* الليلي — لوحة AMSU الليلية، وهو الافتراضي */
:root[data-theme="dark"]{
  --bg:        #0e1117;
  --bg-soft:   #0a0d12;
  --surface:   #161b23;
  --surface-2: #1c222c;
  --line:      #252c38;
  --line-soft: #1e2531;
  --line-2:    #333c4b;

  --text:      #e9edf5;
  --text-2:    #a4aec0;
  --text-3:    #78839a;

  /* المحور في الليل أفتح درجة كي يبقى مقروءًا نصًّا على الأسطح الداكنة */
  --brand:      #96a3b8;
  --brand-2:    #b7c2d4;
  --brand-soft: #1e2531;
  --on-brand:   #0e1117;

  --gold:      #f5c04e;
  --gold-soft: #2e2410;

  --ok:      #39d39a; --ok-soft:   #0f2a22;
  --warn:    #dda049; --warn-soft: #2e2410;
  --bad:     #ff6b6b; --bad-soft:  #33161a;
  --star:    #f5c04e;

  --sh1: 0 1px 2px rgba(0,0,0,.4);
  --sh2: 0 6px 18px rgba(0,0,0,.45);
  --sh3: 0 20px 50px rgba(0,0,0,.55);
}


/* ===== 10-base.css ===== */
/* الأساسيات: تصفير مضبوط + تنسيق عربي RTL + جوال أولًا */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  font-family:var(--font);
  /* مقياس AMSU: يتنفّس مع عرض الشاشة بين ١٥ و١٧ */
  font-size:clamp(15px, 1.7vw + 10px, 17px);
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;                 /* سطر مريح للعربية، فحروفها متصلة وتحتاج تنفّسًا */
  color:var(--text);
  background:var(--bg);
  /* لماذا هنا؟ لأن أي تمرير أفقي على جوال ٣٦٠ بكسل يُعدّ عيبًا في معايير القبول */
  overflow-x:hidden;
  min-height:100vh;
  display:flex; flex-direction:column;
  transition:background var(--t) var(--ease), color var(--t) var(--ease);
}
/* العناوين بالخط الكوفي الهندسي — هو شخصية الصفحة، والنص بخط أنعم للقراءة */
h1,h2,h3,h4{
  font-family:var(--font-display);
  margin:0 0 var(--s3); line-height:1.45; font-weight:800;
  letter-spacing:-.01em;
}
h1{ font-size:1.6rem; } h2{ font-size:1.3rem; } h3{ font-size:1.06rem; }
p{ margin:0 0 var(--s3); }
a{ color:var(--acc); text-decoration:none; }
a:hover{ text-decoration:underline; }
ul,ol{ margin:0 0 var(--s3); padding-inline-start:var(--s5); }
button,input,select,textarea{ font:inherit; color:inherit; }
img,svg{ max-width:100%; height:auto; }

/* الأرقام تبقى لاتينية داخل النصوص العربية لسهولة قراءة النتائج والنسب */
.num,[data-num]{ font-family:var(--font-num); font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; }
/* نصوص الأسئلة تبقى بلغتها الأصلية واتجاهها — وبخط لاتيني نظيف كما في AMSU */
.ltr{ direction:ltr; text-align:left; unicode-bidi:isolate; font-family:var(--font-latin); letter-spacing:0; }
::selection{ background:var(--acc); color:#fff; }

/* حلقة تركيز ناعمة بدل الخط الحاد — أوضح للوحة المفاتيح وأجمل */
:focus-visible{ outline:none; box-shadow:var(--ring); border-radius:var(--r1); }

.skip{
  position:absolute; inset-inline-start:-9999px; top:0; z-index:99;
  background:var(--brand); color:var(--on-brand); padding:var(--s3) var(--s4); border-radius:0 0 var(--r2) var(--r2);
}
.skip:focus{ inset-inline-start:var(--s4); }

.wrap{ width:100%; max-width:var(--wrap); margin-inline:auto; padding-inline:var(--s4); }

/* احترام تفضيل تقليل الحركة شرط في معايير القبول، لا تحسين اختياري */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}


/* ===== 20-layout.css ===== */
/* الهيكل: شريط علوي ثابت، محتوى، شريط تبويب سفلي على الجوال، تذييل */
.topbar{
  position:sticky; top:0; z-index:20;
  height:var(--topbar-h);
  /* زجاج AMSU: خلفية الصفحة نفسها مموّهة لا سطح أبيض */
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  transition:box-shadow var(--t) var(--ease);
}
.topbar__in{ height:100%; display:flex; align-items:center; justify-content:space-between; gap:var(--s3); }
.topbar__actions{ display:flex; align-items:center; gap:var(--s2); }

.brand{ display:inline-flex; align-items:center; gap:var(--s2); color:var(--text); font-weight:800; letter-spacing:.5px; }
.brand:hover{ text-decoration:none; }
.brand__mark{
  width:32px; height:32px; border-radius:9px; display:grid; place-items:center;
  /* تدرّج علامة AMSU نفسه: بنفسجي إلى فيروزي بتوهّج ناعم */
  background:linear-gradient(135deg, var(--mark-1), var(--mark-2)); color:var(--on-acc);
  box-shadow:0 4px 12px -4px var(--mark-1);
}
/* الاسم فوق والوصف تحته: «مراجعة» هو الاسم، و«بنك الأسئلة» يشرحه لمن يراه أول مرة */
.brand__text{ display:flex; flex-direction:column; line-height:1.15; }
.brand__name{ font-family:var(--font-display); font-weight:800; font-size:1.02rem; letter-spacing:-.01em; }
.brand__sub{ font-size:.66rem; font-weight:700; color:var(--text-3); letter-spacing:.02em; }
@media (max-width:360px){ .brand__sub{ display:none; } }   /* على أضيق جوال يبقى الاسم وحده */

.main{
  flex:1 0 auto;
  padding-block:var(--s5) var(--s8);
  /* مساحة أسفل تكفي شريط التبويب السفلي كي لا يغطّي آخر بطاقة */
  padding-bottom:calc(var(--tabbar-h) + var(--s8));
}

.tabbar{
  position:fixed; inset-inline:0; bottom:0; z-index:20;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px);
  display:flex; align-items:stretch;
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);
}
.tabbar__item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--text-3); font-size:.72rem; font-weight:600; padding:var(--s1);
  min-width:0;                       /* يمنع تمدّد النص فيكسر الشريط على ٣٦٠ بكسل */
}
.tabbar__item:hover{ text-decoration:none; color:var(--text-2); }
.tabbar__item[aria-current="page"]{ color:var(--brand); }
.tabbar__ico{ font-size:1.15rem; line-height:1; }
.tabbar__lbl{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

.footer{
  flex:0 0 auto;
  padding-block:var(--s5);
  padding-bottom:calc(var(--tabbar-h) + var(--s5));
  border-top:1px solid var(--line);
  background:var(--bg-soft);
  color:var(--text-3); font-size:.85rem; text-align:center;
}
.footer__credit{ margin:0; }
.footer__credit a{ font-weight:700; }

.grid{ display:grid; gap:clamp(14px,2.2vw,20px); grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr)); }
@media (min-width:640px){ .grid--2{ grid-template-columns:repeat(2,1fr); } }
@media (min-width:900px){ .grid--3{ grid-template-columns:repeat(3,1fr); } }

/* على الشاشات الكبيرة يختفي الشريط السفلي وتظهر روابط أعلى */
@media (min-width:820px){
  .tabbar{ display:none; }
  .main{ padding-bottom:var(--s8); }
  .footer{ padding-bottom:var(--s5); }
}


/* ===== 30-components.css ===== */
/* مكوّنات مشتركة — وصفات AMSU حرفيًا بأسماء أصناف المنصة */

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  padding:var(--s5); box-shadow:var(--sh1);
  transition:box-shadow var(--t) var(--ease), border-color var(--t) var(--ease);
}
.card--flat{ box-shadow:none; }
.card__head{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); margin-bottom:var(--s3); }

/* زر AMSU: مستطيل بقطر --r2 لا حبّة، والأساسي بلون المحور مع ظل ملوّن */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  padding:.72em 1.25em; border-radius:var(--r2); border:1px solid transparent;
  background:var(--acc); color:var(--on-acc); font-weight:700; font-size:.94em; cursor:pointer;
  min-height:44px; white-space:nowrap;
  font-family:var(--font-display); letter-spacing:-.01em;
  box-shadow:0 6px 18px -6px var(--acc);
  transition:transform .16s var(--ease), box-shadow .16s var(--ease),
             background .16s var(--ease), color .16s var(--ease), border-color .16s;
}
.btn:hover{ text-decoration:none; transform:translateY(-1px); background:var(--acc-d); box-shadow:var(--sh2); }
.btn:active{ transform:translateY(0) scale(.985); box-shadow:var(--sh1); }
.btn[disabled],.btn[aria-disabled="true"]{ opacity:.45; cursor:not-allowed; transform:none; }
.btn--ghost{
  background:var(--surface); color:var(--text); border-color:var(--line-2); box-shadow:var(--sh1);
}
.btn--ghost:hover{ background:var(--surface); border-color:var(--acc); color:var(--acc-d); }
:root[data-theme="dark"] .btn--ghost:hover{ color:var(--acc); }
.btn--soft{ background:var(--acc-soft); color:var(--acc-d); box-shadow:none; }
:root[data-theme="dark"] .btn--soft{ color:var(--acc); }
.btn--sm{ padding:.5em .85em; min-height:38px; font-size:.85em; border-radius:var(--r1); }
.btn--block{ width:100%; }

/* زر الأيقونة كما في شريط AMSU العلوي */
.iconbtn{
  width:42px; height:42px; display:grid; place-items:center; cursor:pointer;
  background:var(--surface); border:1px solid var(--line-2); border-radius:12px; color:var(--text-2);
  box-shadow:var(--sh1);
  transition:transform .16s var(--ease), background .16s;
}
.iconbtn:hover{ transform:translateY(-1px); color:var(--text); }
.iconbtn__ico{ font-size:1.05rem; line-height:1; }

.field{ display:block; margin-bottom:var(--s4); }
.field__label{ display:block; font-weight:600; font-size:.9rem; margin-bottom:var(--s2); color:var(--text-2); }
.input{
  width:100%; padding:var(--s3) var(--s4); min-height:48px;
  background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r2); color:var(--text);
  transition:border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.input:hover{ border-color:var(--text-3); }
.input:focus{ outline:none; border-color:var(--acc); box-shadow:var(--ring); }
.input::placeholder{ color:var(--text-3); }
.field__hint{ font-size:.82rem; color:var(--text-3); margin-top:var(--s1); }

/* شارة AMSU: حبّة بلون المحور الناعم */
.badge{
  display:inline-flex; align-items:center; gap:.35em; padding:.25em .7em; border-radius:var(--r-pill);
  font-size:.78em; font-weight:700; line-height:1.7;
  background:var(--acc-soft); color:var(--acc-d); border:1px solid transparent;
}
:root[data-theme="dark"] .badge{ color:var(--acc); }
.badge--ok{ background:var(--ok-soft); color:var(--ok); }
.badge--warn{ background:var(--warn-soft); color:var(--warn); }
.badge--bad{ background:var(--bad-soft); color:var(--bad); }

/* شريط تقدّم AMSU */
.prog{ height:7px; border-radius:99px; background:var(--line); overflow:hidden; }
.prog>i{ display:block; height:100%; border-radius:99px; background:var(--acc); transition:width .5s var(--ease); }

.empty{ text-align:center; padding:var(--s7) var(--s4); color:var(--text-2); }
.empty__ico{ font-size:2.2rem; line-height:1; display:block; margin-bottom:var(--s3); opacity:.7; }
.empty__title{ font-weight:700; color:var(--text); margin-bottom:var(--s2); }
.empty__text{ max-width:44ch; margin-inline:auto; font-size:.95rem; }

.page__head{ margin-bottom:var(--s5); }
.page__title{ margin-bottom:var(--s1); }
.page__sub{ color:var(--text-2); font-size:.95rem; margin:0; }

.stack{ display:flex; flex-direction:column; gap:var(--s4); }
.row{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
.spacer{ flex:1; }

/* تبويبات AMSU: حبوب — النشط ممتلئ بلون المحور بظل ملوّن */
.tabs{
  display:flex; gap:.3rem; margin-bottom:var(--s5); overflow-x:auto;
  scrollbar-width:none; padding:.5rem 0; border-bottom:1px solid var(--line);
}
.tabs::-webkit-scrollbar{ display:none; }
.tabs__btn{
  background:none; border:0; cursor:pointer; border-radius:11px;
  padding:.6em 1em; color:var(--text-2); font-weight:700; font-size:.9em;
  white-space:nowrap; min-height:42px;
  transition:color .2s, background .2s;
}
.tabs__btn:hover{ color:var(--text); background:var(--acc-soft); }
.tabs__btn[aria-selected="true"]{
  color:var(--on-acc); background:var(--acc); box-shadow:0 6px 16px -8px var(--acc);
}

.toast{
  position:fixed; inset-inline:0; bottom:calc(var(--tabbar-h) + var(--s4)); margin-inline:auto;
  width:max-content; max-width:88vw; z-index:60;
  background:var(--text); color:var(--bg); padding:.7em 1.2em; border-radius:var(--r-pill);
  font-size:.88em; font-weight:700;
  box-shadow:var(--sh3); opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity var(--t) var(--ease), transform var(--t) var(--ease);
}
.toast.is-on{ opacity:1; transform:translateY(0); }

.divider{ height:1px; background:var(--line); border:0; margin-block:var(--s5); }

.btn--danger{ background:var(--bad); color:var(--on-acc); border-color:var(--bad); box-shadow:0 6px 18px -8px var(--bad); }
.btn--danger:hover{ background:color-mix(in srgb, var(--bad) 80%, black); }

/* هيكل انتظار: يحجز مساحة المحتوى فلا تقفز الصفحة عند وصوله */
.skel{ display:block; background:var(--bg-soft); border-radius:var(--r1); }
.skel--line{ height:14px; width:70%; }
@media (prefers-reduced-motion: no-preference){
  .skel{ animation: skelPulse 1.4s var(--ease) infinite; }
  @keyframes skelPulse{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }
}


/* ===== 40-screens.css ===== */
/* تنسيقات الشاشات المركّبة: اللوحة، معالج الرفع، المادة، الاختبار — كلها من المتغيّرات */

/* أرقام اللوحة السريعة */
.stat{ text-align:center; padding:var(--s4); }
.stat__num{ display:block; font-size:1.6rem; font-weight:800; color:var(--brand); }
.stat__lbl{ font-size:.82rem; color:var(--text-2); }

/* صف قابل للضغط في الجداول */
.rowbtn{ width:100%; background:none; border:0; border-bottom:1px solid var(--line-soft);
  padding:var(--s3) var(--s1); cursor:pointer; text-align:start; min-height:44px; }
.rowbtn:hover{ background:var(--surface-2); }

.input--sm{ min-height:38px; padding:var(--s2) var(--s3); width:auto; }

/* خطوات المعالج */
.steps{ display:flex; gap:var(--s2); list-style:none; padding:0; margin:0 0 var(--s5);
  overflow-x:auto; }
.steps__item{ display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3);
  border-radius:var(--r-pill); border:1px solid var(--line); color:var(--text-3);
  font-size:.85rem; font-weight:600; white-space:nowrap; }
.steps__item.is-on{ background:var(--brand-soft); color:var(--brand); border-color:transparent; }
.steps__item.is-done{ color:var(--ok); }
.steps__num{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
  background:var(--surface-2); font-size:.75rem; font-weight:800; }
.is-on .steps__num{ background:var(--brand); color:var(--on-brand); }
.is-done .steps__num{ background:var(--ok-soft); color:var(--ok); }

/* منطقة الإسقاط */
.drop{ border:2px dashed var(--line); border-radius:var(--r3); padding:var(--s7) var(--s4);
  text-align:center; cursor:pointer; background:var(--surface); transition:border-color var(--t) var(--ease); }
.drop:hover,.drop.is-over{ border-color:var(--brand); }

/* شريط التقدّم «٨٠ من ٣٠٠» */
.meter{ height:10px; border-radius:var(--r-pill); background:var(--bg-soft); overflow:hidden; }
.meter__fill{ height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2));
  border-radius:inherit; transition:width var(--t) var(--ease); }

/* بطاقة السؤال وخياراته */
/* ═══ ورقة الامتحان ═══
   المرجع البصري هنا ليس تطبيقًا بل كرّاسة الامتحان التي جلس عليها كل طالب:
   خط هامش، ورقم السؤال في الهامش خارج كتلة النص، وخيارات بأحرف أ ب ج د،
   ومفتاح إجابة يعلّم الصحيح. الطالب يعرف هذه اللغة قبل أن يقرأ سطرًا. */
.qitem{
  position:relative;
  padding-inline-start:var(--s7);
  border-inline-start:2px solid var(--rule);
}
.qitem + .qitem{ margin-top:var(--s6); }
/* رقم السؤال في الهامش: يجعل الطالب يقول «سؤال ٤٧» لزميله بدل أن يصفه */
.qitem__n{
  position:absolute; inset-inline-start:0; top:2px;
  width:var(--s7); text-align:center;
  font-family:var(--font-num); font-size:.82rem; font-weight:700;
  color:var(--brand); opacity:.75;
}
.q__text{
  margin:0 0 var(--s4);
  max-width:var(--measure);
  font-size:var(--read-size); line-height:var(--read-lh); font-weight:500;
  white-space:pre-wrap; text-wrap:pretty;
}
.q__opts{ gap:var(--s2); max-width:var(--measure); }

/* الخيار: حرفه أولًا كما في كل ورقة امتحان، ثم نصّه */
.opt{
  display:flex; align-items:flex-start; gap:var(--s3); width:100%; text-align:start;
  padding:var(--s3) var(--s4); border-radius:var(--r2); min-height:44px;
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  line-height:1.8; transition:border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.opt:hover{ border-color:var(--brand); }
.opt__l{
  flex:0 0 auto; width:26px; height:26px; border-radius:50%;
  display:grid; place-items:center; margin-top:1px;
  font-family:var(--font-display); font-size:.8rem; font-weight:700;
  background:var(--bg-soft); color:var(--text-2); border:1px solid var(--line);
}
.opt__mark{ flex:0 0 auto; min-width:1.1em; font-weight:800; margin-inline-start:auto; }

/* مفتاح الإجابة: لون وأيقونة وحرف مملوء — ثلاث إشارات لا لون وحده */
.opt.is-answer{ background:var(--ok-soft); border-color:var(--ok); font-weight:600; }
.opt.is-answer .opt__l{ background:var(--ok); color:var(--on-brand); border-color:var(--ok); }
.opt.is-answer .opt__mark{ color:var(--ok); }
.opt.is-wrong{ background:var(--bad-soft); border-color:var(--bad); }
.opt.is-wrong .opt__l{ background:var(--bad); color:var(--on-brand); border-color:var(--bad); }
.opt.is-wrong .opt__mark{ color:var(--bad); }

/* وسم «الإجابة» — يُقرأ بلا لون ولا أيقونة */
.opt__tag{
  flex:0 0 auto; font-size:.7rem; font-weight:700; padding:2px 8px;
  border-radius:var(--r-pill); background:var(--ok); color:var(--on-brand);
}

/* ═══ بطاقة المادة — بطاقة AMSU حرفيًا ═══ */
.sub-card{
  position:relative; overflow:hidden; text-align:start; padding:0; border-radius:var(--r4);
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh2);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s;
  display:flex; flex-direction:column; width:100%; cursor:pointer;
}
.sub-card:hover{
  transform:translateY(-5px); box-shadow:var(--sh3);
  border-color:color-mix(in srgb, var(--acc) 40%, var(--line));
}
.sub-card .art{
  height:118px; position:relative; display:flex; align-items:center; justify-content:space-between;
  padding:0 18px; border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,
    color-mix(in srgb, var(--acc) 16%, var(--surface)),
    color-mix(in srgb, var(--acc) 4%, var(--surface)));
}
:root[data-theme="dark"] .sub-card .art{
  background:linear-gradient(135deg, color-mix(in srgb, var(--acc) 26%, var(--surface)), var(--surface));
}
.sub-card .art__ico{ font-size:3.2rem; line-height:1; color:var(--acc); opacity:.95; }
.sub-card .meta{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:.5rem; flex:1; }
.sub-card h3{ margin:0; font-size:1.12em; }
.sub-card .qn{ color:var(--text-2); font-size:.86em; }
.sub-card .foot{
  display:flex; align-items:center; justify-content:space-between; gap:.6rem;
  font-size:.79em; color:var(--text-3); margin-top:.15rem;
}
.sub-card .examline{
  display:flex; align-items:center; gap:.45em; flex-wrap:wrap; margin-top:.3rem;
  padding:.5em .7em; border-radius:11px; background:var(--acc-soft);
  font-size:.78em; line-height:1.5;
}
.sub-card .examline .when{ color:var(--text-2); }
.sub-card .examline b{
  margin-inline-start:auto; font-weight:800; color:var(--acc-d); font-variant-numeric:tabular-nums;
}
:root[data-theme="dark"] .sub-card .examline b{ color:var(--acc); }
.sub-card .examline b.urgent{ color:var(--bad); }
.sub-card .cta{
  display:inline-flex; align-items:center; gap:.35em;
  color:var(--acc); font-weight:800; font-size:1.05em;
}
:root[data-theme="light"] .sub-card .cta{ color:var(--acc-d); }
@keyframes urgentblink{ 0%,100%{opacity:1} 50%{opacity:.55} }
.urgent{ animation:urgentblink 2s ease-in-out infinite; }

/* ختم «تم الانتهاء» لمادة انقضى موعدها — كما في AMSU */
.stamp{
  display:block; position:absolute; z-index:6; top:50%; left:50%;
  transform:translate(-50%,-50%) rotate(-13deg);
  font-size:clamp(1.25rem,3.4vw,1.9rem); font-weight:900; letter-spacing:.02em; white-space:nowrap;
  color:var(--bad); border:4px double var(--bad); border-radius:14px;
  padding:.18em .7em; background:color-mix(in srgb, var(--bad) 12%, var(--surface));
  pointer-events:none; opacity:.92;
}
.sub-card.exam-done{ filter:grayscale(.75); opacity:.72; }
.sub-card.exam-done .art{ filter:saturate(.35); }
.sub-card.exam-done h3{ text-decoration:line-through; text-decoration-thickness:2px; color:var(--text-2); }
.sub-card.exam-done:hover{ filter:grayscale(.35); opacity:1; }

/* البطاقات المقلوبة ثلاثية الأبعاد لوضع الحفظ */
.flip{ perspective:900px; min-height:150px; cursor:pointer; }
.flip__in{ position:relative; width:100%; height:100%; min-height:150px;
  transform-style:preserve-3d; transition:transform .5s var(--ease); }
.flip.is-flipped .flip__in{ transform:rotateY(180deg); }
.flip__face{ position:absolute; inset:0; backface-visibility:hidden;
  display:flex; flex-direction:column; justify-content:center; gap:var(--s2);
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); padding:var(--s5); }
.flip__face--back{ transform:rotateY(180deg); background:var(--brand-soft); }

/* شاشة النتيجة */
.result__pct{ font-size:3rem; font-weight:800; color:var(--brand); }
.result__grade{ font-size:1.2rem; font-weight:700; }

/* عدّاد تنازلي وموقّت */
.timer{ font-weight:800; font-variant-numeric:tabular-nums; }
.timer.is-low{ color:var(--bad); }

/* أقسام مطوية */
.fold > summary{ cursor:pointer; font-weight:700; padding:var(--s3) 0; list-style:none; }
.fold > summary::before{ content:'◂'; display:inline-block; margin-inline-end:var(--s2);
  transition:transform var(--t) var(--ease); color:var(--text-3); }
.fold[open] > summary::before{ transform:rotate(-90deg); }

/* ═══ بطاقة المادة: سطر في خطة مقرّر ═══ */
.subj__id{ display:flex; flex-direction:column; gap:2px; min-width:0; }
/* رمز المقرر أولًا كما يُكتب في الجدول الدراسي — يعرفه الطالب قبل الاسم */
.subj__code{
  font-family:var(--font-num); font-size:.7rem; font-weight:700;
  color:var(--text-3); letter-spacing:.06em;
}
.subj__name{ margin:0; font-family:var(--font-display); font-size:1rem; line-height:1.45; }

.subj__facts{
  display:flex; align-items:baseline; gap:var(--s4); flex-wrap:wrap;
  margin:var(--s3) 0 var(--s2);
  font-size:.8rem; color:var(--text-2);
}
.subj__pct{ margin-inline-start:auto; font-weight:700; color:var(--brand); }

/* موعد الاختبار كموعد نهائي لا كوسم: الرقم يكبر لأنه ما يقرأه الطالب أولًا */
.deadline{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center;
  padding:var(--s2) var(--s3); border-radius:var(--r2);
  background:var(--warn-soft); border:1px solid var(--warn); line-height:1.1;
}
.deadline__n{ font-size:1.15rem; font-weight:800; color:var(--warn); }
.deadline__l{ font-size:.64rem; font-weight:700; color:var(--warn); }

/* ═══════════ قسم الجامعة ═══════════
   الشريط أعلى الشاشة الأولى: باب جامعة الطالب. صُمِّم كلوحة على مدخل
   مبنى — إطار عنّابي وأيقونة بيت — لا كبطاقة إعلان، لأنه انتماء لا عرض. */
.campus-band{
  display:flex; align-items:center; gap:var(--s4);
  padding:var(--s4) var(--s5); margin-bottom:var(--s4);
  background:var(--surface); border:1px solid var(--line);
  border-inline-start:4px solid var(--brand);
  border-radius:var(--r2); box-shadow:var(--sh1);
  color:inherit; text-decoration:none;
  transition:box-shadow var(--t) var(--ease), transform var(--t) var(--ease);
}
.campus-band:hover{ box-shadow:var(--sh2); transform:translateY(-1px); }
/* من لم يحدّد جامعته: حدّ متقطّع — دعوة لم تكتمل بعد، لا حالة نهائية */
.campus-band--ask{ border-style:dashed; border-inline-start-style:solid; background:var(--surface-2); }
.campus-band__ico{
  width:42px; height:42px; flex:0 0 42px; border-radius:var(--r2);
  display:grid; place-items:center; font-size:1.2rem;
  background:var(--brand-soft); color:var(--brand);
}
.campus-band__x{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.campus-band__t{ font-family:var(--font-display); font-weight:800; letter-spacing:-.01em; }
.campus-band__d{ font-size:.85rem; color:var(--text-3); line-height:1.7; }
.campus-band__go{ margin-inline-start:auto; color:var(--brand); font-weight:800; }

/* ترويسة القسم */
.uni-head{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s6);
  padding-bottom:var(--s4); border-bottom:2px solid var(--rule);
}
.uni-head__t{
  font-family:var(--font-display); font-size:clamp(1.3rem, 4vw, 1.8rem);
  margin:0 0 var(--s2); letter-spacing:-.025em;
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
}
.uni-head__s{ margin:0; color:var(--text-3); font-size:.9rem; }

/* عنوان الكلية: خط هامش الورقة يفصل مجموعة عن مجموعة بلا ثقل */
.uni-col{
  display:flex; align-items:center; gap:var(--s3);
  margin:var(--s7) 0 var(--s4); font-family:var(--font-display); font-size:1.05rem;
}
.uni-col::after{ content:''; flex:1; height:1px; background:var(--line); }
.uni-col__n{
  order:3; font-size:.78rem; color:var(--text-3);
  background:var(--surface-2); border:1px solid var(--line-soft);
  padding:1px var(--s3); border-radius:var(--r-pill);
}

/* منتقي الجامعة */
.campus-pick__row{ display:grid; gap:var(--s4); grid-template-columns:1fr; }
@media (min-width:720px){ .campus-pick__row{ grid-template-columns:repeat(3,1fr); } }
.campus-pick .field{ margin:0; }

/* ═══════════ الجودة والثقة ═══════════ */
.badge--star{ background:var(--gold-soft); color:var(--warn); border-color:var(--gold); }

/* نجوم التقييم: كبيرة بما يكفي للّمس بالإبهام على الجوال (٤٤ بكسل) */
.rate__stars{ display:flex; gap:var(--s1); margin-bottom:var(--s3); }
.rate__star{
  min-width:44px; height:44px; font-size:1.5rem; line-height:1;
  background:none; border:0; cursor:pointer; color:var(--text-3);
  transition:transform var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.rate__star:hover{ transform:scale(1.12); }
.rate__star.is-on{ color:var(--star); }

/* زر البلاغ: باهت حتى يُحتاج — لا نُغري بالإبلاغ، نُتيحه */
.qitem__flag{
  background:none; border:0; cursor:pointer; color:var(--text-3);
  font-size:.95rem; padding:var(--s1) var(--s2); border-radius:var(--r1);
  opacity:.55; transition:opacity var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.qitem__flag:hover, .qitem__flag:focus-visible{ opacity:1; color:var(--bad); }
.report{ margin-top:var(--s3); border-color:var(--warn); }

/* بطاقة البلاغ في طابور المشرف */
.rep{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s5); display:flex; flex-direction:column; gap:var(--s3);
}
.rep__head{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
.rep__subj{ font-weight:700; color:var(--brand); }
.rep__when{ margin-inline-start:auto; font-size:.78rem; color:var(--text-3); }
.rep__q{ background:var(--surface-2); border-radius:var(--r1); padding:var(--s4); }
.rep__qt{ margin:0 0 var(--s3); font-weight:600; line-height:1.8; }
.rep__opts{ margin:0; padding-inline-start:var(--s5); display:grid; gap:var(--s2); }
.rep__opts li{ display:flex; align-items:center; gap:var(--s2); font-size:.9rem; }
.rep__opts li.is-answer{ color:var(--ok); font-weight:700; }
.rep__note{ margin:0; color:var(--text-2); font-style:italic; }
.rep__act{ display:flex; flex-direction:column; gap:var(--s3); padding-top:var(--s3); border-top:1px solid var(--line-soft); }

/* تحذير المكرر */
.dupwarn{ border-color:var(--warn); background:var(--warn-soft); }
.dupwarn__row{
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  padding:var(--s3) var(--s4); background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r1); color:inherit; text-decoration:none;
}
.dupwarn__row:hover{ border-color:var(--brand); }
.dupwarn__n{ font-weight:700; }

/* ═══════════ المجتمع ═══════════ */
.brd{ display:flex; flex-direction:column; gap:var(--s2); }
.brd__row{
  display:flex; align-items:center; gap:var(--s3);
  padding:var(--s3) var(--s4);
  background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r1);
}
/* الثلاثة الأوائل بخلفية ذهبية خفيفة — تمييز يُرى بلمحة بلا صراخ */
.brd__row.is-top{ background:var(--gold-soft); border-color:var(--gold); }
/* صفّك أنت بإطار الهوية: تجده في اللوحة بلا قراءة الأسماء */
.brd__row.is-me{ border-inline-start:3px solid var(--brand); font-weight:700; }
.brd__row.is-mine-out{ margin-top:var(--s3); border-style:dashed; }
.brd__rank{ min-width:2.2em; text-align:center; font-weight:800; }
.brd__av{ font-size:1.1rem; }
.brd__name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.brd__pts{ font-size:.85rem; color:var(--text-2); }

/* نبض المادة: نقطة تتنفّس — حياة لا تنبيه */
.pulse{
  display:inline-flex; align-items:center; gap:var(--s2);
  padding:var(--s2) var(--s4); border-radius:var(--r-pill);
  background:var(--ok-soft); color:var(--ok); font-size:.85rem; font-weight:700;
}
.pulse__dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); }
@media (prefers-reduced-motion: no-preference){
  .pulse__dot{ animation:pulse-beat 2.4s var(--ease) infinite; }
}
@keyframes pulse-beat{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

/* رمز التحدّي: كبير متباعد — يُملى صوتًا في مجموعة الدفعة */
.chall__code{
  font-family:var(--font-num); font-size:2rem; font-weight:800;
  letter-spacing:.28em; color:var(--brand); margin:var(--s3) 0;
  text-align:center; background:var(--brand-soft);
  padding:var(--s4); border-radius:var(--r2); border:2px dashed var(--brand);
}
.chall__code--sm{
  font-size:.95rem; letter-spacing:.16em; padding:2px var(--s3);
  margin:0; border-width:1px; border-radius:var(--r1);
}

/* ═══════════ الدفع ═══════════
   بطاقة الباقة: الرقم أولًا وأكبر — الطالب يقارن الكوينز لا الأسعار،
   لأن السعر بلا معرفة ما يشتريه رقمٌ بلا معنى. */
.pack{
  display:flex; flex-direction:column; align-items:center; gap:var(--s1);
  padding:var(--s6) var(--s4); text-align:center; position:relative;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  box-shadow:var(--sh1);
}
.pack--best{ border-color:var(--brand); box-shadow:var(--sh2); }
.pack__tag{
  position:absolute; top:calc(var(--s3) * -1); inset-inline-start:50%;
  transform:translateX(50%); background:var(--brand); color:var(--on-brand);
  font-size:.72rem; font-weight:800; padding:2px var(--s4); border-radius:var(--r-pill);
}
.pack__n{ font-family:var(--font-num); font-size:2.1rem; font-weight:800; color:var(--brand); line-height:1.1; }
.pack__u{ font-size:.8rem; color:var(--text-3); font-weight:700; }
/* ★ «≈ ٣٠٠ سؤالًا» هو ما يفهمه الطالب — الكوين وحدة داخلية لا قيمة */
.pack__q{ font-size:.82rem; color:var(--text-2); margin:var(--s2) 0; }
.pack__p{ font-family:var(--font-num); font-weight:700; margin-bottom:var(--s3); }

.payrow{
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  padding:var(--s3) var(--s4); background:var(--surface-2);
  border:1px solid var(--line-soft); border-radius:var(--r1);
}
.payrow__t{ font-weight:700; flex:1; min-width:0; }
.payrow__d{ font-size:.78rem; color:var(--text-3); }

/* شريط مالك المادة — تمييزٌ هادئ لا تنبيه: هذه حالة طيّبة لا تحذير */
.ownerband{
  border-color: color-mix(in srgb, var(--brand) 30%, var(--line));
  background: color-mix(in srgb, var(--brand) 6%, var(--surface));
  display:grid; gap:.25rem;
}

/* ═══ التحليل الشامل — HTML مولَّد يخضع لنظام التصميم ═══ */
/* الوسوم تصل عارية من كل سمة (عقّمناها مرتين) — فالمظهر كله من هنا،
   وبمتغيرات النظام حصرًا: التحليل يرث هوية المنصة لا يجلب هويته معه */
/* أسلوب prose في AMSU: عناوين بلون المادة، جداول بزوايا وترويسة ملوّنة ناعمة */
.analysis{ line-height:1.9; }
.analysis p{ margin:0 0 .6em; }
.analysis h3{ margin:1.4em 0 .35em; font-size:1.1em; color:var(--acc-d); }
:root[data-theme="dark"] .analysis h3{ color:var(--acc); }
.analysis h3:first-child{ margin-top:0; }
.analysis h4{ margin:1.1em 0 .3em; font-size:.98em; }
.analysis ul{ margin:.5em 0 1em; padding-inline-start:1.25em; }
.analysis li{ margin-bottom:.4em; }
.analysis strong{ color:var(--text); font-weight:800; }
.analysis table{
  width:100%; border-collapse:separate; border-spacing:0; margin:.7em 0 1.3em;
  font-size:.88em; overflow-wrap:anywhere;
  border:1px solid var(--line); border-radius:var(--r2); overflow:hidden;
}
.analysis th, .analysis td{ padding:.6em .8em; text-align:start; vertical-align:top; }
.analysis td{ border-top:1px solid var(--line); }
.analysis thead th{ background:var(--acc-soft); color:var(--acc-d); font-weight:800; font-size:.95em; }
:root[data-theme="dark"] .analysis thead th{ color:var(--acc); }
.analysis tbody tr:nth-child(even){ background:var(--surface-2); }
.analysis section + section{ margin-top:1.6em; }

/* عدّاد الاختبار — كل طالب وموعده */
.exambar{ margin:0; }
.exambar__t{
  font-weight:800; font-variant-numeric:tabular-nums;
  color:var(--acc); font-size:1.05rem;
}

/* ═══ رأس المادة — sub-hero من AMSU حرفيًا ═══
   يهرب من قيد .wrap إلى حافتي الشاشة (هامش سالب بنصف الفارق)،
   ثم يعيد .wrap الداخلي توسيط محتواه. */
.sub-hero{
  position:relative; overflow:hidden;
  margin-inline:calc(50% - 50vw);
  margin-top:calc(var(--s5) * -1);            /* يلتصق بالشريط العلوي كما في AMSU */
  border-radius:0 0 var(--r4) var(--r4);
  background:linear-gradient(135deg,
    color-mix(in srgb, var(--acc) 92%, black),
    color-mix(in srgb, var(--acc) 62%, rgb(17,17,17)));
  color:var(--on-acc);
  padding:clamp(20px,4vw,34px) 0 clamp(22px,4vw,30px);
  margin-bottom:var(--s4);
}
.sub-hero .herotop{ display:flex; align-items:center; justify-content:space-between; gap:.6rem; }
.sub-hero .topacts{ display:flex; gap:.4rem; flex-wrap:wrap; justify-content:flex-end; }
.copybtn{
  display:inline-flex; align-items:center; gap:.4em; color:var(--on-acc); font-size:.8em; font-weight:700;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28); cursor:pointer;
  padding:.45em .85em; border-radius:var(--r-pill); margin-bottom:.9rem; transition:all .2s var(--ease);
}
.copybtn:hover{ background:var(--surface); color:var(--acc-d); transform:translateY(-1px); }
.backbtn{
  display:inline-flex; align-items:center; gap:.4em; color:var(--on-acc); opacity:.9;
  font-size:.85em; font-weight:700; margin-bottom:.9rem;
}
.backbtn:hover{ opacity:1; text-decoration:none; }
.sub-hero .inner{ position:relative; display:flex; align-items:center; gap:clamp(12px,3vw,26px); }
.sub-hero .figwrap{
  width:clamp(64px,15vw,104px); height:clamp(64px,15vw,104px); flex:none; border-radius:22px;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.24);
  display:grid; place-items:center; backdrop-filter:blur(6px);
}
.sub-hero .fig{ font-size:clamp(2rem,7vw,3.4rem); line-height:1; }
.sub-hero .hx{ min-width:0; }
.sub-hero h2{ margin:0 0 .25em; font-size:clamp(1.15rem,4.2vw,1.85rem); letter-spacing:-.03em; color:var(--on-acc); }
.sub-hero .sub{ opacity:.85; font-size:.85em; }
.sub-hero .stats{ display:flex; flex-wrap:wrap; gap:.4rem .55rem; margin-top:.7rem; }
.sub-hero .stat{
  background:rgba(255,255,255,.16); border-radius:var(--r-pill);
  padding:.2em .75em; font-size:.76em; font-weight:700;
}
.hero-exam{
  margin-inline-start:auto; flex:none; display:inline-flex; align-items:center; gap:.6em;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); color:var(--on-acc);
  padding:.7em 1.1em; border-radius:16px; font-weight:800; font-size:.92em; backdrop-filter:blur(6px);
  transition:transform .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
  box-shadow:0 6px 20px -10px rgba(0,0,0,.6);
}
.hero-exam:hover{
  background:var(--surface); color:var(--acc-d); transform:translateY(-2px);
  text-decoration:none; box-shadow:0 12px 28px -12px rgba(0,0,0,.55);
}
.hero-exam span{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.25; }
.hero-exam small{ font-weight:600; opacity:.8; font-size:.78em; }
@media (max-width:720px){
  .sub-hero .inner{ flex-wrap:wrap; }
  .hero-exam{ margin-inline-start:0; width:100%; justify-content:center; margin-top:.9rem; }
}


/* ===== 50-landing.css ===== */
/*
  صفحة الهبوط التعريفية — أول ما يراه الزائر قبل التسجيل.
  هوية «مراجعة — بنك الأسئلة»: ورق دافئ، عنّابي وذهبي، وحواف كتاب.
  البنية: بطل ← كيف تعمل ← جرّب سؤالًا ← بطاقة حفظ ← مزايا ← ارفع مادتك ← نصائح ← أسعار ← دعوة.
  ولا مادة بعينها هنا: المقررات تختلف بين الجامعات، ومكانها شاشة «استكشف».
*/

.lp{ margin-inline:calc(var(--s4) * -1); }

/* ===== البطل: صفحة كتاب مفتوح =====
   التوقيع البصري للمنصة. الرفّ صورة لفكرة «بنك الأسئلة» لا عرضٌ لمخزون —
   أوزان كعوبه ثابتة كي تبقى الصورة واحدة لكل زائر ولا تُقرأ كإحصاء. */
.lp-hero{
  position:relative; overflow:hidden;
  padding:var(--s8) var(--s4) var(--s7);
  text-align:center;
  background:
    radial-gradient(900px 300px at 50% 0%, var(--brand-soft), transparent 68%),
    var(--bg);
}
/* سطور دفتر — أفقية فقط لا شبكة، لأن الورق هنا للكتابة لا للرسم البياني */
.lp-hero::before{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.55;
  background-image:linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px);
  background-size:100% 30px;
  mask-image:radial-gradient(680px 320px at 50% 0%, black 18%, transparent 76%);
  -webkit-mask-image:radial-gradient(680px 320px at 50% 0%, black 18%, transparent 76%);
}
.lp-hero > *{ position:relative; }

.lp-hero__badge{
  display:inline-flex; align-items:center; gap:var(--s2);
  padding:var(--s2) var(--s4); border-radius:var(--r-pill);
  background:var(--surface); border:1px solid var(--line);
  font-size:.8rem; font-weight:700; color:var(--brand);
  box-shadow:var(--sh1); margin-bottom:var(--s5);
}
/* النقطة الذهبية: ختم صغير على الغلاف — تتنفّس بهدوء لا تنبض كقلب */
.lp-hero__badge .dot{
  width:7px; height:7px; border-radius:50%; background:var(--gold);
  animation:lp-glow 3.2s var(--ease) infinite;
}
@keyframes lp-glow{
  0%,100%{ opacity:1; }
  50%{ opacity:.45; }
}

.lp-hero__title{
  font-family:var(--font-display);
  font-size:clamp(2rem, 6.4vw, 3.3rem); line-height:1.3; font-weight:800;
  margin:0 0 var(--s4); letter-spacing:-.03em;
}
.lp-hero__title em{ font-style:normal; color:var(--brand); }
.lp-hero__sub{
  max-width:54ch; margin:0 auto var(--s4);
  font-size:clamp(1rem, 2.4vw, 1.12rem); color:var(--text-2); line-height:1.95;
}
/*
  سطر التوقّع: «كل جامعة موادها تخصّها».
  أخفتُ نبرةً من الملخّص وبخطّ هامش عنّابي — كملاحظة على حاشية الورقة لا
  كادّعاء إضافي. موضعه قبل الأزرار مقصود: يقرؤه الزائر قبل أن يقرّر أيّهما
  يضغط، فيذهب إلى «استكشف» وهو يعرف أنه يبحث عن جامعته هو.
*/
.lp-hero__note{
  max-width:52ch; margin:0 auto var(--s6);
  padding-inline-start:var(--s3);
  border-inline-start:2px solid var(--rule);
  font-size:.94rem; color:var(--text-3); line-height:1.85; text-align:start;
}

/* الرفّ: الكتب تصعد واحدًا بعد آخر عند الفتح ثم تسكن */
.lp-shelf{ width:100%; max-width:640px; margin:var(--s6) auto 0; display:block; height:116px; }
.lp-shelf__plank{ fill:var(--text-3); opacity:.5; }
.lp-shelf__book{ transform-origin:center bottom; }
@media (prefers-reduced-motion: no-preference){
  .lp-shelf__book{ animation:lp-rise .5s var(--ease) backwards; animation-delay:var(--d, 0ms); }
}
@keyframes lp-rise{
  from{ transform:scaleY(.05); opacity:0; }
  to{ transform:scaleY(1); opacity:1; }
}
/*
  كان سطر فتح هذه الكتلة مفقودًا، فطُبِّق animation:none على كل زائر
  وتوقّفت النقطة الذهبية عن التنفّس عند الجميع لا عند من طلب تقليل الحركة.
*/
@media (prefers-reduced-motion: reduce){
  .lp-shelf__book{ animation:none; }
  .lp-hero__badge .dot{ animation:none; }
}

.lp-cta{ display:flex; gap:var(--s3); justify-content:center; flex-wrap:wrap; }
.lp-cta .btn{ padding:var(--s4) var(--s7); font-size:1.02rem; }
.btn--lg{ min-height:54px; }

/* ===== أقسام عامة ===== */
.lp-sec{ max-width:var(--wrap); margin-inline:auto; padding:var(--s8) var(--s4); }
/* فاصل رفيع بين الأقسام يوحّد الإيقاع بلا خطوط ثقيلة */
.lp-sec + .lp-sec{ border-top:1px solid var(--line-soft); }
.lp-sec__head{ text-align:center; margin-bottom:var(--s7); }
.lp-sec__kicker{
  display:inline-block; font-size:.76rem; font-weight:800; letter-spacing:.06em;
  color:var(--brand); background:var(--brand-soft);
  padding:var(--s1) var(--s4); border-radius:var(--r-pill); margin-bottom:var(--s4);
}
.lp-sec__title{
  font-family:var(--font-display);
  font-size:clamp(1.45rem, 4vw, 2.05rem); margin:0 0 var(--s3);
  font-weight:800; letter-spacing:-.025em;
}
.lp-sec__sub{ color:var(--text-2); max-width:52ch; margin-inline:auto; }

/* ===== شبكة البطاقات (المزايا) ===== */
.lp-grid{ display:grid; gap:var(--s4); grid-template-columns:1fr; }
@media (min-width:640px){ .lp-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width:960px){ .lp-grid--3{ grid-template-columns:repeat(3,1fr); } }

.lp-card{
  position:relative; overflow:hidden;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  padding:var(--s5); box-shadow:var(--sh1);
  transition:transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
  display:flex; flex-direction:column; gap:var(--s3);
}
.lp-card:hover{ transform:translateY(-2px); box-shadow:var(--sh2); border-color:var(--line); }
.lp-card__top{ height:4px; position:absolute; inset-inline:0; top:0; }
.lp-card__ico{
  width:54px; height:54px; border-radius:var(--r2); display:grid; place-items:center;
  font-size:1.5rem; background:var(--brand-soft);
}
.lp-card__title{ font-family:var(--font-display); font-size:1.05rem; font-weight:800; margin:0; letter-spacing:-.015em; }
.lp-card__text{ color:var(--text-2); font-size:.92rem; margin:0; line-height:1.85; }
.lp-card__meta{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:auto; padding-top:var(--s2); }

/* ===== نموذجا المادة =====
   ختم «نموذج» ظاهر في أعلى البطاقة لا في هامشها: الزائر يقرأ البطاقات
   قبل السطر الذي تحتها، فلو خفي الختم لحسبهما مادّتين معروضتين للبيع. */
.lp-card--sample{ padding-top:var(--s6); }
.lp-card__row{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); }
.lp-card__stamp{
  background:var(--gold-soft); color:var(--warn);
  border:1px dashed var(--gold); font-weight:800; letter-spacing:.04em;
}
.lp-card__tag{
  align-self:flex-start; font-size:.76rem; font-weight:800; color:var(--brand);
  background:var(--brand-soft); padding:2px var(--s3); border-radius:var(--r-pill);
}
/* المحاور: ما يجده الطالب داخل المادة — بديل عن عدد أسئلة لا وجود له */
.lp-topics{
  display:flex; flex-wrap:wrap; gap:var(--s2);
  margin-top:auto; padding-top:var(--s3); border-top:1px dashed var(--line);
}
.lp-topic{
  font-size:.8rem; color:var(--text-2); background:var(--surface-2);
  border:1px solid var(--line-soft); padding:2px var(--s3); border-radius:var(--r1);
}
/* سطر التنبيه أسفل النموذجين */
.lp-note{
  max-width:56ch; margin:var(--s5) auto 0; text-align:center;
  font-size:.88rem; color:var(--text-3); line-height:1.85;
}
.lp-note a{ color:var(--brand); font-weight:700; }

/* ===== الخطوات ===== */
.lp-steps{ display:grid; gap:var(--s5); grid-template-columns:1fr; counter-reset:step; }
@media (min-width:820px){ .lp-steps{ grid-template-columns:repeat(4,1fr); } }
.lp-step{ text-align:center; }
.lp-step__n{
  width:48px; height:48px; margin:0 auto var(--s3); border-radius:50%;
  display:grid; place-items:center; font-weight:700; font-size:1.05rem;
  font-family:var(--font-num);
  background:var(--brand); color:var(--on-brand);
  /* الظل من لون الهوية نفسه — كان أخضر طبيًّا ثابتًا وبقي بعد تحوّلها للعنّابي */
  box-shadow:0 4px 14px color-mix(in srgb, var(--brand) 34%, transparent);
}
.lp-step__t{ font-weight:800; margin-bottom:var(--s1); }
.lp-step__d{ color:var(--text-2); font-size:.9rem; margin:0; }

/* ===== الأسعار ===== */
.lp-price{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r4);
  padding:var(--s6); box-shadow:var(--sh1); display:flex; flex-direction:column; gap:var(--s3);
}
.lp-price--hot{ border-color:var(--brand); box-shadow:var(--sh2); position:relative; }
.lp-price--hot::before{
  content:'الأكثر اختيارًا'; position:absolute; top:calc(var(--s4) * -1); inset-inline-start:50%;
  transform:translateX(50%); background:var(--brand); color:var(--on-brand);
  font-size:.75rem; font-weight:800; padding:var(--s1) var(--s4); border-radius:var(--r-pill);
}
.lp-price__n{ font-family:var(--font-display); font-size:1.08rem; font-weight:800; }
.lp-price__v{ font-family:var(--font-num); font-size:1.9rem; font-weight:700; color:var(--brand); letter-spacing:-.02em; }
.lp-price__v small{ font-size:.85rem; color:var(--text-3); font-weight:600; }
.lp-price ul{ list-style:none; padding:0; margin:0; display:grid; gap:var(--s2); }
.lp-price li{ display:flex; gap:var(--s2); align-items:flex-start; font-size:.92rem; color:var(--text-2); }
.lp-price li::before{ content:'✓'; color:var(--ok); font-weight:800; }

/* ===== الدعوة الأخيرة ===== */
.lp-final{
  max-width:var(--wrap); margin:var(--s7) auto var(--s8); padding:var(--s8) var(--s5);
  text-align:center; border-radius:var(--r4);
  background:linear-gradient(145deg, var(--brand), var(--brand-2));
  color:var(--on-brand); box-shadow:var(--sh3);
  position:relative; overflow:hidden;
}
/* شبكة تخطيط باهتة تربط الختام بالبطل */
.lp-final::before{
  content:''; position:absolute; inset:0; opacity:.13; pointer-events:none;
  background-image:
    linear-gradient(to left, white 1px, transparent 1px),
    linear-gradient(to bottom, white 1px, transparent 1px);
  background-size:26px 26px;
}
.lp-final > *{ position:relative; }
.lp-final h2{ font-family:var(--font-display); color:inherit; font-size:clamp(1.35rem, 4vw, 1.95rem); margin-bottom:var(--s3); letter-spacing:-.025em; }
.lp-final p{ opacity:.92; max-width:48ch; margin:0 auto var(--s5); }
.lp-final .btn{ background:var(--surface); color:var(--brand); }

/* الطباعة لا تعني صفحة الهبوط */
@media print{ .lp{ display:none; } }


/* ===== السؤال التجريبي ===== */
.lp-try{
  max-width:760px; margin-inline:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r4);
  padding:var(--s6); box-shadow:var(--sh2);
}
.lp-try__q{ font-weight:600; margin:0 0 var(--s5); font-size:1.06rem; line-height:1.75; }
.lp-try__opts{ display:grid; gap:var(--s2); margin-bottom:var(--s4); }
.lp-try__fb{
  border-radius:var(--r2); padding:var(--s4); font-size:.93rem; line-height:1.9;
  border:1px solid var(--line); background:var(--surface-2);
}
.lp-try__fb.is-ok{ background:var(--ok-soft); border-color:var(--ok); }
.lp-try__fb.is-no{ background:var(--bad-soft); border-color:var(--bad); }
.lp-try__fb b{ display:block; margin-bottom:var(--s1); }

/* ===== بطاقة الحفظ الحيّة ===== */
.lp-memo{
  max-width:520px; margin-inline:auto; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  padding:var(--s6); box-shadow:var(--sh1); text-align:center; min-height:180px;
  display:flex; flex-direction:column; justify-content:center; gap:var(--s3);
  transition:box-shadow var(--t) var(--ease);
}
.lp-memo:hover{ box-shadow:var(--sh2); }
.lp-memo__hint{ font-size:.8rem; color:var(--text-3); }
.lp-memo__chain{ display:flex; align-items:center; justify-content:center; gap:var(--s3); flex-wrap:wrap; }
.lp-memo__k{ font-weight:700; color:var(--brand); font-size:1.08rem; }

/* ===== نصائح المراجعة ===== */
.lp-tip{ display:flex; gap:var(--s4); align-items:flex-start; }
.lp-tip__i{
  min-width:44px; height:44px; border-radius:var(--r2); display:grid; place-items:center;
  background:var(--brand-soft); color:var(--brand); font-size:1.2rem;
}
.lp-tip__t{ font-weight:800; margin:0 0 var(--s1); }
.lp-tip__d{ color:var(--text-2); font-size:.9rem; margin:0; line-height:1.85; }

/* ===== الأسئلة الشائعة ===== */
.lp-faq{ max-width:760px; margin-inline:auto; display:grid; gap:var(--s2); }
.lp-faq details{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s4) var(--s5);
}
.lp-faq summary{
  cursor:pointer; font-weight:700; list-style:none; font-family:var(--font-display);
  letter-spacing:-.01em;
  display:flex; align-items:center; gap:var(--s3);
}
.lp-faq summary::-webkit-details-marker{ display:none; }
.lp-faq summary::before{
  content:'+'; color:var(--brand); font-weight:800; font-size:1.2rem; line-height:1;
  transition:transform var(--t) var(--ease);
}
.lp-faq details[open] summary::before{ content:'−'; }
.lp-faq p{ color:var(--text-2); font-size:.92rem; margin:var(--s3) 0 0; padding-inline-start:calc(var(--s3) + 1ch); }

/* بطاقتا «أنت تبنيها»: حدّ متقطّع — مكان شاغر ينتظر من يملؤه لا محتوى جاهز */
.lp-add{ border-style:dashed; border-color:var(--brand); background:var(--brand-soft); }
.lp-add .lp-card__ico{ background:var(--surface); color:var(--brand); font-size:1.35rem; }
.lp-card__text--dim{ color:var(--text-3); font-size:.86rem; }


/* ===== 60-admin.css ===== */
/* لوحة تحكم المشرف — كثافة معلومات عالية بلا فوضى بصرية */

/* ===== شبكة المؤشرات ===== */
.ad-kpis{ display:grid; gap:var(--s3); grid-template-columns:repeat(2,1fr); }
@media (min-width:700px){ .ad-kpis{ grid-template-columns:repeat(3,1fr); } }
@media (min-width:1000px){ .ad-kpis{ grid-template-columns:repeat(6,1fr); } }
.ad-kpi{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s4); box-shadow:var(--sh1); position:relative; overflow:hidden;
}
.ad-kpi__n{
  display:block; font-family:var(--font-num); font-size:1.6rem; font-weight:700;
  line-height:1.15; color:var(--text); letter-spacing:-.02em;
}
.ad-kpi__l{ font-size:.76rem; color:var(--text-3); font-weight:700; }
.ad-kpi__s{ font-size:.7rem; color:var(--text-3); margin-top:var(--s1); display:block; }
.ad-kpi--live .ad-kpi__n{ color:var(--brand); }
.ad-kpi--warn .ad-kpi__n{ color:var(--warn); }
.ad-kpi--bad .ad-kpi__n{ color:var(--bad); }

/* ===== لوحات الرسوم ===== */
.ad-panels{ display:grid; gap:var(--s4); grid-template-columns:1fr; margin-top:var(--s5); }
@media (min-width:900px){ .ad-panels--2{ grid-template-columns:1.6fr 1fr; } }
.ad-panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  padding:var(--s5); box-shadow:var(--sh1);
}
.ad-panel__h{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); margin-bottom:var(--s5); }
.ad-panel__t{ font-family:var(--font-display); font-weight:800; font-size:1rem; margin:0; }
.ad-panel__s{ font-size:.78rem; color:var(--text-3); }

/* رسم الأعمدة — SVG يدوي بلا مكتبات */
.ad-chart{ width:100%; height:170px; display:block; overflow:visible; }
.ad-chart .bar{ fill:var(--brand); opacity:.85; transition:opacity var(--t) var(--ease); }
.ad-chart .bar:hover{ opacity:1; }
.ad-chart .bar--empty{ fill:var(--line); opacity:.6; }
.ad-chart .grid{ stroke:var(--line-soft); stroke-width:1; }
.ad-chart .lbl{ fill:var(--text-3); font-size:9px; font-family:var(--font-num); }
.ad-chart .line{ fill:none; stroke:var(--warn); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.ad-chart .dot{ fill:var(--warn); }

/* شرائح النتائج */
.ad-bucket{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s3); }
.ad-bucket__l{ min-width:66px; font-family:var(--font-num); font-size:.8rem; color:var(--text-2); }
.ad-bucket__t{ flex:1; height:12px; border-radius:var(--r-pill); background:var(--bg-soft); overflow:hidden; }
.ad-bucket__f{ height:100%; border-radius:inherit; transition:width var(--t-slow) var(--ease); }
.ad-bucket__n{ min-width:34px; text-align:end; font-family:var(--font-num); font-size:.82rem; color:var(--text-2); }

/* جدول عام */
.ad-table{ width:100%; overflow-x:auto; }
.ad-row{
  display:flex; align-items:center; gap:var(--s3); width:100%;
  padding:var(--s3) var(--s2); border-bottom:1px solid var(--line-soft);
  background:none; border-inline:0; border-top:0; text-align:start; cursor:pointer;
  min-height:52px; color:inherit; transition:background var(--t-fast) var(--ease);
}
.ad-row:hover{ background:var(--surface-2); }
.ad-row:last-child{ border-bottom:0; }
.ad-row__main{ flex:1; min-width:0; }
.ad-row__t{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ad-row__s{ font-size:.78rem; color:var(--text-3); }

/* نشاط أخير */
.ad-feed{ display:grid; gap:var(--s2); }
.ad-feed__i{ display:flex; align-items:center; gap:var(--s3); font-size:.88rem; padding:var(--s2) 0; border-bottom:1px solid var(--line-soft); }
.ad-feed__i:last-child{ border-bottom:0; }
.ad-feed__av{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); }
.ad-feed__x{ flex:1; min-width:0; }
.ad-feed__t{ font-size:.72rem; color:var(--text-3); font-family:var(--font-num); }

/* ===== محرر المادة ===== */
.ad-edit{ display:grid; gap:var(--s4); }
@media (min-width:760px){ .ad-edit--2{ grid-template-columns:1fr 1fr; } }
.ad-swatches{ display:flex; gap:var(--s2); flex-wrap:wrap; }
.ad-sw{
  width:34px; height:34px; border-radius:var(--r1); cursor:pointer;
  border:2px solid transparent; box-shadow:var(--sh1);
}
.ad-sw[aria-checked="true"]{ border-color:var(--text); transform:scale(1.08); }
.ad-icons{ display:flex; gap:var(--s2); flex-wrap:wrap; }
.ad-ico{
  width:38px; height:38px; border-radius:var(--r1); display:grid; place-items:center;
  background:var(--surface-2); border:2px solid transparent; cursor:pointer; font-size:1.1rem;
}
.ad-ico[aria-checked="true"]{ border-color:var(--brand); background:var(--brand-soft); }

/* ===== متصفح الأسئلة ===== */
.ad-q{ border:1px solid var(--line); border-radius:var(--r2); padding:var(--s4); background:var(--surface); }
.ad-q + .ad-q{ margin-top:var(--s3); }
.ad-q__head{ display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s3); }
.ad-q__text{ font-weight:600; margin:0 0 var(--s3); white-space:pre-wrap; }
.ad-q__opt{
  display:flex; gap:var(--s2); align-items:flex-start; width:100%; text-align:start;
  padding:var(--s2) var(--s3); border-radius:var(--r1); border:1px solid var(--line);
  background:var(--surface-2); cursor:pointer; margin-bottom:var(--s2); min-height:38px;
}
.ad-q__opt.is-a{ background:var(--ok-soft); border-color:var(--ok); font-weight:700; }
.ad-q__opt:hover{ border-color:var(--brand); }

/* ===== منطقة الخطر ===== */
.ad-danger{ border-color:var(--bad); }
.ad-danger .ad-panel__t{ color:var(--bad); }

/* شريط أدوات */
.ad-bar{ display:flex; gap:var(--s2); flex-wrap:wrap; align-items:center; margin-bottom:var(--s4); }
.ad-bar .input{ width:auto; flex:1; min-width:180px; }

/* ===== شريط التجربة ===== */
.trialbar{
  display:flex; align-items:center; gap:var(--s3);
  padding:var(--s3) var(--s4); border-radius:var(--r2);
  background:var(--brand-soft); border:1px solid var(--brand);
  margin-bottom:var(--s4); flex-wrap:wrap;
}
.trialbar__ico{ font-size:1.1rem; color:var(--brand); }
.trialbar__t{ font-weight:700; font-size:.9rem; color:var(--brand); font-family:var(--font-num); }
.trialbar__m{ flex:1; min-width:90px; height:8px; border-radius:var(--r-pill); background:var(--surface); overflow:hidden; }
.trialbar__f{ display:block; height:100%; background:var(--brand); border-radius:inherit; transition:width 1s linear; }
.trialbar.is-low{ background:var(--bad-soft); border-color:var(--bad); }
.trialbar.is-low .trialbar__t,
.trialbar.is-low .trialbar__ico{ color:var(--bad); }
.trialbar.is-low .trialbar__f{ background:var(--bad); }
@media (prefers-reduced-motion: reduce){ .trialbar__f{ transition:none; } }

/* ===== المحفظة ===== */
.wallet{
  display:grid; gap:var(--s3); grid-template-columns:repeat(3,1fr);
  padding:var(--s4); border-radius:var(--r3);
  background:var(--brand-soft); border:1px solid var(--brand); text-align:center;
}
.wallet__n{ display:block; font-family:var(--font-num); font-size:1.5rem; font-weight:700; color:var(--brand); }
.wallet__l{ font-size:.74rem; color:var(--text-2); font-weight:700; }
.sharebox{ display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; }
.sharebox .input{ flex:1; min-width:180px; font-family:var(--font-num); font-size:.82rem; }

/* وسم نمط المعالجة */
.modetag{ font-size:.7rem; padding:2px 8px; border-radius:var(--r-pill); font-weight:700; }
.modetag--strict{ background:var(--ok-soft); color:var(--ok); }
.modetag--enhanced{ background:var(--warn-soft); color:var(--warn); }

/* بطاقة اختيار نمط المعالجة */
.modecard{ text-align:start; cursor:pointer; border:2px solid var(--line); display:block; width:100%; }
.modecard[aria-checked="true"]{ border-color:var(--brand); background:var(--brand-soft); }
.modecard__t{ display:block; font-weight:800; margin-bottom:var(--s1); }
.modecard__t::before{ content:'○ '; color:var(--text-3); }
.modecard[aria-checked="true"] .modecard__t::before{ content:'● '; color:var(--brand); }
.modecard__d{ display:block; font-size:.82rem; color:var(--text-2); line-height:1.6; }

/* ===== دعوة رفع مادة ===== */
.upsell{
  display:flex; align-items:center; gap:var(--s4);
  padding:var(--s4) var(--s5); border-radius:var(--r3);
  background:var(--gold-soft); border:1px solid var(--gold);
  color:var(--text); margin-bottom:var(--s5);
  transition:transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.upsell:hover{ text-decoration:none; transform:translateY(-1px); box-shadow:var(--sh2); }
.upsell__ico{
  width:42px; height:42px; flex:0 0 auto; border-radius:var(--r2);
  display:grid; place-items:center; font-size:1.3rem;
  background:var(--surface); color:var(--brand); box-shadow:var(--sh1);
}
.upsell__x{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.upsell__t{ font-weight:800; font-family:var(--font-display); }
.upsell__d{ font-size:.84rem; color:var(--text-2); line-height:1.7; }
.upsell__go{ flex:0 0 auto; color:var(--brand); font-size:1.2rem; }
@media (max-width:420px){
  .upsell{ padding:var(--s4); gap:var(--s3); }
  .upsell__go{ display:none; }          /* على الجوال البطاقة كلها قابلة للضغط، فالسهم زخرفة */
}

/* ═══ شاشة الاستكشاف ═══ */
.ex-bar{ display:flex; gap:var(--s3); margin-bottom:var(--s4); flex-wrap:wrap; }
.ex-bar .input[type="search"]{ flex:1; min-width:200px; }
.ex-bar select{ width:auto; min-width:150px; }

.ex-filters{ display:grid; gap:var(--s3); margin-bottom:var(--s4); }
.ex-frow{ display:flex; align-items:flex-start; gap:var(--s3); }
.ex-flabel{ flex:0 0 auto; font-size:.78rem; font-weight:700; color:var(--text-3); padding-top:7px; min-width:48px; }
/* تمرير أفقي للشرائح وحدها — الصفحة نفسها لا تتزحزح على ٣٦٠ بكسل */
.ex-chips{ flex:1; min-width:0; display:flex; gap:var(--s2); overflow-x:auto; padding-bottom:var(--s1); scrollbar-width:thin; }
.chip{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:var(--s2);
  padding:var(--s2) var(--s3); border-radius:var(--r-pill); min-height:34px;
  background:var(--surface); border:1px solid var(--line); color:var(--text-2);
  font-size:.82rem; font-weight:600; cursor:pointer; white-space:nowrap;
}
.chip:hover{ border-color:var(--brand); color:var(--brand); }
.chip.is-on{ background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
.chip__n{ font-size:.72rem; opacity:.7; }

.ex-grid{ display:grid; gap:var(--s4); grid-template-columns:1fr; }
@media (min-width:600px){ .ex-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width:960px){ .ex-grid{ grid-template-columns:repeat(3,1fr); } }

.excard{
  position:relative; overflow:hidden; display:flex; flex-direction:column; gap:var(--s2);
  padding:var(--s5) var(--s4) var(--s4); border-radius:var(--r3);
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh1);
  color:var(--text); transition:transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.excard:hover{ text-decoration:none; transform:translateY(-2px); box-shadow:var(--sh2); }
.excard__bar{ position:absolute; inset-inline:0; top:0; height:4px; }
.excard__head{ display:flex; align-items:center; gap:var(--s2); }
.excard__ico{ font-size:1.2rem; }
.excard__t{ font-family:var(--font-display); font-weight:800; line-height:1.4; }
.excard__where{ font-size:.78rem; color:var(--brand); font-weight:700; }
.excard__d{
  font-size:.84rem; color:var(--text-2); line-height:1.7;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.excard__meta{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:auto; padding-top:var(--s2); }

.ex-pager{ display:flex; align-items:center; justify-content:center; gap:var(--s4); margin-top:var(--s6); }
.ex-pageno{ font-size:.85rem; color:var(--text-3); }

/* ═══ دليل التنسيق ═══ */
.fmt{
  border:1px solid var(--line); border-radius:var(--r3);
  background:var(--surface); margin:var(--s4) 0; overflow:hidden;
}
.fmt__sum{
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  padding:var(--s4) var(--s5); cursor:pointer; min-height:52px;
  font-family:var(--font-display); font-weight:800; list-style:none;
}
.fmt__sum::-webkit-details-marker{ display:none; }
.fmt__sum::before{ content:'▸'; color:var(--brand); transition:transform var(--t-fast) var(--ease); }
.fmt[open] .fmt__sum::before{ transform:rotate(-90deg); }
.fmt__hint{ font-family:var(--font); font-weight:600; font-size:.78rem; color:var(--text-3); }
.fmt__body{ padding:0 var(--s5) var(--s5); display:grid; gap:var(--s4); }

/* خطوات ما يحدث للملف — ترقيم حقيقي لأنها تسلسل فعلي لا زينة */
.fmt__pipe{ list-style:none; margin:0; padding:0; display:grid; gap:var(--s3); }
.fmt__pipe li{ display:flex; gap:var(--s3); align-items:flex-start; }
.fmt__pn{
  flex:0 0 auto; width:24px; height:24px; border-radius:50%;
  display:grid; place-items:center; font-size:.78rem; font-weight:700;
  background:var(--brand-soft); color:var(--brand);
}
.fmt__pd{ display:block; font-size:.84rem; color:var(--text-2); line-height:1.75; }

.fmt__card{
  border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s4); background:var(--bg);
}
.fmt__card--check{ background:var(--gold-soft); border-color:var(--gold); }
.fmt__t{ margin:0 0 var(--s1); font-family:var(--font-display); font-size:.95rem; }
.fmt__when{ margin:0 0 var(--s3); font-size:.82rem; color:var(--text-2); }
.fmt__rules{ margin:0 0 var(--s3); padding-inline-start:var(--s5); font-size:.84rem; color:var(--text-2); line-height:1.9; }

/* القالب: نصّ ملف حقيقي — أحادي المسافة وقابل للتمرير أفقيًا وحده */
.fmt__code{
  margin:0 0 var(--s3); padding:var(--s3) var(--s4);
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r1);
  font-family:var(--font-num); font-size:.78rem; line-height:1.9;
  overflow-x:auto; white-space:pre; color:var(--text);
}
.fmt__out{ margin:var(--s3) 0 0; font-size:.85rem; font-weight:700; min-height:1.2em; }
.fmt__out.is-ok{ color:var(--ok); }
.fmt__out.is-no{ color:var(--bad); }

/* صفّ فرعي داخل صفّ — تفاصيل تُفتح تحت السطر لا تزاحمه */
.ad-sub{
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  padding:var(--s3) 0 0; margin-top:var(--s2);
  border-top:1px dashed var(--line-soft);
}
.ad-inline{ display:flex; align-items:center; gap:var(--s2); }
.ad-inline__l{ font-size:.76rem; font-weight:700; color:var(--text-3); white-space:nowrap; }
.ad-inline .input{ width:auto; }

/* ═══ صندوق التكلفة ═══ */
.costbox{
  display:grid; gap:var(--s1);
  padding:var(--s4); border-radius:var(--r2);
  background:var(--gold-soft); border:1px solid var(--gold);
}
.costbox__l{ font-size:.78rem; font-weight:700; color:var(--text-2); }
.costbox__n{ font-family:var(--font-num); font-size:1.35rem; font-weight:700; color:var(--brand); }
.costbox__s{ font-size:.78rem; color:var(--text-2); line-height:1.7; }

/* ═══ مساران للنشر ═══ */
.paths{ display:grid; gap:var(--s3); }
@media (min-width:640px){ .paths{ grid-template-columns:1fr 1fr; } }
.path{
  display:flex; flex-direction:column; gap:var(--s2); text-align:start; cursor:pointer;
  padding:var(--s4); border-radius:var(--r2);
  background:var(--surface); border:2px solid var(--line); color:var(--text);
}
.path:hover{ border-color:var(--brand); }
.path[aria-checked="true"]{ border-color:var(--brand); background:var(--brand-soft); }
.path__h{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s2); }
.path__t{ font-family:var(--font-display); font-weight:800; }
.path__t::before{ content:'○ '; color:var(--text-3); }
.path[aria-checked="true"] .path__t::before{ content:'● '; color:var(--brand); }
.path__p{ font-weight:700; color:var(--brand); white-space:nowrap; }
.path__d{ font-size:.84rem; color:var(--text-2); line-height:1.75; }
/* ما ينقص المسار — يُقال بصراحة لا يُخبأ */
.path__m{ font-size:.78rem; color:var(--text-3); line-height:1.7; }
.path.is-blocked{ opacity:.55; cursor:not-allowed; }
.path.is-blocked:hover{ border-color:var(--line); }


/* شريط تحذير البلاغات في محرّر المادة — بابٌ لا مجرد إشعار */
.ad-warn{
  display:flex; align-items:center; justify-content:space-between; gap:var(--s3);
  margin-top:var(--s4); padding:var(--s3) var(--s4);
  background:var(--warn-soft); border:1px solid var(--warn); border-radius:var(--r1);
  color:var(--warn); font-weight:700; font-size:.9rem; text-decoration:none;
}
.ad-warn:hover{ filter:brightness(.97); }
.ad-warn__go{ font-weight:800; }

/* ═══════════ لوحة الإشراف الكاملة ═══════════ */
/* القمع: الشريط يُري الحجم، والنسبة تُري التسرّب — والاثنان معًا لا أحدهما */
.fun{ display:flex; flex-direction:column; gap:var(--s2); }
.fun__row{ display:flex; align-items:center; gap:var(--s3); }
.fun__l{ min-width:7.5em; font-size:.88rem; color:var(--text-2); }
.fun__bar{ flex:1; height:20px; background:var(--surface-2); border-radius:var(--r1); overflow:hidden; }
.fun__fill{
  display:block; height:100%; border-radius:var(--r1);
  background:linear-gradient(90deg, var(--brand), var(--brand-2));
}
.fun__n{ min-width:3.5em; text-align:end; font-weight:700; }
