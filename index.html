    // نحفظ وقت الانتهاء المطلق كي نعرف متى نجدّد دون الرجوع للخادم
    s.expires_abs = Date.now() + (s.expires_in ? s.expires_in * 1000 : 3600 * 1000);
    QBANK.store.set(Api.SESSION_KEY, s);
  },
  user(){ const s = Api.session(); return s && s.user ? s.user : null; },

  headers(){
    const c = QBANK.config.get() || {};
    const s = Api.session();
    return {
      'apikey': c.anonKey || '',
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + (s && s.access_token ? s.access_token : (c.anonKey || ''))
    };
  },

  async raw(path, opts){
    const c = QBANK.config.get();
    const f = Api.fetchFn();
    if (!c || !f) return { ok:false, offline:true, data:null };
    try{
      // جلسة على وشك الانتهاء؟ نجدّدها قبل الطلب لا بعد فشله
      const s = Api.session();
      if (s && s.refresh_token && s.expires_abs && Date.now() > s.expires_abs - 60000 && path.indexOf('/auth/') === -1) {
        await Api.auth.refresh();
      }
      const res = await f(c.url + path, Object.assign({ headers: Api.headers() }, opts || {}));
      const text = await res.text();
      let data = null;
      try{ data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
      return { ok: res.ok, status: res.status, data };
    } catch(e){
      return { ok:false, offline:true, data:null, err: e.message };
    }
  },

  rest(path, opts){ return Api.raw('/rest/v1/' + path, opts); },
  rpc(name, args){
    return Api.raw('/rest/v1/rpc/' + name, { method:'POST', body: JSON.stringify(args || {}) });
  },

  auth: {
    // عنوان العودة بعد الضغط على الرابط: موقعنا الحالي لا الافتراضي في إعدادات Supabase.
    // بدونه يعود المستخدم إلى localhost فلا يدخل — وهذا سبب فشل الدخول الأول.
    redirectTo(){
      if (typeof location === 'undefined') return '';
      // نحذف الهاش كي لا يختلط مسار التطبيق برموز الجلسة العائدة
      return location.origin + location.pathname;
    },
    magic(email){
      const back = Api.auth.redirectTo();
      return Api.raw('/auth/v1/otp' + (back ? '?redirect_to=' + encodeURIComponent(back) : ''), {
        method:'POST',
        body: JSON.stringify({
          email, create_user: true,
          options: { emailRedirectTo: back }
        })
      });
    },
    // دخول جوجل/آبل: توجيه كامل للصفحة — يصلح للويب والتطبيق معًا
    oauthUrl(provider){
      const c = QBANK.config.get();
      if (!c) return null;
      const back = (typeof location !== 'undefined') ? location.origin + location.pathname : '';
      return c.url + '/auth/v1/authorize?provider=' + provider + '&redirect_to=' + encodeURIComponent(back);
    },
    // عند العودة من رابط سحري أو OAuth تصل الرموز في هاش الصفحة
    captureFromHash(hash){
      const h = String(hash || '');
      if (h.indexOf('access_token=') === -1) return false;
      const p = {};
      h.replace(/^#/,'').split('&').forEach(kv => {
        const [k,v] = kv.split('=');
        p[k] = decodeURIComponent(v || '');
      });
      if (!p.access_token) return false;
      Api.saveSession({
        access_token: p.access_token,
        refresh_token: p.refresh_token || '',
        expires_in: parseInt(p.expires_in || '3600', 10),
        user: Api.auth.decodeUser(p.access_token)
      });
      return true;
    },
    // نقرأ هوية المستخدم من الـJWT نفسه — بلا نداء شبكة إضافي
    decodeUser(jwt){
      try{
        const payload = JSON.parse(
          decodeURIComponent(escape(atob(jwt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))))
        );
        return { id: payload.sub, email: payload.email || '' };
      } catch(e){ return null; }
    },
    async refresh(){
      const s = Api.session();
      if (!s || !s.refresh_token) return { ok:false };
      const r = await Api.raw('/auth/v1/token?grant_type=refresh_token', {
        method:'POST', body: JSON.stringify({ refresh_token: s.refresh_token })
      });
      if (r.ok && r.data && r.data.access_token) {
        r.data.user = r.data.user || Api.auth.decodeUser(r.data.access_token);
        Api.saveSession(r.data);
      } else if (!r.offline) {
        Api.saveSession(null);   // رمز تجديد ميت: جلسة منتهية فعلًا
      }
      return r;
    },
    async signOut(){
      await Api.raw('/auth/v1/logout', { method:'POST' });
      Api.saveSession(null);
    },
    async deleteMe(){
      const r = await Api.rpc('delete_me');
      if (r.ok) { Api.saveSession(null); QBANK.store.clearAll(); }
      return r;
    }
  },

  /* --- ملف المستخدم الشخصي --- */
  async myProfile(){
    const u = Api.user();
    if (!u) return { ok:false };
    const r = await Api.rest('profiles?id=eq.' + u.id + '&select=*');
    return r.ok && r.data && r.data[0] ? { ok:true, data:r.data[0] } : r;
  },
  saveProfile(fields){
    const u = Api.user();
    if (!u) return Promise.resolve({ ok:false });
    return Api.rest('profiles?id=eq.' + u.id, { method:'PATCH', body: JSON.stringify(fields) });
  }
};
QBANK.api = Api;


/* ===== 16-data.js ===== */
/*
  مخزن المحتوى المحلي: الأسئلة في IndexedDB لأن مادة واحدة بمئات الأسئلة
  تتجاوز سقف localStorage (≈ ٥ ميغابايت). عند غياب IndexedDB (فحوص jsdom،
  أو تصفح خاص متشدد) نسقط إلى ذاكرة مؤقتة فلا تنكسر المنصة — تعمل بلا حفظ فقط.
*/
const Data = {
  DB_NAME: 'qbank', DB_VER: 1,
  _db: null,
  _mem: { questions: new Map(), meta: new Map() },
  hasIDB(){ return typeof indexedDB !== 'undefined'; },

  OLD_DB: 'amusq',   // قاعدة الأسئلة قبل تغيير الهوية

  /*
    نقل أسئلة الطالب المحفوظة من قاعدة الهوية القديمة.

    الأسئلة بيانات مشتقّة تُجلب من الخادم عند الحاجة، لكن وعد المنصة أنها
    «تعمل بلا إنترنت بعد أول فتح». لو تركنا القديمة لوجد الطالب الذي يذاكر
    في الطائرة مادته فارغة. فننسخها مرة واحدة ثم نحذف القديمة كي لا تشغل مساحة.
  */
  migrateDB(){
    if (!Data.hasIDB()) return Promise.resolve(0);
    return new Promise(resolve => {
      let req;
      try { req = indexedDB.open(Data.OLD_DB); } catch(e){ return resolve(0); }
      req.onerror = () => resolve(0);
      req.onupgradeneeded = () => {
        // لم تكن موجودة أصلًا: نُجهض الإنشاء فلا نترك قاعدة فارغة خلفنا
        try { req.transaction.abort(); } catch(e){}
        resolve(0);
      };
      req.onsuccess = async () => {
        const oldDb = req.result;
        if (!oldDb.objectStoreNames.contains('questions')){ oldDb.close(); return resolve(0); }
        const rows = await new Promise(r => {
          try {
            const g = oldDb.transaction('questions','readonly').objectStore('questions').getAll();
            g.onsuccess = () => r(g.result || []); g.onerror = () => r([]);
          } catch(e){ r([]); }
        });
        oldDb.close();
        if (!rows.length){ try { indexedDB.deleteDatabase(Data.OLD_DB); } catch(e){} return resolve(0); }
        const db = await Data.open();
        if (!db) return resolve(0);
        const tx = db.transaction('questions','readwrite');
        const st = tx.objectStore('questions');
        rows.forEach(q => { try { st.put(q); } catch(e){} });
        tx.oncomplete = () => { try { indexedDB.deleteDatabase(Data.OLD_DB); } catch(e){} resolve(rows.length); };
        tx.onerror = () => resolve(0);
      };
    });
  },

  open(){
    if (!Data.hasIDB()) return Promise.resolve(null);
    if (Data._db) return Promise.resolve(Data._db);
    return new Promise((resolve) => {
      const req = indexedDB.open(Data.DB_NAME, Data.DB_VER);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('questions')) {
          const st = db.createObjectStore('questions', { keyPath:'id' });
          st.createIndex('subject_id', 'subject_id');   // الجلب دائمًا بمادة كاملة
        }
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath:'k' });
      };
      req.onsuccess = () => { Data._db = req.result; resolve(Data._db); };
      req.onerror = () => resolve(null);   // فشل الفتح لا يُسقط المنصة
    });
  },

  async putQuestions(subjectId, questions){
    if (!Data.hasIDB()) {
      questions.forEach(q => Data._mem.questions.set(q.id, q));
      Data._mem.meta.set('subj:' + subjectId, Date.now());
      return true;
    }
    const db = await Data.open();
    if (!db) return false;
    return new Promise((resolve) => {
      const tx = db.transaction(['questions','meta'], 'readwrite');
      const st = tx.objectStore('questions');
      questions.forEach(q => st.put(q));
      tx.objectStore('meta').put({ k:'subj:' + subjectId, at: Date.now() });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  },

  async getQuestions(subjectId){
    if (!Data.hasIDB()) {
      return Array.from(Data._mem.questions.values())
        .filter(q => q.subject_id === subjectId)
        .sort((a,b) => (a.ord||0) - (b.ord||0));
    }
    const db = await Data.open();
    if (!db) return [];
    return new Promise((resolve) => {
      const tx = db.transaction('questions', 'readonly');
      const idx = tx.objectStore('questions').index('subject_id');
      const req = idx.getAll(subjectId);
      req.onsuccess = () => resolve((req.result || []).sort((a,b) => (a.ord||0) - (b.ord||0)));
      req.onerror = () => resolve([]);
    });
  },

  async hasSubject(subjectId){
    if (!Data.hasIDB()) return Data._mem.meta.has('subj:' + subjectId);
    const db = await Data.open();
    if (!db) return false;
    return new Promise((resolve) => {
      const req = db.transaction('meta','readonly').objectStore('meta').get('subj:' + subjectId);
      req.onsuccess = () => resolve(!!req.result);
      req.onerror = () => resolve(false);
    });
  },

  async clearAll(){
    Data._mem.questions.clear(); Data._mem.meta.clear();
    if (!Data.hasIDB()) return true;
    const db = await Data.open();
    if (!db) return true;
    return new Promise((resolve) => {
      const tx = db.transaction(['questions','meta'], 'readwrite');
      tx.objectStore('questions').clear();
      tx.objectStore('meta').clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  },

  /* --- المحتوى المنشور: قائمة المواد خفيفة في localStorage، والأسئلة عند الطلب --- */
  pack(){ return QBANK.store.get('pack', { subjects: [], settings: {} }); },
  savePack(p){ QBANK.store.set('pack', p); },

  async refreshPack(){
    const r = await QBANK.api.rpc('content_pack');
    if (r.ok && r.data && r.data.subjects) { Data.savePack(r.data); return { ok:true, data:r.data }; }
    return r;   // فشل أو بلا إنترنت: نبقى على النسخة المخزّنة — هذا جوهر العمل دون اتصال
  },

  // أسئلة مادة: من الجهاز إن سبق جلبها، وإلا من الخادم ثم تُخزَّن — «تحميل على مراحل»
  async subjectQuestions(subjectId){
    if (await Data.hasSubject(subjectId)) {
      const local = await Data.getQuestions(subjectId);
      if (local.length) return { ok:true, data:local, from:'device' };
    }
    const r = await QBANK.api.rpc('subject_questions', { sid: subjectId });
    if (r.ok && Array.isArray(r.data)) {
      await Data.putQuestions(subjectId, r.data);
      return { ok:true, data:r.data, from:'network' };
    }
    return { ok:false, offline: r.offline, data: [] };
  }
};
QBANK.data = Data;


/* ===== 18-progress.js ===== */
/*
  التقدّم: محلي أولًا وفورًا، ثم يُدفع للحساب بتأخير ٢٫٥ ثانية بعد آخر نقرة.
  لماذا التأخير؟ طالب يقلّب ٣٠ بطاقة في دقيقة = ٣٠ كتابة شبكية بلا فائدة؛
  دفعة واحدة بعد سكونه تكفي وتوفّر البطارية والبيانات.
*/
const Progress = {
  KEY: 'progress',
  PUSH_DELAY: 2500,
  _timer: null,
  _pushFn: null,   // باب حقن للفحوص

  blank(){ return {}; },
  all(){ return QBANK.store.get(Progress.KEY, Progress.blank()); },
  save(p){ QBANK.store.set(Progress.KEY, p); Progress.schedulePush(); },

  forSubject(sid){
    const p = Progress.all();
    return p[sid] || { seen:{}, wrong:{}, star:{}, exams:0, best:0 };
  },
  _update(sid, fn){
    const p = Progress.all();
    const s = p[sid] || { seen:{}, wrong:{}, star:{}, exams:0, best:0 };
    fn(s); p[sid] = s; Progress.save(p);
    return s;
  },

  markSeen(sid, qid){ return Progress._update(sid, s => { s.seen[qid] = 1; }); },
  markWrong(sid, qid){ return Progress._update(sid, s => { s.wrong[qid] = (s.wrong[qid]||0) + 1; s.seen[qid] = 1; }); },
  clearWrong(sid, qid){ return Progress._update(sid, s => { delete s.wrong[qid]; }); },
  toggleStar(sid, qid){
    let on = false;
    Progress._update(sid, s => { if (s.star[qid]) delete s.star[qid]; else { s.star[qid] = 1; on = true; } });
    return on;
  },
  recordExam(sid, pct){ return Progress._update(sid, s => { s.exams += 1; if (pct > s.best) s.best = pct; }); },

  pctDone(sid, totalQ){
    if (!totalQ) return 0;
    const seen = Object.keys(Progress.forSubject(sid).seen).length;
    return Math.min(100, Math.round(seen / totalQ * 100));
  },

  /* --- الدمج بلا حذف: اتحاد المُشاهد والنجوم، الأعلى يفوز في النتائج، والمجموع في العدّادات.
         القاعدة: لا يخسر أحد تقدّمه أبدًا — لا عند جهاز جديد ولا عند تعارض. --- */
  merge(local, remote){
    const out = {};
    const sids = new Set(Object.keys(local || {}).concat(Object.keys(remote || {})));
    sids.forEach(sid => {
      const a = (local  || {})[sid] || { seen:{}, wrong:{}, star:{}, exams:0, best:0 };
      const b = (remote || {})[sid] || { seen:{}, wrong:{}, star:{}, exams:0, best:0 };
      out[sid] = {
        seen:  Object.assign({}, b.seen,  a.seen),
        star:  Object.assign({}, b.star,  a.star),
        wrong: (function(){
          // عدّاد الأخطاء: الأعلى يفوز — تكرار الخطأ معلومة تهم ترتيب المراجعة
          const w = Object.assign({}, b.wrong);
          Object.keys(a.wrong || {}).forEach(k => { w[k] = Math.max(w[k] || 0, a.wrong[k]); });
          return w;
        })(),
        exams: (a.exams || 0) + (b.exams || 0),
        best:  Math.max(a.best || 0, b.best || 0)
      };
    });
    return out;
  },

  schedulePush(){
    if (Progress._timer) clearTimeout(Progress._timer);
    Progress._timer = setTimeout(() => { Progress._timer = null; Progress.push(); }, Progress.PUSH_DELAY);
  },
  async push(){
    if (Progress._pushFn) return Progress._pushFn(Progress.all());
    if (!QBANK.api.user()) return { ok:false };   // زائر: يبقى تقدّمه في جهازه حتى يسجّل
    return QBANK.api.rest('progress?on_conflict=user_id', {
      method:'POST',
      headers: Object.assign(QBANK.api.headers(), { 'Prefer':'resolution=merge-duplicates' }),
      body: JSON.stringify({ user_id: QBANK.api.user().id, data: Progress.all(), updated_at: new Date().toISOString() })
    });
  },
  // عند أول دخول على جهاز: نجلب تقدّم الحساب وندمجه مع تقدّم الجهاز ثم ندفع الناتج
  async pull(){
    const u = QBANK.api.user();
    if (!u) return { ok:false };
    const r = await QBANK.api.rest('progress?user_id=eq.' + u.id + '&select=data');
    if (r.ok && r.data && r.data[0]) {
      const merged = Progress.merge(Progress.all(), r.data[0].data || {});
      QBANK.store.set(Progress.KEY, merged);
      await Progress.push();
      return { ok:true, merged:true };
    }
    if (r.ok) { await Progress.push(); return { ok:true, merged:false }; }
    return r;
  }
};
QBANK.progress = Progress;


/* ===== 20-gate.js ===== */
/*
  بوابة المحتوى — تفصل المجاني عن المدفوع (المرحلة ٥).
  القرار النهائي في قاعدة البيانات (can_access + RLS)؛ نسخة العميل هنا
  للعرض فقط: تخفي أزرار ما لا يملكه الطالب وتعرض بطاقة الشراء بدلها.
  النموذج: مادة مفردة أو حزمة فصل تنتهي بنهاية الفصل — لا اشتراك شهري.
*/
const Gate = {
  KEY: 'entitlements',
  list(){ return QBANK.store.get(Gate.KEY, []); },
  save(rows){ QBANK.store.set(Gate.KEY, rows || []); },

  async refresh(){
    const u = QBANK.api.user();
    if (!u) return { ok:false };
    const r = await QBANK.api.rest('entitlements?select=subject_id,kind,expires_at&expires_at=gt.' + new Date().toISOString());
    if (r.ok && Array.isArray(r.data)) { Gate.save(r.data); return { ok:true }; }
    return r;
  },

  // متاحة؟ مجانية للجميع، أو استحقاق ساري المفعول (مادة مفردة أو حزمة فصل)
  canAccess(sub, now){
    if (!sub) return false;
    if (sub.free) return true;
    if (QBANK.store.get('is_admin_check', {}).ok) return true;
    const t = now || Date.now();
    return Gate.list().some(e =>
      new Date(e.expires_at).getTime() > t &&
      (e.kind === 'semester' || e.subject_id === sub.id));
  },

  /*
    رابط الإحالة: يصل في ?ref=  فنحفظه، لأن الطالب قد يسجّل دخوله أولًا
    ويعود بعد جولة في المنصة — ولو ضاع المُحيل ضاعت مكافأة من أوصله.
  */
  REF_KEY: 'ref_by',
  captureRef(query){
    const ref = (query && query.ref) || '';
    if (ref) QBANK.store.set(Gate.REF_KEY, ref);
    return ref || QBANK.store.get(Gate.REF_KEY, '');
  },
  ref(){ return QBANK.store.get(Gate.REF_KEY, ''); },

  // زر الشراء وحده — تُعيد استعماله بطاقة القفل وبطاقة انتهاء التجربة
  buyButton(sub){
    const isApp = !!(typeof window !== 'undefined' && window.QBANK_NATIVE_APP);
    const price = sub.price ? ' — ' + sub.price + ' ريال' : '';
    return isApp
      ? el('button', { class:'btn btn--block', type:'button', 'data-buy': sub.id,
          'data-ref': Gate.ref() || null, text:'اشترِ من داخل التطبيق' + price })
      /* ★ صار دفعًا حقيقيًا لا رابطًا خارجيًا.
         كان يفتح alsoqoor.com — أي أن الطالب يغادر المنصة عند أهم لحظة
         فيها، وهي اللحظة التي يقرّر فيها أن يدفع. والآن يشتري في مكانه. */
      /*
        ★ مادة مقفلة بلا سعر حالةٌ حقيقية — لا حالة فحص.
        كان الرابط الخارجي يخفيها: يظهر زر شراء لمادة لا ثمن لها، فيضغطه
        الطالب فلا يجد شيئًا يشتريه. الآن تُقال بصراحة، لأنها خطأ محتوى
        على المشرف إصلاحه لا لغزٌ على الطالب حلّه.
      */
      : (QBANK.pay && QBANK.pay.buySubjectButton(sub)) ||
        el('p', { class:'field__hint', 'data-noprice':'1',
          text:'لم يُحدَّد سعر هذه المادة بعد — تواصل مع مشرف المنصة.' });
  },

  // بطاقة الشراء — تحترم قاعدة المتاجر: داخل التطبيق لا إحالة للموقع
  paywallCard(sub){
    return el('div', { class:'card', style:'text-align:center' }, [
      el('span', { class:'empty__ico', 'aria-hidden':'true', text:'🔒' }),
      el('p', { class:'empty__title', text:'«' + sub.name + '» مادة مدفوعة' }),
      el('p', { class:'empty__text', text:'اشترِ المادة وحدها أو حزمة الفصل كاملة — صالحة حتى نهاية الفصل، بلا اشتراك شهري.' }),
      Gate.buyButton(sub),
      el('p', { class:'field__hint', text:'لديك حساب اشترى من قبل؟ سجّل دخولك وسيُفتح المحتوى تلقائيًا.' })
    ]);
  },

  /*
    القرار المعتمد يأتي من القاعدة (subject_access)، وهذه نسخة محلية للعرض الفوري
    قبل وصول الرد — كي لا تومض الشاشة. لا تُمنح بها صلاحية: القاعدة ترفض من لا حق له
    حتى لو كذبت هذه الدالة، والفحوص تثبت ذلك.
  */
  localGuess(sub, now){
    if (!sub) return { allowed:false, reason:'missing' };
    if (sub.free) return { allowed:true, reason:'free' };
    if (QBANK.store.get('is_admin_check', {}).ok) return { allowed:true, reason:'admin' };
    const u = QBANK.api.user();
    if (!u) return { allowed:false, reason:'anon' };
    const t = now || Date.now();
    if (Gate.list().some(e => new Date(e.expires_at).getTime() > t &&
        (e.kind === 'semester' || e.subject_id === sub.id)))
      return { allowed:true, reason:'entitled' };
    /*
      ★ مادته هو — يفتحها بلا سؤال.
      من كتب البنك بيده لا يليق أن يُطلب منه ثمنُ فتحه. والقاعدة تكتب له
      استحقاقًا لحظة النشر، لكنه قد لا يكون وصل إلى هذا الجهاز بعد، فنُقرّر
      محليًا ولا ننتظر: صاحب المادة أولى الناس بها.
      و`pending` باقية لأن القاعدة هي من يعرف متى تنتهي مدّته.
    */
    if (sub.created_by && sub.created_by === u.id)
      return { allowed:true, reason:'owner', pending:true };
    return { allowed:false, reason:'paywall' };
  }
};
QBANK.gate = Gate;


/* ===== 20-router.js ===== */
/*
  الموجّه: يعتمد على hash لا على History API.
  لماذا؟ لأن المنصة يجب أن تعمل بفتح index.html مباشرة من القرص (file://)
  وهناك pushState لا يعمل، بينما #/ يعمل في كل مكان.
*/
const Router = {
  routes: {},
  notFound: null,
  current: null,

  add(path, def){ Router.routes[path] = def; return Router; },

  parse(hash){
    // نُحوّل "#/admin/students?x=1" إلى { path:'#/admin', rest:['students'], query:{x:'1'} }
    const raw = (hash || '#/').replace(/^#?/, '#');
    const [beforeQ, qs] = raw.split('?');
    const parts = beforeQ.replace(/^#\/?/, '').split('/').filter(Boolean);
    const query = {};
    (qs || '').split('&').filter(Boolean).forEach(pair => {
      const [k, v] = pair.split('=');
      query[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });

    if (!parts.length) return { path:'#/', rest:[], query, raw:beforeQ };

    // نطابق أطول مسار مُعرَّف أولًا حتى لا يبتلع "#/admin" مسار "#/admin/login"
    let path = '#/' + parts.join('/');
    let rest = [];
    while (parts.length && !Router.routes[path]) {
      rest.unshift(parts.pop());
      path = '#/' + parts.join('/');
    }
    // لم يُطابَق شيء: نُرجع المسار كما هو ليصل إلى صفحة ٤٠٤،
    // ولا نُسقطه على الجذر — وإلا صار كل رابط خاطئ يفتح الرئيسية بصمت.
    if (!parts.length) return { path: beforeQ, rest:[], query, raw: beforeQ };
    return { path, rest, query, raw: beforeQ };
  },

  resolve(hash){
    const m = Router.parse(hash);
    const def = Router.routes[m.path];
    return def ? Object.assign({}, m, { def }) : Object.assign({}, m, { def: Router.notFound });
  },

  render(hash){
    const main = document.getElementById('main');
    if (!main) return null;
    const r = Router.resolve(hash);
    Router.current = r;

    main.innerHTML = '';
    const view = r.def && typeof r.def.view === 'function' ? r.def.view(r) : null;
    if (view) main.appendChild(view);

    document.title = (r.def && r.def.title ? r.def.title + ' · ' : '') + 'مراجعة';
    Router.paintNav(r.path);
    // نُعيد التركيز إلى المحتوى كي يعرف قارئ الشاشة أن الصفحة تبدّلت
    if (Router.booted) { try { main.focus(); } catch(e){} }
    Router.booted = true;
    return r;
  },

  paintNav(path){
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), a => {
      const isOn = a.getAttribute('data-nav') === path;
      if (isOn) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
  },

  go(hash){
    if (location.hash === hash) Router.render(hash);   // نفس الوجهة: نُعيد الرسم يدويًا
    else location.hash = hash;
  },

  init(){
    window.addEventListener('hashchange', () => Router.render(location.hash));
    Router.render(location.hash || '#/');
  }
};
QBANK.router = Router;


/* ===== 24-exam.js ===== */
/*
  محرك الاختبار التجريبي — منطق نقي بلا DOM كي يُفحص بمعزل عن الواجهة.
  المبدآن الثابتان:
  ١) خلط فيشر-ييتس للأسئلة ولمواضع الخيارات — عادل رياضيًا.
  ٢) تتبّع الإجابة الصحيحة بالموضع الرقمي لا بالحرف — الحروف تنكسر عند الخلط.
*/
const Exam = {
  // rng قابل للحقن: الفحوص تمرّر مولّدًا حتميًا فتصير النتائج قابلة للتكرار
  shuffle(arr, rng){
    const r = rng || Math.random;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  },

  /* اختيار الأسئلة: النطاق ثم أولوية ما أُخطئ فيه سابقًا */
  select(questions, opts){
    opts = opts || {};
    let pool = questions.slice();
    if (opts.scope === 'topic' && opts.topic) pool = pool.filter(q => q.topic === opts.topic);
    if (opts.scope === 'important') pool = pool.filter(q => q.important);
    if (opts.scope === 'wrong') pool = pool.filter(q => (opts.wrongMap || {})[q.id]);

    const wrongMap = opts.wrongMap || {};
    // الأسئلة الخاطئة سابقًا تتقدّم: نخلط كل فئة على حدة ثم نقدّم الخاطئة
    const wrong = Exam.shuffle(pool.filter(q => wrongMap[q.id]), opts.rng);
    const rest  = Exam.shuffle(pool.filter(q => !wrongMap[q.id]), opts.rng);
    let picked = wrong.concat(rest);
    if (opts.count && opts.count < picked.length) picked = picked.slice(0, opts.count);
    return picked;
  },

  create(questions, opts){
    opts = opts || {};
    const picked = Exam.select(questions, opts);
    const items = picked.map(q => {
      // خلط مواضع الخيارات مع تتبّع موضع الصحيح رقميًا
      const order = Exam.shuffle(q.options.map((_, i) => i), opts.rng);
      return {
        id: q.id, q: q.q, topic: q.topic || '',
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.answer),   // الموضع الجديد للإجابة الصحيحة
        translation: q.translation || '', expl_ar: q.expl_ar || ''
      };
    });
    return {
      items,
      i: 0,
      answers: new Array(items.length).fill(null),
      mode: opts.mode || 'instant',        // فوري (افتراضي) أو بعد الانتهاء
      timerMin: opts.timerMin || 0,
      startedAt: opts.now || Date.now(),
      finished: false
    };
  },

  answer(exam, choice){
    if (exam.finished || exam.answers[exam.i] !== null) return null;
    const item = exam.items[exam.i];
    const correct = choice === item.correct;
    exam.answers[exam.i] = { choice, correct };
    return { correct, correctIndex: item.correct };
  },

  next(exam){ if (exam.i < exam.items.length - 1) exam.i++; return exam.i; },
  prev(exam){ if (exam.i > 0) exam.i--; return exam.i; },

  grade(pct){
    if (pct >= 90) return 'ممتاز';
    if (pct >= 80) return 'جيد جدًا';
    if (pct >= 70) return 'جيد';
    if (pct >= 60) return 'مقبول';
    return 'يحتاج مراجعة';
  },

  finish(exam, now){
    exam.finished = true;
    const total = exam.items.length;
    const correct = exam.answers.filter(a => a && a.correct).length;
    const pct = total ? Math.round(correct / total * 1000) / 10 : 0;

    // تحليل حسب المحاور: أين القوة وأين الخلل
    const byTopic = {};
    exam.items.forEach((item, idx) => {
      const t = item.topic || 'عام';
      byTopic[t] = byTopic[t] || { total:0, correct:0 };
      byTopic[t].total++;
      if (exam.answers[idx] && exam.answers[idx].correct) byTopic[t].correct++;
    });

    return {
      total, correct, pct,
      grade: Exam.grade(pct),
      duration_s: Math.round(((now || Date.now()) - exam.startedAt) / 1000),
      byTopic,
      wrongIds: exam.items.filter((it, idx) => !exam.answers[idx] || !exam.answers[idx].correct).map(it => it.id),
      review: exam.items.map((it, idx) => ({
        q: it.q, options: it.options, correct: it.correct,
        chosen: exam.answers[idx] ? exam.answers[idx].choice : null,
        ok: !!(exam.answers[idx] && exam.answers[idx].correct),
        expl_ar: it.expl_ar
      }))
    };
  }
};
QBANK.exam = Exam;

/* ١ · الرئيسية — بطاقات المواد: «موادي» ثم «مواد أخرى متاحة» */
/*
  أحرف الخيارات بالعربية: أ ب ج د — لا A B C D.
  هذه لغة ورقة الامتحان التي جلس عليها الطالب طوال دراسته، ويقول بها
  «الجواب ج» لزميله. والحرف عرضٌ فقط: موضع الإجابة يبقى رقمًا في القاعدة
  فلا ينكسر شيء عند خلط الخيارات.
*/
const OPT_LETTERS = ['أ','ب','ج','د','هـ','و','ز','ح','ط','ي'];
function optLetter(i){ return OPT_LETTERS[i] || String(i + 1); }

/* الأرقام العربية الهندية — كما تُطبع في الكتاب المدرسي العربي */
function arNum(n){
  return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
}

function subjectColor(c){
  // اللون اسم متغيّر من نظام التصميم — لا hex حر من قاعدة البيانات
  return /^subject-[1-6]$/.test(c || '') ? 'var(--' + c + ')' : 'var(--subject-1)';
}
function daysLeft(dateStr, now){
  if (!dateStr) return null;
  const d = new Date(dateStr).getTime() - (now || Date.now());
  return Math.ceil(d / 86400000);
}
function mySubjects(){ return QBANK.store.get('my_subjects', []); }

function subjectCard(sub){
  const mine = mySubjects().indexOf(sub.id) !== -1;
  const left = daysLeft(sub.exam_date);
  const past = left !== null && left < 0;
  const pct = QBANK.progress.pctDone(sub.id, sub.q_count);
  const color = subjectColor(sub.color);

  // العدد المطلق قبل النسبة: «٤٧ من ١٢٠» يقول للطالب ما بقي عليه فعلًا،
  // والنسبة وحدها تخفي أن ٩٠٪ من مادة صغيرة أقل عملًا من ٣٠٪ من مادة كبيرة.
  const done = Math.round((sub.q_count || 0) * pct / 100);
  const topics = (sub.topics && sub.topics.length) || 0;

  /*
    بطاقة AMSU: منطقة فنية بتدرّج لون المادة وأيقونتها، شارة «N سؤالًا»،
    الاسم وتحته الإنجليزي، سطر موعد الاختبار بعدّه، شريط تقدّم، و«ابدأ المراجعة».
    اللون يُحقن مرة واحدة في --acc فيتلوّن كل ما بالداخل من نظام التصميم.
  */
  const card = el('article', {
    class:'sub-card' + (past ? ' exam-done' : ''), tabindex:'0', role:'link',
    style:'--acc:' + color, 'aria-label':'مادة ' + sub.name }, [
    past ? el('span', { class:'stamp', 'aria-hidden':'true', text:'تم الانتهاء' }) : null,
    el('div', { class:'art', 'aria-hidden':'true' }, [
      el('span', { class:'art__ico', text: sub.icon || '▤' }),
      el('span', { class:'badge num', text: QBANK.views.arNum(sub.q_count || 0) + ' سؤالًا' })
    ]),
    el('div', { class:'meta' }, [
      el('h3', { text: sub.name }),
      sub.name_en ? el('span', { class:'qn ltr', text: sub.name_en })
        : (sub.course_code ? el('span', { class:'qn ltr', text: sub.course_code }) : null),
      left !== null ? el('div', { class:'examline num' }, [
        el('span', { class:'when', text: past ? 'انتهى موعده' : 'موعد الاختبار' }),
        past ? null : el('b', { class: left <= 2 ? 'urgent' : '',
          text:'متبقٍ ' + QBANK.views.arNum(left) + (left === 1 ? ' يوم' : ' أيام') })
      ]) : null,
      el('div', { class:'prog', 'aria-label':'أنجزت ' + pct + '٪' }, [
        el('i', { style:'width:' + pct + '%' })
      ]),
      el('div', { class:'foot num' }, [
        el('span', { text:'راجعت ' + QBANK.views.arNum(done) + ' من ' +
          QBANK.views.arNum(sub.q_count || 0) + ' · ' + QBANK.views.arNum(pct) + '٪' }),
        sub.free ? el('span', { class:'badge badge--ok', text:'مجانية' }) : null,
        el('span', { class:'cta', text:'ابدأ المراجعة ‹' })
      ])
    ])
  ]);
  card.addEventListener('click', () => QBANK.router.go('#/subject/' + sub.id));
  card.addEventListener('keydown', e => { if (e.key === 'Enter') QBANK.router.go('#/subject/' + sub.id); });
  return card;
}

const ViewHome = {
  title:'الرئيسية',
  view(){
    // الزائر يرى صفحة تعريفية تشرح وتُقنع؛ والطالب المسجَّل يرى مواده فورًا.
    // السبب: لكلٍّ حاجة مختلفة — إقناع أولًا، ومذاكرة سريعة ثانيًا.
    if (!QBANK.api.user()) return QBANK.views.landingView();

    const pack = QBANK.data.pack();
    const subjects = (pack.subjects || []).slice();
    const body = [];

    /*
      شريط جامعتي أعلى كل شيء — أو دعوة لاختيارها.

      الطالب الذي حدّد جامعته يفتح المنصة فيرى بابها لا قائمة عامة، ومن لم
      يحدّدها يرى سببًا واضحًا ليفعل. وضعناه فوق دعوة الرفع لأن الانتماء
      يسبق المساهمة: من لا يعرف أين يرفع لا يرفع.
    */
    body.push(campusBand());

    // دعوة الرفع: الطالب لا يبحث عن ميزة لا يعرف بوجودها
    body.push(el('a', { class:'upsell', href:'#/upload' }, [
      el('span', { class:'upsell__ico', 'aria-hidden':'true', text:'⇪' }),
      el('span', { class:'upsell__x' }, [
        el('span', { class:'upsell__t', text:'عندك بنك أسئلة لمادة ناقصة؟' }),
        el('span', { class:'upsell__d', text:'ارفعه، وجرّبه عشر دقائق مجانًا، وشاركه مع زملائك بكوينز لك على كل بيعة.' })
      ]),
      el('span', { class:'upsell__go', 'aria-hidden':'true', text:'←' })
    ]));

    if (pack.settings && pack.settings.welcome_text)
      body.push(el('div', { class:'card' }, [ el('p', { style:'margin:0', text: pack.settings.welcome_text }) ]));

    if (!subjects.length) {
      body.push(empty('▤', 'لا مواد بعد',
        QBANK.config.ready()
          ? 'لم تُنشر مواد حتى الآن — عد قريبًا، أو تأكد من الاتصال لمزامنة الجديد.'
          : 'المنصة تبدأ فارغة عن قصد. يضيف المشرف المواد من لوحة التحكم وستظهر هنا فور نشرها.',
        el('div', { class:'row', style:'justify-content:center;margin-top:16px' }, [
          el('a', { class:'btn', href:'#/admin', text:'افتح لوحة التحكم' })
        ])));
      body.push(el('div', { class:'grid', id:'subjectsGrid' }));
      return page('موادي', 'اختر مادة لتبدأ المراجعة.', body);
    }

    // المنتهية تنزل آخر القائمة تلقائيًا
    const order = arr => arr.slice().sort((x, y) => {
      const px = (daysLeft(x.exam_date) ?? 1) < 0 ? 1 : 0;
      const py = (daysLeft(y.exam_date) ?? 1) < 0 ? 1 : 0;
      return px - py || (x.ord || 0) - (y.ord || 0);
    });
    const mineIds = mySubjects();
    const mine = order(subjects.filter(su => mineIds.indexOf(su.id) !== -1));
    const other = order(subjects.filter(su => mineIds.indexOf(su.id) === -1));

    if (mine.length) {
      body.push(el('h2', { text:'موادي' }));
      body.push(el('div', { class:'grid', id:'subjectsGrid' }, mine.map(subjectCard)));
    }
    if (other.length) {
      body.push(el('h2', { text: mine.length ? 'مواد أخرى متاحة' : 'المواد المتاحة' }));
      body.push(el('div', { class:'grid', id: mine.length ? null : 'subjectsGrid' }, other.map(su => {
        const c = subjectCard(su);
        const add = el('button', { class:'btn btn--sm btn--soft', type:'button',
          'aria-label':'أضف ' + su.name + ' إلى موادي', text:'+ أضف إلى موادي' });
        add.addEventListener('click', e => {
          e.stopPropagation();
          const list = mySubjects();
          if (list.indexOf(su.id) === -1) { list.push(su.id); QBANK.store.set('my_subjects', list); }
          QBANK.api.rest('enrollments', { method:'POST', body: JSON.stringify({
            user_id: (QBANK.api.user() || {}).id, subject_id: su.id }) });
          QBANK.toast('أُضيفت «' + su.name + '» إلى موادك');
          QBANK.router.render('#/');
        });
        c.appendChild(el('div', { class:'row', style:'margin-top:8px' }, [add]));
        return c;
      })));
    }
    return page('موادي', 'اختر مادة لتبدأ المراجعة.', body);
  }
};

/* ٢ · دخول الطالب — رابط سحري + جوجل + آبل */
function loginCard(opts){
  // بطاقة دخول واحدة للطالب والمشرف — الفرق في العنوان والوجهة بعد النجاح فقط
  const email = el('input', { class:'input', type:'email', id:opts.emailId,
    placeholder:'name@example.com', dir:'ltr', autocomplete:'email' });
  const btn = el('button', { class:'btn btn--block', type:'button', text:'أرسل رابط الدخول' });
  const msg = el('p', { class:'field__hint', role:'status' });

  async function send(){
    const val = (email.value || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val)) { msg.textContent = 'اكتب بريدًا صحيحًا أولًا.'; email.focus(); return; }
    if (!QBANK.config.ready()) { msg.textContent = 'المنصة غير موصولة بالخادم بعد — يضبطها المشرف من الإعدادات.'; return; }
    btn.setAttribute('aria-disabled','true'); btn.textContent = 'جارٍ الإرسال…';
    const r = await QBANK.api.auth.magic(val);
    btn.removeAttribute('aria-disabled'); btn.textContent = 'أرسل رابط الدخول';
    if (r.ok) { msg.textContent = 'تم! افتح بريدك واضغط رابط الدخول.'; QBANK.toast('أُرسل رابط الدخول'); }
    else if (r.offline) msg.textContent = 'لا اتصال بالإنترنت — الدخول يحتاج اتصالًا مرة واحدة فقط.';
    else msg.textContent = 'تعذّر الإرسال. تحقق من البريد وحاول ثانية.';
  }
  btn.addEventListener('click', send);
  email.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  const gBtn = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'الدخول بحساب جوجل' });
  const aBtn = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'الدخول بحساب آبل' });
  gBtn.addEventListener('click', () => { const u = QBANK.api.auth.oauthUrl('google'); if (u) location.href = u; else QBANK.toast('المنصة غير موصولة بالخادم بعد'); });
  aBtn.addEventListener('click', () => { const u = QBANK.api.auth.oauthUrl('apple');  if (u) location.href = u; else QBANK.toast('المنصة غير موصولة بالخادم بعد'); });

  return el('div', { class:'card stack' }, [
    el('label', { class:'field', style:'margin:0' }, [
      el('span', { class:'field__label', text: opts.label }),
      email,
      el('span', { class:'field__hint', text:'يصلك رابط دخول بلا كلمة مرور.' })
    ]),
    btn, msg,
    el('hr', { class:'divider', style:'margin:0' }),
    gBtn, aBtn
  ]);
}

  الحذف شرط متجر آبل — زر حقيقي يمسح كل شيء، لا وعد شكلي.

const AVATARS = ['🧑‍⚕️','👩‍⚕️','🩺','🚑','💉','🧠','🫀','🦴','🔬','📚'];

function accountBody(){
  const u = QBANK.api.user();
  if (!u) return el('div');
  const prof = QBANK.store.get('profile', { name:'', avatar: AVATARS[0] });

  const nameInput = el('input', { class:'input', id:'accName', value: prof.name || '', placeholder:'اسمك الظاهر في المنصة' });
  const avatarRow = el('div', { class:'row', role:'radiogroup', 'aria-label':'الصورة الرمزية' },
    AVATARS.map(a => {
      const b = el('button', { class:'iconbtn', type:'button', role:'radio',
        'aria-checked': a === (prof.avatar || AVATARS[0]) ? 'true' : 'false', 'aria-label':'صورة ' + a }, [
        el('span', { class:'iconbtn__ico', text:a })
      ]);
      b.addEventListener('click', () => {
        avatarRow.querySelectorAll('[role="radio"]').forEach(x => x.setAttribute('aria-checked','false'));
        b.setAttribute('aria-checked','true');
      });
      return b;
    })
  );

  const saveBtn = el('button', { class:'btn btn--block', type:'button', text:'احفظ' });
  saveBtn.addEventListener('click', async () => {
    const picked = avatarRow.querySelector('[aria-checked="true"] .iconbtn__ico');
    const data = { name: nameInput.value.trim(), avatar: picked ? picked.textContent : AVATARS[0] };
    QBANK.store.set('profile', data);
    const r = await QBANK.api.saveProfile(data);
    QBANK.toast(r.ok ? 'حُفظ ملفك' : 'حُفظ في جهازك، وسيتزامن عند الاتصال');
  });

  // تقدّمي في كل مادة — من الحزمة المحلية، فيعمل بلا إنترنت
  const pack = QBANK.data.pack();
  const progList = el('div', { class:'stack' },
    (pack.subjects || []).map(s => {
      const pct = QBANK.progress.pctDone(s.id, s.q_count);
      return el('div', { class:'row' }, [
        el('span', { text: (s.icon || '▤') + ' ' + s.name }),
        el('span', { class:'spacer' }),
        el('span', { class:'badge num', text: pct + '٪' })
      ]);
    })
  );

  const syncBtn = el('button', { class:'btn btn--soft btn--block', type:'button', text:'زامن الآن' });
  syncBtn.addEventListener('click', async () => {
    const r = await QBANK.progress.pull();
    QBANK.toast(r.ok ? 'تمت المزامنة والدمج' : 'تعذّرت المزامنة — لا اتصال');
  });

  const outBtn = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'تسجيل الخروج' });
  outBtn.addEventListener('click', async () => {
    await QBANK.api.auth.signOut();
    QBANK.toast('خرجت من حسابك — تقدّمك باقٍ في جهازك');
    QBANK.router.go('#/');
  });

  // الحذف النهائي: تأكيد بكتابة كلمة صريحة — خطوة لا تُتراجَع
  const delBtn = el('button', { class:'btn btn--ghost btn--block', type:'button',
    style:'color:var(--bad);border-color:var(--bad)', text:'احذف حسابي نهائيًا' });
  delBtn.addEventListener('click', async () => {
    const word = (typeof prompt === 'function') ? prompt('سيُحذف حسابك وكل بياناتك نهائيًا ولا رجوع. اكتب «حذف» للتأكيد:') : null;
    if (word !== 'حذف') { QBANK.toast('أُلغي الحذف'); return; }
    const r = await QBANK.api.auth.deleteMe();
    if (r.ok) { await QBANK.data.clearAll(); QBANK.toast('حُذف حسابك وكل بياناته'); QBANK.router.go('#/'); }
    else QBANK.toast('تعذّر الحذف — تحقق من الاتصال');
  });

  return el('div', { class:'stack' }, [
    el('div', { class:'card stack' }, [
      el('p', { class:'page__sub num', text: u.email || '' }),
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'الاسم' }), nameInput
      ]),
      el('div', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'الصورة الرمزية' }), avatarRow
      ]),
      saveBtn
    ]),
    el('div', { class:'card' }, [ el('h2', { text:'تقدّمي' }), progList ]),
    el('div', { class:'card stack' }, [ syncBtn, outBtn, el('hr', { class:'divider', style:'margin:0' }), delBtn ])
  ]);

  لهذا هي هنا في الحساب لا في الإعدادات: انتماء لا تفضيل.

function campusCard(){
  const box = el('div', { class:'card' });
  const head = el('div', { class:'row', style:'justify-content:space-between;align-items:center;gap:8px' }, [
    el('h2', { style:'margin:0', text:'جامعتي' }), el('span', { id:'campusGo' })
  ]);
  const hint = el('p', { class:'field__hint', style:'margin:4px 0 12px',
    text:'اخترها مرة، فتفتح المنصة على قسم جامعتك وتُملأ خاناتها عند رفع أي مادة.' });
  const slot = el('div');
  box.appendChild(head); box.appendChild(hint); box.appendChild(slot);

  const draw = c => {
    slot.innerHTML = '';
    slot.appendChild(QBANK.campus.picker(c || {}, drawn => draw(drawn)));
    const go = head.querySelector('#campusGo');
    go.innerHTML = '';
    if (c && c.university_id)
      go.appendChild(el('a', { class:'btn btn--sm btn--soft',
        href: QBANK.campus.href(c.university_id), text:'افتح قسمي ←' }));
  };

  draw(QBANK.campus.cached());
  QBANK.campus.load().then(c => { if (slot.isConnected) draw(c); });
  return box;
}

/* ===== 33-admin.js ===== */
/*
  لوحة تحكم المشرف — قلب المشروع.
  البوابة الحقيقية هي قاعدة البيانات (RLS + is_admin)؛ الواجهة هنا مجرد مرآة:
  حتى لو عبث أحد بالمتصفح فلن يقرأ صفًا واحدًا ليس له.
*/
const Admin = {
  /* هل الجلسة الحالية لمشرف؟ نسأل قاعدة البيانات مرة ونخزّن الجواب للجلسة */
  async check(){
    if (!QBANK.api.user()) return false;
    const cached = QBANK.store.get('is_admin_check', null);
    if (cached && cached.uid === QBANK.api.user().id) return cached.ok;
    const r = await QBANK.api.myProfile();
    const ok = !!(r.ok && r.data && r.data.is_admin);
    QBANK.store.set('is_admin_check', { uid: QBANK.api.user().id, ok });
    return ok;
  },

  /* رابط دوال الخادم: على Vercel هو نفس الأصل، ومن file:// يضبطه المشرف مرة واحدة */
  apiBase(){
    const c = QBANK.store.get('api_base', '');
    if (c) return c.replace(/\/+$/,'');
    return (typeof location !== 'undefined' && location.protocol.indexOf('http') === 0) ? '' : null;
  },
  async server(path, body){
    const base = Admin.apiBase();
    const f = QBANK.api.fetchFn();
    if (base === null || !f) return { ok:false, offline:true };
    try{
      const res = await f(base + path, {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(body || {})
      });
      const data = await res.json().catch(() => null);
      return { ok: res.ok, status: res.status, data };
    } catch(e){ return { ok:false, offline:true, err:e.message }; }
  },

  /* ===== معالج الرفع — أربع خطوات، حالته قابلة للفحص بمعزل عن الواجهة ===== */
  // ٤٠ لا ٢٥: تعليمات النظام تُرسل مرة لكل دفعة، فالدفعة الأكبر توزّع كلفتها
  // على أسئلة أكثر. والسقف يبقى دون مهلة الخادم ويسمح باستئناف الرفع.
  BATCH: 40,
  chunk(arr, n){
    const out = [];
    for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    return out;
  },
  newWizard(){
    // strict افتراضًا: قاعدة القداسة هي الأصل، والتحسين اختيار صريح من الرافع
    // enrich=false افتراضًا: المسار المجاني هو الأصل، والإثراء اختيار واعٍ يُدفع ثمنه
    const w = { step:1, filename:'', subjectName:'', slug:'', mode:'strict', enrich:false,
                country:'', university:'', college:'', courseCode:'',
                raw:[], enriched:[], draftId:null, done:0, total:0, error:'' };
    /*
      ★ يرث انتماء الطالب عند الإنشاء لا عند الرسم.
      عند الرسم كان يُملأ في الخطوة الأولى وحدها، فمن استأنف مسوّدة أو قفز
      خطوة وجد الخانات فارغة. وإعادة كتابة اسم الجامعة ليست إزعاجًا فحسب:
      هي المصدر الأول لتهجئات مختلفة تفتّت الجامعة الواحدة إلى عدّة.
    */
    const mine = QBANK.campus ? QBANK.campus.cached() : null;
    if (mine && mine.university_id){
      w.country    = mine.country || '';
      w.university = mine.university || '';
      w.college    = mine.college || '';
    }
    return w;
  },
  // تقدير التكلفة قبل التشغيل: عدد الأسئلة والدفعات — يقرّر المشرف على بيّنة
  estimate(w){
    return { questions: w.raw.length, batches: Admin.chunk(w.raw, Admin.BATCH).length };
  },

  async wizardIngest(w, filename, base64){
    const r = await Admin.server('/api/ingest', { filename, content_base64: base64,
      subject_name: w.subjectName || '', sanctity_mode: w.mode || 'strict' });
    if (!r.ok) { w.error = (r.data && r.data.error) || 'تعذّر الاتصال بالخادم'; return w; }

    /*
      ★ الحارس الذي كان ناقصًا.
      كان المعالج يتقدّم مهما كان عدد الأسئلة — حتى صفرًا. فملفٌ لم يتعرّف
      عليه المحلّل يمرّ بصمت إلى «راجع» فيراها الطالب فارغة، ثم يضغط «انشر»
      فتُنشأ مادة بصفر أسئلة تظهر في «استكشف» ولا يفتحها أحد.
      وقع هذا فعلًا. الصمت هنا أسوأ من الفشل: الفشل يُصلَح، والصمت يُنشر.
    */
    const got = Array.isArray(r.data.questions) ? r.data.questions : [];
    if (!got.length) {
      w.error = 'لم نتعرّف على سؤال واحد في هذا الملف. تأكد أن كل سؤال يبدأ برقم، ' +
                'وأن خياراته في أسطر تبدأ بـ A) أو أ) — وانظر «قالب بنك الأسئلة» أسفل الصفحة.';
      w.raw = []; w.total = 0;
      return w;
    }

    w.filename = filename; w.raw = got; w.total = r.data.total;
    w.subjectName = w.subjectName || r.data.subject_name || '';
    w.slug = r.data.slug || '';
    w.step = 2; w.error = '';
    return w;
  },

  // «افهمه بالذكاء» على دفعات: المسوّدة تُحفظ بعد كل دفعة فيمكن إغلاق الصفحة والعودة
  /*
    المسار المجاني: نبني الأسئلة من المقسّم مباشرة بلا نداء ذكاء.
    ما ينقصها هو الشرح والترجمة وبطاقة الحفظ — والسؤال بلا إجابة معلنة
    يبقى بلا إجابة، فنوسمه ليصحّحه صاحبه بيده في المحرر.
  */
  plainEnrich(w){
    /*
      ★ حتى المسار المجاني لا يتقدّم بلا سؤال.
      «مجاني» يصف الثمن لا المحتوى: مادة بلا أسئلة ليست بنكًا مجانيًا،
      هي عطل. وبدون هذا السطر كانت raw الفارغة تمرّ إلى الخطوة ٣ صامتة.
    */
    if (!Array.isArray(w.raw) || !w.raw.length) {
      w.error = 'لا أسئلة في هذه المسوّدة — أعد رفع الملف من الخطوة الأولى.';
      return w;
    }
    w.enriched = w.raw.map(q => ({
      q: q.q, q_original: q.q, sanctity_mode: 'strict',
      options: q.has_options ? q.options.slice() : [String(q.answer_text || '—')],
      options_original: q.has_options ? q.options.slice() : [],
      answer: (q.has_options && typeof q.answer === 'number' && q.answer >= 0) ? q.answer : 0,
      derived: !(q.has_options && typeof q.answer === 'number' && q.answer >= 0),
      opts_built: !q.has_options,
      expl_ar:'', expl_en:'', translation:'', mnemonic:{}, topic:'', important:false
    }));
    w.done = w.total; w.step = 3; w.error = '';
    return w;
  },

  /* كم كوينًا يلزم لإثراء هذا الملف */
  creditsNeeded(w, costPerQ){
    return Math.max(0, (w.raw.length - w.done)) * Math.max(0, costPerQ || 1);
  },

  async wizardEnrich(w, onProgress){
    // المسار المجاني لا يمرّ بالخادم إطلاقًا — لا تكلفة ولا انتظار
    if (!w.enrich) { const r = Admin.plainEnrich(w); await Admin.saveDraft(r); return r; }

    const batches = Admin.chunk(w.raw, Admin.BATCH);
    for (let i = 0; i < batches.length; i++) {
      // لا إعادة معالجة لما اكتمل — الاستئناف يبدأ من حيث توقّف
      if (w.done >= (i + 1) * Admin.BATCH) continue;

      /*
        الحسم قبل النداء لا بعده. لو حسمنا بعده لكان كل انقطاع إثراءً مجانيًا،
        ولو تعطّل الخادم بعد الحسم رددنا الرصيد في السطر التالي.
      */
      const need = batches[i].length * (w.costPerQ || 1);
      const pay = await QBANK.api.rpc('spend_credits',
        { n: need, p_reason: 'إثراء ' + batches[i].length + ' سؤالًا', p_draft: w.draftId });
      if (!pay.ok || !pay.data || !pay.data.ok) {
        const d = (pay.data) || {};
        w.error = d.reason === 'insufficient'
          ? 'رصيدك ' + (d.balance || 0) + ' كوين ولا يكفي — يلزم ' + need
          : (d.reason === 'closed' ? 'الإثراء موقوف مؤقتًا' : 'تعذّر حسم الرصيد');
        w.needCoins = d.reason === 'insufficient' ? need - (d.balance || 0) : 0;
        return w;
      }

      const r = await Admin.server('/api/ai', { questions: batches[i], sanctity_mode: w.mode || 'strict' });
      if (!r.ok) {
        // الطالب لا يدفع ثمن عطل عندنا
        await QBANK.api.rpc('refund_credits', { n: need, p_reason: 'تعذّرت الدفعة', p_draft: w.draftId });
        w.error = (r.data && r.data.error) || 'انقطعت الدفعة ' + (i + 1) + ' — رُدّ رصيدها';
        return w;
      }
      w.enriched = w.enriched.concat(r.data.questions);
      w.done = Math.min(w.enriched.length, w.total);
      if (r.data.usage) w.usage = r.data.usage;
      await Admin.saveDraft(w);
      if (onProgress) onProgress(w.done, w.total);
    }
    if (w.done >= w.total) { w.step = 3; w.error = ''; }
    return w;
  },

  async saveDraft(w){
    const body = {
      name: w.subjectName || w.filename.replace(/\.[^.]+$/, ''),
      source_name: w.filename,
      status: w.done >= w.total ? 'reviewing' : 'processing',
      payload: w.enriched, total: w.total, done: w.done,
      updated_at: new Date().toISOString()
    };
    if (w.draftId) {
      return QBANK.api.rest('drafts?id=eq.' + w.draftId, { method:'PATCH', body: JSON.stringify(body) });
    }
    body.created_by = (QBANK.api.user() || {}).id;
    const r = await QBANK.api.rest('drafts?select=id', {
      method:'POST',
      headers: Object.assign(QBANK.api.headers(), { 'Prefer':'return=representation' }),
      body: JSON.stringify(body)
    });
    if (r.ok && r.data && r.data[0]) w.draftId = r.data[0].id;
    return r;
  },

  // الاعتماد: نداء واحد ذرّي في قاعدة البيانات — إما كل شيء أو لا شيء
  approve(w, publish){
    return QBANK.api.rpc('approve_draft', { draft_id: w.draftId, publish });
  },

  /*
    بعد الاعتماد نختم المادة بهوية رافعها: من رفعها، وبأي نمط، وبأي مسار.
    نداء منفصل عن approve_draft عمدًا كي لا نغيّر توقيع دالة معتمدة تعمل،
    وفشله لا يُبطل مادة أُنشئت — يبقى المشرف قادرًا على ضبط الباقي بيده.
  */
  async stamp(subjectId, w){
    if (!subjectId) return { ok:false };
    const u = QBANK.api.user() || {};
    const body = {
      created_by: u.id || null,
      sanctity_mode: w.mode === 'enhanced' ? 'enhanced' : 'strict',
      slug: w.slug || null,
      status: 'published',
      course_code: w.courseCode || ''
    };
    // الجامعة والكلية تُنشآن في الخادم إن لم تكونا موجودتين — والتطبيع يمنع التكرار
    if (w.country && w.university){
      const r = await QBANK.api.rpc('ensure_university', { p_country: w.country, p_name: w.university });
      if (r.ok && r.data && typeof r.data === 'string'){
        body.university_id = r.data;
        if (w.college){
          const c = await QBANK.api.rpc('ensure_college', { p_university: r.data, p_name: w.college });
          if (c.ok && c.data && typeof c.data === 'string') body.college_id = c.data;
        }
      }
    }
    return QBANK.api.rest('subjects?id=eq.' + subjectId, { method:'PATCH', body: JSON.stringify(body) });
  },

  // كشف المكرر بتشابه نصي بسيط: نفس الأحرف الدنيا بعد إزالة الفراغات — يوسم لا يحذف
  findDuplicates(questions){
    const seen = new Map(), dups = [];
    questions.forEach((q, i) => {
      const key = String(q.q || '').toLowerCase().replace(/\s+/g, ' ').trim();
      if (seen.has(key)) dups.push({ index: i, firstIndex: seen.get(key) });
      else seen.set(key, i);
    });
    return dups;
  }
};

      }

      const tbl = el('div', { class:'ad-table' }, list.map(r => {

          el('span', { class:'ad-feed__av', text: r.avatar || '👤' }),
          el('span', { class:'ad-row__main' }, [

            el('span', { class:'ad-row__s', text: r.attempts + ' اختبار' })

          const det = el('div', { class:'ad-sub' },

        if (r.ok) QBANK.router.render('#/admin/content');
      });

        value: sub.exam_date ? String(sub.exam_date).slice(0,10) : '', 'aria-label':'موعد اختبار ' + sub.name });
      dateIn.addEventListener('change', async () => {

        QBANK.toast('حُفظ الموعد');

      const freeBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button',
        text: sub.free ? '★ مجانية' : 'اجعلها مجانية' });
      freeBtn.addEventListener('click', async () => {
        await QBANK.api.rest('subjects?id=eq.' + sub.id,

          el('span', { class:'ad-row__t', text: sub.name }),
          el('span', { class:'ad-row__s', text: sub.q_count + ' سؤالًا' })
        ]),
        sub.published ? el('span', { class:'badge badge--ok', text:'منشورة' })

        el('a', { class:'btn btn--sm btn--soft', href:'#/admin/subject/' + sub.id, text:'حرّر' }),
        pubBtn,
        el('span', { class:'ad-sub', style:'flex:1 0 100%' }, [
          el('label', { class:'ad-inline' }, [
            el('span', { class:'ad-inline__l', text:'موعد الاختبار' }), dateIn ]),
          freeBtn
        ])
      ]));
    });
    listBox.appendChild(adminPanel('المواد', subjects.length + ' مادة على المنصة', subTable));
  });

/*
  معالج رفع الأسئلة — أربع خطوات ظاهرة للمشرف:
  ١ اقرأ الملف · ٢ افهمه بالذكاء · ٣ راجِع · ٤ انشر.
  المنطق في QBANK.admin (قابل للفحص)؛ هنا الواجهة فقط.

let wizard = null;   // حالة المعالج تعيش بين إعادة الرسم داخل الجلسة

function stepsBar(current){
  const names = ['اقرأ الملف','افهمه بالذكاء','راجِع','انشر'];
  return el('ol', { class:'steps' }, names.map((n, i) =>
    el('li', { class:'steps__item' + (i + 1 === current ? ' is-on' : '') + (i + 1 < current ? ' is-done' : ''),
      'aria-current': i + 1 === current ? 'step' : null }, [
      el('span', { class:'steps__num num', text: String(i + 1) }),
      el('span', { text: n })
    ])));
}

/* اسم المادة ونمط المعالجة — يُختاران قبل الرفع لأنهما يغيّران البرومبت نفسه */
function subjectMeta(){
  const nameIn = el('input', { class:'input', id:'subjName', value: wizard.subjectName || '',
    placeholder:'مثال: فيزيولوجيا الجهاز التنفسي' });
  nameIn.addEventListener('input', () => { wizard.subjectName = nameIn.value; });

  const modes = [
    { id:'strict',   t:'التزم بالنص الحرفي',
      d:'لا يُغيَّر حرف من السؤال ولا من الخيارات. الذكاء يضيف الشرح والترجمة وبطاقة الحفظ فقط. هذا الوضع الافتراضي.' },
    { id:'enhanced', t:'حسّن الصياغة بالذكاء',
      d:'يصحَّح الإملاء وتُوضَّح الصياغة دون تغيير المعنى ولا الإجابة. النص الأصلي يبقى محفوظًا ويمكن عرضه دائمًا.' }
  ];
  const wrap = el('div', { class:'stack', role:'radiogroup', 'aria-label':'نمط المعالجة' },
    modes.map(m => {
      const b = el('button', { class:'card modecard', type:'button', role:'radio', 'data-mode':m.id,
        'aria-checked': (wizard.mode || 'strict') === m.id ? 'true' : 'false' }, [
        el('span', { class:'modecard__t', text:m.t }),
        el('span', { class:'modecard__d', text:m.d })
      ]);
      b.addEventListener('click', () => {
        wizard.mode = m.id;
        wrap.querySelectorAll('[data-mode]').forEach(x =>
          x.setAttribute('aria-checked', x.getAttribute('data-mode') === m.id ? 'true' : 'false'));
      });
      return b;
    }));

  /* أين تُدرَّس؟ — بلا هذا تضيع المادة في بحر المنصة ولا يجدها من يحتاجها.
     نكتب الاسم ولا نختار من قائمة: الجامعات العربية أكثر من أن تُحصى سلفًا،
     والخادم يوحّد الإملاء فلا تنقسم الجامعة الواحدة إلى عشر. */
  /*
    ★ الملء التلقائي من انتماء الطالب.
    من حدّد جامعته في حسابه لا يعيد كتابتها مع كل مادة — وإعادة الكتابة
    ليست مجرد إزعاج: هي المصدر الأول لتهجئات مختلفة تفتّت الجامعة الواحدة.
    ولا نطمس ما كتبه بيده: نملأ الفارغ فقط.
  */
  const mine = QBANK.campus ? QBANK.campus.cached() : null;
  if (mine && mine.university_id){
    if (!wizard.country)    wizard.country    = mine.country || '';
    if (!wizard.university) wizard.university = mine.university || '';
    if (!wizard.college)    wizard.college    = mine.college || '';
  }

  const countryIn = el('select', { class:'input', 'aria-label':'الدولة' });
  countryIn.appendChild(el('option', { value:'', text:'— اختر الدولة —' }));
  Object.keys(QBANK.explore ? { SA:1,EG:1,JO:1,AE:1,KW:1,QA:1,BH:1,OM:1,IQ:1,MA:1,DZ:1,TN:1,SD:1,YE:1,LY:1,SY:1,LB:1,PS:1 } : {})
    .forEach(c => countryIn.appendChild(el('option', { value:c, text: QBANK.explore.countryName(c) })));
  countryIn.value = wizard.country || '';
  countryIn.addEventListener('change', () => { wizard.country = countryIn.value; });

  const uniIn = el('input', { class:'input', value: wizard.university || '',
    placeholder:'مثال: جامعة نجران', list:'uniList' });
  uniIn.addEventListener('input', () => { wizard.university = uniIn.value; });

  const colIn = el('input', { class:'input', value: wizard.college || '',
    placeholder:'مثال: كلية العلوم الطبية التطبيقية' });
  colIn.addEventListener('input', () => { wizard.college = colIn.value; });

  const codeIn = el('input', { class:'input', dir:'ltr', value: wizard.courseCode || '',
    placeholder:'EMS 301' });
  codeIn.addEventListener('input', () => { wizard.courseCode = codeIn.value; });

  return el('div', { class:'card stack' }, [
    el('label', { class:'field', style:'margin:0' }, [
      el('span', { class:'field__label', text:'اسم المادة' }), nameIn ]),
    el('div', { class:'ad-edit ad-edit--2' }, [
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'الدولة' }), countryIn ]),
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'الجامعة' }), uniIn ]),
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'الكلية' }), colIn ]),
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'رمز المقرر — اختياري' }), codeIn ])
    ]),
    el('p', { class:'field__hint', style:'margin:0',
      text:'هذه البيانات هي ما يجعل زميلك في جامعتك يجد مادتك. اكتبها ولو تقريبية.' }),
    el('span', { class:'field__label', text:'كيف نعالج أسئلتك؟' }),
    wrap
  ]);
}

/* ═══ دليل التنسيق: قالبان جاهزان وفاحص فوري ═══
   الطالب اليوم يكتشف أن ملفه غير مفهوم بعد الرفع والانتظار. هنا يعرف قبلها. */
function formatGuide(){
  const box = el('details', { class:'fmt' });
  box.appendChild(el('summary', { class:'fmt__sum' }, [
    el('span', { text:'كيف أجهّز ملفي؟' }),
    el('span', { class:'fmt__hint', text:'قالبان جاهزان وفاحص فوري' })
  ]));

  const body = el('div', { class:'fmt__body' });

  // ما يحدث للملف — خطوات لا وعود
  body.appendChild(el('ol', { class:'fmt__pipe' }, QBANK.formats.pipeline.map((p, i) =>
    el('li', {}, [
      el('span', { class:'fmt__pn num', text: QBANK.views.arNum(i + 1) }),
      el('span', {}, [
        el('b', { text: p[0] }),
        el('span', { class:'fmt__pd', text: p[1] })
      ])
    ]))));

  // القالبان
  QBANK.formats.list.forEach(f => {
    const pre = el('pre', { class:'fmt__code', dir:'auto' }, [ el('code', { text: f.sample }) ]);
    const copy = el('button', { class:'btn btn--sm', type:'button', text:'انسخ القالب' });
    copy.addEventListener('click', () => {
      const done = (navigator.clipboard && navigator.clipboard.writeText)
        ? (navigator.clipboard.writeText(f.sample), true)
        : (function(){ try{
              const ta = document.createElement('textarea'); ta.value = f.sample;
              document.body.appendChild(ta); ta.select();
              const r = document.execCommand('copy'); ta.remove(); return r;
            } catch(e){ return false; } })();
      QBANK.toast(done ? 'نُسخ القالب — الصقه في ملفك' : 'حدّد النص وانسخه يدويًا');
    });
    body.appendChild(el('section', { class:'fmt__card', 'data-fmt': f.id }, [
      el('h3', { class:'fmt__t', text: f.title }),
      el('p', { class:'fmt__when', text: f.when }),
      el('ul', { class:'fmt__rules' }, f.rules.map(r => el('li', { text: r }))),
      pre,
      el('div', { class:'row' }, [ copy ])
    ]));
  });

  // الفاحص: يلصق الطالب جزءًا من ملفه فيرى النتيجة فورًا
  const ta = el('textarea', { class:'input', rows:'4',
    placeholder:'الصق هنا سؤالين أو ثلاثة من ملفك…', 'aria-label':'فاحص التنسيق' });
  const out = el('p', { class:'fmt__out', role:'status' });
  ta.addEventListener('input', () => {
    const v = ta.value.trim();
    if (!v){ out.textContent = ''; out.className = 'fmt__out'; return; }
    const r = QBANK.formats.check(v);
    if (!r.ok){
      out.className = 'fmt__out is-no';
      out.textContent = 'لم نتعرّف على سؤال واحد. تأكد أن كل سؤال يبدأ برقمه ثم نقطة، مثل ‎1.‎';
      return;
    }
    out.className = 'fmt__out is-ok';
    out.textContent = 'وجدنا ' + QBANK.views.arNum(r.questions) + ' سؤالًا · '
      + QBANK.views.arNum(r.withOptions) + ' بخيارات · '
      + QBANK.views.arNum(r.withAnswer) + ' بإجابة معروفة';
  });
  body.appendChild(el('section', { class:'fmt__card fmt__card--check' }, [
    el('h3', { class:'fmt__t', text:'افحص تنسيقك الآن' }),
    el('p', { class:'fmt__when', text:'الصق جزءًا من ملفك — لا يُرفع شيء، الفحص في جهازك.' }),
    ta, out
  ]));

  box.appendChild(body);
  return box;
}

/* الخطوة ١: سحب وإفلات أو اختيار ملف */
function stepRead(box, rerender){
  box.appendChild(subjectMeta());
  box.appendChild(formatGuide());
  const drop = el('div', { class:'drop', tabindex:'0', role:'button', 'aria-label':'اختر ملف أسئلة' }, [
    el('span', { class:'empty__ico', 'aria-hidden':'true', text:'⇪' }),
    el('p', { class:'empty__title', text:'أسقط ملف الأسئلة هنا أو اضغط للاختيار' }),
    el('p', { class:'empty__text', text:'PDF أو DOCX أو TXT — حتى ١٥ ميغابايت. يفهم شكلين: خيارات A-D، وقوائم سؤال-ثم-إجابة.' })
  ]);
  const fileIn = el('input', { type:'file', accept:'.pdf,.docx,.txt', style:'display:none', 'aria-hidden':'true' });
  const msg = el('p', { class:'field__hint', role:'status' });

  async function handle(file){
    if (!file) return;
    msg.textContent = 'جارٍ قراءة «' + file.name + '»…';
    const b64 = await new Promise(resolve => {
      const rd = new FileReader();
      rd.onload = () => resolve(String(rd.result).split(',')[1] || '');
      rd.readAsDataURL(file);
    });
    wizard = await QBANK.admin.wizardIngest(wizard, file.name, b64);
    if (wizard.error) { msg.textContent = '⚠ ' + wizard.error; return; }
    rerender();
  }
  drop.addEventListener('click', () => fileIn.click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileIn.click(); });
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('is-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('is-over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('is-over'); handle(e.dataTransfer.files[0]); });
  fileIn.addEventListener('change', () => handle(fileIn.files[0]));

  box.appendChild(drop); box.appendChild(fileIn); box.appendChild(msg);
}

/* الخطوة ٢: التقدير ثم التشغيل بدفعات مع شريط «٨٠ من ٣٠٠» */
function stepEnrich(box, rerender){
  const est = QBANK.admin.estimate(wizard);
  const bar = el('div', { class:'meter', role:'progressbar', 'aria-valuemin':'0',
    'aria-valuemax': String(wizard.total), 'aria-valuenow': String(wizard.done) }, [
    el('div', { class:'meter__fill', style:'width:' + (wizard.total ? wizard.done / wizard.total * 100 : 0) + '%' })
  ]);
  const label = el('p', { class:'page__sub num', text: wizard.done + ' من ' + wizard.total });
  const msg = el('p', { class:'field__hint', role:'status' });
  const go = el('button', { class:'btn btn--block', type:'button',
    text: wizard.done ? 'أكمل من حيث توقفت (' + wizard.done + ')' : 'شغّل الذكاء الآن' });

  go.addEventListener('click', async () => {
    go.setAttribute('aria-disabled','true'); go.textContent = 'جارٍ المعالجة…';
    wizard = await QBANK.admin.wizardEnrich(wizard, (done, total) => {
      label.textContent = done + ' من ' + total;
      bar.setAttribute('aria-valuenow', String(done));
      bar.firstChild.style.width = (done / total * 100) + '%';
    });
    if (wizard.error) { msg.textContent = '⚠ ' + wizard.error + ' — المحفوظ لا يضيع، أعد المحاولة.'; go.removeAttribute('aria-disabled'); go.textContent = 'أعد المحاولة'; return; }
    rerender();
  });

  /*
    مساران، والفرق بينهما معروض لا مخبوء.
    الطالب لا يعرف ما «الإثراء» حتى يرى ماذا ينقصه بدونه — فنقوله بالأسماء.
  */
  const withoutOpts = wizard.raw.filter(q => !q.has_options).length;
  const noAnswer = wizard.raw.filter(q =>
    !(q.has_options && typeof q.answer === 'number' && q.answer >= 0) && !q.answer_text).length;

  const paths = el('div', { class:'paths', role:'radiogroup', 'aria-label':'طريقة المعالجة' });
  const creditBox = el('div', { class:'costbox', hidden:true });
  const N = QBANK.views.arNum;

  function paint(credits){
    const cost = QBANK.admin.creditsNeeded(wizard, (credits && credits.cost_per_q) || 1);
    const bal = (credits && credits.balance) || 0;
    const enough = bal >= cost;
    wizard.costPerQ = (credits && credits.cost_per_q) || 1;

    paths.innerHTML = '';
    [
      { id:false, t:'انشر بلا إثراء', price:'مجانًا',
        d:'أسئلتك وخياراتها كما وصلت، جاهزة للمراجعة والاختبار حالًا.',
        miss: 'بلا شرح لكل إجابة، ولا ترجمة، ولا بطاقات حفظ'
              + (noAnswer ? '. و' + N(noAnswer) + ' سؤالًا بلا إجابة معلنة في ملفك ستحتاج ضبطها بيدك' : '') },
      { id:true, t:'انشر مع الإثراء', price: N(cost) + ' كوين',
        d:'شرح لكل إجابة، وترجمة عربية، وبطاقة حفظ، وتصنيف بالمحاور.',
        miss: noAnswer ? 'ويستنتج الذكاء إجابات ' + N(noAnswer) + ' سؤالًا لم تُعلَن في ملفك'
                       : 'وكل أسئلتك فيها إجاباتها أصلًا — فلن يُغيّر الذكاء إجابة واحدة' }
    ].forEach(o => {
      const on = wizard.enrich === o.id;
      const blocked = o.id && !enough;
      const b = el('button', { class:'path' + (on ? ' is-on' : '') + (blocked ? ' is-blocked' : ''),
        type:'button', role:'radio', 'data-path': String(o.id),
        'aria-checked': on ? 'true' : 'false' }, [
        el('span', { class:'path__h' }, [
          el('span', { class:'path__t', text:o.t }),
          el('span', { class:'path__p num', text:o.price })
        ]),
        el('span', { class:'path__d', text:o.d }),
        el('span', { class:'path__m', text:o.miss })
      ]);
      b.addEventListener('click', () => {
        if (blocked) return;
        wizard.enrich = o.id;
        paint(credits);
      });
      paths.appendChild(b);
    });

    creditBox.hidden = !wizard.enrich;
    creditBox.innerHTML = '';
    if (wizard.enrich){
      creditBox.appendChild(el('span', { class:'costbox__l', text:'رصيدك' }));
      creditBox.appendChild(el('span', { class:'costbox__n num',
        text: N(bal) + ' كوين' + (enough ? '' : ' — لا يكفي') }));
      creditBox.appendChild(el('span', { class:'costbox__s',
        text: enough ? 'سيتبقى لك ' + N(bal - cost) + ' كوين بعد الإثراء.'
                     : 'ينقصك ' + N(cost - bal) + ' كوين لإثراء هذا الملف.' }));
      if (!enough)
        creditBox.appendChild(el('a', { class:'btn btn--sm', href:'#/account', text:'اشحن رصيدك' }));
    }
    go.textContent = wizard.done ? 'أكمل من حيث توقفت (' + wizard.done + ')'
                    : (wizard.enrich ? 'أثرِ وانشر' : 'انشر بلا إثراء');
    go.setAttribute('aria-disabled', (wizard.enrich && !enough) ? 'true' : 'false');
  }

  paint(null);
  QBANK.api.rpc('my_credits').then(r => {
    if (!paths.isConnected) return;
    if (r.ok && r.data && !r.data.error) paint(r.data);
  });

  box.appendChild(el('div', { class:'card stack' }, [
    el('h2', { text:'كيف ننشرها؟' }),
    el('div', { class:'row' }, [
      el('span', { class:'badge num', text: est.questions + ' سؤالًا' }),
      withoutOpts ? el('span', { class:'badge badge--warn num',
        text: N(withoutOpts) + ' بلا خيارات' }) : null,
      el('span', { class:'badge', text:'المسوّدة تُحفظ بعد كل دفعة' })
    ]),
    paths, creditBox, bar, label, go, msg
  ]));
}

/* الخطوة ٣: المراجعة — بطاقة لكل سؤال، تغيير الإجابة بضغطة، وسوم حمراء للمستنتَج */
function stepReview(box, rerender){
  /*
    ★ لا نشر بلا سؤال واحد.
    كانت الشاشة تُرسم فارغة ويبقى زر «تابع للنشر» تحتها، فيُنشر بنك خالٍ.
    والحارس هنا ليس تكرارًا لحارس الاستيراد: مسوّدة قديمة محفوظة قد تصل
    إلى هنا فارغة من طريق آخر — وكل باب إلى النشر يحتاج قفله.
  */
  if (!wizard.enriched || !wizard.enriched.length) {
    box.appendChild(QBANK.views.empty('⚠', 'لا أسئلة في هذه المسوّدة',
      'لم يصل شيء من خطوة القراءة. ارجع وارفع الملف مرة أخرى — وتأكد أن تنسيقه يطابق القالب.'));
    const back = el('button', { class:'btn btn--block', type:'button', text:'← ارجع وارفع ملفًا آخر' });
    back.addEventListener('click', () => {
      wizard.step = 1; wizard.raw = []; wizard.enriched = []; wizard.total = 0;
      wizard.error = ''; rerender();
    });
    box.appendChild(back);
    return;
  }

  const dups = QBANK.admin.findDuplicates(wizard.enriched);
  const dupSet = new Set(dups.map(d => d.index));
  if (dups.length) box.appendChild(el('p', { class:'row' }, [
    el('span', { class:'badge badge--warn num', text: 'تنبيه: ' + dups.length + ' سؤالًا مكررًا — موسوم لا محذوف' })
  ]));

  wizard.enriched.forEach((q, qi) => {
    const opts = el('div', { class:'stack q__opts' }, q.options.map((opt, oi) => {
      const b = el('button', { class:'opt' + (q.answer === oi ? ' is-answer' : ''), type:'button' }, [
        el('span', { class:'opt__mark', 'aria-hidden':'true', text: q.answer === oi ? '✓' : '' }),
        el('span', { class:'ltr', text: opt })
      ]);
      // المشرف يغيّر الإجابة بضغطة على أي خيار — والتغيير يمسح وسم «مستنتجة»
      b.addEventListener('click', () => { q.answer = oi; q.derived = false; rerender(); });
      return b;
    }));
    const badges = el('div', { class:'row' }, [
      el('span', { class:'badge num', text:'س' + (qi + 1) }),
      q.derived ? el('span', { class:'badge badge--bad', text:'⚠ إجابة مستنتجة' }) : null,
      q.opts_built ? el('span', { class:'badge badge--bad', text:'⚠ خيارات مبنية' }) : null,
      dupSet.has(qi) ? el('span', { class:'badge badge--warn', text:'مكرر' }) : null,
      q.topic ? el('span', { class:'badge', text: q.topic }) : null
    ]);
    const impBtn = el('button', { class:'btn btn--sm ' + (q.important ? 'btn--soft' : 'btn--ghost'), type:'button',
      text: q.important ? '★ مهم' : 'وسمه مهمًا' });
    impBtn.addEventListener('click', () => { q.important = !q.important; rerender(); });
    box.appendChild(el('article', { class:'card stack q' }, [
      badges,
      el('p', { class:'ltr q__text', text: q.q }),
      opts,
      el('div', { class:'row' }, [ impBtn ])
    ]));
  });

  const next = el('button', { class:'btn btn--block', type:'button', text:'راجعتُ الكل — تابع للنشر' });
  next.addEventListener('click', async () => { wizard.step = 4; await QBANK.admin.saveDraft(wizard); rerender(); });
  box.appendChild(next);
}

/* الخطوة ٤: زران — اعتماد ذرّي أو حفظ مخفي */
function stepPublish(box){
  // ★ آخر قفل قبل القاعدة — والقاعدة نفسها تحرس أيضًا (approve_draft)
  if (!wizard.enriched || !wizard.enriched.length) {
    box.appendChild(QBANK.views.empty('⚠', 'لا شيء يُنشر',
      'هذه المسوّدة بلا أسئلة. أعد رفع الملف من الخطوة الأولى.'));
    return;
  }
  const derived = wizard.enriched.filter(q => q.derived).length;

  /*
    لغة التحليل الشامل — الرافع يختار. العربية الافتراض (نمط AMSU: أسئلة
    إنجليزية وشرح عربي)، ومن يريد ماله كله بالإنجليزية فخياره محفوظ.
  */
  wizard.analysisLang = wizard.analysisLang || 'ar';
  const langRow = el('div', { class:'row', role:'group', 'aria-label':'لغة التحليل' }, [
    el('span', { class:'field__hint', text:'لغة الشرح والتحليل:' })
  ]);
  [['ar','عربي'],['en','English']].forEach(([v, label]) => {
    const b = el('button', { class:'btn btn--sm ' + (wizard.analysisLang === v ? 'btn--soft' : 'btn--ghost'),
      type:'button', 'data-lang': v, 'aria-pressed': String(wizard.analysisLang === v), text: label });
    b.addEventListener('click', () => {
      wizard.analysisLang = v;
      langRow.querySelectorAll('[data-lang]').forEach(x => {
        const on = x.getAttribute('data-lang') === v;
        x.className = 'btn btn--sm ' + (on ? 'btn--soft' : 'btn--ghost');
        x.setAttribute('aria-pressed', String(on));
      });
    });
    langRow.appendChild(b);
  });

  const pub = el('button', { class:'btn btn--block', type:'button', text:'اعتمد وانشر للطلاب' });
  const hide = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'احفظ مخفية' });
  const msg = el('p', { class:'field__hint', role:'status' });
  async function fire(publish){
    const r = await QBANK.admin.approve(wizard, publish);
    if (!r.ok)
      return void (msg.textContent = '⚠ ' + ((r.data && r.data.message) || 'تعذّر الاعتماد — لم يتغير شيء في قاعدة البيانات.'));
    // approve_draft تُرجع معرّف المادة — نختمها بهوية رافعها ونمطه ومساره
    const newId = (typeof r.data === 'string') ? r.data : (r.data && r.data.id) || null;
    const w = wizard;
    await QBANK.admin.stamp(newId, w);
    /*
      ★ نُجدّد قائمة المواد قبل أن نُري الرابط.
      القائمة تُجلب مرة عند الإقلاع وتعيش في التخزين المحلي، فالمادة التي
      نُشرت قبل ثانية ليست فيها. وكنّا نعطي الرافع زر «افتح المادة» يقوده
      إلى «المادة غير موجودة» — وهي موجودة، وهو من أنشأها. لا شيء يُحبط
      الرافع مثل أن تختفي مادته لحظة نشرها.
    */
    if (publish) { try { await QBANK.data.refreshPack(); } catch(e){ /* الشاشة تُجدّد لاحقًا */ } }
    QBANK.toast(publish ? 'نُشرت المادة' : 'حُفظت مخفية');
    if (publish && newId && w.slug){
      // رابط المشاركة يظهر فورًا: هذه هي اللحظة التي يشارك فيها الطالب مادته
      wizard = null;
      return void showShare(box, w.slug, w.subjectName, newId, w.analysisLang || 'ar');
    }
    wizard = null;
    QBANK.router.go(QBANK.store.get('is_admin_check', {}).ok ? '#/admin/content' : '#/account');
  }
  pub.addEventListener('click', () => fire(true));
  hide.addEventListener('click', () => fire(false));
  /*
    ★ كشف المكرر قبل النشر لا بعده.
    عشر نسخ من مقرّر واحد تُفتّت التقييمات وتشتّت الطالب: أيّها أكمل؟
    فنُري الرافع ما هو موجود في جامعته باسم قريب، ونتركه يقرّر — لا نمنعه،
    لأن «مبادئ الإدارة ١» قد لا تكون «مبادئ الإدارة ٢» رغم تشابه الاسم.
  */
  const dup = el('div', { hidden:true });
  box.appendChild(dup);
  if (QBANK.trust && wizard.subjectName)
    QBANK.trust.similar(wizard.subjectName, null).then(r => {
      if (!dup.isConnected) return;
      const rows = (r.ok && Array.isArray(r.data)) ? r.data : [];
      if (!rows.length) return;
      dup.hidden = false;
      dup.className = 'card stack dupwarn';
      dup.appendChild(el('h3', { style:'margin:0', text:'⚠ يوجد ما يشبهها في جامعتك' }));
      dup.appendChild(el('p', { class:'field__hint', style:'margin:0',
        text:'افتحها أولًا — إن كانت هي نفسها فأضف أسئلتك إليها بدل نسخة ثانية. وإن كانت مقرّرًا آخر فأكمل نشرك.' }));
      rows.forEach(x => dup.appendChild(el('a', { class:'dupwarn__row', href:'#s/' + (x.slug || '') }, [
        el('span', { class:'dupwarn__n', text: x.name }),
        el('span', { class:'badge num', text: (x.q_count || 0) + ' سؤالًا' }),
        x.verified ? el('span', { class:'badge badge--ok', text:'✓ موثّقة' }) : null,
        x.rating_n ? el('span', { class:'badge badge--star num',
          text: QBANK.trust.starsText(x.rating_avg, x.rating_n) }) : null
      ])));
    });

  box.appendChild(el('div', { class:'card stack' }, [
    el('h2', { text:'الاعتماد' }),
    el('p', { class:'page__sub num', text: wizard.total + ' سؤالًا جاهزًا' +
      (derived ? ' — منها ' + derived + ' بإجابة مستنتجة راجعتَها' : '') }),
    el('p', { class:'field__hint', text:'الاعتماد عملية ذرّية: إما تُنشأ المادة وكل أسئلتها أو لا يتغير شيء.' }),
    langRow, pub, hide, msg
  ]));
}

/* شاشة ما بعد النشر: الرابط وزر النسخ — لا يُترك الطالب يبحث عن مادته */
function showShare(box, slug, name, newId, analysisLang){
  const u = QBANK.api.user() || {};
  box.innerHTML = '';

  /*
    ★ التحليل الشامل يبدأ هنا — بعد النشر لا قبله.
    لو حجزنا زرّ النشر حتى يكتمل التحليل (نصف دقيقة أحيانًا) لظنّ الرافع
    أن النشر علق. المادة تُنشر فورًا، والتحليل يلحقها، وسطرُ الحالة يصدُق
    معه: يجري ← اكتمل بمحاوره ← أو تعذّر مع «سيُعاد تلقائيًا عند فتح مادتك».
  */
  const aLine = el('p', { class:'field__hint', role:'status',
    text: QBANK.analysis ? '🧠 يجري تحليل مادتك: النظرة العامة وطريقة الحفظ والأخطاء الشائعة…' : '' });
  if (QBANK.analysis && newId)
    QBANK.analysis.generate(newId, analysisLang).then(r => {
      if (!aLine.isConnected) return;
      if (r.ok && r.data && r.data.ok){
        const n = (r.data.topics || []).length;
        aLine.textContent = '✓ اكتمل التحليل — ' + QBANK.views.arNum(n) +
          ' محاور وطريقة حفظ وأخطاء شائعة. كلها في صفحة مادتك.';
      } else {
        aLine.textContent = '⚠ تعذّر التحليل الآن — سيُعاد تلقائيًا أول ما تفتح صفحة مادتك.';
      }
    });

  box.appendChild(el('div', { class:'card stack', style:'text-align:center' }, [
    el('span', { class:'empty__ico', 'aria-hidden':'true', text:'✓' }),
    el('p', { class:'empty__title', text:'نُشرت «' + (name || 'مادتك') + '»' }),
    el('p', { class:'empty__text', text:'شاركها مع زملائك — كل شراء عبر رابطك يضيف كوينز لرصيدك.' }),
    aLine,
    QBANK.share.copyRow(QBANK.share.shareUrl(slug, u.id)),
    el('a', { class:'btn btn--block', href:'#s/' + slug, text:'افتح صفحة المادة' }),
    el('a', { class:'btn btn--ghost btn--block', href:'#/account', text:'محفظتي' })
  ]));
}
