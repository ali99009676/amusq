/*
  معالج رفع الأسئلة — أربع خطوات ظاهرة للمشرف:
  ١ اقرأ الملف · ٢ افهمه بالذكاء · ٣ راجِع · ٤ انشر.
  المنطق في QBANK.admin (قابل للفحص)؛ هنا الواجهة فقط.
*/
let wizard = null;   // حالة المعالج تعيش بين إعادة الرسم داخل الجلسة

function stepsBar(current){
  const names = ['اقرأ الملف','افهمه بالذكاء','راجِع','انشر'];
  return el('ol', { class:'steps' }, names.map((n, i) =>
    el('li', { class:'steps__item' + (i + 1 === current ? ' is-on' : '') + (i + 1 < current ? ' is-done' : ''),
      'aria-current': i + 1 === current ? 'step' : null }, [
      el('span', { class:'steps__num num', text: String(i + 1) }),
      el('span', { text: n })
    ])));
}

/* اسم المادة ونمط المعالجة — يُختاران قبل الرفع لأنهما يغيّران البرومبت نفسه */
function subjectMeta(){
  /*
    ★ الاسم مطلوب — وكان يُشتقّ من اسم الملف عند غيابه.
    فخرجت في المنصة موادُّ اسمها «Document1» و«نسخة نهائية 2» و«WhatsApp
    Image». الطالب لا يبحث بهذه الأسماء ولا يفتحها، فتُدفن مادةٌ نافعة
    بسبب حقلٍ تُرك فارغًا. والاسم هو أول ما يُرى وآخر ما يُتذكَّر.
  */
  const nameIn = el('input', { class:'input', id:'subjName', value: wizard.subjectName || '',
    required:'', 'aria-required':'true',
    placeholder:'مثال: فيزيولوجيا الجهاز التنفسي' });
  const nameMsg = el('p', { class:'field__hint', role:'status' });
  nameIn.addEventListener('input', () => {
    wizard.subjectName = nameIn.value;
    if (nameIn.value.trim()) nameMsg.textContent = '';
  });

  const modes = [
    { id:'strict',   t:'التزم بالنص الحرفي',
      d:'لا يُغيَّر حرف من السؤال ولا من الخيارات. الذكاء يضيف الشرح والترجمة وبطاقة الحفظ فقط. هذا الوضع الافتراضي.' },
    { id:'enhanced', t:'حسّن الصياغة بالذكاء',
      d:'يصحَّح الإملاء وتُوضَّح الصياغة دون تغيير المعنى ولا الإجابة. النص الأصلي يبقى محفوظًا ويمكن عرضه دائمًا.' }
  ];
  const wrap = el('div', { class:'stack', role:'radiogroup', 'aria-label':'نمط المعالجة' },
    modes.map(m => {
      const b = el('button', { class:'card modecard', type:'button', role:'radio', 'data-mode':m.id,
        'aria-checked': (wizard.mode || 'strict') === m.id ? 'true' : 'false' }, [
        el('span', { class:'modecard__t', text:m.t }),
        el('span', { class:'modecard__d', text:m.d })
      ]);
      b.addEventListener('click', () => {
        wizard.mode = m.id;
        wrap.querySelectorAll('[data-mode]').forEach(x =>
          x.setAttribute('aria-checked', x.getAttribute('data-mode') === m.id ? 'true' : 'false'));
      });
      return b;
    }));

  /* أين تُدرَّس؟ — بلا هذا تضيع المادة في بحر المنصة ولا يجدها من يحتاجها.
     نكتب الاسم ولا نختار من قائمة: الجامعات العربية أكثر من أن تُحصى سلفًا،
     والخادم يوحّد الإملاء فلا تنقسم الجامعة الواحدة إلى عشر. */
  /*
    ★ الملء التلقائي من انتماء الطالب.
    من حدّد جامعته في حسابه لا يعيد كتابتها مع كل مادة — وإعادة الكتابة
    ليست مجرد إزعاج: هي المصدر الأول لتهجئات مختلفة تفتّت الجامعة الواحدة.
    ولا نطمس ما كتبه بيده: نملأ الفارغ فقط.
  */
  const mine = QBANK.campus ? QBANK.campus.cached() : null;
  if (mine && mine.university_id){
    if (!wizard.country)    wizard.country    = mine.country || '';
    if (!wizard.university) wizard.university = mine.university || '';
    if (!wizard.college)    wizard.college    = mine.college || '';
  }

  const countryIn = el('select', { class:'input', 'aria-label':'الدولة' });
  countryIn.appendChild(el('option', { value:'', text:'— اختر الدولة —' }));
  Object.keys(QBANK.explore ? { SA:1,EG:1,JO:1,AE:1,KW:1,QA:1,BH:1,OM:1,IQ:1,MA:1,DZ:1,TN:1,SD:1,YE:1,LY:1,SY:1,LB:1,PS:1 } : {})
    .forEach(c => countryIn.appendChild(el('option', { value:c, text: QBANK.explore.countryName(c) })));
  countryIn.value = wizard.country || '';
  countryIn.addEventListener('change', () => { wizard.country = countryIn.value; });

  const uniIn = el('input', { class:'input', value: wizard.university || '',
    placeholder:'مثال: جامعة نجران', list:'uniList' });
  uniIn.addEventListener('input', () => { wizard.university = uniIn.value; });

  const colIn = el('input', { class:'input', value: wizard.college || '',
    placeholder:'مثال: كلية العلوم الطبية التطبيقية' });
  colIn.addEventListener('input', () => { wizard.college = colIn.value; });

  const codeIn = el('input', { class:'input', dir:'ltr', value: wizard.courseCode || '',
    placeholder:'EMS 301' });
  codeIn.addEventListener('input', () => { wizard.courseCode = codeIn.value; });

  return el('div', { class:'card stack' }, [
    el('label', { class:'field', style:'margin:0' }, [
      el('span', { class:'field__label', text:'اسم المادة *' }), nameIn, nameMsg ]),
    el('div', { class:'ad-edit ad-edit--2' }, [
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'الدولة' }), countryIn ]),
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'الجامعة' }), uniIn ]),
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'الكلية' }), colIn ]),
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'رمز المقرر — اختياري' }), codeIn ])
    ]),
    el('p', { class:'field__hint', style:'margin:0',
      text:'هذه البيانات هي ما يجعل زميلك في جامعتك يجد مادتك. اكتبها ولو تقريبية.' }),
    el('span', { class:'field__label', text:'كيف نعالج أسئلتك؟' }),
    wrap
  ]);
}

/* ═══ دليل التنسيق: قالبان جاهزان وفاحص فوري ═══
   الطالب اليوم يكتشف أن ملفه غير مفهوم بعد الرفع والانتظار. هنا يعرف قبلها. */
function formatGuide(){
  const box = el('details', { class:'fmt' });
  box.appendChild(el('summary', { class:'fmt__sum' }, [
    el('span', { text:'كيف أجهّز ملفي؟' }),
    el('span', { class:'fmt__hint', text:'قالبان جاهزان وفاحص فوري' })
  ]));

  const body = el('div', { class:'fmt__body' });

  // ما يحدث للملف — خطوات لا وعود
  body.appendChild(el('ol', { class:'fmt__pipe' }, QBANK.formats.pipeline.map((p, i) =>
    el('li', {}, [
      el('span', { class:'fmt__pn num', text: QBANK.views.arNum(i + 1) }),
      el('span', {}, [
        el('b', { text: p[0] }),
        el('span', { class:'fmt__pd', text: p[1] })
      ])
    ]))));

  // القالبان
  QBANK.formats.list.forEach(f => {
    const pre = el('pre', { class:'fmt__code', dir:'auto' }, [ el('code', { text: f.sample }) ]);
    const copy = el('button', { class:'btn btn--sm', type:'button', text:'انسخ القالب' });
    copy.addEventListener('click', () => {
      const done = (navigator.clipboard && navigator.clipboard.writeText)
        ? (navigator.clipboard.writeText(f.sample), true)
        : (function(){ try{
              const ta = document.createElement('textarea'); ta.value = f.sample;
              document.body.appendChild(ta); ta.select();
              const r = document.execCommand('copy'); ta.remove(); return r;
            } catch(e){ return false; } })();
      QBANK.toast(done ? 'نُسخ القالب — الصقه في ملفك' : 'حدّد النص وانسخه يدويًا');
    });
    body.appendChild(el('section', { class:'fmt__card', 'data-fmt': f.id }, [
      el('h3', { class:'fmt__t', text: f.title }),
      el('p', { class:'fmt__when', text: f.when }),
      el('ul', { class:'fmt__rules' }, f.rules.map(r => el('li', { text: r }))),
      pre,
      el('div', { class:'row' }, [ copy ])
    ]));
  });

  // الفاحص: يلصق الطالب جزءًا من ملفه فيرى النتيجة فورًا
  const ta = el('textarea', { class:'input', rows:'4',
    placeholder:'الصق هنا سؤالين أو ثلاثة من ملفك…', 'aria-label':'فاحص التنسيق' });
  const out = el('p', { class:'fmt__out', role:'status' });
  ta.addEventListener('input', () => {
    const v = ta.value.trim();
    if (!v){ out.textContent = ''; out.className = 'fmt__out'; return; }
    const r = QBANK.formats.check(v);
    if (!r.ok){
      out.className = 'fmt__out is-no';
      out.textContent = 'لم نتعرّف على سؤال واحد. تأكد أن كل سؤال يبدأ برقمه ثم نقطة، مثل ‎1.‎';
      return;
    }
    out.className = 'fmt__out is-ok';
    out.textContent = 'وجدنا ' + QBANK.views.arNum(r.questions) + ' سؤالًا · '
      + QBANK.views.arNum(r.withOptions) + ' بخيارات · '
      + QBANK.views.arNum(r.withAnswer) + ' بإجابة معروفة';
  });
  body.appendChild(el('section', { class:'fmt__card fmt__card--check' }, [
    el('h3', { class:'fmt__t', text:'افحص تنسيقك الآن' }),
    el('p', { class:'fmt__when', text:'الصق جزءًا من ملفك — لا يُرفع شيء، الفحص في جهازك.' }),
    ta, out
  ]));

  box.appendChild(body);
  return box;
}

/* الخطوة ١: سحب وإفلات أو اختيار ملف */
function stepRead(box, rerender){
  /*
    الكتابة اليدوية شاشةٌ قائمة بذاتها لا حقلٌ في الأسفل: من اختارها
    يريدها كاملة، ومزاحمتُها لمنطقة الرفع تُربك الاثنين.
  */
  if (wizard.manualMode) {
    box.appendChild(subjectMeta());
    box.appendChild(QBANK.views.manualComposer(
      (raw, dropped) => {
        if (!requireName()) return;
        wizard.raw = raw; wizard.total = raw.length;
        wizard.filename = 'كُتبت يدويًا';
        wizard.slug = '';                 // الخادم يولّده من الاسم عند النشر
        wizard.readBy = 'manual'; wizard.unverified = 0;
        wizard.manualMode = false;
        wizard.step = 2;
        if (dropped) QBANK.toast('استُبعد ' + QBANK.views.arNum(dropped) +
                                 ' سؤالًا ناقصًا — أكمله لاحقًا من المحرر');
        QBANK.manual.clear();
        rerender();
      },
      () => { wizard.manualMode = false; rerender(); }
    ));
    return;
  }

  box.appendChild(subjectMeta());

  /*
    ★ الاسم يُطلب قبل الملف لا بعده.
    من رفع ملفًا ثم قيل له «الاسم مطلوب» يشعر أنه أضاع دقيقة انتظارٍ
    لسببٍ كان يمكن أن يُقال في أوله. والحقل فوق الصفحة أصلًا — فالطلب
    قبل الرفع تذكيرٌ، وبعده عقوبة.
  */
  function requireName(){
    const inp = box.querySelector('#subjName');
    if (wizard.subjectName && wizard.subjectName.trim()) return true;
    if (inp) {
      const m = inp.parentNode.querySelector('.field__hint');
      if (m) m.textContent = '⚠ اكتب اسم المادة أولًا — به يجدها زملاؤك.';
      inp.focus();
      try { inp.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(e){}
    }
    return false;
  }

  box.appendChild(formatGuide());
  const drop = el('div', { class:'drop', tabindex:'0', role:'button', 'aria-label':'اختر ملف أسئلة' }, [
    el('span', { class:'empty__ico', 'aria-hidden':'true', text:'⇪' }),
    el('p', { class:'empty__title', text:'أسقط ملف الأسئلة هنا أو اضغط للاختيار' }),
    el('p', { class:'empty__text', text:'PDF أو Word أو PowerPoint أو نص — حتى ١٥ ميغابايت. ' +
      'ارفع ملفك كما هو: إن لم تفهمه القواعد قرأه الذكاء، مهما كان ترقيمه أو ترتيبه.' })
  ]);
  const fileIn = el('input', { type:'file', style:'display:none', 'aria-hidden':'true',
    accept:'.pdf,.docx,.pptx,.txt,.text,.md,.csv,.tsv,.rtf,.html,.htm' });
  const msg = el('p', { class:'field__hint', role:'status' });

  /*
    ═══ شريط القراءة ═══
    ★ «جارٍ قراءة الملف…» سطرٌ جامد لا يقول شيئًا.
    قراءة ملفٍ من ٦٠ صفحة قد تبلغ دقيقتين: يُقرأ من الجهاز، ثم يُرفع، ثم
    يُستخرج نصّه، ثم يقرؤه الذكاء إن لزم. والطالب أمام سطرٍ لا يتحرّك
    يستنتج العطل ويُغلق الصفحة على عملٍ يجري.

    فأصبح: شريطٌ حقيقي لقراءة الجهاز (FileReader يعطي تقدّمًا فعليًا)، ثم
    شريطٌ متحرّك للمراحل التي لا يُعرف طولها، مع عدّاد ثوانٍ يُثبت أن
    شيئًا يجري، ونصٌّ يسمّي المرحلة الجارية بعينها.
  */
  const rdBar = el('div', { class:'meter', role:'progressbar',
    'aria-valuemin':'0', 'aria-valuemax':'100', 'aria-valuenow':'0' },
    [ el('div', { class:'meter__fill', style:'width:0%' }) ]);
  const rdCard = el('div', { class:'card stack', hidden:true }, [
    el('p', { class:'revcard__t', id:'rdT', text:'' }),
    rdBar,
    el('p', { class:'field__hint', id:'rdS', role:'status', text:'' })
  ]);
  const rdT = () => rdCard.querySelector('#rdT');
  const rdS = () => rdCard.querySelector('#rdS');

  function phase(title, note, pct){
    rdCard.hidden = false;
    rdT().textContent = title;
    rdS().textContent = note || '';
    if (typeof pct === 'number') {
      rdBar.classList.remove('meter--busy');
      rdBar.firstChild.style.width = pct + '%';
      rdBar.setAttribute('aria-valuenow', String(Math.round(pct)));
    } else {
      // مرحلةٌ لا يُعرف طولها: الشريط يمتلئ ويتحرّك — الحركة تقول «يعمل»
      rdBar.classList.add('meter--busy');
      rdBar.firstChild.style.width = '100%';
      rdBar.removeAttribute('aria-valuenow');
    }
  }

  async function handle(file){
    if (!file) return;
    msg.textContent = '';
    const kb = Math.round(file.size / 1024);
    phase('يُقرأ «' + file.name + '» من جهازك', kb + ' ك.ب', 0);

    const b64 = await new Promise(resolve => {
      const rd = new FileReader();
      // تقدّمٌ حقيقي لا مُتخيَّل: المتصفح يقوله لنا فنقوله للطالب
      rd.onprogress = e => {
        if (e.lengthComputable) phase('يُقرأ «' + file.name + '» من جهازك',
          kb + ' ك.ب', Math.round(e.loaded / e.total * 100));
      };
      rd.onload = () => resolve(String(rd.result).split(',')[1] || '');
      rd.onerror = () => resolve('');
      rd.readAsDataURL(file);
    });
    if (!b64) { rdCard.hidden = true; msg.textContent = '⚠ تعذّرت قراءة الملف من جهازك.'; return; }

    // عدّاد الثواني: الرقم الذي يتقدّم يفرّق بين «بطيء» و«معطّل»
    const t0 = Date.now();
    let tick = setInterval(() => {
      const s = Math.round((Date.now() - t0) / 1000);
      phase('يُحلَّل ملفك على الخادم',
        'استخراج النص ثم التعرّف على الأسئلة — ' + s + ' ثانية. ' +
        'الملفات غير المرتّبة يقرؤها الذكاء وقد تأخذ دقيقة.');
    }, 1000);
    phase('يُرفع ملفك', 'ثم يُستخرج نصّه ويُقسَّم أسئلة.');

    wizard = await QBANK.admin.wizardIngest(wizard, file.name, b64);
    clearInterval(tick);
    rdCard.hidden = true;
    rdBar.classList.remove('meter--busy');
    if (wizard.error) { msg.textContent = '⚠ ' + wizard.error; return; }
    rerender();
  }
  drop.addEventListener('click', () => { if (requireName()) fileIn.click(); });
  drop.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { if (requireName()) fileIn.click(); } });
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('is-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('is-over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('is-over');
    if (requireName()) handle(e.dataTransfer.files[0]);
  });
  fileIn.addEventListener('change', () => handle(fileIn.files[0]));

  /*
    ★ الطريق الثاني: من لا ملف عنده.
    الرفع بملف يفترض أن للطالب ملفًا، وكثيرٌ منهم لا ملف عنده: أسئلةٌ
    سمعها في المحاضرة أو صوّرها زميله. كان هؤلاء خارج المنصة كلها — لا
    لأنهم بلا محتوى، بل لأننا طلبنا المحتوى بصيغةٍ واحدة.
  */
  const manualBtn = el('button', { class:'btn btn--ghost btn--block', type:'button',
    text:'✎ أو اكتب الأسئلة بنفسك' });
  manualBtn.addEventListener('click', () => {
    if (!requireName()) return;
    wizard.manualMode = true; rerender();
  });

  box.appendChild(drop); box.appendChild(fileIn); box.appendChild(rdCard); box.appendChild(msg);
  box.appendChild(el('p', { class:'field__hint', style:'text-align:center;margin:2px 0',
                            text:'— أو —' }));
  box.appendChild(manualBtn);
}

/* الخطوة ٢: التقدير ثم التشغيل بدفعات مع شريط «٨٠ من ٣٠٠» */
function stepEnrich(box, rerender){
  const est = QBANK.admin.estimate(wizard);
  const bar = el('div', { class:'meter', role:'progressbar', 'aria-valuemin':'0',
    'aria-valuemax': String(wizard.total), 'aria-valuenow': String(wizard.done) }, [
    el('div', { class:'meter__fill', style:'width:' + (wizard.total ? wizard.done / wizard.total * 100 : 0) + '%' })
  ]);
  const label = el('p', { class:'page__sub num',
    text: wizard.done + ' من ' + wizard.total + ' · ' +
          (wizard.total ? Math.round(wizard.done / wizard.total * 100) : 0) + '٪' });
  /* سطرٌ ثانٍ يقول ماذا يجري الآن — الرقم الثابت وحده يُقرأ تعليقًا */
  const sub = el('p', { class:'field__hint', role:'status', text:'' });
  const msg = el('p', { class:'field__hint', role:'status' });
  const go = el('button', { class:'btn btn--block', type:'button',
    text: wizard.done ? 'أكمل من حيث توقفت (' + wizard.done + ')' : 'شغّل الذكاء الآن' });

  go.addEventListener('click', async () => {
    go.setAttribute('aria-disabled','true'); go.textContent = 'جارٍ المعالجة…';
    const t0 = Date.now();
    wizard = await QBANK.admin.wizardEnrich(wizard, (done, total, st) => {
      const pct = total ? Math.round(done / total * 100) : 0;
      label.textContent = done + ' من ' + total + ' · ' + pct + '٪';
      bar.setAttribute('aria-valuenow', String(done));
      bar.firstChild.style.width = pct + '%';
      /*
        ★ الحركة أثناء الدفعة لا بين الدفعتين.
        الدفعة أربعون سؤالًا تستغرق دقيقة أو دقيقتين، والشريط يقفز عند
        نهايتها فقط — فيرى الطالب شريطًا جامدًا ورقمًا لا يتحرّك دقيقتين،
        ويستنتج أن التطبيق علّق فيُغلقه. الخطوط المتحرّكة تقول «يعمل».
      */
      if (!st) return;
      bar.classList.toggle('meter--busy', !!st.running);
      if (st.running) {
        const mins = Math.max(1, Math.round((st.batches - st.batch + 1) * 1.2));
        sub.textContent = 'يعالج الذكاء الدفعة ' + st.batch + ' من ' + st.batches +
                          ' — يتبقّى ~' + mins + ' دقيقة. يمكنك إغلاق الصفحة، ' +
                          'وما اكتمل محفوظ ويُستأنف من حيث توقّف.';
      } else {
        const sec = Math.round((Date.now() - t0) / 1000);
        sub.textContent = 'اكتملت الدفعة ' + st.batch + ' من ' + st.batches +
                          ' (' + sec + ' ثانية حتى الآن).';
      }
    });
    bar.classList.remove('meter--busy');
    if (wizard.error) {
      msg.textContent = '⚠ ' + wizard.error;
      go.removeAttribute('aria-disabled'); go.textContent = 'أعد المحاولة';
      /*
        ★ بابٌ لا جدار.
        حين ينفد ما عند المزوّد لا حيلة للطالب في «أعد المحاولة» — وقد رفع
        ملفه قبل اختباره بساعات. فنعرض عليه ما نملكه فعلًا: أسئلته كما هي،
        منشورةً الآن، وله أن يثريها متى عاد الذكاء. مادةٌ ناقصة الليلةَ خيرٌ
        من مادةٍ كاملة بعد الاختبار.
      */
      const quota = wizard.errorKind === 'quota_day' || wizard.errorKind === 'quota_minute' ||
                    wizard.errorKind === 'overloaded';
      if (quota && !box.querySelector('.js-plainout')) {
        const out = el('button', { class:'btn btn--soft btn--block js-plainout', type:'button',
          text:'انشر أسئلتك الآن بلا إثراء' });
        out.addEventListener('click', () => {
          wizard.enrich = false; wizard.error = ''; wizard.errorKind = '';
          wizard = QBANK.admin.plainEnrich(wizard);
          QBANK.admin.saveDraft(wizard);
          rerender();
        });
        msg.parentNode.insertBefore(out, msg.nextSibling);
      }
      return;
    }
    rerender();
  });

  /*
    ★ كيف قُرئ ملفك — يُقال لا يُخبأ.
    الرافع يعرف ملفه أكثر منا: هو وحده يستطيع أن يقول «فيه ثمانون سؤالًا
    لا عشرون». فنُريه العدد ومصدره ونضع بيده زرًّا يأمر بإعادة القراءة
    بالذكاء. الشفافية هنا ليست أدبًا فقط — هي آليةُ تصحيحٍ لا نملك غيرها.
  */
  const N = QBANK.views.arNum;   // يُستعمل من هنا فصاعدًا — قبل استعماله لا بعده
  const readLine = el('p', { class:'field__hint', text:
    (wizard.readBy === 'ai' ? '🧠 قرأ الذكاءُ ملفك واستخرج ' : '⚡ قُرئ ملفك بالقواعد واستُخرج ')
    + N(wizard.total) + ' سؤالًا.'
    + (wizard.unverified ? ' ومنها ' + N(wizard.unverified) +
        ' لم نجد نصّها حرفًا بحرف في الملف — راجعها في الخطوة التالية.' : '') });
  box.appendChild(readLine);
  box.appendChild(sub);

  if (wizard.fileB64){
    const again = el('button', { class:'btn btn--sm btn--ghost', type:'button',
      text: wizard.readBy === 'ai' ? '⟳ أعد القراءة بالذكاء' : '🧠 العدد أقل مما تتوقع؟ اقرأه بالذكاء' });
    again.addEventListener('click', async () => {
      const before = wizard.total;
      again.setAttribute('aria-disabled','true');
      /* عدّادٌ هنا أيضًا: قراءة الذكاء لملفٍ كبير دقيقة أو أكثر، والزرّ
         الصامت طوالها يُقرأ زرًّا معطّلًا لا زرًّا يعمل. */
      const t0 = Date.now();
      const tick = setInterval(() => {
        again.textContent = '… يقرأ الذكاء ملفك (' +
          Math.round((Date.now() - t0) / 1000) + ' ثانية)';
      }, 1000);
      again.textContent = '… يقرأ الذكاء ملفك';
      const w2 = await QBANK.admin.wizardIngest(wizard, wizard.filename, wizard.fileB64, true);
      clearInterval(tick);
      again.removeAttribute('aria-disabled');
      /*
        ★ لا شيء أسوأ من زرٍّ لا يقول ماذا فعل.
        ثلاث نتائج ممكنة، وكانت كلها تبدو واحدة: لا شيء. فإن عجز الذكاء
        قلنا لماذا، وإن لم يجد أكثر قلنا إن القواعد كانت أوفى، وإن وجد
        أكثر ظهر العدد الجديد وحده — والسكوت لا يُشرح شيئًا منها.
      */
      if (w2.error) {
        again.textContent = '🧠 أعد القراءة بالذكاء';
        sub.textContent = '⚠ ' + w2.error;
        return;
      }
      if (w2.total <= before) {
        again.textContent = '🧠 أعد القراءة بالذكاء';
        sub.textContent = 'قرأه الذكاء فلم يجد أكثر من ' + N(before) +
                          ' سؤالًا — قراءة القواعد كانت أوفى، وأبقيناها.';
        return;
      }
      wizard = w2;
      /* الإثراء يبدأ من الصفر بعد قراءة جديدة: الأسئلة تغيّرت، وعدّادٌ
         قديم على أسئلة جديدة يعني تخطّي أسئلة لم تُقرأ قط. */
      wizard.done = 0; wizard.enriched = [];
      QBANK.toast('قرأ الذكاء ' + N(w2.total) + ' سؤالًا');
      rerender();
    });
    box.appendChild(el('p', { class:'stack', style:'margin-bottom:12px' }, [again]));
  }

  /*
    مساران، والفرق بينهما معروض لا مخبوء.
    الطالب لا يعرف ما «الإثراء» حتى يرى ماذا ينقصه بدونه — فنقوله بالأسماء.
  */
  const withoutOpts = wizard.raw.filter(q => !q.has_options).length;
  const noAnswer = wizard.raw.filter(q =>
    !(q.has_options && typeof q.answer === 'number' && q.answer >= 0) && !q.answer_text).length;

  const paths = el('div', { class:'paths', role:'radiogroup', 'aria-label':'طريقة المعالجة' });
  const creditBox = el('div', { class:'costbox', hidden:true });

  function paint(credits){
    const cpq = QBANK.admin.costPerQ(credits);
    const cost = QBANK.admin.creditsNeeded(wizard, cpq);
    const bal = (credits && credits.balance) || 0;
    const enough = bal >= cost;          // وصفرٌ ≤ أي رصيد، فالمجاني كافٍ دائمًا
    wizard.costPerQ = cpq;

    /*
      ★ الافتراض الطموح يجب ألا يورّط الطالب.
      صار المسار الكامل هو المختار ابتداءً، فمن لا يكفيه رصيده كان يجد
      نفسه على مسارٍ محجوب وزرَّ «أثرِ وانشر» معطّلًا بلا سبب ظاهر — طريق
      مسدود عند أول خطوة. فنعيده إلى المجاني تلقائيًا، إلا أن يكون اختار
      المدفوع بيده: اختياره الصريح لا يُلغى، إنما يُصحَّح الافتراضُ وحده.
    */
    /* ورسمة ما قبل وصول الرصيد لا تحكم: رصيدها صفرٌ بحكم الجهل لا بحكم الواقع،
       فلو ارتددنا عندها لبقي الطالب على المجاني حتى لو كان رصيده وافرًا. */
    const known = !!credits;
    if (known && !enough && wizard.enrich && !wizard.pathChosen) wizard.enrich = false;

    paths.innerHTML = '';
    [
      /*
        ★ المسار الكامل أولًا وهو المختار افتراضًا.
        الطالب لا يرفع ليحصل على نصٍّ خام — يرفع ليذاكر. والترتيب القديم
        كان يضع «بلا إثراء» أولًا ومختارًا، فيمرّ عليه الطالب بضغطة فيخرج
        ببنك فقير ثم يظنّ المنصة فقيرة. الافتراض يجب أن يكون أفضل مخرَج.
      */
      /* ★ الثمن يُقال بلسانه: «مجانًا» لا «٠ كوين». صفرٌ مكتوبٌ بجانب كلمة
         كوين يقرؤه الطالب سعرًا لم يُحسب بعد، فيتردّد أمام ما هو مبذول له. */
      { id:true, t:'المادة الكاملة — كطريقة AMSU',
        price: cost > 0 ? N(cost) + ' كوين' : 'مجانًا',
        d:'شرح عربي وإنجليزي لكل سؤال، وترجمته، وبطاقة حفظ منحوتة، وتصنيف بالمحاور، ثم «عن المادة» و«طريقة الحفظ» و«الأخطاء الشائعة».',
        miss: noAnswer ? 'ويستنتج الذكاء إجابات ' + N(noAnswer) + ' سؤالًا لم تُعلَن في ملفك'
                       : 'وكل أسئلتك فيها إجاباتها أصلًا — فلن يُغيّر الذكاء إجابة واحدة' },
      { id:false, t:'الأسئلة وحدها', price:'مجانًا',
        d:'أسئلتك وخياراتها كما وصلت، جاهزة للاختبار حالًا.',
        miss: 'بلا شرح ولا ترجمة ولا بطاقات حفظ — ويمكنك إثراؤها لاحقًا'
              + (noAnswer ? '. و' + N(noAnswer) + ' سؤالًا بلا إجابة معلنة ستضبطها بيدك' : '') }
    ].forEach(o => {
      const on = wizard.enrich === o.id;
      const blocked = o.id && known && !enough;   // لا نحجب بناءً على جهلٍ بالرصيد
      const b = el('button', { class:'path' + (on ? ' is-on' : '') + (blocked ? ' is-blocked' : ''),
        type:'button', role:'radio', 'data-path': String(o.id),
        'aria-checked': on ? 'true' : 'false' }, [
        el('span', { class:'path__h' }, [
          el('span', { class:'path__t', text:o.t }),
          el('span', { class:'path__p num', text:o.price })
        ]),
        el('span', { class:'path__d', text:o.d }),
        el('span', { class:'path__m', text:o.miss })
      ]);
      b.addEventListener('click', () => {
        if (blocked) return;
        wizard.enrich = o.id;
        wizard.pathChosen = true;   // اختيار بيده — لا يعيده الافتراض بعد اليوم
        paint(credits);
      });
      paths.appendChild(b);
    });

    /* ★ صندوق الرصيد يظهر أيضًا حين يُحجب المدفوع لنقص الرصيد:
       الحجب بلا رقمٍ يشرحه لغزٌ، ومع «ينقصك كذا» يصير دعوةً للشحن. */
    // لا محفظة حيث لا ثمن: صندوق الرصيد يختفي كليًّا حين يكون الإثراء مجانيًا
    const showCost = cost > 0 && (wizard.enrich || (known && !enough));
    creditBox.hidden = !showCost;
    creditBox.innerHTML = '';
    if (showCost){
      creditBox.appendChild(el('span', { class:'costbox__l', text:'رصيدك' }));
      creditBox.appendChild(el('span', { class:'costbox__n num',
        text: N(bal) + ' كوين' + (enough ? '' : ' — لا يكفي') }));
      creditBox.appendChild(el('span', { class:'costbox__s',
        text: enough ? 'سيتبقى لك ' + N(bal - cost) + ' كوين بعد الإثراء.'
                     : 'ينقصك ' + N(cost - bal) + ' كوين لإثراء هذا الملف.' }));
      if (!enough)
        creditBox.appendChild(el('a', { class:'btn btn--sm', href:'#/account', text:'اشحن رصيدك' }));
    }
    go.textContent = wizard.done ? 'أكمل من حيث توقفت (' + wizard.done + ')'
                    : (wizard.enrich ? 'ولّد المادة وانشر' : 'انشر بلا إثراء');
    go.setAttribute('aria-disabled', (wizard.enrich && !enough) ? 'true' : 'false');
  }

  paint(null);
  QBANK.api.rpc('my_credits').then(r => {
    if (!paths.isConnected) return;
    if (r.ok && r.data && !r.data.error) paint(r.data);
  });

  box.appendChild(el('div', { class:'card stack' }, [
    el('h2', { text:'كيف ننشرها؟' }),
    el('div', { class:'row' }, [
      el('span', { class:'badge num', text: est.questions + ' سؤالًا' }),
      withoutOpts ? el('span', { class:'badge badge--warn num',
        text: N(withoutOpts) + ' بلا خيارات' }) : null,
      el('span', { class:'badge', text:'المسوّدة تُحفظ بعد كل دفعة' })
    ]),
    paths, creditBox, bar, label, go, msg
  ]));
}

/* الخطوة ٣: المراجعة — بطاقة لكل سؤال، تغيير الإجابة بضغطة، وسوم حمراء للمستنتَج */
function stepReview(box, rerender){
  /*
    ★ لا نشر بلا سؤال واحد.
    كانت الشاشة تُرسم فارغة ويبقى زر «تابع للنشر» تحتها، فيُنشر بنك خالٍ.
    والحارس هنا ليس تكرارًا لحارس الاستيراد: مسوّدة قديمة محفوظة قد تصل
    إلى هنا فارغة من طريق آخر — وكل باب إلى النشر يحتاج قفله.
  */
  if (!wizard.enriched || !wizard.enriched.length) {
    box.appendChild(QBANK.views.empty('⚠', 'لا أسئلة في هذه المسوّدة',
      'لم يصل شيء من خطوة القراءة. ارجع وارفع الملف مرة أخرى — وتأكد أن تنسيقه يطابق القالب.'));
    const back = el('button', { class:'btn btn--block', type:'button', text:'← ارجع وارفع ملفًا آخر' });
    back.addEventListener('click', () => {
      wizard.step = 1; wizard.raw = []; wizard.enriched = []; wizard.total = 0;
      wizard.error = ''; rerender();
    });
    box.appendChild(back);
    return;
  }

  const dups = QBANK.admin.findDuplicates(wizard.enriched);
  const dupSet = new Set(dups.map(d => d.index));
  if (dups.length) box.appendChild(el('p', { class:'row' }, [
    el('span', { class:'badge badge--warn num', text: 'تنبيه: ' + dups.length + ' سؤالًا مكررًا — موسوم لا محذوف' })
  ]));

  wizard.enriched.forEach((q, qi) => {
    const opts = el('div', { class:'stack q__opts' }, q.options.map((opt, oi) => {
      const b = el('button', { class:'opt' + (q.answer === oi ? ' is-answer' : ''), type:'button' }, [
        el('span', { class:'opt__mark', 'aria-hidden':'true', text: q.answer === oi ? '✓' : '' }),
        el('span', { class:'ltr', text: opt })
      ]);
      // المشرف يغيّر الإجابة بضغطة على أي خيار — والتغيير يمسح وسم «مستنتجة»
      b.addEventListener('click', () => { q.answer = oi; q.derived = false; rerender(); });
      return b;
    }));
    const badges = el('div', { class:'row' }, [
      el('span', { class:'badge num', text:'س' + (qi + 1) }),
      q.derived ? el('span', { class:'badge badge--bad', text:'⚠ إجابة مستنتجة' }) : null,
      q.opts_built ? el('span', { class:'badge badge--bad', text:'⚠ خيارات مبنية' }) : null,
      dupSet.has(qi) ? el('span', { class:'badge badge--warn', text:'مكرر' }) : null,
      q.topic ? el('span', { class:'badge', text: q.topic }) : null
    ]);
    const impBtn = el('button', { class:'btn btn--sm ' + (q.important ? 'btn--soft' : 'btn--ghost'), type:'button',
      text: q.important ? '★ مهم' : 'وسمه مهمًا' });
    impBtn.addEventListener('click', () => { q.important = !q.important; rerender(); });
    box.appendChild(el('article', { class:'card stack q' }, [
      badges,
      el('p', { class:'ltr q__text', text: q.q }),
      opts,
      el('div', { class:'row' }, [ impBtn ])
    ]));
  });

  const next = el('button', { class:'btn btn--block', type:'button', text:'راجعتُ الكل — تابع للنشر' });
  next.addEventListener('click', async () => { wizard.step = 4; await QBANK.admin.saveDraft(wizard); rerender(); });
  box.appendChild(next);
}

/* الخطوة ٤: زران — اعتماد ذرّي أو حفظ مخفي */
function stepPublish(box){
  // ★ آخر قفل قبل القاعدة — والقاعدة نفسها تحرس أيضًا (approve_draft)
  if (!wizard.enriched || !wizard.enriched.length) {
    box.appendChild(QBANK.views.empty('⚠', 'لا شيء يُنشر',
      'هذه المسوّدة بلا أسئلة. أعد رفع الملف من الخطوة الأولى.'));
    return;
  }
  const derived = wizard.enriched.filter(q => q.derived).length;

  /*
    لغة التحليل الشامل — الرافع يختار. العربية الافتراض (نمط AMSU: أسئلة
    إنجليزية وشرح عربي)، ومن يريد ماله كله بالإنجليزية فخياره محفوظ.
  */
  wizard.analysisLang = wizard.analysisLang || 'ar';
  const langRow = el('div', { class:'row', role:'group', 'aria-label':'لغة التحليل' }, [
    el('span', { class:'field__hint', text:'لغة الشرح والتحليل:' })
  ]);
  [['ar','عربي'],['en','English']].forEach(([v, label]) => {
    const b = el('button', { class:'btn btn--sm ' + (wizard.analysisLang === v ? 'btn--soft' : 'btn--ghost'),
      type:'button', 'data-lang': v, 'aria-pressed': String(wizard.analysisLang === v), text: label });
    b.addEventListener('click', () => {
      wizard.analysisLang = v;
      langRow.querySelectorAll('[data-lang]').forEach(x => {
        const on = x.getAttribute('data-lang') === v;
        x.className = 'btn btn--sm ' + (on ? 'btn--soft' : 'btn--ghost');
        x.setAttribute('aria-pressed', String(on));
      });
    });
    langRow.appendChild(b);
  });

  /* ومفتاحُه ظاهر: من رتّب أسئلته بقصدٍ (فصلًا فصلًا) له أن يُبقي ترتيبه */
  const shufWrap = el('label', { class:'row', style:'gap:8px;cursor:pointer;align-items:center' });
  const shufIn = el('input', { type:'checkbox' });
  shufIn.checked = wizard.shuffleOnPublish !== false;
  shufIn.addEventListener('change', () => { wizard.shuffleOnPublish = shufIn.checked; });
  shufWrap.appendChild(shufIn);
  shufWrap.appendChild(el('span', { class:'field__hint', style:'margin:0',
    text:'اخلط ترتيب الأسئلة عند النشر — كي لا يحفظ الطالب التسلسل بدل المحتوى' }));

  const pub = el('button', { class:'btn btn--block', type:'button', text:'اعتمد وانشر للطلاب' });
  const hide = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'احفظ مخفية' });
  const msg = el('p', { class:'field__hint', role:'status' });
  /*
    ★ تحذيرٌ يسبق الضغط لا يتبعه.
    إن كانت المسوّدة لم تُحفظ على الخادم، الطالبُ يستحق أن يعرف الآن —
    قبل أن يضغط زرًّا سيفشل — وأن يعرف أن الأسئلة في متصفّحه لم تضِع.
  */
  if (wizard.draftError)
    msg.textContent = '⚠ لم تُحفظ مادتك على الخادم بعد (' + wizard.draftError +
                      '). أسئلتك محفوظة في هذا المتصفح، وسنحاول الحفظ مرة أخرى عند الضغط.';
  async function fire(publish){
    /*
      ★ الحارس الأخير للاسم.
      حارس الخطوة الأولى يكفي للمسار المعتاد، لكن المسوّدة تُستأنف بعد
      يوم، والحقل قد يُفرَّغ، والشاشة تُفتح بمسارها مباشرة. والاسم يُكتب
      في القاعدة هنا — فهنا يجب أن يُتحقّق منه، لا حيث كُتب أول مرة.
    */
    if (!wizard.subjectName || !wizard.subjectName.trim()) {
      msg.textContent = '⚠ اسم المادة مطلوب — ارجع إلى الخطوة الأولى واكتبه.';
      return;
    }
    /*
      ★ الخلط عند النشر.
      الترتيب الذي كتب به الرافعُ أسئلته يحمل معلومةً لا يقصدها: أسئلة
      المحاضرة الأولى أولًا، وما تذكّره أخيرًا في الآخر. فيحفظ الطالب
      التسلسل بدل المحتوى، ويصير ترتيبُه هو ما يُختبر لا فهمُه. والخلط
      مرةً عند النشر أصدق من خلطٍ في كل عرض: البنك ثابت، وترتيبه محايد.
    */
    if (wizard.shuffleOnPublish !== false && Array.isArray(wizard.enriched))
      wizard.enriched = QBANK.manual.shuffle(wizard.enriched);

    msg.textContent = '… يُعتمد';
    const r = await QBANK.admin.approve(wizard, publish);
    if (!r.ok)
      return void (msg.textContent = '⚠ ' + ((r.data && r.data.message) || 'تعذّر الاعتماد — لم يتغير شيء في قاعدة البيانات.'));
    // approve_draft تُرجع معرّف المادة — نختمها بهوية رافعها ونمطه ومساره
    const newId = (typeof r.data === 'string') ? r.data : (r.data && r.data.id) || null;
    const w = wizard;
    await QBANK.admin.stamp(newId, w);
    /*
      ★ نُجدّد قائمة المواد قبل أن نُري الرابط.
      القائمة تُجلب مرة عند الإقلاع وتعيش في التخزين المحلي، فالمادة التي
      نُشرت قبل ثانية ليست فيها. وكنّا نعطي الرافع زر «افتح المادة» يقوده
      إلى «المادة غير موجودة» — وهي موجودة، وهو من أنشأها. لا شيء يُحبط
      الرافع مثل أن تختفي مادته لحظة نشرها.
    */
    if (publish) { try { await QBANK.data.refreshPack(); } catch(e){ /* الشاشة تُجدّد لاحقًا */ } }
    QBANK.toast(publish ? 'نُشرت المادة' : 'حُفظت مخفية');
    if (publish && newId){
      // رابط المشاركة يظهر فورًا: هذه هي اللحظة التي يشارك فيها الطالب مادته
      // ★ والمعرّف من الخادم لا من تخميننا — وإن غاب فُتحت المادة بمعرّفها
      const realSlug = await QBANK.admin.realSlug(newId);
      wizard = null;
      return void showShare(box, realSlug || w.slug, w.subjectName, newId, w.analysisLang || 'ar');
    }
    wizard = null;
    QBANK.router.go(QBANK.store.get('is_admin_check', {}).ok ? '#/admin/content' : '#/account');
  }
  pub.addEventListener('click', () => fire(true));
  hide.addEventListener('click', () => fire(false));
  /*
    ★ كشف المكرر قبل النشر لا بعده.
    عشر نسخ من مقرّر واحد تُفتّت التقييمات وتشتّت الطالب: أيّها أكمل؟
    فنُري الرافع ما هو موجود في جامعته باسم قريب، ونتركه يقرّر — لا نمنعه،
    لأن «مبادئ الإدارة ١» قد لا تكون «مبادئ الإدارة ٢» رغم تشابه الاسم.
  */
  const dup = el('div', { hidden:true });
  box.appendChild(dup);
  if (QBANK.trust && wizard.subjectName)
    QBANK.trust.similar(wizard.subjectName, null).then(r => {
      if (!dup.isConnected) return;
      const rows = (r.ok && Array.isArray(r.data)) ? r.data : [];
      if (!rows.length) return;
      dup.hidden = false;
      dup.className = 'card stack dupwarn';
      dup.appendChild(el('h3', { style:'margin:0', text:'⚠ يوجد ما يشبهها في جامعتك' }));
      dup.appendChild(el('p', { class:'field__hint', style:'margin:0',
        text:'افتحها أولًا — إن كانت هي نفسها فأضف أسئلتك إليها بدل نسخة ثانية. وإن كانت مقرّرًا آخر فأكمل نشرك.' }));
      rows.forEach(x => dup.appendChild(el('a', { class:'dupwarn__row', href:'#s/' + (x.slug || '') }, [
        el('span', { class:'dupwarn__n', text: x.name }),
        el('span', { class:'badge num', text: (x.q_count || 0) + ' سؤالًا' }),
        x.verified ? el('span', { class:'badge badge--ok', text:'✓ موثّقة' }) : null,
        x.rating_n ? el('span', { class:'badge badge--star num',
          text: QBANK.trust.starsText(x.rating_avg, x.rating_n) }) : null
      ])));
    });

  box.appendChild(el('div', { class:'card stack' }, [
    el('h2', { text:'الاعتماد' }),
    el('p', { class:'page__sub num', text: wizard.total + ' سؤالًا جاهزًا' +
      (derived ? ' — منها ' + derived + ' بإجابة مستنتجة راجعتَها' : '') }),
    el('p', { class:'field__hint', text:'الاعتماد عملية ذرّية: إما تُنشأ المادة وكل أسئلتها أو لا يتغير شيء.' }),
    langRow, shufWrap, pub, hide, msg
  ]));
}

/* شاشة ما بعد النشر: الرابط وزر النسخ — لا يُترك الطالب يبحث عن مادته */
function showShare(box, slug, name, newId, analysisLang){
  const u = QBANK.api.user() || {};
  box.innerHTML = '';

  /*
    ★ التحليل الشامل يبدأ هنا — بعد النشر لا قبله.
    لو حجزنا زرّ النشر حتى يكتمل التحليل (نصف دقيقة أحيانًا) لظنّ الرافع
    أن النشر علق. المادة تُنشر فورًا، والتحليل يلحقها، وسطرُ الحالة يصدُق
    معه: يجري ← اكتمل بمحاوره ← أو تعذّر مع «سيُعاد تلقائيًا عند فتح مادتك».
  */
  const aLine = el('p', { class:'field__hint', role:'status',
    text: QBANK.analysis ? '🧠 يجري تحليل مادتك: النظرة العامة وطريقة الحفظ والأخطاء الشائعة…' : '' });
  if (QBANK.analysis && newId)
    QBANK.analysis.generate(newId, analysisLang).then(r => {
      if (!aLine.isConnected) return;
      if (r.ok && r.data && r.data.ok){
        const n = (r.data.topics || []).length;
        aLine.textContent = '✓ اكتمل التحليل — ' + QBANK.views.arNum(n) +
          ' محاور وطريقة حفظ وأخطاء شائعة. كلها في صفحة مادتك.';
      } else {
        aLine.textContent = '⚠ تعذّر التحليل الآن — سيُعاد تلقائيًا أول ما تفتح صفحة مادتك.';
      }
    });

  /*
    ★ الخروج يتبع الباب الذي دخلتَ منه.
    كانت هذه الشاشة تعرض وجهتين للطالب وحده: صفحة المادة ومحفظته. فالمشرف
    الذي اعتمد مادةً من لوحته يُقذف بها إلى واجهة الطالب — يعود الشريط
    السفلي، وتضيع اللوحة، وعليه أن يكتب مسارها بيده ليعود إلى عمله.
    ولوحةٌ تُخرج صاحبها منها كلما أنجز شيئًا ليست لوحة.
  */
  let inAdmin = false;
  try { inAdmin = (QBANK.router.current || {}).path.indexOf('#/admin') === 0; } catch(e){}

  const exits = inAdmin
    ? [
        el('a', { class:'btn btn--block', href:'#/admin/content', text:'⚙ عد إلى لوحة المحتوى' }),
        newId ? el('a', { class:'btn btn--soft btn--block', href:'#/admin/subject/' + newId,
                          text:'✎ حرّر المادة' }) : null,
        el('a', { class:'btn btn--ghost btn--block', href:'#/admin/upload', text:'+ ارفع مادة أخرى' })
      ]
    : [
        el('a', { class:'btn btn--block', href:'#s/' + slug, text:'افتح صفحة المادة' }),
        el('a', { class:'btn btn--ghost btn--block', href:'#/account', text:'محفظتي' })
      ];

  box.appendChild(el('div', { class:'card stack', style:'text-align:center' }, [
    el('span', { class:'empty__ico', 'aria-hidden':'true', text:'✓' }),
    el('p', { class:'empty__title', text:'نُشرت «' + (name || 'مادتك') + '»' }),
    el('p', { class:'empty__text', text: inAdmin
      ? 'المادة منشورة للطلاب. وهذا رابطها للمشاركة.'
      : 'شاركها مع زملائك — كل شراء عبر رابطك يضيف كوينز لرصيدك.' }),
    aLine,
    QBANK.share.copyRow(QBANK.share.shareUrl(slug, u.id))
  ].concat(exits)));
}

const ViewUpload = {
  title:'رفع الأسئلة',
  view(route){
    // الرفع مفتوح لكل مسجَّل لا للمشرف وحده — هذه هي ميزة مواد الطلاب
    if (!QBANK.api.user()) return QBANK.views.ViewLogin.view();
    if (!wizard) wizard = QBANK.admin.newWizard();
    // استئناف مسوّدة من القائمة: نجلبها بحمولتها ونقفز للخطوة الصحيحة
    if (route.query.draft && wizard.draftId !== route.query.draft) {
      wizard = QBANK.admin.newWizard();
      wizard.draftId = route.query.draft;
      QBANK.api.rest('drafts?id=eq.' + route.query.draft + '&select=*').then(r => {
        if (r.ok && r.data && r.data[0]) {
          const d = r.data[0];
          wizard.filename = d.source_name; wizard.enriched = d.payload || [];
          /* ★ الاسم والرابط يُستعادان مع الأسئلة.
             كان الاستئناف يجلب الأسئلة وحدها، فيعود المشرف إلى معالجٍ
             بلا اسم مادة ولا رابط — ثم يُطلب منه الاسم من جديد، ويُمحى
             الرابط الذي ولّدته القاعدة عند النشر. */
          wizard.subjectName = wizard.subjectName || d.name || '';
          wizard.total = d.total; wizard.done = d.done;
          wizard.step = d.done >= d.total ? 3 : 2;
          QBANK.router.render(location.hash);
        }
      });
    }
    const body = el('div', { class:'stack' });
    const rerender = () => QBANK.router.render(location.hash);
    [null, stepRead, stepEnrich, stepReview, stepPublish][wizard.step](body, rerender);
    /*
      ★ شرط العمولة يُقال في أول الخطوة الأولى لا في آخر الرابعة.
      من يعرف أن لمادته عائدًا يرفع بجدّية أكبر ويُتمّ ما بدأه، ومن يعرفه
      بعد النشر يشعر أنه اكتشف شيئًا كان مخفيًّا عنه. والوعد الذي يُقال
      قبل العمل وعدٌ، والذي يُقال بعده مفاجأة — ولو كانت سارّة.
    */
    return QBANK.views.page('رفع الأسئلة', 'من ملفك إلى مادة يذاكرها زملاؤك — بأربع خطوات.', [
      stepsBar(wizard.step),
      (wizard.step === 1 && QBANK.views.earnPromise) ? QBANK.views.earnPromise() : null,
      body
    ]);
  },
  _reset(){ wizard = null; },       // للفحوص
  _get(){ return wizard; },
  _set(w){ wizard = w; }
};
QBANK.views.ViewUpload = ViewUpload;


/* ===== 35-subject.js ===== */
/*
  صفحة المادة — أربعة تبويبات: نظرة عامة · الشرح · بنك الأسئلة · طريقة الحفظ.
  الأسئلة تُجلب مرة واحدة ثم من جهاز الطالب (IndexedDB) — تعمل بعدها بلا إنترنت.
  البنك مصمَّم لخمسمئة سؤال: عرض على دفعات، وأقسام مطوية افتراضيًا.
*/
const SUBJ_TABS = [
  { id:'overview', label:'نظرة عامة' },
  { id:'explain',  label:'الشرح' },
  { id:'bank',     label:'بنك الأسئلة' },
  { id:'memo',     label:'طريقة الحفظ' }
];
const BANK_PAGE = 50;   // دفعة العرض — التمرير يطلب المزيد بدل رسم ٥٠٠ عنصر دفعة واحدة

function findSubject(sid){
  return (QBANK.data.pack().subjects || []).filter(s => s.id === sid)[0] || null;
}

/* شريط سؤال واحد في البنك (وضع القائمة) */
function bankRow(sub, q, prog){
  const starred = !!prog.star[q.id];
  const starBtn = el('button', { class:'iconbtn', type:'button',
    'aria-label': starred ? 'أزل النجمة' : 'ميّز بنجمة', 'aria-pressed': String(starred) }, [
    el('span', { class:'iconbtn__ico', text: starred ? '★' : '☆',
      style: starred ? 'color:var(--star)' : '' })
  ]);
  starBtn.addEventListener('click', () => {
    QBANK.progress.toggleStar(sub.id, q.id);
    QBANK.router.render(location.hash);
  });

  const opts = el('div', { class:'stack q__opts', hidden:true },
    q.options.map((opt, oi) => {
      const right = oi === q.answer;
      return el('div', { class:'opt' + (right ? ' is-answer' : '') }, [
        el('span', { class:'opt__l', 'aria-hidden':'true', text: QBANK.views.optLetter(oi) }),
        el('span', { class:'ltr', text: opt }),
        right ? el('span', { class:'opt__tag', text:'الإجابة' }) : null,
        el('span', { class:'opt__mark', 'aria-hidden':'true', text: right ? '✓' : '' })
      ]);
    }));
  const trans = el('p', { class:'field__hint', hidden:true, text: q.translation || 'لا ترجمة بعد.' });
  const transBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'عرض الترجمة' });
  transBtn.addEventListener('click', () => {
    trans.hidden = !trans.hidden;
    transBtn.textContent = trans.hidden ? 'عرض الترجمة' : 'إخفاء الترجمة';
  });

  const head = el('button', { class:'rowbtn', type:'button', 'aria-expanded':'false' }, [
    el('span', { class:'ltr q__text', text: q.q })
  ]);
  // رقم السؤال في الهامش — يُقرأ بصوت مسموع: «افتح سؤال ٤٧»
  const num = el('span', { class:'qitem__n', 'aria-hidden':'true',
    text: QBANK.views.arNum((q.ord || 0) + 1) });
  head.addEventListener('click', () => {
    const open = opts.hidden;
    opts.hidden = !open;
    head.setAttribute('aria-expanded', String(open));
    if (open) QBANK.progress.markSeen(sub.id, q.id);   // فتح السؤال = رُوجع
  });

  return el('article', { class:'q qitem', 'data-qid': q.id }, [
    num,
    el('div', { class:'row' }, [
      head, starBtn,
      // ★ البلاغ عند السؤال نفسه لا في آخر الصفحة: من يرى الخطأ يراه هنا،
      //   وزرٌّ بعيد عن موضع المشكلة لا يُضغط
      QBANK.trust ? QBANK.trust.reportButton(sub.id, q.id) : null,
      prog.wrong[q.id] ? el('span', { class:'badge badge--bad num', text:'أخطأت ×' + prog.wrong[q.id] }) : null,
      q.important ? el('span', { class:'badge badge--warn', text:'مهم' }) : null
    ]),
    opts, el('div', { class:'row' }, [transBtn]), trans
  ]);
}

/* بطاقة مقلوبة (وضع البطاقات) */
function flipCard(sub, q){
  const card = el('div', { class:'flip', tabindex:'0', role:'button', 'aria-label':'بطاقة: اضغط لقلبها' }, [
    el('div', { class:'flip__in' }, [
      el('div', { class:'flip__face' }, [ el('p', { class:'ltr q__text', text: q.q }) ]),
      el('div', { class:'flip__face flip__face--back' }, [
        el('p', { class:'ltr', style:'font-weight:700', text: q.options[q.answer] }),
        q.expl_ar ? el('p', { class:'field__hint', text: q.expl_ar }) : null
      ])
    ])
  ]);
  const flip = () => {
    card.classList.toggle('is-flipped');
    QBANK.progress.markSeen(sub.id, q.id);
  };
  card.addEventListener('click', flip);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  return card;
}

/* تبويب البنك: بحث + فلاتر + وضعان + أقسام مطوية بالمحاور */
function bankTab(sub, questions){
  const state = QBANK.store.get('bank_ui', { filter:'all', mode:'list' });
  const prog = QBANK.progress.forSubject(sub.id);
  const box = el('div', { class:'stack' });

  const search = el('input', { class:'input', type:'search', id:'bankSearch',
    placeholder:'ابحث في ' + questions.length + ' سؤالًا…', 'aria-label':'بحث في بنك الأسئلة' });

  const FILTERS = [
    ['all','الكل'], ['unseen','لم أراجعه'], ['wrong','أخطأت فيه'], ['star','بنجمة']
  ];
  const filters = el('div', { class:'row', role:'group', 'aria-label':'تصفية الأسئلة' },
    FILTERS.map(([id, label]) => {
      const b = el('button', { class:'btn btn--sm ' + (state.filter === id ? 'btn--soft' : 'btn--ghost'),
        type:'button', 'aria-pressed': String(state.filter === id), text: label });
      b.addEventListener('click', () => {
        state.filter = id; QBANK.store.set('bank_ui', state);
        QBANK.router.render(location.hash);
      });
      return b;
    }));

  const modeBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button',
    text: state.mode === 'list' ? 'وضع البطاقات ▦' : 'وضع القائمة ☰' });
  modeBtn.addEventListener('click', () => {
    state.mode = state.mode === 'list' ? 'cards' : 'list';
    QBANK.store.set('bank_ui', state);
    QBANK.router.render(location.hash);
  });
  filters.appendChild(el('span', { class:'spacer' }));
  filters.appendChild(modeBtn);

  const listBox = el('div', { class:'stack', id:'bankList' });

  function applyFilters(){
    const term = (search.value || '').trim().toLowerCase();
    return questions.filter(q => {
      if (state.filter === 'unseen' && prog.seen[q.id]) return false;
      if (state.filter === 'wrong' && !prog.wrong[q.id]) return false;
      if (state.filter === 'star' && !prog.star[q.id]) return false;
      if (term && (q.q + ' ' + q.options.join(' ')).toLowerCase().indexOf(term) === -1) return false;
      return true;
    });
  }

  function render(){
    listBox.innerHTML = '';
    const filtered = applyFilters();
    if (!filtered.length) {
      listBox.appendChild(QBANK.views.empty('؟', 'لا نتائج', 'جرّب فلترًا آخر أو كلمة بحث أقصر.'));
      return;
    }
    // أقسام حسب المحاور — مطوية افتراضيًا مع عدد أسئلة كل قسم
    const topics = {};
    filtered.forEach(q => { const t = q.topic || 'عام'; (topics[t] = topics[t] || []).push(q); });
    Object.keys(topics).forEach(t => {
      const qs = topics[t];
      const inner = el('div', { class: state.mode === 'cards' ? 'grid grid--2' : 'stack' });
      let shown = 0;
      const more = el('button', { class:'btn btn--soft btn--block', type:'button' });
      function fill(){
        // دفعات العرض: ٥٠ سؤالًا في كل طلب — البنك يظل سلسًا على ٥٠٠ سؤال
        const next = qs.slice(shown, shown + BANK_PAGE);
        next.forEach(q => inner.appendChild(state.mode === 'cards' ? flipCard(sub, q) : bankRow(sub, q, prog)));
        shown += next.length;
        more.textContent = 'عرض المزيد (' + (qs.length - shown) + ' متبقٍ)';
        more.hidden = shown >= qs.length;
      }
      more.addEventListener('click', fill);
      fill();
      const fold = el('details', { class:'fold' }, [
        el('summary', {}, [ t + ' ', el('span', { class:'badge num', text: qs.length + ' سؤالًا' }) ]),
        inner, more
      ]);
      if (Object.keys(topics).length === 1) fold.setAttribute('open','');
      listBox.appendChild(fold);
    });
  }
  let debounce = null;
  search.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(render, 150); });

  render();
  box.appendChild(search); box.appendChild(filters); box.appendChild(listBox);
  return box;
}

/* تبويب الشرح: مطوي لكل سؤال — لماذا الصحيح صحيح ولماذا غيره خاطئ */
function explainTab(sub, questions){
  return el('div', { class:'stack' }, questions.map((q, i) =>
    el('details', { class:'fold card card--flat' }, [
      el('summary', {}, [ el('span', { class:'badge num', text:'س' + (i + 1) }), ' ',
        el('span', { class:'ltr', text: q.q.slice(0, 90) + (q.q.length > 90 ? '…' : '') }) ]),
      el('div', { class:'stack' }, [
        el('p', { class:'ltr', style:'font-weight:700;color:var(--ok)', text:'✓ ' + q.options[q.answer] }),
        el('p', { text: q.expl_ar || 'الشرح يُضاف من لوحة التحكم.' }),
        q.expl_en ? el('p', { class:'ltr field__hint', text: q.expl_en }) : null
      ])
    ])));
}

/* تبويب طريقة الحفظ: التحليل الشامل أولًا ثم بطاقات الأسئلة */
function memoTab(sub, questions){
  const box = el('div', { class:'stack' });

  /*
    ★ «طريقة الحفظ» الشاملة قبل البطاقات الفردية.
    الجداول والحيل المنحوتة («مُتّت»، «قهأب») تُلخّص المادة كلها — يقرؤها
    الطالب أولًا فتعطيه الهيكل، ثم بطاقات الأسئلة تملؤه. عكس الترتيب يغرقه
    في التفاصيل قبل الخريطة.
  */
  const slot = el('div', { class:'stack' });
  box.appendChild(slot);
  if (QBANK.analysis) QBANK.analysis.get(sub.id).then(a => {
    if (!slot.isConnected || !a) return;
    if (a.memorize) slot.appendChild(el('div', { class:'card' }, [ QBANK.views.analysisHtml(a.memorize) ]));
    if (a.mistakes) slot.appendChild(el('div', { class:'card stack' }, [
      el('h2', { text:'الأخطاء الشائعة' }),
      QBANK.views.analysisHtml(a.mistakes)
    ]));
  });

  const withMemo = questions.filter(q => q.mnemonic && (q.mnemonic.cue || q.mnemonic.key));
  if (!withMemo.length){
    box.appendChild(QBANK.views.empty('🧠', 'لا بطاقات حفظ للأسئلة بعد', 'تُبنى بطاقات الحفظ مع معالجة الذكاء وتظهر هنا.'));
    return box;
  }
  box.appendChild(el('div', { class:'stack' }, withMemo.map(q => {
    const m = q.mnemonic;
    return el('div', { class:'card stack' }, [
      el('div', { class:'row' }, [
        el('span', { class:'badge', text:'الكلمة الدالة' }),
        el('span', { class:'ltr', style:'font-weight:700', text: m.cue || '—' }),
        el('span', { 'aria-hidden':'true', text:'←' }),
        el('span', { class:'badge badge--ok', text:'المفتاح' }),
        el('span', { class:'ltr', style:'font-weight:700', text: m.key || '—' })
      ]),
      m.link ? el('p', { style:'margin:0', text:'🔗 ' + m.link }) : null,
      m.strike ? el('p', { class:'field__hint', style:'margin:0', text:'✂ ' + m.strike }) : null
    ]);
  })));
  return box;
}

/* تبويب النظرة العامة */
function overviewTab(sub, questions){
  const prog = QBANK.progress.forSubject(sub.id);
  const pct = QBANK.progress.pctDone(sub.id, questions.length);

  /* «عن المادة» المحلَّلة والمحاور بعدّاداتها — تصل غير متزامنة فتملأ فتحتها */
  const aSlot = el('div', { class:'stack' });
  if (QBANK.analysis) QBANK.analysis.get(sub.id).then(a => {
    if (!aSlot.isConnected || !a) return;
    if (a.overview){
      aSlot.appendChild(el('div', { class:'card stack' }, [
        el('h2', { text:'عن المادة' }),
        QBANK.views.analysisHtml(a.overview)
      ]));
      /* الاحتياط (الوصف القصير وشارات المحاور) ينسحب حين يصل الأصل */
      const root = aSlot.parentNode;
      if (root) root.querySelectorAll('[data-fallback]').forEach(x => x.remove());
    }
    const tc = QBANK.views.topicsCard(a);
    if (tc) aSlot.appendChild(tc);
    /* تحليل بَطَل (أُضيفت أسئلة بعده) يُعاد توليده تلقائيًا لصاحبه */
    QBANK.analysis.maybeRefresh(sub, a, () => {
      QBANK.analysis.get(sub.id, true).then(() => {
        if (aSlot.isConnected) QBANK.router.render(location.hash);
      });
    });
  });

  return el('div', { class:'stack' }, [
    aSlot,
    sub.descr ? el('div', { class:'card', 'data-fallback':'1' }, [ el('p', { style:'margin:0', text: sub.descr }) ]) : null,
    el('div', { class:'card stack' }, [
      el('h2', { text:'تقدّمك' }),
      el('div', { class:'subj__meter' }, [ el('div', { style:'width:' + pct + '%;background:' + QBANK.views.subjectColor(sub.color) }) ]),
      el('div', { class:'row' }, [
        el('span', { class:'badge num', text:'راجعت ' + Object.keys(prog.seen).length + ' من ' + questions.length }),
        el('span', { class:'badge badge--bad num', text:'أخطاء ' + Object.keys(prog.wrong).length }),
        el('span', { class:'badge num', text:'اختبارات ' + prog.exams }),
        prog.best ? el('span', { class:'badge badge--ok num', text:'أفضل نتيجة ' + prog.best + '٪' }) : null
      ])
    ]),
    /* شارات المحاور القديمة احتياطٌ لمادة بلا تحليل — topicsCard أغنى منها */
    (sub.topics && sub.topics.length) ? el('div', { class:'card', 'data-fallback':'1' }, [
      el('h2', { text:'المحاور' }),
      el('div', { class:'row' }, sub.topics.map(t => el('span', { class:'badge', text: t })))
    ]) : null,
    /* نبض المادة: الرقم الذي يُبقي الطالب مستيقظًا ليلة الامتحان */
    QBANK.community ? QBANK.community.pulseBand(sub.id) : null,
    QBANK.community ? QBANK.community.challengeBox(sub) : null,
    /* التقييم أسفل الشاشة لا أعلاها: يُقيّم من راجع، ومن راجع وصل إلى هنا */
    QBANK.trust ? el('div', { class:'card stack' }, [
      el('div', { class:'row', style:'justify-content:space-between;align-items:center' }, [
        el('h2', { style:'margin:0', text:'قيّم هذه المادة' }),
        el('div', { class:'row' }, QBANK.trust.badges(sub))
      ]),
      el('p', { class:'field__hint', style:'margin:0',
        text:'تقييمك يرفع البنوك النافعة إلى أعلى نتائج زملائك — ويُنزل ما دونها.' }),
      QBANK.trust.ratingWidget(sub)
    ]) : null
  ]);
}

/*
  تجديد القائمة ثم إعادة المحاولة — مرة واحدة.
  لو أخفقنا ثانيةً فالمادة غير متاحة فعلًا (أُخفيت، أو لم تُشترَ بعد، أو
  الرابط خطأ)، وحينها فقط نقولها. والفشل بلا اتصال يُقال باسمه: «تعذّر
  الوصول» غير «غير موجودة» — الأولى تُعاد المحاولة فيها، والثانية تُيئِس.
*/
function refetchThenSubject(sid, title){
  const box = el('div', { class:'stack' }, [
    el('p', { class:'page__sub', text:'جارٍ تحديث قائمة المواد…' }) ]);

  QBANK.data.refreshPack().then(r => {
    if (!box.isConnected) return;                 // غادر الطالب — لا نلمس شاشة أخرى
    if (findSubject(sid)){
      // نُعيد رسم المسار نفسه — لا نُنقل الطالب، فهو حيث أراد أن يكون
      try { return void QBANK.router.render(location.hash || '#/'); }
      catch(e){ return; }
    }
    box.innerHTML = '';
    box.appendChild(r && r.ok === false && r.offline
      ? QBANK.views.empty('⚡', 'تعذّر الوصول',
          'لا اتصال الآن. المادة قد تكون موجودة — أعد المحاولة حين يعود الإنترنت.',
          el('a', { class:'btn', href:'#/', text:'الرئيسية' }))
      : QBANK.views.empty('؟', 'المادة غير متاحة',
          'ربما أوقفها المشرف، أو تغيّر رابطها، أو لم تُنشر بعد.',
          el('a', { class:'btn', href:'#/explore', text:'استكشف المواد' })));
  });

  return QBANK.views.page(title || 'المادة', null, [box]);
}

const ViewSubject = {
  title:'المادة',
  view(route){
    const sid = route.rest[0];
    const sub = findSubject(sid);
    /*
      ★ «غير موجودة» ليست حقيقة عن القاعدة — هي حقيقة عن نسخةٍ في هذا الجهاز.
      قائمة المواد تُجلب مرة عند الإقلاع وتبقى في التخزين المحلي. فمادةٌ
      نُشرت بعدها — نشرتَها أنت قبل ثوانٍ، أو نشرها زميلك وأرسل لك رابطها،
      أو أضفتَها من جوّالك وفتحتها على حاسوبك — ليست فيها. فكنّا نقول
      للطالب «غير موجودة» ونحن لم نسأل الخادم أصلًا.
      نسأل مرة، ثم نحكم.
    */
    if (!sub) return refetchThenSubject(sid);

    QBANK.gate.captureRef(route.query);          // ?ref= يُحفظ قبل أي شيء آخر
    QBANK.trial.stop();                          // مغادرة مادة توقف عدّادها

    // بوابة المحتوى: مادة غير مملوكة تعرض بطاقة الشراء لا المحتوى.
    // نعرض بالتخمين المحلي فورًا (لا وميض)، ثم نصحّح بقرار القاعدة حين يصل.
    const guess = QBANK.gate.localGuess(sub);
    if (!guess.allowed) {
      const box = el('div', {}, [ QBANK.gate.paywallCard(sub) ]);
      return QBANK.views.page(sub.name, null, [box]);
    }

    const active = SUBJ_TABS.some(t => t.id === route.rest[1]) ? route.rest[1] : 'overview';
    const tabs = el('div', { class:'tabs', role:'tablist' }, SUBJ_TABS.map(t =>
      el('button', { class:'tabs__btn', type:'button', role:'tab', 'data-tab': t.id,
        'aria-selected': String(t.id === active), text: t.label })));
    tabs.addEventListener('click', e => {
      const b = e.target.closest('[data-tab]');
      if (b) QBANK.router.go('#/subject/' + sid + '/' + b.getAttribute('data-tab'));
    });

    const body = el('div', { class:'stack', id:'subjBody' },
      [ el('p', { class:'page__sub', text:'جارٍ تجهيز الأسئلة…' }) ]);

    // شريط التجربة يُعلَّق فوق التبويبات متى قالت القاعدة إن الوصول بالتجربة
    const trialSlot = el('div', {});
    QBANK.trial.access(sid).then(a => {
      if (!trialSlot.isConnected || !a) return;   // null = تعذّر السؤال، لا رفض
      if (a.reason === 'trial'){
        trialSlot.appendChild(QBANK.trial.start(sid, Number(a.seconds_left), () => {
          QBANK.router.render(location.hash);    // انتهت: نعيد الرسم فتظهر شاشة الشراء
        }));
      } else if (a.reason === 'entitled' && a.owner && a.hours_left != null){
        /* ★ مدّةٌ تنتهي بلا إعلان تبدو خيانة.
           الرافع يفتح مادته اليوم فيظنّها ملكه أبدًا، فإن أُقفلت غدًا فجأة
           شعر أنه أُخذ منه شيء. الرقم المعلن يجعلها اتفاقًا لا مفاجأة. */
        trialSlot.appendChild(el('div', { class:'card ownerband' }, [
          el('p', { style:'margin:0', text:'▣ هذه مادتك — رفعتَها أنت.' }),
          el('p', { class:'field__hint', style:'margin:0', text:
            Number(a.hours_left) > 0
              ? 'وصولك المجاني ينتهي بعد ' + QBANK.views.arNum(Number(a.hours_left)) + ' ساعة.'
              : 'وصولك المجاني ينتهي قريبًا.' })
        ]));
      } else if (!a.allowed){
        // القاعدة رفضت رغم تخميننا — قرارها هو النافذ
        const p = trialSlot.closest('#main') || trialSlot.parentNode;
        if (p){
          p.innerHTML = '';
          p.appendChild(a.reason === 'trial_expired'
            ? QBANK.trial.expiredCard(sub) : QBANK.gate.paywallCard(sub));
        }
      }
    });

    QBANK.data.subjectQuestions(sid).then(r => {
      if (!body.isConnected) return;
      body.innerHTML = '';
      if (!r.ok && !r.data.length) {
        body.appendChild(QBANK.views.empty('⇣', 'الأسئلة لم تُنزَّل بعد',
          'افتح المادة مرة واحدة بإنترنت لتُخزَّن أسئلتها في جهازك، ثم تعمل بلا اتصال.'));
        return;
      }
      const qs = r.data;
      const fill = { overview: overviewTab, explain: explainTab, bank: bankTab, memo: memoTab }[active];
      body.appendChild(fill(sub, qs));
    });

    const printBtn = el('button', { class:'copybtn', type:'button', text:'🖨 طباعة / PDF' });
    printBtn.addEventListener('click', () => QBANK.views.openPrintDialog(sub));
    /*
      ★ «انشر» لا «انسخ».
      النسخ يطلب من الطالب ثلاث خطوات: ينسخ، ويفتح واتساب، ويلصق — ويسقط
      بعضهم في كل واحدة. ونافذة النظام تفعلها بضغطة وتعرض تطبيقاته كلها.
      والرابط يحمل معرّف الرافع (ref) فتُنسب إليه الإحالة كما كان.
    */
    const shareBtn = el('button', { class:'copybtn', type:'button', text:'⤴ انشر المادة' });
    shareBtn.addEventListener('click', async () => {
      const me = QBANK.api.user();
      const url = (sub.slug && QBANK.share)
        ? QBANK.share.shareUrl(sub.slug, me && me.id)
        : QBANK.share.absUrl('#/subject/' + sid);
      const r = await QBANK.share.sharePlain(url, sub.name,
        'بنك أسئلة «' + sub.name + '» على مراجعة');
      if (r.ok && r.via === 'copy') QBANK.toast('نُسخ رابط المادة');
      else if (!r.ok && !r.cancelled) QBANK.toast('تعذّرت المشاركة');
    });

    /*
      رأس AMSU: تدرّج بلون المادة من حافة الشاشة لحافتها، أيقونة في صندوق
      زجاجي، الاسم وتحته الإنجليزي، رقائق إحصائية، وزر الاختبار على الطرف.
    */
    const nTopics = (sub.topics && sub.topics.length) || 0;
    const hero = el('section', { class:'sub-hero', style:'--acc:' + subjectColor(sub.color) }, [
      el('div', { class:'wrap' }, [
        el('div', { class:'herotop' }, [
          el('a', { class:'backbtn', href:'#/', text:'‹ كل المواد' }),
          el('div', { class:'topacts' }, [shareBtn, printBtn])
        ]),
        el('div', { class:'inner' }, [
          el('div', { class:'figwrap', 'aria-hidden':'true' }, [
            el('span', { class:'fig', text: sub.icon || '▤' })
          ]),
          el('div', { class:'hx' }, [
            el('h2', { text: sub.name }),
            sub.name_en ? el('div', { class:'sub ltr', text: sub.name_en }) : null,
            el('div', { class:'stats num' }, [
              el('span', { class:'stat', text: QBANK.views.arNum(sub.q_count || 0) + ' سؤالًا' }),
              nTopics ? el('span', { class:'stat', text: QBANK.views.arNum(nTopics) + ' محاور' }) : null,
              sub.free ? el('span', { class:'stat', text:'مجانية' }) : null
            ])
          ]),
          el('a', { class:'hero-exam', href:'#/exam/' + sid }, [
            el('span', {}, [
              document.createTextNode('اختبار تجريبي'),
              el('small', { text:'في هذه المادة' })
            ])
          ])
        ])
      ])
    ]);

    return el('div', { class:'page page--subject' }, [
      hero,
      /* ★ «رفعها فلان» — المحتوى من الطلاب، فليُعرف صاحبه ويُقيَّم */
      QBANK.views.uploaderLine ? QBANK.views.uploaderLine(sid) : null,
      trialSlot,
      /* عدّاد كل طالبٍ لموعده هو — الشُّعب تختلف، وموعدك لا يخص زميلك */
      QBANK.examDate ? QBANK.examDate.band(sid) : null,
      tabs, body
    ]);
  }
};
QBANK.views.ViewSubject = ViewSubject;
QBANK.views.bankTab = bankTab;


/* ===== 36-examview.js ===== */
/*
  واجهة الاختبار التجريبي — المادة مثبّتة من مسار الدخول فلا خطوة اختيار.
  المحرك في 24-exam.js؛ هنا الشاشات الثلاث: الإعداد ← الأسئلة ← النتيجة.
*/
let examState = null;   // {exam, sub, timerId, secondsLeft}

function examSetup(sub, questions){
  const prog = QBANK.progress.forSubject(sub.id);
  const topics = Array.from(new Set(questions.map(q => q.topic || 'عام')));

  const scopeSel = el('select', { class:'input', id:'exScope', 'aria-label':'نطاق الاختبار' }, [
    el('option', { value:'all', text:'كل الأسئلة (' + questions.length + ')' }),
    el('option', { value:'important', text:'الأسئلة المهمة (' + questions.filter(q => q.important).length + ')' }),
    el('option', { value:'wrong', text:'أخطائي السابقة (' + Object.keys(prog.wrong).length + ')' })
  ].concat(topics.map(t => el('option', { value:'topic:' + t, text:'قسم: ' + t }))));

  const timerSel = el('select', { class:'input', id:'exTimer', 'aria-label':'المؤقت' }, [
    el('option', { value:'0', text:'بلا مؤقت' }),
    el('option', { value:'10', text:'١٠ دقائق' }),
    el('option', { value:'20', text:'٢٠ دقيقة' }),
    el('option', { value:'45', text:'٤٥ دقيقة' })
  ]);

  // التصحيح الفوري بعد كل سؤال هو الافتراضي
  const modeSel = el('select', { class:'input', id:'exMode', 'aria-label':'نمط التصحيح' }, [
    el('option', { value:'instant', text:'تصحيح فوري بعد كل سؤال (الافتراضي)' }),
    el('option', { value:'end', text:'التصحيح بعد الانتهاء' })
  ]);

  const start = el('button', { class:'btn btn--block', type:'button', text:'ابدأ الاختبار' });
  start.addEventListener('click', () => {
    const sv = scopeSel.value;
    const opts = {
      scope: sv.indexOf('topic:') === 0 ? 'topic' : sv,
      topic: sv.indexOf('topic:') === 0 ? sv.slice(6) : '',
      mode: modeSel.value,
      timerMin: parseInt(timerSel.value, 10),
      wrongMap: prog.wrong
    };
    const exam = QBANK.exam.create(questions, opts);
    if (!exam.items.length) { QBANK.toast('لا أسئلة في هذا النطاق'); return; }
    examState = { exam, sub, secondsLeft: opts.timerMin * 60, timerId: null };
    if (opts.timerMin) {
      examState.timerId = setInterval(() => {
        examState.secondsLeft--;
        const t = document.getElementById('exClock');
        if (t) {
          t.textContent = Math.floor(examState.secondsLeft / 60) + ':' + String(examState.secondsLeft % 60).padStart(2,'0');
          t.classList.toggle('is-low', examState.secondsLeft <= 60);
        }
        if (examState.secondsLeft <= 0) finishExam();   // انتهى الوقت: تسليم تلقائي
      }, 1000);
    }
    QBANK.router.render(location.hash);
  });

  return el('div', { class:'card stack' }, [
    el('h2', { text:'إعداد الاختبار' }),
    el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'النطاق' }), scopeSel ]),
    el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'المؤقت' }), timerSel ]),
    el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'التصحيح' }), modeSel ]),
    el('p', { class:'field__hint', text:'الأسئلة التي أخطأت فيها سابقًا لها أولوية الظهور، والخيارات تُخلط في كل مرة.' }),
    start
  ]);
}

function finishExam(){
  const st = examState;
  if (!st || st.exam.finished) return;
  if (st.timerId) clearInterval(st.timerId);
  st.result = QBANK.exam.finish(st.exam);
  // تسجيل المحاولة: محليًا فورًا، وللحساب في الخلفية
  QBANK.progress.recordExam(st.sub.id, st.result.pct);
  st.result.wrongIds.forEach(qid => QBANK.progress.markWrong(st.sub.id, qid));
  st.exam.items.forEach((it, i) => {
    if (st.exam.answers[i] && st.exam.answers[i].correct) QBANK.progress.clearWrong(st.sub.id, it.id);
  });
  /*
    ★ كل سؤال أُجيب عنه يدخل جدول المراجعة.
    هنا لا في لحظة الضغط: الطالب قد يرجع ويغيّر إجابته قبل التسليم،
    والنتيجة النهائية هي الحكم. والذي لم يُجب عنه لا يُجدوَل — عدم
    الإجابة ليس خطأً في الاسترجاع، هو نفاد وقت أو ملل.
  */
  st.exam.items.forEach((it, i) => {
    const a = st.exam.answers[i];
    if (a) QBANK.progress.review(st.sub.id, it.id, !!a.correct);
  });
  if (QBANK.api.user()) QBANK.api.rest('attempts', { method:'POST', body: JSON.stringify({
    user_id: QBANK.api.user().id, subject_id: st.sub.id, scope:'all', topic:'',
    correct: st.result.correct, total: st.result.total, pct: st.result.pct,
    duration_s: st.result.duration_s }) });
  QBANK.router.render(location.hash);
}

function examRunner(){
  const st = examState;
  const exam = st.exam;
  const item = exam.items[exam.i];
  const answered = exam.answers[exam.i];

  const opts = el('div', { class:'stack q__opts' }, item.options.map((opt, oi) => {
    let cls = 'opt', mark = '';
    if (answered && exam.mode === 'instant') {
      // فوري: اللون والأيقونة معًا — ✓ للصحيح و ✗ للاختيار الخاطئ
      if (oi === item.correct) { cls += ' is-answer'; mark = '✓'; }
      else if (oi === answered.choice) { cls += ' is-wrong'; mark = '✗'; }
    } else if (answered && answered.choice === oi) { cls += ' is-answer'; mark = '●'; }
    const b = el('button', { class: cls, type:'button', disabled: answered ? true : null }, [
      el('span', { class:'opt__l', 'aria-hidden':'true', text: QBANK.views.optLetter(oi) }),
      el('span', { class:'ltr', text: opt }),
      el('span', { class:'opt__mark', 'aria-hidden':'true', text: mark })
    ]);
    b.addEventListener('click', () => {
      QBANK.exam.answer(exam, oi);
      QBANK.router.render(location.hash);
    });
    return b;
  }));

  const answeredCount = exam.answers.filter(a => a !== null).length;
  const nav = el('div', { class:'row' }, [
    el('button', { class:'btn btn--ghost btn--sm', type:'button', id:'exPrev',
      disabled: exam.i === 0 ? true : null, text:'→ السابق' }),
    el('span', { class:'spacer' }),
    el('span', { class:'badge num', text: (exam.i + 1) + ' / ' + exam.items.length }),
    st.secondsLeft ? el('span', { class:'timer badge num', id:'exClock',
      text: Math.floor(st.secondsLeft / 60) + ':' + String(st.secondsLeft % 60).padStart(2,'0') }) : null,
    el('span', { class:'spacer' }),
    exam.i < exam.items.length - 1
      ? el('button', { class:'btn btn--sm', type:'button', id:'exNext', text:'التالي ←' })
      : el('button', { class:'btn btn--sm', type:'button', id:'exFinish',
          text:'أنهِ الاختبار (' + answeredCount + '/' + exam.items.length + ')' })
  ]);
  nav.addEventListener('click', e => {
    if (e.target.id === 'exPrev') { QBANK.exam.prev(exam); QBANK.router.render(location.hash); }
    if (e.target.id === 'exNext') { QBANK.exam.next(exam); QBANK.router.render(location.hash); }
    if (e.target.id === 'exFinish') finishExam();
  });

  return el('div', { class:'stack' }, [
    el('div', { class:'card stack q' }, [
      el('p', { class:'ltr q__text', text: item.q }), opts,
      (answered && exam.mode === 'instant' && item.expl_ar)
        ? el('p', { class:'field__hint', text: item.expl_ar }) : null,
      /*
        ★ الزرّان بعد الإجابة لا قبلها.
        قبلها يكشفان أن للسؤال جوابًا يُشرح فيقلّان من جدّية المحاولة،
        وبعدها يقعان في اللحظة التي يريد فيها الطالب أن يفهم فعلًا.
        و«اشرح لي» يظهر للمخطئ وحده — من أصاب لا شيء يُشرح له.
      */
      (answered && exam.mode === 'instant' && QBANK.explain)
        ? QBANK.explain.button(
            { id:item.id, q:item.q, options:item.options, answer:item.correct, topic:item.topic },
            answered.choice) : null,
      (answered && QBANK.shareCard)
        ? QBANK.shareCard.button({ id:item.id, q:item.q, options:item.options,
                                   _sid: st.sub.id }) : null
    ]),
    nav
  ]);
}

function examResult(){
  const st = examState, r = st.result;
  const topicRows = Object.keys(r.byTopic).map(t => {
    const d = r.byTopic[t];
    const pct = Math.round(d.correct / d.total * 100);
    return el('div', { class:'row' }, [
      el('span', { text: t }),
      el('span', { class:'spacer' }),
      el('span', { class:'badge num ' + (pct >= 70 ? 'badge--ok' : 'badge--bad'), text: d.correct + '/' + d.total })
    ]);
  });
  const retryWrong = el('button', { class:'btn btn--soft btn--block', type:'button',
    text:'أعد اختبار الأخطاء فقط (' + r.wrongIds.length + ')' , disabled: r.wrongIds.length ? null : true });
  retryWrong.addEventListener('click', async () => {
    const qs = (await QBANK.data.subjectQuestions(st.sub.id)).data;
    const wrongSet = {};
    r.wrongIds.forEach(id => wrongSet[id] = 1);
    const exam = QBANK.exam.create(qs, { scope:'wrong', wrongMap: wrongSet, mode: st.exam.mode });
    examState = { exam, sub: st.sub, secondsLeft: 0, timerId: null };
    QBANK.router.render(location.hash);
  });

  const review = el('details', { class:'fold' }, [
    el('summary', {}, ['مراجعة كاملة للأسئلة']),
    el('div', { class:'stack' }, r.review.map((rv, i) => el('div', { class:'card card--flat stack q' }, [
      el('div', { class:'row' }, [
        el('span', { class:'badge num', text:'س' + (i + 1) }),
        rv.ok ? el('span', { class:'badge badge--ok', text:'✓ صحيح' })
              : el('span', { class:'badge badge--bad', text:'✗ خطأ' })
      ]),
      el('p', { class:'ltr q__text', text: rv.q }),
      el('div', { class:'stack q__opts' }, rv.options.map((o, oi) =>
        el('div', { class:'opt' + (oi === rv.correct ? ' is-answer' : (oi === rv.chosen ? ' is-wrong' : '')) }, [
          el('span', { class:'opt__l', 'aria-hidden':'true', text: QBANK.views.optLetter(oi) }),
          el('span', { class:'ltr', text: o }),
          oi === rv.correct ? el('span', { class:'opt__tag', text:'الإجابة' }) : null,
          el('span', { class:'opt__mark', 'aria-hidden':'true', text: oi === rv.correct ? '✓' : (oi === rv.chosen ? '✗' : '') })
        ]))),
      rv.expl_ar ? el('p', { class:'field__hint', text: rv.expl_ar }) : null
    ])))
  ]);

  return el('div', { class:'stack' }, [
    el('div', { class:'card', style:'text-align:center' }, [
      el('div', { class:'result__pct num', text: r.pct + '٪' }),
      el('div', { class:'result__grade', text: r.grade }),
      el('p', { class:'page__sub num', text: r.correct + ' من ' + r.total + ' · ' + Math.round(r.duration_s / 60) + ' دقيقة' })
    ]),
    el('div', { class:'card stack' }, [ el('h2', { text:'حسب المحاور' }) ].concat(topicRows)),
    retryWrong, review,
    el('a', { class:'btn btn--ghost btn--block', href:'#/subject/' + st.sub.id, text:'عودة إلى المادة' })
  ]);
}

const ViewExam = {
  title:'اختبار تجريبي',
  view(route){
    const sid = route.rest[0];
    const sub = (QBANK.data.pack().subjects || []).filter(s => s.id === sid)[0];
    // ★ نفس العلاج: رابط اختبارٍ مباشر قد يسبق قائمةَ هذا الجهاز
    if (!sub) return refetchThenSubject(sid, 'اختبار');

    if (!QBANK.gate.localGuess(sub).allowed) {
      return QBANK.views.page(sub.name, null, [ QBANK.gate.paywallCard(sub) ]);
    }

    // مادة مثبّتة — لا خطوة اختيار مادة
    if (examState && examState.sub.id === sid) {
      if (examState.exam.finished) return QBANK.views.page('نتيجتك — ' + sub.name, null, [examResult()]);
      return QBANK.views.page('اختبار — ' + sub.name, null, [examRunner()]);
    }
    const body = el('div', { class:'stack' }, [ el('p', { class:'page__sub', text:'جارٍ التجهيز…' }) ]);
    QBANK.data.subjectQuestions(sid).then(r => {
      if (!body.isConnected) return;
      body.innerHTML = '';
      if (!r.data.length) { body.appendChild(QBANK.views.empty('⇣', 'لا أسئلة متاحة', 'افتح المادة أولًا بإنترنت.')); return; }
      body.appendChild(examSetup(sub, r.data));
    });
    return QBANK.views.page('اختبار — ' + sub.name, 'خلط عادل، وأولوية لأخطائك السابقة.', [body]);
  },
  _reset(){ if (examState && examState.timerId) clearInterval(examState.timerId); examState = null; },
  _state(){ return examState; },
  _set(s){ examState = s; },
  _finish: finishExam
};
QBANK.views.ViewExam = ViewExam;


/* ===== 37-print.js ===== */
/*
  الطباعة / PDF — تنسيق مستقل تمامًا عن الشاشة:
  يبني وثيقة داخل حاوية مخفية تظهر وحدها عند الطباعة، بترويسة بلون المادة،
  وأسئلة لا تنقسم بين صفحتين، وتذييل يتكرر أسفل كل صفحة.
*/
function buildPrintDoc(sub, questions, opts){
  const root = el('div', { class:'print-root' + (opts.economic ? ' print--eco' : ''), dir:'rtl' });
  root.appendChild(el('header', { class:'print-head', style: opts.economic ? '' :
    'border-color:' + QBANK.views.subjectColor(sub.color) }, [
    el('h1', { text: sub.name }),
    el('p', { text: { bank:'بنك الأسئلة', explain:'الشرح', memo:'بطاقات الحفظ',
                      overview:'نظرة عامة', full:'المادة كاملة' }[opts.what] })
  ]));

  let qs = questions;
  if (opts.range === 'important') qs = qs.filter(q => q.important);
  if (opts.range === 'starred') {
    const star = QBANK.progress.forSubject(sub.id).star;
    qs = qs.filter(q => star[q.id]);
  }

  if (opts.what === 'overview') {
    root.appendChild(el('p', { text: sub.descr || '' }));
    (sub.topics || []).forEach(t => root.appendChild(el('p', { text:'• ' + t })));
  } else if (opts.what === 'full') {
    /*
      ★ المادة كاملة — ورقة ليلة الاختبار.
      «عن المادة» ثم كل سؤال بخياراته وإجابته وشرحه، ثم «طريقة الحفظ»
      و«الأخطاء الشائعة» بجداولها. طالب كثيرون يذاكرون من الورق آخر ليلة،
      وهذه الوثيقة تغنيه عن فتح الشاشة أصلًا.
    */
    if (opts.analysis && opts.analysis.overview){
      root.appendChild(el('h2', { text:'عن المادة' }));
      root.appendChild(QBANK.views.analysisHtml(opts.analysis.overview));
    }
    qs.forEach((q, i) => {
      const block = el('div', { class:'q print-q' }, [
        el('p', { class:'ltr', style:'font-weight:700', text: (i + 1) + ') ' + q.q })
      ]);
      q.options.forEach((o, oi) => {
        const isAns = oi === q.answer;
        block.appendChild(el('p', { class:'ltr print-opt' + (isAns ? ' print-ans' : ''),
          text: String.fromCharCode(65 + oi) + ') ' + o + (isAns ? '  ✓' : '') }));
      });
      if (q.expl_ar) block.appendChild(el('p', { class:'print-expl', text: q.expl_ar }));
      root.appendChild(block);
    });
    if (opts.analysis && opts.analysis.memorize){
      root.appendChild(el('h2', { text:'طريقة الحفظ' }));
      root.appendChild(QBANK.views.analysisHtml(opts.analysis.memorize));
    }
    if (opts.analysis && opts.analysis.mistakes){
      root.appendChild(el('h2', { text:'الأخطاء الشائعة' }));
      root.appendChild(QBANK.views.analysisHtml(opts.analysis.mistakes));
    }
  } else if (opts.what === 'memo') {
    qs.forEach((q, i) => {
      const m = q.mnemonic || {};
      if (!m.cue && !m.key) return;
      root.appendChild(el('div', { class:'q print-q' }, [
        el('p', { text: (i + 1) + ') ' + (m.cue || '') + ' ← ' + (m.key || '') }),
        m.link ? el('p', { text:'🔗 ' + m.link }) : null
      ]));
    });
  } else {
    qs.forEach((q, i) => {
      const block = el('div', { class:'q print-q' }, [
        el('p', { class:'ltr', style:'font-weight:700', text: (i + 1) + ') ' + q.q })
      ]);
      q.options.forEach((o, oi) => {
        const isAns = oi === q.answer && opts.answers;
        block.appendChild(el('p', { class:'ltr print-opt' + (isAns ? ' print-ans' : ''),

      if (opts.translation && q.translation) block.appendChild(el('p', { class:'print-expl', text: q.translation }));
      root.appendChild(block);
    });
  }

  // التذييل الثابت أسفل كل صفحة — يفرضه تنسيق الطباعة
  root.appendChild(el('footer', { class:'print-foot', text:'برمجة وتصميم علي الصقور' }));

    ans.node, expl.node, trans.node, eco.node, go, cancel
  ]);
  cancel.addEventListener('click', () => dialog.remove());
  go.addEventListener('click', async () => {
    const r = await QBANK.data.subjectQuestions(sub.id);
    // «المادة كاملة» تحتاج التحليل — يُجلب هنا لا مع كل فتح للحوار
    const analysis = (what.value === 'full' && QBANK.analysis)
      ? await QBANK.analysis.get(sub.id) : null;
    const doc = buildPrintDoc(sub, r.data, {
      what: what.value, range: range.value, analysis,
      answers: ans.input.checked, expl: expl.input.checked,
      translation: trans.input.checked, economic: eco.input.checked
    });
    document.body.appendChild(doc);

/*
  صفحة الهبوط التعريفية — تُعرض للزائر غير المسجَّل فقط.
  الطالب المسجَّل يرى بطاقات مواده مباشرة كما كان، فلا نضيف له خطوة.

  ★ قاعدة هذه الصفحة: شرحُ عمل المنصة فقط — ولا مادة واحدة بعينها.
