/* ===== 59-review.js ===== */
/*
  ═══════════════════════════════════════════════════════════════════
  «راجع اليوم» — الشاشة التي تعطي المنصةَ سببًا للفتح كل صباح
  ═══════════════════════════════════════════════════════════════════
  كل ما قبلها يفترض أن الطالب يعرف متى يذاكر وماذا: يفتح مادة، يختار
  اختبارًا، يضبط عددًا. وهذا افتراضٌ خاطئ — الطالب يعرف أن عليه المذاكرة
  ولا يعرف من أين يبدأ، فيؤجّل. هذه الشاشة تُجيب عن السؤال نيابةً عنه:
  «راجع اليوم: ٢٣ سؤالًا» — رقمٌ واحد، وزرٌّ واحد، وينتهي التردّد.

  والمستحقّ يُجمع من كل المواد لا من مادة: النسيان لا يحترم حدود المقرّرات.
*/

const Review = {
  /*
    بناء جلسة المراجعة: نجمع المستحقّ، ثم نجلب أسئلته من مواده.
    الجلب متوازٍ لا متسلسل — عشر مواد بالتسلسل تعني عشر رحلات متتابعة
    يراها الطالب انتظارًا، وبالتوازي رحلةً واحدة بعرضٍ أوسع.
  */
  async session(limit, now){
    const due = QBANK.progress.dueAll(now);
    if (!due.length) return { items: [], subjects: [], total: 0 };

    const cap = limit || 40;
    const take = due.slice(0, cap);
    const bySub = {};
    take.forEach(d => { (bySub[d.sid] = bySub[d.sid] || []).push(d.qid); });

    const sids = Object.keys(bySub);
    const packs = await Promise.all(sids.map(sid => QBANK.data.subjectQuestions(sid)));

    const items = [];
    const subjects = [];
    const all = QBANK.data.pack().subjects || [];
    sids.forEach((sid, i) => {
      const qs = (packs[i] && packs[i].data) || [];
      const want = {};
      bySub[sid].forEach(q => { want[q] = 1; });
      const found = qs.filter(q => want[q.id]);
      if (!found.length) return;
      const meta = all.filter(x => x.id === sid)[0];
      subjects.push({ id: sid, name: (meta && meta.name) || 'مادة', n: found.length });
      found.forEach(q => items.push(Object.assign({ _sid: sid }, q)));
    });
    return { items, subjects, total: due.length };
  },

  /*
    ★ المراجعة تُسجَّل سؤالًا سؤالًا لا في آخر الجلسة.
    جلسة المراجعة تُقطع كثيرًا — محاضرة تبدأ، مكالمة، بطارية تنفد. ولو
    انتظرنا النهاية لضاع عمل عشر دقائق وعاد السؤال نفسه غدًا كأن شيئًا
    لم يكن. الاختبار الكامل غير ذلك: له نهاية معلنة ونتيجة تُحسب.
  */
  answer(sid, qid, ok){
    QBANK.progress.review(sid, qid, ok);
    if (ok) QBANK.progress.clearWrong(sid, qid); else QBANK.progress.markWrong(sid, qid);
    QBANK.progress.markSeen(sid, qid);
  }
};
QBANK.review = Review;

/* ═══ بطاقة الرئيسية: الرقم الذي يُعيد الطالب كل يوم ═══ */
function reviewCard(){
  const due = QBANK.progress.dueAll();
  const N = QBANK.views.arNum;

  if (!due.length) {
    const after = QBANK.progress.nextDue();
    /* لا مستحقّ: لا نُخفي البطاقة بل نقول متى يعود. الفراغ يُقرأ عطلًا،
       و«عد بعد يومين» يُقرأ نظامًا يعمل لأجله في غيابه. */
    if (after === null) return null;      // لم يذاكر شيئًا بعد — لا معنى للبطاقة
    return el('div', { class:'card revcard revcard--done' }, [
      el('span', { class:'revcard__ico', 'aria-hidden':'true', text:'✓' }),
      el('div', { class:'revcard__x' }, [
        el('p', { class:'revcard__t', text:'أنهيتَ مراجعة اليوم' }),
        el('p', { class:'revcard__s', text: after === 1
          ? 'المراجعة القادمة غدًا.'
          : 'المراجعة القادمة بعد ' + N(after) + ' أيام.' })
      ])
    ]);
  }

  return el('a', { class:'card revcard', href:'#/review' }, [
    el('span', { class:'revcard__ico', 'aria-hidden':'true', text:'↻' }),
    el('div', { class:'revcard__x' }, [
      el('p', { class:'revcard__t', text:'راجع اليوم: ' + N(due.length) + ' سؤالًا' }),
      el('p', { class:'revcard__s', text:'أسئلة حان موعد استرجاعها — قبل أن تنساها.' })
    ]),
    el('span', { class:'revcard__go', 'aria-hidden':'true', text:'←' })
  ]);
}

/* ═══ الشاشة ═══ */
let revState = null;   // { items, i, done, right }

function revRunner(rerender){
  const st = revState;
  const item = st.items[st.i];

  if (!item) {
    /* النهاية: نقول ما أُنجز ومتى يعود. ولا نعرض «أعد» — إعادة ما
       راجعتَه الآن تُفسد التباعد نفسه، وهو كل الفكرة. */
    const N = QBANK.views.arNum;
    const after = QBANK.progress.nextDue();
    return el('div', { class:'card stack', style:'text-align:center' }, [
      el('span', { class:'empty__ico', 'aria-hidden':'true', text:'✓' }),
      el('p', { class:'empty__title', text:'اكتملت مراجعة اليوم' }),
      el('p', { class:'empty__text', text:
        'راجعتَ ' + N(st.done) + ' سؤالًا، أصبتَ ' + N(st.right) + '.' +
        (after !== null ? ' والقادمة بعد ' + N(after) + (after === 1 ? ' يوم.' : ' أيام.') : '') }),
      el('a', { class:'btn btn--block', href:'#/', text:'الرئيسية' })
    ]);
  }

  const answered = st.answers[st.i];
  const opts = el('div', { class:'stack q__opts' }, (item.options || []).map((opt, oi) => {
    let cls = 'opt', mark = '';
    if (answered !== undefined && answered !== null) {
      if (oi === item.answer) { cls += ' is-answer'; mark = '✓'; }
      else if (oi === answered) { cls += ' is-wrong'; mark = '✗'; }
    }
    const b = el('button', { class:cls, type:'button',
      disabled: (answered !== undefined && answered !== null) ? true : null }, [
      el('span', { class:'opt__l', 'aria-hidden':'true', text: QBANK.views.optLetter(oi) }),
      el('span', { class:'ltr', text: opt }),
      el('span', { class:'opt__mark', 'aria-hidden':'true', text: mark })
    ]);
    b.addEventListener('click', () => {
      if (st.answers[st.i] !== null && st.answers[st.i] !== undefined) return;
      const ok = oi === item.answer;
      st.answers[st.i] = oi;
      st.done += 1; if (ok) st.right += 1;
      QBANK.review.answer(item._sid, item.id, ok);
      rerender();
    });
    return b;
  }));

  const next = el('button', { class:'btn btn--block', type:'button', text:'التالي ←' });
  next.addEventListener('click', () => { st.i += 1; rerender(); });

  const N = QBANK.views.arNum;
  return el('div', { class:'stack' }, [
    el('div', { class:'row' }, [
      el('span', { class:'badge num', text: N(st.i + 1) + ' / ' + N(st.items.length) }),
      el('span', { class:'spacer' }),
      el('span', { class:'badge badge--ok num', text:'✓ ' + N(st.right) })
    ]),
    el('div', { class:'card stack q' }, [
      el('p', { class:'ltr q__text', text: item.q }),
      opts,
      (answered !== undefined && answered !== null && item.expl_ar)
        ? el('p', { class:'field__hint', text: item.expl_ar }) : null,
      (answered !== undefined && answered !== null && QBANK.explain)
        ? QBANK.explain.button(item, answered) : null,
      (answered !== undefined && answered !== null && QBANK.shareCard)
        ? QBANK.shareCard.button(item) : null
    ]),
    (answered !== undefined && answered !== null) ? next : null
  ]);
}

const ViewReview = {
  title:'راجع اليوم',
  view(){
    const box = el('div', { class:'stack' });
    const rerender = () => { box.innerHTML = ''; box.appendChild(revRunner(rerender)); };

    if (revState && revState.items.length) {
      rerender();
      return QBANK.views.page('راجع اليوم', null, [box]);
    }

    const due = QBANK.progress.dueAll();
    if (!due.length) {
      const after = QBANK.progress.nextDue();
      return QBANK.views.page('راجع اليوم', null, [
        QBANK.views.empty('✓', 'لا مراجعة اليوم',
          after === null
            ? 'ابدأ اختبارًا في أي مادة، وسيبني لك النظام جدول مراجعتك تلقائيًا.'
            : 'عد بعد ' + QBANK.views.arNum(after) + (after === 1 ? ' يوم.' : ' أيام.'))
      ]);
    }

    box.appendChild(el('p', { class:'page__sub', text:'جارٍ تجهيز مراجعتك…' }));
    QBANK.review.session(40).then(sess => {
      if (!box.isConnected) return;
      if (!sess.items.length) {
        box.innerHTML = '';
        box.appendChild(QBANK.views.empty('⇣', 'تعذّر جلب أسئلة المراجعة',
          'افتح المواد مرة بإنترنت ثم عد — المستحقّ محفوظ ولا يضيع.'));
        return;
      }
      revState = { items: sess.items, i: 0, done: 0, right: 0,
                   answers: new Array(sess.items.length).fill(null) };
      rerender();
    });

    return QBANK.views.page('راجع اليوم',
      'أسئلة حان موعد استرجاعها — من كل موادك.', [box]);
  },
  _reset(){ revState = null; },
  _get(){ return revState; }
};
QBANK.views.ViewReview = ViewReview;
QBANK.views.reviewCard = reviewCard;


/* ===== 60-sharecard.js ===== */
/*
  ═══════════════════════════════════════════════════════════════════
  بطاقة السؤال كصورة — قناة النموّ الحقيقية
  ═══════════════════════════════════════════════════════════════════
  الطالب العربي لا ينشر روابط، ينشر صورًا: لقطة شاشة في مجموعة الدفعة،
  صورة في ستوري سناب. وهو يفعل ذلك بأسئلتنا الآن بلقطة شاشة مشوّهة لا
  اسم عليها ولا رابط — دعايةٌ نُهديها ونخسر نسبتها.

  فنُعطيه ما يريد مصنوعًا: بطاقةٌ مربّعة بهويّتنا، فيها السؤال وخياراته
  ورابط المنصة أسفلها. وكل سؤال صعب يُشارَك يصير دعوةً لزميل.

  ═══ ولا تُكشف الإجابة ═══
  عمدًا. البطاقة بلا إجابة تحدٍّ يُشارَك ويُناقَش، ومعها إجابةٍ تصير
  معلومةً استُهلكت ولا سبب لفتح الرابط. الفضول هو ما يُعبر الرابط.

  والرسم على canvas في المتصفح: بلا خادم، بلا مكتبة، ويعمل بلا إنترنت.
*/

const ShareCard = {
  W: 1080, H: 1080,   // مربّع: الشكل الذي تقبله سناب وواتساب وإنستغرام معًا

  /*
    لفّ النص على الأسطر بالقياس لا بالتخمين.
    القياس ضروري للعربية خاصة: عرض الحرف يختلف باختلاف موضعه في الكلمة،
    فأي تقدير بعدد المحارف يقطع السطر في غير موضعه.
  */
  wrap(ctx, text, maxW, maxLines){
    const words = String(text || '').split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '', cutOff = false;
    for (let i = 0; i < words.length; i++) {
      const test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) {
        lines.push(cur); cur = words[i];
        if (maxLines && lines.length >= maxLines) { cutOff = true; cur = ''; break; }
      } else cur = test;
    }
    if (cur) lines.push(cur);
    if (maxLines && lines.length > maxLines) { lines.length = maxLines; cutOff = true; }
    /* ★ علامة القطع تُوضع كلما قُطع النص — لا حين يتجاوز العدّ وحده.
       الخروج من الحلقة عند بلوغ السقف يترك العدد مساويًا للسقف تمامًا،
       فيمرّ بلا علامة ويظنّ القارئ أن السؤال انتهى عند نصفه. */
    if (cutOff && lines.length) lines[lines.length - 1] += ' …';
    return lines;
  },

  /* عربيٌّ أم لاتيني؟ الاتجاه يُقرَّر من النص لا من لغة الواجهة */
  isRtl(t){ return /[؀-ۿ]/.test(String(t || '')); },

  /*
    رسم البطاقة. الألوان مأخوذة من متغيّرات الهوية إن أمكن قراءتها،
    وإلا سقطت إلى لوحة ليلية ثابتة — الصورة تُرسم مرة ولا تتبع سمة القارئ.
  */
  draw(cv, q, url){
    const W = ShareCard.W, H = ShareCard.H;
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    const BG = '#0e1117', CARD = '#151a22', LINE = '#232a35';
    const TXT = '#e8ecf2', DIM = '#9aa6b6', ACC = '#c8a250';

    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

    // إطار داخلي: يجعل الصورة تُقرأ بطاقةً لا لقطة شاشة
    ctx.fillStyle = CARD;
    ctx.strokeStyle = LINE; ctx.lineWidth = 2;
    const pad = 56, r = 40;
    ShareCard.roundRect(ctx, pad, pad, W - pad * 2, H - pad * 2, r);
    ctx.fill(); ctx.stroke();

    const inner = pad + 56, maxW = W - inner * 2;
    let y = inner + 40;

    // ═══ الترويسة: الاسم ═══
    ctx.textBaseline = 'alphabetic';
    ctx.direction = 'rtl'; ctx.textAlign = 'right';
    ctx.fillStyle = ACC; ctx.font = '700 42px "Noto Kufi Arabic", system-ui, sans-serif';
    ctx.fillText('مراجعة', W - inner, y);
    ctx.fillStyle = DIM; ctx.font = '400 26px "Noto Kufi Arabic", system-ui, sans-serif';
    ctx.fillText('بنك الأسئلة', W - inner, y + 42);
    y += 130;

    // ═══ نص السؤال ═══
    const qt = String(q.q || '');
    const rtl = ShareCard.isRtl(qt);
    ctx.direction = rtl ? 'rtl' : 'ltr';
    ctx.textAlign = rtl ? 'right' : 'left';
    ctx.fillStyle = TXT;
    ctx.font = '600 44px "Noto Kufi Arabic", system-ui, sans-serif';
    const qLines = ShareCard.wrap(ctx, qt, maxW, 6);
    qLines.forEach(line => {
      ctx.fillText(line, rtl ? W - inner : inner, y);
      y += 62;
    });
    y += 26;

    // ═══ الخيارات — بلا كشف الإجابة ═══
    const letters = ['A', 'B', 'C', 'D', 'E'];
    const opts = (q.options || []).slice(0, 5);
    ctx.font = '400 34px "Noto Kufi Arabic", system-ui, sans-serif';
    opts.forEach((o, i) => {
      if (y > H - 240) return;                 // لا نطغى على التذييل
      const ort = ShareCard.isRtl(o);
      const boxY = y - 34;
      ctx.fillStyle = '#1c232d';
      ShareCard.roundRect(ctx, inner, boxY, maxW, 62, 16); ctx.fill();

      ctx.direction = 'ltr'; ctx.textAlign = 'left';
      ctx.fillStyle = ACC;
      ctx.fillText(letters[i], inner + 22, y + 6);

      ctx.direction = ort ? 'rtl' : 'ltr';
      ctx.textAlign = ort ? 'right' : 'left';
      ctx.fillStyle = TXT;
      const line = ShareCard.wrap(ctx, o, maxW - 110, 1)[0] || '';
      ctx.fillText(line, ort ? W - inner - 22 : inner + 76, y + 6);
      y += 78;
    });

    // ═══ التذييل: الدعوة والرابط ═══
    ctx.direction = 'rtl'; ctx.textAlign = 'center';
    ctx.fillStyle = DIM; ctx.font = '400 28px "Noto Kufi Arabic", system-ui, sans-serif';
    ctx.fillText('تعرف الإجابة؟ الشرح وبطاقة الحفظ على', W / 2, H - pad - 82);
    ctx.fillStyle = ACC; ctx.font = '700 32px system-ui, sans-serif';
    ctx.direction = 'ltr';
    ctx.fillText(String(url || 'amsuq.alsoqoor.com').replace(/^https?:\/\//, '').replace(/\/$/, ''),
                 W / 2, H - pad - 36);
    return cv;
  },

  roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },

  /* الرابط الذي يُطبع: رابط المادة إن عرفناها، وإلا الرئيسية */
  urlFor(q){
    try {
      const subs = (QBANK.data.pack().subjects) || [];
      const sub = subs.filter(s => s.id === (q._sid || q.subject_id))[0];
      const u = QBANK.api.user();
      if (sub && sub.slug && QBANK.share) return QBANK.share.shareUrl(sub.slug, u && u.id);
    } catch(e){}
    return 'amsuq.alsoqoor.com';
  },

  async blob(q){
    const cv = document.createElement('canvas');
    ShareCard.draw(cv, q, ShareCard.urlFor(q));
    return new Promise(res => {
      if (!cv.toBlob) return res(null);        // بيئة فحص بلا canvas حقيقي
      cv.toBlob(b => res(b), 'image/png');
    });
  },

  /*
    المشاركة: نافذة النظام إن وُجدت، وإلا تنزيل الملف.
    ولا نعِد بما لا نملك: Web Share بالملفات غير مدعوم في كل متصفح،
    فنسأله قبل أن نعرضه — canShare يقول الحقيقة، والافتراض يكذب.
  */
  async share(q){
    const b = await ShareCard.blob(q);
    if (!b) return { ok:false };
    const file = (typeof File !== 'undefined')
      ? new File([b], 'amsuq.png', { type:'image/png' }) : null;
    if (file && navigator.share && navigator.canShare && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file] }); return { ok:true, via:'share' }; }
      catch(e){ return { ok:false, cancelled:true }; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'amsuq-question.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return { ok:true, via:'download' };
  },

  button(q){
    const b = el('button', { class:'btn btn--ghost btn--sm', type:'button',
      text:'⤴ شارك السؤال كصورة' });
    b.addEventListener('click', async () => {
      b.setAttribute('aria-disabled','true'); b.textContent = '… تُرسم البطاقة';
      const r = await ShareCard.share(q);
      b.removeAttribute('aria-disabled'); b.textContent = '⤴ شارك السؤال كصورة';
      if (r.ok && r.via === 'download') QBANK.toast('حُفظت الصورة — أرسلها من معرض جهازك');
      else if (!r.ok && !r.cancelled) QBANK.toast('تعذّر إنشاء الصورة');
    });
    return b;
  }
};
QBANK.shareCard = ShareCard;


/* ===== 61-explain.js ===== */
/*
  «اشرح لي أكثر» — واجهة سؤالِ الطالبِ عن خطئه هو.

  الزرّ لا يظهر إلا بعد خطأ: من أصاب لا شيء يشرحه له، ووجود الزرّ عنده
  إغراءٌ بإنفاق نداءٍ بلا فائدة.

  والجواب يُحفظ في الجلسة بمفتاح (السؤال + اختياره): الطالب يرجع للسؤال
  مرتين وثلاثًا في المراجعة، ولا معنى لأن ندفع في كل مرة ثمنَ جوابٍ
  يملكه المتصفح أصلًا.
*/
const Explain = {
  _cache: Object.create(null),

  key(q, chosen){ return String(q.id || q.q).slice(0, 80) + '#' + chosen; },

  async ask(q, chosen){
    const k = Explain.key(q, chosen);
    if (Explain._cache[k]) return { ok:true, why: Explain._cache[k], cached:true };

    const base = QBANK.admin ? QBANK.admin.apiBase() : '';
    const f = QBANK.api.fetchFn();
    if (base === null || !f) return { ok:false, offline:true };
    const s = QBANK.api.session();
    if (!s) return { ok:false, needAuth:true };

    try{
      const res = await f(base + '/api/explain', {
        method:'POST',
        headers:{ 'Content-Type':'application/json',
                  'Authorization':'Bearer ' + (s.access_token || '') },
        body: JSON.stringify({ q: q.q, options: q.options, correct: q.answer,
                               chosen: chosen, topic: q.topic || '' })
      });
      const data = await res.json().catch(() => null);
      if (res.ok && data && data.why) { Explain._cache[k] = data.why; return { ok:true, why:data.why }; }
      return { ok:false, status:res.status, error:(data && data.error) || 'تعذّر الشرح' };
    } catch(e){ return { ok:false, offline:true }; }
  },

  /* الزرّ ومكان الجواب معًا: الجواب يظهر تحته لا في نافذة تقطع القراءة */
  button(q, chosen){
    if (typeof chosen !== 'number' || chosen === q.answer) return null;

    const out = el('p', { class:'explain__why', hidden:true });
    const b = el('button', { class:'btn btn--soft btn--sm', type:'button',
      text:'؟ اشرح لي لماذا أخطأت' });

    b.addEventListener('click', async () => {
      b.setAttribute('aria-disabled','true'); b.textContent = '… يفكّر';
      const r = await Explain.ask(q, chosen);
      b.removeAttribute('aria-disabled');
      if (r.ok) {
        out.textContent = r.why; out.hidden = false; b.hidden = true;
        return;
      }
      b.textContent = '؟ اشرح لي لماذا أخطأت';
      QBANK.toast(r.needAuth ? 'سجّل دخولك ليشرح لك الذكاء خطأك'
                : r.offline ? 'لا اتصال — الشرح يحتاج إنترنت'
                : (r.error || 'تعذّر الشرح، أعد المحاولة'));
    });

    return el('div', { class:'explain' }, [ b, out ]);
  },
  _reset(){ Explain._cache = Object.create(null); }
};
QBANK.explain = Explain;


/* ===== 62-manual.js ===== */
/*
  ═══════════════════════════════════════════════════════════════════
  كتابة الأسئلة باليد — الطريق الثاني إلى المنصة
  ═══════════════════════════════════════════════════════════════════
  الرفع بملف يفترض أن للطالب ملفًا. وكثيرٌ منهم لا ملف عنده: أسئلةٌ سمعها
  في المحاضرة، أو صوّرها زميله في مجموعة الواتساب، أو كتبها بيده في دفتره.
  كان هؤلاء خارج المنصة كلها — لا لأنهم لا يملكون محتوى، بل لأننا طلبنا
  المحتوى بصيغةٍ واحدة.

  ═══ والحفظ التلقائي شرطٌ لا زينة ═══
  كتابة عشرين سؤالًا بخياراتها عملُ نصف ساعة. وضياعُه بإغلاقٍ عارض أو
  بطاريةٍ نفدت لا يُنسى ولا يُغتفر، ولا يعود صاحبه ليكتبها ثانية. فكل حرف
  يُحفظ في الجهاز لحظةَ كتابته، ويُستعاد كما تُرك.
*/

const Manual = {
  KEY: 'manual_draft',
  MIN_OPTS: 2,
  MAX_OPTS: 6,

  blank(){ return { q:'', options:['', ''], answer:0 }; },

  load(){
    const d = QBANK.store.get(Manual.KEY, null);
    if (d && Array.isArray(d.items) && d.items.length) return d;
    return { name:'', items:[Manual.blank()] };
  },
  save(d){ QBANK.store.set(Manual.KEY, d); },
  clear(){ QBANK.store.remove(Manual.KEY); },

  /*
    ما يصلح للنشر: سؤالٌ له نصّ وخياران فأكثر غيرُ فارغين وإجابةٌ محدَّدة.
    والفلترة لا الرفض: من كتب تسعة أسئلة وترك العاشر نصفَ مكتوب لا يُمنع
    من نشر التسعة — يُنشر ما تمّ ويُقال له كم استُبعد ولماذا.
  */
  valid(it){
    if (!it || !String(it.q || '').trim()) return false;
    const opts = (it.options || []).map(o => String(o || '').trim()).filter(Boolean);
    if (opts.length < Manual.MIN_OPTS) return false;
    const a = it.answer;
    return typeof a === 'number' && a >= 0 && a < (it.options || []).length &&
           !!String(it.options[a] || '').trim();
  },

  /* تحويل ما كُتب إلى شكل المقسّم نفسه — بقية المعالج لا تعرف المصدر */
  toRaw(items){
    return (items || []).filter(Manual.valid).map((it, i) => {
      /* الخيارات الفارغة تُطرح، وموضع الإجابة يُعاد حسابه بعد الطرح —
         وإلا أشار الرقمُ القديم إلى خيارٍ غير الذي اختاره الكاتب. */
      const kept = [];
      let answer = 0;
      (it.options || []).forEach((o, oi) => {
        const t = String(o || '').trim();
        if (!t) return;
        if (oi === it.answer) answer = kept.length;
        kept.push(t);
      });
      return { num: i + 1, q: String(it.q).trim(), options: kept,
               answer: answer, answer_letter: 'ABCDEF'[answer] || null,
               has_options: true };
    });
  },

  /*
    ★ خلطٌ عادل (Fisher–Yates) لا `sort(() => Math.random() - .5)`.
    الثاني شائعٌ ومغشوش: مقارنةٌ عشوائية تخرق شرط الترتيب الثابت، فتخرج
    توزيعةٌ منحازة تُبقي أول العناصر قرب أولها. وهنا الانحياز يعني أن
    ترتيب الكاتب يظل مقروءًا في نتيجته — وهذا نقيض المقصود.
  */
  shuffle(arr, rnd){
    const a = (arr || []).slice();
    const r = rnd || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
};
QBANK.manual = Manual;

/* ═══════════════ الشاشة ═══════════════ */
function manualComposer(onDone, onCancel){
  const st = Manual.load();
  const box = el('div', { class:'stack' });
  const list = el('div', { class:'stack' });
  const msg = el('p', { class:'field__hint', role:'status' });

  const persist = () => Manual.save(st);

  function card(it, idx){
    const c = el('div', { class:'card stack mq' });

    const head = el('div', { class:'row' }, [
      el('span', { class:'badge num', text:'سؤال ' + QBANK.views.arNum(idx + 1) }),
      el('span', { class:'spacer' })
    ]);
    if (st.items.length > 1) {
      const del = el('button', { class:'btn btn--ghost btn--sm', type:'button',
        'aria-label':'احذف السؤال ' + (idx + 1), text:'حذف' });
      del.addEventListener('click', () => {
        st.items.splice(idx, 1); persist(); draw();
      });
      head.appendChild(del);
    }

    const qIn = el('textarea', { class:'input', rows:'2',
      placeholder:'اكتب نصّ السؤال…', 'aria-label':'نص السؤال ' + (idx + 1) });
    qIn.value = it.q || '';
    qIn.addEventListener('input', () => { it.q = qIn.value; persist(); });

    /*
      الخيارات: كلٌّ سطرٌ فيه دائرةُ اختيار «هذه الصحيحة» ثم الحقل.
      والدائرة قبل الحقل لا بعده: العين العربية تقرأ من اليمين، فالعلامة
      أولًا تقول «هنا تُحدَّد الإجابة» قبل أن يُقرأ نصُّها.
    */
    const opts = el('div', { class:'stack mq__opts' });
    (it.options || []).forEach((o, oi) => {
      const pick = el('button', { class:'mq__pick' + (it.answer === oi ? ' is-on' : ''),
        type:'button', role:'radio', 'aria-checked': it.answer === oi ? 'true' : 'false',
        'aria-label':'اجعل الخيار ' + QBANK.views.optLetter(oi) + ' هو الصحيح',
        text: QBANK.views.optLetter(oi) });
      pick.addEventListener('click', () => { it.answer = oi; persist(); draw(); });

      const inp = el('input', { class:'input', value:o || '',
        placeholder:'الخيار ' + QBANK.views.optLetter(oi),
        'aria-label':'نص الخيار ' + QBANK.views.optLetter(oi) });
      inp.addEventListener('input', () => { it.options[oi] = inp.value; persist(); });

      const row = el('div', { class:'mq__row' }, [pick, inp]);
      if ((it.options || []).length > Manual.MIN_OPTS) {
        const x = el('button', { class:'mq__x', type:'button',
          'aria-label':'احذف الخيار ' + QBANK.views.optLetter(oi), text:'×' });
        x.addEventListener('click', () => {
          it.options.splice(oi, 1);
          /* الإجابة تتبع خيارها: حذف خيارٍ قبلها يُنزل موضعها، وحذفها هي
             يُبطل التحديد — ولا نترك مؤشّرًا يشير إلى خيارٍ آخر بصمت. */
          if (it.answer === oi) it.answer = 0;
          else if (it.answer > oi) it.answer -= 1;
          persist(); draw();
        });
        row.appendChild(x);
      }
      opts.appendChild(row);
    });

    const addOpt = el('button', { class:'btn btn--ghost btn--sm', type:'button', text:'+ خيار' });
    addOpt.setAttribute('aria-disabled', (it.options || []).length >= Manual.MAX_OPTS ? 'true' : 'false');
    addOpt.addEventListener('click', () => {
      if ((it.options || []).length >= Manual.MAX_OPTS) return;
      it.options.push(''); persist(); draw();
    });

    c.appendChild(head);
    c.appendChild(qIn);
    c.appendChild(el('span', { class:'field__label', text:'الخيارات — اضغط الحرف لتحديد الصحيح' }));
    c.appendChild(opts);
    c.appendChild(addOpt);
    return c;
  }

  function draw(){
    list.innerHTML = '';
    st.items.forEach((it, i) => list.appendChild(card(it, i)));
    const ok = st.items.filter(Manual.valid).length;
    msg.textContent = ok
      ? 'جاهز للنشر: ' + QBANK.views.arNum(ok) + ' سؤالًا من ' +
        QBANK.views.arNum(st.items.length) + '.'
      : 'اكتب سؤالًا واحدًا على الأقل بخيارين وحدّد الصحيح.';
    done.setAttribute('aria-disabled', ok ? 'false' : 'true');
    done.textContent = ok ? 'تابع بـ ' + QBANK.views.arNum(ok) + ' سؤالًا' : 'تابع';
  }

  const addQ = el('button', { class:'btn btn--soft btn--block', type:'button', text:'+ أضف سؤالًا' });
  addQ.addEventListener('click', () => {
    st.items.push(Manual.blank()); persist(); draw();
    // البؤرة إلى الجديد: من ضغط «أضف» يريد الكتابة الآن لا البحث عن الحقل
    const cards = list.querySelectorAll('.mq textarea');
    if (cards.length) cards[cards.length - 1].focus();
  });

  const done = el('button', { class:'btn btn--block', type:'button', text:'تابع' });
  done.addEventListener('click', () => {
    const raw = Manual.toRaw(st.items);
    if (!raw.length) return;
    const dropped = st.items.length - raw.length;
    onDone(raw, dropped);
  });

  const back = el('button', { class:'btn btn--ghost btn--block', type:'button',
    text:'رجوع إلى رفع ملف' });
  back.addEventListener('click', () => onCancel());

  box.appendChild(el('p', { class:'field__hint', text:
    'اكتب أسئلتك هنا مباشرة — تُحفظ في جهازك أولًا بأول، فلو أُغلقت الصفحة عادت كما تركتها.' }));
  box.appendChild(list);
  box.appendChild(addQ);
  box.appendChild(msg);
  box.appendChild(done);
  box.appendChild(back);
  draw();
  return box;
}
QBANK.views.manualComposer = manualComposer;


/* ===== 63-presence.js ===== */
/*
  ═══════════════════════════════════════════════════════════════════
  الحضور: أين الطالب الآن، وبأي جهاز، ومن أي بلد
  ═══════════════════════════════════════════════════════════════════
  كانت النبضة تُرسل مرةً واحدة عند الإقلاع، فقائمة «المتصلون الآن» كانت
  تقول «دخل خلال ربع ساعة» لا «هو هنا». والفرق كبير: من فتح التطبيق ثم
  وضع جوّاله في جيبه ليس متصلًا بالمعنى الذي يهمّ.

  وصارت تُرسل عند كل تبدّل شاشة وكل دقيقة، وتحمل معها الحال لا الوجود:
  «في اختبار: علم السموم»، «يرفع مادة»، «في صفحة الدخول».

  ═══ وحدودُ ما نجمعه مقصودة ═══
  شاشاتُ التطبيق فقط. لا نصوصَ يكتبها الطالب، ولا إجاباتِه، ولا موقعًا
  من الجهاز. والبلد من حقلٍ كتبه هو أو من منطقته الزمنية — تقريبٌ يكفي
  للتشغيل ولا يقترب من عنوانه. ونوع الجهاز صنفٌ من ثلاثة لا بصمةٌ تُميّزه.
*/

const Presence = {
  EVERY: 60000,      // نبضة كل دقيقة ما دام التطبيق مفتوحًا
  _timer: null,
  _last: '',         // آخر حالٍ أُرسل — لا نُكرّر نداءً بلا جديد
  _sendFn: null,     // باب حقن للفحوص

  /*
    نوع الجهاز: ثلاثة أصناف لا أكثر.
    ترتيب الفحص مقصود: آيباد الحديث يقول عن نفسه «Macintosh» ويكذب،
    فنكشفه بوجود اللمس — وهو الفارق الوحيد الباقي بينه وبين حاسوب.
  */
  kind(ua, touchPoints){
    const s = String(ua || '');
    if (/iPhone|iPod/i.test(s)) return 'ios';
    if (/iPad/i.test(s)) return 'ios';
    if (/Macintosh/i.test(s) && (touchPoints || 0) > 1) return 'ios';
    if (/Android/i.test(s)) return 'android';
    return 'desktop';
  },

  /*
    رمزٌ لكل صنف — علامةٌ تُقرأ بلمحة في قائمة طويلة.
    ★ ولا شعار آبل: محرفُه في نطاق الاستعمال الخاص، ترسمه أجهزة آبل
    وحدها ويخرج فراغًا عند غيرها — والمشرف قد يفتح لوحته من ويندوز.
    والرمز الذي لا يُرى على نصف الأجهزة ليس رمزًا.
  */
  kindIcon(k){
    return k === 'ios' ? '📱' : k === 'android' ? '🤖' : '🖥';
  },
  /* واسمٌ عربي بجانبه: الرمز للعين، والاسم لقارئ الشاشة وللتلميح عند المرور */
  kindName(k){
    return k === 'ios' ? 'آيفون' : k === 'android' ? 'أندرويد' : 'حاسوب';
  },

  /*
    البلد: ما كتبه الطالب في ملفه أولًا — فهو أوثق مما نستنتج.
    وإن لم يكتبه استنتجناه من منطقته الزمنية، وهي معلومةٌ يعطيها المتصفح
    بلا إذنٍ ولا تحديد موقع، ودقّتها بلدٌ لا شارع.
  */
  TZ: {
    'Asia/Riyadh':'SA', 'Asia/Kuwait':'KW', 'Asia/Bahrain':'BH', 'Asia/Qatar':'QA',
    'Asia/Dubai':'AE', 'Asia/Muscat':'OM', 'Asia/Baghdad':'IQ', 'Asia/Amman':'JO',
    'Asia/Beirut':'LB', 'Asia/Damascus':'SY', 'Asia/Jerusalem':'PS', 'Asia/Gaza':'PS',
    'Asia/Hebron':'PS', 'Asia/Aden':'YE', 'Africa/Cairo':'EG', 'Africa/Khartoum':'SD',
    'Africa/Tripoli':'LY', 'Africa/Tunis':'TN', 'Africa/Algiers':'DZ',
    'Africa/Casablanca':'MA', 'Africa/Nouakchott':'MR', 'Africa/Mogadishu':'SO',
    'Africa/Djibouti':'DJ'
  },
  country(){
    try {
      const c = QBANK.campus && QBANK.campus.cached();
      if (c && c.country) return String(c.country).toUpperCase().slice(0, 2);
    } catch(e){}
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (Presence.TZ[tz]) return Presence.TZ[tz];
    } catch(e){}
    return '';
  },

  /*
    وصف الشاشة بالعربية. المسارات التي تحمل معرّفًا نُسمّي مادتها إن
    عرفناها — «في اختبار» وحدها لا تعني شيئًا، و«في اختبار: علم السموم»
    تقول أين هو تمامًا.
  */
  subjectName(id){
    try {
      const subs = (QBANK.data.pack().subjects) || [];
      const s = subs.filter(x => x.id === id || x.slug === id)[0];
      return s ? s.name : '';
    } catch(e){ return ''; }
  },

  MAP: {
    '#/':          'الرئيسية',
    '#/explore':   'يستكشف المواد',
    '#/review':    'يراجع أسئلة اليوم',
    '#/upload':    'يرفع مادة',
    '#/account':   'في حسابه',
    '#/settings':  'في الإعدادات',
    '#/login':     'في صفحة الدخول',
    '#/board':     'في لوحة المتصدرين',
    '#/challenge': 'في تحدٍّ',
    '#/pay':       'في صفحة الدفع',
    '#/p':         'يتصفّح ملف طالب',
    '#/u':         'في قسم جامعة',
    '#/admin':     'في لوحة التحكم'
  },

  place(route){
    const r = route || (QBANK.router && QBANK.router.current) || null;
    if (!r) return '';
    const path = r.path || '';
    const id = (r.rest && r.rest[0]) || '';

    if (path === '#/subject') {
      const n = Presence.subjectName(id);
      return n ? 'داخل مادة: ' + n : 'داخل مادة';
    }
    if (path === '#/exam') {
      const n = Presence.subjectName(id);
      return n ? 'في اختبار تجريبي: ' + n : 'في اختبار تجريبي';
    }
    if (path === '#/s') {
      const n = Presence.subjectName(id);
      return n ? 'فتح رابط مادة: ' + n : 'فتح رابط مادة مشتركة';
    }
    if (path.indexOf('#/admin') === 0) return Presence.MAP['#/admin'];
    return Presence.MAP[path] || 'يتصفّح';
  },

  /*
    الإرسال. نُرسل حين يتبدّل الحال، أو حين تمرّ الدقيقة على آخر نبضة —
    الأول ليكون الخبر حيًّا، والثاني ليُعرف أنه ما زال هنا.
  */
  async beat(force){
    if (!QBANK.api.user()) return { ok:false };
    const place = Presence.place();
    if (!force && place === Presence._last) return { ok:true, skipped:true };
    Presence._last = place;

    const payload = {
      device_label: (typeof navigator !== 'undefined' ? navigator.userAgent : '').slice(0, 60),
      p_place: place,
      p_kind: Presence.kind(typeof navigator !== 'undefined' ? navigator.userAgent : '',
                           typeof navigator !== 'undefined' ? navigator.maxTouchPoints : 0),
      p_country: Presence.country()
    };
    if (Presence._sendFn) return Presence._sendFn(payload);
    return QBANK.api.rpc('heartbeat', payload);
  },

  start(){
    if (Presence._timer) return;
    Presence.beat(true);
    Presence._timer = setInterval(() => Presence.beat(true), Presence.EVERY);
    /*
      ورقةٌ مخفيّة لا تنبض: التبويب في الخلفية ليس حضورًا، ونبضُه يملأ
      القائمة بمن ليسوا هنا. والعودة إليه تنبض فورًا لا بعد دقيقة.
    */
    try {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        Presence.beat(true);
      });
    } catch(e){}
  },
  stop(){ if (Presence._timer) { clearInterval(Presence._timer); Presence._timer = null; } }
};
QBANK.presence = Presence;


/* ===== 64-codes.js ===== */
/*
  ═══════════════════════════════════════════════════════════════════
  أكواد التفعيل — الطريق الثاني إلى المادة المدفوعة
  ═══════════════════════════════════════════════════════════════════
  كان زرّ «اشترِ المادة» ينتهي إلى /api/pay، و/api/pay يشترط بوابة Tap
  لم تُفعَّل بعد. فالضغطة الوحيدة التي تفصل الطالب عن الدفع كانت تنتهي
  برسالة «الدفع غير مفعَّل بعد على هذا الخادم» — وهي رسالةُ عطلٍ في وجه
  من قرّر أن يشتري.

  الآن للطالب طريقان دائمًا: رمزٌ يُدخله فتُفتح المادة في ثانية، وطريقُ
  طلبٍ واضح إن لم يكن عنده رمز. والبوابة حين تجهز تُضاف فوقهما ولا تُلغيهما.
*/

const Codes = {
  /* ما يصل من الطالب: لصقٌ فيه مسافات، أو شرطات، أو حروف صغيرة. كلّها
     الرمز نفسه — والتطبيع هنا وفي القاعدة معًا، لأن أحدهما قد يُتجاوَز. */
  norm(s){ return String(s || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase(); },

  /* عرضٌ بأربعات: العين تقرأ AB12-CD34-EF ولا تقرأ AB12CD34EF */
  pretty(s){
    const n = Codes.norm(s);
    return n ? (n.match(/.{1,4}/g) || [n]).join('-') : '';
  },

  MIN: 6,
  looksLike(s){ return Codes.norm(s).length >= Codes.MIN; },

  redeem(code){ return QBANK.api.rpc('redeem_code', { p_code: Codes.norm(code) }); },

  /*
    ★ لكل رفضٍ نصُّه.
    «رمز غير صحيح» جوابٌ واحد لسبع حالات، ويجعل الطالب يعيد المحاولة على
    رمزٍ استُهلك، أو يشكو من رمزٍ سبق أن استعمله هو. والنص الذي يقول
    «ماذا حدث وماذا تفعل الآن» يوفّر رسالةً إلى المشرف.
  */
  WHY: {
    auth:                'سجّل دخولك أولًا ثم فعّل الرمز.',
    not_found:           'لا يوجد رمز بهذا الشكل — تأكّد من الحروف والأرقام.',
    disabled:            'أُوقف هذا الرمز. تواصل مع من أعطاك إياه.',
    expired:             'انتهت صلاحية هذا الرمز.',
    used_up:             'استُهلك هذا الرمز بالكامل.',
    already_used_by_you: 'فعّلتَ هذا الرمز من قبل — المادة عندك بالفعل.',
    already_owned:       'هذه المادة مفتوحة لك أصلًا، فلا تُنفق الرمز عليها.',
    already_free:        'صارت هذه المادة مجانية للجميع — لا تحتاج رمزًا.',
    subject_gone:        'المادة المرتبطة بهذا الرمز لم تعد موجودة.'
  },
  why(reason){ return Codes.WHY[reason] || 'تعذّر تفعيل الرمز. حاول مرة أخرى.'; },

  /*
    ★ «تعذّر التوليد» ليست رسالة، بل صمتٌ بصيغة جملة.
    كتبتُها أول مرة فسقطت الدالة في القاعدة لسببٍ محدّد — امتدادٌ خارج
    مسار البحث — ولم يصل من ذلك السبب حرفٌ واحد إلى الشاشة. فأمضى المشرف
    وقته يعيد تنفيذ ملف SQL نجح تنفيذه أصلًا. وحين يكون العطل في القاعدة
    فالقاعدة قالت سببه بنصّه، وإخفاؤه اختيارُنا نحن لا نقصُ معلومة.

    فنُفرّق: سببٌ نعرفه له نصٌّ عربي، ونداءٌ سقط يُظهر ما قالته القاعدة،
    ودالةٌ مفقودة تُقال باسمها لأن علاجها معروف: نفّذ ملف CODES.sql.
  */
  ADMIN_WHY: {
    forbidden:  'هذه اللوحة للمشرف وحده — تأكّد أن حسابك مشرف.',
    no_subject: 'اختر المادة أولًا.',
    not_found:  'المادة المختارة لم تعد موجودة — حدّث الصفحة.'
  },
  failText(r){
    const d = r && r.data;
    if (d && d.reason && Codes.ADMIN_WHY[d.reason]) return Codes.ADMIN_WHY[d.reason];
    if (r && r.offline) return 'لا اتصال بالخادم.';
    const m = String((d && (d.message || d.hint)) || '');
    /* PGRST202 = الدالة غير موجودة في ذاكرة المخطط */
    if ((d && d.code === 'PGRST202') || /does not exist|Could not find the function/i.test(m))
      return 'دالة الأكواد غير موجودة في القاعدة — نفّذ ملف db/CODES.sql في محرّر Supabase.';
    if (m) return 'القاعدة ردّت: ' + m;
    return 'تعذّر التوليد' + (r && r.status ? ' (' + r.status + ')' : '') + '.';
  },

  /* رقم التواصل وسطر طريقة الدفع — يكتبهما المشرف في الإعدادات */
  support(){
    const s = (QBANK.data.pack().settings) || {};
    return { wa: String(s.whatsapp || '').replace(/[^0-9]/g, ''),
             note: String(s.pay_note || '') };
  },

  /*
    ★ داخل التطبيق لا رابط خارجي إطلاقًا.
    قاعدة متجر آبل تمنع إحالة المستخدم إلى قناة دفع خارجية، ومخالفتها
    تُرفض بها النسخة كلها. فالزرّ يختفي في التطبيق ويبقى في المتصفح.
  */
  isApp(){ return !!(typeof window !== 'undefined' && window.QBANK_NATIVE_APP); },

  /* رسالة الطلب: تحمل ما يحتاجه المشرف ليُصدر الرمز بلا محادثة ذهاب وإياب */
  askText(sub){
    const u = QBANK.api.user();
    const price = Number(sub && sub.price) > 0 ? ' (' + sub.price + ' ريال)' : '';
    return 'السلام عليكم، أريد تفعيل مادة «' + (sub ? sub.name : '') + '»' + price +
           '.\nحسابي: ' + ((u && u.email) || 'ـ');
  },
  askUrl(sub){
    const wa = Codes.support().wa;
    if (!wa) return '';
    return 'https://wa.me/' + wa + '?text=' + encodeURIComponent(Codes.askText(sub));
  }
};
QBANK.codes = Codes;

/* ═══════════════ صندوق التفعيل للطالب ═══════════════ */
/* لا يأخذ مادة: الرمز يقول بنفسه ماذا يفتح، والصندوق واحد في صفحة المادة
   وفي المحفظة — وصندوقان بسلوكين هما موضعان للعطل لا موضع واحد. */
function redeemBox(onDone){
  const box = el('div', { class:'stack', style:'margin-top:12px' });
  const msg = el('p', { class:'field__hint', role:'status', style:'margin:0' });

  const inp = el('input', { class:'input num', type:'text', autocomplete:'off',
    spellcheck:'false', maxlength:'24', placeholder:'ABCD-EFGH-JK',
    'aria-label':'رمز التفعيل' });

  /* التجميل أثناء الكتابة، مع إبقاء المؤشر في آخر النص — إعادةُ المؤشر
     إلى الأول عند كل حرف تجعل الحقل غير قابل للكتابة عمليًا */
  inp.addEventListener('input', () => {
    const atEnd = inp.selectionStart === inp.value.length;
    inp.value = Codes.pretty(inp.value).slice(0, 24);
    if (atEnd) { try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch(e){} }
    go.setAttribute('aria-disabled', Codes.looksLike(inp.value) ? 'false' : 'true');
  });

  const go = el('button', { class:'btn btn--soft', type:'button', text:'فعّل' });
  go.setAttribute('aria-disabled', 'true');

  const run = () => {
    if (!Codes.looksLike(inp.value)) return;
    go.disabled = true; msg.className = 'field__hint'; msg.textContent = 'جارٍ التحقق…';
    Codes.redeem(inp.value).then(r => {
      go.disabled = false;
      const d = (r.ok && r.data) ? r.data : null;
      if (d && d.ok){
        msg.className = 'field__hint is-ok';
        msg.textContent = d.kind === 'semester'
          ? 'فُتحت مواد الفصل كلها.' : 'فُتحت «' + (d.subject || 'المادة') + '».';
        inp.value = '';
        /* الاستحقاق الجديد لا يظهر حتى تُحدَّث نسخة الجهاز — وبلا ذلك
           يبقى القفل على الشاشة بعد تفعيلٍ نجح، فيظنّه الطالب فشلًا. */
        QBANK.gate.refresh().then(() => { if (onDone) onDone(d); });
        return;
      }
      /* رفضٌ مفهوم من القاعدة له نصّه، وسقوطُ النداء نفسِه شيء آخر —
         والخلط بينهما يجعل الطالب يعيد رمزًا سليمًا على خادمٍ صامت. */
      msg.className = 'field__hint is-bad';
      msg.textContent = (d && d.reason) ? Codes.why(d.reason) : Codes.failText(r);
    });
  };
  go.addEventListener('click', run);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); run(); } });

  box.appendChild(el('span', { class:'field__label', text:'عندك رمز تفعيل؟' }));
  box.appendChild(el('div', { class:'redeem' }, [inp, go]));
  box.appendChild(msg);
  return box;
}
QBANK.views.redeemBox = redeemBox;

/* ═══════════════ لوحة المشرف: توليد الأكواد ═══════════════ */
function adminCodesCard(){
  const box = el('div', { class:'card stack' });
  box.appendChild(el('h2', { style:'margin:0', text:'أكواد التفعيل' }));
  box.appendChild(el('p', { class:'field__hint', style:'margin:0', text:
    'رمزٌ يفتح مادة أو مواد الفصل كلها. تبيعه بالطريقة التي تقبضها فعلًا، ' +
    'ويُدخله الطالب في صفحة المادة فتُفتح فورًا — بلا بوابة دفع.' }));

  const kindSel = el('select', { class:'input', 'aria-label':'نوع الرمز' }, [
    el('option', { value:'subject',  text:'مادة واحدة' }),
    el('option', { value:'semester', text:'مواد الفصل كلها' })
  ]);
  const subSel = el('select', { class:'input', 'aria-label':'المادة' });
  const countIn = el('input', { class:'input num', type:'number', min:'1', max:'200',
    value:'10', inputmode:'numeric', 'aria-label':'عدد الأكواد' });
  const daysIn = el('input', { class:'input num', type:'number', min:'1', max:'3650',
    value:'180', inputmode:'numeric', 'aria-label':'مدة الفتح بالأيام' });
  const usesIn = el('input', { class:'input num', type:'number', min:'1', max:'5000',
    value:'1', inputmode:'numeric', 'aria-label':'كم طالبًا يستعمل الرمز الواحد' });
  const noteIn = el('input', { class:'input', type:'text', maxlength:'120',
    placeholder:'مثال: دفعة ٢٠٤٦ — تحويل بنكي', 'aria-label':'ملاحظة الدفعة' });

  const subs = (QBANK.data.pack().subjects || []).filter(s => !s.free);
  if (!subs.length) subSel.appendChild(el('option', { value:'', text:'لا مواد مدفوعة' }));
  subs.forEach(s => subSel.appendChild(el('option', { value:s.id, text:s.name })));

  const subWrap = el('label', { class:'field' }, [
    el('span', { class:'field__label', text:'المادة' }), subSel ]);
  const paintKind = () => { subWrap.hidden = kindSel.value === 'semester'; };
  kindSel.addEventListener('change', paintKind); paintKind();

  const out = el('div', { class:'stack' });
  const msg = el('p', { class:'field__hint', role:'status', style:'margin:0' });

  const make = el('button', { class:'btn btn--block', type:'button', text:'ولّد الأكواد' });
  make.addEventListener('click', async () => {
    const kind = kindSel.value;
    if (kind === 'subject' && !subSel.value){
      msg.className = 'field__hint is-bad';
      msg.textContent = 'لا توجد مادة مدفوعة — ضع سعرًا لمادة أولًا.';
      return;
    }
    make.disabled = true; msg.className = 'field__hint'; msg.textContent = 'جارٍ التوليد…';
    const r = await QBANK.api.rpc('admin_make_codes', {
      p_kind: kind,
      p_subject: kind === 'subject' ? subSel.value : null,
      p_count: Math.max(1, Math.min(200, parseInt(countIn.value || '1', 10) || 1)),
      p_days: Math.max(1, Math.min(3650, parseInt(daysIn.value || '180', 10) || 180)),
      p_max_uses: Math.max(1, Math.min(5000, parseInt(usesIn.value || '1', 10) || 1)),
      p_note: noteIn.value || '',
      p_valid_days: 0
    });
    make.disabled = false;
    const d = (r.ok && r.data) ? r.data : null;
    if (!d || !d.ok){
      msg.className = 'field__hint is-bad';
      msg.textContent = Codes.failText(r);
      return;
    }
    msg.className = 'field__hint is-ok';
    msg.textContent = 'وُلّدت ' + QBANK.views.arNum((d.codes || []).length) + ' رمزًا · دفعة ' + d.batch;
    paintCodes(d.codes || []);
    /* القائمة والموجز يتبعان التوليد فورًا — لا يُطلب من المشرف تحديث الصفحة
       ليرى ما ولّده قبل ثانية */
    paintSummary(); draw();
  });

  /*
    ★ الأكواد تُعرض للنسخ دفعةً واحدة.
    نسخُ عشرين رمزًا واحدًا واحدًا من جدولٍ عملٌ يُخطئ فيه الإنسان، والخطأ
    هنا يعني رمزًا أُرسل لطالبٍ ولا يعمل. فسطرٌ لكل رمز في مربّع واحد،
    وزرٌّ ينسخها كلها.
  */
  function paintCodes(list){
    out.innerHTML = '';
    if (!list.length) return;
    const text = list.map(Codes.pretty).join('\n');
    const ta = el('textarea', { class:'input num', rows: String(Math.min(12, list.length)),
      readonly:'readonly', 'aria-label':'الأكواد المولّدة' });
    ta.value = text;
    const copy = el('button', { class:'btn btn--soft btn--sm', type:'button', text:'انسخ الكل' });
    copy.addEventListener('click', () => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(text).then(() => QBANK.toast('نُسخت'));
        else { ta.select(); document.execCommand('copy'); QBANK.toast('نُسخت'); }
      } catch(e){ QBANK.toast('انسخها يدويًا'); }
    });
    out.appendChild(ta);
    out.appendChild(copy);
  }

  const grid = el('div', { class:'ad-grid2' }, [
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'النوع' }), kindSel ]),
    subWrap,
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'كم رمزًا' }), countIn ]),
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'مدة الفتح (يوم)' }), daysIn ]),
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'استخدامات الرمز الواحد' }), usesIn ]),
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'ملاحظة' }), noteIn ])
  ]);

  box.appendChild(grid);
  box.appendChild(make);
  box.appendChild(msg);
  box.appendChild(out);

  /* ═══ الأكواد القائمة ═══ */
  /*
    ★ ثلاثة أسئلة يسألها المشرف، لا سؤال واحد:
    «كم رمزًا بقي عندي أبيعه؟» و«هذا الرمز — هل فُعِّل؟» و«من فعّله؟».
    قائمةٌ واحدة بلا مرشّح تُجيب عن الثالث بعد بحثٍ بالعين في ستين صفًّا،
    ولا تُجيب عن الأول أبدًا. فصار لها موجزٌ فوقها، ومرشّحاتٌ تفصل غير
    المستعمل عن المُفعَّل، وكلُّ رمزٍ مُفعَّل يحمل تحته حسابَ من فعّله.
  */
  box.appendChild(el('h3', { style:'margin:8px 0 0', text:'الأكواد' }));

  const sum = el('p', { class:'field__hint', style:'margin:0', role:'status' });
  const listBox = el('div', { class:'stack' });
  let state = '';

  const chips = el('div', { class:'ex-chips', role:'group', 'aria-label':'تصفية الأكواد' });
  [['','الكل'],['unused','لم يُستعمل'],['used','مُفعَّل'],['off','موقوف']].forEach(t => {
    const b = el('button', { class:'chip' + (t[0] === state ? ' is-on' : ''), type:'button',
      'data-s': t[0], text: t[1] });
    b.addEventListener('click', () => {
      state = t[0];
      chips.querySelectorAll('.chip').forEach(x =>
        x.classList.toggle('is-on', x.getAttribute('data-s') === state));
      draw();
    });
    chips.appendChild(b);
  });

  box.appendChild(sum);
  box.appendChild(chips);
  box.appendChild(listBox);

  /*
    الموجز مرة واحدة عند الفتح، ويُعاد بعد كل توليد — لا مع كل مرشّح.

    ★ ولا حارس isConnected هنا ولا في القائمة.
    البطاقة تُبنى ثم تُدرَج في تبويبها، فقد تكون منفصلةً عن المستند لحظةَ
    النداء وتُدرَج بعده بأجزاء من الثانية. وحارسٌ يمنع الكتابة على عقدةٍ
    منفصلة كان سيُفرغ الشاشة نهائيًا في ذلك الترتيب — ورأيتُه فارغًا فعلًا.
    والكتابة على عقدةٍ منفصلة لا تضرّ أصلًا؛ الذي يضرّ هو ردٌّ متأخّر يدهس
    ردًّا أحدث، وذاك يمنعه العدّاد أدناه لا الاتصال بالمستند.
  */
  function paintSummary(){
    QBANK.api.rpc('admin_codes_summary').then(r => {
      if (!alive()) return;
      const d = (r.ok && r.data && !r.data.error) ? r.data : null;
      if (!d) { sum.textContent = ''; return; }
      const n = QBANK.views.arNum;
      sum.textContent = 'الجملة ' + n(d.total) + ' · لم يُستعمل ' + n(d.unused) +
                        ' · مُفعَّل ' + n(d.used) + ' · موقوف ' + n(d.off) +
                        ' · مرات التفعيل ' + n(d.redeemed);
    });
  }
  paintSummary();

  function when(iso){
    try { return new Date(iso).toLocaleDateString('ar-SA-u-nu-latn'); }
    catch(e){ return ''; }
  }

  /* ★ عدّاد الطلبات: ضغطتان سريعتان على مرشّحين يعودان بأي ترتيب، والأبطأ
     يدهس الأسرع فيرى المشرف نتيجة مرشّحٍ لم يعد مختارًا. الأحدث وحده يرسم. */
  let seq = 0;
  function draw(){
    const mine = ++seq;
    listBox.innerHTML = '';
    listBox.appendChild(el('p', { class:'field__hint', style:'margin:0', text:'جارٍ التحميل…' }));
    QBANK.api.rpc('admin_codes', { p_limit: 200, p_state: state }).then(r => {
      if (mine !== seq || !alive()) return;
      listBox.innerHTML = '';
      /* ★ «لا أكواد بعد» و«تعذّر الجلب» حالتان لا حالة واحدة.
         قائمةٌ فارغة تقول «كل شيء سليم ولم تولّد بعد»، ونداءٌ سقط يقول
         «شيءٌ مكسور» — وعرضُ الأولى مكان الثانية يُخفي العطل تمامًا. */
      if (!r.ok || !Array.isArray(r.data)){
        listBox.appendChild(el('p', { class:'field__hint is-bad', style:'margin:0',
          text: Codes.failText(r) }));
        return;
      }
      const rows = r.data;
      if (!rows.length){
        listBox.appendChild(el('p', { class:'field__hint', style:'margin:0', text:
          state === 'unused' ? 'لا رمز غير مستعمل — ولّد دفعة جديدة.'
          : state === 'used' ? 'لم يُفعَّل رمزٌ بعد.'
          : state === 'off'  ? 'لا رمز موقوف.'
          : 'لا أكواد بعد.' }));
        return;
      }

      rows.forEach(c => {
        const uses = Array.isArray(c.uses) ? c.uses : [];
        const spent = c.used_count >= c.max_uses;
        const off = !c.active || spent;
        const row = el('div', { class:'payrow' }, [
          el('span', { class:'payrow__t num', text: Codes.pretty(c.code) }),
          el('span', { class:'badge', text: c.kind === 'semester' ? 'الفصل' : (c.subject || 'مادة') }),
          el('span', { class:'badge num' + (spent ? ' badge--warn' : ''),
            text: QBANK.views.arNum(c.used_count) + '/' + QBANK.views.arNum(c.max_uses) }),
          el('span', { class:'badge ' + (off ? 'badge--bad' : 'badge--ok'),
            text: off ? (spent ? 'مستهلَك' : 'موقوف') : (uses.length ? 'مُفعَّل' : 'جاهز') })
        ]);
        if (!spent){
          const t = el('button', { class:'btn btn--ghost btn--sm', type:'button',
            text: c.active ? 'أوقف' : 'فعّل',
            'aria-label': (c.active ? 'أوقف الرمز ' : 'فعّل الرمز ') + Codes.pretty(c.code) });
          t.addEventListener('click', async () => {
            t.disabled = true;
            const rr = await QBANK.api.rpc('admin_set_code', { p_id: c.id, p_active: !c.active });
            t.disabled = false;
            if (rr.ok && rr.data && rr.data.ok){
              c.active = !c.active;
              t.textContent = c.active ? 'أوقف' : 'فعّل';
              QBANK.toast(c.active ? 'صار فعّالًا' : 'أُوقف');
              paintSummary();
            } else QBANK.toast('تعذّر التعديل');
          });
          row.appendChild(t);
        }

        const wrap = el('div', { class:'codeblk' }, [row]);

        /*
          ★ الحسابات تحت رمزها لا في جدولٍ منفصل.
          سؤال المشرف دائمًا «هذا الرمز — من أخذه؟»، وجدولٌ ثانٍ يجعل
          الجواب عمليةَ مطابقةٍ بين قائمتين. والبريد ظاهر لأنه هو ما
          يبحث به الطالب عن نفسه حين يقول «فعّلتُه ولم يُفتح».
        */
        uses.forEach(u => {
          wrap.appendChild(el('div', { class:'codeuse' }, [
            el('span', { class:'codeuse__i', 'aria-hidden':'true', text:'↳' }),
            el('span', { class:'codeuse__n', text: u.name || 'بلا اسم' }),
            el('span', { class:'codeuse__e num', text: u.email || '' }),
            el('span', { class:'codeuse__d num', text: when(u.used_at) })
          ]));
        });

        listBox.appendChild(wrap);
      });
    });
  }
  draw();

  return box;
}
QBANK.views.adminCodesCard = adminCodesCard;


/* ===== 65-earn.js ===== */
/*
  ═══════════════════════════════════════════════════════════════════
  أرباح الرافع — نصيبه من كل عملية بيع لمادته
  ═══════════════════════════════════════════════════════════════════
  السعر ١٠٠٪ · التكاليف ٦٠٪ · صافي الربح ٤٠٪ · للرافع ٢٠٪ من السعر.
  و٢٠ من ٤٠ نصفُها — فنصيب الرافع نصفُ صافي الربح.

  ★ ونعرض الرقمين معًا لا أحدهما.
  «٥٠٪ من صافي الربح» صحيحٌ ويُغري، و«٢٠٪ من سعر البيع» صحيحٌ ويُوضّح.
  وعرضُ الأول وحده يجعل الرافع يحسب نصفَ ما دفعه الطالب فيطالب به بعد
  شهر، والخلاف حينها لا يُحسم لأن كلينا يقرأ الجملة نفسها بمعنى مختلف.
  ولذلك يُكتب معهما نصيبُه ريالًا صريحًا من كل عملية — والرقم الصريح لا
  يُختلف عليه، وهو أبلغُ في الإقناع من أي نسبة.
*/

const Earn = {
  data: null,

  load(){
    return QBANK.api.rpc('my_earnings', { p_limit: 20 }).then(r => {
      Earn.data = (r.ok && r.data && !r.data.error) ? r.data : null;
      return { r, d: Earn.data };
    });
  },

  money(h){ return QBANK.pay ? QBANK.pay.money(h, 'SAR') : ((Number(h) || 0) / 100) + ' ريال'; },

  /* نصيب الرافع من سعر مادةٍ بعينها — بالهللات */
  shareOf(priceSar, pct){
    const gross = Math.max(0, Number(priceSar) || 0) * 100;
    return Math.floor(gross * (Number(pct) || 0) / 100);
  },

  /*
    جملة الشرط. تُقرأ من القاعدة لا تُكتب هنا: النسبة قد يغيّرها المشرف،
    ونصٌّ ثابت في الواجهة كان سيقول رقمًا غير الذي يُحسب — وهذا أسوأ من
    ألّا يُقال شيء.
  */
  terms(d){
    if (!d) return '';
    return 'نصيبك ' + QBANK.views.arNum(d.of_net_pct) + '٪ من صافي الربح — ' +
           'أي ' + QBANK.views.arNum(d.share_pct) + '٪ من سعر البيع.';
  },

  /* مثالٌ من مواده هو أصدق من مثالٍ مفترض */
  example(d){
    const u = QBANK.api.user();
    if (!u || !d) return '';
    const mine = (QBANK.data.pack().subjects || [])
      .filter(s => s.created_by === u.id && !s.free && Number(s.price) > 0);
    if (!mine.length) return '';
    const s = mine[0];
    return 'مثال: «' + s.name + '» بـ' + QBANK.views.arNum(s.price) + ' ريالًا — ' +
           'تأخذ ' + Earn.money(Earn.shareOf(s.price, d.share_pct)) + ' من كل عملية.';
  },

  WHY: {
    auth:         'سجّل دخولك أولًا.',
    closed:       'التحويلات موقوفة مؤقتًا — رصيدك محفوظ.',
    no_handle:    'اكتب الآيبان أو رقم STC Pay.',
    below_min:    'المبلغ أقل من الحدّ الأدنى للتحويل.',
    insufficient: 'رصيدك أقل من المبلغ المطلوب.'
  },
  why(reason){ return Earn.WHY[reason] || 'تعذّر إرسال الطلب.'; }
};
QBANK.earn = Earn;

/* ═══════════════ سطر الوعد في شاشة الرفع ═══════════════ */
function earnPromise(){
  const box = el('div', { class:'card earnvow' });
  const line = el('p', { class:'earnvow__t', text:'مادتك قد تُدرّ عليك دخلًا.' });
  const sub = el('p', { class:'field__hint', style:'margin:4px 0 0' });
  box.appendChild(el('span', { class:'earnvow__i', 'aria-hidden':'true', text:'◈' }));
  box.appendChild(el('div', {}, [line, sub]));

  Earn.load().then(({ d }) => {
    if (!alive()) return;
    if (!d) { sub.textContent = 'كل عملية بيع لمادتك تُعطيك نصيبًا يظهر في محفظتك.'; return; }
    sub.textContent = Earn.terms(d) + ' يُضاف إلى رصيدك في المحفظة فور كل عملية.';
  });
  return box;
}
QBANK.views.earnPromise = earnPromise;

/* ═══════════════ بطاقة الأرباح في المحفظة ═══════════════ */
function earnCard(){
  const box = el('div', { class:'card stack' });
  box.appendChild(el('h2', { style:'margin:0', text:'أرباح موادي' }));
  const body = el('div', { class:'stack' });
  box.appendChild(body);
  body.appendChild(el('p', { class:'field__hint', style:'margin:0', text:'جارٍ التحميل…' }));

  Earn.load().then(({ r, d }) => {
    if (!alive()) return;
    body.innerHTML = '';
    if (!d){
      /* دالةٌ غير موجودة تُقال باسم علاجها — لا «تعذّر» يقف بلا باب */
      const m = String((r.data && (r.data.message || r.data.hint)) || '');
      body.appendChild(el('p', { class:'field__hint' + (r.ok ? '' : ' is-bad'), style:'margin:0',
        text: (!r.ok && (/does not exist|Could not find the function/i.test(m) ||
               (r.data && r.data.code === 'PGRST202')))
          ? 'دالة الأرباح غير موجودة في القاعدة — نفّذ ملف db/PAYOUT.sql.'
          : 'تعذّر جلب أرباحك الآن.' }));
      return;
    }

    /* الرصيد أولًا وبأكبر خط: هو الرقم الذي فُتحت الصفحة لأجله */
    body.appendChild(el('div', { class:'earnbal' }, [
      el('span', { class:'earnbal__n num', text: Earn.money(d.balance) }),
      el('span', { class:'earnbal__l', text:'رصيدك القابل للتحويل' })
    ]));

    const facts = el('div', { class:'earnfacts' }, [
      el('span', { class:'badge num', text:'مجموع ما ربحت: ' + Earn.money(d.total) }),
      d.pending ? el('span', { class:'badge badge--warn num',
        text:'قيد التحويل: ' + Earn.money(d.pending) }) : null
    ]);
    body.appendChild(facts);

    body.appendChild(el('p', { class:'field__hint', style:'margin:0', text: Earn.terms(d) }));
    const ex = Earn.example(d);
    if (ex) body.appendChild(el('p', { class:'field__hint', style:'margin:0', text: ex }));

    /* ═══ لكل مادة نصيبها ═══ */
    const bys = Array.isArray(d.by_subject) ? d.by_subject : [];
    if (bys.length){
      body.appendChild(el('h3', { style:'margin:8px 0 0', text:'لكل مادة' }));
      bys.forEach(s => {
        body.appendChild(el('div', { class:'payrow' }, [
          el('span', { class:'payrow__t', text: s.name }),
          el('span', { class:'badge num', text: QBANK.views.arNum(s.sales) + ' عملية' }),
          el('span', { class:'badge badge--ok num', text: Earn.money(s.halalas) })
        ]));
      });
    } else {
      body.appendChild(el('p', { class:'field__hint', style:'margin:0', text:
        'لم تُبَع مادةٌ لك بعد. ارفع مادة وضع لها سعرًا — أو شارك رابطها في دفعتك.' }));
    }

    /* ═══ طلب التحويل ═══ */
    if (!d.open){
      body.appendChild(el('p', { class:'field__hint', style:'margin:0',
        text:'التحويلات موقوفة مؤقتًا. رصيدك محفوظ ولا يتأثر.' }));
    } else if (d.balance < d.min){
      /* ★ الحدّ يُقال بالباقي لا بالحدّ وحده: «١٠٠ ريال» تجعله يحسب،
         و«بقي ٤٢ ريالًا» تقول له كم اقترب. */
      body.appendChild(el('p', { class:'field__hint', style:'margin:0', text:
        'أقل مبلغ للتحويل ' + Earn.money(d.min) + ' — بقي ' +
        Earn.money(d.min - d.balance) + '.' }));
    } else {
      body.appendChild(payoutForm(d));
    }

    /* ═══ طلباتي السابقة ═══ */
    const ps = Array.isArray(d.payouts) ? d.payouts : [];
    if (ps.length){
      body.appendChild(el('h3', { style:'margin:8px 0 0', text:'طلبات التحويل' }));
      const L = { requested:['badge--warn','قيد المراجعة'], paid:['badge--ok','حُوّل'],
                  rejected:['badge--bad','مرفوض'] };
      ps.forEach(p => {
        const st = L[p.status] || ['', p.status];
        body.appendChild(el('div', { class:'payrow' }, [
          el('span', { class:'payrow__t num', text: Earn.money(p.amount) }),
          el('span', { class:'badge ' + st[0], text: st[1] }),
          p.note ? el('span', { class:'field__hint', style:'margin:0', text: p.note }) : null,
          el('span', { class:'payrow__d num',
            text: (function(){ try { return new Date(p.at).toLocaleDateString('ar-SA-u-nu-latn'); }
                               catch(e){ return ''; } })() })
        ]));
      });
    }
  });

  return box;
}

function payoutForm(d){
  const wrap = el('div', { class:'stack' });
  const msg = el('p', { class:'field__hint', role:'status', style:'margin:0' });

  const amtIn = el('input', { class:'input num', type:'number', inputmode:'numeric',
    min: String(Math.ceil(d.min / 100)), max: String(Math.floor(d.balance / 100)),
    value: String(Math.floor(d.balance / 100)), 'aria-label':'المبلغ بالريال' });

  const methodSel = el('select', { class:'input', 'aria-label':'طريقة التحويل' }, [
    el('option', { value:'bank',   text:'تحويل بنكي (آيبان)' }),
    el('option', { value:'stcpay', text:'STC Pay' })
  ]);

  const handleIn = el('input', { class:'input', type:'text', maxlength:'60',
    dir:'ltr', autocomplete:'off', placeholder:'SA00 0000 0000 0000 0000 0000',
    'aria-label':'الآيبان أو رقم STC Pay' });
  const paintHandle = () => {
    handleIn.placeholder = methodSel.value === 'stcpay'
      ? '05XXXXXXXX' : 'SA00 0000 0000 0000 0000 0000';
  };
  methodSel.addEventListener('change', paintHandle); paintHandle();

  const send = el('button', { class:'btn btn--block', type:'button', text:'اطلب التحويل' });
  send.addEventListener('click', async () => {
    const halalas = Math.round((parseFloat(amtIn.value || '0') || 0) * 100);
    send.disabled = true; msg.className = 'field__hint'; msg.textContent = 'جارٍ الإرسال…';
    const r = await QBANK.api.rpc('request_payout', {
      p_amount: halalas, p_method: methodSel.value, p_handle: handleIn.value || '' });
    send.disabled = false;
    const x = (r.ok && r.data) ? r.data : null;
    if (x && x.ok){
      msg.className = 'field__hint is-ok';
      msg.textContent = 'وصل طلبك. يُحوَّل خلال أيام، وستراه هنا «حُوّل».';
      send.hidden = true;
      /* الرصيد نقص فعلًا في القاعدة — نعيد الرسم كي لا يبقى الرقم القديم
         على الشاشة فيطلبه صاحبه مرة أخرى */
      setTimeout(() => QBANK.router.render(location.hash), 1200);
      return;
    }
    msg.className = 'field__hint is-bad';
    msg.textContent = Earn.why(x && x.reason);
  });

  wrap.appendChild(el('h3', { style:'margin:8px 0 0', text:'اطلب تحويل رصيدك' }));
  wrap.appendChild(el('div', { class:'ad-grid2' }, [
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'المبلغ (ريال)' }), amtIn ]),
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'الطريقة' }), methodSel ])
  ]));
  wrap.appendChild(el('label', { class:'field' }, [
    el('span', { class:'field__label', text:'الآيبان أو رقم STC Pay' }), handleIn ]));
  wrap.appendChild(send);
  wrap.appendChild(msg);
  return wrap;
}
QBANK.views.earnCard = earnCard;

/* ═══════════════ لوحة المشرف: طلبات التحويل ═══════════════ */
function adminPayoutsCard(){
  const box = el('div', { class:'card stack' });
  box.appendChild(el('h2', { style:'margin:0', text:'أرباح الرافعين والتحويلات' }));
  const sum = el('p', { class:'field__hint', style:'margin:0', role:'status' });
  const list = el('div', { class:'stack' });
  box.appendChild(sum);
  box.appendChild(list);

  let status = 'requested';
  const chips = el('div', { class:'ex-chips', role:'group', 'aria-label':'تصفية طلبات التحويل' });
  [['requested','قيد المراجعة'],['paid','حُوّل'],['rejected','مرفوض'],['','الكل']].forEach(t => {
    const b = el('button', { class:'chip' + (t[0] === status ? ' is-on' : ''), type:'button',

      draw();
    });
    chips.appendChild(b);
  });
  box.insertBefore(chips, list);

  function paintSummary(){
    QBANK.api.rpc('admin_earnings_summary').then(r => {
      if (!alive()) return;
      const d = (r.ok && r.data && !r.data.error) ? r.data : null;
      if (!d) { sum.textContent = ''; return; }
      const M = h => Earn.money(h);
      /* ★ «مستحقّ عليك» رقمٌ التزامي لا إحصائي: هو ما في جيوب الرافعين
         عندك، ويجب أن يُرى بجانب ما بِعت لا في صفحة أخرى. */
      sum.textContent = 'مبيعات ' + QBANK.views.arNum(d.sales) + ' · إجمالي ' + M(d.gross) +
        ' · نصيب الرافعين ' + M(d.owed) + ' · أرصدة لديهم ' + M(d.balances) +
        ' · مطلوب تحويله ' + M(d.requested) + ' · حُوّل ' + M(d.paid);
    });
  }
  paintSummary();

  let seq = 0;
  function draw(){
    const mine = ++seq;
    list.innerHTML = '';
    list.appendChild(el('p', { class:'field__hint', style:'margin:0', text:'جارٍ التحميل…' }));
    QBANK.api.rpc('admin_payouts', { p_status: status }).then(r => {
      if (mine !== seq || !alive()) return;
      list.innerHTML = '';
      if (!r.ok || !Array.isArray(r.data)){
        list.appendChild(el('p', { class:'field__hint is-bad', style:'margin:0',
          text:'تعذّر جلب الطلبات — تأكّد من تنفيذ db/PAYOUT.sql.' }));
        return;
      }
      if (!r.data.length){
        list.appendChild(el('p', { class:'field__hint', style:'margin:0',
          text: status === 'requested' ? 'لا طلبات معلّقة.' : 'لا شيء هنا.' }));
        return;
      }
      r.data.forEach(p => {
        const row = el('div', { class:'payrow' }, [
          el('span', { class:'payrow__t', text: (p.name || 'بلا اسم') }),
          el('span', { class:'badge num', text: Earn.money(p.amount) }),
          el('span', { class:'badge', text: p.method === 'stcpay' ? 'STC Pay' : 'آيبان' })
        ]);
        /*
          ★ الآيبان معروض لأنه سبب وجود الصفّ.
          إخفاؤه خلف نقرةٍ يجعل المشرف ينسخ عشرين مرة من عشرين نافذة.
          وهو لا يصل إلا هنا: الجدول بلا سياسة قراءة، والدالة تسأل is_admin.
        */
        const det = el('div', { class:'codeuse' }, [
          el('span', { class:'codeuse__i', 'aria-hidden':'true', text:'↳' }),
          el('span', { class:'codeuse__e num', text: p.handle || '—' }),
          el('span', { class:'codeuse__n', text: p.email || '' })
        ]);
        const blk = el('div', { class:'codeblk' }, [row, det]);

        if (p.status === 'requested'){
          const ok = el('button', { class:'btn btn--sm', type:'button', text:'حُوّل',
            'aria-label':'أكّد تحويل ' + Earn.money(p.amount) + ' إلى ' + (p.name || 'الرافع') });
          const no = el('button', { class:'btn btn--ghost btn--sm', type:'button', text:'ارفض',
            'aria-label':'ارفض طلب ' + (p.name || 'الرافع') + ' وأعد المبلغ إلى رصيده' });
          const set = async (st) => {
            ok.disabled = no.disabled = true;
            const rr = await QBANK.api.rpc('admin_set_payout', { p_id: p.id, p_status: st, p_note: '' });
            if (rr.ok && rr.data && rr.data.ok){
              QBANK.toast(st === 'paid' ? 'سُجّل التحويل' : 'رُفض وأُعيد المبلغ');
              paintSummary(); draw();
            } else {
              ok.disabled = no.disabled = false;
              QBANK.toast('تعذّر التعديل');
            }
          };
          ok.addEventListener('click', () => set('paid'));
          no.addEventListener('click', () => set('rejected'));
          row.appendChild(ok); row.appendChild(no);
        } else {
          const L = { paid:['badge--ok','حُوّل'], rejected:['badge--bad','مرفوض'] };
          const st = L[p.status] || ['', p.status];
          row.appendChild(el('span', { class:'badge ' + st[0], text: st[1] }));
        }
        list.appendChild(blk);
      });
    });
  }
  draw();

  return box;
}
QBANK.views.adminPayoutsCard = adminPayoutsCard;

})();

</script>
</body>
</html>
