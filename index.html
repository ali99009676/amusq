  أن هذه هي كل موادها. المكان الصحيح للمواد هو «استكشف» حيث يبحث الطالب
  عن جامعته ويرى ما يخصّه هو. أما الصفحة الأولى فتُجيب عن سؤال واحد:
  ما هذه المنصة وكيف تعمل؟
*/
/*
  رفّ الكتب — التوقيع البصري للمنصة.

  رفّ مجرَّد لا يُبنى من مواد حقيقية: هو صورة لفكرة «بنك الأسئلة» لا عرضٌ
  لمخزون. تفاوت سُمك الكعوب وأطوالها ثابت مقصود، كي تبقى الصورة نفسها لكل
  زائر مهما اختلف ما في القاعدة.
*/
function shelfSvg(){
  const NS = 'http://www.w3.org/2000/svg';
  const W = 640, H = 116, FLOOR = 96;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'lp-shelf');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'رفّ كتب — صورة تعبيرية لبنوك الأسئلة');

  // أوزان ثابتة: الصورة واحدة لكل زائر، ولا تُفسَّر كإحصاء
  const WEIGHTS = [46, 30, 58, 38, 52, 34, 44, 60, 36];

  let x = 12;
  WEIGHTS.forEach((w, i) => {
    const bw = 26 + Math.round(w / 60 * 34);
    const bh = 46 + ((i * 7) % 22);                     // تفاوت الطول: رفّ لا مسطرة
    const col = 'var(--subject-' + ((i % 6) + 1) + ')';
    const g = document.createElementNS(NS, 'g');

    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', x); r.setAttribute('y', FLOOR - bh);
    r.setAttribute('width', bw); r.setAttribute('height', bh);
    r.setAttribute('rx', 3); r.setAttribute('fill', col);
    r.setAttribute('class', 'lp-shelf__book');
    r.style.setProperty('--d', (i * 90) + 'ms');        // تتابع الظهور
    g.appendChild(r);

    // شريطان مذهّبان على الكعب — تفصيلة الكتاب المجلَّد
    [10, 18].forEach(off => {
      const ln = document.createElementNS(NS, 'rect');
      ln.setAttribute('x', x + 5); ln.setAttribute('y', FLOOR - bh + off);
      ln.setAttribute('width', Math.max(4, bw - 10)); ln.setAttribute('height', 2);
      ln.setAttribute('fill', 'var(--gold)'); ln.setAttribute('opacity', '.65');
      g.appendChild(ln);
    });
    svg.appendChild(g);
    x += bw + 5;
  });

  // لوح الرفّ
  const shelf = document.createElementNS(NS, 'rect');
  shelf.setAttribute('x', 0); shelf.setAttribute('y', FLOOR);
  shelf.setAttribute('width', Math.max(x + 8, 220)); shelf.setAttribute('height', 5);
  shelf.setAttribute('rx', 2.5); shelf.setAttribute('class', 'lp-shelf__plank');
  svg.appendChild(shelf);
  return svg;
}

/* ===== ١ · سؤال تجريبي حقيقي — يجيب عنه الزائر ويرى الشرح فورًا =====
   العيّنة تدور بين التخصصات (انظر 39-demos.js)، وموسومة كعيّنة تعليمية
   لا تُنسب لملف دكتور. */
function lpTryQuestion(demo){
  const LP_DEMO = demo || QBANK.demos.at(0);
  const box = el('div', { class:'lp-try' });
  const feedback = el('div', { class:'lp-try__fb', hidden:true, role:'status' });
  let answered = false;

  const opts = el('div', { class:'lp-try__opts' }, LP_DEMO.options.map((text, i) => {
    const b = el('button', { class:'opt', type:'button' }, [
      el('span', { class:'opt__mark', 'aria-hidden':'true' }),
      el('span', { class:'ltr', text })
    ]);
    b.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      const right = i === LP_DEMO.answer;
      // نعلّم كل الخيارات: الصحيح دائمًا، والخاطئ المختار — باللون والأيقونة معًا
      opts.querySelectorAll('.opt').forEach((node, j) => {
        node.disabled = true;
        if (j === LP_DEMO.answer) { node.classList.add('is-answer'); node.firstChild.textContent = '✓'; }
        else if (j === i) { node.classList.add('is-wrong'); node.firstChild.textContent = '✗'; }
      });
      feedback.hidden = false;
      feedback.className = 'lp-try__fb ' + (right ? 'is-ok' : 'is-no');
      feedback.innerHTML = '';
      feedback.appendChild(el('b', { text: right ? '✓ إجابة صحيحة' : '✗ ليست الإجابة الصحيحة' }));
      feedback.appendChild(el('p', { style:'margin:0 0 8px', text: LP_DEMO.why }));
      feedback.appendChild(el('p', { class:'field__hint', style:'margin:0', text: LP_DEMO.wrong }));
    });
    return b;
  }));

  const transBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'عرض الترجمة' });
  const trans = el('p', { class:'field__hint', hidden:true, text: LP_DEMO.q_ar });
  transBtn.addEventListener('click', () => {
    trans.hidden = !trans.hidden;
    transBtn.textContent = trans.hidden ? 'عرض الترجمة' : 'إخفاء الترجمة';
  });

  box.appendChild(el('div', { class:'row', style:'margin-bottom:12px' }, [
    el('span', { class:'badge', text:'عيّنة تعليمية' }),
    el('span', { class:'badge badge--ok', text: LP_DEMO.tag })
  ]));
  box.appendChild(el('p', { class:'lp-try__q ltr', text: LP_DEMO.q }));
  box.appendChild(opts);
  box.appendChild(feedback);
  box.appendChild(el('div', { class:'row', style:'margin-top:12px' }, [transBtn]));
  box.appendChild(trans);
  return box;
}

/* ===== ٢ · بطاقة حفظ حيّة — يقلبها الزائر ليرى كيف تعمل ===== */
function lpMemoCard(demo){
  const m = (demo || QBANK.demos.at(0)).mnemonic;
  let flipped = false;
  const card = el('div', { class:'lp-memo', tabindex:'0', role:'button', 'aria-label':'بطاقة حفظ — اضغط لقلبها' });

  function paint(){
    card.innerHTML = '';
    if (!flipped) {
      card.appendChild(el('p', { class:'lp-memo__hint', text:'وجه البطاقة · اضغط للقلب' }));
      card.appendChild(el('p', { class:'ltr', style:'font-weight:700;font-size:1.05rem', text: m.cue }));
      card.appendChild(el('p', { class:'field__hint', style:'margin:0', text:'ما الكلمة الدالة التي تربطها بالإجابة؟' }));
    } else {
      card.appendChild(el('p', { class:'lp-memo__hint', text:'الوجه الخلفي' }));
      card.appendChild(el('div', { class:'lp-memo__chain' }, [
        el('span', { class:'ltr', text: m.cue }),
        el('span', { 'aria-hidden':'true', text:'←' }),
        el('span', { class:'lp-memo__k ltr', text: m.key })
      ]));
      card.appendChild(el('p', { class:'field__hint', style:'margin:0', text:'🔗 ' + m.link }));
    }
  }
  const flip = () => { flipped = !flipped; paint(); };
  card.addEventListener('click', flip);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  paint();
  return card;
}

     على شاشة ٣٦٠ بكسل، فلا داعي لاختصارٍ يشتري مساحةً بثمن الوضوح. */
  { path:'#/upload',   label:'ارفع مادة', ico:'upload' },
  /*
    ★ خمسة لا ستة.
    الشريط السفلي على الجوال يتّسع لخمسة قبل أن تضيق مساحة اللمس ويصير
    الخطأ في الضغط قاعدة. فحين دخلت «راجع» خرجت «الإعدادات» — والمقارنة
    محسومة: المراجعة تُفتح كل يوم، والإعدادات مرةً في العمر. وانتقلت إلى
    «حسابي» حيث يبحث عنها الناس أصلًا.
  */
  { path:'#/account',  label:'حسابي',     ico:'user' }
];

function buildTabbar(){
  /*
    ★ الشريط السفلي وتنقّل الترويسة يُبنيان من قائمةٍ واحدة.
    قائمتان تتباعدان: يُضاف تبويب إلى إحداهما ويُنسى في الأخرى، فيختلف
    ما يراه الطالب على جوّاله عمّا يراه على حاسوبه. مصدرٌ واحد لا مصدران.
  */
  const top = document.getElementById('topnav');
  if (top) {
    top.innerHTML = '';
    NAV.forEach(item => {
      const a = QBANK.dom.el('a', { class:'topnav__item', href:item.path, 'data-nav':item.path });
      a.appendChild(icon(ICONS[item.ico] || ICONS.home));
      a.appendChild(QBANK.dom.el('span', { class:'topnav__lbl', text:item.label }));
      top.appendChild(a);
    });
  }

  const bar = document.getElementById('tabbar');
  if (!bar) return;
  bar.innerHTML = '';
  NAV.forEach(item => {
    /*
      الرمز داخل غلافٍ مستقل كي تُرسم عليه حبّةُ التمييز خلف الأيقونة
      وحدها لا خلف النص — التمييز الذي يبتلع الكلمة يُثقل الشريط.
    */
    const box = QBANK.dom.el('span', { class:'tabbar__box', 'aria-hidden':'true' });
    box.appendChild(icon(ICONS[item.ico] || ICONS.home));
    bar.appendChild(QBANK.dom.el('a', { class:'tabbar__item', href:item.path, 'data-nav':item.path }, [
      box,
      QBANK.dom.el('span', { class:'tabbar__lbl', text:item.label })
    ]));
  });
}

function registerRoutes(){
  const V = QBANK.views;
  QBANK.router
    .add('#/',            V.ViewHome)
    .add('#/login',       V.ViewLogin)
    .add('#/admin',       V.ViewAdmin)
    .add('#/admin/login', V.ViewAdminLogin)
    .add('#/settings',    V.ViewSettings)
    .add('#/account',     V.ViewAccount)
    .add('#/admin/upload', V.ViewUpload)
    .add('#/upload',       V.ViewUpload)   // المسار الذي يُعطى للطالب — والقديم يبقى للمشرف
    .add('#/explore',      V.ViewExplore)
    .add('#/u',            V.ViewUniversity)   // قسم الجامعة: #/u/<id>
    .add('#/admin/subject', V.ViewAdminSubject)
    .add('#/s',            V.ViewShare)      // رابط المشاركة: يقبل #s/slug و #/s/slug معًا
    .add('#/subject',      V.ViewSubject)
    .add('#/exam',         V.ViewExam)
    .add('#/challenge',    V.ViewChallenge)
    .add('#/pay',          V.ViewPayReturn)   // عودة الطالب من البوابة: #/pay/<payment_id>
    .add('#/board',        V.ViewBoard)
    .add('#/review',       V.ViewReview)      // «راجع اليوم» — من كل المواد معًا
    /* ★ ‎#/p‎ لا ‎#/u‎: الأخير محجوز لقسم الجامعة، وتسجيله مرتين يجعل
       الموجّه يبتلع أحدهما بصمت — فيفتح رابط الطالب قسم جامعة عشوائيًا */
    .add('#/p',            V.ViewPeer);      // الملف العام لأي طالب: #/p/<id>
  QBANK.router.notFound = V.ViewNotFound;
}

function boot(){
  if (QBANK.ready) return;   // الإقلاع مرة واحدة مهما تكرّر نداؤه
  QBANK.store.migrate();     // ننقل تخزين الهوية القديمة قبل أن يقرأه أحد
  QBANK.data.migrateDB();    // وأسئلة وضع عدم الاتصال — بلا انتظار، فهي ليست شرطًا للإقلاع
  QBANK.theme.init();

  // رموز الدخول تعود من Supabase في هاش الصفحة — نلتقطها قبل أن يفسّرها الموجّه كمسار
  if (QBANK.api.auth.captureFromHash(location.hash)) {
    /* ★ الوجهة المحفوظة قبل المغادرة تفوز على الرئيسية: من دخل من بوابة
       المشرف يعود إلى لوحته لا إلى واجهة الطالب. تُقرأ مرة ثم تُمحى. */
    const after = QBANK.store.get('after_login', '#/');
    QBANK.store.remove('after_login');
    const dest = /^#\//.test(after) ? after : '#/';
    try { history.replaceState(null, '', location.pathname + location.search + dest); }
    catch(e) { location.hash = dest; }
    QBANK.toast('تم تسجيل الدخول');
  }

  buildTabbar();
  registerRoutes();
  QBANK.router.init();
  registerSW();
  QBANK.ready = true;

  // أعمال الخلفية: لا تُعطّل الرسم الأول ولا تكسر العمل بلا إنترنت
  if (QBANK.api.user()) {
    QBANK.progress.pull();                       // دمج تقدّم الحساب مع الجهاز — بلا حذف
    QBANK.gate.refresh();                        // الاستحقاقات: ما اشتراه الطالب
    /* ★ نبضةٌ متكرّرة لا واحدة عند الإقلاع: من فتح التطبيق ثم وضع جوّاله
       في جيبه ليس متصلًا بالمعنى الذي يهمّ المشرف. */
    if (QBANK.presence) QBANK.presence.start();
  }
  if (QBANK.config.ready()) {
    QBANK.data.refreshPack().then(r => {         // تحديث قائمة المواد إن توفّر اتصال
      if (r.ok && QBANK.router.current && QBANK.router.current.path === '#/') QBANK.router.render('#/');
    });
  }
}

// PWA: عامل الخدمة يُسجَّل على https فقط — file:// يعمل بلا حاجة إليه أصلًا
function registerSW(){
  if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return false;
  if (location.protocol !== 'https:') return false;
  navigator.serviceWorker.register('sw.js').catch(() => {});   // فشله لا يعطل المنصة
  return true;
}

QBANK.registerSW = registerSW;
QBANK.nav = NAV;
QBANK.boot = boot;
window.QBANK = QBANK;

// jsdom في الفحوص يُحمّل الصفحة كاملة قبل تنفيذ السكربت، لذا نتحقق من الحالتين
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();


/* ===== 41-admin-charts.js ===== */
/*
  رسوم اللوحة — SVG مبني بيدنا لا مكتبة رسم.
  السبب: قاعدة «لا مكتبة خارجية في المتصفح»، والرسوم التي نحتاجها بسيطة
  (أعمدة وخط ومقاييس) فكتابتها أرخص من أي مكتبة وأخف على الجوال.
*/
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  if (attrs) Object.keys(attrs).forEach(k => {
    if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, String(attrs[k]));
  });
  return n;
}

/* أعمدة النشاط اليومي + خط متوسط النتيجة فوقها */
function chartActivity(series){
  const W = 640, H = 170, PAD_B = 22, PAD_T = 10;
  const svg = svgEl('svg', { class:'ad-chart', viewBox:'0 0 ' + W + ' ' + H,
    preserveAspectRatio:'none', role:'img', 'aria-label':'نشاط الاختبارات اليومي' });
  const n = series.length || 1;
  const maxN = Math.max(1, ...series.map(s => Number(s.n)));
  const bw = W / n, gap = Math.min(6, bw * .25);
  const plotH = H - PAD_B - PAD_T;

  // خطوط شبكة أفقية — ثلاثة تكفي لقراءة المقياس بلا ضجيج
  [0, .5, 1].forEach(f => {
    const y = PAD_T + plotH * (1 - f);
    svg.appendChild(svgEl('line', { class:'grid', x1:0, y1:y, x2:W, y2:y }));
    svg.appendChild(Object.assign(svgEl('text', { class:'lbl', x:2, y:y - 3 }),
      { textContent: String(Math.round(maxN * f)) }));
  });

  series.forEach((s, i) => {
    const v = Number(s.n);
    const h = Math.max(v > 0 ? 3 : 2, plotH * (v / maxN));
    svg.appendChild(svgEl('rect', {
      class: 'bar' + (v ? '' : ' bar--empty'),
      x: i * bw + gap / 2, y: PAD_T + plotH - h,
      width: Math.max(2, bw - gap), height: h, rx: 3
    }));
    // تسمية اليوم: نعرض كل يومين على الجوال كي لا تتداخل
    if (n <= 8 || i % 2 === 0) {
      const day = String(s.d).slice(8, 10);
      svg.appendChild(Object.assign(
        svgEl('text', { class:'lbl', x: i * bw + bw / 2, y: H - 6, 'text-anchor':'middle' }),
        { textContent: day }));
    }
  });

  // خط متوسط النتيجة — يقرأ على مقياس ٠–١٠٠ لا على مقياس العدد
  const pts = series.map((s, i) => [i * bw + bw / 2, PAD_T + plotH * (1 - Number(s.avg) / 100)]);
  if (pts.some((p, i) => Number(series[i].avg) > 0)) {
    svg.appendChild(svgEl('path', { class:'line',
      d: pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') }));
    pts.forEach((p, i) => { if (Number(series[i].avg) > 0)
      svg.appendChild(svgEl('circle', { class:'dot', cx:p[0], cy:p[1], r:2.4 })); });
  }
  return svg;
}

/* شرائح النتائج — أشرطة أفقية تُقرأ أسرع من دائرة */
function chartBuckets(buckets){
  const total = buckets.reduce((n, b) => n + Number(b.n), 0) || 1;
  const COLORS = ['var(--bad)','var(--warn)','var(--star)','var(--brand-2)','var(--ok)'];
  return el('div', {}, buckets.map((b, i) => {
    const pct = Number(b.n) / total * 100;
    return el('div', { class:'ad-bucket' }, [
      el('span', { class:'ad-bucket__l', text: b.label }),
      el('span', { class:'ad-bucket__t' }, [
        el('span', { class:'ad-bucket__f', style:'width:' + pct.toFixed(1) + '%;background:' + COLORS[i] })
      ]),
      el('span', { class:'ad-bucket__n', text: String(b.n) })
    ]);
  }));
}

/* بطاقة مؤشر */
function kpi(n, label, sub, tone){
  return el('div', { class:'ad-kpi' + (tone ? ' ad-kpi--' + tone : '') }, [
    el('span', { class:'ad-kpi__n', text: String(n) }),
    el('span', { class:'ad-kpi__l', text: label }),
    sub ? el('span', { class:'ad-kpi__s', text: sub }) : null
  ]);
}

/* وقت نسبي مختصر */
function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'الآن';
  if (s < 3600) return Math.floor(s / 60) + ' د';
  if (s < 86400) return Math.floor(s / 3600) + ' س';
  return Math.floor(s / 86400) + ' يوم';
}

QBANK.admin = QBANK.admin || {};
QBANK.admin.charts = { chartActivity, chartBuckets, kpi, ago, svgEl };


/* ===== 42-admin-dash.js ===== */
/*
  تبويب «اللوحة» — كل ما يحتاجه المشرف ليعرف حال المنصة في نظرة واحدة.
  نداء واحد إلى admin_dashboard يجلب كل شيء دفعةً واحدة: أرخص من ست نداءات،
  وأدق لأن الأرقام كلها من نفس اللحظة.
*/
function dashSkeleton(){
  return el('div', { class:'ad-kpis' }, [1,2,3,4,5,6].map(() =>
    el('div', { class:'ad-kpi' }, [ el('span', { class:'skel skel--line' }) ])));
}

function dashKpis(k){
  const C = QBANK.admin.charts;
  return el('div', { class:'ad-kpis' }, [
    C.kpi(k.students, 'طالبًا', k.active_7d + ' نشط هذا الأسبوع'),
    C.kpi(k.online, 'متصل الآن', 'آخر ٤ ساعات', k.online > 0 ? 'live' : null),
    C.kpi(k.attempts, 'اختبارًا', 'منذ الإطلاق'),
    C.kpi(k.avg_pct + '٪', 'متوسط النتائج', k.avg_pct >= 70 ? 'فوق حدّ النجاح' : 'تحت حدّ النجاح',
      k.avg_pct >= 70 ? 'live' : (k.avg_pct > 0 ? 'warn' : null)),
    C.kpi(k.questions, 'سؤالًا', k.derived + ' مشتق'),
    C.kpi(k.published + '/' + k.subjects, 'مادة منشورة', k.drafts ? k.drafts + ' مسوّدة معلّقة' : 'لا مسوّدات',
      k.drafts ? 'warn' : null)
  ]);
}

function dashPanel(title, sub, body, extraClass){
  return el('section', { class:'ad-panel' + (extraClass ? ' ' + extraClass : '') }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:title }),
      sub ? el('span', { class:'ad-panel__s', text:sub }) : null
    ]),
    body
  ]);
}

function dashSubjects(subjects){
  if (!subjects.length) return QBANK.views.empty('▤', 'لا مواد بعد', 'ارفع أول ملف أسئلة.');
  // الترتيب حسب المحاولات: المادة التي يدرسها الطلاب فعلًا تستحق الصدارة
  const rows = subjects.slice().sort((a, b) => Number(b.attempts) - Number(a.attempts));
  return el('div', { class:'ad-table' }, rows.map(s => {
    const row = el('button', { class:'ad-row', type:'button' }, [
      el('span', { text: s.icon || '▤' }),
      el('span', { class:'ad-row__main' }, [
        el('span', { class:'ad-row__t', text: s.name }),
        el('span', { class:'ad-row__s', text: s.q_count + ' سؤالًا · ' + s.students + ' مشترك' })
      ]),
      el('span', { class:'badge num', text: s.attempts + ' اختبار' }),
      el('span', { class:'badge num ' + (Number(s.avg_pct) >= 70 ? 'badge--ok' : Number(s.avg_pct) > 0 ? 'badge--warn' : ''),
        text: Math.round(s.avg_pct) + '٪' }),
      s.published ? el('span', { class:'badge badge--ok', text:'منشورة' }) : el('span', { class:'badge', text:'مخفية' })
    ]);
    row.addEventListener('click', () => QBANK.router.go('#/admin/subject/' + s.id));
    return row;
  }));
}

function dashRecent(recent){
  if (!recent.length) return QBANK.views.empty('◷', 'لا نشاط بعد', 'سيظهر هنا كل اختبار فور انتهائه.');
  const C = QBANK.admin.charts;
  return el('div', { class:'ad-feed' }, recent.map(a => el('div', { class:'ad-feed__i' }, [
    el('span', { class:'ad-feed__av', text: a.avatar || '👤' }),
    el('span', { class:'ad-feed__x' }, [
      el('span', { class:'ad-row__t', text: a.student }),
      el('span', { class:'ad-row__s', text: a.subject + ' · ' + a.correct + ' من ' + a.total })
    ]),
    el('span', { class:'badge num ' + (Number(a.pct) >= 70 ? 'badge--ok' : 'badge--warn'), text: Math.round(a.pct) + '٪' }),
    el('span', { class:'ad-feed__t', text: C.ago(a.created_at) })
  ])));
}

function adminDashTab(box){
  const C = QBANK.admin.charts;
  let days = QBANK.store.get('ad_days', 14);

  const rangeBar = el('div', { class:'ad-bar' },
    [7, 14, 30].map(d => {
      const b = el('button', { class:'btn btn--sm ' + (d === days ? '' : 'btn--ghost'), type:'button',
        text: d + ' يومًا' });
      b.addEventListener('click', () => { QBANK.store.set('ad_days', d); days = d; load(); });
      return b;
    }));
  const wrap = el('div', {});
  box.appendChild(rangeBar);
  box.appendChild(wrap);

  function load(){
    // نعيد بناء شريط المدى ليعكس الاختيار الجديد
    rangeBar.querySelectorAll('button').forEach((b, i) => {
      b.className = 'btn btn--sm ' + ([7,14,30][i] === days ? '' : 'btn--ghost');
    });
    wrap.innerHTML = '';
    wrap.appendChild(dashSkeleton());
    QBANK.api.rpc('admin_dashboard', { days }).then(r => {
      if (!wrap.isConnected) return;     // غادر المشرف قبل وصول الرد
      wrap.innerHTML = '';
      if (!r.ok || !r.data || r.data.error) {
        wrap.appendChild(QBANK.views.empty('⚠', 'تعذّر الجلب',
          r.offline ? 'لا اتصال بالإنترنت.'
                    : 'تأكد أن حسابك مشرف وأن ملف ADMIN-DASHBOARD.sql مُشغَّل على قاعدة البيانات.'));
        return;
      }
      const d = r.data;
      const total = (d.series || []).reduce((n, s) => n + Number(s.n), 0);
      wrap.appendChild(dashKpis(d.kpi));
      wrap.appendChild(el('div', { class:'ad-panels ad-panels--2' }, [
        dashPanel('النشاط اليومي', total + ' اختبارًا خلال ' + days + ' يومًا',
          C.chartActivity(d.series || [])),
        dashPanel('توزيع النتائج', 'الخط البرتقالي = متوسط النتيجة',
          C.chartBuckets(d.buckets || []))
      ]));
      wrap.appendChild(el('div', { class:'ad-panels' }, [
        dashPanel('أداء المواد', 'اضغط مادة لفتح محررها', dashSubjects(d.subjects || [])),
        dashPanel('آخر النشاط', null, dashRecent(d.recent || []))
      ]));
    });
  }
  load();
}

/*
  نُصدّر أجزاء اللوحة القديمة لا الشاشة وحدها.
  ★ اللوحة الجديدة تُضيف القمع والمال والتحذيرات، لكن «أداء المواد» و«آخر
  النشاط» و«توزيع النتائج» نافعة كما هي — واستبدال شاشة بأخرى يُلقي عملًا
  صحيحًا لا لعيب فيه بل لأنه قديم. فتُدمج بدل أن تُرمى.

QBANK.admin.dashTab = adminDashTab;
QBANK.admin.dashParts = { dashKpis, dashPanel, dashSubjects, dashRecent, dashSkeleton };
QBANK.views.ADMIN_TABS.unshift({ id:'dash', label:'اللوحة', fill: adminDashTab });


/* ===== 43-admin-subject.js ===== */
/*
  محرر المادة — كل ما يخصّ مادة واحدة في شاشة واحدة: هويتها، محاورها،
  محتواها التحليلي، وأسئلتها.

  قاعدة القداسة تخصّ الآلة: لا يجوز لنموذجٍ أو خط معالجة أن يغيّر حرفًا من
  نص الدكتور. أما المشرف البشري فمالك القرار — يحرّر النص والخيارات بوعي،
  خلف بابٍ صريح يذكّره أن ما يكتبه يصبح هو «الأصل» الذي يذاكر منه الجميع.
*/
const SUBJ_COLORS = ['subject-1','subject-2','subject-3','subject-4','subject-5','subject-6'];
const SUBJ_ICONS  = ['▤','☤','✚','♥','◈','⚕','☣','◐','⌁','⚗'];

const SubjEditor = {
  patchSubject(id, body){
    return QBANK.api.rest('subjects?id=eq.' + id, { method:'PATCH', body: JSON.stringify(body) });
  },
  patchQuestion(id, body){
    return QBANK.api.rest('questions?id=eq.' + id, { method:'PATCH', body: JSON.stringify(body) });
  },
  delQuestion(id){
    return QBANK.api.rest('questions?id=eq.' + id, { method:'DELETE' });
  },
  /* ★ سؤال جديد يدويًا: المشرف مؤلّف أيضًا لا ناقلًا فقط.
     يُوسم أنه من تأليف المنصة (derived=false، بلا وسم قداسة) وq_count
     يتزامن بقادح القاعدة فلا نلمسه. */
  addQuestion(subjectId, ord){
    return QBANK.api.rest('questions', { method:'POST', body: JSON.stringify({
      subject_id: subjectId, ord: ord,
      q: 'سؤال جديد — حرّر نصّه', options: ['الخيار الأول','الخيار الثاني','الخيار الثالث','الخيار الرابع'],
      answer: 0, derived: false, important: false,
      expl_ar:'', expl_en:'', translation:'', mnemonic:{}, topic:''
    }) });
  },
  /* تصفية محلية: البحث في مادة واحدة لا يستحق ذهابًا إلى الخادم مع كل حرف */
  filter(list, q, topic, only){
    const needle = String(q || '').trim().toLowerCase();
    return list.filter(x => {
      if (topic && (x.topic || '') !== topic) return false;
      if (only === 'important' && !x.important) return false;
      if (only === 'derived'   && !x.derived)   return false;
      if (only === 'noexpl'    && x.expl_ar)    return false;
      if (!needle) return true;
      return (x.q + ' ' + (x.options || []).join(' ')).toLowerCase().indexOf(needle) !== -1;
    });
  }
};

/* ===== بطاقة هوية المادة ===== */
function subjIdentity(sub, refresh){
  const nameIn  = el('input', { class:'input', value: sub.name || '' });
  const descrIn = el('textarea', { class:'input', rows:'2' }); descrIn.value = sub.descr || '';
  const ordIn   = el('input', { class:'input', type:'number', value: String(sub.ord || 0), 'aria-label':'ترتيب المادة' });
  const dateIn  = el('input', { class:'input', type:'date',
    value: sub.exam_date ? String(sub.exam_date).slice(0,10) : '', 'aria-label':'موعد الاختبار' });

  let color = sub.color || SUBJ_COLORS[0];
  const swatches = el('div', { class:'ad-swatches', role:'radiogroup', 'aria-label':'لون المادة' },
    SUBJ_COLORS.map(c => {
      const b = el('button', { class:'ad-sw', type:'button', role:'radio', 'data-color':c,
        'aria-checked': c === color ? 'true' : 'false', 'aria-label': c,
        style:'background:var(--' + c + ')' });
      b.addEventListener('click', () => {
        color = c;
        swatches.querySelectorAll('.ad-sw').forEach(x =>
          x.setAttribute('aria-checked', x.getAttribute('data-color') === c ? 'true' : 'false'));
      });
      return b;
    }));

  let icon = sub.icon || SUBJ_ICONS[0];
  const icons = el('div', { class:'ad-icons', role:'radiogroup', 'aria-label':'أيقونة المادة' },
    SUBJ_ICONS.map(g => {
      const b = el('button', { class:'ad-ico', type:'button', role:'radio', 'data-ico':g,
        'aria-checked': g === icon ? 'true' : 'false', text:g });
      b.addEventListener('click', () => {
        icon = g;
        icons.querySelectorAll('.ad-ico').forEach(x =>
          x.setAttribute('aria-checked', x.getAttribute('data-ico') === g ? 'true' : 'false'));
      });
      return b;
    }));

  /*
    ★ السعر — حقلٌ كان ناقصًا تمامًا.
    العمود في القاعدة منذ البداية، والبوابةُ تقرؤه وتعرضه للطالب، ولا شاشة
    واحدة في المنصة تضبطه. فكل مادة مدفوعة كانت تأخذ سعرها من قيمةٍ كُتبت
    عند الاستيراد ولا سبيل إلى تغييرها إلا بـSQL. ميزةٌ نصفُها مبنيّ: تعمل
    آليّتها ولا يملك أحدٌ مفتاحها.

    والصفر يعني «مجانية» — فالسعر والمجانية وجهان لرقمٍ واحد، ولا نجعلهما
    إعدادين متناقضين يسأل المشرف أيهما يغلب.
  */
  const priceIn = el('input', { class:'input num', type:'number', min:'0', max:'999', step:'1',
    inputmode:'numeric', value: String(sub.price == null ? 0 : sub.price),
    'aria-label':'سعر المادة بالريال' });
  const priceHint = el('p', { class:'field__hint', style:'margin:4px 0 0' });
  const paintPrice = () => {
    const v = parseInt(priceIn.value || '0', 10) || 0;
    priceHint.textContent = v > 0
      ? 'يدفع الطالب ' + QBANK.views.arNum(v) + ' ريالًا لفتحها.'
      : 'صفر = مجانية للجميع.';
  };
  priceIn.addEventListener('input', paintPrice);
  paintPrice();

  const save = el('button', { class:'btn', type:'button', text:'احفظ الهوية' });
  save.addEventListener('click', async () => {
    /* السعر يُقصّ إلى نطاقٍ معقول قبل الحفظ: حقلُ رقمٍ في متصفح يقبل
       أي شيء، والقيمة السالبة أو الخيالية تُفسد البوابة لا الحقل. */
    const price = Math.max(0, Math.min(999, parseInt(priceIn.value || '0', 10) || 0));
    priceIn.value = String(price); paintPrice();
    const r = await SubjEditor.patchSubject(sub.id, {
      name: nameIn.value.trim() || sub.name, descr: descrIn.value, color, icon,
      ord: parseInt(ordIn.value || '0', 10), exam_date: dateIn.value || null,
      price: price,
      /* والمجانية تتبع السعر لا تناقضه: صفرٌ يعني مجانية، وأكثرُ منه مدفوعة */
      free: price === 0
    });
    QBANK.toast(r.ok ? 'حُفظت هوية المادة' : 'تعذّر الحفظ');
    if (r.ok && refresh) refresh();
  });

  const pub = el('button', { class:'btn btn--sm ' + (sub.published ? 'btn--soft' : ''), type:'button',
    text: sub.published ? 'منشورة — أخفِها' : 'مخفية — انشرها' });
  pub.addEventListener('click', async () => {
    const r = await SubjEditor.patchSubject(sub.id, { published: !sub.published });
    QBANK.toast(r.ok ? (sub.published ? 'أُخفيت المادة' : 'نُشرت المادة') : 'تعذّر التعديل');
    if (r.ok && refresh) refresh();
  });
  /* ★ الزرّ يضبط الرقم لا وسمًا بجانبه: كانا إعدادين مستقلّين، فمادةٌ
     «مجانية» بسعر ٢٩ تخرج لصاحبها بلا أن يعرف أيّهما يغلب. */
  const free = el('button', { class:'btn btn--sm btn--ghost', type:'button',
    text: sub.free ? '★ مجانية للتجربة' : 'اجعلها مجانية' });
  free.addEventListener('click', async () => {
    /* والوسم يجرّ السعر معه: مجانيةٌ بسعر ٢٩ تناقضٌ يراه الطالب في مكانين
       مختلفين. ورفعُ المجانية يعيد السعر الافتراضي لا يتركه صفرًا. */
    const goFree = !sub.free;
    const r = await SubjEditor.patchSubject(sub.id, {
      free: goFree,
      price: goFree ? 0 : (Number(sub.price) > 0 ? sub.price : 29)
    });
    QBANK.toast(r.ok ? (goFree ? 'صارت مجانية' : 'صارت مدفوعة') : 'تعذّر التعديل');
    if (r.ok && refresh) refresh();
  });


  /*
    ★ التوثيق قرار إنسان لا نتيجة حساب.
    لو مُنح تلقائيًا بعدد تقييمات لصار وسمًا يُشترى بحسابات وهمية. فالمشرف
    يفتح المادة، يقرأ عيّنة منها، ثم يسمها بيده — والوسم يقول للطالب:
    «نظر فيها إنسان» لا «أعجبت كثيرين».
  */
  const verify = el('button', { class:'btn btn--sm ' + (sub.verified ? 'btn--soft' : 'btn--ghost'), type:'button',
    text: sub.verified ? '✓ موثّقة — أزل التوثيق' : 'وثّق هذه المادة' });
  verify.addEventListener('click', async () => {
    // ★ تحذير لا منع: البلاغ قد يكون خاطئًا، لكن توثيق مادة عليها بلاغ مفتوح
    //   يمنح خطأً محتملًا ختمَ المراجعة — وهو أسوأ ما تفعله طبقة الثقة بنفسها.
    if (!sub.verified && Number(sub.reports_open) > 0 &&
        !confirm('على هذه المادة ' + sub.reports_open + ' بلاغًا مفتوحًا لم يُبتّ فيه.\nتوثيقها الآن يمنح خطأً محتملًا ختمَ المراجعة. أتريد المتابعة؟'))
      return;
    verify.disabled = true;
    const r = await QBANK.api.rpc('set_verified', { p_subject: sub.id, p_on: !sub.verified });
    verify.disabled = false;
    const ok = r.ok && r.data && r.data.ok !== false;
    QBANK.toast(ok ? (sub.verified ? 'أُزيل التوثيق' : 'وُثّقت المادة') : 'تعذّر — تأكد من صلاحيتك');
    if (ok) refresh();
  });

  return el('div', { class:'ad-panel' }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:'هوية المادة' }),
      el('span', { class:'ad-panel__s', text: sub.q_count + ' سؤالًا' }),
      sub.verified ? el('span', { class:'badge badge--ok', text:'✓ موثّقة' }) : null,
      Number(sub.rating_n) > 0 && QBANK.trust
        ? el('span', { class:'badge badge--star num', text: QBANK.trust.starsText(sub.rating_avg, sub.rating_n) })
        : null
    ]),
    el('div', { class:'ad-edit ad-edit--2' }, [
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الاسم' }), nameIn ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'موعد الاختبار' }), dateIn ]),
      el('label', { class:'field', style:'margin:0;grid-column:1/-1' }, [ el('span', { class:'field__label', text:'الوصف — يظهر للطالب على البطاقة' }), descrIn ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'اللون' }), swatches ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الأيقونة' }), icons ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الترتيب' }), ordIn ]),
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'السعر بالريال' }), priceIn, priceHint ])
    ]),
    el('div', { class:'ad-bar', style:'margin:16px 0 0' }, [ save, pub, free, verify ]),
    /* بابٌ من المادة إلى بلاغاتها: المشرف الذي يفتحها ليوثّقها يرى أولًا ما عليها */
    Number(sub.reports_open) > 0
      ? el('a', { class:'ad-warn', href:'#/admin/reports' }, [
          el('span', { text:'⚑ عليها ' + QBANK.views.arNum(sub.reports_open) +
            (Number(sub.reports_open) === 1 ? ' بلاغ مفتوح' : ' بلاغات مفتوحة') }),
          el('span', { class:'ad-warn__go', text:'افتح الطابور ←' })
        ])
      : null
  ]);
}

/* ===== المحاور ===== */
function subjTopics(sub, questions, refresh){
  const topics = Array.isArray(sub.topics) ? sub.topics.slice() : [];
  // العدّ من الأسئلة نفسها: يكشف محورًا مكتوبًا في القائمة وليس عليه سؤال واحد
  const counts = {};
  questions.forEach(q => { const t = q.topic || ''; if (t) counts[t] = (counts[t] || 0) + 1; });
  Object.keys(counts).forEach(t => { if (topics.indexOf(t) === -1) topics.push(t); });

  const list = el('div', { class:'stack' });
  function draw(){
    list.innerHTML = '';
    if (!topics.length) { list.appendChild(el('p', { class:'page__sub', text:'لا محاور بعد.' })); return; }
    topics.forEach((t, i) => {
      const up = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'↑', 'aria-label':'أعلِ ' + t });
      up.addEventListener('click', () => { if (i > 0){ topics.splice(i-1, 0, topics.splice(i,1)[0]); draw(); } });
      const del = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'✕', 'aria-label':'احذف ' + t });
      del.addEventListener('click', () => {
        if (counts[t]) return QBANK.toast('لا يُحذف محور عليه ' + counts[t] + ' سؤالًا — انقلها أولًا');
        topics.splice(i, 1); draw();
      });
      list.appendChild(el('div', { class:'row' }, [
        el('span', { text: t }),
        el('span', { class:'badge num', text: (counts[t] || 0) + ' سؤالًا' }),
        el('span', { class:'spacer' }), up, del
      ]));
    });
  }
  draw();

  const addIn = el('input', { class:'input', placeholder:'اسم محور جديد' });
  const add = el('button', { class:'btn btn--sm', type:'button', text:'أضف' });
  add.addEventListener('click', () => {
    const v = addIn.value.trim();
    if (!v) return;
    if (topics.indexOf(v) !== -1) return QBANK.toast('المحور موجود');
    topics.push(v); addIn.value = ''; draw();
  });
  const save = el('button', { class:'btn', type:'button', text:'احفظ المحاور' });
  save.addEventListener('click', async () => {
    const r = await SubjEditor.patchSubject(sub.id, { topics });
    QBANK.toast(r.ok ? 'حُفظت المحاور' : 'تعذّر الحفظ');
    if (r.ok && refresh) refresh();
  });

  return el('div', { class:'ad-panel' }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:'المحاور' }),
      el('span', { class:'ad-panel__s', text:'ترتيبها هنا هو ترتيب عرضها للطالب' })
    ]),
    list,
    el('div', { class:'ad-bar', style:'margin:16px 0 0' }, [ addIn, add, save ])
  ]);
}

/* ===== بطاقة سؤال واحد ===== */
function qCard(q, sub, refresh){
  const box = el('div', { class:'ad-q', 'data-qid': q.id });
  const head = el('div', { class:'ad-q__head' }, [
    el('span', { class:'badge num', text:'#' + (q.ord + 1) }),
    q.topic ? el('span', { class:'badge', text: q.topic }) : null,
    q.derived ? el('span', { class:'badge badge--warn', text:'إجابة مستنتجة' }) : null,
    q.opts_built ? el('span', { class:'badge badge--warn', text:'خيارات مبنية' }) : null,
    !q.expl_ar ? el('span', { class:'badge', text:'بلا شرح' }) : null,
    el('span', { class:'spacer' })
  ]);
  const star = el('button', { class:'btn btn--sm btn--ghost', type:'button',
    text: q.important ? '★ مهم' : '☆ علّمه مهمًا', 'aria-pressed': q.important ? 'true' : 'false' });
  star.addEventListener('click', async () => {
    const r = await SubjEditor.patchQuestion(q.id, { important: !q.important });
    if (!r.ok) return QBANK.toast('تعذّر التعديل');
    q.important = !q.important;
    star.textContent = q.important ? '★ مهم' : '☆ علّمه مهمًا';
    star.setAttribute('aria-pressed', q.important ? 'true' : 'false');
  });
  head.appendChild(star);

  const more = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'حرّر' });
  head.appendChild(more);
  box.appendChild(head);

  // النص والخيارات للعرض فقط — لا حقل إدخال عليهما (قاعدة القداسة)
  box.appendChild(el('p', { class:'ad-q__text', text: q.q }));
  const opts = el('div', {});
  (q.options || []).forEach((o, i) => {
    const b = el('button', { class:'ad-q__opt' + (i === q.answer ? ' is-a' : ''), type:'button',
      'data-i': String(i), text: o });
    b.addEventListener('click', async () => {
      if (i === q.answer) return;
      const r = await SubjEditor.patchQuestion(q.id, { answer: i, derived: false });
      if (!r.ok) return QBANK.toast('تعذّر تصحيح الإجابة');
      q.answer = i; q.derived = false;
      opts.querySelectorAll('.ad-q__opt').forEach((x, xi) =>
        x.className = 'ad-q__opt' + (xi === i ? ' is-a' : ''));
      QBANK.toast('صُحّحت الإجابة');
    });
    opts.appendChild(b);
  });
  box.appendChild(opts);

  // لوح التحرير يُبنى عند الطلب لا مع كل سؤال — القائمة قد تحمل مئات البطاقات
  let panel = null;
  more.addEventListener('click', () => {
    if (panel){ panel.remove(); panel = null; more.textContent = 'حرّر'; return; }
    more.textContent = 'أغلِق';
    const topicSel = el('select', { class:'input' });
    const tops = (Array.isArray(sub.topics) ? sub.topics : []).slice();
    if (q.topic && tops.indexOf(q.topic) === -1) tops.push(q.topic);
    topicSel.appendChild(el('option', { value:'', text:'— بلا محور —' }));
    tops.forEach(t => topicSel.appendChild(el('option', { value:t, text:t, selected: t === q.topic ? 'selected' : null })));
    topicSel.value = q.topic || '';

    const ar = el('textarea', { class:'input', rows:'3' }); ar.value = q.expl_ar || '';
    const en = el('textarea', { class:'input', rows:'2' }); en.value = q.expl_en || '';
    const tr = el('textarea', { class:'input', rows:'2' }); tr.value = q.translation || '';
    const m = q.mnemonic || {};
    const cue  = el('input', { class:'input', value: m.cue || '',  placeholder:'الطُّعم' });
    const key  = el('input', { class:'input', value: m.key || '',  placeholder:'المفتاح' });
    const link = el('input', { class:'input', value: m.link || '', placeholder:'الرابط الذهني' });
    const ordQ = el('input', { class:'input', type:'number', value: String(q.ord), 'aria-label':'ترتيب السؤال' });

    const save = el('button', { class:'btn btn--sm', type:'button', text:'احفظ' });
    save.addEventListener('click', async () => {
      const patch = {
        topic: topicSel.value, expl_ar: ar.value, expl_en: en.value, translation: tr.value,
        mnemonic: { cue: cue.value, key: key.value, link: link.value, strike: m.strike || '' },
        ord: parseInt(ordQ.value || String(q.ord), 10)
      };
      /* النص والخيارات يُرفقان فقط إن فُتح بابهما — الإغلاق يعني «لم أقصد» */
      if (textDetails.open){
        const newOpts = optInputs.map(i2 => i2.value);
        if (!String(qTxt.value).trim()) return QBANK.toast('السؤال بلا نص لا يُحفظ');
        if (newOpts.some(o => !String(o).trim())) return QBANK.toast('خيار فارغ — املأه أو احذفه');
        patch.q = qTxt.value; patch.options = newOpts;
        patch.answer = Math.min(q.answer, newOpts.length - 1);
      }
      const r = await SubjEditor.patchQuestion(q.id, patch);
      QBANK.toast(r.ok ? 'حُفظ السؤال' : 'تعذّر الحفظ');
      if (r.ok && refresh) refresh();
    });

    // الحذف بتأكيد صريح: الضغطة الأولى تحوّل الزر، الثانية تنفّذ
    const del = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'احذف السؤال' });
    let armed = false;
    del.addEventListener('click', async () => {
      if (!armed){ armed = true; del.textContent = 'اضغط ثانيةً للحذف نهائيًا'; del.className = 'btn btn--sm btn--danger'; return; }
      const r = await SubjEditor.delQuestion(q.id);
      QBANK.toast(r.ok ? 'حُذف السؤال' : 'تعذّر الحذف');
      if (r.ok){ if (refresh) refresh(); else box.remove(); }
    });

    /*
      ★ تحرير النص والخيارات — باب التأليف الواعي.
      خلف مطوية صريحة لا حقلًا مكشوفًا: تعديل نص الدكتور قرارٌ يُتّخذ لا
      حركةُ سهو. ما يُحفظ هنا يصبح الأصل الذي يذاكر منه كل طالب.
    */
    const qTxt = el('textarea', { class:'input ltr', rows:'3' }); qTxt.value = q.q || '';
    const optWrap = el('div', { class:'stack', style:'gap:6px' });
    const optInputs = [];
    const drawOpts = () => {
      optWrap.innerHTML = ''; optInputs.length = 0;
      (q.options || []).forEach((o, i) => {
        const inp = el('input', { class:'input ltr', value: o, 'aria-label':'الخيار ' + (i + 1) });
        optInputs.push(inp);
        const rm = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'✕', 'aria-label':'احذف الخيار ' + (i + 1) });
        rm.addEventListener('click', () => {
          if ((q.options || []).length <= 2) return QBANK.toast('سؤال بلا خيارين ليس سؤالًا');
          q.options.splice(i, 1);
          if (q.answer >= q.options.length) q.answer = 0;
          drawOpts();
        });
        optWrap.appendChild(el('div', { class:'row', style:'flex-wrap:nowrap' }, [
          el('span', { class:'badge' + (i === q.answer ? ' badge--ok' : ''), text: QBANK.views.optLetter(i) }), inp, rm ]));
      });
      const addOpt = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'+ خيار' });
      addOpt.addEventListener('click', () => { q.options.push(''); drawOpts(); });
      optWrap.appendChild(addOpt);
    };
    const textDetails = el('details', { class:'fold' }, [
      el('summary', { text:'تحرير النص والخيارات — ما تحفظه يصبح الأصل' }),
      el('div', { class:'stack', style:'margin-top:8px' }, [
        el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'نص السؤال' }), qTxt ]),
        el('span', { class:'field__label', text:'الخيارات (احذف وأضف كما تشاء — الإجابة تُختار من العرض أعلاه)' }),
        optWrap
      ])
    ]);
    textDetails.addEventListener('toggle', () => { if (textDetails.open) drawOpts(); });

    panel = el('div', { class:'ad-edit ad-edit--2', style:'margin-top:12px' }, [
      el('div', { style:'grid-column:1/-1' }, [textDetails]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'المحور' }), topicSel ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الترتيب' }), ordQ ]),
      el('label', { class:'field', style:'margin:0;grid-column:1/-1' }, [ el('span', { class:'field__label', text:'الشرح بالعربية' }), ar ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الشرح بالإنجليزية' }), en ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الترجمة' }), tr ]),

/* ===== متصفح الأسئلة ===== */
function subjQuestions(sub, questions, refresh){
  const search = el('input', { class:'input', type:'search', placeholder:'ابحث في نص السؤال أو خياراته…' });
  const topicSel = el('select', { class:'input', 'aria-label':'تصفية بالمحور' });
  topicSel.appendChild(el('option', { value:'', text:'كل المحاور' }));
  const seen = {};
  questions.forEach(q => { if (q.topic && !seen[q.topic]){ seen[q.topic] = 1;
    topicSel.appendChild(el('option', { value:q.topic, text:q.topic })); } });
  const onlySel = el('select', { class:'input', 'aria-label':'تصفية بالحالة' });
  [['','كل الأسئلة'],['important','المهمة فقط'],['derived','إجابة مستنتجة'],['noexpl','بلا شرح']]
    .forEach(o => onlySel.appendChild(el('option', { value:o[0], text:o[1] })));

  const count = el('span', { class:'ad-panel__s' });
  const list = el('div', { class:'stack', style:'margin-top:12px' });
  let shown = 40;   // نرسم دفعة أولى فقط: مادة فيها ٣٠٠ سؤال لا تُرسم كلها على جوال

  function draw(){
    const res = SubjEditor.filter(questions, search.value, topicSel.value, onlySel.value);
    count.textContent = res.length + ' من ' + questions.length + ' سؤالًا';
    list.innerHTML = '';
    res.slice(0, shown).forEach(q => list.appendChild(qCard(q, sub, refresh)));
    if (res.length > shown){
      const more = el('button', { class:'btn btn--block btn--soft', type:'button',
        text:'اعرض ' + Math.min(40, res.length - shown) + ' سؤالًا آخر' });
      more.addEventListener('click', () => { shown += 40; draw(); });
      list.appendChild(more);
    }
    if (!res.length) list.appendChild(QBANK.views.empty('⌕', 'لا نتائج', 'جرّب كلمة أخرى أو أزل التصفية.'));
  }
  [search, topicSel, onlySel].forEach(x =>
    x.addEventListener('input', () => { shown = 40; draw(); }));
  draw();

  /* ★ التأليف اليدوي: سؤال جديد من الصفر يظهر أول القائمة جاهزًا للتحرير */
  const addBtn = el('button', { class:'btn btn--sm', type:'button', text:'+ أضف سؤالًا' });
  addBtn.addEventListener('click', async () => {
    const maxOrd = questions.reduce((n, x) => Math.max(n, x.ord || 0), -1);
    const r = await SubjEditor.addQuestion(sub.id, maxOrd + 1);
    QBANK.toast(r.ok ? 'أُضيف — حرّر نصّه الآن' : 'تعذّرت الإضافة');
    if (r.ok && refresh) refresh();
  });

  return el('div', { class:'ad-panel' }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:'الأسئلة' }), count, el('span', { class:'spacer' }), addBtn
    ]),
    el('p', { class:'page__sub', style:'margin-top:0',
      text:'اضغط خيارًا لتجعله الإجابة الصحيحة. تحرير النص نفسه خلف «حرّر» — بوعي: ما تحفظه يصبح الأصل.' }),
    el('div', { class:'ad-bar' }, [ search, topicSel, onlySel ]),
    list
  ]);
}

/* ===== محرر المحتوى التحليلي — تأليف يدوي فوق ما ولّده الذكاء ===== */
function subjContent(sub, refresh){
  const mk = (label, val, rows) => {
    const t = el('textarea', { class:'input ltr', rows: String(rows || 6), dir:'rtl',
      style:'direction:rtl;text-align:right;font-family:var(--font-num);font-size:.85rem' });
    t.value = val || '';
    return { t, box: el('label', { class:'field', style:'margin:0' }, [
      el('span', { class:'field__label', text: label }), t ]) };
  };
  const ov  = mk('عن المادة (HTML: p, strong, h3, table…)', sub.overview, 7);
  const mem = mk('طريقة الحفظ', sub.memorize, 10);
  const mis = mk('الأخطاء الشائعة', sub.mistakes, 7);

  const prev = el('div', { class:'card', hidden:true });
  const prevBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'عاين' });
  prevBtn.addEventListener('click', () => {
    prev.hidden = !prev.hidden;
    if (!prev.hidden){
      prev.innerHTML = '';
      /* المعاينة بنفس معقّم العرض — ما يمرّ هنا هو ما يصل الطالب حرفيًا */
      prev.appendChild(QBANK.views.analysisHtml(ov.t.value));
      prev.appendChild(QBANK.views.analysisHtml(mem.t.value));
      prev.appendChild(QBANK.views.analysisHtml(mis.t.value));
    }
  });

  const save = el('button', { class:'btn btn--sm', type:'button', text:'احفظ المحتوى' });
  save.addEventListener('click', async () => {
    /*
      ★ analyzed_at تُختم مع الحفظ اليدوي — وإلا بقيت المادة «باطلة»
      فأعاد التوليد التلقائي الكتابة فوق تأليف علي أول ما تُفتح صفحتها.
      الختم يقول للقادح: هذا المحتوى مقصود، لا تلمسه حتى تتغير الأسئلة.
    */
    const r = await SubjEditor.patchSubject(sub.id, {
      overview: ov.t.value, memorize: mem.t.value, mistakes: mis.t.value,
      analyzed_at: new Date().toISOString()
    });
    QBANK.toast(r.ok ? 'حُفظ المحتوى — وهو الآن ما يراه الطالب' : 'تعذّر الحفظ');
    if (r.ok && refresh) refresh();
  });

  const regen = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'⟳ ولّده بالذكاء من جديد' });
  regen.addEventListener('click', async () => {
    if (!QBANK.analysis) return;
    regen.setAttribute('aria-disabled','true'); regen.textContent = '… يولَّد';
    const r = await QBANK.analysis.generate(sub.id, sub.analysis_lang || 'ar');
    regen.removeAttribute('aria-disabled'); regen.textContent = '⟳ ولّده بالذكاء من جديد';
    QBANK.toast(r && r.ok ? 'اكتمل التوليد' : 'تعذّر التوليد');
    if (r && r.ok && refresh) refresh();
  });

  return el('div', { class:'ad-panel' }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:'المحتوى التحليلي' }),
      el('span', { class:'ad-panel__s', text:'ما يظهر في «نظرة عامة» و«طريقة الحفظ» و«الأخطاء الشائعة»' })
    ]),
    el('div', { class:'stack' }, [ ov.box, mem.box, mis.box,
      el('div', { class:'ad-bar', style:'margin:0' }, [ save, prevBtn, el('span', { class:'spacer' }), regen ]),
      prev ])
  ]);
}

*/
const SET = {
  /* وصف الحقول في مكان واحد — الواجهة تُبنى منه، والفحص يقرأه، فلا يفترقان */
  GROUPS: [

      { k:'whatsapp',      t:'text',  label:'رقم واتساب للتواصل', dir:'ltr' }
    ]},
    { id:'exam', title:'افتراضات الاختبار', sub:'يبدأ بها الطالب، وله تغييرها قبل كل اختبار', fields:[
      { k:'exam_count',       t:'num',  label:'عدد الأسئلة', min:1, max:200 },
      { k:'exam_minutes',     t:'num',  label:'المدة بالدقائق', min:1, max:300 },
      { k:'pass_mark',        t:'num',  label:'علامة النجاح ٪', min:0, max:100 },
      { k:'shuffle_q',        t:'bool', label:'خلط ترتيب الأسئلة' },
      { k:'shuffle_opts',     t:'bool', label:'خلط ترتيب الخيارات' },
      { k:'instant_feedback', t:'bool', label:'إظهار الصواب فور الإجابة' }
    ]},
    { id:'access', title:'الوصول والحسابات', sub:'من يدخل، وبكم جهاز، ومتى تُغلق المنصة', fields:[
      { k:'signup_open',   t:'bool', label:'التسجيل مفتوح للطلاب الجدد' },
      { k:'board_enabled', t:'bool', label:'لوحة المتصدرين ظاهرة' },
      { k:'device_limit',  t:'num',  label:'حد الأجهزة لكل حساب', min:1, max:10 },
      { k:'trial_days',    t:'num',  label:'أيام التجربة المجانية', min:0, max:365 },
      { k:'maintenance',   t:'bool', label:'وضع الصيانة — يُوقف دخول الطلاب' },
      { k:'maint_msg',     t:'area', label:'رسالة الصيانة' }
    ]},
    /*
      ★ طريقة الدفع نصٌّ يكتبه المشرف لا شيء نفترضه عنه.
      كلٌّ يقبض بطريقته: تحويل، STC Pay، نقدًا في الكلية. وكتابةُ طريقةٍ
      بعينها في الكود تعني تعديل الكود كلما تغيّر حسابٌ بنكي — وتعني أن
      الطالب يقرأ تعليمات لا تنطبق على أحد.
    */
    { id:'pay', title:'الشراء والتفعيل', sub:'ما يقرؤه الطالب في بطاقة المادة المدفوعة', fields:[
      { k:'pay_note', t:'area', label:'طريقة الدفع — سطر يظهر تحت زر الطلب' }
    ]},
    /*
      ★ «من سعر البيع» و«صافي الربح» مكتوبتان في التسميتين لا في وثيقة.
      الرقمان يبدوان متبادلين وليسا كذلك: أحدهما يُحسب به المال، والآخر
      يُعرض به للرافع. وخلطُهما يعني إما أن تدفع ضعف ما نويت، أو أن تَعِد
      بنصفٍ وتدفع ربعًا.
    */
    { id:'earn', title:'أرباح الرافعين', sub:'نصيب من يرفع المادة، وحدّ التحويل', fields:[
      { k:'uploader_share_pct', t:'num', label:'نصيب الرافع ٪ من سعر البيع', min:0, max:100 },
      { k:'net_margin_pct',     t:'num', label:'صافي ربحك ٪ من سعر البيع (للعرض فقط)', min:1, max:100 },
      { k:'payout_min_halalas', t:'num', label:'أقل مبلغ للتحويل (بالهللات)', min:100, max:1000000 },
      { k:'payouts_open',       t:'bool', label:'طلبات التحويل مفتوحة' }
    ]}
  ],

  /* لا نُرسل إلا ما تغيّر فعلًا: أقل حمولة، وأثر أوضح في سجل القاعدة */
  diff(before, after){
    const out = {};
    Object.keys(after).forEach(k => { if (after[k] !== before[k]) out[k] = after[k]; });
    return out;
  },
  /* الأرقام تُقصّ إلى مداها قبل الإرسال — القاعدة سترفض الخارج، ونحن نمنع الرحلة أصلًا */
  clamp(v, min, max){
    const n = parseInt(v, 10);
    if (isNaN(n)) return min;
    return Math.min(max, Math.max(min, n));
  }
};

function setField(f, value, onChange){
  if (f.t === 'bool'){
    let on = !!value;
    const b = el('button', { class:'btn btn--sm ' + (on ? '' : 'btn--ghost'), type:'button',
      role:'switch', 'data-k':f.k, 'aria-checked': on ? 'true' : 'false',
      text: (on ? '✓ ' : '') + f.label });
    b.addEventListener('click', () => {
      on = !on;
      b.className = 'btn btn--sm ' + (on ? '' : 'btn--ghost');
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.textContent = (on ? '✓ ' : '') + f.label;
      onChange(f.k, on);
    });
    return b;
  }
  let inp;
  if (f.t === 'area'){ inp = el('textarea', { class:'input', rows:'2', 'data-k':f.k }); inp.value = value || ''; }
  else if (f.t === 'num'){
    inp = el('input', { class:'input', type:'number', 'data-k':f.k,
      min:String(f.min), max:String(f.max), value: String(value == null ? f.min : value) });
  } else {
    inp = el('input', { class:'input', type:'text', 'data-k':f.k, dir: f.dir || 'auto', value: value || '' });
  }
  inp.addEventListener('input', () => {
    onChange(f.k, f.t === 'num' ? SET.clamp(inp.value, f.min, f.max) : inp.value);
  });
  return el('label', { class:'field', style:'margin:0' }, [
    el('span', { class:'field__label', text:f.label }), inp
  ]);
}

function setGroup(g, row, refresh){
  const draft = {};
  g.fields.forEach(f => { draft[f.k] = row[f.k]; });
  const save = el('button', { class:'btn', type:'button', text:'احفظ ' + g.title, disabled:true });
  const mark = el('span', { class:'ad-panel__s' });

  function touched(){
    const d = SET.diff(row, draft);
    const n = Object.keys(d).length;
    save.disabled = n === 0;
    mark.textContent = n ? n + ' تغييرًا غير محفوظ' : 'محفوظ';
  }
  touched();

  const body = el('div', { class:'ad-edit ad-edit--2' },
    g.fields.map(f => setField(f, row[f.k], (k, v) => { draft[k] = v; touched(); })));

  save.addEventListener('click', async () => {
    const d = SET.diff(row, draft);
    if (!Object.keys(d).length) return;
    const r = await QBANK.api.rest('settings?id=eq.1', { method:'PATCH', body: JSON.stringify(d) });
    QBANK.toast(r.ok ? 'حُفظت ' + g.title : 'تعذّر الحفظ');
    if (r.ok && refresh) refresh();
  });

  return el('section', { class:'ad-panel', 'data-group':g.id }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:g.title }), mark
    ]),
    el('p', { class:'page__sub', style:'margin-top:0', text:g.sub }),
    body,
    el('div', { class:'ad-bar', style:'margin:16px 0 0' }, [ save ])
  ]);
}

function setHealth(){

    }
    const h = r.data;
    const ITEMS = [
      ['bad_answer',  'إجابة خارج نطاق الخيارات', 'bad'],
      ['no_expl',     'سؤالًا بلا شرح',            'warn'],
      ['derived',     'إجابة استنتجها الذكاء',     'warn'],
      ['opts_built',  'سؤالًا خياراته مبنية',      'warn'],
      ['no_topic',    'سؤالًا بلا محور',           'warn'],
      ['empty_subj',  'مادة بلا سؤال واحد',        'warn'],
      ['unpublished', 'مادة غير منشورة',           null]
    ];
    const bad = ITEMS.filter(i => Number(h[i[0]]) > 0);
    if (!bad.length){
      box.appendChild(el('p', { class:'page__sub', text:'✓ لا ملاحظات — المحتوى جاهز للطالب.' }));
      return;
    }
    bad.forEach(i => box.appendChild(el('div', { class:'row' }, [
      el('span', { class:'badge num ' + (i[2] === 'bad' ? 'badge--bad' : i[2] === 'warn' ? 'badge--warn' : ''),

      el('span', { text: i[1] })
    ])));
  });
  return box;
}

/* ===== التصدير ومنطقة الخطر ===== */
function setData(){
  const btn = el('button', { class:'btn', type:'button', text:'صدّر نسخة كاملة (JSON)' });
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'جارٍ التصدير…';

    btn.disabled = false; btn.textContent = 'صدّر نسخة كاملة (JSON)';

/* ===== 45-trial.js ===== */
/*
  تجربة العشر دقائق — مكافأة من يرفع مادته، لا عيّنة مجانية للجميع.

  الوقت يُحسب في الخادم لا هنا: المتصفح يرسل نبضة كل ٣٠ ثانية والقاعدة تجمعها
  وتقصّها عند السقف. لو أغلق الطالب الصفحة أو عبث بالساعة أو فتح خمس ألسنة،
  فالمجموع في القاعدة هو الحكم. العدّاد المعروض تقدير محلي للطمأنة فقط.
*/
const Trial = {
  CAP: 600,          // عشر دقائق — نفس الرقم في qbank.trial_cap()
  BEAT_MS: 30000,    // نبضة كل ٣٠ ثانية: تكفي لدقة نصف دقيقة بلا إغراق الشبكة
  state: null,       // { sid, left, cap, timer, tick, onExpire }

  fmt(sec){
    const s = Math.max(0, Math.round(sec));
    const m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0');
  },

  /*
    سؤال القاعدة: هل يُسمح؟ ولماذا؟
    نُرجع null عند تعذّر الوصول للخادم — لا «ممنوع». انقطاع الشبكة ليس دليل
    عدم أحقية، ولو أغلقنا المادة عند كل تعثّر لحُرم طالب دفع ثمنها من مذاكرته
    في الطائرة. القاعدة تحرس القراءة الفعلية للأسئلة على كل حال.
  */
  async access(sid){
    const r = await QBANK.api.rpc('subject_access', { sid });
    if (r && r.ok && r.data && !r.data.error) return r.data;
    return null;
  },

  stop(){
    if (!Trial.state) return;
    clearInterval(Trial.state.timer);
    clearInterval(Trial.state.tick);
    Trial.state = null;
  },

  /* يبدأ العدّ ويُرجع الشريط الجاهز للإلحاق */
  start(sid, secondsLeft, onExpire){
    Trial.stop();
    const bar = el('div', { class:'trialbar', role:'status', 'aria-live':'polite' });
    const label = el('span', { class:'trialbar__t' });
    const meter = el('span', { class:'trialbar__m' }, [ el('span', { class:'trialbar__f' }) ]);
    const buy = el('button', { class:'btn btn--sm', type:'button', text:'اشترِ الآن' });
    buy.addEventListener('click', () => { if (onExpire) onExpire('buy'); });
    bar.appendChild(el('span', { class:'trialbar__ico', 'aria-hidden':'true', text:'◷' }));
    bar.appendChild(label); bar.appendChild(meter); bar.appendChild(buy);

    const st = { sid, left: secondsLeft, cap: Trial.CAP, onExpire, bar };
    Trial.state = st;

    function paint(){
      const pct = Math.max(0, Math.min(100, st.left / st.cap * 100));
      label.textContent = 'تجربتك: ' + Trial.fmt(st.left) + ' متبقية';
      meter.firstChild.style.width = pct.toFixed(1) + '%';
      // آخر دقيقتين بلون التحذير — الطالب يستحق إنذارًا قبل القفل لا مفاجأة
      bar.className = 'trialbar' + (st.left <= 120 ? ' is-low' : '');
    }
    paint();

    // عدّاد العرض كل ثانية — تقدير محلي، والحقيقة تأتي مع كل نبضة
    st.tick = setInterval(() => {
      if (!bar.isConnected) return Trial.stop();
      st.left = Math.max(0, st.left - 1);
      paint();
      if (st.left <= 0){ Trial.stop(); if (onExpire) onExpire('expired'); }
    }, 1000);

    st.timer = setInterval(async () => {
      if (!bar.isConnected) return Trial.stop();
      const r = await QBANK.api.rpc('rpc_record_trial_heartbeat',
        { subject_id: sid, interval_seconds: Trial.BEAT_MS / 1000 });
      if (!r.ok || !r.data || r.data.error) return;      // انقطاع مؤقت: العدّاد المحلي يكمل
      const d = r.data;
      if (d.eligible === false){ Trial.stop(); if (onExpire) onExpire('ineligible'); return; }
      st.left = Number(d.seconds_left);                  // الخادم هو الحكم — نصحّح المحلي منه
      paint();
      if (d.expired){ Trial.stop(); if (onExpire) onExpire('expired'); }
    }, Trial.BEAT_MS);

    return bar;
  },

  /*
    شاشة انتهاء التجربة — تفتح الشراء لا تتركه في فراغ.
    ★ وتحمل طرق الفتح نفسها التي تحملها بطاقة القفل. طالبٌ أنفق عشر دقائق
    في المادة هو أقربُ الناس إلى الدفع، ولا يليق أن يكون طريقه أضيق من
    طريق من لم يفتحها بعد.
  */
  expiredCard(sub){
    const kids = [
      el('span', { class:'empty__ico', 'aria-hidden':'true', text:'◷' }),
      el('p', { class:'empty__title', text:'انتهت تجربتك المجانية' }),
      el('p', { class:'empty__text',
        text:'استفدت من عشر دقائق كاملة في «' + sub.name + '». افتحها الآن حتى نهاية الفصل.' }),
      QBANK.gate.buyButton(sub)
    ];
    const C = QBANK.codes;
    if (C){
      kids.push(QBANK.views.redeemBox(QBANK.gate.reopen));
      const s = C.support();
      if (!C.isApp() && s.wa)
        kids.push(el('a', { class:'btn btn--ghost btn--block', target:'_blank',
          rel:'noopener', href: C.askUrl(sub), text:'اطلب رمزًا من المشرف' }));
    }
    return el('div', { class:'card', style:'text-align:center' }, kids);
  }
};
QBANK.trial = Trial;


/* ===== 46-share.js ===== */
/*
  رابط المشاركة القصير: #s/slug?ref=USER_ID

  الموجّه يجرّد «#» و«/» الأولى معًا، فمسار واحد مسجَّل باسم '#/s' يلتقط
  الصيغتين: #s/slug و #/s/slug — ويبقى الرابط قصيرًا كما يُشارَك في الواتساب.

  هذه الشاشة تعريفية لا محتوى فيها: من وصل عبر رابط زميله يرى ما في المادة
  وسعرها وزر الشراء، ولا يُحتسب له رصيد تجربة.
*/
function shareUrl(slug, userId){
  /*
    ★ typeof location !== 'undefined' لا يكفي.
    الوصف موجود دائمًا، والذي يفشل هو القراءة منه: بعد تفكيك المستند
    (إغلاق تبويب، أو صفحة أُخليت وطلبٌ غير متزامن ما زال يعود) يرمي
    الوصفُ استثناءً فينهار كل ما بُني في تلك اللحظة. try هو الحارس الوحيد
    الذي يمسك هذا، وليس فحص الوجود.
  */
  let base = 'https://amsuq.alsoqoor.com/';
  try {
    if (typeof location !== 'undefined' && location.protocol.indexOf('http') === 0)
      base = location.origin + location.pathname;
  } catch(e){ /* مستند مفكَّك — نبقى على العنوان الثابت */ }
  return base + '#s/' + slug + (userId ? '?ref=' + userId : '');
}

function copyRow(url){
  const inp = el('input', { class:'input', dir:'ltr', readonly:'', value:url, 'aria-label':'رابط المادة' });
  const btn = el('button', { class:'btn btn--sm', type:'button', text:'انسخ الرابط' });
  btn.addEventListener('click', () => {
    inp.select();
    // clipboard API قد يُمنع على file:// أو بلا https — execCommand احتياطًا لا مكتبة
    const done = (navigator.clipboard && navigator.clipboard.writeText)
      ? (navigator.clipboard.writeText(url), true)
      : (function(){ try { return document.execCommand('copy'); } catch(e){ return false; } })();
    QBANK.toast(done ? 'نُسخ الرابط' : 'انسخه يدويًا من الحقل');
  });
  return el('div', { class:'sharebox' }, [ inp, btn ]);
}

/* ═══════════════════════════════════════════════════════════════════
   زرّ نشرٍ واحد لكل شيء
   ═══════════════════════════════════════════════════════════════════
   كان النشر مقصورًا على المادة، وبصيغةٍ واحدة: حقلٌ ونسخ. وهذا يفترض أن
   الطالب سينسخ ثم يفتح واتساب ثم يلصق — ثلاث خطوات يسقط في كل واحدة منها
   بعضُهم. ونافذة النظام تفعلها بضغطة واحدة وتعرض عليه تطبيقاته كلها.

   ولأن كل شيء في المنصة يستحق أن يُرسَل — مادة، ملف طالب، جامعة، تحدٍّ —
   جعلناه مكوّنًا واحدًا يقبل أي رابط. الميزة التي تُبنى مرةً وتُستعمل في
   عشرة مواضع خيرٌ من عشر نسخ تتباعد مع الوقت.
*/

/* رابطٌ مطلق لأي مسار داخلي: الروابط النسبية لا تُرسَل */
function absUrl(hash){
  let base = 'https://amsuq.alsoqoor.com/';
  try {
    if (typeof location !== 'undefined' && location.protocol.indexOf('http') === 0)
      base = location.origin + location.pathname;
  } catch(e){ /* مستند مفكَّك */ }
  return base + String(hash || '#/').replace(/^#?\/?/, '#/');
}

/* روابط الأشياء التي تُنشَر — في موضع واحد كي لا تتفرّق صيغها */
function profileUrl(userId){ return absUrl('#/p/' + userId); }
function universityUrl(uniId){ return absUrl('#/u/' + uniId); }

/*
  المشاركة نفسها. نافذة النظام أولًا لأنها الأقصر وتعرض تطبيقاته كلها،
  ثم الحافظة. ولا نَعِد بما لا نملك: navigator.share غائب على أغلب
  متصفحات سطح المكتب، فنسأل عنه ولا نفترضه.
*/
async function sharePlain(url, title, text){
  try {
    if (navigator.share) {
      await navigator.share({ title: title || 'مراجعة', text: text || '', url: url });
      return { ok:true, via:'share' };
    }
  } catch(e){ return { ok:false, cancelled:true }; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(url);
      return { ok:true, via:'copy' };
    }
  } catch(e){}
  return { ok:false };
}

/*
  زرّ النشر. opts: { url, title, text, label, block }
  والواتساب بجانبه دائمًا: هو حيث تعيش مجموعات الدفعة فعلًا، ولا يُعتمد
  فيه على دعم المتصفح لشيء — رابط ويب صريح يعمل في كل مكان.
*/
function shareButton(opts){
  const o = opts || {};
  const url = o.url || absUrl('#/');
  const label = o.label || '⤴ انشر الرابط';

  const b = el('button', { class:'btn btn--soft btn--sm' + (o.block ? ' btn--block' : ''),
                           type:'button', text: label });
  b.addEventListener('click', async () => {
    const r = await sharePlain(url, o.title, o.text);
    if (r.ok && r.via === 'copy') QBANK.toast('نُسخ الرابط — الصقه حيث شئت');
    else if (!r.ok && !r.cancelled) QBANK.toast('انسخ الرابط من الحقل أدناه');
  });

  const wa = el('a', { class:'btn btn--ghost btn--sm' + (o.block ? ' btn--block' : ''),
    href: 'https://wa.me/?text=' + encodeURIComponent((o.text ? o.text + ' — ' : '') + url),
    target:'_blank', rel:'noopener noreferrer', text:'واتساب' });

  return el('div', { class:'row sharerow' }, [ b, wa ]);
}

/* الصندوق الكامل: الزرّان ثم الرابط للنسخ اليدوي — لمن يريد أن يراه */
function shareBox(opts){
  const o = opts || {};
  return el('div', { class:'stack' }, [
    o.title ? el('p', { class:'field__label', text: o.title }) : null,
    shareButton(o),
    copyRow(o.url)
  ]);
}

/*

function ugcRow(u, refresh){
  const priceIn = el('input', { class:'input input--sm', type:'number', min:'0', max:'5000',
    value: String(u.price || 0), 'aria-label':'سعر ' + u.name, style:'max-width:110px' });
  const savePrice = el('button', { class:'btn btn--sm', type:'button', text:'احفظ السعر' });
  savePrice.addEventListener('click', async () => {
    const v = Math.min(5000, Math.max(0, parseInt(priceIn.value || '0', 10) || 0));
    priceIn.value = String(v);
    const r = await QBANK.api.rest('subjects?id=eq.' + u.id,
      { method:'PATCH', body: JSON.stringify({ price: v }) });
    QBANK.toast(r.ok ? 'حُفظ السعر' : 'تعذّر الحفظ');
  });

  const on = u.status === 'published';
  const susp = el('button', { class:'btn btn--sm ' + (on ? 'btn--ghost' : ''), type:'button',
    text: on ? 'أوقف المادة' : 'أعِد تفعيلها' });
  susp.addEventListener('click', async () => {
    const r = await QBANK.api.rest('subjects?id=eq.' + u.id,
      { method:'PATCH', body: JSON.stringify({ status: on ? 'suspended' : 'published' }) });
    QBANK.toast(r.ok ? (on ? 'أُوقفت المادة' : 'أُعيد تفعيلها') : 'تعذّر التعديل');
    if (r.ok && refresh) refresh();
  });

  // الحذف بتأكيدين — يمحو المادة وأسئلتها بالتتابع (on delete cascade)
  const del = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'احذف' });
  let armed = false;
  del.addEventListener('click', async () => {
    if (!armed){ armed = true; del.textContent = 'اضغط ثانيةً — حذف نهائي'; del.className = 'btn btn--sm btn--danger'; return; }
    const r = await QBANK.api.rest('subjects?id=eq.' + u.id, { method:'DELETE' });
    QBANK.toast(r.ok ? 'حُذفت المادة' : 'تعذّر الحذف');
    if (r.ok && refresh) refresh();
  });

  return el('div', { class:'card stack' }, [
    el('div', { class:'row' }, [
      el('span', { class:'ad-row__main' }, [
        el('span', { class:'ad-row__t', text: u.name }),
        el('span', { class:'ad-row__s', text:'رفعها ' + u.creator_name + ' · ' + (u.q_count || 0) + ' سؤالًا' })
      ]),
      el('span', { class:'modetag modetag--' + (u.sanctity_mode || 'strict'),
        text: u.sanctity_mode === 'enhanced' ? 'صياغة محسَّنة' : 'نص حرفي' }),
      on ? el('span', { class:'badge badge--ok', text:'فعّالة' })
         : el('span', { class:'badge badge--bad', text:'موقوفة' })
    ]),
    el('div', { class:'row' }, [
      el('span', { class:'badge num', text: u.sales + ' بيعة' }),
      el('span', { class:'badge num', text: u.coins + ' كوين' }),
      el('span', { class:'badge num', text: u.attempts + ' اختبار' }),
      u.slug ? el('a', { class:'badge', href:'#s/' + u.slug, text:'الرابط' }) : null
    ]),
    el('div', { class:'ad-bar', style:'margin:0' }, [
      priceIn, savePrice,
      el('a', { class:'btn btn--sm btn--soft', href:'#/admin/subject/' + u.id, text:'حرّر' }),
      el('span', { class:'spacer' }), susp, del

          'تأكد أن حسابك مشرف وأن ملف UGC-COINS.sql مُشغَّل على القاعدة.'));
        return;
      }

/* ===== 48-cost.js ===== */
/*
  حاسبة التكلفة — كم سيكلّف إثراء هذا الملف، قبل تشغيله لا بعده.

  لماذا في الواجهة؟ لأن المشرف اليوم يضغط «شغّل الذكاء» وهو لا يعرف إن كان
  سيدفع ريالًا أو عشرين. الرقم المعروض تقدير مبني على أسعار معلنة وعلى متوسط
  أرصدناه من ملفات حقيقية — ويظهر بعده الاستهلاك الفعلي الذي يبلّغ به الخادم،
  فيصحّح المشرف تقديره بنفسه مع الوقت.
*/
const AI_PRICES = {
  // دولار لكل مليون رمز — من صفحة أسعار Anthropic
  'claude-haiku-4-5':  { in: 1,  out: 5,  label: 'Haiku 4.5' },
  'claude-sonnet-5':   { in: 2,  out: 10, label: 'Sonnet 5' },
  'claude-sonnet-4-5': { in: 3,  out: 15, label: 'Sonnet 4.5' },
  'claude-opus-5':     { in: 5,  out: 25, label: 'Opus 5' }
};
const AI_DEFAULT = 'claude-haiku-4-5';

/*
  متوسطات لكل سؤال. مبنية على ملفات AMSU الحقيقية:
  سؤال بخياراته ≈ ١٥٠ رمز دخلًا، والإخراج (شرح عربي + ترجمة + بطاقة حفظ + محور)
  ≈ ٣٥٠ رمزًا. السؤال بلا خيارات يخرج أكثر لأن الذكاء يبني له ثلاثة مشتتات.
*/
const TOK_IN = 150, TOK_OUT = 350, TOK_OUT_BUILT = 470;
const SYS_TOKENS = 420;            // تعليمات النظام، تُرسل مرة لكل دفعة
const USD_SAR = 3.75;              // الريال مربوط بالدولار — سعر ثابت لا يتغيّر

function estimateCost(opts){
  const n = Math.max(0, opts.questions || 0);
  const built = Math.max(0, Math.min(opts.withoutOptions || 0, n));
  const batch = Math.max(1, opts.batchSize || 40);
  const p = AI_PRICES[opts.model || AI_DEFAULT] || AI_PRICES[AI_DEFAULT];
  const batches = Math.ceil(n / batch) || 0;

  const inQ  = n * TOK_IN;
  const outQ = (n - built) * TOK_OUT + built * TOK_OUT_BUILT;

  /*
    التعليمات: الدفعة الأولى كتابة ذاكرة (‎1.25x‎) والباقي قراءة (‎0.1x‎).
    بلا تخزين كانت تُحسب كاملة مع كل دفعة — والفرق يكبر مع كبر الملف.
  */
  const sysFirst = batches ? SYS_TOKENS * 1.25 : 0;
  const sysRest  = batches > 1 ? SYS_TOKENS * 0.1 * (batches - 1) : 0;
  const sysNoCache = batches * SYS_TOKENS;

  const usd = ((inQ + sysFirst + sysRest) * p.in + outQ * p.out) / 1e6;
  const usdNoCache = ((inQ + sysNoCache) * p.in + outQ * p.out) / 1e6;

  return {
    model: p.label, batches,
    usd, sar: usd * USD_SAR,
    saved: Math.max(0, usdNoCache - usd),          // ما وفّره التخزين المؤقت
    tokensIn: Math.round(inQ + sysFirst + sysRest),
    tokensOut: outQ
  };
}

/* مقارنة النماذج — يرى المشرف ثمن اختياره بدل أن يخمّنه */
function compareModels(opts){
  return Object.keys(AI_PRICES).map(k => {
    const c = estimateCost(Object.assign({}, opts, { model: k }));
    return { id: k, label: c.model, usd: c.usd, sar: c.sar };
  }).sort((a, b) => a.usd - b.usd);
}

/* عرض المبلغ: الريال أولًا لأنه عملة الطالب، والدولار بين قوسين للمرجع */
function money(c){
  const sar = c.sar < 1 ? c.sar.toFixed(2) : c.sar.toFixed(1);
  return sar + ' ريال (' + (c.usd < 1 ? '$' + c.usd.toFixed(3) : '$' + c.usd.toFixed(2)) + ')';
}

QBANK.cost = { estimate: estimateCost, compare: compareModels, money,
               prices: AI_PRICES, DEFAULT: AI_DEFAULT };


/* ===== 49-formats.js ===== */
/*
  دليل التنسيق — ما يفهمه المقسّم، وقوالب جاهزة، وفاحص فوري في المتصفح.

  لماذا فاحص في المتصفح والمقسّم في الخادم؟
  لأن الطالب يكتشف اليوم أن ملفه غير مفهوم بعد أن يرفعه وينتظر ويدفع من رصيد
  الذكاء. الفاحص هنا يخبره في نفس اللحظة: «وجدنا ١٢ سؤالًا، ٨ منها بخيارات».
  فيصلح ملفه قبل أن يكلّف نفسه أو المنصة شيئًا.

  التعابير أدناه نسخة حرفية من api/_lib/parser.js، وفحص آلي يقارن مصدرها
  بمصدر الخادم في كل بناء — فلو تغيّر أحدهما وحده انكسر الفحص قبل النشر.
*/
/* ★ نسخةٌ حرفية من تعابير الخادم (api/_lib/parser.js) — وفحصٌ يحرس تطابقها.
   فاحصُ التنسيق يعد الطالبَ بما سيحدث عند الرفع، فإن اختلفت النسختان صار
   وعدًا كاذبًا: يُقال له «١٢ سؤالًا» ثم يرفع فيجد صفرًا. */
const FMT_Q_START   = /^\s*(?:Q|س|السؤال|سؤال)?\s*\.?\s*([\d٠-٩]{1,3})\s*[).\-:]\s+/i;
const FMT_OPT_START = /^\s*(هـ|[A-Ea-e]|[أابجده])\s*[).\-]\s+/;
const FMT_ANS_LINE  = /^\s*(?:ANSWER|ANS|KEY|CORRECT|الاجابة|الإجابة|الجواب|الحل|الصحيح)\s*(?:الصحيحة?|الصحيح)?\s*(?:هي|هو)?\s*[:\-.]?\s*(هـ|[A-Ea-e]|[أابجده])(?=\s|$|[).,،])/i;

/* فحص سريع: كم سؤالًا سيُستخرج من هذا النص؟ */
function formatCheck(text){
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  let questions = 0, withOptions = 0, withAnswer = 0;
  let curOpts = 0, curAns = false, open = false;

  const closeOne = () => {
    if (!open) return;
    questions++;
    if (curOpts >= 2) withOptions++;
    if (curAns || curOpts < 2) withAnswer++;   // إجابة معلنة، أو الشكل «سؤال ثم إجابة»
    curOpts = 0; curAns = false;
  };

  lines.forEach(line => {
    if (FMT_Q_START.test(line)) { closeOne(); open = true; return; }
    if (!open) return;
    if (FMT_ANS_LINE.test(line)) { curAns = true; return; }
    if (FMT_OPT_START.test(line)) { curOpts++; }
  });
  closeOne();

  return { questions, withOptions, withAnswer, ok: questions > 0 };
}

/*
  القالبان. كل واحد مأخوذ من ملفات حقيقية ومُختبَر على المقسّم نفسه:
  فحص آلي يمرّرهما على parser ويتأكد من عدد الأسئلة ومواضع الإجابات.

/* ===== 50-explore.js ===== */
/*
  الاستكشاف — الشاشة التي تجعل المنصة عربية لا جامعية.

  كل شيء هنا يحدث في الخادم: البحث والتصفية والترتيب والترقيم. السبب أن
  جلب كل المواد ثم تصفيتها في المتصفح يعمل مع خمس مواد وينهار مع خمسة آلاف،
  ويستهلك باقة الطالب في شيء لن يقرأه.

  والحالة كلها في الرابط (#/explore?q=…&country=…): يشاركه الطالب مع زميله
  فيفتح نفس النتيجة، ويرجع بزرّ الرجوع فيجد ما كان يتصفّح لا الصفحة الأولى.
*/
const COUNTRIES = {
  SA:'السعودية', EG:'مصر', JO:'الأردن', AE:'الإمارات', KW:'الكويت', QA:'قطر',
  BH:'البحرين', OM:'عُمان', IQ:'العراق', MA:'المغرب', DZ:'الجزائر', TN:'تونس',
  SD:'السودان', YE:'اليمن', LY:'ليبيا', SY:'سوريا', LB:'لبنان', PS:'فلسطين'
};
const countryName = c => COUNTRIES[c] || c;

const Explore = {
  PAGE: 24,
  KEY: 'explore_last',      // آخر اختيار للطالب — يعود إليه بلا إعادة ضبط

  /* الحالة من الرابط أولًا، ثم من آخر زيارة، ثم الافتراضي */
  stateFrom(query){
    const saved = QBANK.store.get(Explore.KEY, {}) || {};
    const has = k => query && Object.prototype.hasOwnProperty.call(query, k);
    return {
      q:       has('q')       ? query.q       : '',
      country: has('country') ? query.country : (saved.country || ''),
      uni:     has('uni')     ? query.uni     : (saved.uni || ''),
      col:     has('col')     ? query.col     : (saved.col || ''),
      sort:    has('sort')    ? query.sort    : (saved.sort || 'popular'),
      page:    has('page')    ? Math.max(0, parseInt(query.page, 10) || 0) : 0
    };
  },
  toHash(st){
    const p = [];
    if (st.q)       p.push('q=' + encodeURIComponent(st.q));
    if (st.country) p.push('country=' + st.country);
    if (st.uni)     p.push('uni=' + st.uni);
    if (st.col)     p.push('col=' + st.col);
    if (st.sort && st.sort !== 'popular') p.push('sort=' + st.sort);
    if (st.page)    p.push('page=' + st.page);
    return '#/explore' + (p.length ? '?' + p.join('&') : '');
  },
  remember(st){
    QBANK.store.set(Explore.KEY, { country: st.country, uni: st.uni, col: st.col, sort: st.sort });
  },

  search(st){
    return QBANK.api.rpc('browse_subjects', {
      q: st.q || '', p_country: st.country || '', p_university: st.uni || null,
      p_college: st.col || null, p_sort: st.sort || 'popular',
      p_page: st.page || 0, p_size: Explore.PAGE
    });
  },
  filters(st){
    return QBANK.api.rpc('catalog_filters', {
      p_country: st.country || '', p_university: st.uni || null
    });
  }
};

/* بطاقة مادة في نتائج البحث — تختلف عن بطاقة «موادي»:
   هنا الطالب لا يملكها بعد، فنُظهر أين تُدرَّس وكم سعرها لا تقدّمه فيها */
function exCard(r){

  const card = el('a', { class:'excard', href:'#s/' + (r.slug || '') , 'data-id': r.id }, [
    el('span', { class:'excard__bar', style:'background:' + color, 'aria-hidden':'true' }),
    el('span', { class:'excard__head' }, [
      el('span', { class:'excard__ico', 'aria-hidden':'true', text: r.icon || '▤' }),
      el('span', { class:'excard__t', text: r.name })
    ]),
    r.university ? el('span', { class:'excard__where',
      text: r.university + (r.college ? ' · ' + r.college : '') }) : null,
    r.descr ? el('span', { class:'excard__d', text: r.descr }) : null,
    el('span', { class:'excard__meta' }, [
      el('span', { class:'badge num', text: (r.q_count || 0) + ' سؤالًا' }),
      Number(r.students) > 0 ? el('span', { class:'badge num', text: r.students + ' مشترك' }) : null,
      r.course_code ? el('span', { class:'badge', text: r.course_code }) : null,

    ].concat(QBANK.trust ? QBANK.trust.badges(r) : []))
  ]);
  return card;
}

function ViewExploreRender(route){

    }, 500);

  });

  const filterBox = el('div', { class:'ex-filters' });
  const countEl   = el('p', { class:'page__sub', role:'status' });
  const grid      = el('div', { class:'ex-grid' });
  const pager     = el('div', { class:'ex-pager' });

  /* المرشّحات: شرائح لا قوائم منسدلة — أسرع لمسًا على الجوال، وتُظهر العدد */
  function drawFilters(f){
    filterBox.innerHTML = '';
    const chipRow = (label, items, activeVal, onPick) => {
      if (!items.length) return;
      const row = el('div', { class:'ex-chips', role:'group', 'aria-label':label });
      const all = el('button', { class:'chip' + (!activeVal ? ' is-on' : ''), type:'button',
        text:'الكل', 'aria-pressed': !activeVal ? 'true' : 'false' });
      all.addEventListener('click', () => onPick(''));
      row.appendChild(all);
      items.slice(0, 12).forEach(it => {
        const on = String(activeVal) === String(it.val);
        const b = el('button', { class:'chip' + (on ? ' is-on' : ''), type:'button',
          'aria-pressed': on ? 'true' : 'false' }, [
          el('span', { text: it.label }),
          el('span', { class:'chip__n num', text: String(it.n) })
        ]);
        b.addEventListener('click', () => onPick(on ? '' : it.val));
        row.appendChild(b);
      });
      filterBox.appendChild(el('div', { class:'ex-frow' }, [
        el('span', { class:'ex-flabel', text: label }), row
      ]));
    };

    chipRow('الدولة', (f.countries || []).map(c => ({ val:c.code, label:countryName(c.code), n:c.n })),
      st.country, v => { st.country = v; st.uni = ''; st.col = ''; st.page = 0; QBANK.router.go(Explore.toHash(st)); });
    chipRow('الجامعة', (f.universities || []).map(u => ({ val:u.id, label:u.name, n:u.n })),
      st.uni, v => { st.uni = v; st.col = ''; st.page = 0; QBANK.router.go(Explore.toHash(st)); });
    if (st.uni)
      chipRow('الكلية', (f.colleges || []).map(c => ({ val:c.id, label:c.name, n:c.n })),
        st.col, v => { st.col = v; st.page = 0; QBANK.router.go(Explore.toHash(st)); });
  }

  function drawPager(d){
    pager.innerHTML = '';
    if (!d.pages || d.pages < 2) return;
    const go = p => { st.page = p; QBANK.router.go(Explore.toHash(st)); };
    const prev = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'‹ السابق',
      disabled: d.page <= 0 ? '' : null });
    prev.addEventListener('click', () => go(d.page - 1));
    const next = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'التالي ›',
      disabled: d.page >= d.pages - 1 ? '' : null });
    next.addEventListener('click', () => go(d.page + 1));
    pager.appendChild(prev);
    pager.appendChild(el('span', { class:'ex-pageno num', text:(d.page + 1) + ' من ' + d.pages }));
    pager.appendChild(next);
  }

  grid.appendChild(el('p', { class:'page__sub', text:'جارٍ البحث…' }));
  Explore.search(st).then(r => {
    if (!grid.isConnected) return;
    grid.innerHTML = '';
    if (!r.ok || !r.data || r.data.error){
      grid.appendChild(QBANK.views.empty('⚠', 'تعذّر البحث',
        'تأكد من الاتصال، أو أن ملف CATALOG.sql مُشغَّل على القاعدة.'));
      return;
    }
    const d = r.data;
    countEl.textContent = d.total
      ? d.total + ' مادة' + (st.q ? ' لـ «' + st.q + '»' : '')
      : 'لا نتائج' + (st.q ? ' لـ «' + st.q + '»' : '');
    if (!d.rows.length){
      grid.appendChild(QBANK.views.empty('⌕', 'لم نجد شيئًا',
        'جرّب كلمة أقصر، أو أزل بعض المرشّحات — أو كن أنت من يرفع هذه المادة.',
        el('a', { class:'btn', href:'#/upload', text:'⇪ ارفع هذه المادة' })));
      return;
    }
    d.rows.forEach(x => grid.appendChild(exCard(x)));
    drawPager(d);
  });

  Explore.filters(st).then(r => {
    if (!filterBox.isConnected) return;
    if (r.ok && r.data && !r.data.error) drawFilters(r.data);
  });

  return QBANK.views.page('استكشف', 'بنوك أسئلة رفعها طلاب من جامعات عربية.', [
    el('div', { class:'ex-bar' }, [ qIn, sortSel ]),
    filterBox, countEl, grid, pager
  ]);
}
