<!doctype html>
<!-- ملف AMUSQ المبني — لا تحرّره يدويًا. مصدره في src/ ويُدمج بـ node src/build.js -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="AMUSQ — منصة مراجعة تفاعلية لطلاب التخصصات الصحية">
<meta name="theme-color" content="#3b5bdb">
<link rel="manifest" href="manifest.webmanifest">
<title>AMUSQ · منصة المراجعة</title>
<style>

/* ===== 00-tokens.css ===== */
/*
  مصدر واحد للمظهر. أي لون أو مسافة في المشروع يأتي من هنا حصرًا.
  الهوية مأخوذة من عالم طب الطوارئ: أخضر المراقبة الحيوية، كهرماني الفرز، وورق عيادي بارد.
*/
:root{
  /* ثلاثة أدوار للخط — لا خط خارجي البتة (شرط العمل بلا إنترنت):
     العناوين كوفي هندسي مميّز · النص خط أنعم للقراءة الطويلة · الأرقام أحادي المسافة كشاشة المراقبة */
  --font-display: "Noto Kufi Arabic", "Tajawal", "Cairo", "Segoe UI", system-ui, sans-serif;
  --font: "Dubai", "Segoe UI", "Noto Sans Arabic", Tahoma, system-ui, -apple-system, sans-serif;
  --font-num: "Cascadia Mono", "Consolas", ui-monospace, "SF Mono", Menlo, monospace;

  /* الورق العيادي: أبرد من الأبيض الميت وأدفأ من الرمادي */
  --bg:        #f5f8fa;
  --bg-soft:   #eaf0f4;
  --surface:   #ffffff;
  --surface-2: #f4f8fa;
  --line:      #dde6ec;
  --line-soft: #eaf1f5;

  --text:      #0f1a20;
  --text-2:    #4a5a64;
  --text-3:    #7d8f9a;

  /* أخضر المراقبة الحيوية — كان لون «الإجابة الصحيحة» فصار لون الهوية */
  --brand:      #12805c;
  --brand-2:    #17a074;
  --brand-soft: #e2f4ed;
  --on-brand:   #ffffff;

  /* حالات — تُستعمل دائمًا مع أيقونة لا باللون وحده */
  --ok:      #12805c; --ok-soft:   #e2f4ed;
  --warn:    #b45309; --warn-soft: #fdf0dc;   /* كهرماني الفرز */
  --bad:     #be3428; --bad-soft:  #fceceb;
  --star:    #c98a06;

  /* سلّم مسافات أوسع نفَسًا */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 22px; --s6: 30px; --s7: 44px; --s8: 68px;

  /* حواف أنعم وظلال متعددة الطبقات — الجمال في الطبقات لا في القتامة */
  --r1: 10px; --r2: 14px; --r3: 20px; --r4: 28px; --r-pill: 999px;
  --sh1: 0 1px 2px rgba(15,26,32,.04), 0 2px 6px rgba(15,26,32,.05);
  --sh2: 0 2px 4px rgba(15,26,32,.04), 0 8px 20px rgba(15,26,32,.07);
  --sh3: 0 4px 8px rgba(15,26,32,.05), 0 20px 48px rgba(15,26,32,.12);
  --ring: 0 0 0 3px rgba(18,128,92,.22);

  --wrap: 1040px;
  --topbar-h: 60px;
  --tabbar-h: 62px;

  --t-fast: 140ms;
  --t: 240ms;
  --t-slow: 420ms;
  --ease: cubic-bezier(.22,.61,.36,1);

  /* ألوان المواد — مشتقة من نفس العائلة العيادية لا ألوان عشوائية */
  --subject-1: #12805c; --subject-2: #0f6f8c; --subject-3: #b45309;
  --subject-4: #6d3fa0; --subject-5: #be3428; --subject-6: #1d5fa8;
}

/* الوضع الليلي: شاشة مراقبة في غرفة مظلمة */
:root[data-theme="dark"]{
  --bg:        #0b1116;
  --bg-soft:   #101a21;
  --surface:   #14202a;
  --surface-2: #1a2833;
  --line:      #23343f;
  --line-soft: #1d2b35;

  --text:      #e8f1f5;
  --text-2:    #9fb3bd;
  --text-3:    #6f8794;

  --brand:      #2fbf90;
  --brand-2:    #4ad4a8;
  --brand-soft: #10322a;
  --on-brand:   #06120e;

  --ok:      #2fbf90; --ok-soft:   #10322a;
  --warn:    #e0a53a; --warn-soft: #33260f;
  --bad:     #f2776b; --bad-soft:  #35191a;
  --star:    #f0bd4e;

  --sh1: 0 1px 2px rgba(0,0,0,.5);
  --sh2: 0 6px 20px rgba(0,0,0,.5);
  --sh3: 0 22px 54px rgba(0,0,0,.62);
  --ring: 0 0 0 3px rgba(47,191,144,.3);

  --subject-1: #2fbf90; --subject-2: #48b4d4; --subject-3: #e0a53a;
  --subject-4: #a887e0; --subject-5: #f2776b; --subject-6: #6aa8f0;
}


/* ===== 10-base.css ===== */
/* الأساسيات: تصفير مضبوط + تنسيق عربي RTL + جوال أولًا */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  font-family:var(--font);
  font-size:16.5px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;                 /* سطر مريح للعربية، فحروفها متصلة وتحتاج تنفّسًا */
  color:var(--text);
  background:var(--bg);
  /* لماذا هنا؟ لأن أي تمرير أفقي على جوال ٣٦٠ بكسل يُعدّ عيبًا في معايير القبول */
  overflow-x:hidden;
  min-height:100vh;
  display:flex; flex-direction:column;
  transition:background var(--t) var(--ease), color var(--t) var(--ease);
}
/* العناوين بالخط الكوفي الهندسي — هو شخصية الصفحة، والنص بخط أنعم للقراءة */
h1,h2,h3,h4{
  font-family:var(--font-display);
  margin:0 0 var(--s3); line-height:1.45; font-weight:700;
  letter-spacing:-.015em;
}
h1{ font-size:1.6rem; } h2{ font-size:1.3rem; } h3{ font-size:1.06rem; }
p{ margin:0 0 var(--s3); }
a{ color:var(--brand); text-decoration:none; }
a:hover{ text-decoration:underline; }
ul,ol{ margin:0 0 var(--s3); padding-inline-start:var(--s5); }
button,input,select,textarea{ font:inherit; color:inherit; }
img,svg{ max-width:100%; height:auto; }

/* الأرقام تبقى لاتينية داخل النصوص العربية لسهولة قراءة النتائج والنسب */
.num,[data-num]{ font-family:var(--font-num); font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; }
/* نصوص الأسئلة تبقى بلغتها الأصلية واتجاهها */
.ltr{ direction:ltr; text-align:left; unicode-bidi:isolate; }

/* حلقة تركيز ناعمة بدل الخط الحاد — أوضح للوحة المفاتيح وأجمل */
:focus-visible{ outline:none; box-shadow:var(--ring); border-radius:var(--r1); }

.skip{
  position:absolute; inset-inline-start:-9999px; top:0; z-index:99;
  background:var(--brand); color:var(--on-brand); padding:var(--s3) var(--s4); border-radius:0 0 var(--r2) var(--r2);
}
.skip:focus{ inset-inline-start:var(--s4); }

.wrap{ width:100%; max-width:var(--wrap); margin-inline:auto; padding-inline:var(--s4); }

/* احترام تفضيل تقليل الحركة شرط في معايير القبول، لا تحسين اختياري */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}


/* ===== 20-layout.css ===== */
/* الهيكل: شريط علوي ثابت، محتوى، شريط تبويب سفلي على الجوال، تذييل */
.topbar{
  position:sticky; top:0; z-index:20;
  height:var(--topbar-h);
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
  transition:box-shadow var(--t) var(--ease);
}
.topbar__in{ height:100%; display:flex; align-items:center; justify-content:space-between; gap:var(--s3); }
.topbar__actions{ display:flex; align-items:center; gap:var(--s2); }

.brand{ display:inline-flex; align-items:center; gap:var(--s2); color:var(--text); font-weight:800; letter-spacing:.5px; }
.brand:hover{ text-decoration:none; }
.brand__mark{
  width:32px; height:32px; border-radius:10px; display:grid; place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2)); color:var(--on-brand);
  font-family:var(--font-num); font-weight:700; font-size:.95rem;
  box-shadow:0 2px 8px rgba(18,128,92,.28);
}
.brand__text{ font-family:var(--font-display); font-weight:800; }

.main{
  flex:1 0 auto;
  padding-block:var(--s5) var(--s8);
  /* مساحة أسفل تكفي شريط التبويب السفلي كي لا يغطّي آخر بطاقة */
  padding-bottom:calc(var(--tabbar-h) + var(--s8));
}

.tabbar{
  position:fixed; inset-inline:0; bottom:0; z-index:20;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px);
  display:flex; align-items:stretch;
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);
}
.tabbar__item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--text-3); font-size:.72rem; font-weight:600; padding:var(--s1);
  min-width:0;                       /* يمنع تمدّد النص فيكسر الشريط على ٣٦٠ بكسل */
}
.tabbar__item:hover{ text-decoration:none; color:var(--text-2); }
.tabbar__item[aria-current="page"]{ color:var(--brand); }
.tabbar__ico{ font-size:1.15rem; line-height:1; }
.tabbar__lbl{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

.footer{
  flex:0 0 auto;
  padding-block:var(--s5);
  padding-bottom:calc(var(--tabbar-h) + var(--s5));
  border-top:1px solid var(--line);
  background:var(--bg-soft);
  color:var(--text-3); font-size:.85rem; text-align:center;
}
.footer__credit{ margin:0; }
.footer__credit a{ font-weight:700; }

.grid{ display:grid; gap:var(--s4); grid-template-columns:1fr; }
@media (min-width:640px){ .grid--2{ grid-template-columns:repeat(2,1fr); } }
@media (min-width:900px){ .grid--3{ grid-template-columns:repeat(3,1fr); } }

/* على الشاشات الكبيرة يختفي الشريط السفلي وتظهر روابط أعلى */
@media (min-width:820px){
  .tabbar{ display:none; }
  .main{ padding-bottom:var(--s8); }
  .footer{ padding-bottom:var(--s5); }
}


/* ===== 30-components.css ===== */
/* مكوّنات مشتركة — تُستعمل في كل الشاشات فلا يُكتب تنسيق خاص بشاشة واحدة */

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  padding:var(--s5); box-shadow:var(--sh1);
  transition:box-shadow var(--t) var(--ease), border-color var(--t) var(--ease);
}
.card--flat{ box-shadow:none; }
.card__head{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); margin-bottom:var(--s3); }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  padding:var(--s3) var(--s5); border-radius:var(--r-pill); border:1px solid transparent;
  background:var(--brand); color:var(--on-brand); font-weight:700; cursor:pointer;
  min-height:46px;                  /* مساحة لمس آمنة على الجوال */
  font-family:var(--font-display); letter-spacing:-.01em;
  box-shadow:0 1px 2px rgba(15,26,32,.06);
  transition:transform var(--t-fast) var(--ease), box-shadow var(--t) var(--ease),
             background var(--t) var(--ease), color var(--t) var(--ease);
}
.btn:hover{ text-decoration:none; transform:translateY(-1px); box-shadow:var(--sh2); }
.btn:active{ transform:translateY(0); box-shadow:var(--sh1); }
.btn[disabled],.btn[aria-disabled="true"]{ opacity:.5; cursor:not-allowed; }
.btn--ghost{ background:var(--surface); color:var(--text); border-color:var(--line); }
.btn--ghost:hover{ border-color:var(--brand); color:var(--brand); }
.btn--soft{ background:var(--brand-soft); color:var(--brand); }
.btn--sm{ padding:var(--s2) var(--s4); min-height:36px; font-size:.9rem; }
.btn--block{ width:100%; }

.iconbtn{
  width:40px; height:40px; display:grid; place-items:center; cursor:pointer;
  background:transparent; border:1px solid var(--line); border-radius:var(--r-pill); color:var(--text-2);
}
.iconbtn:hover{ background:var(--surface-2); color:var(--text); }
.iconbtn__ico{ font-size:1.05rem; line-height:1; }

.field{ display:block; margin-bottom:var(--s4); }
.field__label{ display:block; font-weight:600; font-size:.9rem; margin-bottom:var(--s2); color:var(--text-2); }
.input{
  width:100%; padding:var(--s3) var(--s4); min-height:48px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); color:var(--text);
  transition:border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.input:hover{ border-color:var(--text-3); }
.input:focus{ outline:none; border-color:var(--brand); box-shadow:var(--ring); }
.input::placeholder{ color:var(--text-3); }
.field__hint{ font-size:.82rem; color:var(--text-3); margin-top:var(--s1); }

.badge{
  display:inline-flex; align-items:center; gap:var(--s1);
  padding:3px var(--s3); border-radius:var(--r-pill);
  font-size:.75rem; font-weight:700; line-height:1.7;
  background:var(--surface-2); color:var(--text-2); border:1px solid var(--line);
}
.badge--ok{ background:var(--ok-soft); color:var(--ok); border-color:transparent; }
.badge--warn{ background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.badge--bad{ background:var(--bad-soft); color:var(--bad); border-color:transparent; }

/* الحالة الفارغة: المرحلة ٠ كلها شاشات فارغة، فهذا المكوّن هو بطلها */
.empty{ text-align:center; padding:var(--s7) var(--s4); color:var(--text-2); }
.empty__ico{ font-size:2.2rem; line-height:1; display:block; margin-bottom:var(--s3); opacity:.7; }
.empty__title{ font-weight:700; color:var(--text); margin-bottom:var(--s2); }
.empty__text{ max-width:44ch; margin-inline:auto; font-size:.95rem; }

.page__head{ margin-bottom:var(--s5); }
.page__title{ margin-bottom:var(--s1); }
.page__sub{ color:var(--text-2); font-size:.95rem; margin:0; }

.stack{ display:flex; flex-direction:column; gap:var(--s4); }
.row{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
.spacer{ flex:1; }

.tabs{ display:flex; gap:var(--s1); border-bottom:1px solid var(--line); margin-bottom:var(--s5); overflow-x:auto; }
.tabs__btn{
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  padding:var(--s3) var(--s4); color:var(--text-2); font-weight:600; white-space:nowrap;
}
.tabs__btn[aria-selected="true"]{ color:var(--brand); border-bottom-color:var(--brand); }

.toast{
  position:fixed; inset-inline:0; bottom:calc(var(--tabbar-h) + var(--s4)); margin-inline:auto;
  width:max-content; max-width:88vw; z-index:60;
  background:var(--text); color:var(--bg); padding:var(--s3) var(--s5); border-radius:var(--r-pill);
  box-shadow:var(--sh3); opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity var(--t) var(--ease), transform var(--t) var(--ease);
}
.toast.is-on{ opacity:1; transform:translateY(0); }

.divider{ height:1px; background:var(--line); border:0; margin-block:var(--s5); }

/* زر الفعل الذي لا رجعة فيه — لونه وحده يكفي تحذيرًا */
.btn--danger{ background:var(--bad); color:var(--on-brand); border-color:var(--bad); }
.btn--danger:hover{ filter:brightness(.94); }

/* هيكل انتظار: يحجز مساحة المحتوى فلا تقفز الصفحة عند وصوله */
.skel{ display:block; background:var(--bg-soft); border-radius:var(--r1); }
.skel--line{ height:14px; width:70%; }
@media (prefers-reduced-motion: no-preference){
  .skel{ animation: skelPulse 1.4s var(--ease) infinite; }
  @keyframes skelPulse{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }
}


/* ===== 40-screens.css ===== */
/* تنسيقات الشاشات المركّبة: اللوحة، معالج الرفع، المادة، الاختبار — كلها من المتغيّرات */

/* أرقام اللوحة السريعة */
.stat{ text-align:center; padding:var(--s4); }
.stat__num{ display:block; font-size:1.6rem; font-weight:800; color:var(--brand); }
.stat__lbl{ font-size:.82rem; color:var(--text-2); }

/* صف قابل للضغط في الجداول */
.rowbtn{ width:100%; background:none; border:0; border-bottom:1px solid var(--line-soft);
  padding:var(--s3) var(--s1); cursor:pointer; text-align:start; min-height:44px; }
.rowbtn:hover{ background:var(--surface-2); }

.input--sm{ min-height:38px; padding:var(--s2) var(--s3); width:auto; }

/* خطوات المعالج */
.steps{ display:flex; gap:var(--s2); list-style:none; padding:0; margin:0 0 var(--s5);
  overflow-x:auto; }
.steps__item{ display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3);
  border-radius:var(--r-pill); border:1px solid var(--line); color:var(--text-3);
  font-size:.85rem; font-weight:600; white-space:nowrap; }
.steps__item.is-on{ background:var(--brand-soft); color:var(--brand); border-color:transparent; }
.steps__item.is-done{ color:var(--ok); }
.steps__num{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
  background:var(--surface-2); font-size:.75rem; font-weight:800; }
.is-on .steps__num{ background:var(--brand); color:var(--on-brand); }
.is-done .steps__num{ background:var(--ok-soft); color:var(--ok); }

/* منطقة الإسقاط */
.drop{ border:2px dashed var(--line); border-radius:var(--r3); padding:var(--s7) var(--s4);
  text-align:center; cursor:pointer; background:var(--surface); transition:border-color var(--t) var(--ease); }
.drop:hover,.drop.is-over{ border-color:var(--brand); }

/* شريط التقدّم «٨٠ من ٣٠٠» */
.meter{ height:10px; border-radius:var(--r-pill); background:var(--bg-soft); overflow:hidden; }
.meter__fill{ height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2));
  border-radius:inherit; transition:width var(--t) var(--ease); }

/* بطاقة السؤال وخياراته */
.q__text{ font-weight:600; margin:0; white-space:pre-wrap; }
.q__opts{ gap:var(--s2); }
.opt{ display:flex; align-items:flex-start; gap:var(--s3); width:100%; text-align:start;
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s3) var(--s4); cursor:pointer; min-height:44px; }
.opt:hover{ border-color:var(--brand); }
/* الإجابة الصحيحة: لون + أيقونة معًا — لا لون وحده (شرط إمكانية الوصول) */
.opt.is-answer{ background:var(--ok-soft); border-color:var(--ok); font-weight:700; }
.opt.is-wrong{ background:var(--bad-soft); border-color:var(--bad); }
.opt__mark{ min-width:1.2em; font-weight:800; color:var(--ok); }
.is-wrong .opt__mark{ color:var(--bad); }

/* بطاقة المادة في الرئيسية */
.subj{ position:relative; overflow:hidden; cursor:pointer; }
.subj__bar{ position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px; }
.subj__ico{ font-size:1.6rem; }
.subj__meter{ height:6px; border-radius:var(--r-pill); background:var(--bg-soft); overflow:hidden; }
.subj__meter > div{ height:100%; border-radius:inherit; }
.subj.is-past{ opacity:.72; }
.stamp{ display:inline-block; padding:2px var(--s3); border:2px solid var(--ok); color:var(--ok);
  border-radius:var(--r1); font-weight:800; font-size:.8rem; transform:rotate(-3deg); }

/* البطاقات المقلوبة ثلاثية الأبعاد لوضع الحفظ */
.flip{ perspective:900px; min-height:150px; cursor:pointer; }
.flip__in{ position:relative; width:100%; height:100%; min-height:150px;
  transform-style:preserve-3d; transition:transform .5s var(--ease); }
.flip.is-flipped .flip__in{ transform:rotateY(180deg); }
.flip__face{ position:absolute; inset:0; backface-visibility:hidden;
  display:flex; flex-direction:column; justify-content:center; gap:var(--s2);
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); padding:var(--s5); }
.flip__face--back{ transform:rotateY(180deg); background:var(--brand-soft); }

/* شاشة النتيجة */
.result__pct{ font-size:3rem; font-weight:800; color:var(--brand); }
.result__grade{ font-size:1.2rem; font-weight:700; }

/* عدّاد تنازلي وموقّت */
.timer{ font-weight:800; font-variant-numeric:tabular-nums; }
.timer.is-low{ color:var(--bad); }

/* أقسام مطوية */
.fold > summary{ cursor:pointer; font-weight:700; padding:var(--s3) 0; list-style:none; }
.fold > summary::before{ content:'◂'; display:inline-block; margin-inline-end:var(--s2);
  transition:transform var(--t) var(--ease); color:var(--text-3); }
.fold[open] > summary::before{ transform:rotate(-90deg); }


/* ===== 50-landing.css ===== */
/*
  صفحة الهبوط التعريفية — أول ما يراه الزائر قبل التسجيل.
  الهوية من AMSU: خط كوفي، ألوان هادئة، حواف ناعمة، ظلال خفيفة.
  البنية من مواقع الدورات العربية: بطل ← أرقام ← مواد ← مزايا ← خطوات ← أسعار ← دعوة.
*/

.lp{ margin-inline:calc(var(--s4) * -1); }

/* ===== البطل: شاشة مراقبة حيوية =====
   التوقيع البصري للمنصة. مأخوذ من أداة يعرفها كل مسعف: الشاشة وخط التخطيط.
   ليس زخرفة — الأرقام أرقام الطالب الحقيقية معروضة كعلامات حيوية. */
.lp-hero{
  position:relative; overflow:hidden;
  padding:var(--s8) var(--s4) var(--s7);
  text-align:center;
  background:
    radial-gradient(900px 300px at 50% 0%, var(--brand-soft), transparent 68%),
    var(--bg);
}
/* شبكة ورق تخطيط القلب — باهتة جدًا، تُحسّ ولا تُرى */
.lp-hero::before{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:
    linear-gradient(to left, var(--line-soft) 1px, transparent 1px),
    linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(680px 300px at 50% 0%, black 20%, transparent 78%);
  -webkit-mask-image:radial-gradient(680px 300px at 50% 0%, black 20%, transparent 78%);
}
.lp-hero > *{ position:relative; }

.lp-hero__badge{
  display:inline-flex; align-items:center; gap:var(--s2);
  padding:var(--s2) var(--s4); border-radius:var(--r-pill);
  background:var(--surface); border:1px solid var(--line);
  font-size:.8rem; font-weight:700; color:var(--brand);
  box-shadow:var(--sh1); margin-bottom:var(--s5);
}
.lp-hero__badge .dot{
  width:7px; height:7px; border-radius:50%; background:var(--brand);
  animation:lp-beat 1.6s var(--ease) infinite;
}
@keyframes lp-beat{
  0%,100%{ transform:scale(1); opacity:1; }
  45%{ transform:scale(1.5); opacity:.55; }
}

.lp-hero__title{
  font-family:var(--font-display);
  font-size:clamp(2rem, 6.4vw, 3.3rem); line-height:1.3; font-weight:800;
  margin:0 0 var(--s4); letter-spacing:-.03em;
}
.lp-hero__title em{ font-style:normal; color:var(--brand); }
.lp-hero__sub{
  max-width:54ch; margin:0 auto var(--s6);
  font-size:clamp(1rem, 2.4vw, 1.12rem); color:var(--text-2); line-height:1.95;
}

/* خط التخطيط: يُرسم مرة عند الفتح ثم يسكن */
.lp-ecg{ width:100%; max-width:640px; margin:var(--s6) auto 0; display:block; height:76px; }
.lp-ecg path{
  fill:none; stroke:var(--brand); stroke-width:2.2;
  stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:1400; stroke-dashoffset:1400;
  animation:lp-draw 2.6s var(--ease) .25s forwards;
}
@keyframes lp-draw{ to{ stroke-dashoffset:0; } }
@media (prefers-reduced-motion: reduce){
  .lp-ecg path{ stroke-dashoffset:0; animation:none; }
  .lp-hero__badge .dot{ animation:none; }
}

.lp-cta{ display:flex; gap:var(--s3); justify-content:center; flex-wrap:wrap; }
.lp-cta .btn{ padding:var(--s4) var(--s7); font-size:1.02rem; }
.btn--lg{ min-height:54px; }

/* ===== العلامات الحيوية: أرقامك كقراءة شاشة ===== */
.lp-stats{
  display:grid; grid-template-columns:repeat(2,1fr); gap:0;
  max-width:720px; margin:var(--s7) auto 0;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r3); overflow:hidden; box-shadow:var(--sh2);
}
@media (min-width:640px){ .lp-stats{ grid-template-columns:repeat(4,1fr); } }
.lp-stat{
  padding:var(--s5) var(--s3); text-align:center;
  border-inline-start:1px solid var(--line-soft);
  border-top:1px solid var(--line-soft);
}
.lp-stat:nth-child(-n+2){ border-top:0; }
@media (min-width:640px){ .lp-stat{ border-top:0; } }
.lp-stat:first-child{ border-inline-start:0; }
@media (max-width:639px){ .lp-stat:nth-child(odd){ border-inline-start:0; } }
.lp-stat__n{
  display:block; font-family:var(--font-num);
  font-size:1.8rem; font-weight:700; color:var(--brand); line-height:1.15;
  letter-spacing:-.02em;
}
.lp-stat__l{
  font-size:.74rem; color:var(--text-3); font-weight:700;
  letter-spacing:.03em; margin-top:var(--s1); display:block;
}

/* ===== أقسام عامة ===== */
.lp-sec{ max-width:var(--wrap); margin-inline:auto; padding:var(--s8) var(--s4); }
/* فاصل رفيع بين الأقسام يوحّد الإيقاع بلا خطوط ثقيلة */
.lp-sec + .lp-sec{ border-top:1px solid var(--line-soft); }
.lp-sec__head{ text-align:center; margin-bottom:var(--s7); }
.lp-sec__kicker{
  display:inline-block; font-size:.76rem; font-weight:800; letter-spacing:.06em;
  color:var(--brand); background:var(--brand-soft);
  padding:var(--s1) var(--s4); border-radius:var(--r-pill); margin-bottom:var(--s4);
}
.lp-sec__title{
  font-family:var(--font-display);
  font-size:clamp(1.45rem, 4vw, 2.05rem); margin:0 0 var(--s3);
  font-weight:800; letter-spacing:-.025em;
}
.lp-sec__sub{ color:var(--text-2); max-width:52ch; margin-inline:auto; }

/* ===== بطاقات المواد (العرض التعريفي) ===== */
.lp-grid{ display:grid; gap:var(--s4); grid-template-columns:1fr; }
@media (min-width:640px){ .lp-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width:960px){ .lp-grid--3{ grid-template-columns:repeat(3,1fr); } }

.lp-card{
  position:relative; overflow:hidden;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  padding:var(--s5); box-shadow:var(--sh1);
  transition:transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
  display:flex; flex-direction:column; gap:var(--s3);
}
.lp-card:hover{ transform:translateY(-2px); box-shadow:var(--sh2); border-color:var(--line); }
.lp-card__top{ height:4px; position:absolute; inset-inline:0; top:0; }
.lp-card__ico{
  width:54px; height:54px; border-radius:var(--r2); display:grid; place-items:center;
  font-size:1.5rem; background:var(--brand-soft);
}
.lp-card__title{ font-family:var(--font-display); font-size:1.05rem; font-weight:800; margin:0; letter-spacing:-.015em; }
.lp-card__text{ color:var(--text-2); font-size:.92rem; margin:0; line-height:1.85; }
.lp-card__meta{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:auto; padding-top:var(--s2); }

/* ===== الخطوات ===== */
.lp-steps{ display:grid; gap:var(--s5); grid-template-columns:1fr; counter-reset:step; }
@media (min-width:820px){ .lp-steps{ grid-template-columns:repeat(4,1fr); } }
.lp-step{ text-align:center; }
.lp-step__n{
  width:48px; height:48px; margin:0 auto var(--s3); border-radius:50%;
  display:grid; place-items:center; font-weight:700; font-size:1.05rem;
  font-family:var(--font-num);
  background:var(--brand); color:var(--on-brand);
  box-shadow:0 4px 14px rgba(18,128,92,.3);
}
.lp-step__t{ font-weight:800; margin-bottom:var(--s1); }
.lp-step__d{ color:var(--text-2); font-size:.9rem; margin:0; }

/* ===== الأسعار ===== */
.lp-price{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r4);
  padding:var(--s6); box-shadow:var(--sh1); display:flex; flex-direction:column; gap:var(--s3);
}
.lp-price--hot{ border-color:var(--brand); box-shadow:var(--sh2); position:relative; }
.lp-price--hot::before{
  content:'الأكثر اختيارًا'; position:absolute; top:calc(var(--s4) * -1); inset-inline-start:50%;
  transform:translateX(50%); background:var(--brand); color:var(--on-brand);
  font-size:.75rem; font-weight:800; padding:var(--s1) var(--s4); border-radius:var(--r-pill);
}
.lp-price__n{ font-family:var(--font-display); font-size:1.08rem; font-weight:800; }
.lp-price__v{ font-family:var(--font-num); font-size:1.9rem; font-weight:700; color:var(--brand); letter-spacing:-.02em; }
.lp-price__v small{ font-size:.85rem; color:var(--text-3); font-weight:600; }
.lp-price ul{ list-style:none; padding:0; margin:0; display:grid; gap:var(--s2); }
.lp-price li{ display:flex; gap:var(--s2); align-items:flex-start; font-size:.92rem; color:var(--text-2); }
.lp-price li::before{ content:'✓'; color:var(--ok); font-weight:800; }

/* ===== الدعوة الأخيرة ===== */
.lp-final{
  max-width:var(--wrap); margin:var(--s7) auto var(--s8); padding:var(--s8) var(--s5);
  text-align:center; border-radius:var(--r4);
  background:linear-gradient(145deg, var(--brand), var(--brand-2));
  color:var(--on-brand); box-shadow:var(--sh3);
  position:relative; overflow:hidden;
}
/* شبكة تخطيط باهتة تربط الختام بالبطل */
.lp-final::before{
  content:''; position:absolute; inset:0; opacity:.13; pointer-events:none;
  background-image:
    linear-gradient(to left, white 1px, transparent 1px),
    linear-gradient(to bottom, white 1px, transparent 1px);
  background-size:26px 26px;
}
.lp-final > *{ position:relative; }
.lp-final h2{ font-family:var(--font-display); color:inherit; font-size:clamp(1.35rem, 4vw, 1.95rem); margin-bottom:var(--s3); letter-spacing:-.025em; }
.lp-final p{ opacity:.92; max-width:48ch; margin:0 auto var(--s5); }
.lp-final .btn{ background:var(--surface); color:var(--brand); }

/* الطباعة لا تعني صفحة الهبوط */
@media print{ .lp{ display:none; } }

/* ===== عدّاد الامتحانات القادمة — أنفع ما يراه الطالب أولًا ===== */
.lp-exams{
  max-width:var(--wrap); margin:var(--s6) auto 0; padding-inline:var(--s4);
  display:grid; gap:var(--s3); grid-template-columns:1fr;
}
@media (min-width:640px){ .lp-exams{ grid-template-columns:repeat(3,1fr); } }
.lp-exam{
  display:flex; align-items:center; gap:var(--s3);
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s4); box-shadow:var(--sh1);
}
.lp-exam__d{
  min-width:56px; height:56px; border-radius:var(--r2); display:grid; place-items:center;
  background:var(--brand-soft); color:var(--brand); font-weight:800; line-height:1.1; text-align:center;
}
.lp-exam__d b{ display:block; font-family:var(--font-num); font-size:1.4rem; font-weight:700; }
.lp-exam__d span{ font-size:.68rem; font-weight:700; }
.lp-exam__n{ font-family:var(--font-display); font-weight:700; letter-spacing:-.01em; }
.lp-exam__s{ font-size:.82rem; color:var(--text-3); }
.lp-exam--soon .lp-exam__d{ background:var(--bad-soft); color:var(--bad); }

/* ===== السؤال التجريبي ===== */
.lp-try{
  max-width:760px; margin-inline:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r4);
  padding:var(--s6); box-shadow:var(--sh2);
}
.lp-try__q{ font-weight:600; margin:0 0 var(--s5); font-size:1.06rem; line-height:1.75; }
.lp-try__opts{ display:grid; gap:var(--s2); margin-bottom:var(--s4); }
.lp-try__fb{
  border-radius:var(--r2); padding:var(--s4); font-size:.93rem; line-height:1.9;
  border:1px solid var(--line); background:var(--surface-2);
}
.lp-try__fb.is-ok{ background:var(--ok-soft); border-color:var(--ok); }
.lp-try__fb.is-no{ background:var(--bad-soft); border-color:var(--bad); }
.lp-try__fb b{ display:block; margin-bottom:var(--s1); }

/* ===== بطاقة الحفظ الحيّة ===== */
.lp-memo{
  max-width:520px; margin-inline:auto; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  padding:var(--s6); box-shadow:var(--sh1); text-align:center; min-height:180px;
  display:flex; flex-direction:column; justify-content:center; gap:var(--s3);
  transition:box-shadow var(--t) var(--ease);
}
.lp-memo:hover{ box-shadow:var(--sh2); }
.lp-memo__hint{ font-size:.8rem; color:var(--text-3); }
.lp-memo__chain{ display:flex; align-items:center; justify-content:center; gap:var(--s3); flex-wrap:wrap; }
.lp-memo__k{ font-weight:700; color:var(--brand); font-size:1.08rem; }

/* ===== نصائح المراجعة ===== */
.lp-tip{ display:flex; gap:var(--s4); align-items:flex-start; }
.lp-tip__i{
  min-width:44px; height:44px; border-radius:var(--r2); display:grid; place-items:center;
  background:var(--brand-soft); color:var(--brand); font-size:1.2rem;
}
.lp-tip__t{ font-weight:800; margin:0 0 var(--s1); }
.lp-tip__d{ color:var(--text-2); font-size:.9rem; margin:0; line-height:1.85; }

/* ===== الأسئلة الشائعة ===== */
.lp-faq{ max-width:760px; margin-inline:auto; display:grid; gap:var(--s2); }
.lp-faq details{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s4) var(--s5);
}
.lp-faq summary{
  cursor:pointer; font-weight:700; list-style:none; font-family:var(--font-display);
  letter-spacing:-.01em;
  display:flex; align-items:center; gap:var(--s3);
}
.lp-faq summary::-webkit-details-marker{ display:none; }
.lp-faq summary::before{
  content:'+'; color:var(--brand); font-weight:800; font-size:1.2rem; line-height:1;
  transition:transform var(--t) var(--ease);
}
.lp-faq details[open] summary::before{ content:'−'; }
.lp-faq p{ color:var(--text-2); font-size:.92rem; margin:var(--s3) 0 0; padding-inline-start:calc(var(--s3) + 1ch); }


/* ===== 60-admin.css ===== */
/* لوحة تحكم المشرف — كثافة معلومات عالية بلا فوضى بصرية */

/* ===== شبكة المؤشرات ===== */
.ad-kpis{ display:grid; gap:var(--s3); grid-template-columns:repeat(2,1fr); }
@media (min-width:700px){ .ad-kpis{ grid-template-columns:repeat(3,1fr); } }
@media (min-width:1000px){ .ad-kpis{ grid-template-columns:repeat(6,1fr); } }
.ad-kpi{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s4); box-shadow:var(--sh1); position:relative; overflow:hidden;
}
.ad-kpi__n{
  display:block; font-family:var(--font-num); font-size:1.6rem; font-weight:700;
  line-height:1.15; color:var(--text); letter-spacing:-.02em;
}
.ad-kpi__l{ font-size:.76rem; color:var(--text-3); font-weight:700; }
.ad-kpi__s{ font-size:.7rem; color:var(--text-3); margin-top:var(--s1); display:block; }
.ad-kpi--live .ad-kpi__n{ color:var(--brand); }
.ad-kpi--warn .ad-kpi__n{ color:var(--warn); }
.ad-kpi--bad .ad-kpi__n{ color:var(--bad); }

/* ===== لوحات الرسوم ===== */
.ad-panels{ display:grid; gap:var(--s4); grid-template-columns:1fr; margin-top:var(--s5); }
@media (min-width:900px){ .ad-panels--2{ grid-template-columns:1.6fr 1fr; } }
.ad-panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  padding:var(--s5); box-shadow:var(--sh1);
}
.ad-panel__h{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); margin-bottom:var(--s5); }
.ad-panel__t{ font-family:var(--font-display); font-weight:800; font-size:1rem; margin:0; }
.ad-panel__s{ font-size:.78rem; color:var(--text-3); }

/* رسم الأعمدة — SVG يدوي بلا مكتبات */
.ad-chart{ width:100%; height:170px; display:block; overflow:visible; }
.ad-chart .bar{ fill:var(--brand); opacity:.85; transition:opacity var(--t) var(--ease); }
.ad-chart .bar:hover{ opacity:1; }
.ad-chart .bar--empty{ fill:var(--line); opacity:.6; }
.ad-chart .grid{ stroke:var(--line-soft); stroke-width:1; }
.ad-chart .lbl{ fill:var(--text-3); font-size:9px; font-family:var(--font-num); }
.ad-chart .line{ fill:none; stroke:var(--warn); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.ad-chart .dot{ fill:var(--warn); }

/* شرائح النتائج */
.ad-bucket{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s3); }
.ad-bucket__l{ min-width:66px; font-family:var(--font-num); font-size:.8rem; color:var(--text-2); }
.ad-bucket__t{ flex:1; height:12px; border-radius:var(--r-pill); background:var(--bg-soft); overflow:hidden; }
.ad-bucket__f{ height:100%; border-radius:inherit; transition:width var(--t-slow) var(--ease); }
.ad-bucket__n{ min-width:34px; text-align:end; font-family:var(--font-num); font-size:.82rem; color:var(--text-2); }

/* جدول عام */
.ad-table{ width:100%; overflow-x:auto; }
.ad-row{
  display:flex; align-items:center; gap:var(--s3); width:100%;
  padding:var(--s3) var(--s2); border-bottom:1px solid var(--line-soft);
  background:none; border-inline:0; border-top:0; text-align:start; cursor:pointer;
  min-height:52px; color:inherit; transition:background var(--t-fast) var(--ease);
}
.ad-row:hover{ background:var(--surface-2); }
.ad-row:last-child{ border-bottom:0; }
.ad-row__main{ flex:1; min-width:0; }
.ad-row__t{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ad-row__s{ font-size:.78rem; color:var(--text-3); }

/* نشاط أخير */
.ad-feed{ display:grid; gap:var(--s2); }
.ad-feed__i{ display:flex; align-items:center; gap:var(--s3); font-size:.88rem; padding:var(--s2) 0; border-bottom:1px solid var(--line-soft); }
.ad-feed__i:last-child{ border-bottom:0; }
.ad-feed__av{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); }
.ad-feed__x{ flex:1; min-width:0; }
.ad-feed__t{ font-size:.72rem; color:var(--text-3); font-family:var(--font-num); }

/* ===== محرر المادة ===== */
.ad-edit{ display:grid; gap:var(--s4); }
@media (min-width:760px){ .ad-edit--2{ grid-template-columns:1fr 1fr; } }
.ad-swatches{ display:flex; gap:var(--s2); flex-wrap:wrap; }
.ad-sw{
  width:34px; height:34px; border-radius:var(--r1); cursor:pointer;
  border:2px solid transparent; box-shadow:var(--sh1);
}
.ad-sw[aria-checked="true"]{ border-color:var(--text); transform:scale(1.08); }
.ad-icons{ display:flex; gap:var(--s2); flex-wrap:wrap; }
.ad-ico{
  width:38px; height:38px; border-radius:var(--r1); display:grid; place-items:center;
  background:var(--surface-2); border:2px solid transparent; cursor:pointer; font-size:1.1rem;
}
.ad-ico[aria-checked="true"]{ border-color:var(--brand); background:var(--brand-soft); }

/* ===== متصفح الأسئلة ===== */
.ad-q{ border:1px solid var(--line); border-radius:var(--r2); padding:var(--s4); background:var(--surface); }
.ad-q + .ad-q{ margin-top:var(--s3); }
.ad-q__head{ display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s3); }

/* ===== 16-data.js ===== */
/*
  مخزن المحتوى المحلي: الأسئلة في IndexedDB لأن مادة واحدة بمئات الأسئلة
  تتجاوز سقف localStorage (≈ ٥ ميغابايت). عند غياب IndexedDB (فحوص jsdom،
  أو تصفح خاص متشدد) نسقط إلى ذاكرة مؤقتة فلا تنكسر المنصة — تعمل بلا حفظ فقط.
*/
const Data = {
  DB_NAME: 'amusq', DB_VER: 1,
  _db: null,
  _mem: { questions: new Map(), meta: new Map() },
  hasIDB(){ return typeof indexedDB !== 'undefined'; },

  open(){
    if (!Data.hasIDB()) return Promise.resolve(null);
    if (Data._db) return Promise.resolve(Data._db);
    return new Promise((resolve) => {
      const req = indexedDB.open(Data.DB_NAME, Data.DB_VER);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('questions')) {
          const st = db.createObjectStore('questions', { keyPath:'id' });
          st.createIndex('subject_id', 'subject_id');   // الجلب دائمًا بمادة كاملة
        }
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath:'k' });
      };
      req.onsuccess = () => { Data._db = req.result; resolve(Data._db); };
      req.onerror = () => resolve(null);   // فشل الفتح لا يُسقط المنصة
    });
  },

  async putQuestions(subjectId, questions){
    if (!Data.hasIDB()) {
      questions.forEach(q => Data._mem.questions.set(q.id, q));
      Data._mem.meta.set('subj:' + subjectId, Date.now());
      return true;
    }
    const db = await Data.open();
    if (!db) return false;
    return new Promise((resolve) => {
      const tx = db.transaction(['questions','meta'], 'readwrite');
      const st = tx.objectStore('questions');
      questions.forEach(q => st.put(q));
      tx.objectStore('meta').put({ k:'subj:' + subjectId, at: Date.now() });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  },

  async getQuestions(subjectId){
    if (!Data.hasIDB()) {
      return Array.from(Data._mem.questions.values())
        .filter(q => q.subject_id === subjectId)
        .sort((a,b) => (a.ord||0) - (b.ord||0));
    }
    const db = await Data.open();
    if (!db) return [];
    return new Promise((resolve) => {
      const tx = db.transaction('questions', 'readonly');
      const idx = tx.objectStore('questions').index('subject_id');
      const req = idx.getAll(subjectId);
      req.onsuccess = () => resolve((req.result || []).sort((a,b) => (a.ord||0) - (b.ord||0)));
      req.onerror = () => resolve([]);
    });
  },

  async hasSubject(subjectId){
    if (!Data.hasIDB()) return Data._mem.meta.has('subj:' + subjectId);
    const db = await Data.open();
    if (!db) return false;
    return new Promise((resolve) => {
      const req = db.transaction('meta','readonly').objectStore('meta').get('subj:' + subjectId);
      req.onsuccess = () => resolve(!!req.result);
      req.onerror = () => resolve(false);
    });
  },

  async clearAll(){
    Data._mem.questions.clear(); Data._mem.meta.clear();
    if (!Data.hasIDB()) return true;
    const db = await Data.open();
    if (!db) return true;
    return new Promise((resolve) => {
      const tx = db.transaction(['questions','meta'], 'readwrite');
      tx.objectStore('questions').clear();
      tx.objectStore('meta').clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  },

  /* --- المحتوى المنشور: قائمة المواد خفيفة في localStorage، والأسئلة عند الطلب --- */
  pack(){ return AMUSQ.store.get('pack', { subjects: [], settings: {} }); },
  savePack(p){ AMUSQ.store.set('pack', p); },

  async refreshPack(){
    const r = await AMUSQ.api.rpc('content_pack');
    if (r.ok && r.data && r.data.subjects) { Data.savePack(r.data); return { ok:true, data:r.data }; }
    return r;   // فشل أو بلا إنترنت: نبقى على النسخة المخزّنة — هذا جوهر العمل دون اتصال
  },

  // أسئلة مادة: من الجهاز إن سبق جلبها، وإلا من الخادم ثم تُخزَّن — «تحميل على مراحل»
  async subjectQuestions(subjectId){
    if (await Data.hasSubject(subjectId)) {
      const local = await Data.getQuestions(subjectId);
      if (local.length) return { ok:true, data:local, from:'device' };
    }
    const r = await AMUSQ.api.rpc('subject_questions', { sid: subjectId });
    if (r.ok && Array.isArray(r.data)) {
      await Data.putQuestions(subjectId, r.data);
      return { ok:true, data:r.data, from:'network' };
    }
    return { ok:false, offline: r.offline, data: [] };
  }
};
AMUSQ.data = Data;


/* ===== 18-progress.js ===== */
/*
  التقدّم: محلي أولًا وفورًا، ثم يُدفع للحساب بتأخير ٢٫٥ ثانية بعد آخر نقرة.
  لماذا التأخير؟ طالب يقلّب ٣٠ بطاقة في دقيقة = ٣٠ كتابة شبكية بلا فائدة؛
  دفعة واحدة بعد سكونه تكفي وتوفّر البطارية والبيانات.
*/
const Progress = {
  KEY: 'progress',
  PUSH_DELAY: 2500,
  _timer: null,
  _pushFn: null,   // باب حقن للفحوص

  blank(){ return {}; },
  all(){ return AMUSQ.store.get(Progress.KEY, Progress.blank()); },
  save(p){ AMUSQ.store.set(Progress.KEY, p); Progress.schedulePush(); },

  forSubject(sid){
    const p = Progress.all();
    return p[sid] || { seen:{}, wrong:{}, star:{}, exams:0, best:0 };
  },
  _update(sid, fn){
    const p = Progress.all();
    const s = p[sid] || { seen:{}, wrong:{}, star:{}, exams:0, best:0 };
    fn(s); p[sid] = s; Progress.save(p);
    return s;
  },

  markSeen(sid, qid){ return Progress._update(sid, s => { s.seen[qid] = 1; }); },
  markWrong(sid, qid){ return Progress._update(sid, s => { s.wrong[qid] = (s.wrong[qid]||0) + 1; s.seen[qid] = 1; }); },
  clearWrong(sid, qid){ return Progress._update(sid, s => { delete s.wrong[qid]; }); },
  toggleStar(sid, qid){
    let on = false;
    Progress._update(sid, s => { if (s.star[qid]) delete s.star[qid]; else { s.star[qid] = 1; on = true; } });
    return on;
  },
  recordExam(sid, pct){ return Progress._update(sid, s => { s.exams += 1; if (pct > s.best) s.best = pct; }); },

  pctDone(sid, totalQ){
    if (!totalQ) return 0;
    const seen = Object.keys(Progress.forSubject(sid).seen).length;
    return Math.min(100, Math.round(seen / totalQ * 100));
  },

  /* --- الدمج بلا حذف: اتحاد المُشاهد والنجوم، الأعلى يفوز في النتائج، والمجموع في العدّادات.
         القاعدة: لا يخسر أحد تقدّمه أبدًا — لا عند جهاز جديد ولا عند تعارض. --- */
  merge(local, remote){
    const out = {};
    const sids = new Set(Object.keys(local || {}).concat(Object.keys(remote || {})));
    sids.forEach(sid => {
      const a = (local  || {})[sid] || { seen:{}, wrong:{}, star:{}, exams:0, best:0 };
      const b = (remote || {})[sid] || { seen:{}, wrong:{}, star:{}, exams:0, best:0 };
      out[sid] = {
        seen:  Object.assign({}, b.seen,  a.seen),
        star:  Object.assign({}, b.star,  a.star),
        wrong: (function(){
          // عدّاد الأخطاء: الأعلى يفوز — تكرار الخطأ معلومة تهم ترتيب المراجعة
          const w = Object.assign({}, b.wrong);
          Object.keys(a.wrong || {}).forEach(k => { w[k] = Math.max(w[k] || 0, a.wrong[k]); });
          return w;
        })(),
        exams: (a.exams || 0) + (b.exams || 0),
        best:  Math.max(a.best || 0, b.best || 0)
      };
    });
    return out;
  },

  schedulePush(){
    if (Progress._timer) clearTimeout(Progress._timer);
    Progress._timer = setTimeout(() => { Progress._timer = null; Progress.push(); }, Progress.PUSH_DELAY);
  },
  async push(){
    if (Progress._pushFn) return Progress._pushFn(Progress.all());
    if (!AMUSQ.api.user()) return { ok:false };   // زائر: يبقى تقدّمه في جهازه حتى يسجّل
    return AMUSQ.api.rest('progress?on_conflict=user_id', {
      method:'POST',
      headers: Object.assign(AMUSQ.api.headers(), { 'Prefer':'resolution=merge-duplicates' }),
      body: JSON.stringify({ user_id: AMUSQ.api.user().id, data: Progress.all(), updated_at: new Date().toISOString() })
    });
  },
  // عند أول دخول على جهاز: نجلب تقدّم الحساب وندمجه مع تقدّم الجهاز ثم ندفع الناتج
  async pull(){
    const u = AMUSQ.api.user();
    if (!u) return { ok:false };
    const r = await AMUSQ.api.rest('progress?user_id=eq.' + u.id + '&select=data');
    if (r.ok && r.data && r.data[0]) {
      const merged = Progress.merge(Progress.all(), r.data[0].data || {});
      AMUSQ.store.set(Progress.KEY, merged);
      await Progress.push();
      return { ok:true, merged:true };
    }
    if (r.ok) { await Progress.push(); return { ok:true, merged:false }; }
    return r;
  }
};
AMUSQ.progress = Progress;


/* ===== 20-gate.js ===== */
/*
  بوابة المحتوى — تفصل المجاني عن المدفوع (المرحلة ٥).
  القرار النهائي في قاعدة البيانات (can_access + RLS)؛ نسخة العميل هنا
  للعرض فقط: تخفي أزرار ما لا يملكه الطالب وتعرض بطاقة الشراء بدلها.
  النموذج: مادة مفردة أو حزمة فصل تنتهي بنهاية الفصل — لا اشتراك شهري.
*/
const Gate = {
  KEY: 'entitlements',
  list(){ return AMUSQ.store.get(Gate.KEY, []); },
  save(rows){ AMUSQ.store.set(Gate.KEY, rows || []); },

  async refresh(){
    const u = AMUSQ.api.user();
    if (!u) return { ok:false };
    const r = await AMUSQ.api.rest('entitlements?select=subject_id,kind,expires_at&expires_at=gt.' + new Date().toISOString());
    if (r.ok && Array.isArray(r.data)) { Gate.save(r.data); return { ok:true }; }
    return r;
  },

  // متاحة؟ مجانية للجميع، أو استحقاق ساري المفعول (مادة مفردة أو حزمة فصل)
  canAccess(sub, now){
    if (!sub) return false;
    if (sub.free) return true;
    if (AMUSQ.store.get('is_admin_check', {}).ok) return true;
    const t = now || Date.now();
    return Gate.list().some(e =>
      new Date(e.expires_at).getTime() > t &&
      (e.kind === 'semester' || e.subject_id === sub.id));
  },

  // بطاقة الشراء — تحترم قاعدة المتاجر: داخل التطبيق لا إحالة للموقع
  paywallCard(sub){
    const isApp = !!(typeof window !== 'undefined' && window.AMUSQ_NATIVE_APP);
    return el('div', { class:'card', style:'text-align:center' }, [
      el('span', { class:'empty__ico', 'aria-hidden':'true', text:'🔒' }),
      el('p', { class:'empty__title', text:'«' + sub.name + '» مادة مدفوعة' }),
      el('p', { class:'empty__text', text:'اشترِ المادة وحدها أو حزمة الفصل كاملة — صالحة حتى نهاية الفصل، بلا اشتراك شهري.' }),
      isApp
        ? el('button', { class:'btn btn--block', type:'button', 'data-buy': sub.id, text:'اشترِ من داخل التطبيق' })
        : el('a', { class:'btn btn--block', href:'https://www.alsoqoor.com', target:'_blank', rel:'noopener noreferrer', text:'اشترِ من الموقع (مدى / Apple Pay)' }),
      el('p', { class:'field__hint', text:'لديك حساب اشترى من قبل؟ سجّل دخولك وسيُفتح المحتوى تلقائيًا.' })
    ]);
  }
};
AMUSQ.gate = Gate;


/* ===== 20-router.js ===== */
/*
  الموجّه: يعتمد على hash لا على History API.
  لماذا؟ لأن المنصة يجب أن تعمل بفتح index.html مباشرة من القرص (file://)
  وهناك pushState لا يعمل، بينما #/ يعمل في كل مكان.
*/
const Router = {
  routes: {},
  notFound: null,
  current: null,

  add(path, def){ Router.routes[path] = def; return Router; },

  parse(hash){
    // نُحوّل "#/admin/students?x=1" إلى { path:'#/admin', rest:['students'], query:{x:'1'} }
    const raw = (hash || '#/').replace(/^#?/, '#');
    const [beforeQ, qs] = raw.split('?');
    const parts = beforeQ.replace(/^#\/?/, '').split('/').filter(Boolean);
    const query = {};
    (qs || '').split('&').filter(Boolean).forEach(pair => {
      const [k, v] = pair.split('=');
      query[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });

    if (!parts.length) return { path:'#/', rest:[], query, raw:beforeQ };

    // نطابق أطول مسار مُعرَّف أولًا حتى لا يبتلع "#/admin" مسار "#/admin/login"
    let path = '#/' + parts.join('/');
    let rest = [];
    while (parts.length && !Router.routes[path]) {
      rest.unshift(parts.pop());
      path = '#/' + parts.join('/');
    }
    // لم يُطابَق شيء: نُرجع المسار كما هو ليصل إلى صفحة ٤٠٤،
    // ولا نُسقطه على الجذر — وإلا صار كل رابط خاطئ يفتح الرئيسية بصمت.
    if (!parts.length) return { path: beforeQ, rest:[], query, raw: beforeQ };
    return { path, rest, query, raw: beforeQ };
  },

  resolve(hash){
    const m = Router.parse(hash);
    const def = Router.routes[m.path];
    return def ? Object.assign({}, m, { def }) : Object.assign({}, m, { def: Router.notFound });
  },

  render(hash){
    const main = document.getElementById('main');
    if (!main) return null;
    const r = Router.resolve(hash);
    Router.current = r;

    main.innerHTML = '';
    const view = r.def && typeof r.def.view === 'function' ? r.def.view(r) : null;
    if (view) main.appendChild(view);

    document.title = (r.def && r.def.title ? r.def.title + ' · ' : '') + 'AMUSQ';
    Router.paintNav(r.path);
    // نُعيد التركيز إلى المحتوى كي يعرف قارئ الشاشة أن الصفحة تبدّلت
    if (Router.booted) { try { main.focus(); } catch(e){} }
    Router.booted = true;
    return r;
  },

  paintNav(path){
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), a => {
      const isOn = a.getAttribute('data-nav') === path;
      if (isOn) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
  },

  go(hash){
    if (location.hash === hash) Router.render(hash);   // نفس الوجهة: نُعيد الرسم يدويًا
    else location.hash = hash;
  },

  init(){
    window.addEventListener('hashchange', () => Router.render(location.hash));
    Router.render(location.hash || '#/');
  }
};
AMUSQ.router = Router;


/* ===== 24-exam.js ===== */
/*
  محرك الاختبار التجريبي — منطق نقي بلا DOM كي يُفحص بمعزل عن الواجهة.
  المبدآن الثابتان:
  ١) خلط فيشر-ييتس للأسئلة ولمواضع الخيارات — عادل رياضيًا.
  ٢) تتبّع الإجابة الصحيحة بالموضع الرقمي لا بالحرف — الحروف تنكسر عند الخلط.
*/
const Exam = {
  // rng قابل للحقن: الفحوص تمرّر مولّدًا حتميًا فتصير النتائج قابلة للتكرار
  shuffle(arr, rng){
    const r = rng || Math.random;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  },

  /* اختيار الأسئلة: النطاق ثم أولوية ما أُخطئ فيه سابقًا */
  select(questions, opts){
    opts = opts || {};
    let pool = questions.slice();
    if (opts.scope === 'topic' && opts.topic) pool = pool.filter(q => q.topic === opts.topic);
    if (opts.scope === 'important') pool = pool.filter(q => q.important);
    if (opts.scope === 'wrong') pool = pool.filter(q => (opts.wrongMap || {})[q.id]);

    const wrongMap = opts.wrongMap || {};
    // الأسئلة الخاطئة سابقًا تتقدّم: نخلط كل فئة على حدة ثم نقدّم الخاطئة
    const wrong = Exam.shuffle(pool.filter(q => wrongMap[q.id]), opts.rng);
    const rest  = Exam.shuffle(pool.filter(q => !wrongMap[q.id]), opts.rng);
    let picked = wrong.concat(rest);
    if (opts.count && opts.count < picked.length) picked = picked.slice(0, opts.count);
    return picked;
  },

  create(questions, opts){
    opts = opts || {};
    const picked = Exam.select(questions, opts);
    const items = picked.map(q => {
      // خلط مواضع الخيارات مع تتبّع موضع الصحيح رقميًا
      const order = Exam.shuffle(q.options.map((_, i) => i), opts.rng);
      return {
        id: q.id, q: q.q, topic: q.topic || '',
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.answer),   // الموضع الجديد للإجابة الصحيحة
        translation: q.translation || '', expl_ar: q.expl_ar || ''
      };
    });
    return {
      items,
      i: 0,
      answers: new Array(items.length).fill(null),
      mode: opts.mode || 'instant',        // فوري (افتراضي) أو بعد الانتهاء
      timerMin: opts.timerMin || 0,
      startedAt: opts.now || Date.now(),
      finished: false
    };
  },

  answer(exam, choice){
    if (exam.finished || exam.answers[exam.i] !== null) return null;
    const item = exam.items[exam.i];
    const correct = choice === item.correct;
    exam.answers[exam.i] = { choice, correct };
    return { correct, correctIndex: item.correct };
  },

  next(exam){ if (exam.i < exam.items.length - 1) exam.i++; return exam.i; },
  prev(exam){ if (exam.i > 0) exam.i--; return exam.i; },

  grade(pct){
    if (pct >= 90) return 'ممتاز';
    if (pct >= 80) return 'جيد جدًا';
    if (pct >= 70) return 'جيد';
    if (pct >= 60) return 'مقبول';
    return 'يحتاج مراجعة';
  },

  finish(exam, now){
    exam.finished = true;
    const total = exam.items.length;
    const correct = exam.answers.filter(a => a && a.correct).length;
    const pct = total ? Math.round(correct / total * 1000) / 10 : 0;

    // تحليل حسب المحاور: أين القوة وأين الخلل
    const byTopic = {};
    exam.items.forEach((item, idx) => {
      const t = item.topic || 'عام';
      byTopic[t] = byTopic[t] || { total:0, correct:0 };
      byTopic[t].total++;
      if (exam.answers[idx] && exam.answers[idx].correct) byTopic[t].correct++;
    });

    return {
      total, correct, pct,
      grade: Exam.grade(pct),
      duration_s: Math.round(((now || Date.now()) - exam.startedAt) / 1000),
      byTopic,
      wrongIds: exam.items.filter((it, idx) => !exam.answers[idx] || !exam.answers[idx].correct).map(it => it.id),
      review: exam.items.map((it, idx) => ({
        q: it.q, options: it.options, correct: it.correct,
        chosen: exam.answers[idx] ? exam.answers[idx].choice : null,
        ok: !!(exam.answers[idx] && exam.answers[idx].correct),
        expl_ar: it.expl_ar
      }))
    };
  }
};
AMUSQ.exam = Exam;


/* ===== 30-views.js ===== */
/*
  شاشات المرحلة ٠: فارغة عمدًا.
  لا مواد ولا أسئلة مكتوبة داخل الكود — المحتوى يأتي كلّه لاحقًا من قاعدة البيانات
  بعد أن يعتمده المشرف. هذه الشاشات تُثبت أن الهيكل والتنقّل والمظهر يعملون.
*/
// el و esc معرّفتان في 00-core.js داخل نفس النطاق، فلا نُعيد تعريفهما

function page(title, sub, body){
  const head = el('header', { class:'page__head' }, [
    el('h1', { class:'page__title', text:title }),
    sub ? el('p', { class:'page__sub', text:sub }) : null
  ]);
  return el('div', { class:'page' }, [head].concat(body || []));
}

function empty(ico, title, text, action){
  return el('div', { class:'card' }, [
    el('div', { class:'empty' }, [
      el('span', { class:'empty__ico', 'aria-hidden':'true', text:ico }),
      el('p', { class:'empty__title', text:title }),
      el('p', { class:'empty__text', text:text }),
      action || null
    ])
  ]);
}

function stageNote(){
  return el('p', { class:'row' }, [
    el('span', { class:'badge badge--warn', text:'المرحلة ٠ · الهيكل' }),
    el('span', { class:'badge', text:'المحتوى يُضاف من لوحة التحكم' })
  ]);
}

/* ١ · الرئيسية — بطاقات المواد: «موادي» ثم «مواد أخرى متاحة» */
function subjectColor(c){
  // اللون اسم متغيّر من نظام التصميم — لا hex حر من قاعدة البيانات
  return /^subject-[1-6]$/.test(c || '') ? 'var(--' + c + ')' : 'var(--subject-1)';
}
function daysLeft(dateStr, now){
  if (!dateStr) return null;
  const d = new Date(dateStr).getTime() - (now || Date.now());
  return Math.ceil(d / 86400000);
}
function mySubjects(){ return AMUSQ.store.get('my_subjects', []); }

function subjectCard(sub){
  const mine = mySubjects().indexOf(sub.id) !== -1;
  const left = daysLeft(sub.exam_date);
  const past = left !== null && left < 0;
  const pct = AMUSQ.progress.pctDone(sub.id, sub.q_count);
  const color = subjectColor(sub.color);

  const card = el('article', { class:'card subj' + (past ? ' is-past' : ''), tabindex:'0', role:'link',
    'aria-label':'مادة ' + sub.name }, [
    el('div', { class:'subj__bar', style:'background:' + color, 'aria-hidden':'true' }),
    el('div', { class:'row' }, [
      el('span', { class:'subj__ico', 'aria-hidden':'true', text: sub.icon || '▤' }),
      el('div', {}, [
        el('h3', { style:'margin:0', text: sub.name }),
        el('span', { class:'badge num', text: sub.q_count + ' سؤالًا' })
      ]),
      el('span', { class:'spacer' }),
      past ? el('span', { class:'stamp', text:'تم الانتهاء ✓' })
           : (left !== null ? el('span', { class:'badge badge--warn num', text:'الاختبار بعد ' + left + ' يوم' }) : null),
      sub.free ? el('span', { class:'badge badge--ok', text:'مجانية' }) : null
    ]),
    el('div', { class:'subj__meter', 'aria-label':'أنجزت ' + pct + '٪' }, [
      el('div', { style:'width:' + pct + '%;background:' + color })
    ])
  ]);
  card.addEventListener('click', () => AMUSQ.router.go('#/subject/' + sub.id));
  card.addEventListener('keydown', e => { if (e.key === 'Enter') AMUSQ.router.go('#/subject/' + sub.id); });
  return card;
}

const ViewHome = {
  title:'الرئيسية',
  view(){
    // الزائر يرى صفحة تعريفية تشرح وتُقنع؛ والطالب المسجَّل يرى مواده فورًا.
    // السبب: لكلٍّ حاجة مختلفة — إقناع أولًا، ومذاكرة سريعة ثانيًا.
    if (!AMUSQ.api.user()) return AMUSQ.views.landingView();

    const pack = AMUSQ.data.pack();
    const subjects = (pack.subjects || []).slice();
    const body = [];

    if (pack.settings && pack.settings.welcome_text)
      body.push(el('div', { class:'card' }, [ el('p', { style:'margin:0', text: pack.settings.welcome_text }) ]));

    if (!subjects.length) {
      body.push(empty('▤', 'لا مواد بعد',
        AMUSQ.config.ready()
          ? 'لم تُنشر مواد حتى الآن — عد قريبًا، أو تأكد من الاتصال لمزامنة الجديد.'
          : 'المنصة تبدأ فارغة عن قصد. يضيف المشرف المواد من لوحة التحكم وستظهر هنا فور نشرها.',
        el('div', { class:'row', style:'justify-content:center;margin-top:16px' }, [
          el('a', { class:'btn', href:'#/admin', text:'افتح لوحة التحكم' })
        ])));
      body.push(el('div', { class:'grid grid--2', id:'subjectsGrid' }));
      return page('موادي', 'اختر مادة لتبدأ المراجعة.', body);
    }

    // المنتهية تنزل آخر القائمة تلقائيًا
    const order = arr => arr.slice().sort((x, y) => {
      const px = (daysLeft(x.exam_date) ?? 1) < 0 ? 1 : 0;
      const py = (daysLeft(y.exam_date) ?? 1) < 0 ? 1 : 0;
      return px - py || (x.ord || 0) - (y.ord || 0);
    });
    const mineIds = mySubjects();
    const mine = order(subjects.filter(su => mineIds.indexOf(su.id) !== -1));
    const other = order(subjects.filter(su => mineIds.indexOf(su.id) === -1));

    if (mine.length) {
      body.push(el('h2', { text:'موادي' }));
      body.push(el('div', { class:'grid grid--2', id:'subjectsGrid' }, mine.map(subjectCard)));
    }
    if (other.length) {
      body.push(el('h2', { text: mine.length ? 'مواد أخرى متاحة' : 'المواد المتاحة' }));
      body.push(el('div', { class:'grid grid--2', id: mine.length ? null : 'subjectsGrid' }, other.map(su => {
        const c = subjectCard(su);
        const add = el('button', { class:'btn btn--sm btn--soft', type:'button',
          'aria-label':'أضف ' + su.name + ' إلى موادي', text:'+ أضف إلى موادي' });
        add.addEventListener('click', e => {
          e.stopPropagation();
          const list = mySubjects();
          if (list.indexOf(su.id) === -1) { list.push(su.id); AMUSQ.store.set('my_subjects', list); }
          AMUSQ.api.rest('enrollments', { method:'POST', body: JSON.stringify({
            user_id: (AMUSQ.api.user() || {}).id, subject_id: su.id }) });

function loginCard(opts){
  // بطاقة دخول واحدة للطالب والمشرف — الفرق في العنوان والوجهة بعد النجاح فقط
  const email = el('input', { class:'input', type:'email', id:opts.emailId,

  const btn = el('button', { class:'btn btn--block', type:'button', text:'أرسل رابط الدخول' });
  const msg = el('p', { class:'field__hint', role:'status' });

  async function send(){
    const val = (email.value || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val)) { msg.textContent = 'اكتب بريدًا صحيحًا أولًا.'; email.focus(); return; }
    if (!AMUSQ.config.ready()) { msg.textContent = 'المنصة غير موصولة بالخادم بعد — يضبطها المشرف من الإعدادات.'; return; }
    btn.setAttribute('aria-disabled','true'); btn.textContent = 'جارٍ الإرسال…';
    const r = await AMUSQ.api.auth.magic(val);
    btn.removeAttribute('aria-disabled'); btn.textContent = 'أرسل رابط الدخول';
    if (r.ok) { msg.textContent = 'تم! افتح بريدك واضغط رابط الدخول.'; AMUSQ.toast('أُرسل رابط الدخول'); }
    else if (r.offline) msg.textContent = 'لا اتصال بالإنترنت — الدخول يحتاج اتصالًا مرة واحدة فقط.';
    else msg.textContent = 'تعذّر الإرسال. تحقق من البريد وحاول ثانية.';
  }
  btn.addEventListener('click', send);
  email.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  const gBtn = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'الدخول بحساب جوجل' });
  const aBtn = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'الدخول بحساب آبل' });

  return el('div', { class:'card stack' }, [
    el('label', { class:'field', style:'margin:0' }, [
      el('span', { class:'field__label', text: opts.label }),
      email,
      el('span', { class:'field__hint', text:'يصلك رابط دخول بلا كلمة مرور.' })
    ]),
    btn, msg,
    el('hr', { class:'divider', style:'margin:0' }),
    gBtn, aBtn
  ]);
}

/* ===== 33-admin.js ===== */
/*
  لوحة تحكم المشرف — قلب المشروع.
  البوابة الحقيقية هي قاعدة البيانات (RLS + is_admin)؛ الواجهة هنا مجرد مرآة:
  حتى لو عبث أحد بالمتصفح فلن يقرأ صفًا واحدًا ليس له.
*/
const Admin = {
  /* هل الجلسة الحالية لمشرف؟ نسأل قاعدة البيانات مرة ونخزّن الجواب للجلسة */
  async check(){
    if (!AMUSQ.api.user()) return false;
    const cached = AMUSQ.store.get('is_admin_check', null);
    if (cached && cached.uid === AMUSQ.api.user().id) return cached.ok;
    const r = await AMUSQ.api.myProfile();
    const ok = !!(r.ok && r.data && r.data.is_admin);
    AMUSQ.store.set('is_admin_check', { uid: AMUSQ.api.user().id, ok });
    return ok;
  },

  /* رابط دوال الخادم: على Vercel هو نفس الأصل، ومن file:// يضبطه المشرف مرة واحدة */
  apiBase(){
    const c = AMUSQ.store.get('api_base', '');
    if (c) return c.replace(/\/+$/,'');
    return (typeof location !== 'undefined' && location.protocol.indexOf('http') === 0) ? '' : null;
  },
  async server(path, body){
    const base = Admin.apiBase();
    const f = AMUSQ.api.fetchFn();
    if (base === null || !f) return { ok:false, offline:true };
    try{
      const res = await f(base + path, {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(body || {})
      });
      const data = await res.json().catch(() => null);
      return { ok: res.ok, status: res.status, data };
    } catch(e){ return { ok:false, offline:true, err:e.message }; }
  },

  /* ===== معالج الرفع — أربع خطوات، حالته قابلة للفحص بمعزل عن الواجهة ===== */
  BATCH: 25,   // حد دفعة الذكاء — يحمي من مهلة الخادم ويسمح باستئناف الرفع
  chunk(arr, n){
    const out = [];
    for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    return out;
  },
  newWizard(){
    return { step:1, filename:'', raw:[], enriched:[], draftId:null, done:0, total:0, error:'' };
  },
  // تقدير التكلفة قبل التشغيل: عدد الأسئلة والدفعات — يقرّر المشرف على بيّنة
  estimate(w){
    return { questions: w.raw.length, batches: Admin.chunk(w.raw, Admin.BATCH).length };
  },

  async wizardIngest(w, filename, base64){
    const r = await Admin.server('/api/ingest', { filename, content_base64: base64 });
    if (!r.ok) { w.error = (r.data && r.data.error) || 'تعذّر الاتصال بالخادم'; return w; }
    w.filename = filename; w.raw = r.data.questions; w.total = r.data.total;
    w.step = 2; w.error = '';
    return w;
  },

  // «افهمه بالذكاء» على دفعات: المسوّدة تُحفظ بعد كل دفعة فيمكن إغلاق الصفحة والعودة
  async wizardEnrich(w, onProgress){
    const batches = Admin.chunk(w.raw, Admin.BATCH);
    for (let i = 0; i < batches.length; i++) {
      // لا إعادة معالجة لما اكتمل — الاستئناف يبدأ من حيث توقّف
      if (w.done >= (i + 1) * Admin.BATCH) continue;
      const r = await Admin.server('/api/ai', { questions: batches[i] });
      if (!r.ok) { w.error = (r.data && r.data.error) || 'انقطعت الدفعة ' + (i + 1); return w; }
      w.enriched = w.enriched.concat(r.data.questions);
      w.done = Math.min(w.enriched.length, w.total);
      await Admin.saveDraft(w);
      if (onProgress) onProgress(w.done, w.total);
    }
    if (w.done >= w.total) { w.step = 3; w.error = ''; }
    return w;
  },

  async saveDraft(w){
    const body = {
      name: w.filename.replace(/\.[^.]+$/, ''),
      source_name: w.filename,
      status: w.done >= w.total ? 'reviewing' : 'processing',
      payload: w.enriched, total: w.total, done: w.done,
      updated_at: new Date().toISOString()
    };
    if (w.draftId) {
      return AMUSQ.api.rest('drafts?id=eq.' + w.draftId, { method:'PATCH', body: JSON.stringify(body) });
    }
    body.created_by = (AMUSQ.api.user() || {}).id;
    const r = await AMUSQ.api.rest('drafts?select=id', {
      method:'POST',
      headers: Object.assign(AMUSQ.api.headers(), { 'Prefer':'return=representation' }),
      body: JSON.stringify(body)
    });
    if (r.ok && r.data && r.data[0]) w.draftId = r.data[0].id;
    return r;
  },

  // الاعتماد: نداء واحد ذرّي في قاعدة البيانات — إما كل شيء أو لا شيء
  approve(w, publish){
    return AMUSQ.api.rpc('approve_draft', { draft_id: w.draftId, publish });
  },

  // كشف المكرر بتشابه نصي بسيط: نفس الأحرف الدنيا بعد إزالة الفراغات — يوسم لا يحذف
  findDuplicates(questions){
    const seen = new Map(), dups = [];
    questions.forEach((q, i) => {
      const key = String(q.q || '').toLowerCase().replace(/\s+/g, ' ').trim();
      if (seen.has(key)) dups.push({ index: i, firstIndex: seen.get(key) });
      else seen.set(key, i);
    });
    return dups;
  }
};

            ])) : [el('p', { class:'page__sub', text:'لا محاولات لهذا الطالب.' })]);
          row.parentNode.insertBefore(det, row.nextSibling);
        }, { once:true });
        return row;
      }));
      box.appendChild(tbl);
    });
}
