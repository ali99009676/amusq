/* ===== 35-subject.js ===== */
/*
  صفحة المادة — أربعة تبويبات: نظرة عامة · الشرح · بنك الأسئلة · طريقة الحفظ.
  الأسئلة تُجلب مرة واحدة ثم من جهاز الطالب (IndexedDB) — تعمل بعدها بلا إنترنت.
  البنك مصمَّم لخمسمئة سؤال: عرض على دفعات، وأقسام مطوية افتراضيًا.
*/
const SUBJ_TABS = [
  { id:'overview', label:'نظرة عامة' },
  { id:'explain',  label:'الشرح' },
  { id:'bank',     label:'بنك الأسئلة' },
  { id:'memo',     label:'طريقة الحفظ' }
];
const BANK_PAGE = 50;   // دفعة العرض — التمرير يطلب المزيد بدل رسم ٥٠٠ عنصر دفعة واحدة

function findSubject(sid){
  return (QBANK.data.pack().subjects || []).filter(s => s.id === sid)[0] || null;
}

/* شريط سؤال واحد في البنك (وضع القائمة) */
function bankRow(sub, q, prog){
  const starred = !!prog.star[q.id];
  const starBtn = el('button', { class:'iconbtn', type:'button',
    'aria-label': starred ? 'أزل النجمة' : 'ميّز بنجمة', 'aria-pressed': String(starred) }, [
    el('span', { class:'iconbtn__ico', text: starred ? '★' : '☆',
      style: starred ? 'color:var(--star)' : '' })
  ]);
  starBtn.addEventListener('click', () => {
    QBANK.progress.toggleStar(sub.id, q.id);
    QBANK.router.render(location.hash);
  });

  const opts = el('div', { class:'stack q__opts', hidden:true },
    q.options.map((opt, oi) => {
      const right = oi === q.answer;
      return el('div', { class:'opt' + (right ? ' is-answer' : '') }, [
        el('span', { class:'opt__l', 'aria-hidden':'true', text: QBANK.views.optLetter(oi) }),
        el('span', { class:'ltr', text: opt }),
        right ? el('span', { class:'opt__tag', text:'الإجابة' }) : null,
        el('span', { class:'opt__mark', 'aria-hidden':'true', text: right ? '✓' : '' })
      ]);
    }));
  const trans = el('p', { class:'field__hint', hidden:true, text: q.translation || 'لا ترجمة بعد.' });
  const transBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'عرض الترجمة' });
  transBtn.addEventListener('click', () => {
    trans.hidden = !trans.hidden;
    transBtn.textContent = trans.hidden ? 'عرض الترجمة' : 'إخفاء الترجمة';
  });

  const head = el('button', { class:'rowbtn', type:'button', 'aria-expanded':'false' }, [
    el('span', { class:'ltr q__text', text: q.q })
  ]);
  // رقم السؤال في الهامش — يُقرأ بصوت مسموع: «افتح سؤال ٤٧»
  const num = el('span', { class:'qitem__n', 'aria-hidden':'true',
    text: QBANK.views.arNum((q.ord || 0) + 1) });
  head.addEventListener('click', () => {
    const open = opts.hidden;
    opts.hidden = !open;
    head.setAttribute('aria-expanded', String(open));
    if (open) QBANK.progress.markSeen(sub.id, q.id);   // فتح السؤال = رُوجع
  });

  return el('article', { class:'q qitem', 'data-qid': q.id }, [
    num,
    el('div', { class:'row' }, [
      head, starBtn,
      // ★ البلاغ عند السؤال نفسه لا في آخر الصفحة: من يرى الخطأ يراه هنا،
      //   وزرٌّ بعيد عن موضع المشكلة لا يُضغط
      QBANK.trust ? QBANK.trust.reportButton(sub.id, q.id) : null,
      prog.wrong[q.id] ? el('span', { class:'badge badge--bad num', text:'أخطأت ×' + prog.wrong[q.id] }) : null,
      q.important ? el('span', { class:'badge badge--warn', text:'مهم' }) : null
    ]),
    opts, el('div', { class:'row' }, [transBtn]), trans
  ]);
}

/* بطاقة مقلوبة (وضع البطاقات) */
function flipCard(sub, q){
  const card = el('div', { class:'flip', tabindex:'0', role:'button', 'aria-label':'بطاقة: اضغط لقلبها' }, [
    el('div', { class:'flip__in' }, [
      el('div', { class:'flip__face' }, [ el('p', { class:'ltr q__text', text: q.q }) ]),
      el('div', { class:'flip__face flip__face--back' }, [
        el('p', { class:'ltr', style:'font-weight:700', text: q.options[q.answer] }),
        q.expl_ar ? el('p', { class:'field__hint', text: q.expl_ar }) : null
      ])
    ])
  ]);
  const flip = () => {
    card.classList.toggle('is-flipped');
    QBANK.progress.markSeen(sub.id, q.id);
  };
  card.addEventListener('click', flip);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  return card;
}

/* تبويب البنك: بحث + فلاتر + وضعان + أقسام مطوية بالمحاور */
function bankTab(sub, questions){
  const state = QBANK.store.get('bank_ui', { filter:'all', mode:'list' });
  const prog = QBANK.progress.forSubject(sub.id);
  const box = el('div', { class:'stack' });

  const search = el('input', { class:'input', type:'search', id:'bankSearch',
    placeholder:'ابحث في ' + questions.length + ' سؤالًا…', 'aria-label':'بحث في بنك الأسئلة' });

  const FILTERS = [
    ['all','الكل'], ['unseen','لم أراجعه'], ['wrong','أخطأت فيه'], ['star','بنجمة']
  ];
  const filters = el('div', { class:'row', role:'group', 'aria-label':'تصفية الأسئلة' },
    FILTERS.map(([id, label]) => {
      const b = el('button', { class:'btn btn--sm ' + (state.filter === id ? 'btn--soft' : 'btn--ghost'),
        type:'button', 'aria-pressed': String(state.filter === id), text: label });
      b.addEventListener('click', () => {
        state.filter = id; QBANK.store.set('bank_ui', state);
        QBANK.router.render(location.hash);
      });
      return b;
    }));

  const modeBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button',
    text: state.mode === 'list' ? 'وضع البطاقات ▦' : 'وضع القائمة ☰' });
  modeBtn.addEventListener('click', () => {
    state.mode = state.mode === 'list' ? 'cards' : 'list';
    QBANK.store.set('bank_ui', state);
    QBANK.router.render(location.hash);
  });
  filters.appendChild(el('span', { class:'spacer' }));
  filters.appendChild(modeBtn);

  const listBox = el('div', { class:'stack', id:'bankList' });

  function applyFilters(){
    const term = (search.value || '').trim().toLowerCase();
    return questions.filter(q => {
      if (state.filter === 'unseen' && prog.seen[q.id]) return false;
      if (state.filter === 'wrong' && !prog.wrong[q.id]) return false;
      if (state.filter === 'star' && !prog.star[q.id]) return false;
      if (term && (q.q + ' ' + q.options.join(' ')).toLowerCase().indexOf(term) === -1) return false;
      return true;
    });
  }

  function render(){
    listBox.innerHTML = '';
    const filtered = applyFilters();
    if (!filtered.length) {
      listBox.appendChild(QBANK.views.empty('؟', 'لا نتائج', 'جرّب فلترًا آخر أو كلمة بحث أقصر.'));
      return;
    }
    // أقسام حسب المحاور — مطوية افتراضيًا مع عدد أسئلة كل قسم
    const topics = {};
    filtered.forEach(q => { const t = q.topic || 'عام'; (topics[t] = topics[t] || []).push(q); });
    Object.keys(topics).forEach(t => {
      const qs = topics[t];
      const inner = el('div', { class: state.mode === 'cards' ? 'grid grid--2' : 'stack' });
      let shown = 0;
      const more = el('button', { class:'btn btn--soft btn--block', type:'button' });
      function fill(){
        // دفعات العرض: ٥٠ سؤالًا في كل طلب — البنك يظل سلسًا على ٥٠٠ سؤال
        const next = qs.slice(shown, shown + BANK_PAGE);
        next.forEach(q => inner.appendChild(state.mode === 'cards' ? flipCard(sub, q) : bankRow(sub, q, prog)));
        shown += next.length;
        more.textContent = 'عرض المزيد (' + (qs.length - shown) + ' متبقٍ)';
        more.hidden = shown >= qs.length;
      }
      more.addEventListener('click', fill);
      fill();
      const fold = el('details', { class:'fold' }, [
        el('summary', {}, [ t + ' ', el('span', { class:'badge num', text: qs.length + ' سؤالًا' }) ]),
        inner, more
      ]);
      if (Object.keys(topics).length === 1) fold.setAttribute('open','');
      listBox.appendChild(fold);
    });
  }
  let debounce = null;
  search.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(render, 150); });

  render();
  box.appendChild(search); box.appendChild(filters); box.appendChild(listBox);
  return box;
}

/* تبويب الشرح: مطوي لكل سؤال — لماذا الصحيح صحيح ولماذا غيره خاطئ */
function explainTab(sub, questions){

    el('details', { class:'fold card card--flat' }, [
      el('summary', {}, [ el('span', { class:'badge num', text:'س' + (i + 1) }), ' ',
        el('span', { class:'ltr', text: q.q.slice(0, 90) + (q.q.length > 90 ? '…' : '') }) ]),
      el('div', { class:'stack' }, [
        el('p', { class:'ltr', style:'font-weight:700;color:var(--ok)', text:'✓ ' + q.options[q.answer] }),
        el('p', { text: q.expl_ar || 'الشرح يُضاف من لوحة التحكم.' }),
        q.expl_en ? el('p', { class:'ltr field__hint', text: q.expl_en }) : null
      ])
    ])));
}

/* تبويب طريقة الحفظ: التحليل الشامل أولًا ثم بطاقات الأسئلة */
function memoTab(sub, questions){
  const box = el('div', { class:'stack' });

  /*
    ★ «طريقة الحفظ» الشاملة قبل البطاقات الفردية.
    الجداول والحيل المنحوتة («مُتّت»، «قهأب») تُلخّص المادة كلها — يقرؤها
    الطالب أولًا فتعطيه الهيكل، ثم بطاقات الأسئلة تملؤه. عكس الترتيب يغرقه
    في التفاصيل قبل الخريطة.
  */
  const slot = el('div', { class:'stack' });
  box.appendChild(slot);
  if (QBANK.analysis) QBANK.analysis.get(sub.id).then(a => {
    if (!slot.isConnected || !a) return;
    if (a.memorize) slot.appendChild(el('div', { class:'card' }, [ QBANK.views.analysisHtml(a.memorize) ]));
    if (a.mistakes) slot.appendChild(el('div', { class:'card stack' }, [
      el('h2', { text:'الأخطاء الشائعة' }),
      QBANK.views.analysisHtml(a.mistakes)
    ]));
  });

  const withMemo = questions.filter(q => q.mnemonic && (q.mnemonic.cue || q.mnemonic.key));
  if (!withMemo.length){
    box.appendChild(QBANK.views.empty('🧠', 'لا بطاقات حفظ للأسئلة بعد', 'تُبنى بطاقات الحفظ مع معالجة الذكاء وتظهر هنا.'));
    return box;
  }
  box.appendChild(el('div', { class:'stack' }, withMemo.map(q => {
    const m = q.mnemonic;
    return el('div', { class:'card stack' }, [
      el('div', { class:'row' }, [
        el('span', { class:'badge', text:'الكلمة الدالة' }),
        el('span', { class:'ltr', style:'font-weight:700', text: m.cue || '—' }),
        el('span', { 'aria-hidden':'true', text:'←' }),
        el('span', { class:'badge badge--ok', text:'المفتاح' }),
        el('span', { class:'ltr', style:'font-weight:700', text: m.key || '—' })
      ]),
      m.link ? el('p', { style:'margin:0', text:'🔗 ' + m.link }) : null,
      m.strike ? el('p', { class:'field__hint', style:'margin:0', text:'✂ ' + m.strike }) : null
    ]);
  })));
  return box;
}

/* تبويب النظرة العامة */
function overviewTab(sub, questions){
  const prog = QBANK.progress.forSubject(sub.id);
  const pct = QBANK.progress.pctDone(sub.id, questions.length);

  /* «عن المادة» المحلَّلة والمحاور بعدّاداتها — تصل غير متزامنة فتملأ فتحتها */
  const aSlot = el('div', { class:'stack' });
  if (QBANK.analysis) QBANK.analysis.get(sub.id).then(a => {
    if (!aSlot.isConnected || !a) return;
    if (a.overview){
      aSlot.appendChild(el('div', { class:'card stack' }, [
        el('h2', { text:'عن المادة' }),
        QBANK.views.analysisHtml(a.overview)
      ]));
      /* الاحتياط (الوصف القصير وشارات المحاور) ينسحب حين يصل الأصل */
      const root = aSlot.parentNode;
      if (root) root.querySelectorAll('[data-fallback]').forEach(x => x.remove());
    }
    const tc = QBANK.views.topicsCard(a);
    if (tc) aSlot.appendChild(tc);
    /* تحليل بَطَل (أُضيفت أسئلة بعده) يُعاد توليده تلقائيًا لصاحبه */
    QBANK.analysis.maybeRefresh(sub, a, () => {
      QBANK.analysis.get(sub.id, true).then(() => {
        if (aSlot.isConnected) QBANK.router.render(location.hash);
      });
    });
  });

  return el('div', { class:'stack' }, [
    aSlot,
    sub.descr ? el('div', { class:'card', 'data-fallback':'1' }, [ el('p', { style:'margin:0', text: sub.descr }) ]) : null,
    el('div', { class:'card stack' }, [
      el('h2', { text:'تقدّمك' }),
      el('div', { class:'subj__meter' }, [ el('div', { style:'width:' + pct + '%;background:' + QBANK.views.subjectColor(sub.color) }) ]),
      el('div', { class:'row' }, [
        el('span', { class:'badge num', text:'راجعت ' + Object.keys(prog.seen).length + ' من ' + questions.length }),
        el('span', { class:'badge badge--bad num', text:'أخطاء ' + Object.keys(prog.wrong).length }),
        el('span', { class:'badge num', text:'اختبارات ' + prog.exams }),
        prog.best ? el('span', { class:'badge badge--ok num', text:'أفضل نتيجة ' + prog.best + '٪' }) : null
      ])
    ]),
    /* شارات المحاور القديمة احتياطٌ لمادة بلا تحليل — topicsCard أغنى منها */
    (sub.topics && sub.topics.length) ? el('div', { class:'card', 'data-fallback':'1' }, [
      el('h2', { text:'المحاور' }),
      el('div', { class:'row' }, sub.topics.map(t => el('span', { class:'badge', text: t })))
    ]) : null,
    /* نبض المادة: الرقم الذي يُبقي الطالب مستيقظًا ليلة الامتحان */
    QBANK.community ? QBANK.community.pulseBand(sub.id) : null,
    QBANK.community ? QBANK.community.challengeBox(sub) : null,
    /* التقييم أسفل الشاشة لا أعلاها: يُقيّم من راجع، ومن راجع وصل إلى هنا */
    QBANK.trust ? el('div', { class:'card stack' }, [
      el('div', { class:'row', style:'justify-content:space-between;align-items:center' }, [
        el('h2', { style:'margin:0', text:'قيّم هذه المادة' }),
        el('div', { class:'row' }, QBANK.trust.badges(sub))
      ]),
      el('p', { class:'field__hint', style:'margin:0',
        text:'تقييمك يرفع البنوك النافعة إلى أعلى نتائج زملائك — ويُنزل ما دونها.' }),
      QBANK.trust.ratingWidget(sub)
    ]) : null
  ]);
}

/*
  تجديد القائمة ثم إعادة المحاولة — مرة واحدة.
  لو أخفقنا ثانيةً فالمادة غير متاحة فعلًا (أُخفيت، أو لم تُشترَ بعد، أو
  الرابط خطأ)، وحينها فقط نقولها. والفشل بلا اتصال يُقال باسمه: «تعذّر
  الوصول» غير «غير موجودة» — الأولى تُعاد المحاولة فيها، والثانية تُيئِس.
*/
function refetchThenSubject(sid, title){
  const box = el('div', { class:'stack' }, [
    el('p', { class:'page__sub', text:'جارٍ تحديث قائمة المواد…' }) ]);

  QBANK.data.refreshPack().then(r => {
    if (!box.isConnected) return;                 // غادر الطالب — لا نلمس شاشة أخرى
    if (findSubject(sid)){
      // نُعيد رسم المسار نفسه — لا نُنقل الطالب، فهو حيث أراد أن يكون
      try { return void QBANK.router.render(location.hash || '#/'); }
      catch(e){ return; }
    }
    box.innerHTML = '';
    box.appendChild(r && r.ok === false && r.offline
      ? QBANK.views.empty('⚡', 'تعذّر الوصول',
          'لا اتصال الآن. المادة قد تكون موجودة — أعد المحاولة حين يعود الإنترنت.',
          el('a', { class:'btn', href:'#/', text:'الرئيسية' }))
      : QBANK.views.empty('؟', 'المادة غير متاحة',
          'ربما أوقفها المشرف، أو تغيّر رابطها، أو لم تُنشر بعد.',
          el('a', { class:'btn', href:'#/explore', text:'استكشف المواد' })));
  });

  return QBANK.views.page(title || 'المادة', null, [box]);
}

const ViewSubject = {
  title:'المادة',
  view(route){
    const sid = route.rest[0];
    const sub = findSubject(sid);
    /*
      ★ «غير موجودة» ليست حقيقة عن القاعدة — هي حقيقة عن نسخةٍ في هذا الجهاز.
      قائمة المواد تُجلب مرة عند الإقلاع وتبقى في التخزين المحلي. فمادةٌ
      نُشرت بعدها — نشرتَها أنت قبل ثوانٍ، أو نشرها زميلك وأرسل لك رابطها،
      أو أضفتَها من جوّالك وفتحتها على حاسوبك — ليست فيها. فكنّا نقول
      للطالب «غير موجودة» ونحن لم نسأل الخادم أصلًا.
      نسأل مرة، ثم نحكم.
    */
    if (!sub) return refetchThenSubject(sid);

    QBANK.gate.captureRef(route.query);          // ?ref= يُحفظ قبل أي شيء آخر
    QBANK.trial.stop();                          // مغادرة مادة توقف عدّادها

    // بوابة المحتوى: مادة غير مملوكة تعرض بطاقة الشراء لا المحتوى.
    // نعرض بالتخمين المحلي فورًا (لا وميض)، ثم نصحّح بقرار القاعدة حين يصل.
    const guess = QBANK.gate.localGuess(sub);
    if (!guess.allowed) {
      const box = el('div', {}, [ QBANK.gate.paywallCard(sub) ]);
      return QBANK.views.page(sub.name, null, [box]);
    }

    const active = SUBJ_TABS.some(t => t.id === route.rest[1]) ? route.rest[1] : 'overview';
    const tabs = el('div', { class:'tabs', role:'tablist' }, SUBJ_TABS.map(t =>
      el('button', { class:'tabs__btn', type:'button', role:'tab', 'data-tab': t.id,
        'aria-selected': String(t.id === active), text: t.label })));
    tabs.addEventListener('click', e => {
      const b = e.target.closest('[data-tab]');
      if (b) QBANK.router.go('#/subject/' + sid + '/' + b.getAttribute('data-tab'));
    });

    const body = el('div', { class:'stack', id:'subjBody' },
      [ el('p', { class:'page__sub', text:'جارٍ تجهيز الأسئلة…' }) ]);

    // شريط التجربة يُعلَّق فوق التبويبات متى قالت القاعدة إن الوصول بالتجربة
    const trialSlot = el('div', {});
    QBANK.trial.access(sid).then(a => {
      if (!trialSlot.isConnected || !a) return;   // null = تعذّر السؤال، لا رفض
      if (a.reason === 'trial'){
        trialSlot.appendChild(QBANK.trial.start(sid, Number(a.seconds_left), () => {
          QBANK.router.render(location.hash);    // انتهت: نعيد الرسم فتظهر شاشة الشراء
        }));
      } else if (a.reason === 'entitled' && a.owner && a.hours_left != null){
        /* ★ مدّةٌ تنتهي بلا إعلان تبدو خيانة.
           الرافع يفتح مادته اليوم فيظنّها ملكه أبدًا، فإن أُقفلت غدًا فجأة
           شعر أنه أُخذ منه شيء. الرقم المعلن يجعلها اتفاقًا لا مفاجأة. */
        trialSlot.appendChild(el('div', { class:'card ownerband' }, [
          el('p', { style:'margin:0', text:'▣ هذه مادتك — رفعتَها أنت.' }),
          el('p', { class:'field__hint', style:'margin:0', text:
            Number(a.hours_left) > 0
              ? 'وصولك المجاني ينتهي بعد ' + QBANK.views.arNum(Number(a.hours_left)) + ' ساعة.'
              : 'وصولك المجاني ينتهي قريبًا.' })
        ]));
      } else if (!a.allowed){
        // القاعدة رفضت رغم تخميننا — قرارها هو النافذ
        const p = trialSlot.closest('#main') || trialSlot.parentNode;
        if (p){
          p.innerHTML = '';
          p.appendChild(a.reason === 'trial_expired'
            ? QBANK.trial.expiredCard(sub) : QBANK.gate.paywallCard(sub));
        }
      }
    });

    QBANK.data.subjectQuestions(sid).then(r => {
      if (!body.isConnected) return;
      body.innerHTML = '';
      if (!r.ok && !r.data.length) {
        body.appendChild(QBANK.views.empty('⇣', 'الأسئلة لم تُنزَّل بعد',
          'افتح المادة مرة واحدة بإنترنت لتُخزَّن أسئلتها في جهازك، ثم تعمل بلا اتصال.'));
        return;
      }
      const qs = r.data;
      const fill = { overview: overviewTab, explain: explainTab, bank: bankTab, memo: memoTab }[active];
      body.appendChild(fill(sub, qs));
    });

    const printBtn = el('button', { class:'copybtn', type:'button', text:'🖨 طباعة / PDF' });
    printBtn.addEventListener('click', () => QBANK.views.openPrintDialog(sub));
    const shareBtn = el('button', { class:'copybtn', type:'button', text:'⎘ نسخ الرابط' });
    shareBtn.addEventListener('click', () => {
      try{
        navigator.clipboard.writeText(location.origin + location.pathname + '#/subject/' + sid);
        QBANK.toast('نُسخ رابط المادة');
      }catch(e){ QBANK.toast('تعذّر النسخ'); }
    });

    /*
      رأس AMSU: تدرّج بلون المادة من حافة الشاشة لحافتها، أيقونة في صندوق
      زجاجي، الاسم وتحته الإنجليزي، رقائق إحصائية، وزر الاختبار على الطرف.
    */
    const nTopics = (sub.topics && sub.topics.length) || 0;
    const hero = el('section', { class:'sub-hero', style:'--acc:' + subjectColor(sub.color) }, [
      el('div', { class:'wrap' }, [
        el('div', { class:'herotop' }, [
          el('a', { class:'backbtn', href:'#/', text:'‹ كل المواد' }),
          el('div', { class:'topacts' }, [shareBtn, printBtn])
        ]),
        el('div', { class:'inner' }, [
          el('div', { class:'figwrap', 'aria-hidden':'true' }, [
            el('span', { class:'fig', text: sub.icon || '▤' })
          ]),
          el('div', { class:'hx' }, [
            el('h2', { text: sub.name }),
            sub.name_en ? el('div', { class:'sub ltr', text: sub.name_en }) : null,
            el('div', { class:'stats num' }, [
              el('span', { class:'stat', text: QBANK.views.arNum(sub.q_count || 0) + ' سؤالًا' }),
              nTopics ? el('span', { class:'stat', text: QBANK.views.arNum(nTopics) + ' محاور' }) : null,
              sub.free ? el('span', { class:'stat', text:'مجانية' }) : null
            ])
          ]),
          el('a', { class:'hero-exam', href:'#/exam/' + sid }, [
            el('span', {}, [
              document.createTextNode('اختبار تجريبي'),
              el('small', { text:'في هذه المادة' })
            ])
          ])
        ])
      ])
    ]);

    return el('div', { class:'page page--subject' }, [
      hero,
      trialSlot,
      /* عدّاد كل طالبٍ لموعده هو — الشُّعب تختلف، وموعدك لا يخص زميلك */
      QBANK.examDate ? QBANK.examDate.band(sid) : null,
      tabs, body
    ]);
  }
};
QBANK.views.ViewSubject = ViewSubject;
QBANK.views.bankTab = bankTab;


/* ===== 36-examview.js ===== */
/*
  واجهة الاختبار التجريبي — المادة مثبّتة من مسار الدخول فلا خطوة اختيار.
  المحرك في 24-exam.js؛ هنا الشاشات الثلاث: الإعداد ← الأسئلة ← النتيجة.
*/
let examState = null;   // {exam, sub, timerId, secondsLeft}

function examSetup(sub, questions){
  const prog = QBANK.progress.forSubject(sub.id);
  const topics = Array.from(new Set(questions.map(q => q.topic || 'عام')));

  const scopeSel = el('select', { class:'input', id:'exScope', 'aria-label':'نطاق الاختبار' }, [
    el('option', { value:'all', text:'كل الأسئلة (' + questions.length + ')' }),
    el('option', { value:'important', text:'الأسئلة المهمة (' + questions.filter(q => q.important).length + ')' }),
    el('option', { value:'wrong', text:'أخطائي السابقة (' + Object.keys(prog.wrong).length + ')' })
  ].concat(topics.map(t => el('option', { value:'topic:' + t, text:'قسم: ' + t }))));

  const timerSel = el('select', { class:'input', id:'exTimer', 'aria-label':'المؤقت' }, [
    el('option', { value:'0', text:'بلا مؤقت' }),
    el('option', { value:'10', text:'١٠ دقائق' }),
    el('option', { value:'20', text:'٢٠ دقيقة' }),
    el('option', { value:'45', text:'٤٥ دقيقة' })
  ]);

  // التصحيح الفوري بعد كل سؤال هو الافتراضي
  const modeSel = el('select', { class:'input', id:'exMode', 'aria-label':'نمط التصحيح' }, [
    el('option', { value:'instant', text:'تصحيح فوري بعد كل سؤال (الافتراضي)' }),
    el('option', { value:'end', text:'التصحيح بعد الانتهاء' })
  ]);

  const start = el('button', { class:'btn btn--block', type:'button', text:'ابدأ الاختبار' });
  start.addEventListener('click', () => {
    const sv = scopeSel.value;
    const opts = {
      scope: sv.indexOf('topic:') === 0 ? 'topic' : sv,
      topic: sv.indexOf('topic:') === 0 ? sv.slice(6) : '',
      mode: modeSel.value,
      timerMin: parseInt(timerSel.value, 10),
      wrongMap: prog.wrong
    };
    const exam = QBANK.exam.create(questions, opts);
    if (!exam.items.length) { QBANK.toast('لا أسئلة في هذا النطاق'); return; }
    examState = { exam, sub, secondsLeft: opts.timerMin * 60, timerId: null };
    if (opts.timerMin) {
      examState.timerId = setInterval(() => {
        examState.secondsLeft--;
        const t = document.getElementById('exClock');
        if (t) {
          t.textContent = Math.floor(examState.secondsLeft / 60) + ':' + String(examState.secondsLeft % 60).padStart(2,'0');
          t.classList.toggle('is-low', examState.secondsLeft <= 60);
        }
        if (examState.secondsLeft <= 0) finishExam();   // انتهى الوقت: تسليم تلقائي
      }, 1000);
    }
    QBANK.router.render(location.hash);
  });

  return el('div', { class:'card stack' }, [
    el('h2', { text:'إعداد الاختبار' }),
    el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'النطاق' }), scopeSel ]),
    el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'المؤقت' }), timerSel ]),
    el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'التصحيح' }), modeSel ]),
    el('p', { class:'field__hint', text:'الأسئلة التي أخطأت فيها سابقًا لها أولوية الظهور، والخيارات تُخلط في كل مرة.' }),
    start
  ]);
}

function finishExam(){
  const st = examState;
  if (!st || st.exam.finished) return;
  if (st.timerId) clearInterval(st.timerId);
  st.result = QBANK.exam.finish(st.exam);
  // تسجيل المحاولة: محليًا فورًا، وللحساب في الخلفية
  QBANK.progress.recordExam(st.sub.id, st.result.pct);
  st.result.wrongIds.forEach(qid => QBANK.progress.markWrong(st.sub.id, qid));
  st.exam.items.forEach((it, i) => {
    if (st.exam.answers[i] && st.exam.answers[i].correct) QBANK.progress.clearWrong(st.sub.id, it.id);
  });
  if (QBANK.api.user()) QBANK.api.rest('attempts', { method:'POST', body: JSON.stringify({
    user_id: QBANK.api.user().id, subject_id: st.sub.id, scope:'all', topic:'',
    correct: st.result.correct, total: st.result.total, pct: st.result.pct,
    duration_s: st.result.duration_s }) });
  QBANK.router.render(location.hash);
}

function examRunner(){
  const st = examState;
  const exam = st.exam;
  const item = exam.items[exam.i];
  const answered = exam.answers[exam.i];

  const opts = el('div', { class:'stack q__opts' }, item.options.map((opt, oi) => {
    let cls = 'opt', mark = '';
    if (answered && exam.mode === 'instant') {
      // فوري: اللون والأيقونة معًا — ✓ للصحيح و ✗ للاختيار الخاطئ
      if (oi === item.correct) { cls += ' is-answer'; mark = '✓'; }
      else if (oi === answered.choice) { cls += ' is-wrong'; mark = '✗'; }
    } else if (answered && answered.choice === oi) { cls += ' is-answer'; mark = '●'; }
    const b = el('button', { class: cls, type:'button', disabled: answered ? true : null }, [
      el('span', { class:'opt__l', 'aria-hidden':'true', text: QBANK.views.optLetter(oi) }),
      el('span', { class:'ltr', text: opt }),
      el('span', { class:'opt__mark', 'aria-hidden':'true', text: mark })
    ]);
    b.addEventListener('click', () => {
      QBANK.exam.answer(exam, oi);
      QBANK.router.render(location.hash);
    });
    return b;
  }));

  const answeredCount = exam.answers.filter(a => a !== null).length;
  const nav = el('div', { class:'row' }, [
    el('button', { class:'btn btn--ghost btn--sm', type:'button', id:'exPrev',
      disabled: exam.i === 0 ? true : null, text:'→ السابق' }),
    el('span', { class:'spacer' }),
    el('span', { class:'badge num', text: (exam.i + 1) + ' / ' + exam.items.length }),
    st.secondsLeft ? el('span', { class:'timer badge num', id:'exClock',
      text: Math.floor(st.secondsLeft / 60) + ':' + String(st.secondsLeft % 60).padStart(2,'0') }) : null,
    el('span', { class:'spacer' }),
    exam.i < exam.items.length - 1
      ? el('button', { class:'btn btn--sm', type:'button', id:'exNext', text:'التالي ←' })
      : el('button', { class:'btn btn--sm', type:'button', id:'exFinish',
          text:'أنهِ الاختبار (' + answeredCount + '/' + exam.items.length + ')' })
  ]);
  nav.addEventListener('click', e => {
    if (e.target.id === 'exPrev') { QBANK.exam.prev(exam); QBANK.router.render(location.hash); }
    if (e.target.id === 'exNext') { QBANK.exam.next(exam); QBANK.router.render(location.hash); }
    if (e.target.id === 'exFinish') finishExam();
  });

  return el('div', { class:'stack' }, [
    el('div', { class:'card stack q' }, [
      el('p', { class:'ltr q__text', text: item.q }), opts,
      (answered && exam.mode === 'instant' && item.expl_ar)
        ? el('p', { class:'field__hint', text: item.expl_ar }) : null
    ]),
    nav
  ]);
}

function examResult(){
  const st = examState, r = st.result;
  const topicRows = Object.keys(r.byTopic).map(t => {
    const d = r.byTopic[t];
    const pct = Math.round(d.correct / d.total * 100);
    return el('div', { class:'row' }, [
      el('span', { text: t }),
      el('span', { class:'spacer' }),
      el('span', { class:'badge num ' + (pct >= 70 ? 'badge--ok' : 'badge--bad'), text: d.correct + '/' + d.total })
    ]);
  });
  const retryWrong = el('button', { class:'btn btn--soft btn--block', type:'button',
    text:'أعد اختبار الأخطاء فقط (' + r.wrongIds.length + ')' , disabled: r.wrongIds.length ? null : true });
  retryWrong.addEventListener('click', async () => {
    const qs = (await QBANK.data.subjectQuestions(st.sub.id)).data;
    const wrongSet = {};
    r.wrongIds.forEach(id => wrongSet[id] = 1);
    const exam = QBANK.exam.create(qs, { scope:'wrong', wrongMap: wrongSet, mode: st.exam.mode });
    examState = { exam, sub: st.sub, secondsLeft: 0, timerId: null };
    QBANK.router.render(location.hash);
  });

  const review = el('details', { class:'fold' }, [
    el('summary', {}, ['مراجعة كاملة للأسئلة']),
    el('div', { class:'stack' }, r.review.map((rv, i) => el('div', { class:'card card--flat stack q' }, [
      el('div', { class:'row' }, [
        el('span', { class:'badge num', text:'س' + (i + 1) }),
        rv.ok ? el('span', { class:'badge badge--ok', text:'✓ صحيح' })
              : el('span', { class:'badge badge--bad', text:'✗ خطأ' })
      ]),
      el('p', { class:'ltr q__text', text: rv.q }),
      el('div', { class:'stack q__opts' }, rv.options.map((o, oi) =>
        el('div', { class:'opt' + (oi === rv.correct ? ' is-answer' : (oi === rv.chosen ? ' is-wrong' : '')) }, [
          el('span', { class:'opt__l', 'aria-hidden':'true', text: QBANK.views.optLetter(oi) }),
          el('span', { class:'ltr', text: o }),
          oi === rv.correct ? el('span', { class:'opt__tag', text:'الإجابة' }) : null,
          el('span', { class:'opt__mark', 'aria-hidden':'true', text: oi === rv.correct ? '✓' : (oi === rv.chosen ? '✗' : '') })
        ]))),
      rv.expl_ar ? el('p', { class:'field__hint', text: rv.expl_ar }) : null
    ])))
  ]);

  return el('div', { class:'stack' }, [
    el('div', { class:'card', style:'text-align:center' }, [
      el('div', { class:'result__pct num', text: r.pct + '٪' }),
      el('div', { class:'result__grade', text: r.grade }),
      el('p', { class:'page__sub num', text: r.correct + ' من ' + r.total + ' · ' + Math.round(r.duration_s / 60) + ' دقيقة' })
    ]),
    el('div', { class:'card stack' }, [ el('h2', { text:'حسب المحاور' }) ].concat(topicRows)),
    retryWrong, review,

    if (!sub) return refetchThenSubject(sid, 'اختبار');

/* ===== 37-print.js ===== */
/*
  الطباعة / PDF — تنسيق مستقل تمامًا عن الشاشة:
  يبني وثيقة داخل حاوية مخفية تظهر وحدها عند الطباعة، بترويسة بلون المادة،
  وأسئلة لا تنقسم بين صفحتين، وتذييل يتكرر أسفل كل صفحة.
*/
function buildPrintDoc(sub, questions, opts){
  const root = el('div', { class:'print-root' + (opts.economic ? ' print--eco' : ''), dir:'rtl' });
  root.appendChild(el('header', { class:'print-head', style: opts.economic ? '' :
    'border-color:' + QBANK.views.subjectColor(sub.color) }, [
    el('h1', { text: sub.name }),
    el('p', { text: { bank:'بنك الأسئلة', explain:'الشرح', memo:'بطاقات الحفظ',
                      overview:'نظرة عامة', full:'المادة كاملة' }[opts.what] })
  ]));

  let qs = questions;
  if (opts.range === 'important') qs = qs.filter(q => q.important);
  if (opts.range === 'starred') {
    const star = QBANK.progress.forSubject(sub.id).star;
    qs = qs.filter(q => star[q.id]);
  }

  if (opts.what === 'overview') {
    root.appendChild(el('p', { text: sub.descr || '' }));
    (sub.topics || []).forEach(t => root.appendChild(el('p', { text:'• ' + t })));
  } else if (opts.what === 'full') {
    /*
      ★ المادة كاملة — ورقة ليلة الاختبار.
      «عن المادة» ثم كل سؤال بخياراته وإجابته وشرحه، ثم «طريقة الحفظ»
      و«الأخطاء الشائعة» بجداولها. طالب كثيرون يذاكرون من الورق آخر ليلة،
      وهذه الوثيقة تغنيه عن فتح الشاشة أصلًا.
    */
    if (opts.analysis && opts.analysis.overview){
      root.appendChild(el('h2', { text:'عن المادة' }));
      root.appendChild(QBANK.views.analysisHtml(opts.analysis.overview));
    }
    qs.forEach((q, i) => {
      const block = el('div', { class:'q print-q' }, [
        el('p', { class:'ltr', style:'font-weight:700', text: (i + 1) + ') ' + q.q })
      ]);
      q.options.forEach((o, oi) => {
        const isAns = oi === q.answer;
        block.appendChild(el('p', { class:'ltr print-opt' + (isAns ? ' print-ans' : ''),
          text: String.fromCharCode(65 + oi) + ') ' + o + (isAns ? '  ✓' : '') }));
      });
      if (q.expl_ar) block.appendChild(el('p', { class:'print-expl', text: q.expl_ar }));
      root.appendChild(block);
    });
    if (opts.analysis && opts.analysis.memorize){
      root.appendChild(el('h2', { text:'طريقة الحفظ' }));
      root.appendChild(QBANK.views.analysisHtml(opts.analysis.memorize));
    }
    if (opts.analysis && opts.analysis.mistakes){
      root.appendChild(el('h2', { text:'الأخطاء الشائعة' }));
      root.appendChild(QBANK.views.analysisHtml(opts.analysis.mistakes));
    }
  } else if (opts.what === 'memo') {
    qs.forEach((q, i) => {
      const m = q.mnemonic || {};
      if (!m.cue && !m.key) return;
      root.appendChild(el('div', { class:'q print-q' }, [
        el('p', { text: (i + 1) + ') ' + (m.cue || '') + ' ← ' + (m.key || '') }),
        m.link ? el('p', { text:'🔗 ' + m.link }) : null
      ]));
    });
  } else {
    qs.forEach((q, i) => {
      const block = el('div', { class:'q print-q' }, [
        el('p', { class:'ltr', style:'font-weight:700', text: (i + 1) + ') ' + q.q })
      ]);
      q.options.forEach((o, oi) => {
        const isAns = oi === q.answer && opts.answers;
        block.appendChild(el('p', { class:'ltr print-opt' + (isAns ? ' print-ans' : ''),
          text: String.fromCharCode(65 + oi) + ') ' + o + (isAns ? '  ✓' : '') }));
      });
      if (opts.expl && q.expl_ar) block.appendChild(el('p', { class:'print-expl', text: q.expl_ar }));
      if (opts.translation && q.translation) block.appendChild(el('p', { class:'print-expl', text: q.translation }));
      root.appendChild(block);
    });
  }

  // التذييل الثابت أسفل كل صفحة — يفرضه تنسيق الطباعة
  root.appendChild(el('footer', { class:'print-foot', text:'برمجة وتصميم علي الصقور' }));
  return root;
}

function openPrintDialog(sub){
  const old = document.querySelector('.print-root, .print-dialog');
  if (old) old.remove();

  const what = el('select', { class:'input' }, [
    el('option', { value:'full', text:'المادة كاملة — أسئلة وشرح وطريقة حفظ' }),
    el('option', { value:'bank', text:'بنك الأسئلة' }),
    el('option', { value:'explain', text:'الشرح' }),
    el('option', { value:'memo', text:'بطاقات الحفظ' }),
    el('option', { value:'overview', text:'نظرة عامة' })
  ]);
  const range = el('select', { class:'input' }, [
    el('option', { value:'all', text:'كل الأسئلة' }),
    el('option', { value:'important', text:'المهمة فقط' }),
    el('option', { value:'starred', text:'ما ميّزته بنجمة' })
  ]);
  function check(label, checked){
    const c = el('input', { type:'checkbox' });
    c.checked = checked;
    return { node: el('label', { class:'row' }, [c, el('span', { text: label })]), input: c };
  }
  const ans = check('إظهار الإجابات', true);
  const expl = check('إظهار الشرح', false);
  const trans = check('إظهار الترجمة', false);
  const eco = check('وضع اقتصادي (حبر أقل)', false);

  const go = el('button', { class:'btn btn--block', type:'button', text:'اطبع الآن' });
  const cancel = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'إلغاء' });
  const dialog = el('div', { class:'card print-dialog', role:'dialog', 'aria-label':'خيارات الطباعة' }, [
    el('h2', { text:'طباعة / PDF' }),
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'ماذا تطبع؟' }), what ]),
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'النطاق' }), range ]),
    ans.node, expl.node, trans.node, eco.node, go, cancel
  ]);
  cancel.addEventListener('click', () => dialog.remove());
  go.addEventListener('click', async () => {
    const r = await QBANK.data.subjectQuestions(sub.id);
    // «المادة كاملة» تحتاج التحليل — يُجلب هنا لا مع كل فتح للحوار
    const analysis = (what.value === 'full' && QBANK.analysis)
      ? await QBANK.analysis.get(sub.id) : null;
    const doc = buildPrintDoc(sub, r.data, {
      what: what.value, range: range.value, analysis,
      answers: ans.input.checked, expl: expl.input.checked,
      translation: trans.input.checked, economic: eco.input.checked
    });
    document.body.appendChild(doc);
    dialog.remove();
    window.print();
    // بعد الطباعة تُزال الوثيقة كي لا تبقى في DOM
    setTimeout(() => doc.remove(), 500);
  });
  document.body.appendChild(dialog);
}

QBANK.views.openPrintDialog = openPrintDialog;
QBANK.views.buildPrintDoc = buildPrintDoc;


/* ===== 38-landing.js ===== */
/*
  صفحة الهبوط التعريفية — تُعرض للزائر غير المسجَّل فقط.
  الطالب المسجَّل يرى بطاقات مواده مباشرة كما كان، فلا نضيف له خطوة.

  ★ قاعدة هذه الصفحة: شرحُ عمل المنصة فقط — ولا مادة واحدة بعينها.

  السبب أن المقررات تختلف من جامعة إلى جامعة ومن كلية إلى كلية. فزائر من
  القاهرة يرى هنا مواد جامعة نجران فيظن أن المنصة لا تخصّه، أو أسوأ: يظن
  أن هذه هي كل موادها. المكان الصحيح للمواد هو «استكشف» حيث يبحث الطالب
  عن جامعته ويرى ما يخصّه هو. أما الصفحة الأولى فتُجيب عن سؤال واحد:
  ما هذه المنصة وكيف تعمل؟
*/
/*
  رفّ الكتب — التوقيع البصري للمنصة.

  رفّ مجرَّد لا يُبنى من مواد حقيقية: هو صورة لفكرة «بنك الأسئلة» لا عرضٌ
  لمخزون. تفاوت سُمك الكعوب وأطوالها ثابت مقصود، كي تبقى الصورة نفسها لكل
  زائر مهما اختلف ما في القاعدة.
*/
function shelfSvg(){
  const NS = 'http://www.w3.org/2000/svg';
  const W = 640, H = 116, FLOOR = 96;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'lp-shelf');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'رفّ كتب — صورة تعبيرية لبنوك الأسئلة');

  // أوزان ثابتة: الصورة واحدة لكل زائر، ولا تُفسَّر كإحصاء
  const WEIGHTS = [46, 30, 58, 38, 52, 34, 44, 60, 36];

  let x = 12;
  WEIGHTS.forEach((w, i) => {
    const bw = 26 + Math.round(w / 60 * 34);
    const bh = 46 + ((i * 7) % 22);                     // تفاوت الطول: رفّ لا مسطرة
    const col = 'var(--subject-' + ((i % 6) + 1) + ')';
    const g = document.createElementNS(NS, 'g');

    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', x); r.setAttribute('y', FLOOR - bh);
    r.setAttribute('width', bw); r.setAttribute('height', bh);
    r.setAttribute('rx', 3); r.setAttribute('fill', col);
    r.setAttribute('class', 'lp-shelf__book');
    r.style.setProperty('--d', (i * 90) + 'ms');        // تتابع الظهور
    g.appendChild(r);

    // شريطان مذهّبان على الكعب — تفصيلة الكتاب المجلَّد
    [10, 18].forEach(off => {
      const ln = document.createElementNS(NS, 'rect');
      ln.setAttribute('x', x + 5); ln.setAttribute('y', FLOOR - bh + off);
      ln.setAttribute('width', Math.max(4, bw - 10)); ln.setAttribute('height', 2);
      ln.setAttribute('fill', 'var(--gold)'); ln.setAttribute('opacity', '.65');
      g.appendChild(ln);
    });
    svg.appendChild(g);
    x += bw + 5;
  });

  // لوح الرفّ
  const shelf = document.createElementNS(NS, 'rect');
  shelf.setAttribute('x', 0); shelf.setAttribute('y', FLOOR);
  shelf.setAttribute('width', Math.max(x + 8, 220)); shelf.setAttribute('height', 5);
  shelf.setAttribute('rx', 2.5); shelf.setAttribute('class', 'lp-shelf__plank');
  svg.appendChild(shelf);
  return svg;
}

/*
  الأجزاء النافعة في صفحة الهبوط — لا تسويق بل أدوات يستفيد منها الطالب قبل التسجيل:
  سؤال يجرّبه فعلًا، بطاقة حفظ حيّة، ونصائح مراجعة مبنية على أدلة.
  (حُذف عدّاد الامتحانات: كان يُبنى من مواد جامعة بعينها، والصفحة الأولى
   صارت شرحًا للمنصة لا عرضًا لمحتواها.)
*/

/* ===== ١ · سؤال تجريبي حقيقي — يجيب عنه الزائر ويرى الشرح فورًا =====
   العيّنة تدور بين التخصصات (انظر 39-demos.js)، وموسومة كعيّنة تعليمية
   لا تُنسب لملف دكتور. */
function lpTryQuestion(demo){
  const LP_DEMO = demo || QBANK.demos.at(0);
  const box = el('div', { class:'lp-try' });
  const feedback = el('div', { class:'lp-try__fb', hidden:true, role:'status' });
  let answered = false;

  const opts = el('div', { class:'lp-try__opts' }, LP_DEMO.options.map((text, i) => {
    const b = el('button', { class:'opt', type:'button' }, [
      el('span', { class:'opt__mark', 'aria-hidden':'true' }),
      el('span', { class:'ltr', text })
    ]);
    b.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      const right = i === LP_DEMO.answer;
      // نعلّم كل الخيارات: الصحيح دائمًا، والخاطئ المختار — باللون والأيقونة معًا
      opts.querySelectorAll('.opt').forEach((node, j) => {
        node.disabled = true;
        if (j === LP_DEMO.answer) { node.classList.add('is-answer'); node.firstChild.textContent = '✓'; }
        else if (j === i) { node.classList.add('is-wrong'); node.firstChild.textContent = '✗'; }
      });
      feedback.hidden = false;
      feedback.className = 'lp-try__fb ' + (right ? 'is-ok' : 'is-no');
      feedback.innerHTML = '';
      feedback.appendChild(el('b', { text: right ? '✓ إجابة صحيحة' : '✗ ليست الإجابة الصحيحة' }));
      feedback.appendChild(el('p', { style:'margin:0 0 8px', text: LP_DEMO.why }));
      feedback.appendChild(el('p', { class:'field__hint', style:'margin:0', text: LP_DEMO.wrong }));
    });
    return b;
  }));

  const transBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'عرض الترجمة' });
  const trans = el('p', { class:'field__hint', hidden:true, text: LP_DEMO.q_ar });
  transBtn.addEventListener('click', () => {
    trans.hidden = !trans.hidden;
    transBtn.textContent = trans.hidden ? 'عرض الترجمة' : 'إخفاء الترجمة';
  });

  box.appendChild(el('div', { class:'row', style:'margin-bottom:12px' }, [
    el('span', { class:'badge', text:'عيّنة تعليمية' }),
    el('span', { class:'badge badge--ok', text: LP_DEMO.tag })
  ]));
  box.appendChild(el('p', { class:'lp-try__q ltr', text: LP_DEMO.q }));
  box.appendChild(opts);
  box.appendChild(feedback);
  box.appendChild(el('div', { class:'row', style:'margin-top:12px' }, [transBtn]));
  box.appendChild(trans);
  return box;
}

/* ===== ٢ · بطاقة حفظ حيّة — يقلبها الزائر ليرى كيف تعمل ===== */
function lpMemoCard(demo){
  const m = (demo || QBANK.demos.at(0)).mnemonic;
  let flipped = false;
  const card = el('div', { class:'lp-memo', tabindex:'0', role:'button', 'aria-label':'بطاقة حفظ — اضغط لقلبها' });

  function paint(){
    card.innerHTML = '';
    if (!flipped) {
      card.appendChild(el('p', { class:'lp-memo__hint', text:'وجه البطاقة · اضغط للقلب' }));
      card.appendChild(el('p', { class:'ltr', style:'font-weight:700;font-size:1.05rem', text: m.cue }));
      card.appendChild(el('p', { class:'field__hint', style:'margin:0', text:'ما الكلمة الدالة التي تربطها بالإجابة؟' }));
    } else {
      card.appendChild(el('p', { class:'lp-memo__hint', text:'الوجه الخلفي' }));
      card.appendChild(el('div', { class:'lp-memo__chain' }, [
        el('span', { class:'ltr', text: m.cue }),
        el('span', { 'aria-hidden':'true', text:'←' }),
        el('span', { class:'lp-memo__k ltr', text: m.key })
      ]));
      card.appendChild(el('p', { class:'field__hint', style:'margin:0', text:'🔗 ' + m.link }));
    }
  }
  const flip = () => { flipped = !flipped; paint(); };
  card.addEventListener('click', flip);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  paint();
  return card;
}

function boot(){
  if (QBANK.ready) return;   // الإقلاع مرة واحدة مهما تكرّر نداؤه
  QBANK.store.migrate();     // ننقل تخزين الهوية القديمة قبل أن يقرأه أحد
  QBANK.data.migrateDB();    // وأسئلة وضع عدم الاتصال — بلا انتظار، فهي ليست شرطًا للإقلاع
  QBANK.theme.init();

  // رموز الدخول تعود من Supabase في هاش الصفحة — نلتقطها قبل أن يفسّرها الموجّه كمسار
  if (QBANK.api.auth.captureFromHash(location.hash)) {
    try { history.replaceState(null, '', location.pathname + location.search + '#/'); }
    catch(e) { location.hash = '#/'; }
    QBANK.toast('تم تسجيل الدخول');
  }

  buildTabbar();
  registerRoutes();
  QBANK.router.init();
  registerSW();
  QBANK.ready = true;

  // أعمال الخلفية: لا تُعطّل الرسم الأول ولا تكسر العمل بلا إنترنت
  if (QBANK.api.user()) {
    QBANK.progress.pull();                       // دمج تقدّم الحساب مع الجهاز — بلا حذف
    QBANK.gate.refresh();                        // الاستحقاقات: ما اشتراه الطالب
    QBANK.api.rpc('heartbeat', { device_label: navigator.userAgent.slice(0, 60) });
  }
  if (QBANK.config.ready()) {
    QBANK.data.refreshPack().then(r => {         // تحديث قائمة المواد إن توفّر اتصال
      if (r.ok && QBANK.router.current && QBANK.router.current.path === '#/') QBANK.router.render('#/');
    });
  }
}

// PWA: عامل الخدمة يُسجَّل على https فقط — file:// يعمل بلا حاجة إليه أصلًا
function registerSW(){
  if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return false;
  if (location.protocol !== 'https:') return false;
  navigator.serviceWorker.register('sw.js').catch(() => {});   // فشله لا يعطل المنصة
  return true;
}

/* ===== 41-admin-charts.js ===== */
/*
  رسوم اللوحة — SVG مبني بيدنا لا مكتبة رسم.
  السبب: قاعدة «لا مكتبة خارجية في المتصفح»، والرسوم التي نحتاجها بسيطة
  (أعمدة وخط ومقاييس) فكتابتها أرخص من أي مكتبة وأخف على الجوال.
*/
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  if (attrs) Object.keys(attrs).forEach(k => {
    if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, String(attrs[k]));
  });
  return n;
}

/* أعمدة النشاط اليومي + خط متوسط النتيجة فوقها */
function chartActivity(series){
  const W = 640, H = 170, PAD_B = 22, PAD_T = 10;
  const svg = svgEl('svg', { class:'ad-chart', viewBox:'0 0 ' + W + ' ' + H,
    preserveAspectRatio:'none', role:'img', 'aria-label':'نشاط الاختبارات اليومي' });
  const n = series.length || 1;
  const maxN = Math.max(1, ...series.map(s => Number(s.n)));
  const bw = W / n, gap = Math.min(6, bw * .25);
  const plotH = H - PAD_B - PAD_T;

  // خطوط شبكة أفقية — ثلاثة تكفي لقراءة المقياس بلا ضجيج
  [0, .5, 1].forEach(f => {
    const y = PAD_T + plotH * (1 - f);
    svg.appendChild(svgEl('line', { class:'grid', x1:0, y1:y, x2:W, y2:y }));
    svg.appendChild(Object.assign(svgEl('text', { class:'lbl', x:2, y:y - 3 }),
      { textContent: String(Math.round(maxN * f)) }));
  });

  series.forEach((s, i) => {
    const v = Number(s.n);
    const h = Math.max(v > 0 ? 3 : 2, plotH * (v / maxN));
    svg.appendChild(svgEl('rect', {
      class: 'bar' + (v ? '' : ' bar--empty'),
      x: i * bw + gap / 2, y: PAD_T + plotH - h,
      width: Math.max(2, bw - gap), height: h, rx: 3
    }));
    // تسمية اليوم: نعرض كل يومين على الجوال كي لا تتداخل
    if (n <= 8 || i % 2 === 0) {
      const day = String(s.d).slice(8, 10);
      svg.appendChild(Object.assign(
        svgEl('text', { class:'lbl', x: i * bw + bw / 2, y: H - 6, 'text-anchor':'middle' }),
        { textContent: day }));
    }
  });

  // خط متوسط النتيجة — يقرأ على مقياس ٠–١٠٠ لا على مقياس العدد
  const pts = series.map((s, i) => [i * bw + bw / 2, PAD_T + plotH * (1 - Number(s.avg) / 100)]);
  if (pts.some((p, i) => Number(series[i].avg) > 0)) {
    svg.appendChild(svgEl('path', { class:'line',
      d: pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') }));
    pts.forEach((p, i) => { if (Number(series[i].avg) > 0)
      svg.appendChild(svgEl('circle', { class:'dot', cx:p[0], cy:p[1], r:2.4 })); });
  }
  return svg;
}

/* شرائح النتائج — أشرطة أفقية تُقرأ أسرع من دائرة */
function chartBuckets(buckets){
  const total = buckets.reduce((n, b) => n + Number(b.n), 0) || 1;
  const COLORS = ['var(--bad)','var(--warn)','var(--star)','var(--brand-2)','var(--ok)'];
  return el('div', {}, buckets.map((b, i) => {
    const pct = Number(b.n) / total * 100;
    return el('div', { class:'ad-bucket' }, [
      el('span', { class:'ad-bucket__l', text: b.label }),
      el('span', { class:'ad-bucket__t' }, [
        el('span', { class:'ad-bucket__f', style:'width:' + pct.toFixed(1) + '%;background:' + COLORS[i] })
      ]),
      el('span', { class:'ad-bucket__n', text: String(b.n) })
    ]);
  }));
}

/* بطاقة مؤشر */
function kpi(n, label, sub, tone){
  return el('div', { class:'ad-kpi' + (tone ? ' ad-kpi--' + tone : '') }, [
    el('span', { class:'ad-kpi__n', text: String(n) }),
    el('span', { class:'ad-kpi__l', text: label }),
    sub ? el('span', { class:'ad-kpi__s', text: sub }) : null
  ]);
}

/* وقت نسبي مختصر */
function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'الآن';
  if (s < 3600) return Math.floor(s / 60) + ' د';
  if (s < 86400) return Math.floor(s / 3600) + ' س';
  return Math.floor(s / 86400) + ' يوم';
}

QBANK.admin = QBANK.admin || {};
QBANK.admin.charts = { chartActivity, chartBuckets, kpi, ago, svgEl };

function adminDashTab(box){
  const C = QBANK.admin.charts;
  let days = QBANK.store.get('ad_days', 14);

  const rangeBar = el('div', { class:'ad-bar' },
    [7, 14, 30].map(d => {
      const b = el('button', { class:'btn btn--sm ' + (d === days ? '' : 'btn--ghost'), type:'button',
        text: d + ' يومًا' });
      b.addEventListener('click', () => { QBANK.store.set('ad_days', d); days = d; load(); });
      return b;
    }));
  const wrap = el('div', {});
  box.appendChild(rangeBar);
  box.appendChild(wrap);

  function load(){
    // نعيد بناء شريط المدى ليعكس الاختيار الجديد
    rangeBar.querySelectorAll('button').forEach((b, i) => {
      b.className = 'btn btn--sm ' + ([7,14,30][i] === days ? '' : 'btn--ghost');
    });
    wrap.innerHTML = '';
    wrap.appendChild(dashSkeleton());
    QBANK.api.rpc('admin_dashboard', { days }).then(r => {
      if (!wrap.isConnected) return;     // غادر المشرف قبل وصول الرد
      wrap.innerHTML = '';
      if (!r.ok || !r.data || r.data.error) {
        wrap.appendChild(QBANK.views.empty('⚠', 'تعذّر الجلب',
          r.offline ? 'لا اتصال بالإنترنت.'
                    : 'تأكد أن حسابك مشرف وأن ملف ADMIN-DASHBOARD.sql مُشغَّل على قاعدة البيانات.'));
        return;
      }
      const d = r.data;
      const total = (d.series || []).reduce((n, s) => n + Number(s.n), 0);
      wrap.appendChild(dashKpis(d.kpi));
      wrap.appendChild(el('div', { class:'ad-panels ad-panels--2' }, [
        dashPanel('النشاط اليومي', total + ' اختبارًا خلال ' + days + ' يومًا',
          C.chartActivity(d.series || [])),
        dashPanel('توزيع النتائج', 'الخط البرتقالي = متوسط النتيجة',
          C.chartBuckets(d.buckets || []))
      ]));
      wrap.appendChild(el('div', { class:'ad-panels' }, [
        dashPanel('أداء المواد', 'اضغط مادة لفتح محررها', dashSubjects(d.subjects || [])),
        dashPanel('آخر النشاط', null, dashRecent(d.recent || []))
      ]));
    });
  }
  load();
}

/* ===== 43-admin-subject.js ===== */
/*
  محرر المادة — كل ما يخصّ مادة واحدة في شاشة واحدة: هويتها، محاورها، وأسئلتها.

  قرار جوهري: نصّ السؤال وخياراته لا يُعدَّلان هنا ولا في أي مكان (قاعدة القداسة).
  ما يملك المشرف تعديله هو ما أضفناه نحن حول النص: موضع الإجابة، المحور، الشرح،
  الترجمة، بطاقة الحفظ، علامة الأهمية، والترتيب. الخطأ في نصّ الدكتور يُصلَح
  برفع الملف من جديد لا بالكتابة فوقه.
*/
const SUBJ_COLORS = ['subject-1','subject-2','subject-3','subject-4','subject-5','subject-6'];
const SUBJ_ICONS  = ['▤','☤','✚','♥','◈','⚕','☣','◐','⌁','⚗'];

const SubjEditor = {
  patchSubject(id, body){
    return QBANK.api.rest('subjects?id=eq.' + id, { method:'PATCH', body: JSON.stringify(body) });
  },
  patchQuestion(id, body){
    return QBANK.api.rest('questions?id=eq.' + id, { method:'PATCH', body: JSON.stringify(body) });
  },
  delQuestion(id){
    return QBANK.api.rest('questions?id=eq.' + id, { method:'DELETE' });
  },
  /* تصفية محلية: البحث في مادة واحدة لا يستحق ذهابًا إلى الخادم مع كل حرف */
  filter(list, q, topic, only){
    const needle = String(q || '').trim().toLowerCase();
    return list.filter(x => {
      if (topic && (x.topic || '') !== topic) return false;
      if (only === 'important' && !x.important) return false;
      if (only === 'derived'   && !x.derived)   return false;
      if (only === 'noexpl'    && x.expl_ar)    return false;
      if (!needle) return true;
      return (x.q + ' ' + (x.options || []).join(' ')).toLowerCase().indexOf(needle) !== -1;
    });
  }
};

/* ===== بطاقة هوية المادة ===== */
function subjIdentity(sub, refresh){
  const nameIn  = el('input', { class:'input', value: sub.name || '' });
  const descrIn = el('textarea', { class:'input', rows:'2' }); descrIn.value = sub.descr || '';
  const ordIn   = el('input', { class:'input', type:'number', value: String(sub.ord || 0), 'aria-label':'ترتيب المادة' });
  const dateIn  = el('input', { class:'input', type:'date',
    value: sub.exam_date ? String(sub.exam_date).slice(0,10) : '', 'aria-label':'موعد الاختبار' });

  let color = sub.color || SUBJ_COLORS[0];
  const swatches = el('div', { class:'ad-swatches', role:'radiogroup', 'aria-label':'لون المادة' },
    SUBJ_COLORS.map(c => {
      const b = el('button', { class:'ad-sw', type:'button', role:'radio', 'data-color':c,
        'aria-checked': c === color ? 'true' : 'false', 'aria-label': c,
        style:'background:var(--' + c + ')' });
      b.addEventListener('click', () => {
        color = c;

        'aria-checked': g === icon ? 'true' : 'false', text:g });

        icons.querySelectorAll('.ad-ico').forEach(x =>
          x.setAttribute('aria-checked', x.getAttribute('data-ico') === g ? 'true' : 'false'));
      });
      return b;
    }));

  const save = el('button', { class:'btn', type:'button', text:'احفظ الهوية' });
  save.addEventListener('click', async () => {
    const r = await SubjEditor.patchSubject(sub.id, {
      name: nameIn.value.trim() || sub.name, descr: descrIn.value, color, icon,
      ord: parseInt(ordIn.value || '0', 10), exam_date: dateIn.value || null
    });

  const pub = el('button', { class:'btn btn--sm ' + (sub.published ? 'btn--soft' : ''), type:'button',
    text: sub.published ? 'منشورة — أخفِها' : 'مخفية — انشرها' });
  pub.addEventListener('click', async () => {
    const r = await SubjEditor.patchSubject(sub.id, { published: !sub.published });

  free.addEventListener('click', async () => {
    const r = await SubjEditor.patchSubject(sub.id, { free: !sub.free });
    if (r.ok && refresh) refresh();
  });


  /*
    ★ التوثيق قرار إنسان لا نتيجة حساب.
    لو مُنح تلقائيًا بعدد تقييمات لصار وسمًا يُشترى بحسابات وهمية. فالمشرف
    يفتح المادة، يقرأ عيّنة منها، ثم يسمها بيده — والوسم يقول للطالب:
    «نظر فيها إنسان» لا «أعجبت كثيرين».
  */
  const verify = el('button', { class:'btn btn--sm ' + (sub.verified ? 'btn--soft' : 'btn--ghost'), type:'button',
    text: sub.verified ? '✓ موثّقة — أزل التوثيق' : 'وثّق هذه المادة' });
  verify.addEventListener('click', async () => {
    // ★ تحذير لا منع: البلاغ قد يكون خاطئًا، لكن توثيق مادة عليها بلاغ مفتوح
    //   يمنح خطأً محتملًا ختمَ المراجعة — وهو أسوأ ما تفعله طبقة الثقة بنفسها.
    if (!sub.verified && Number(sub.reports_open) > 0 &&
        !confirm('على هذه المادة ' + sub.reports_open + ' بلاغًا مفتوحًا لم يُبتّ فيه.\nتوثيقها الآن يمنح خطأً محتملًا ختمَ المراجعة. أتريد المتابعة؟'))
      return;
    verify.disabled = true;
    const r = await QBANK.api.rpc('set_verified', { p_subject: sub.id, p_on: !sub.verified });
    verify.disabled = false;
    const ok = r.ok && r.data && r.data.ok !== false;
    QBANK.toast(ok ? (sub.verified ? 'أُزيل التوثيق' : 'وُثّقت المادة') : 'تعذّر — تأكد من صلاحيتك');

      sub.verified ? el('span', { class:'badge badge--ok', text:'✓ موثّقة' }) : null,
      Number(sub.rating_n) > 0 && QBANK.trust
        ? el('span', { class:'badge badge--star num', text: QBANK.trust.starsText(sub.rating_avg, sub.rating_n) })
        : null
    ]),
    el('div', { class:'ad-edit ad-edit--2' }, [
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الاسم' }), nameIn ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'موعد الاختبار' }), dateIn ]),
      el('label', { class:'field', style:'margin:0;grid-column:1/-1' }, [ el('span', { class:'field__label', text:'الوصف — يظهر للطالب على البطاقة' }), descrIn ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'اللون' }), swatches ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الأيقونة' }), icons ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الترتيب' }), ordIn ])
    ]),

    /* بابٌ من المادة إلى بلاغاتها: المشرف الذي يفتحها ليوثّقها يرى أولًا ما عليها */
    Number(sub.reports_open) > 0
      ? el('a', { class:'ad-warn', href:'#/admin/reports' }, [
          el('span', { text:'⚑ عليها ' + QBANK.views.arNum(sub.reports_open) +
            (Number(sub.reports_open) === 1 ? ' بلاغ مفتوح' : ' بلاغات مفتوحة') }),
          el('span', { class:'ad-warn__go', text:'افتح الطابور ←' })
        ])
      : null
  ]);
}

/* ===== المحاور ===== */
function subjTopics(sub, questions, refresh){
  const topics = Array.isArray(sub.topics) ? sub.topics.slice() : [];
  // العدّ من الأسئلة نفسها: يكشف محورًا مكتوبًا في القائمة وليس عليه سؤال واحد
  const counts = {};
  questions.forEach(q => { const t = q.topic || ''; if (t) counts[t] = (counts[t] || 0) + 1; });
  Object.keys(counts).forEach(t => { if (topics.indexOf(t) === -1) topics.push(t); });

  const list = el('div', { class:'stack' });
  function draw(){
    list.innerHTML = '';
    if (!topics.length) { list.appendChild(el('p', { class:'page__sub', text:'لا محاور بعد.' })); return; }
    topics.forEach((t, i) => {
      const up = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'↑', 'aria-label':'أعلِ ' + t });
      up.addEventListener('click', () => { if (i > 0){ topics.splice(i-1, 0, topics.splice(i,1)[0]); draw(); } });
      const del = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'✕', 'aria-label':'احذف ' + t });
      del.addEventListener('click', () => {
        if (counts[t]) return QBANK.toast('لا يُحذف محور عليه ' + counts[t] + ' سؤالًا — انقلها أولًا');
        topics.splice(i, 1); draw();
      });
      list.appendChild(el('div', { class:'row' }, [
        el('span', { text: t }),
        el('span', { class:'badge num', text: (counts[t] || 0) + ' سؤالًا' }),
        el('span', { class:'spacer' }), up, del
      ]));
    });
  }
  draw();

  const addIn = el('input', { class:'input', placeholder:'اسم محور جديد' });
  const add = el('button', { class:'btn btn--sm', type:'button', text:'أضف' });
  add.addEventListener('click', () => {
    const v = addIn.value.trim();
    if (!v) return;
    if (topics.indexOf(v) !== -1) return QBANK.toast('المحور موجود');
    topics.push(v); addIn.value = ''; draw();
  });
  const save = el('button', { class:'btn', type:'button', text:'احفظ المحاور' });
  save.addEventListener('click', async () => {
    const r = await SubjEditor.patchSubject(sub.id, { topics });
    QBANK.toast(r.ok ? 'حُفظت المحاور' : 'تعذّر الحفظ');
    if (r.ok && refresh) refresh();
  });

  return el('div', { class:'ad-panel' }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:'المحاور' }),
      el('span', { class:'ad-panel__s', text:'ترتيبها هنا هو ترتيب عرضها للطالب' })
    ]),
    list,
    el('div', { class:'ad-bar', style:'margin:16px 0 0' }, [ addIn, add, save ])
  ]);
}

/* ===== بطاقة سؤال واحد ===== */
function qCard(q, sub, refresh){
  const box = el('div', { class:'ad-q', 'data-qid': q.id });
  const head = el('div', { class:'ad-q__head' }, [
    el('span', { class:'badge num', text:'#' + (q.ord + 1) }),
    q.topic ? el('span', { class:'badge', text: q.topic }) : null,
    q.derived ? el('span', { class:'badge badge--warn', text:'إجابة مستنتجة' }) : null,
    q.opts_built ? el('span', { class:'badge badge--warn', text:'خيارات مبنية' }) : null,
    !q.expl_ar ? el('span', { class:'badge', text:'بلا شرح' }) : null,
    el('span', { class:'spacer' })
  ]);
  const star = el('button', { class:'btn btn--sm btn--ghost', type:'button',
    text: q.important ? '★ مهم' : '☆ علّمه مهمًا', 'aria-pressed': q.important ? 'true' : 'false' });
  star.addEventListener('click', async () => {
    const r = await SubjEditor.patchQuestion(q.id, { important: !q.important });
    if (!r.ok) return QBANK.toast('تعذّر التعديل');
    q.important = !q.important;
    star.textContent = q.important ? '★ مهم' : '☆ علّمه مهمًا';
    star.setAttribute('aria-pressed', q.important ? 'true' : 'false');
  });
  head.appendChild(star);

  const more = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'حرّر' });
  head.appendChild(more);
  box.appendChild(head);

  // النص والخيارات للعرض فقط — لا حقل إدخال عليهما (قاعدة القداسة)
  box.appendChild(el('p', { class:'ad-q__text', text: q.q }));
  const opts = el('div', {});
  (q.options || []).forEach((o, i) => {
    const b = el('button', { class:'ad-q__opt' + (i === q.answer ? ' is-a' : ''), type:'button',
      'data-i': String(i), text: o });
    b.addEventListener('click', async () => {
      if (i === q.answer) return;
      const r = await SubjEditor.patchQuestion(q.id, { answer: i, derived: false });
      if (!r.ok) return QBANK.toast('تعذّر تصحيح الإجابة');
      q.answer = i; q.derived = false;
      opts.querySelectorAll('.ad-q__opt').forEach((x, xi) =>
        x.className = 'ad-q__opt' + (xi === i ? ' is-a' : ''));
      QBANK.toast('صُحّحت الإجابة');
    });
    opts.appendChild(b);
  });
  box.appendChild(opts);

  // لوح التحرير يُبنى عند الطلب لا مع كل سؤال — القائمة قد تحمل مئات البطاقات
  let panel = null;
  more.addEventListener('click', () => {
    if (panel){ panel.remove(); panel = null; more.textContent = 'حرّر'; return; }
    more.textContent = 'أغلِق';
    const topicSel = el('select', { class:'input' });
    const tops = (Array.isArray(sub.topics) ? sub.topics : []).slice();
    if (q.topic && tops.indexOf(q.topic) === -1) tops.push(q.topic);
    topicSel.appendChild(el('option', { value:'', text:'— بلا محور —' }));
    tops.forEach(t => topicSel.appendChild(el('option', { value:t, text:t, selected: t === q.topic ? 'selected' : null })));
    topicSel.value = q.topic || '';

    const ar = el('textarea', { class:'input', rows:'3' }); ar.value = q.expl_ar || '';
    const en = el('textarea', { class:'input', rows:'2' }); en.value = q.expl_en || '';
    const tr = el('textarea', { class:'input', rows:'2' }); tr.value = q.translation || '';
    const m = q.mnemonic || {};
    const cue  = el('input', { class:'input', value: m.cue || '',  placeholder:'الطُّعم' });
    const key  = el('input', { class:'input', value: m.key || '',  placeholder:'المفتاح' });
    const link = el('input', { class:'input', value: m.link || '', placeholder:'الرابط الذهني' });
    const ordQ = el('input', { class:'input', type:'number', value: String(q.ord), 'aria-label':'ترتيب السؤال' });

    const save = el('button', { class:'btn btn--sm', type:'button', text:'احفظ' });
    save.addEventListener('click', async () => {
      const r = await SubjEditor.patchQuestion(q.id, {
        topic: topicSel.value, expl_ar: ar.value, expl_en: en.value, translation: tr.value,
        mnemonic: { cue: cue.value, key: key.value, link: link.value, strike: m.strike || '' },
        ord: parseInt(ordQ.value || String(q.ord), 10)
      });
      QBANK.toast(r.ok ? 'حُفظ السؤال' : 'تعذّر الحفظ');
      if (r.ok && refresh) refresh();
    });

    // الحذف بتأكيد صريح: الضغطة الأولى تحوّل الزر، الثانية تنفّذ
    const del = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'احذف السؤال' });
    let armed = false;
    del.addEventListener('click', async () => {
      if (!armed){ armed = true; del.textContent = 'اضغط ثانيةً للحذف نهائيًا'; del.className = 'btn btn--sm btn--danger'; return; }
      const r = await SubjEditor.delQuestion(q.id);
      QBANK.toast(r.ok ? 'حُذف السؤال' : 'تعذّر الحذف');
      if (r.ok){ if (refresh) refresh(); else box.remove(); }
    });

    panel = el('div', { class:'ad-edit ad-edit--2', style:'margin-top:12px' }, [
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'المحور' }), topicSel ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الترتيب' }), ordQ ]),
      el('label', { class:'field', style:'margin:0;grid-column:1/-1' }, [ el('span', { class:'field__label', text:'الشرح بالعربية' }), ar ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الشرح بالإنجليزية' }), en ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الترجمة' }), tr ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'بطاقة الحفظ — الطُّعم' }), cue ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'المفتاح' }), key ]),
      el('label', { class:'field', style:'margin:0;grid-column:1/-1' }, [ el('span', { class:'field__label', text:'الرابط الذهني' }), link ]),
      el('div', { class:'ad-bar', style:'grid-column:1/-1;margin:0' }, [ save, el('span', { class:'spacer' }), del ])
    ]);
    box.appendChild(panel);
  });
  return box;
}

/* ===== متصفح الأسئلة ===== */
function subjQuestions(sub, questions, refresh){
  const search = el('input', { class:'input', type:'search', placeholder:'ابحث في نص السؤال أو خياراته…' });
  const topicSel = el('select', { class:'input', 'aria-label':'تصفية بالمحور' });
  topicSel.appendChild(el('option', { value:'', text:'كل المحاور' }));
  const seen = {};
  questions.forEach(q => { if (q.topic && !seen[q.topic]){ seen[q.topic] = 1;
    topicSel.appendChild(el('option', { value:q.topic, text:q.topic })); } });
  const onlySel = el('select', { class:'input', 'aria-label':'تصفية بالحالة' });
  [['','كل الأسئلة'],['important','المهمة فقط'],['derived','إجابة مستنتجة'],['noexpl','بلا شرح']]
    .forEach(o => onlySel.appendChild(el('option', { value:o[0], text:o[1] })));

  const count = el('span', { class:'ad-panel__s' });
  const list = el('div', { class:'stack', style:'margin-top:12px' });
  let shown = 40;   // نرسم دفعة أولى فقط: مادة فيها ٣٠٠ سؤال لا تُرسم كلها على جوال

  function draw(){
    const res = SubjEditor.filter(questions, search.value, topicSel.value, onlySel.value);
    count.textContent = res.length + ' من ' + questions.length + ' سؤالًا';
    list.innerHTML = '';
    res.slice(0, shown).forEach(q => list.appendChild(qCard(q, sub, refresh)));
    if (res.length > shown){
      const more = el('button', { class:'btn btn--block btn--soft', type:'button',
        text:'اعرض ' + Math.min(40, res.length - shown) + ' سؤالًا آخر' });
      more.addEventListener('click', () => { shown += 40; draw(); });
      list.appendChild(more);
    }
    if (!res.length) list.appendChild(QBANK.views.empty('⌕', 'لا نتائج', 'جرّب كلمة أخرى أو أزل التصفية.'));
  }
  [search, topicSel, onlySel].forEach(x =>
    x.addEventListener('input', () => { shown = 40; draw(); }));
  draw();

  return el('div', { class:'ad-panel' }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:'الأسئلة' }), count
    ]),
    el('p', { class:'page__sub', style:'margin-top:0',
      text:'نصّ السؤال وخياراته لا يُعدَّلان — يُصحَّح الخطأ برفع الملف من جديد. اضغط خيارًا لتجعله الإجابة الصحيحة.' }),
    el('div', { class:'ad-bar' }, [ search, topicSel, onlySel ]),
    list
  ]);
}

/* ===== الشاشة ===== */
const AdminSubjectView = {
  title:'محرر المادة',
  view(route){
    if (!QBANK.api.user()) return QBANK.views.ViewAdminLogin.view();
    const id = route.rest[0];
    if (!id) return QBANK.views.ViewNotFound.view();

    const body = el('div', { class:'stack' }, [ el('p', { class:'page__sub', text:'جارٍ الجلب…' }) ]);
    function load(){
      Promise.all([
        QBANK.api.rest('subjects?id=eq.' + id + '&select=*'),
        QBANK.api.rest('questions?subject_id=eq.' + id + '&select=*&order=ord')
      ]).then(([sr, qr]) => {
        if (!body.isConnected) return;
        const sub = (sr.ok && sr.data && sr.data[0]) || null;
        body.innerHTML = '';
        if (!sub){
          body.appendChild(QBANK.views.empty('⚠', 'لم نجد المادة', 'ربما حُذفت، أو حسابك ليس مشرفًا.'));
          return;
        }
        const questions = (qr.ok && Array.isArray(qr.data)) ? qr.data : [];
        body.appendChild(subjIdentity(sub, load));
        body.appendChild(subjTopics(sub, questions, load));
        body.appendChild(subjQuestions(sub, questions, load));
      });
    }
    load();

    const back = el('a', { class:'btn btn--sm btn--ghost', href:'#/admin/content', text:'→ كل المواد' });
    return QBANK.views.page('محرر المادة', 'الهوية والمحاور والأسئلة في مكان واحد.', [back, body]);
  }
};

      { k:'maintenance',   t:'bool', label:'وضع الصيانة — يُوقف دخول الطلاب' },
      { k:'maint_msg',     t:'area', label:'رسالة الصيانة' }
    ]}
  ],

  /* لا نُرسل إلا ما تغيّر فعلًا: أقل حمولة، وأثر أوضح في سجل القاعدة */
  diff(before, after){
    const out = {};
    Object.keys(after).forEach(k => { if (after[k] !== before[k]) out[k] = after[k]; });
    return out;
  },
  /* الأرقام تُقصّ إلى مداها قبل الإرسال — القاعدة سترفض الخارج، ونحن نمنع الرحلة أصلًا */
  clamp(v, min, max){
    const n = parseInt(v, 10);
    if (isNaN(n)) return min;
    return Math.min(max, Math.max(min, n));
  }
};

function setField(f, value, onChange){
  if (f.t === 'bool'){
    let on = !!value;
    const b = el('button', { class:'btn btn--sm ' + (on ? '' : 'btn--ghost'), type:'button',
      role:'switch', 'data-k':f.k, 'aria-checked': on ? 'true' : 'false',
      text: (on ? '✓ ' : '') + f.label });
    b.addEventListener('click', () => {
      on = !on;
      b.className = 'btn btn--sm ' + (on ? '' : 'btn--ghost');
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.textContent = (on ? '✓ ' : '') + f.label;
      onChange(f.k, on);
    });
    return b;
  }
  let inp;
  if (f.t === 'area'){ inp = el('textarea', { class:'input', rows:'2', 'data-k':f.k }); inp.value = value || ''; }
  else if (f.t === 'num'){
    inp = el('input', { class:'input', type:'number', 'data-k':f.k,
      min:String(f.min), max:String(f.max), value: String(value == null ? f.min : value) });
  } else {
    inp = el('input', { class:'input', type:'text', 'data-k':f.k, dir: f.dir || 'auto', value: value || '' });
  }
  inp.addEventListener('input', () => {
    onChange(f.k, f.t === 'num' ? SET.clamp(inp.value, f.min, f.max) : inp.value);
  });
  return el('label', { class:'field', style:'margin:0' }, [
    el('span', { class:'field__label', text:f.label }), inp
  ]);
}

function setGroup(g, row, refresh){
  const draft = {};
  g.fields.forEach(f => { draft[f.k] = row[f.k]; });
  const save = el('button', { class:'btn', type:'button', text:'احفظ ' + g.title, disabled:true });
  const mark = el('span', { class:'ad-panel__s' });

  function touched(){
    const d = SET.diff(row, draft);
    const n = Object.keys(d).length;
    save.disabled = n === 0;
    mark.textContent = n ? n + ' تغييرًا غير محفوظ' : 'محفوظ';
  }
  touched();

  const body = el('div', { class:'ad-edit ad-edit--2' },
    g.fields.map(f => setField(f, row[f.k], (k, v) => { draft[k] = v; touched(); })));

  save.addEventListener('click', async () => {
    const d = SET.diff(row, draft);
    if (!Object.keys(d).length) return;
    const r = await QBANK.api.rest('settings?id=eq.1', { method:'PATCH', body: JSON.stringify(d) });
    QBANK.toast(r.ok ? 'حُفظت ' + g.title : 'تعذّر الحفظ');
    if (r.ok && refresh) refresh();
  });

  return el('section', { class:'ad-panel', 'data-group':g.id }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:g.title }), mark
    ]),
    el('p', { class:'page__sub', style:'margin-top:0', text:g.sub }),
    body,
    el('div', { class:'ad-bar', style:'margin:16px 0 0' }, [ save ])
  ]);
}

/* ===== 45-trial.js ===== */
/*
  تجربة العشر دقائق — مكافأة من يرفع مادته، لا عيّنة مجانية للجميع.

  الوقت يُحسب في الخادم لا هنا: المتصفح يرسل نبضة كل ٣٠ ثانية والقاعدة تجمعها
  وتقصّها عند السقف. لو أغلق الطالب الصفحة أو عبث بالساعة أو فتح خمس ألسنة،
  فالمجموع في القاعدة هو الحكم. العدّاد المعروض تقدير محلي للطمأنة فقط.
*/
const Trial = {
  CAP: 600,          // عشر دقائق — نفس الرقم في qbank.trial_cap()
  BEAT_MS: 30000,    // نبضة كل ٣٠ ثانية: تكفي لدقة نصف دقيقة بلا إغراق الشبكة
  state: null,       // { sid, left, cap, timer, tick, onExpire }

  fmt(sec){
    const s = Math.max(0, Math.round(sec));
    const m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0');
  },

  /*
    سؤال القاعدة: هل يُسمح؟ ولماذا؟
    نُرجع null عند تعذّر الوصول للخادم — لا «ممنوع». انقطاع الشبكة ليس دليل
    عدم أحقية، ولو أغلقنا المادة عند كل تعثّر لحُرم طالب دفع ثمنها من مذاكرته
    في الطائرة. القاعدة تحرس القراءة الفعلية للأسئلة على كل حال.
  */
  async access(sid){
    const r = await QBANK.api.rpc('subject_access', { sid });
    if (r && r.ok && r.data && !r.data.error) return r.data;
    return null;
  },

  stop(){
    if (!Trial.state) return;
    clearInterval(Trial.state.timer);
    clearInterval(Trial.state.tick);
    Trial.state = null;
  },

  /* يبدأ العدّ ويُرجع الشريط الجاهز للإلحاق */
  start(sid, secondsLeft, onExpire){
    Trial.stop();
    const bar = el('div', { class:'trialbar', role:'status', 'aria-live':'polite' });
    const label = el('span', { class:'trialbar__t' });
    const meter = el('span', { class:'trialbar__m' }, [ el('span', { class:'trialbar__f' }) ]);
    const buy = el('button', { class:'btn btn--sm', type:'button', text:'اشترِ الآن' });
    buy.addEventListener('click', () => { if (onExpire) onExpire('buy'); });
    bar.appendChild(el('span', { class:'trialbar__ico', 'aria-hidden':'true', text:'◷' }));
    bar.appendChild(label); bar.appendChild(meter); bar.appendChild(buy);

    const st = { sid, left: secondsLeft, cap: Trial.CAP, onExpire, bar };
    Trial.state = st;

    function paint(){
      const pct = Math.max(0, Math.min(100, st.left / st.cap * 100));
      label.textContent = 'تجربتك: ' + Trial.fmt(st.left) + ' متبقية';
      meter.firstChild.style.width = pct.toFixed(1) + '%';
      // آخر دقيقتين بلون التحذير — الطالب يستحق إنذارًا قبل القفل لا مفاجأة
      bar.className = 'trialbar' + (st.left <= 120 ? ' is-low' : '');
    }
    paint();

    // عدّاد العرض كل ثانية — تقدير محلي، والحقيقة تأتي مع كل نبضة
    st.tick = setInterval(() => {
      if (!bar.isConnected) return Trial.stop();
      st.left = Math.max(0, st.left - 1);
      paint();
      if (st.left <= 0){ Trial.stop(); if (onExpire) onExpire('expired'); }
    }, 1000);

    st.timer = setInterval(async () => {
      if (!bar.isConnected) return Trial.stop();
      const r = await QBANK.api.rpc('rpc_record_trial_heartbeat',
        { subject_id: sid, interval_seconds: Trial.BEAT_MS / 1000 });
      if (!r.ok || !r.data || r.data.error) return;      // انقطاع مؤقت: العدّاد المحلي يكمل
      const d = r.data;
      if (d.eligible === false){ Trial.stop(); if (onExpire) onExpire('ineligible'); return; }
      st.left = Number(d.seconds_left);                  // الخادم هو الحكم — نصحّح المحلي منه
      paint();
      if (d.expired){ Trial.stop(); if (onExpire) onExpire('expired'); }
    }, Trial.BEAT_MS);

    return bar;
  },

  /* شاشة انتهاء التجربة — تفتح الشراء لا تتركه في فراغ */
  expiredCard(sub){
    return el('div', { class:'card', style:'text-align:center' }, [
      el('span', { class:'empty__ico', 'aria-hidden':'true', text:'◷' }),
      el('p', { class:'empty__title', text:'انتهت تجربتك المجانية' }),
      el('p', { class:'empty__text',
        text:'استفدت من عشر دقائق كاملة في «' + sub.name + '». افتحها الآن حتى نهاية الفصل.' }),
      QBANK.gate.buyButton(sub)
    ]);
  }
};
QBANK.trial = Trial;


/* ===== 46-share.js ===== */
/*
  رابط المشاركة القصير: #s/slug?ref=USER_ID

  الموجّه يجرّد «#» و«/» الأولى معًا، فمسار واحد مسجَّل باسم '#/s' يلتقط
  الصيغتين: #s/slug و #/s/slug — ويبقى الرابط قصيرًا كما يُشارَك في الواتساب.

  هذه الشاشة تعريفية لا محتوى فيها: من وصل عبر رابط زميله يرى ما في المادة
  وسعرها وزر الشراء، ولا يُحتسب له رصيد تجربة.
*/
function shareUrl(slug, userId){
  /*
    ★ typeof location !== 'undefined' لا يكفي.
    الوصف موجود دائمًا، والذي يفشل هو القراءة منه: بعد تفكيك المستند
    (إغلاق تبويب، أو صفحة أُخليت وطلبٌ غير متزامن ما زال يعود) يرمي
    الوصفُ استثناءً فينهار كل ما بُني في تلك اللحظة. try هو الحارس الوحيد
    الذي يمسك هذا، وليس فحص الوجود.
  */
  let base = 'https://amsuq.alsoqoor.com/';
  try {
    if (typeof location !== 'undefined' && location.protocol.indexOf('http') === 0)
      base = location.origin + location.pathname;
  } catch(e){ /* مستند مفكَّك — نبقى على العنوان الثابت */ }
  return base + '#s/' + slug + (userId ? '?ref=' + userId : '');
}

function copyRow(url){
  const inp = el('input', { class:'input', dir:'ltr', readonly:'', value:url, 'aria-label':'رابط المادة' });
  const btn = el('button', { class:'btn btn--sm', type:'button', text:'انسخ الرابط' });
  btn.addEventListener('click', () => {
    inp.select();
    // clipboard API قد يُمنع على file:// أو بلا https — execCommand احتياطًا لا مكتبة
    const done = (navigator.clipboard && navigator.clipboard.writeText)
      ? (navigator.clipboard.writeText(url), true)
      : (function(){ try { return document.execCommand('copy'); } catch(e){ return false; } })();
    QBANK.toast(done ? 'نُسخ الرابط' : 'انسخه يدويًا من الحقل');
  });
  return el('div', { class:'sharebox' }, [ inp, btn ]);
}

  const head = el('div', { class:'row' }, [
