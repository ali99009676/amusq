/* ===== 48-cost.js ===== */
/*
  حاسبة التكلفة — كم سيكلّف إثراء هذا الملف، قبل تشغيله لا بعده.

  لماذا في الواجهة؟ لأن المشرف اليوم يضغط «شغّل الذكاء» وهو لا يعرف إن كان
  سيدفع ريالًا أو عشرين. الرقم المعروض تقدير مبني على أسعار معلنة وعلى متوسط
  أرصدناه من ملفات حقيقية — ويظهر بعده الاستهلاك الفعلي الذي يبلّغ به الخادم،
  فيصحّح المشرف تقديره بنفسه مع الوقت.
*/
const AI_PRICES = {
  // دولار لكل مليون رمز — من صفحة أسعار Anthropic
  'claude-haiku-4-5':  { in: 1,  out: 5,  label: 'Haiku 4.5' },
  'claude-sonnet-5':   { in: 2,  out: 10, label: 'Sonnet 5' },
  'claude-sonnet-4-5': { in: 3,  out: 15, label: 'Sonnet 4.5' },
  'claude-opus-5':     { in: 5,  out: 25, label: 'Opus 5' }
};
const AI_DEFAULT = 'claude-haiku-4-5';

/*
  متوسطات لكل سؤال. مبنية على ملفات AMSU الحقيقية:
  سؤال بخياراته ≈ ١٥٠ رمز دخلًا، والإخراج (شرح عربي + ترجمة + بطاقة حفظ + محور)
  ≈ ٣٥٠ رمزًا. السؤال بلا خيارات يخرج أكثر لأن الذكاء يبني له ثلاثة مشتتات.
*/
const TOK_IN = 150, TOK_OUT = 350, TOK_OUT_BUILT = 470;
const SYS_TOKENS = 420;            // تعليمات النظام، تُرسل مرة لكل دفعة
const USD_SAR = 3.75;              // الريال مربوط بالدولار — سعر ثابت لا يتغيّر

function estimateCost(opts){
  const n = Math.max(0, opts.questions || 0);
  const built = Math.max(0, Math.min(opts.withoutOptions || 0, n));
  const batch = Math.max(1, opts.batchSize || 40);
  const p = AI_PRICES[opts.model || AI_DEFAULT] || AI_PRICES[AI_DEFAULT];
  const batches = Math.ceil(n / batch) || 0;

  const inQ  = n * TOK_IN;
  const outQ = (n - built) * TOK_OUT + built * TOK_OUT_BUILT;

  /*
    التعليمات: الدفعة الأولى كتابة ذاكرة (‎1.25x‎) والباقي قراءة (‎0.1x‎).
    بلا تخزين كانت تُحسب كاملة مع كل دفعة — والفرق يكبر مع كبر الملف.
  */
  const sysFirst = batches ? SYS_TOKENS * 1.25 : 0;
  const sysRest  = batches > 1 ? SYS_TOKENS * 0.1 * (batches - 1) : 0;
  const sysNoCache = batches * SYS_TOKENS;

  const usd = ((inQ + sysFirst + sysRest) * p.in + outQ * p.out) / 1e6;
  const usdNoCache = ((inQ + sysNoCache) * p.in + outQ * p.out) / 1e6;

  return {
    model: p.label, batches,
    usd, sar: usd * USD_SAR,
    saved: Math.max(0, usdNoCache - usd),          // ما وفّره التخزين المؤقت
    tokensIn: Math.round(inQ + sysFirst + sysRest),
    tokensOut: outQ
  };
}

/* مقارنة النماذج — يرى المشرف ثمن اختياره بدل أن يخمّنه */
function compareModels(opts){
  return Object.keys(AI_PRICES).map(k => {
    const c = estimateCost(Object.assign({}, opts, { model: k }));
    return { id: k, label: c.model, usd: c.usd, sar: c.sar };
  }).sort((a, b) => a.usd - b.usd);
}

/* عرض المبلغ: الريال أولًا لأنه عملة الطالب، والدولار بين قوسين للمرجع */
function money(c){
  const sar = c.sar < 1 ? c.sar.toFixed(2) : c.sar.toFixed(1);
  return sar + ' ريال (' + (c.usd < 1 ? '$' + c.usd.toFixed(3) : '$' + c.usd.toFixed(2)) + ')';
}

QBANK.cost = { estimate: estimateCost, compare: compareModels, money,
               prices: AI_PRICES, DEFAULT: AI_DEFAULT };


/* ===== 49-formats.js ===== */
/*
  دليل التنسيق — ما يفهمه المقسّم، وقوالب جاهزة، وفاحص فوري في المتصفح.

  لماذا فاحص في المتصفح والمقسّم في الخادم؟
  لأن الطالب يكتشف اليوم أن ملفه غير مفهوم بعد أن يرفعه وينتظر ويدفع من رصيد
  الذكاء. الفاحص هنا يخبره في نفس اللحظة: «وجدنا ١٢ سؤالًا، ٨ منها بخيارات».
  فيصلح ملفه قبل أن يكلّف نفسه أو المنصة شيئًا.

  التعابير أدناه نسخة حرفية من api/_lib/parser.js، وفحص آلي يقارن مصدرها
  بمصدر الخادم في كل بناء — فلو تغيّر أحدهما وحده انكسر الفحص قبل النشر.
*/
const FMT_Q_START   = /^\s*(?:Q\s*\.?\s*)?(\d{1,3})\s*[).\-:]\s+/i;
const FMT_OPT_START = /^\s*([A-Ea-e])\s*[).]\s+/;
const FMT_ANS_LINE  = /^\s*(?:ANSWER|ANS|KEY|الاجابة|الإجابة)\s*[:\-.]?\s*([A-Ea-e])\b/i;

/* فحص سريع: كم سؤالًا سيُستخرج من هذا النص؟ */
function formatCheck(text){
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  let questions = 0, withOptions = 0, withAnswer = 0;
  let curOpts = 0, curAns = false, open = false;

  const closeOne = () => {
    if (!open) return;
    questions++;
    if (curOpts >= 2) withOptions++;
    if (curAns || curOpts < 2) withAnswer++;   // إجابة معلنة، أو الشكل «سؤال ثم إجابة»
    curOpts = 0; curAns = false;
  };

  lines.forEach(line => {
    if (FMT_Q_START.test(line)) { closeOne(); open = true; return; }
    if (!open) return;
    if (FMT_ANS_LINE.test(line)) { curAns = true; return; }
    if (FMT_OPT_START.test(line)) { curOpts++; }
  });
  closeOne();

  return { questions, withOptions, withAnswer, ok: questions > 0 };
}

/*
  القالبان. كل واحد مأخوذ من ملفات حقيقية ومُختبَر على المقسّم نفسه:
  فحص آلي يمرّرهما على parser ويتأكد من عدد الأسئلة ومواضع الإجابات.

/* ===== 50-explore.js ===== */
/*
  الاستكشاف — الشاشة التي تجعل المنصة عربية لا جامعية.

  كل شيء هنا يحدث في الخادم: البحث والتصفية والترتيب والترقيم. السبب أن
  جلب كل المواد ثم تصفيتها في المتصفح يعمل مع خمس مواد وينهار مع خمسة آلاف،
  ويستهلك باقة الطالب في شيء لن يقرأه.

  والحالة كلها في الرابط (#/explore?q=…&country=…): يشاركه الطالب مع زميله
  فيفتح نفس النتيجة، ويرجع بزرّ الرجوع فيجد ما كان يتصفّح لا الصفحة الأولى.
*/
const COUNTRIES = {
  SA:'السعودية', EG:'مصر', JO:'الأردن', AE:'الإمارات', KW:'الكويت', QA:'قطر',
  BH:'البحرين', OM:'عُمان', IQ:'العراق', MA:'المغرب', DZ:'الجزائر', TN:'تونس',
  SD:'السودان', YE:'اليمن', LY:'ليبيا', SY:'سوريا', LB:'لبنان', PS:'فلسطين'
};
const countryName = c => COUNTRIES[c] || c;

const Explore = {
  PAGE: 24,
  KEY: 'explore_last',      // آخر اختيار للطالب — يعود إليه بلا إعادة ضبط

  /* الحالة من الرابط أولًا، ثم من آخر زيارة، ثم الافتراضي */
  stateFrom(query){
    const saved = QBANK.store.get(Explore.KEY, {}) || {};
    const has = k => query && Object.prototype.hasOwnProperty.call(query, k);
    return {
      q:       has('q')       ? query.q       : '',
      country: has('country') ? query.country : (saved.country || ''),
      uni:     has('uni')     ? query.uni     : (saved.uni || ''),
      col:     has('col')     ? query.col     : (saved.col || ''),
      sort:    has('sort')    ? query.sort    : (saved.sort || 'popular'),
      page:    has('page')    ? Math.max(0, parseInt(query.page, 10) || 0) : 0
    };
  },
  toHash(st){
    const p = [];
    if (st.q)       p.push('q=' + encodeURIComponent(st.q));
    if (st.country) p.push('country=' + st.country);
    if (st.uni)     p.push('uni=' + st.uni);
    if (st.col)     p.push('col=' + st.col);
    if (st.sort && st.sort !== 'popular') p.push('sort=' + st.sort);
    if (st.page)    p.push('page=' + st.page);
    return '#/explore' + (p.length ? '?' + p.join('&') : '');
  },
  remember(st){
    QBANK.store.set(Explore.KEY, { country: st.country, uni: st.uni, col: st.col, sort: st.sort });
  },

  search(st){
    return QBANK.api.rpc('browse_subjects', {
      q: st.q || '', p_country: st.country || '', p_university: st.uni || null,
      p_college: st.col || null, p_sort: st.sort || 'popular',
      p_page: st.page || 0, p_size: Explore.PAGE
    });
  },
  filters(st){
    return QBANK.api.rpc('catalog_filters', {
      p_country: st.country || '', p_university: st.uni || null
    });
  }
};

/* بطاقة مادة في نتائج البحث — تختلف عن بطاقة «موادي»:
   هنا الطالب لا يملكها بعد، فنُظهر أين تُدرَّس وكم سعرها لا تقدّمه فيها */

function ViewExploreRender(route){
  const st = Explore.stateFrom(route.query);
  Explore.remember(st);

  /* شريط البحث — لا يُرسل مع كل حرف: نصف ثانية سكون قبل النداء.
     بلا هذا نُرسل عشرة نداءات لكلمة من عشرة أحرف. */
  const qIn = el('input', { class:'input', type:'search', value: st.q,
    placeholder:'ابحث باسم المادة أو رمز المقرر…', 'aria-label':'بحث في المواد' });
  let timer = null;
  qIn.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      st.q = qIn.value; st.page = 0;
      QBANK.router.go(Explore.toHash(st));
    }, 500);
  });

  const sortSel = el('select', { class:'input', 'aria-label':'ترتيب النتائج' });
  [['popular','الأكثر استخدامًا'],['newest','الأحدث'],['questions','الأكثر أسئلة']]
    .forEach(o => sortSel.appendChild(el('option', { value:o[0], text:o[1],
      selected: o[0] === st.sort ? 'selected' : null })));
  sortSel.value = st.sort;
  sortSel.addEventListener('change', () => {
    st.sort = sortSel.value; st.page = 0; QBANK.router.go(Explore.toHash(st));
  });

  const filterBox = el('div', { class:'ex-filters' });
  const countEl   = el('p', { class:'page__sub', role:'status' });
  const grid      = el('div', { class:'ex-grid' });
  const pager     = el('div', { class:'ex-pager' });

  /* المرشّحات: شرائح لا قوائم منسدلة — أسرع لمسًا على الجوال، وتُظهر العدد */
  function drawFilters(f){
    filterBox.innerHTML = '';
    const chipRow = (label, items, activeVal, onPick) => {
      if (!items.length) return;
      const row = el('div', { class:'ex-chips', role:'group', 'aria-label':label });
      const all = el('button', { class:'chip' + (!activeVal ? ' is-on' : ''), type:'button',
        text:'الكل', 'aria-pressed': !activeVal ? 'true' : 'false' });
      all.addEventListener('click', () => onPick(''));
      row.appendChild(all);
      items.slice(0, 12).forEach(it => {
        const on = String(activeVal) === String(it.val);
        const b = el('button', { class:'chip' + (on ? ' is-on' : ''), type:'button',
          'aria-pressed': on ? 'true' : 'false' }, [
          el('span', { text: it.label }),
          el('span', { class:'chip__n num', text: String(it.n) })
        ]);
        b.addEventListener('click', () => onPick(on ? '' : it.val));
        row.appendChild(b);
      });
      filterBox.appendChild(el('div', { class:'ex-frow' }, [
        el('span', { class:'ex-flabel', text: label }), row
      ]));
    };

    chipRow('الدولة', (f.countries || []).map(c => ({ val:c.code, label:countryName(c.code), n:c.n })),
      st.country, v => { st.country = v; st.uni = ''; st.col = ''; st.page = 0; QBANK.router.go(Explore.toHash(st)); });
    chipRow('الجامعة', (f.universities || []).map(u => ({ val:u.id, label:u.name, n:u.n })),
      st.uni, v => { st.uni = v; st.col = ''; st.page = 0; QBANK.router.go(Explore.toHash(st)); });
    if (st.uni)
      chipRow('الكلية', (f.colleges || []).map(c => ({ val:c.id, label:c.name, n:c.n })),
        st.col, v => { st.col = v; st.page = 0; QBANK.router.go(Explore.toHash(st)); });
  }

  function drawPager(d){
    pager.innerHTML = '';
    if (!d.pages || d.pages < 2) return;
    const go = p => { st.page = p; QBANK.router.go(Explore.toHash(st)); };
    const prev = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'‹ السابق',
      disabled: d.page <= 0 ? '' : null });
    prev.addEventListener('click', () => go(d.page - 1));
    const next = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'التالي ›',
      disabled: d.page >= d.pages - 1 ? '' : null });
    next.addEventListener('click', () => go(d.page + 1));
    pager.appendChild(prev);
    pager.appendChild(el('span', { class:'ex-pageno num', text:(d.page + 1) + ' من ' + d.pages }));
    pager.appendChild(next);
  }

  grid.appendChild(el('p', { class:'page__sub', text:'جارٍ البحث…' }));
  Explore.search(st).then(r => {
    if (!grid.isConnected) return;
    grid.innerHTML = '';
    if (!r.ok || !r.data || r.data.error){
      grid.appendChild(QBANK.views.empty('⚠', 'تعذّر البحث',
        'تأكد من الاتصال، أو أن ملف CATALOG.sql مُشغَّل على القاعدة.'));
      return;
    }
    const d = r.data;
    countEl.textContent = d.total
      ? d.total + ' مادة' + (st.q ? ' لـ «' + st.q + '»' : '')
      : 'لا نتائج' + (st.q ? ' لـ «' + st.q + '»' : '');
    if (!d.rows.length){
      grid.appendChild(QBANK.views.empty('⌕', 'لم نجد شيئًا',
        'جرّب كلمة أقصر، أو أزل بعض المرشّحات — أو كن أنت من يرفع هذه المادة.',
        el('a', { class:'btn', href:'#/upload', text:'⇪ ارفع هذه المادة' })));
      return;
    }
    d.rows.forEach(x => grid.appendChild(exCard(x)));
    drawPager(d);
  });

  Explore.filters(st).then(r => {
    if (!filterBox.isConnected) return;
    if (r.ok && r.data && !r.data.error) drawFilters(r.data);
  });

  return QBANK.views.page('استكشف', 'بنوك أسئلة رفعها طلاب من جامعات عربية.', [
    el('div', { class:'ex-bar' }, [ qIn, sortSel ]),
    filterBox, countEl, grid, pager
  ]);
}

/* ===== 51-campus.js ===== */
/*
  قسم الجامعة — البيت الذي تنتمي إليه كل مادة.

  لماذا وُجد: الطالب يرفع مادته فتذهب إلى قائمة عامة تختلط فيها مقرّرات
  الجامعات. فلا يجد زميله ما رفعه، ولا تتراكم فائدة داخل الدفعة الواحدة.
  القسم يعطي كل جامعة صفحة ورابطًا يُشارَك في مجموعة الدفعة.

  والانتماء يُحفظ في حساب الطالب مرة واحدة، فيفتح المنصة على قسم جامعته
  لا على قائمة عامة، وتُملأ له خانات الجامعة والكلية تلقائيًا عند الرفع.
*/
const Campus = {
  KEY: 'campus',                 // نسخة محلية تُقرأ فورًا قبل وصول الخادم
  _loading: null,

  /* المخزَّن محليًا: يُستعمل للرسم الفوري، والخادم هو المرجع */
  cached(){ return QBANK.store.get(Campus.KEY, null); },

  remember(c){
    if (c && c.university_id) QBANK.store.set(Campus.KEY, c);
    else QBANK.store.remove(Campus.KEY);
    return c;
  },

  /* جلب من الخادم مع منع النداءات المتوازية — الشاشة الواحدة قد تطلبه مرتين */
  load(){
    if (!QBANK.api.user()) return Promise.resolve(null);
    if (Campus._loading) return Campus._loading;
    Campus._loading = QBANK.api.rpc('my_campus').then(r => {
      Campus._loading = null;
      if (r.ok && r.data && r.data.university_id) return Campus.remember(r.data);
      return null;
    }).catch(() => { Campus._loading = null; return null; });
    return Campus._loading;
  },

  save(country, university, college){
    return QBANK.api.rpc('set_my_campus', {
      p_country: country || '', p_university: university || '', p_college: college || ''
    }).then(r => {
      if (!r.ok || !r.data) return null;
      // ★ نمسح المخزَّن عند المسح لا نُبقي القديم — وإلا رأى الطالب جامعة تركها
      return r.data.university_id ? Campus.remember(r.data) : (QBANK.store.remove(Campus.KEY), null);
    });
  },

  href(id){ return '#/u/' + id; }
};

/* ═══ منتقي الجامعة والكلية ═══
   لا قائمة منسدلة مغلقة: الطالب الأول في جامعته لن يجدها فيها. فحقل حر
   مع اقتراحات — يختار الموجود أو يكتب الجديد، والخادم يوحّد الإملاء. */
function campusPicker(current, onSaved){
  const cur = current || {};
  const box = el('div', { class:'campus-pick' });
  const msg = el('p', { class:'field__hint', role:'status', style:'margin:0' });

  const countrySel = el('select', { class:'input', 'aria-label':'الدولة' });
  const COUNTRIES = QBANK.explore && QBANK.explore.countryName ? [
    'SA','EG','JO','AE','KW','QA','BH','OM','IQ','MA','DZ','TN','SD','YE','LY','SY','LB','PS'
  ] : ['SA'];
  countrySel.appendChild(el('option', { value:'', text:'اختر الدولة' }));
  COUNTRIES.forEach(c => countrySel.appendChild(el('option', {
    value:c, text: QBANK.explore ? QBANK.explore.countryName(c) : c,
    selected: c === cur.country ? 'selected' : null })));
  if (cur.country) countrySel.value = cur.country;

  const uniList = el('datalist', { id:'campusUniList' });
  const uniIn = el('input', { class:'input', value: cur.university || '', list:'campusUniList',
    placeholder:'اكتب اسم جامعتك — أو اخترها من الاقتراحات', 'aria-label':'الجامعة' });

  const colList = el('datalist', { id:'campusColList' });
  const colIn = el('input', { class:'input', value: cur.college || '', list:'campusColList',
    placeholder:'مثال: كلية الهندسة', 'aria-label':'الكلية' });

  /* الاقتراحات تتبع الدولة: قائمة ٣٥ جامعة كاملة تُربك، وقائمة دولته تُفيد */
  function fillUniversities(){
    QBANK.api.rpc('list_universities', { q:'', p_country: countrySel.value || '' }).then(r => {
      if (!uniList.isConnected) return;
      uniList.innerHTML = '';
      (r.ok && Array.isArray(r.data) ? r.data : []).forEach(u =>
        uniList.appendChild(el('option', { value: u.name })));
    });
  }
  function fillColleges(){
    const c = Campus.cached();
    if (!c || !c.university_id) return;
    QBANK.api.rpc('list_colleges', { p_university: c.university_id }).then(r => {
      if (!colList.isConnected) return;
      colList.innerHTML = '';
      (r.ok && Array.isArray(r.data) ? r.data : []).forEach(x =>
        colList.appendChild(el('option', { value: x.name })));
    });
  }
  countrySel.addEventListener('change', fillUniversities);

  const save = el('button', { class:'btn', type:'button', text:'احفظ جامعتي' });
  save.addEventListener('click', () => {
    if (!countrySel.value || !uniIn.value.trim()){
      msg.className = 'field__hint is-bad';
      msg.textContent = 'اختر الدولة واكتب اسم الجامعة.';
      return;
    }
    save.disabled = true; msg.className = 'field__hint'; msg.textContent = 'جارٍ الحفظ…';
    Campus.save(countrySel.value, uniIn.value.trim(), colIn.value.trim()).then(c => {
      save.disabled = false;
      if (!c){ msg.className = 'field__hint is-bad'; msg.textContent = 'تعذّر الحفظ — تأكد من الاتصال.'; return; }
      msg.className = 'field__hint is-ok';
      msg.textContent = 'حُفظت: ' + c.university + (c.college ? ' · ' + c.college : '');
      fillColleges();
      if (typeof onSaved === 'function') onSaved(c);
    });
  });

  const clear = el('button', { class:'btn btn--ghost btn--sm', type:'button', text:'أزل الانتماء' });
  clear.addEventListener('click', () => {
    Campus.save('', '', '').then(() => {
      countrySel.value = ''; uniIn.value = ''; colIn.value = '';
      msg.className = 'field__hint'; msg.textContent = 'أُزيل الانتماء.';
      if (typeof onSaved === 'function') onSaved(null);
    });
  });

  box.appendChild(el('div', { class:'campus-pick__row' }, [
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'الدولة' }), countrySel ]),
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'الجامعة' }), uniIn ]),
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'الكلية (اختياري)' }), colIn ])
  ]));
  box.appendChild(uniList); box.appendChild(colList);
  box.appendChild(el('div', { class:'row', style:'gap:8px;margin-top:12px' }, [save, cur.university_id ? clear : null]));
  box.appendChild(msg);

  fillUniversities(); fillColleges();
  return box;
}

/*
  المواد مجموعة تحت كلياتها. الترتيب داخل المجموعة بالأكثر اشتراكًا،
  والكلية الأكبر أولًا — فيجد الطالب كليته في أعلى الصفحة غالبًا.
  و«مواد بلا كلية» تنزل آخرًا لا تُخفى: صاحبها لم يحدّد كليته وقد تكون
  مادة زميلك، فإخفاؤها خسارة صامتة.
*/
function groupByCollege(subjects, colleges){
  const groups = [];
  const byId = {};
  (colleges || []).forEach(c => {
    const g = { id:c.id, name:c.name, items:[] };
    byId[c.id] = g; groups.push(g);
  });
  const orphan = { id:null, name:'مواد بلا كلية محدَّدة', items:[] };
  (subjects || []).forEach(s => {
    const g = s.college_id && byId[s.college_id] ? byId[s.college_id] : orphan;
    g.items.push(s);
  });
  const out = groups.filter(g => g.items.length);
  if (orphan.items.length) out.push(orphan);
  return out;
}

  ]);

  const body = el('div');
  body.appendChild(el('p', { class:'page__sub', text:'جارٍ التحميل…' }));

    if (!body.isConnected) return;
    body.innerHTML = ''; head.innerHTML = '';

    if (!r.ok || !r.data || r.data.ok === false){

    head.appendChild(el('header', { class:'uni-head' }, [

        el('h1', { class:'uni-head__t' }, [
          u.name,
          u.verified ? el('span', { class:'badge badge--ok', text:'موثّقة' }) : null
        ]),
        el('p', { class:'uni-head__s', text: cname + (u.city ? ' · ' + u.city : '') +
          ' · ' + QBANK.views.arNum(d.total) + ' بنك أسئلة' })
      ]),
      // ★ الرابط هو الميزة: قسمٌ لا يُشارَك لا يجمع دفعة
      (function(){
        const b = el('button', { class:'btn btn--soft btn--sm', type:'button', text:'انسخ رابط القسم' });
        b.addEventListener('click', () => {

          if (navigator.clipboard && navigator.clipboard.writeText)
            navigator.clipboard.writeText(url).then(done, done);
          else done();
        });
        return b;
      })()
    ]));

    if (!d.subjects.length){
      body.appendChild(QBANK.views.empty('▤', 'لا بنوك في هذه الجامعة بعد',
        'كن أنت أول من يرفع — بنكك سيظهر هنا لكل زملائك فور نشره.',
        el('a', { class:'btn', href:'#/upload', text:'⇪ ارفع أول مادة' })));
      return;
    }

    groupByCollege(d.subjects, d.colleges).forEach(g => {
      body.appendChild(el('h2', { class:'uni-col' }, [
        g.name,
        el('span', { class:'uni-col__n num', text: QBANK.views.arNum(g.items.length) })
      ]));
      body.appendChild(el('div', { class:'ex-grid' }, g.items.map(uniSubjectCard)));
    });

    if (d.total > d.subjects.length)
      body.appendChild(el('p', { class:'lp-note' }, [
        'معروض ' + QBANK.views.arNum(d.subjects.length) + ' من ' + QBANK.views.arNum(d.total) + ' — ',
        el('a', { href:'#/explore?uni=' + u.id, text:'اعرض البقية في استكشف' }), '.'
      ]));
  });

  return QBANK.views.page('قسم الجامعة', null, [wrap]);
}

/* ===== 52-trust.js ===== */
/*
  الجودة والثقة — الطبقة التي تجعل الرفع المفتوح آمنًا.

  حين يفتح الرفع لكل طالب يدخل الرديء مع الجيد. وبنك فيه إجابة خاطئة أسوأ
  من لا بنك: الطالب يحفظ الخطأ ويدخل به الامتحان واثقًا. فثلاث طبقات:
  تقييم يرفع الجيد، وبلاغ يُسقط الخاطئ، ووسم «موثّق» لما راجعه إنسان.
*/
const REASONS = [
  ['wrong_answer', 'الإجابة المعلَّمة خاطئة'],
  ['typo',         'خطأ في نص السؤال أو الخيارات'],
  ['duplicate',    'سؤال مكرَّر'],
  ['offensive',    'محتوى مخالف'],
  ['other',        'شيء آخر']
];
const REASON_AR = {};
REASONS.forEach(r => { REASON_AR[r[0]] = r[1]; });

const Trust = {
  reasons: REASONS,
  reasonName(k){ return REASON_AR[k] || k; },

  rate(subjectId, stars, note){
    return QBANK.api.rpc('rate_subject', { p_subject: subjectId, p_stars: stars, p_note: note || '' });
  },
  mine(subjectId){ return QBANK.api.rpc('my_rating', { p_subject: subjectId }); },
  report(subjectId, questionId, reason, note){
    return QBANK.api.rpc('report_issue', {
      p_subject: subjectId, p_question: questionId || null,
      p_reason: reason || 'other', p_note: note || '' });
  },
  queue(status){ return QBANK.api.rpc('admin_reports', { p_status: status || 'open', p_limit: 100 }); },
  resolve(id, status, note){
    return QBANK.api.rpc('resolve_report', { p_report: id, p_status: status, p_note: note || '' });
  },
  similar(name, universityId){
    return QBANK.api.rpc('find_similar', { p_name: name || '', p_university: universityId || null });
  },

  /* عرض التقييم: النجوم مع العدد. بلا العدد يبدو ٥٫٠ من تقييم واحد
     كأنه إجماع — وهو رأي شخص واحد. */
  starsText(avg, n){
    if (!n) return 'لم يُقيَّم بعد';
    /*
      الرقم بأرقام عربية وفاصلة عربية (٫) كبقية المنصة.
      كان يخرج «4.5» وسط نصّ عربي — والخلط يكسر الاتجاه بصريًا ويجعل
      السطر يقفز في المتصفحات ثنائية الاتجاه.
    */
    const ar = QBANK.views.arNum(Number(avg).toFixed(1)).replace('.', '٫');
    return '★ ' + ar + ' · ' + QBANK.views.arNum(n) + (n === 1 ? ' تقييم' : ' تقييمات');
  }
};

/* شارة الجودة على بطاقة/ترويسة المادة */
function trustBadges(sub){
  const out = [];
  if (sub.verified)
    out.push(el('span', { class:'badge badge--ok', title:'راجعها مشرف المنصة', text:'✓ موثّقة' }));
  if (sub.rating_n)
    out.push(el('span', { class:'badge badge--star num', text: Trust.starsText(sub.rating_avg, sub.rating_n) }));
  return out;
}

/* ═══ ودجة التقييم ═══
   خمس نجوم قابلة للّمس مع تعليق اختياري. التعليق اختياري عمدًا:
   إلزامه يُسقط تسعة من كل عشرة تقييمات، والنجمة وحدها تكفي للترتيب. */
function ratingWidget(sub, onDone){
  const box = el('div', { class:'rate' });
  const msg = el('p', { class:'field__hint', role:'status', style:'margin:8px 0 0' });
  let picked = 0;

  const row = el('div', { class:'rate__stars', role:'radiogroup', 'aria-label':'قيّم هذه المادة' });
  const btns = [];
  for (let i = 1; i <= 5; i++){
    const b = el('button', { class:'rate__star', type:'button', role:'radio',
      'aria-checked':'false', 'aria-label': i + ' من ٥', 'data-star': String(i), text:'☆' });
    b.addEventListener('click', () => setStars(i));
    btns.push(b); row.appendChild(b);
  }
  function setStars(n){
    picked = n;
    btns.forEach((b, i) => {
      const on = i < n;
      b.textContent = on ? '★' : '☆';
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-checked', i === n - 1 ? 'true' : 'false');
    });
  }

  const note = el('textarea', { class:'input', rows:'2',
    placeholder:'ما الذي أفادك أو نقصك فيها؟ (اختياري)', 'aria-label':'تعليق' });

  const send = el('button', { class:'btn btn--sm', type:'button', text:'أرسل تقييمي' });
  send.addEventListener('click', () => {
    if (!picked){ msg.className = 'field__hint is-bad'; msg.textContent = 'اختر عدد النجوم أولًا.'; return; }
    send.disabled = true; msg.className = 'field__hint'; msg.textContent = 'جارٍ الإرسال…';
    Trust.rate(sub.id, picked, note.value).then(r => {
      send.disabled = false;
      if (!r.ok || !r.data || r.data.ok === false){
        // ★ سبب الرفض يُقال بالاسم: «تعذّر» وحدها تجعل الطالب يعيد المحاولة بلا فائدة
        const why = r.data && r.data.reason === 'not_enrolled'
          ? 'افتح المادة وراجع منها أولًا — التقييم لمن جرّبها.'
          : 'تعذّر الإرسال. تأكد من الاتصال.';
        msg.className = 'field__hint is-bad'; msg.textContent = why; return;
      }
      msg.className = 'field__hint is-ok';
      msg.textContent = 'شكرًا — صار متوسطها ' + Number(r.data.avg).toFixed(1);
      if (typeof onDone === 'function') onDone(r.data);
    });
  });

  box.appendChild(row);
  box.appendChild(note);
  box.appendChild(el('div', { class:'row', style:'margin-top:8px' }, [send]));
  box.appendChild(msg);

  // تقييمه السابق يظهر محدَّدًا: يعدّله لا يبدأ من الصفر
  Trust.mine(sub.id).then(r => {
    if (!box.isConnected || !r.ok || !r.data || !r.data.stars) return;
    setStars(r.data.stars);
    note.value = r.data.note || '';
    msg.textContent = 'تقييمك السابق — عدّله متى شئت.';
  });

  return box;
}

/* ═══ زرّ الإبلاغ ═══
   يُلحق بكل سؤال. البلاغ على سؤال بعينه لا على المادة: «فيها خطأ» بلا
   تحديد بلاغٌ لا يستطيع المشرف التصرف فيه. */
function reportButton(subjectId, questionId){
  const b = el('button', { class:'qitem__flag', type:'button',
    title:'أبلغ عن مشكلة في هذا السؤال', 'aria-label':'أبلغ عن مشكلة', text:'⚑' });
  b.addEventListener('click', e => {
    e.stopPropagation(); e.preventDefault();
    openReport(subjectId, questionId, b);
  });
  return b;
}

function openReport(subjectId, questionId, anchor){
  const sel = el('select', { class:'input', 'aria-label':'سبب البلاغ' });
  REASONS.forEach(r => sel.appendChild(el('option', { value:r[0], text:r[1] })));
  const note = el('textarea', { class:'input', rows:'2',
    placeholder:'وضّح المشكلة — ما الإجابة الصحيحة في رأيك؟ (اختياري)' });
  const msg = el('p', { class:'field__hint', role:'status', style:'margin:0' });

  const send = el('button', { class:'btn btn--sm', type:'button', text:'أرسل البلاغ' });
  const box = el('div', { class:'report card stack' }, [
    el('h3', { style:'margin:0', text:'أبلغ عن مشكلة' }),
    sel, note,
    el('div', { class:'row', style:'gap:8px' }, [send,
      (function(){
        const c = el('button', { class:'btn btn--ghost btn--sm', type:'button', text:'إلغاء' });
        c.addEventListener('click', () => box.remove());
        return c;
      })()
    ]),
    msg
  ]);

  send.addEventListener('click', () => {
    send.disabled = true; msg.className = 'field__hint'; msg.textContent = 'جارٍ الإرسال…';
    Trust.report(subjectId, questionId, sel.value, note.value).then(r => {
      if (!r.ok || !r.data || r.data.ok === false){
        send.disabled = false;
        msg.className = 'field__hint is-bad'; msg.textContent = 'تعذّر الإرسال — تأكد من الاتصال.';
        return;
      }
      box.innerHTML = '';
      box.appendChild(el('p', { class:'field__hint is-ok', style:'margin:0',
        text:'وصل بلاغك. يراجعه المشرف، ويبقى السؤال ظاهرًا حتى يُبتّ فيه.' }));
      setTimeout(() => box.remove(), 3200);
    });
  });

  if (anchor && anchor.parentNode) anchor.parentNode.appendChild(box);
  return box;
}

QBANK.trust = Trust;
QBANK.trust.badges = trustBadges;
QBANK.trust.ratingWidget = ratingWidget;
QBANK.trust.reportButton = reportButton;
QBANK.trust.openReport = openReport;


/* ===== 53-admin-reports.js ===== */
/*
  طابور البلاغات — الشاشة التي تُحوّل الشكوى إلى تصحيح.

  المبدأ الحاكم: البلاغ يصل ومعه نص السؤال وخياراته وإجابته المعلَّمة.
  بلا ذلك يضطر المشرف إلى فتح المادة والبحث عن السؤال مع كل بلاغ، فيتراكم
  الطابور ولا يُقرأ — وطابورٌ لا يُقرأ كأنه غير موجود، والبلاغ الذي لا
  يُقرأ أسوأ من غيابه: يمنح الطالب ثقة كاذبة بأن أحدًا يتابع.
*/
function reportCard(r, onDone){
  const card = el('article', { class:'rep', 'data-id': r.id });

  card.appendChild(el('div', { class:'rep__head' }, [
    el('span', { class:'badge badge--warn', text: QBANK.trust.reasonName(r.reason) }),
    el('a', { class:'rep__subj', href:'#/admin/subject/' + r.subject_id, text: r.subject }),
    el('span', { class:'rep__when num', text: new Date(r.created_at).toLocaleDateString('ar') })
  ]));

  // نصّ السؤال كما هو — هو موضوع البلاغ، ولا قرار بلا رؤيته
  if (r.q){
    const opts = Array.isArray(r.options) ? r.options : [];
    card.appendChild(el('div', { class:'rep__q' }, [
      el('p', { class:'rep__qt ltr', text: r.q }),
      opts.length ? el('ol', { class:'rep__opts' }, opts.map((o, i) =>
        el('li', { class: i === r.answer ? 'is-answer' : null }, [
          el('span', { class:'opt__l', 'aria-hidden':'true', text: QBANK.views.optLetter(i) }),
          el('span', { class:'ltr', text: String(o) }),
          i === r.answer ? el('span', { class:'badge badge--ok', text:'المعلَّمة' }) : null
        ]))) : null
    ]));
  } else {
    card.appendChild(el('p', { class:'field__hint', style:'margin:0',
      text:'بلاغ على المادة كلها لا على سؤال بعينه.' }));
  }

  if (r.note) card.appendChild(el('p', { class:'rep__note', text: '«' + r.note + '»' }));

  const adminNote = el('input', { class:'input', placeholder:'ملاحظتك (اختياري)' });
  const msg = el('span', { class:'field__hint', role:'status' });

  const act = (status, label, cls) => {
    const b = el('button', { class:'btn btn--sm ' + cls, type:'button', text: label });
    b.addEventListener('click', () => {
      b.disabled = true; msg.textContent = 'جارٍ الحفظ…';
      QBANK.trust.resolve(r.id, status, adminNote.value).then(res => {
        if (!res.ok || !res.data || res.data.ok === false){
          b.disabled = false; msg.textContent = 'تعذّر — تأكد من صلاحيتك.'; return;
        }
        card.classList.add('is-done');
        card.innerHTML = '';
        card.appendChild(el('p', { class:'field__hint is-ok', style:'margin:0',
          text: (status === 'resolved' ? '✓ عولج: ' : '✕ رُفض: ') + r.subject }));
        if (typeof onDone === 'function') onDone();
      });
    });
    return b;
  };

  if (r.status === 'open')
    card.appendChild(el('div', { class:'rep__act' }, [
      adminNote,
      el('div', { class:'row', style:'gap:8px' }, [
        act('resolved', '✓ عولج', 'btn--soft'),
        act('rejected', '✕ لا مشكلة', 'btn--ghost'),
        msg
      ])
    ]));

  return card;
}

function reportsBody(){
  const wrap = el('div', { class:'stack' });
  const tabs = el('div', { class:'ex-chips', role:'group', 'aria-label':'تصفية البلاغات بالحالة' });
  const list = el('div', { class:'stack' });
  let status = 'open';

  const load = () => {
    list.innerHTML = '';
    list.appendChild(el('p', { class:'page__sub', text:'جارٍ التحميل…' }));
    QBANK.trust.queue(status).then(r => {
      if (!list.isConnected) return;
      list.innerHTML = '';
      const rows = (r.ok && Array.isArray(r.data)) ? r.data : [];
      if (!rows.length){
        list.appendChild(QBANK.views.empty('✓', status === 'open' ? 'لا بلاغات مفتوحة' : 'لا شيء هنا',
          status === 'open'
            ? 'الطابور فارغ — وهذا خبر جيد.'
            : 'لم يُبتّ في بلاغات بهذه الحالة بعد.'));
        return;
      }
      rows.forEach(x => list.appendChild(reportCard(x, load)));
    });
  };

  /*
    ★ شرائح لا تبويبات.
    كانت هنا tabs__btn داخل شريط تبويبات اللوحة — تبويبات داخل تبويبات:
    يرى المشرف صفَّين متطابقين فلا يعرف أيّهما يحدّد أين هو. والشريحة تقول
    «تصفية» بينما التبويب يقول «مكان آخر»، وهذا الفرق هو الصواب هنا.
  */
  [['open','المفتوحة'],['resolved','المعالَجة'],['rejected','المرفوضة']].forEach(t => {
    const b = el('button', { class:'chip' + (t[0] === status ? ' is-on' : ''), type:'button',
      'data-status': t[0], 'aria-pressed': t[0] === status ? 'true' : 'false', text: t[1] });
    b.addEventListener('click', () => {
      status = t[0];
      tabs.querySelectorAll('.chip').forEach(x => {
        const on = x.getAttribute('data-status') === status;
        x.classList.toggle('is-on', on);
        x.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      load();
    });
    tabs.appendChild(b);
  });

  wrap.appendChild(tabs);
  wrap.appendChild(list);
  load();
  return wrap;
}

/*
  لا شاشة مستقلة للبلاغات ولا مسار خاص بها.
  ★ سجّلنا مسار #/admin/reports مستقلًا في البداية، فابتلع التبويبَ ذا
  الاسم نفسه: يضغط المشرف «البلاغات» فيخرج من اللوحة ويفقد شريطها ولا
  يعرف أين هو. الطابور تبويب داخل اللوحة — والموجّه يمرّره إليها.
*/
QBANK.views.reportsBody = reportsBody;
QBANK.views.reportCard = reportCard;

/*
  إدراج «البلاغات» تبويبًا في لوحة المشرف.

  ★ شاشة بلا مدخل غير موجودة عمليًا. بنينا الطابور ثم كاد يبقى بلا رابط
  يقود إليه — وطابور بلاغات لا يفتحه أحد أسوأ من غيابه: يمنح الطالب
  ثقة كاذبة بأن أحدًا يتابع بلاغه.

  ويُدرج قبل «الإعدادات» لا بعدها: الإعدادات آخر ما يُفتح، والبلاغات
  أول ما ينبغي أن يُرى.
*/
if (QBANK.views.ADMIN_TABS && !QBANK.views.ADMIN_TABS.some(t => t.id === 'reports')){
  const tabs = QBANK.views.ADMIN_TABS;
  const at = tabs.findIndex(t => t.id === 'settings');
  const tab = { id:'reports', label:'البلاغات', fill(box){ box.appendChild(reportsBody()); } };
  if (at === -1) tabs.push(tab); else tabs.splice(at, 0, tab);
}


/* ===== 54-community.js ===== */
/*
  المجتمع — الدفعة تراجع معًا.

  المذاكرة وحدها تنقطع. ومن يعرف أن ثلاثين من دفعته يراجعون المادة نفسها
  الليلة يُكمل، ومن يظنّ نفسه وحده يتوقّف.

  قاعدتان تحكمان كل ما هنا:
  ١ · المقارنة داخل الجامعة لا عبر المنصة — طالب نجران لا يُقارَن بمن
      يذاكر مقرّرًا آخر في بلد آخر. المقارنة الظالمة تُحبط ولا تُحفّز.
  ٢ · الاسم والصورة فقط. لا بريد ولا معرّف يخرج من أي دالة.
*/
const Community = {
  board(uni, days){
    return QBANK.api.rpc('university_board', {
      p_uni: uni || null, p_days: days || 30, p_limit: 20 });
  },
  pulse(subjectId){ return QBANK.api.rpc('subject_pulse', { p_subject: subjectId, p_days: 7 }); },
  createChallenge(subjectId, title, hours){
    return QBANK.api.rpc('create_challenge', {
      p_subject: subjectId, p_title: title || '', p_hours: hours || 48 });
  },
  submitChallenge(code, score, correct){
    return QBANK.api.rpc('submit_challenge', {
      p_code: code, p_score: score, p_correct: correct || 0 });
  },
  challengeBoard(code){ return QBANK.api.rpc('challenge_board', { p_code: code }); },

  /* الوقت المتبقي بعبارة يفهمها الطالب بلمحة، لا بتاريخ يحسبه */
  timeLeft(endsAt){
    const ms = new Date(endsAt).getTime() - Date.now();
    if (!(ms > 0)) return 'انتهى';
    const h = Math.floor(ms / 3600000);
    if (h >= 24) return 'يبقى ' + QBANK.views.arNum(Math.floor(h / 24)) + ' يوم';
    if (h >= 1)  return 'يبقى ' + QBANK.views.arNum(h) + ' ساعة';
    return 'يبقى ' + QBANK.views.arNum(Math.max(1, Math.floor(ms / 60000))) + ' دقيقة';
  },

  /* الميدالية للثلاثة الأوائل فقط — ولو منحناها للجميع لما ميّزت أحدًا */
  medal(rank){ return rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : ''; }
};

function boardRow(r){
  const cls = 'brd__row' + (r.me ? ' is-me' : '') + (r.rank <= 3 ? ' is-top' : '');
  return el('div', { class: cls }, [
    el('span', { class:'brd__rank num', text: Community.medal(r.rank) || QBANK.views.arNum(r.rank) }),
    el('span', { class:'brd__av', 'aria-hidden':'true', text: r.avatar || '◍' }),
    // ★ من لم يضع اسمًا يظهر «طالب» لا فراغًا ولا بريدًا
    el('span', { class:'brd__name', text: (r.name || 'طالب') + (r.me ? ' (أنت)' : '') }),
    el('span', { class:'brd__pts num', text: QBANK.views.arNum(r.points) + ' نقطة' })
  ]);
}

function boardBody(){
  const wrap = el('div', { class:'stack' });
  const list = el('div', { class:'brd' });
  wrap.appendChild(el('p', { class:'field__hint', style:'margin:0',
    text:'نقطة لكل إجابة صحيحة في اختبارات آخر ٣٠ يومًا — داخل جامعتك وحدها.' }));
  wrap.appendChild(list);

  list.appendChild(el('p', { class:'page__sub', text:'جارٍ التحميل…' }));
  Community.board(null, 30).then(r => {
    if (!list.isConnected) return;
    list.innerHTML = '';
    const d = r.ok ? r.data : null;

    if (!d || d.ok === false){
      // ★ سبب الفراغ يُقال: «لا جامعة» ليست عطلًا بل خطوة ناقصة
      list.appendChild(QBANK.views.empty('⌕', 'حدّد جامعتك أولًا',
        'المتصدرون داخل جامعتك — فنحتاج أن نعرف أيّها.',
        el('a', { class:'btn', href:'#/account', text:'حدّد جامعتي' })));
      return;
    }
    const rows = Array.isArray(d.rows) ? d.rows : [];
    if (!rows.length){
      list.appendChild(QBANK.views.empty('◇', 'لا اختبارات بعد هذا الشهر',
        'أول من يختبر يتصدّر. افتح مادة وابدأ اختبارًا.',
        el('a', { class:'btn', href:'#/', text:'إلى موادي' })));
      return;
    }
    rows.forEach(x => list.appendChild(boardRow(x)));

    /* ترتيبك ولو كنت خارج العشرين: «٤٧ من ٢٠٠» يُحفّز، والغياب يُحبط */
    const mine = d.me;
    if (mine && !rows.some(x => x.me))
      list.appendChild(el('div', { class:'brd__row is-me is-mine-out' }, [
        el('span', { class:'brd__rank num', text: QBANK.views.arNum(mine.rank) }),
        el('span', { class:'brd__av', 'aria-hidden':'true', text:'◍' }),
        el('span', { class:'brd__name', text:'ترتيبك أنت' }),
        el('span', { class:'brd__pts num', text: QBANK.views.arNum(mine.points) + ' نقطة' })
      ]));
  });
  return wrap;
}

/* نبض المادة: كم من دفعتك راجعوها هذا الأسبوع */
function pulseBand(subjectId){
  const box = el('div', { hidden:true });
  Community.pulse(subjectId).then(r => {
    if (!box.isConnected || !r.ok || !r.data || r.data.ok === false) return;
    const d = r.data;
    if (!d.week) return;                       // صفر لا يُعرض: «٠ يراجعون» تُحبط
    box.hidden = false;
    box.className = 'pulse';
    box.appendChild(el('span', { class:'pulse__dot', 'aria-hidden':'true' }));
    box.appendChild(el('span', { class:'pulse__t', text:
      d.campus
        ? QBANK.views.arNum(d.campus) + ' من جامعتك راجعوها هذا الأسبوع'
        : QBANK.views.arNum(d.week) + ' طالبًا راجعوها هذا الأسبوع' }));
  });
  return box;
}

/* ═══ التحدّي ═══ */
function challengeBox(sub){
  const box = el('div', { class:'card stack' });
  const msg = el('p', { class:'field__hint', role:'status', style:'margin:0' });

  const title = el('input', { class:'input', placeholder:'اسم التحدّي — مثال: تحدّي دفعة ٢٠٢٦' });
  const hours = el('select', { class:'input', 'aria-label':'مدة التحدي' });
  [[24,'يوم واحد'],[48,'يومان'],[72,'ثلاثة أيام'],[168,'أسبوع']].forEach(h =>
    hours.appendChild(el('option', { value:String(h[0]), text:h[1], selected: h[0] === 48 ? 'selected' : null })));

  const make = el('button', { class:'btn btn--sm', type:'button', text:'افتح تحدّيًا' });

/* ===== 55-pay.js ===== */
/*
  الدفع — الطبقة التي تحوّل المنصة من مشروع إلى عمل.

  ثلاثة مبادئ في هذا الملف:

  ١ · لا يُرسل المتصفح مبلغًا قط. يقول «هذه الباقة» أو «هذه المادة»،
      والقاعدة تحسب السعر وتُجمّده. مبلغٌ يأتي من المتصفح يعني مادة بريال.

  ٢ · شاشة العودة تسأل الخادم لا نفسها. الطالب قد يعود بعنوان يقول
      «نجح» وهو لم يدفع — والحقيقة عند البوابة وحدها.

  ٣ · كل مبلغ يُعرض بالريال لا بالهللات. الهللة وحدة تخزين لا وحدة عرض.
*/
const Pay = {
  /* الهللات وحدة تخزين — نخزّن بها كي لا نجمع كسورًا عشرية، ونعرض بالريال */
  money(halalas, currency){
    const v = (Number(halalas) || 0) / 100;
    const s = QBANK.views.arNum(v % 1 === 0 ? String(v) : v.toFixed(2)).replace('.', '٫');
    return s + ' ' + (currency === 'SAR' || !currency ? 'ريال' : currency);
  },

  options(){ return QBANK.api.rpc('pay_options'); },
  history(){ return QBANK.api.rpc('my_payments', { p_limit: 20 }); },
  status(id){ return QBANK.api.rpc('payment_status', { p_payment: id }); },

  /* ★ مصدر واحد للإحالة: مخزن البوابة نفسه الذي يلتقطها من #s/slug?ref=…
     مفتاحٌ ثانٍ يعني إحالة تُلتقط ولا تُقرأ، ومكافأةً لا تصل صاحبها. */
  referrer(){ return (QBANK.gate && QBANK.gate.ref && QBANK.gate.ref()) || null; },

  /* الأصل الذي تعود إليه البوابة — بنفس حارس shareUrl */
  origin(){
    try {
      if (typeof location !== 'undefined' && location.protocol.indexOf('http') === 0)
        return location.href.split('#')[0].replace(/\/$/, '');
    } catch(e){}
    return 'https://amsuq.alsoqoor.com';
  },

  /*
    الانتقال إلى صفحة البوابة.
    ★ يُنادى داخل .then بعد رحلة شبكة — وقد يكون المستند قد فُكِّك في
    تلك الأثناء (أغلق الطالب التبويب، أو انتقل قبل أن يعود الردّ).
    والكتابة على وصف مفكَّك ترمي استثناءً يُسقط كل ما يليه.
  */
  goTo(url){
    try { location.href = url; return true; } catch(e){ return false; }
  },

  async start(payload){
    return QBANK.admin.server('/api/pay',
      Object.assign({ origin: Pay.origin(), ref: Pay.referrer() }, payload));
  },

  async confirm(chargeId){
    return QBANK.admin.server('/api/pay', { action:'confirm', charge_id: chargeId });
  },

  /* قيمة الباقة: كم سؤالًا يُثري بها الطالب — الرقم الذي يفهمه فعلًا */
  questionsFor(coins, costPerQ){
    const c = Math.max(1, Number(costPerQ) || 1);
    return Math.floor((Number(coins) || 0) / c);
  }
};

/* ═══ متجر الكوينز ═══ */
function coinShop(){
  const box = el('div', { class:'card stack' });
  const msg = el('p', { class:'field__hint', role:'status', style:'margin:0' });
  const grid = el('div', { class:'lp-grid lp-grid--3' });

  box.appendChild(el('h2', { style:'margin:0', text:'اشترِ رصيدًا' }));
  box.appendChild(el('p', { class:'field__hint', style:'margin:0',
    text:'الرصيد يُنفَق على إثراء موادك بالشرح وبطاقات الحفظ. والنشر بلا إثراء مجاني دائمًا.' }));
  box.appendChild(grid);
  box.appendChild(msg);

  grid.appendChild(el('p', { class:'page__sub', text:'جارٍ التحميل…' }));
  Pay.options().then(r => {
    if (!grid.isConnected) return;
    grid.innerHTML = '';
    const d = (r.ok && r.data) ? r.data : null;
    if (!d || !d.open){
      // ★ نقول «موقوف» لا نُخفي الزر: الطالب الذي يبحث عن الشراء ولا يجده يظنّه عطلًا
      grid.appendChild(QBANK.views.empty('◔', 'الشراء موقوف مؤقتًا',
        'رصيدك الحالي يبقى كما هو، وما اشتريته سابقًا لا يتأثر.'));
      return;
    }
    const packs = Array.isArray(d.packages) ? d.packages : [];
    if (!packs.length){
      grid.appendChild(QBANK.views.empty('◔', 'لا باقات معروضة', 'يضبطها المشرف من الإعدادات.'));
      return;
    }
    // الأكبر «الأوفر»: نحسبها ولا نكتبها يدويًا كي لا تكذب حين تتغير الأسعار
    const best = packs.reduce((a, b) =>
      (b.halalas / b.coins) < (a.halalas / a.coins) ? b : a, packs[0]);

    packs.forEach(p => {
      const isBest = p.coins === best.coins && packs.length > 1;
      const card = el('div', { class:'pack' + (isBest ? ' pack--best' : '') }, [
        isBest ? el('span', { class:'pack__tag', text:'الأوفر' }) : null,
        el('span', { class:'pack__n num', text: QBANK.views.arNum(p.coins) }),
        el('span', { class:'pack__u', text:'كوين' }),
        el('span', { class:'pack__q', text:'≈ ' + QBANK.views.arNum(Pay.questionsFor(p.coins, d.cost_per_q)) + ' سؤالًا مُثرى' }),
        el('span', { class:'pack__p', text: Pay.money(p.halalas, d.currency) })
      ]);
      const buy = el('button', { class:'btn btn--sm btn--block', type:'button', text:'اشترِ' });
      buy.addEventListener('click', () => {
        buy.disabled = true; msg.className = 'field__hint'; msg.textContent = 'جارٍ فتح صفحة الدفع…';
        Pay.start({ kind:'coins', coins: p.coins }).then(r => {
          buy.disabled = false;
          if (r.ok && r.data && r.data.url){ Pay.goTo(r.data.url); return; }
          msg.className = 'field__hint is-bad';
          msg.textContent = (r.data && r.data.error) || 'تعذّر فتح صفحة الدفع.';
        });
      });
      card.appendChild(buy);
      grid.appendChild(card);
    });
  });
  return box;
}

/* ═══ شاشة العودة من البوابة ═══ */
function ViewPayReturn(route){
  const id = (route.rest && route.rest[0]) || '';
  const box = el('div', { class:'card stack', style:'text-align:center' });
  box.appendChild(el('p', { class:'page__sub', text:'نتحقق من دفعتك…' }));

  /*
    ★ لا نصدّق العنوان.
    Tap تُعيد الطالب بمعامل tap_id، وقد يكتب أي أحد عنوانًا يقول «نجح».
    فنُرسل المعرّف إلى خادمنا، وهو يسأل Tap مباشرة ثم يُسوّي. ثم نسأل
    القاعدة عن حالة الصفّ — والقاعدة لا تُغيّرها إلا التسوية المؤكدة.
  */
  const tapId = route.query && (route.query.tap_id || route.query.charge_id);

  const paint = d => {
    box.innerHTML = '';
    if (d && d.status === 'paid'){
      box.appendChild(el('p', { style:'font-size:2.4rem;margin:0', text:'✓' }));
      box.appendChild(el('h2', { style:'margin:0', text:'تمّت العملية' }));
      box.appendChild(el('p', { class:'field__hint', style:'margin:0', text: d.kind === 'coins'
        ? 'أُضيف ' + QBANK.views.arNum(d.coins) + ' كوين إلى رصيدك.'
        : 'صارت المادة متاحة لك.' }));
      box.appendChild(el('a', { class:'btn', href: d.kind === 'coins' ? '#/account' : ('#/subject/' + d.subject_id),
        text: d.kind === 'coins' ? 'إلى محفظتي' : 'افتح المادة' }));
      QBANK.data.sync && QBANK.data.sync();
      return;
    }
    if (d && d.status === 'failed'){
      box.appendChild(el('p', { style:'font-size:2.4rem;margin:0', text:'✕' }));
      box.appendChild(el('h2', { style:'margin:0', text:'لم تكتمل العملية' }));
      box.appendChild(el('p', { class:'field__hint', style:'margin:0',
        text: d.reason || 'لم يُخصم منك شيء. جرّب مرة أخرى.' }));
      box.appendChild(el('a', { class:'btn btn--ghost', href:'#/account', text:'إلى محفظتي' }));
      return;
    }
    // معلّقة: البوابة قد تتأخر ثوانيَ — نقول ذلك ولا ندّعي فشلًا
    box.appendChild(el('p', { style:'font-size:2.4rem;margin:0', text:'◔' }));
    box.appendChild(el('h2', { style:'margin:0', text:'دفعتك قيد التأكيد' }));
    box.appendChild(el('p', { class:'field__hint', style:'margin:0',
      text:'قد تستغرق البوابة لحظات. سيصلك ما اشتريته تلقائيًا فور تأكيدها — لا تدفع مرة أخرى.' }));
    const again = el('button', { class:'btn btn--ghost btn--sm', type:'button', text:'تحقّق الآن' });
    again.addEventListener('click', () => run());
    box.appendChild(again);
  };

  function run(){
    const after = () => Pay.status(id).then(s => {
      if (!box.isConnected) return;
      paint(s.ok && s.data && s.data.ok ? s.data : null);
    });
    if (tapId) Pay.confirm(tapId).then(after, after);
    else after();
  }
  if (id) run(); else paint(null);

  return QBANK.views.page('الدفع', null, [box]);
}

/* ===== 56-admin-pro.js ===== */
/*
  لوحة الإشراف الكاملة — إحصاء دقيق وتحكم كامل.

  مبدأ الشاشة: كل رقم هنا يجب أن يُغيّر قرارًا.
  رقمٌ لا يُغيّر ما تفعله غدًا زينةٌ تُزاحم ما يُغيّره. لهذا لا «إجمالي
  الزيارات» ولا «متوسط زمن الجلسة»: أرقام تُطمئن ولا تُوجّه.
*/
const Pro = {
  overview(days){ return QBANK.api.rpc('admin_overview', { p_days: days || 30 }); },
  coins(days){ return QBANK.api.rpc('admin_coins', { p_days: days || 30 }); },
  hard(){ return QBANK.api.rpc('admin_hard_questions', { p_limit: 30 }); },
  campus(){ return QBANK.api.rpc('admin_campus'); },
  payments(status){ return QBANK.api.rpc('admin_payments', { p_status: status || '', p_limit: 50 }); },
  audit(){ return QBANK.api.rpc('admin_audit', { p_limit: 60 }); },

  grantCoins(user, amount, note){
    return QBANK.api.rpc('admin_grant_coins', { p_user:user, p_amount:amount, p_note:note || '' }); },
  setRole(user, isAdmin){
    return QBANK.api.rpc('admin_set_role', { p_user:user, p_admin:isAdmin }); },
  grantEntitlement(user, subject, days){
    return QBANK.api.rpc('admin_grant_entitlement', { p_user:user, p_subject:subject, p_days:days || 180 }); },
  setSubject(id, patch){
    return QBANK.api.rpc('admin_set_subject', { p_subject:id, p_patch:patch }); },
  mergeUniversity(from, into){
    return QBANK.api.rpc('admin_merge_university', { p_from:from, p_into:into }); },
  verifyUniversity(id, on){
    return QBANK.api.rpc('admin_verify_university', { p_uni:id, p_on:on }); },
  refund(payment, note){
    return QBANK.api.rpc('admin_refund', { p_payment:payment, p_note:note || '' }); },

  money(h){ return QBANK.pay ? QBANK.pay.money(h, 'SAR') : String(h); },
  n(v){ return QBANK.views.arNum(Number(v) || 0); },

  /* النسبة من الخطوة السابقة لا من القمة: «٤٠٪ من المسجّلين اشتركوا»
     مفيدة، و«٤٪ من المسجّلين دفعوا» تُخفي أين وقع التسرّب فعلًا. */
  step(n, prev){
    if (!prev) return null;
    return Math.round((Number(n) || 0) * 100 / prev);
  }
};

/* ═══ القمع ═══ */
function funnelPanel(f){
  const steps = [
    ['سجّل',        f.signed_up],
    ['حدّد جامعته', f.has_campus],
    ['فتح مادة',    f.enrolled],
    ['اختبر نفسه',  f.examined],
    ['رفع مادة',    f.uploaded],
    ['دفع',         f.paid]
  ];
  const top = Math.max(1, Number(f.signed_up) || 1);
  return el('div', { class:'fun' }, steps.map((s, i) => {
    const v = Number(s[1]) || 0;
    const pct = Math.round(v * 100 / top);
    const drop = i > 0 ? Pro.step(v, Number(steps[i-1][1]) || 0) : null;
    return el('div', { class:'fun__row' }, [
      el('span', { class:'fun__l', text: s[0] }),
      el('span', { class:'fun__bar' }, [
        el('span', { class:'fun__fill', style:'width:' + Math.max(pct, 2) + '%' })
      ]),
      el('span', { class:'fun__n num', text: Pro.n(v) }),
      // ★ نسبة التحويل من الخطوة السابقة — هي التي تكشف موضع التسرّب
      /* ★ دون الثلث يُلوَّن: خطوةٌ يسقط فيها ثلثا الطلاب هي عمل الغد.
         والحدّ مكتوب هنا مرة واحدة كي لا يتفرّق تقديره على الشاشات. */
      drop !== null ? el('span', { class:'fun__p num' + (drop < 30 ? ' is-low' : ''),
        title:'من الخطوة السابقة', text: Pro.n(drop) + '٪' }) : el('span', { class:'fun__p' })
    ]);
  }));
}

/* ═══ الشاشة الأولى ═══ */
function proDashTab(box){
  let days = 30;
  const head = el('div', { class:'ad-bar' });
  const body = el('div', { class:'stack' });
  box.appendChild(head); box.appendChild(body);

  [7, 30, 90].forEach(d => {
    const b = el('button', { class:'chip' + (d === days ? ' is-on' : ''), type:'button',
      'data-d': String(d), text: Pro.n(d) + ' يومًا' });
    b.addEventListener('click', () => {
      days = d;
      head.querySelectorAll('.chip').forEach(x =>
        x.classList.toggle('is-on', x.getAttribute('data-d') === String(d)));
      load();
    });
    head.appendChild(b);
  });

  const legacy = el('div', { class:'ad-legacy' });

  function load(){
    body.innerHTML = '';
    body.appendChild(el('p', { class:'page__sub', text:'جارٍ الحساب…' }));
    Pro.overview(days).then(r => {
      if (!body.isConnected) return;
      body.innerHTML = '';
      const d = (r.ok && r.data && r.data.ok) ? r.data : null;
      if (!d){
        body.appendChild(QBANK.views.empty('⚠', 'تعذّر الجلب',
          'تأكد من تشغيل ADMIN-PRO.sql على القاعدة، ومن أن حسابك مشرف.'));
        return;
      }
      const C = QBANK.admin.charts;
      const m = d.money, a = d.activity, c = d.content, q = d.quality;

      body.appendChild(el('div', { class:'ad-kpis' }, [
        C.kpi(Pro.money(m.revenue), 'دخل المدة', Pro.n(m.paid_n) + ' عملية', m.revenue > 0 ? 'live' : null),
        C.kpi(Pro.n(a.active), 'طالبًا نشطًا', Pro.n(a.new_users) + ' جديد'),
        C.kpi(Pro.n(a.attempts), 'اختبارًا', 'متوسط ' + Pro.n(a.avg_pct) + '٪'),
        C.kpi(Pro.n(c.published), 'مادة منشورة', Pro.n(c.verified) + ' موثّقة'),
        C.kpi(Pro.n(q.reports_open), 'بلاغًا مفتوحًا',
          q.reports_open ? 'تحتاج بتًّا' : 'الطابور نظيف', q.reports_open ? 'warn' : 'live'),
        /* ★ الالتزام القادم: كوينز في الجيوب لم تُنفق — كلٌّ منها تكلفة ذكاء قادمة */
        C.kpi(Pro.n(m.coins_outstanding), 'كوين لم يُنفَق', 'التزامك القادم',
          m.coins_outstanding > 5000 ? 'warn' : null)
      ]));

      body.appendChild(el('section', { class:'ad-panel' }, [
        el('div', { class:'ad-panel__h' }, [
          el('h2', { class:'ad-panel__t', text:'قمع الطلاب' }),
          el('span', { class:'ad-panel__s', text:'النسبة من الخطوة التي قبلها' })
        ]),
        funnelPanel(d.funnel)
      ]));

      /* الرسم اليومي — نُعيد استعمال chartActivity بدل رسم ثانٍ.
         مكوّن رسم واحد في المنصة يعني مقياسًا واحدًا وعينًا متعوّدة عليه. */
      const S = Array.isArray(d.series) ? d.series : [];
      if (S.length > 1 && C.chartActivity){
        const mk = (key, title) => el('section', { class:'ad-panel' }, [
          el('div', { class:'ad-panel__h' }, [
            el('h2', { class:'ad-panel__t', text: title }),
            el('span', { class:'ad-panel__s', text: Pro.n(S.reduce((t,x) => t + Number(x[key]||0), 0)) + ' في المدة' })
          ]),
          C.chartActivity(S.map(x => ({ d: x.d, n: Number(x[key]) || 0 })))
        ]);
        body.appendChild(mk('attempts', 'الاختبارات يوميًا'));
        body.appendChild(mk('users', 'التسجيلات يوميًا'));
        if (S.some(x => Number(x.revenue) > 0))
          body.appendChild(el('section', { class:'ad-panel' }, [
            el('div', { class:'ad-panel__h' }, [
              el('h2', { class:'ad-panel__t', text:'الدخل يوميًا' }),
              el('span', { class:'ad-panel__s', text: Pro.money(S.reduce((t,x) => t + Number(x.revenue||0), 0)) })
            ]),
            // بالريال لا بالهللات: مقياسٌ بالهللات يجعل كل عمود جبلًا
            C.chartActivity(S.map(x => ({ d: x.d, n: Math.round(Number(x.revenue||0) / 100) })))
          ]));
      }

      const warn = [];
      if (c.drafts)  warn.push(['▤', Pro.n(c.drafts) + ' مسوّدة تنتظر اعتمادك', '#/admin/ugc']);
      if (c.orphan)  warn.push(['⌂', Pro.n(c.orphan) + ' مادة بلا جامعة — لا يجدها أحد في «استكشف»', '#/admin/content']);
      if (q.low_rated) warn.push(['★', Pro.n(q.low_rated) + ' مادة تقييمها دون ٣ من ٥', '#/admin/content']);
      if (m.pending_n) warn.push(['◔', Pro.n(m.pending_n) + ' دفعة معلّقة لم تُسوَّ', '#/admin/money']);
      if (warn.length)
        body.appendChild(el('section', { class:'ad-panel ad-panel--warn' }, [
          el('div', { class:'ad-panel__h' }, [ el('h2', { class:'ad-panel__t', text:'يحتاج انتباهك' }) ]),
          el('div', { class:'stack' }, warn.map(w =>
            el('a', { class:'ad-warn', href: w[2] }, [
              el('span', { text: w[0] + ' ' + w[1] }),
              el('span', { class:'ad-warn__go', text:'←' })
            ])))
        ]));

      /*
        لوحات النسخة السابقة: توزيع النتائج وأداء المواد وآخر النشاط.
        تُجلب بنداء ثانٍ لأنها من مصدر آخر (admin_dashboard)، وتُلحق كما هي —
        فما بُني صحيحًا لا يُلقى لأن شيئًا جديدًا وُضع فوقه.
      */
      const P = QBANK.admin.dashParts;
      if (P) QBANK.api.rpc('admin_dashboard', { days }).then(rr => {
        if (!body.isConnected || !rr.ok || !rr.data || rr.data.error) return;
        const dd = rr.data;
        const total = (dd.series || []).reduce((n, x) => n + Number(x.n), 0);
        legacy.innerHTML = '';
        legacy.appendChild(el('div', { class:'ad-panels ad-panels--2' }, [
          P.dashPanel('النشاط اليومي', total + ' اختبارًا خلال ' + days + ' يومًا',
            C.chartActivity(dd.series || [])),
          P.dashPanel('توزيع النتائج', 'الخط البرتقالي = متوسط النتيجة',
            C.chartBuckets(dd.buckets || []))
        ]));
        legacy.appendChild(el('div', { class:'ad-panels' }, [
          P.dashPanel('أداء المواد', 'اضغط مادة لفتح محررها', P.dashSubjects(dd.subjects || [])),
          P.dashPanel('آخر النشاط', null, P.dashRecent(dd.recent || []))
        ]));
      });

      body.appendChild(el('section', { class:'ad-panel' }, [
        el('div', { class:'ad-panel__h' }, [ el('h2', { class:'ad-panel__t', text:'أرقام المنصة' }) ]),
        el('div', { class:'ad-grid2' }, [
          ['أسئلة', Pro.n(c.questions) + ' منها ' + Pro.n(c.derived) + ' مستنتجة'],
          ['جامعات فيها محتوى', Pro.n(d.community.universities)],
          ['كليات', Pro.n(d.community.colleges)],
          ['تحديات جارية', Pro.n(d.community.challenges)],
          ['تقييمات', Pro.n(q.ratings) + ' بمتوسط ' + q.avg_rating],
          ['دخل منذ الإطلاق', Pro.money(m.revenue_all)],
          ['دفعات فاشلة', Pro.n(m.failed_n)],
          ['متصل الآن', Pro.n(a.online)]
        ].map(x => el('div', { class:'ad-fact' }, [
          el('span', { class:'ad-fact__l', text: x[0] }),
          el('span', { class:'ad-fact__v num', text: x[1] })
        ])))
      ]));

      body.appendChild(legacy);
    });
  }
  load();
}

/* ═══ تبويب المال ═══ */
function proMoneyTab(box){
  const body = el('div', { class:'stack' });
  box.appendChild(body);
  let status = '';

  const chips = el('div', { class:'ex-chips', role:'group', 'aria-label':'تصفية الدفعات' });
  [['','الكل'],['paid','مدفوعة'],['pending','معلّقة'],['failed','فاشلة']].forEach(t => {
    const b = el('button', { class:'chip' + (t[0] === status ? ' is-on' : ''), type:'button',
      'data-s': t[0], text: t[1] });
    b.addEventListener('click', () => {
      status = t[0];
      chips.querySelectorAll('.chip').forEach(x => x.classList.toggle('is-on', x.getAttribute('data-s') === status));
      draw();
    });
    chips.appendChild(b);
  });
  box.insertBefore(chips, body);

  function draw(){
    body.innerHTML = '';
    body.appendChild(el('p', { class:'page__sub', text:'جارٍ التحميل…' }));
    Promise.all([Pro.payments(status), Pro.coins(30)]).then(([p, c]) => {
      if (!body.isConnected) return;
      body.innerHTML = '';

      const coins = (c.ok && c.data && c.data.ok) ? c.data : null;
      if (coins){
        /* ★ الكوين يدخل من أبواب مختلفة: منحة (تكلفة تسويق)، شراء (إيراد)،
           إحالة (تكلفة اكتساب). جمعها في رقم واحد يجعل كل تحليل ربحية كاذبًا. */
        const KIND = { signup:'منحة تسجيل', purchase:'شراء', referral:'مكافأة إحالة',
                       spend:'إنفاق على الإثراء', refund:'ردّ', admin:'تعديل مشرف' };
        body.appendChild(el('section', { class:'ad-panel' }, [
          el('div', { class:'ad-panel__h' }, [
            el('h2', { class:'ad-panel__t', text:'دفتر الكوينز' }),
            el('span', { class:'ad-panel__s', text:'آخر ٣٠ يومًا' })
          ]),
          el('div', { class:'ad-grid2' }, (coins.by_kind || []).map(k =>
            el('div', { class:'ad-fact' }, [
              el('span', { class:'ad-fact__l', text: KIND[k.kind] || k.kind }),
              el('span', { class:'ad-fact__v num' + (Number(k.coins) < 0 ? ' is-out' : ''),
                text: Pro.n(k.coins) + ' كوين · ' + Pro.n(k.n) + ' حركة' })
            ])))
        ]));
      }

      const rows = (p.ok && Array.isArray(p.data)) ? p.data : [];
      if (!rows.length){
        body.appendChild(QBANK.views.empty('◇', 'لا دفعات', 'ستظهر هنا فور أول عملية.'));
        return;
      }
      const lbl = { paid:['badge--ok','مدفوعة'], pending:['badge--warn','معلّقة'], failed:['badge--bad','فاشلة'] };
      body.appendChild(el('div', { class:'stack' }, rows.map(x => {
        const st = lbl[x.status] || ['', x.status];
        const row = el('div', { class:'payrow' }, [
          el('span', { class:'payrow__t', text: (x.student || 'طالب') + ' — ' +
            (x.kind === 'coins' ? Pro.n(x.coins) + ' كوين' : (x.subject || 'مادة')) }),
          el('span', { class:'badge num', text: Pro.money(x.amount_halalas) }),
          el('span', { class:'badge ' + st[0], text: st[1] }),
          el('span', { class:'payrow__d num', text: new Date(x.created_at).toLocaleDateString('ar') })
        ]);
        if (x.status === 'paid'){
          const rb = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'ردّ' });
          rb.addEventListener('click', () => {
            /* ★ نقول صراحةً إن هذا لا يُعيد المال إلى البطاقة — الردّ المالي
               في لوحة البوابة. الوهم هنا يعني طالبًا ينتظر مالًا لن يصله. */
            if (!confirm('سيُسحب ما مُنح لهذا الطالب ويُسجَّل الردّ عندنا.\n' +
                         'أمّا إعادة المال إلى بطاقته فتتم في لوحة Tap — هذه لا تفعلها.\nأتريد المتابعة؟')) return;
            rb.disabled = true;
            Pro.refund(x.id, '').then(res => {
              const ok = res.ok && res.data && res.data.ok;
              QBANK.toast(ok ? 'سُجّل الردّ' : 'تعذّر');
              if (ok) draw();
            });
          });
          row.appendChild(rb);
        }
        if (x.fail_reason) row.appendChild(el('span', { class:'field__hint', text: x.fail_reason }));
        return row;
      })));
    });
  }
  draw();
}

      body.appendChild(QBANK.views.empty('✓', 'لا أسئلة مريبة',

    }
    rows.forEach(x => {

          el('a', { class:'rep__subj', href:'#/admin/subject/' + x.subject_id, text: x.subject }),
          el('span', { class:'rep__when num', text: Pro.n(x.seen) + ' طالبًا' })
        ]),
        el('p', { class:'rep__qt ltr', text: x.q }),
        // ★ «مستنتجة» هي أهم إشارة: إجابة لم تأتِ من ملف الدكتور وأخطأ فيها الأكثرون

          ? el('p', { class:'field__hint is-bad', style:'margin:0',

      ]);

/* ═══ تبويب الجامعات ═══ */
function proCampusTab(box){
  const body = el('div', { class:'stack' });
  box.appendChild(body);

  function draw(){
    body.innerHTML = '';
    body.appendChild(el('p', { class:'page__sub', text:'جارٍ التحميل…' }));
    Pro.campus().then(r => {
      if (!body.isConnected) return;
      body.innerHTML = '';
      const d = (r.ok && r.data && r.data.ok) ? r.data : null;
      if (!d){ body.appendChild(QBANK.views.empty('⚠', 'تعذّر الجلب', 'شغّل ADMIN-PRO.sql.')); return; }

      const unis = d.universities || [];
      body.appendChild(el('section', { class:'ad-panel' }, [
        el('div', { class:'ad-panel__h' }, [
          el('h2', { class:'ad-panel__t', text:'الجامعات' }),
          el('span', { class:'ad-panel__s', text: Pro.n(unis.length) + ' جامعة' })
        ]),
        el('div', { class:'stack' }, unis.map(u => {
          const row = el('div', { class:'payrow' }, [
            el('span', { class:'payrow__t', text: u.name }),
            el('span', { class:'badge num', text: Pro.n(u.subjects) + ' مادة' }),
            el('span', { class:'badge num', text: Pro.n(u.students) + ' طالب' }),
            u.verified ? el('span', { class:'badge badge--ok', text:'موثّقة' }) : null
          ]);
          const v = el('button', { class:'btn btn--sm btn--ghost', type:'button',
            text: u.verified ? 'أزل التوثيق' : 'وثّقها' });
          v.addEventListener('click', () => {
            v.disabled = true;
            Pro.verifyUniversity(u.id, !u.verified).then(() => draw());
          });
          const mg = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'ادمجها في…' });
          mg.addEventListener('click', () => {
            /* ★ الدمج هو الإصلاح الذي ستحتاجه حتمًا: توحيد الإملاء يمنع أكثر
               التكرار لا كلّه — «جامعة الملك سعود» و«KSU» لا تجمعهما خوارزمية. */
            const names = unis.filter(x => x.id !== u.id).map((x, i) => (i+1) + ') ' + x.name).join('\n');
            const pick = prompt('ادمج «' + u.name + '» في أيّ جامعة؟ اكتب رقمها:\n' + names);
            const idx = parseInt(pick, 10);
            const target = unis.filter(x => x.id !== u.id)[idx - 1];
            if (!target) return;
            if (!confirm('ستنتقل كل مواد وكليات وطلاب «' + u.name + '» إلى «' + target.name +
                         '»، وتُحذف «' + u.name + '».\nلا رجعة في هذا. أتتابع؟')) return;
            Pro.mergeUniversity(u.id, target.id).then(res => {
              QBANK.toast(res.ok && res.data && res.data.ok ? 'تمّ الدمج' : 'تعذّر الدمج');
              draw();
            });
          });
          row.appendChild(v); row.appendChild(mg);
          return row;
        }))
      ]));

      const cr = d.top_creators || [];
      if (cr.length)
        body.appendChild(el('section', { class:'ad-panel' }, [
          el('div', { class:'ad-panel__h' }, [ el('h2', { class:'ad-panel__t', text:'أكثر الرافعين' }) ]),
          el('div', { class:'stack' }, cr.map((c, i) => el('div', { class:'brd__row' }, [
            el('span', { class:'brd__rank num', text: Pro.n(i + 1) }),
            el('span', { class:'brd__name', text: c.name || 'طالب' }),
            el('span', { class:'brd__pts num', text: Pro.n(c.subjects) + ' مادة · ' + Pro.n(c.questions) + ' سؤال' })
          ])))
        ]));
    });
  }
  draw();
}

  const T = QBANK.views.ADMIN_TABS;
  const dash = T.filter(t => t.id === 'dash')[0];
  if (dash) dash.fill = proDashTab;          // نستبدل اللوحة القديمة بالكاملة

  const add = (id, label, fill, before) => {
    if (T.some(t => t.id === id)) return;
    const at = T.findIndex(t => t.id === before);
    const tab = { id, label, fill };
    if (at === -1) T.push(tab); else T.splice(at, 0, tab);
  };
  add('quality', 'الجودة', proQualityTab, 'settings');
  add('money',   'المال',   proMoneyTab,   'settings');
  add('campus',  'الجامعات', proCampusTab, 'settings');
  add('audit',   'السجل',   proAuditTab,   'settings');
}

/* ═══ تبويب الطلاب: عرض وتحكم ═══ */
function proStudentsTab(box){
  const search = el('input', { class:'input', type:'search', placeholder:'ابحث باسم الطالب…' });
  const list = el('div', { class:'stack' });
  box.appendChild(el('div', { class:'ad-bar' }, [search]));
  box.appendChild(list);

  let timer = null;
  search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(draw, 400); });

  function studentCard(r){
    const card = el('article', { class:'stu' });
    const head = el('div', { class:'stu__h' }, [
      el('span', { class:'stu__av', 'aria-hidden':'true', text: r.avatar || '◍' }),
      el('div', { class:'stu__x' }, [
        el('span', { class:'stu__n', text: (r.name || 'بلا اسم') + (r.is_admin ? ' · مشرف' : '') }),
        el('span', { class:'stu__s', text: [
          r.university || 'بلا جامعة',
          Pro.n(r.attempts) + ' اختبار',
          Pro.n(r.uploaded) + ' مادة مرفوعة'
        ].join(' · ') })
      ]),
      el('span', { class:'badge num', text: Pro.n(r.coins) + ' كوين' }),
      Number(r.paid) > 0 ? el('span', { class:'badge badge--ok num', text: Pro.money(r.paid) }) : null
    ]);
    card.appendChild(head);

    const msg = el('span', { class:'field__hint', role:'status' });
    const amount = el('input', { class:'input', type:'number', value:'100',
      'aria-label':'عدد الكوينز', style:'max-width:8em' });

    /*
      ★ التحديث في مكانه لا إعادة بناء القائمة.
      كانت تُنادى draw() بعد المنح فتُمحى الرسالة التي تقول «الرصيد الآن
      ٣٥٠» قبل أن يقرأها المشرف — فيشكّ هل وصل المنح ويمنح ثانيةً.
      وهذا في المال خطأٌ يُكلّف. فنُحدّث الشارة والرسالة ونُبقي البطاقة.
    */
    const coinBadge = head.querySelector('.badge.num');
    const applyCoins = (delta, label) => {
      const n = parseInt(amount.value, 10);
      if (!n){ msg.className = 'field__hint is-bad'; msg.textContent = 'اكتب عددًا.'; return; }
      msg.className = 'field__hint'; msg.textContent = 'جارٍ…';
      Pro.grantCoins(r.id, delta * Math.abs(n), label).then(res => {
        const ok = res.ok && res.data && res.data.ok;
        if (!ok){ msg.className = 'field__hint is-bad'; msg.textContent = 'تعذّر'; return; }
        r.coins = res.data.balance;
        if (coinBadge) coinBadge.textContent = Pro.n(r.coins) + ' كوين';
        msg.className = 'field__hint is-ok';
        msg.textContent = 'الرصيد الآن ' + Pro.n(res.data.balance);
      });
    };

    const give = el('button', { class:'btn btn--sm btn--soft', type:'button', text:'امنح' });
    give.addEventListener('click', () => applyCoins(1, 'منح يدوي'));

    const take = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'اسحب' });
    take.addEventListener('click', () => applyCoins(-1, 'سحب يدوي'));

    const role = el('button', { class:'btn btn--sm btn--ghost', type:'button',
      text: r.is_admin ? 'أنزله من الإشراف' : 'ارفعه مشرفًا' });
    role.addEventListener('click', () => {
      if (!confirm(r.is_admin
            ? 'سيفقد ' + (r.name || 'هذا الطالب') + ' كل صلاحيات الإشراف.'
            : 'سيصير ' + (r.name || 'هذا الطالب') + ' مشرفًا: يرى كل البيانات ويعدّل كل شيء.')) return;
      role.disabled = true;
      Pro.setRole(r.id, !r.is_admin).then(res => {
        role.disabled = false;
        const d = res.data || {};
        if (d.ok){ draw(); return; }
        /* ★ سببان يستحقان اسمًا: لا تُنزل نفسك، ولا تترك المنصة بلا مشرف.
           «تعذّر» وحدها تجعل المشرف يظنّ عطلًا وهو حارس متعمَّد. */
        msg.textContent = d.reason === 'self_demote' ? 'لا تُنزل نفسك — لن يبقى من يرفعك.'
          : d.reason === 'last_admin' ? 'هذا آخر مشرف — ارفع غيره أولًا.'
          : 'تعذّر';
      });
    });

    card.appendChild(el('div', { class:'stu__act' }, [
      amount, give, take, role, msg
    ]));
    return card;
  }

  function draw(){
    list.innerHTML = '';
    list.appendChild(el('p', { class:'page__sub', text:'جارٍ الجلب…' }));
    QBANK.api.rpc('admin_students_pro', { p_search: search.value || '', p_limit: 50 }).then(r => {
      if (!list.isConnected) return;
      list.innerHTML = '';
      const rows = (r.ok && Array.isArray(r.data)) ? r.data : [];
      if (!rows.length){
        list.appendChild(QBANK.views.empty('◍', 'لا طلاب',
          search.value ? 'لا مطابقة لبحثك.' : 'سيظهرون هنا فور تسجيلهم.'));
        return;
      }
      rows.forEach(x => list.appendChild(studentCard(x)));
    });
  }
  draw();
}

QBANK.views.proStudentsTab = proStudentsTab;
if (QBANK.views.ADMIN_TABS){
  const st = QBANK.views.ADMIN_TABS.filter(t => t.id === 'students')[0];
  if (st) st.fill = proStudentsTab;
}


/* ===== 57-analysis.js ===== */
/*
  التحليل الشامل للمادة — واجهة الطبقة التي كانت يدوية.

  «عن المادة» و«طريقة الحفظ» و«الأخطاء الشائعة» تصل من القاعدة HTML جاهزًا
  (ولّده الخادم وتحقق منه)، وهنا: الجلب والعرض، وإعادة التوليد حين يبطل،
  وعدّاد الاختبار الذي يضبطه كل طالب لنفسه.
*/

const ANALYSIS_TAGS = ['P','STRONG','EM','H3','H4','TABLE','THEAD','TBODY',
                       'TR','TH','TD','UL','LI','SECTION','BR'];

/*
  ★ التعقيم مرتين — في الخادم وهنا.
  الخادم عقّم قبل الكتابة، لكن القاعدة قد تُكتب من طريق آخر يومًا (مشرف
  يحرّر يدويًا، هجرة، خطأ). الدفاع في العمق: المتصفح لا يثق حتى بقاعدته.
  نبني DOM ونمسح كل وسم خارج القائمة وكل سمة — ثم نُعيد العقد لا innerHTML.
*/
function analysisHtml(html){
  const box = document.createElement('div');
  box.innerHTML = String(html || '');
  const walk = (node) => {
    const kids = Array.prototype.slice.call(node.children);
    kids.forEach(el0 => {
      walk(el0);
      if (ANALYSIS_TAGS.indexOf(el0.tagName) === -1){
        // الوسم الغريب يذوب: نصّه يبقى وعظمه يُنزع
        while (el0.firstChild) node.insertBefore(el0.firstChild, el0);
        node.removeChild(el0);
      } else {
        Array.prototype.slice.call(el0.attributes).forEach(a => el0.removeAttribute(a.name));
      }
    });
  };
  walk(box);
  box.className = 'analysis';
  return box;
}

const Analysis = {
  _cache: {},

  async get(sid, fresh){
    if (!fresh && Analysis._cache[sid]) return Analysis._cache[sid];
    const r = await QBANK.api.rpc('subject_analysis', { sid });
    const a = (r.ok && r.data) ? r.data : null;
    if (a) Analysis._cache[sid] = a;
    return a;
  },

  /* توليد التحليل في الخادم — يصل بهوية الطالب فيتحقق الخادم أنها مادته */
  async generate(sid, lang){
    delete Analysis._cache[sid];
    const base = QBANK.admin ? QBANK.admin.apiBase() : '';
    const f = QBANK.api.fetchFn();
    if (base === null || !f) return { ok:false, offline:true };
    const s = QBANK.api.session();
    try{
      const res = await f(base + '/api/analyze', {
        method:'POST',
        headers:{ 'Content-Type':'application/json',
                  'Authorization':'Bearer ' + (s && s.access_token || '') },
        body: JSON.stringify({ subject_id: sid, lang: lang || 'ar' })
      });
      const data = await res.json().catch(() => null);
      return { ok: res.ok, status: res.status, data };
    } catch(e){ return { ok:false, offline:true, err: e.message }; }
  },

  /*
    ★ التحديث الذاتي: تحليلٌ بَطَل (أُضيفت أسئلة بعده) يُعاد توليده تلقائيًا
    أول ما يفتح صاحبُ المادة صفحتها — كما اختار علي. صاحبها لا زائرها:
    الزائر يرى النسخة الأخيرة الصالحة، ولا يدفع كلفة توليدٍ ليس له.
  */
  maybeRefresh(sub, a, onDone){
    if (!a || !a.stale) return false;
    const u = QBANK.api.user();
    const mine = u && sub.created_by === u.id;
    const admin = QBANK.store.get('is_admin_check', {}).ok;
    if (!mine && !admin) return false;
    Analysis.generate(sub.id, a.lang || 'ar').then(r => { if (r.ok && onDone) onDone(); });
    return true;
  }
};

/* ═══ عدّاد الاختبار — كل طالب يضبط موعده ═══ */
/*
  محليّ في الجهاز عمدًا: الشُّعب تختلف مواعيدها، وموعد طالبٍ لا يخص زميله.
  التخزين مفتاح واحد {sid: iso}، والعرض عدّاد حيّ بالثواني — الرقم الذي
  يُبقي الطالب مستيقظًا هو «متبقٍ ١٨:٣٦:٢٤» لا تاريخ جامد.
*/
const ExamDate = {
  KEY: 'exam_dates',
  get(sid){ return QBANK.store.get(ExamDate.KEY, {})[sid] || null; },
  set(sid, iso){
    const d = QBANK.store.get(ExamDate.KEY, {});
    if (iso) d[sid] = iso; else delete d[sid];
    QBANK.store.set(ExamDate.KEY, d);
  },

  /* «متبقٍ ٤٥:١٢:٠٩» — بالساعات الكلية لا بالأيام: ٤٥ ساعة أوقع من «يومان» */
  left(iso, now){
    const ms = new Date(iso).getTime() - (now || Date.now());
    if (isNaN(ms)) return null;
    if (ms <= 0) return { over:true, text:'حان وقت الاختبار — بالتوفيق!' };
    const s = Math.floor(ms / 1000);
    const p2 = n => (n < 10 ? '0' : '') + n;
    return { over:false, text:'متبقٍ ' + QBANK.views.arNum(Math.floor(s / 3600)) + ':' +
      QBANK.views.arNum(p2(Math.floor(s / 60) % 60)) + ':' + QBANK.views.arNum(p2(s % 60)) };
  },

  band(sid){
    const box = el('div', { class:'exambar' });
    let timer = null;
    const stop = () => { if (timer) { clearInterval(timer); timer = null; } };

    function render(){
      stop();
      box.innerHTML = '';
      const iso = ExamDate.get(sid);
      if (!iso){
        const btn = el('button', { class:'btn btn--sm btn--ghost', type:'button',
          text:'🗓 متى اختبارك؟ اضبط عدّادك' });
        btn.addEventListener('click', () => edit());
        box.appendChild(btn);
        return;
      }
      const t = el('span', { class:'exambar__t num' });
      const when = el('span', { class:'field__hint', text: new Date(iso).toLocaleString('ar', {
        weekday:'long', day:'numeric', month:'long', hour:'numeric', minute:'2-digit' }) });
      const change = el('button', { class:'iconbtn', type:'button', 'aria-label':'غيّر الموعد', text:'✎' });
      change.addEventListener('click', () => edit());
      box.appendChild(el('div', { class:'row', style:'align-items:center' }, [t, when, change]));
      const tick = () => {
        // ★ الوثيقة قد تُفكَّك والعدّاد حي — نوقفه بدل أن ينهار كل ثانية
        if (!box.isConnected) return void stop();
        const L = ExamDate.left(iso);
        t.textContent = L ? L.text : '';
        if (L && L.over) stop();
      };
      tick();
      timer = setInterval(tick, 1000);
    }

    function edit(){
      stop();
      box.innerHTML = '';
      const cur = ExamDate.get(sid);
      const inp = el('input', { class:'input', type:'datetime-local',
        'aria-label':'موعد اختبارك', value: cur ? cur.slice(0, 16) : '' });
      const save = el('button', { class:'btn btn--sm', type:'button', text:'احفظ' });
      const clear = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'أزل الموعد' });
      save.addEventListener('click', () => {
        if (inp.value) ExamDate.set(sid, new Date(inp.value).toISOString());
        render();
      });
      clear.addEventListener('click', () => { ExamDate.set(sid, null); render(); });
      box.appendChild(el('div', { class:'row' }, [inp, save, cur ? clear : null]));
    }

    render();
    return box;
  }
};

/* بطاقة المحاور بعدّاداتها — «الابتكار التسويقي (الفصل السادس) · ١١» */
function topicsCard(a){
  const ts = (a && a.topics) || [];
  if (!ts.length) return null;
  return el('div', { class:'card stack' }, [
    el('h2', { text:'محاور المادة' }),
    el('div', { class:'stack' }, ts.map(t =>
      el('div', { class:'row', style:'justify-content:space-between' }, [
        el('span', { text: t.name }),
        el('span', { class:'badge num', text: QBANK.views.arNum(t.n) + ' سؤالًا' })
      ])))
  ]);
}

QBANK.analysis = Analysis;
QBANK.examDate = ExamDate;
QBANK.views.analysisHtml = analysisHtml;
QBANK.views.topicsCard = topicsCard;

})();
