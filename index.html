  padding:var(--s2) var(--s3); border-radius:var(--r-pill); min-height:34px;
  background:var(--surface); border:1px solid var(--line); color:var(--text-2);
  font-size:.82rem; font-weight:600; cursor:pointer; white-space:nowrap;
}
.chip:hover{ border-color:var(--brand); color:var(--brand); }
.chip.is-on{ background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
.chip__n{ font-size:.72rem; opacity:.7; }

.ex-grid{ display:grid; gap:var(--s4); grid-template-columns:1fr; }
@media (min-width:600px){ .ex-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width:960px){ .ex-grid{ grid-template-columns:repeat(3,1fr); } }

.excard{
  position:relative; overflow:hidden; display:flex; flex-direction:column; gap:var(--s2);
  padding:var(--s5) var(--s4) var(--s4); border-radius:var(--r3);
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh1);
  color:var(--text); transition:transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.excard:hover{ text-decoration:none; transform:translateY(-2px); box-shadow:var(--sh2); }
.excard__bar{ position:absolute; inset-inline:0; top:0; height:4px; }
.excard__head{ display:flex; align-items:center; gap:var(--s2); }
.excard__ico{ font-size:1.2rem; }
.excard__t{ font-family:var(--font-display); font-weight:800; line-height:1.4; }
.excard__where{ font-size:.78rem; color:var(--brand); font-weight:700; }
.excard__d{
  font-size:.84rem; color:var(--text-2); line-height:1.7;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.excard__meta{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:auto; padding-top:var(--s2); }

.ex-pager{ display:flex; align-items:center; justify-content:center; gap:var(--s4); margin-top:var(--s6); }
.ex-pageno{ font-size:.85rem; color:var(--text-3); }

/* ═══ دليل التنسيق ═══ */
.fmt{
  border:1px solid var(--line); border-radius:var(--r3);
  background:var(--surface); margin:var(--s4) 0; overflow:hidden;
}
.fmt__sum{
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  padding:var(--s4) var(--s5); cursor:pointer; min-height:52px;
  font-family:var(--font-display); font-weight:800; list-style:none;
}
.fmt__sum::-webkit-details-marker{ display:none; }
.fmt__sum::before{ content:'▸'; color:var(--brand); transition:transform var(--t-fast) var(--ease); }
.fmt[open] .fmt__sum::before{ transform:rotate(-90deg); }
.fmt__hint{ font-family:var(--font); font-weight:600; font-size:.78rem; color:var(--text-3); }
.fmt__body{ padding:0 var(--s5) var(--s5); display:grid; gap:var(--s4); }

/* خطوات ما يحدث للملف — ترقيم حقيقي لأنها تسلسل فعلي لا زينة */
.fmt__pipe{ list-style:none; margin:0; padding:0; display:grid; gap:var(--s3); }
.fmt__pipe li{ display:flex; gap:var(--s3); align-items:flex-start; }
.fmt__pn{
  flex:0 0 auto; width:24px; height:24px; border-radius:50%;
  display:grid; place-items:center; font-size:.78rem; font-weight:700;
  background:var(--brand-soft); color:var(--brand);
}
.fmt__pd{ display:block; font-size:.84rem; color:var(--text-2); line-height:1.75; }

.fmt__card{
  border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s4); background:var(--bg);
}
.fmt__card--check{ background:var(--gold-soft); border-color:var(--gold); }
.fmt__t{ margin:0 0 var(--s1); font-family:var(--font-display); font-size:.95rem; }
.fmt__when{ margin:0 0 var(--s3); font-size:.82rem; color:var(--text-2); }
.fmt__rules{ margin:0 0 var(--s3); padding-inline-start:var(--s5); font-size:.84rem; color:var(--text-2); line-height:1.9; }

/* القالب: نصّ ملف حقيقي — أحادي المسافة وقابل للتمرير أفقيًا وحده */
.fmt__code{
  margin:0 0 var(--s3); padding:var(--s3) var(--s4);
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r1);
  font-family:var(--font-num); font-size:.78rem; line-height:1.9;
  overflow-x:auto; white-space:pre; color:var(--text);
}
.fmt__out{ margin:var(--s3) 0 0; font-size:.85rem; font-weight:700; min-height:1.2em; }
.fmt__out.is-ok{ color:var(--ok); }
.fmt__out.is-no{ color:var(--bad); }

/* صفّ فرعي داخل صفّ — تفاصيل تُفتح تحت السطر لا تزاحمه */
.ad-sub{
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  padding:var(--s3) 0 0; margin-top:var(--s2);
  border-top:1px dashed var(--line-soft);
}
.ad-inline{ display:flex; align-items:center; gap:var(--s2); }
.ad-inline__l{ font-size:.76rem; font-weight:700; color:var(--text-3); white-space:nowrap; }
.ad-inline .input{ width:auto; }

/* ═══ صندوق التكلفة ═══ */
.costbox{
  display:grid; gap:var(--s1);
  padding:var(--s4); border-radius:var(--r2);
  background:var(--gold-soft); border:1px solid var(--gold);
}
.costbox__l{ font-size:.78rem; font-weight:700; color:var(--text-2); }
.costbox__n{ font-family:var(--font-num); font-size:1.35rem; font-weight:700; color:var(--brand); }
.costbox__s{ font-size:.78rem; color:var(--text-2); line-height:1.7; }

/* ═══ مساران للنشر ═══ */
.paths{ display:grid; gap:var(--s3); }
@media (min-width:640px){ .paths{ grid-template-columns:1fr 1fr; } }
.path{
  display:flex; flex-direction:column; gap:var(--s2); text-align:start; cursor:pointer;
  padding:var(--s4); border-radius:var(--r2);
  background:var(--surface); border:2px solid var(--line); color:var(--text);
}
.path:hover{ border-color:var(--brand); }
.path[aria-checked="true"]{ border-color:var(--brand); background:var(--brand-soft); }
.path__h{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s2); }
.path__t{ font-family:var(--font-display); font-weight:800; }
.path__t::before{ content:'○ '; color:var(--text-3); }
.path[aria-checked="true"] .path__t::before{ content:'● '; color:var(--brand); }
.path__p{ font-weight:700; color:var(--brand); white-space:nowrap; }
.path__d{ font-size:.84rem; color:var(--text-2); line-height:1.75; }
/* ما ينقص المسار — يُقال بصراحة لا يُخبأ */
.path__m{ font-size:.78rem; color:var(--text-3); line-height:1.7; }
.path.is-blocked{ opacity:.55; cursor:not-allowed; }
.path.is-blocked:hover{ border-color:var(--line); }


/* شريط تحذير البلاغات في محرّر المادة — بابٌ لا مجرد إشعار */
.ad-warn{
  display:flex; align-items:center; justify-content:space-between; gap:var(--s3);
  margin-top:var(--s4); padding:var(--s3) var(--s4);
  background:var(--warn-soft); border:1px solid var(--warn); border-radius:var(--r1);
  color:var(--warn); font-weight:700; font-size:.9rem; text-decoration:none;
}
.ad-warn:hover{ filter:brightness(.97); }

    فيرث الداخلُ الجديدُ ملفَ من قبله: صورتَه ورقمَ جواله وتقدّمَه — بل
    ومشترياته. هذا ليس خللًا في العرض، هو تسريبُ بياناتٍ بين حسابين.

    القائمة صريحة لا نمطية: مفتاحٌ جديد يُنسى إضافته يبقى ظاهرًا فيُكتشف،
    ومفتاحُ جهازٍ يُمسح خطأً (السمة، إعداد الربط) عطلٌ صامت يحيّر صاحبه.
  */
  PERSONAL: ['profile', 'progress', 'entitlements', 'campus', 'my_subjects',
             'is_admin_check', 'exam_dates', 'after_login', 'ad_days', 'explore_last'],
  clearPersonal(){
    Store.PERSONAL.forEach(k => Store.remove(k));
    return true;
  }
};

/* --- رسالة عابرة --- */
let toastTimer = null;
function toast(msg, ms){
  const box = $('#toast');
  if (!box) return;
  box.textContent = msg;
  box.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove('is-on'), ms || 2400);
}

QBANK.dom = { $, $$, el, esc };
QBANK.store = Store;
QBANK.toast = toast;


/* ===== 10-theme.js ===== */
/*
  الليلي هو الافتراضي — مثل AMSU تمامًا وبطلب علي.
  اختيار المستخدم يُحترم أولًا، ومن لم يختر يفتح على الليل: الطلاب يذاكرون
  ليلًا في الغالب، وهوية AMSU المنقولة صُمّمت على الأسود أولًا.
*/
const Theme = {
  KEY: 'theme',
  DEFAULT: 'dark',
  apply(mode){
    // mode: 'light' | 'dark' | 'auto'
    const root = document.documentElement;
    const isDark = mode === 'dark' || (mode === 'auto' && Theme.prefersDark());
    if (isDark) root.setAttribute('data-theme','dark');
    else root.setAttribute('data-theme','light');
    const ico = document.querySelector('[data-theme-icon]');
    if (ico) ico.textContent = isDark ? '☀' : '☾';
    return isDark ? 'dark' : 'light';
  },
  prefersDark(){
    try{ return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
    catch(e){ return false; }
  },
  current(){ return QBANK.store.get(Theme.KEY, Theme.DEFAULT); },
  set(mode){ QBANK.store.set(Theme.KEY, mode); return Theme.apply(mode); },
  toggle(){
    const now = document.documentElement.getAttribute('data-theme') === 'dark';
    return Theme.set(now ? 'light' : 'dark');
  },
  init(){
    Theme.apply(Theme.current());
    const btn = document.getElementById('themeBtn');
    if (btn) btn.addEventListener('click', () => Theme.toggle());
  }
};
QBANK.theme = Theme;


/* ===== 12-config.js ===== */
/*
  الإعداد: رابط Supabase والمفتاح العام (anon) فقط.
  المفتاح العام مصمَّم ليكون في المتصفح — RLS هي الحماية الحقيقية.
  أما مفاتيح الخدمة والذكاء فلا تقترب من هذا الملف: مكانها متغيرات بيئة Vercel حصرًا.
*/
const Config = {
  KEY: 'config',
  get(){
    // الأولوية: ما حُقن وقت البناء (config.json) ثم ما حفظه المشرف في الجهاز
    const injected = (typeof window !== 'undefined' && window.QBANK_INJECTED_CONFIG) || null;
    return injected || QBANK.store.get(Config.KEY, null);
  },
  set(url, anonKey){
    if (!/^https:\/\//.test(url || '')) return { ok:false, err:'الرابط يجب أن يبدأ بـ https://' };
    if (!anonKey || anonKey.length < 20) return { ok:false, err:'المفتاح العام غير صحيح' };
    QBANK.store.set(Config.KEY, { url: url.replace(/\/+$/,''), anonKey });
    return { ok:true };
  },
  ready(){ const c = Config.get(); return !!(c && c.url && c.anonKey); }
};
QBANK.config = Config;


/* ===== 14-api.js ===== */
/*
  طبقة Supabase بلا مكتبات: fetch خام إلى /auth/v1 و /rest/v1.
  لماذا بلا supabase-js؟ لأن قاعدة «لا مكتبة خارجية في المتصفح» ثابتة،
  والذي نحتاجه فعلًا (دخول، جلسة، تجديد، REST، RPC) يغطيه fetch مباشرة.
*/
const Api = {
  SESSION_KEY: 'session',
  _fetch: null,   // باب حقن للفحوص: تستبدل fetch بواحد وهمي

  fetchFn(){ return Api._fetch || (typeof fetch !== 'undefined' ? fetch.bind(window) : null); },

  session(){ return QBANK.store.get(Api.SESSION_KEY, null); },
  /* مفتاح صاحب البيانات المخزّنة — لا رمزٌ ولا سرّ، معرّفٌ للمقارنة وحده */
  UID_KEY: 'last_uid',
  saveSession(s){
    if (!s) {
      /* خروجٌ أو رمزٌ ميت: لا نترك أثر صاحبه لمن يأتي بعده */
      QBANK.store.clearPersonal();
      QBANK.store.remove(Api.UID_KEY);
      return QBANK.store.remove(Api.SESSION_KEY);
    }
    /*
      ★ الحارس الحقيقي هنا لا في زرّ الخروج.
      الخروجُ طريقٌ واحد من طرقٍ كثيرة لتبدّل الهوية: رمزٌ انتهت صلاحيته،
      دخولٌ برابط بريد، حسابٌ ثانٍ على المتصفح نفسه، تطبيقٌ أُعيد فتحه بعد
      شهر. فنقيس عند كل حفظِ جلسةٍ: من كان هنا؟ ومن جاء الآن؟
    */
    const uid = (s.user && s.user.id) || null;
    const was = QBANK.store.get(Api.UID_KEY, null);
    /* `was` فارغةً لا تعني تبدّلًا: قد يكون زائرًا ذاكر مجانًا ثم سجّل،
       ومسحُ تقدّمه عقوبةٌ على أنه سجّل. التبدّل يكون بين معلومَين. */
    if (uid && was && was !== uid) QBANK.store.clearPersonal();
    if (uid) QBANK.store.set(Api.UID_KEY, uid);

    // نحفظ وقت الانتهاء المطلق كي نعرف متى نجدّد دون الرجوع للخادم
    s.expires_abs = Date.now() + (s.expires_in ? s.expires_in * 1000 : 3600 * 1000);
    QBANK.store.set(Api.SESSION_KEY, s);
  },
  user(){ const s = Api.session(); return s && s.user ? s.user : null; },

  headers(){
    const c = QBANK.config.get() || {};
    const s = Api.session();
    return {
      'apikey': c.anonKey || '',
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + (s && s.access_token ? s.access_token : (c.anonKey || ''))
    };
  },

  async raw(path, opts){
    const c = QBANK.config.get();
    const f = Api.fetchFn();
    if (!c || !f) return { ok:false, offline:true, data:null };
    try{
      // جلسة على وشك الانتهاء؟ نجدّدها قبل الطلب لا بعد فشله
      const s = Api.session();
      if (s && s.refresh_token && s.expires_abs && Date.now() > s.expires_abs - 60000 && path.indexOf('/auth/') === -1) {
        await Api.auth.refresh();
      }
      const res = await f(c.url + path, Object.assign({ headers: Api.headers() }, opts || {}));
      const text = await res.text();
      let data = null;
      try{ data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
      return { ok: res.ok, status: res.status, data };
    } catch(e){
      return { ok:false, offline:true, data:null, err: e.message };
    }
  },

  rest(path, opts){ return Api.raw('/rest/v1/' + path, opts); },
  rpc(name, args){
    return Api.raw('/rest/v1/rpc/' + name, { method:'POST', body: JSON.stringify(args || {}) });
  },

  auth: {
    // عنوان العودة بعد الضغط على الرابط: موقعنا الحالي لا الافتراضي في إعدادات Supabase.
    // بدونه يعود المستخدم إلى localhost فلا يدخل — وهذا سبب فشل الدخول الأول.
    redirectTo(){
      if (typeof location === 'undefined') return '';
      // نحذف الهاش كي لا يختلط مسار التطبيق برموز الجلسة العائدة
      return location.origin + location.pathname;
    },
    magic(email){
      const back = Api.auth.redirectTo();
      return Api.raw('/auth/v1/otp' + (back ? '?redirect_to=' + encodeURIComponent(back) : ''), {
        method:'POST',
        body: JSON.stringify({
          email, create_user: true,
          options: { emailRedirectTo: back }
        })
      });
    },
    // دخول جوجل/آبل: توجيه كامل للصفحة — يصلح للويب والتطبيق معًا
    oauthUrl(provider){
      const c = QBANK.config.get();
      if (!c) return null;
      const back = (typeof location !== 'undefined') ? location.origin + location.pathname : '';
      return c.url + '/auth/v1/authorize?provider=' + provider + '&redirect_to=' + encodeURIComponent(back);
    },
    // عند العودة من رابط سحري أو OAuth تصل الرموز في هاش الصفحة
    /*
      ★ التحقق برمز مكتوب — طريق الدخول داخل التطبيق المغلّف.
      رابط البريد يفتح في متصفح الجهاز الافتراضي لا داخل التطبيق، فتُحفظ
      الجلسة هناك ويبقى التطبيق زائرًا. الرمز يُكتب حيث يقف الطالب،
      فتولد الجلسة في المكان الصحيح — تطبيقًا كان أو متصفحًا.
    */
    async verifyOtp(email, token){
      const r = await Api.raw('/auth/v1/verify', {
        method:'POST',
        body: JSON.stringify({ type:'email', email, token: String(token || '').trim() })
      });
      if (r.ok && r.data && r.data.access_token){
        Api.saveSession({
          access_token: r.data.access_token,
          refresh_token: r.data.refresh_token || '',
          expires_in: r.data.expires_in || 3600,
          user: r.data.user || Api.auth.decodeUser(r.data.access_token)
        });
      }
      return r;
    },
    captureFromHash(hash){
      const h = String(hash || '');
      if (h.indexOf('access_token=') === -1) return false;
      const p = {};
      h.replace(/^#/,'').split('&').forEach(kv => {
        const [k,v] = kv.split('=');
        p[k] = decodeURIComponent(v || '');
      });
      if (!p.access_token) return false;
      Api.saveSession({
        access_token: p.access_token,
        refresh_token: p.refresh_token || '',
        expires_in: parseInt(p.expires_in || '3600', 10),
        user: Api.auth.decodeUser(p.access_token)
      });
      return true;
    },
    // نقرأ هوية المستخدم من الـJWT نفسه — بلا نداء شبكة إضافي
    decodeUser(jwt){
      try{
        const payload = JSON.parse(
          decodeURIComponent(escape(atob(jwt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))))
        );
        return { id: payload.sub, email: payload.email || '' };
      } catch(e){ return null; }
    },
    async refresh(){
      const s = Api.session();
      if (!s || !s.refresh_token) return { ok:false };
      const r = await Api.raw('/auth/v1/token?grant_type=refresh_token', {
        method:'POST', body: JSON.stringify({ refresh_token: s.refresh_token })
      });
      if (r.ok && r.data && r.data.access_token) {
        r.data.user = r.data.user || Api.auth.decodeUser(r.data.access_token);
        Api.saveSession(r.data);
      } else if (!r.offline) {
        Api.saveSession(null);   // رمز تجديد ميت: جلسة منتهية فعلًا
      }
      return r;
    },
    async signOut(){
      /*
        الكنس قبل النداء لا بعده: لو انقطعت الشبكة عند الخادم بقيت بيانات
        الخارج على الجهاز رغم أنه ضغط «خروج». نيّته صريحة، فتُنفَّذ محليًا
        على كل حال، والخادم يلحق.
      */
      QBANK.store.clearPersonal();
      QBANK.store.remove(Api.UID_KEY);
      await Api.raw('/auth/v1/logout', { method:'POST' });
      Api.saveSession(null);
    },
    async deleteMe(){
      const r = await Api.rpc('delete_me');
      if (r.ok) { Api.saveSession(null); QBANK.store.clearAll(); }
      return r;
    }
  },

  /* --- ملف المستخدم الشخصي --- */
  async myProfile(){
    const u = Api.user();
    if (!u) return { ok:false };
    const r = await Api.rest('profiles?id=eq.' + u.id + '&select=*');
    return r.ok && r.data && r.data[0] ? { ok:true, data:r.data[0] } : r;
  },
  saveProfile(fields){
    const u = Api.user();
    if (!u) return Promise.resolve({ ok:false });
    return Api.rest('profiles?id=eq.' + u.id, { method:'PATCH', body: JSON.stringify(fields) });
  }
};
QBANK.api = Api;


/* ===== 16-data.js ===== */
/*
  مخزن المحتوى المحلي: الأسئلة في IndexedDB لأن مادة واحدة بمئات الأسئلة
  تتجاوز سقف localStorage (≈ ٥ ميغابايت). عند غياب IndexedDB (فحوص jsdom،
  أو تصفح خاص متشدد) نسقط إلى ذاكرة مؤقتة فلا تنكسر المنصة — تعمل بلا حفظ فقط.
*/
const Data = {
  DB_NAME: 'qbank', DB_VER: 1,
  _db: null,
  _mem: { questions: new Map(), meta: new Map() },
  hasIDB(){ return typeof indexedDB !== 'undefined'; },

  OLD_DB: 'amusq',   // قاعدة الأسئلة قبل تغيير الهوية

  /*
    نقل أسئلة الطالب المحفوظة من قاعدة الهوية القديمة.

    الأسئلة بيانات مشتقّة تُجلب من الخادم عند الحاجة، لكن وعد المنصة أنها
    «تعمل بلا إنترنت بعد أول فتح». لو تركنا القديمة لوجد الطالب الذي يذاكر
    في الطائرة مادته فارغة. فننسخها مرة واحدة ثم نحذف القديمة كي لا تشغل مساحة.
  */
  migrateDB(){
    if (!Data.hasIDB()) return Promise.resolve(0);
    return new Promise(resolve => {
      let req;
      try { req = indexedDB.open(Data.OLD_DB); } catch(e){ return resolve(0); }
      req.onerror = () => resolve(0);
      req.onupgradeneeded = () => {
        // لم تكن موجودة أصلًا: نُجهض الإنشاء فلا نترك قاعدة فارغة خلفنا
        try { req.transaction.abort(); } catch(e){}
        resolve(0);
      };
      req.onsuccess = async () => {
        const oldDb = req.result;
        if (!oldDb.objectStoreNames.contains('questions')){ oldDb.close(); return resolve(0); }
        const rows = await new Promise(r => {
          try {
            const g = oldDb.transaction('questions','readonly').objectStore('questions').getAll();
            g.onsuccess = () => r(g.result || []); g.onerror = () => r([]);
          } catch(e){ r([]); }
        });
        oldDb.close();
        if (!rows.length){ try { indexedDB.deleteDatabase(Data.OLD_DB); } catch(e){} return resolve(0); }
        const db = await Data.open();
        if (!db) return resolve(0);
        const tx = db.transaction('questions','readwrite');
        const st = tx.objectStore('questions');
        rows.forEach(q => { try { st.put(q); } catch(e){} });
        tx.oncomplete = () => { try { indexedDB.deleteDatabase(Data.OLD_DB); } catch(e){} resolve(rows.length); };
        tx.onerror = () => resolve(0);
      };
    });
  },

  open(){
    if (!Data.hasIDB()) return Promise.resolve(null);
    if (Data._db) return Promise.resolve(Data._db);
    return new Promise((resolve) => {
      const req = indexedDB.open(Data.DB_NAME, Data.DB_VER);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('questions')) {
          const st = db.createObjectStore('questions', { keyPath:'id' });
          st.createIndex('subject_id', 'subject_id');   // الجلب دائمًا بمادة كاملة
        }
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath:'k' });
      };
      req.onsuccess = () => { Data._db = req.result; resolve(Data._db); };
      req.onerror = () => resolve(null);   // فشل الفتح لا يُسقط المنصة
    });
  },

  async putQuestions(subjectId, questions){
    if (!Data.hasIDB()) {
      questions.forEach(q => Data._mem.questions.set(q.id, q));
      Data._mem.meta.set('subj:' + subjectId, Date.now());
      return true;
    }
    const db = await Data.open();
    if (!db) return false;
    return new Promise((resolve) => {
      const tx = db.transaction(['questions','meta'], 'readwrite');
      const st = tx.objectStore('questions');
      questions.forEach(q => st.put(q));
      tx.objectStore('meta').put({ k:'subj:' + subjectId, at: Date.now() });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  },

  async getQuestions(subjectId){
    if (!Data.hasIDB()) {
      return Array.from(Data._mem.questions.values())
        .filter(q => q.subject_id === subjectId)
        .sort((a,b) => (a.ord||0) - (b.ord||0));
    }
    const db = await Data.open();
    if (!db) return [];
    return new Promise((resolve) => {
      const tx = db.transaction('questions', 'readonly');
      const idx = tx.objectStore('questions').index('subject_id');
      const req = idx.getAll(subjectId);
      req.onsuccess = () => resolve((req.result || []).sort((a,b) => (a.ord||0) - (b.ord||0)));
      req.onerror = () => resolve([]);
    });
  },

  async hasSubject(subjectId){
    if (!Data.hasIDB()) return Data._mem.meta.has('subj:' + subjectId);
    const db = await Data.open();
    if (!db) return false;
    return new Promise((resolve) => {
      const req = db.transaction('meta','readonly').objectStore('meta').get('subj:' + subjectId);
      req.onsuccess = () => resolve(!!req.result);
      req.onerror = () => resolve(false);
    });
  },

  async clearAll(){
    Data._mem.questions.clear(); Data._mem.meta.clear();
    if (!Data.hasIDB()) return true;
    const db = await Data.open();
    if (!db) return true;
    return new Promise((resolve) => {
      const tx = db.transaction(['questions','meta'], 'readwrite');
      tx.objectStore('questions').clear();
      tx.objectStore('meta').clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  },

  /* --- المحتوى المنشور: قائمة المواد خفيفة في localStorage، والأسئلة عند الطلب --- */
  pack(){ return QBANK.store.get('pack', { subjects: [], settings: {} }); },
  savePack(p){ QBANK.store.set('pack', p); },

  async refreshPack(){
    const r = await QBANK.api.rpc('content_pack');
    if (r.ok && r.data && r.data.subjects) { Data.savePack(r.data); return { ok:true, data:r.data }; }
    return r;   // فشل أو بلا إنترنت: نبقى على النسخة المخزّنة — هذا جوهر العمل دون اتصال
  },

  // أسئلة مادة: من الجهاز إن سبق جلبها، وإلا من الخادم ثم تُخزَّن — «تحميل على مراحل»
  async subjectQuestions(subjectId){
    if (await Data.hasSubject(subjectId)) {
      const local = await Data.getQuestions(subjectId);
      if (local.length) return { ok:true, data:local, from:'device' };
    }
    const r = await QBANK.api.rpc('subject_questions', { sid: subjectId });
    if (r.ok && Array.isArray(r.data)) {
      await Data.putQuestions(subjectId, r.data);
      return { ok:true, data:r.data, from:'network' };
    }
    return { ok:false, offline: r.offline, data: [] };
  }
};
QBANK.data = Data;


/* ===== 18-progress.js ===== */
/*
  التقدّم: محلي أولًا وفورًا، ثم يُدفع للحساب بتأخير ٢٫٥ ثانية بعد آخر نقرة.
  لماذا التأخير؟ طالب يقلّب ٣٠ بطاقة في دقيقة = ٣٠ كتابة شبكية بلا فائدة؛
  دفعة واحدة بعد سكونه تكفي وتوفّر البطارية والبيانات.
*/
const Progress = {
  KEY: 'progress',
  PUSH_DELAY: 2500,
  _timer: null,
  _pushFn: null,   // باب حقن للفحوص

  blank(){ return {}; },
  all(){ return QBANK.store.get(Progress.KEY, Progress.blank()); },
  save(p){ QBANK.store.set(Progress.KEY, p); Progress.schedulePush(); },

  forSubject(sid){
    const p = Progress.all();
    return p[sid] || { seen:{}, wrong:{}, star:{}, srs:{}, exams:0, best:0 };
  },
  _update(sid, fn){
    const p = Progress.all();
    const s = p[sid] || { seen:{}, wrong:{}, star:{}, srs:{}, exams:0, best:0 };
    fn(s); p[sid] = s; Progress.save(p);
    return s;
  },

  /* ═══════════════════════════════════════════════════════════
     التكرار المتباعد
     ═══════════════════════════════════════════════════════════
     المذاكرة بالإعادة الفورية وهمُ إتقان: تقرأ الشرح فتشعر أنك حفظت،
     ثم يذوب بعد يومين. الذي يثبّت المعلومة هو استرجاعُها بعد أن تكاد
     تنساها — والفارق بين الطريقتين ليس تحسينًا هامشيًا بل أضعافًا.

     ولمَ سُلَّمٌ ثابت لا SM-2؟ لأن SM-2 يقوم على تقدير الطالب لصعوبة
     تذكّره من ستّ درجات، ونحن لا نملك إلا نعم/لا. سُلَّمٌ صادق بمدخلٍ
     ثنائي خيرٌ من خوارزمية دقيقة تُغذَّى بتخمين.

     الفترات: يوم ← ٣ ← ٧ ← ١٦ ← ٣٥ ← ٦٠. والخطأ يُعيده إلى يومٍ واحد
     مهما بلغ — فالنسيان لا يُجامَل، لكن عدّاد التعثّر يُحفظ لأن سؤالًا
     تعثّر فيه خمس مرات يستحق عنايةً غير الذي تعثّر مرة.
  */
  LADDER: [1, 3, 7, 16, 35, 60],

  /* رقم اليوم منذ ١٩٧٠ بالتوقيت المحلي: صحيحٌ صغير يُقارَن ويُجمع بلا
     مناطق زمنية ولا ساعات — والمراجعة تُقاس بالأيام لا بالثواني. */
  today(now){
    const d = now ? new Date(now) : new Date();
    return Math.floor((d - d.getTimezoneOffset() * 60000) / 86400000);
  },

  /* الفترة التالية: نصعد درجةً عند الإصابة، ونهبط إلى القاع عند الخطأ */
  nextInterval(cur, ok){
    const L = Progress.LADDER;
    if (!ok) return L[0];
    const i = L.indexOf(cur);
    if (i === -1) return L[0];                 // فترة غير معروفة: نبدأ من أول السلّم
    return L[Math.min(i + 1, L.length - 1)];
  },

  /* تسجيل مراجعة سؤال. ok=true أصاب، false أخطأ. */
  review(sid, qid, ok, now){
    const t = Progress.today(now);
    return Progress._update(sid, s => {
      s.srs = s.srs || {};
      const prev = s.srs[qid] || { i: 0, e: 0 };
      const iv = Progress.nextInterval(prev.i, ok);
      s.srs[qid] = {
        i: iv,                                  // الفترة الحالية بالأيام
        d: t + iv,                              // موعد المراجعة القادمة
        e: (prev.e || 0) + (ok ? 0 : 1),        // كم مرة تعثّر فيه
        t: t                                    // آخر مراجعة — عليه يقوم الدمج
      };
    });
  },

  /* المستحقّ اليوم في مادة: معرّفات الأسئلة التي حان موعدها */
  dueIn(sid, now){
    const t = Progress.today(now);
    const srs = (Progress.forSubject(sid).srs) || {};
    return Object.keys(srs).filter(qid => (srs[qid].d || 0) <= t);
  },

  /* المستحقّ في كل المواد — ترتيبها بالأكثر تعثّرًا أولًا:
     ما تعثّرت فيه مرارًا هو ما يُسقطك في الاختبار. */
  dueAll(now){
    const t = Progress.today(now);
    const p = Progress.all();
    const out = [];
    Object.keys(p).forEach(sid => {
      const srs = (p[sid] && p[sid].srs) || {};
      Object.keys(srs).forEach(qid => {
        if ((srs[qid].d || 0) <= t) out.push({ sid, qid, e: srs[qid].e || 0, d: srs[qid].d || 0 });
      });
    });
    out.sort((a, b) => (b.e - a.e) || (a.d - b.d));
    return out;
  },

  /* أقرب موعدٍ قادم — لمن أنهى مراجعة اليوم: «عد بعد يومين» خيرٌ من فراغ */
  nextDue(now){
    const t = Progress.today(now);
    const p = Progress.all();
    let best = null;
    Object.keys(p).forEach(sid => {
      const srs = (p[sid] && p[sid].srs) || {};
      Object.keys(srs).forEach(qid => {
        const d = srs[qid].d || 0;
        if (d > t && (best === null || d < best)) best = d;
      });
    });
    return best === null ? null : best - t;      // بعد كم يوم
  },

  markSeen(sid, qid){ return Progress._update(sid, s => { s.seen[qid] = 1; }); },
  markWrong(sid, qid){ return Progress._update(sid, s => { s.wrong[qid] = (s.wrong[qid]||0) + 1; s.seen[qid] = 1; }); },
  clearWrong(sid, qid){ return Progress._update(sid, s => { delete s.wrong[qid]; }); },
  toggleStar(sid, qid){
    let on = false;
    Progress._update(sid, s => { if (s.star[qid]) delete s.star[qid]; else { s.star[qid] = 1; on = true; } });
    return on;
  },
  recordExam(sid, pct){ return Progress._update(sid, s => { s.exams += 1; if (pct > s.best) s.best = pct; }); },

  pctDone(sid, totalQ){
    if (!totalQ) return 0;
    const seen = Object.keys(Progress.forSubject(sid).seen).length;
    return Math.min(100, Math.round(seen / totalQ * 100));
  },

  /* --- الدمج بلا حذف: اتحاد المُشاهد والنجوم، الأعلى يفوز في النتائج، والمجموع في العدّادات.
         القاعدة: لا يخسر أحد تقدّمه أبدًا — لا عند جهاز جديد ولا عند تعارض. --- */
  merge(local, remote){
    const out = {};
    const sids = new Set(Object.keys(local || {}).concat(Object.keys(remote || {})));
    sids.forEach(sid => {
      const a = (local  || {})[sid] || { seen:{}, wrong:{}, star:{}, srs:{}, exams:0, best:0 };
      const b = (remote || {})[sid] || { seen:{}, wrong:{}, star:{}, srs:{}, exams:0, best:0 };
      out[sid] = {
        seen:  Object.assign({}, b.seen,  a.seen),
        star:  Object.assign({}, b.star,  a.star),
        wrong: (function(){
          // عدّاد الأخطاء: الأعلى يفوز — تكرار الخطأ معلومة تهم ترتيب المراجعة
          const w = Object.assign({}, b.wrong);
          Object.keys(a.wrong || {}).forEach(k => { w[k] = Math.max(w[k] || 0, a.wrong[k]); });
          return w;
        })(),
        exams: (a.exams || 0) + (b.exams || 0),
        best:  Math.max(a.best || 0, b.best || 0),
        /*
          ★ جدول المراجعة: الأحدث مراجعةً يفوز — لا الأطول فترةً.
          لو أخذنا الأطول لضاع تعثّرٌ حدث على الجهاز الآخر: الخطأ يُنزل
          الفترة إلى يوم، فيبدو «أقلّ تقدّمًا» وهو الحقيقة الأحدث.
        */
        srs: (function(){
          const m = Object.assign({}, b.srs || {});
          Object.keys(a.srs || {}).forEach(qid => {
            const x = a.srs[qid], y = m[qid];
            if (!y || (x.t || 0) >= (y.t || 0)) m[qid] = x;
          });
          return m;
        })()
      };
    });
    return out;
  },

  schedulePush(){
    if (Progress._timer) clearTimeout(Progress._timer);
    Progress._timer = setTimeout(() => { Progress._timer = null; Progress.push(); }, Progress.PUSH_DELAY);
  },
  async push(){
    if (Progress._pushFn) return Progress._pushFn(Progress.all());
    if (!QBANK.api.user()) return { ok:false };   // زائر: يبقى تقدّمه في جهازه حتى يسجّل
    return QBANK.api.rest('progress?on_conflict=user_id', {
      method:'POST',
      headers: Object.assign(QBANK.api.headers(), { 'Prefer':'resolution=merge-duplicates' }),
      body: JSON.stringify({ user_id: QBANK.api.user().id, data: Progress.all(), updated_at: new Date().toISOString() })
    });
  },
  // عند أول دخول على جهاز: نجلب تقدّم الحساب وندمجه مع تقدّم الجهاز ثم ندفع الناتج
  async pull(){
    const u = QBANK.api.user();
    if (!u) return { ok:false };
    const r = await QBANK.api.rest('progress?user_id=eq.' + u.id + '&select=data');
    if (r.ok && r.data && r.data[0]) {
      const merged = Progress.merge(Progress.all(), r.data[0].data || {});
      QBANK.store.set(Progress.KEY, merged);
      await Progress.push();
      return { ok:true, merged:true };
    }
    if (r.ok) { await Progress.push(); return { ok:true, merged:false }; }
    return r;
  }
};
QBANK.progress = Progress;


/* ===== 20-gate.js ===== */
/*
  بوابة المحتوى — تفصل المجاني عن المدفوع (المرحلة ٥).
  القرار النهائي في قاعدة البيانات (can_access + RLS)؛ نسخة العميل هنا
  للعرض فقط: تخفي أزرار ما لا يملكه الطالب وتعرض بطاقة الشراء بدلها.
  النموذج: مادة مفردة أو حزمة فصل تنتهي بنهاية الفصل — لا اشتراك شهري.
*/
const Gate = {
  KEY: 'entitlements',
  list(){ return QBANK.store.get(Gate.KEY, []); },
  save(rows){ QBANK.store.set(Gate.KEY, rows || []); },

  async refresh(){
    const u = QBANK.api.user();
    if (!u) return { ok:false };
    const r = await QBANK.api.rest('entitlements?select=subject_id,kind,expires_at&expires_at=gt.' + new Date().toISOString());
    if (r.ok && Array.isArray(r.data)) { Gate.save(r.data); return { ok:true }; }
    return r;
  },

  // متاحة؟ مجانية للجميع، أو استحقاق ساري المفعول (مادة مفردة أو حزمة فصل)
  canAccess(sub, now){
    if (!sub) return false;
    if (sub.free) return true;
    if (QBANK.store.get('is_admin_check', {}).ok) return true;
    const t = now || Date.now();
    return Gate.list().some(e =>
      new Date(e.expires_at).getTime() > t &&
      (e.kind === 'semester' || e.subject_id === sub.id));
  },

  /*
    رابط الإحالة: يصل في ?ref=  فنحفظه، لأن الطالب قد يسجّل دخوله أولًا
    ويعود بعد جولة في المنصة — ولو ضاع المُحيل ضاعت مكافأة من أوصله.
  */
  REF_KEY: 'ref_by',
  captureRef(query){
    const ref = (query && query.ref) || '';
    if (ref) QBANK.store.set(Gate.REF_KEY, ref);
    return ref || QBANK.store.get(Gate.REF_KEY, '');
  },
  ref(){ return QBANK.store.get(Gate.REF_KEY, ''); },

  /*
    ★ إعادة رسم الشاشة بعد فتحٍ ناجح — لا يعرفها المنادي فنُوفّرها هنا.
    الطالب يُفعّل رمزه فتصير المادة له، وتبقى بطاقة القفل أمامه لأن الشاشة
    رُسمت قبل الفتح. فيظنّ التفعيل فشل ويُدخل رمزًا آخر ويُنفق اثنين مكان
    واحد. الرسم الجديد هو ما يجعل النجاح مرئيًا.
  */
  reopen(){ try { QBANK.router.render(location.hash); } catch(e){} },

  // زر الشراء وحده — تُعيد استعماله بطاقة القفل وبطاقة انتهاء التجربة
  buyButton(sub){
    const isApp = !!(typeof window !== 'undefined' && window.QBANK_NATIVE_APP);
    const price = sub.price ? ' — ' + sub.price + ' ريال' : '';
    return isApp
      ? el('button', { class:'btn btn--block', type:'button', 'data-buy': sub.id,
          'data-ref': Gate.ref() || null, text:'اشترِ من داخل التطبيق' + price })
      /* ★ صار دفعًا حقيقيًا لا رابطًا خارجيًا.
         كان يفتح alsoqoor.com — أي أن الطالب يغادر المنصة عند أهم لحظة
         فيها، وهي اللحظة التي يقرّر فيها أن يدفع. والآن يشتري في مكانه. */
      /*
        ★ مادة مقفلة بلا سعر حالةٌ حقيقية — لا حالة فحص.
        كان الرابط الخارجي يخفيها: يظهر زر شراء لمادة لا ثمن لها، فيضغطه
        الطالب فلا يجد شيئًا يشتريه. الآن تُقال بصراحة، لأنها خطأ محتوى
        على المشرف إصلاحه لا لغزٌ على الطالب حلّه.
      */
      : (QBANK.pay && QBANK.pay.buySubjectButton(sub)) ||
        el('p', { class:'field__hint', 'data-noprice':'1',
          text:'لم يُحدَّد سعر هذه المادة بعد — تواصل مع مشرف المنصة.' });
  },

  /*
    بطاقة الشراء — تحترم قاعدة المتاجر: داخل التطبيق لا إحالة للموقع.

    ★ ولا تنتهي عند زرٍّ واحد.
    كان فيها زرّ «اشترِ» وحده، وهو يقود إلى بوابة Tap التي لم تُفعَّل بعد —
    فينتهي الطالب إلى «الدفع غير مفعَّل بعد على هذا الخادم» ولا يبقى أمامه
    شيء يفعله. والبطاقة التي تعرض ثمنًا ولا تعرض طريقًا لدفعه بابٌ مرسوم
    على جدار. فصار فيها ثلاثة طرق: البوابة إن عملت، ورمز تفعيل يُدخله من
    اشترى بأي وسيلة أخرى، وطلبٌ مباشر لمن لا يملك رمزًا.
  */
  paywallCard(sub, onOpen){
    const kids = [
      el('span', { class:'empty__ico', 'aria-hidden':'true', text:'🔒' }),
      el('p', { class:'empty__title', text:'«' + sub.name + '» مادة مدفوعة' }),
      el('p', { class:'empty__text', text:'اشترِ المادة وحدها أو حزمة الفصل كاملة — صالحة حتى نهاية الفصل، بلا اشتراك شهري.' }),
      Gate.buyButton(sub)
    ];

    const C = QBANK.codes;
    if (C){
      kids.push(QBANK.views.redeemBox(onOpen || Gate.reopen));
      const s = C.support();
      /* الطلب المباشر: في المتصفح فقط، وبشرط أن يكون المشرف كتب رقمه —
         زرٌّ يفتح واتساب بلا رقم يفتح لا شيء. */
      if (!C.isApp() && s.wa)
        kids.push(el('a', { class:'btn btn--ghost btn--block', target:'_blank',
          rel:'noopener', href: C.askUrl(sub), text:'اطلب رمزًا من المشرف' }));
      if (s.note) kids.push(el('p', { class:'field__hint', text: s.note }));
    }

    kids.push(el('p', { class:'field__hint', text:'لديك حساب اشترى من قبل؟ سجّل دخولك وسيُفتح المحتوى تلقائيًا.' }));
    return el('div', { class:'card', style:'text-align:center' }, kids);
  },

  /*
    القرار المعتمد يأتي من القاعدة (subject_access)، وهذه نسخة محلية للعرض الفوري
    قبل وصول الرد — كي لا تومض الشاشة. لا تُمنح بها صلاحية: القاعدة ترفض من لا حق له
    حتى لو كذبت هذه الدالة، والفحوص تثبت ذلك.
  */
  localGuess(sub, now){
    if (!sub) return { allowed:false, reason:'missing' };
    if (sub.free) return { allowed:true, reason:'free' };
    if (QBANK.store.get('is_admin_check', {}).ok) return { allowed:true, reason:'admin' };
    const u = QBANK.api.user();
    if (!u) return { allowed:false, reason:'anon' };
    const t = now || Date.now();
    if (Gate.list().some(e => new Date(e.expires_at).getTime() > t &&
        (e.kind === 'semester' || e.subject_id === sub.id)))
      return { allowed:true, reason:'entitled' };
    /*
      ★ مادته هو — يفتحها بلا سؤال.
      من كتب البنك بيده لا يليق أن يُطلب منه ثمنُ فتحه. والقاعدة تكتب له
      استحقاقًا لحظة النشر، لكنه قد لا يكون وصل إلى هذا الجهاز بعد، فنُقرّر
      محليًا ولا ننتظر: صاحب المادة أولى الناس بها.
      و`pending` باقية لأن القاعدة هي من يعرف متى تنتهي مدّته.
    */
    if (sub.created_by && sub.created_by === u.id)
      return { allowed:true, reason:'owner', pending:true };
    return { allowed:false, reason:'paywall' };
  }
};
QBANK.gate = Gate;


/* ===== 20-router.js ===== */
/*
  الموجّه: يعتمد على hash لا على History API.
  لماذا؟ لأن المنصة يجب أن تعمل بفتح index.html مباشرة من القرص (file://)
  وهناك pushState لا يعمل، بينما #/ يعمل في كل مكان.
*/
const Router = {
  routes: {},
  notFound: null,
  current: null,

  add(path, def){ Router.routes[path] = def; return Router; },

  parse(hash){
    // نُحوّل "#/admin/students?x=1" إلى { path:'#/admin', rest:['students'], query:{x:'1'} }
    const raw = (hash || '#/').replace(/^#?/, '#');
    const [beforeQ, qs] = raw.split('?');
    const parts = beforeQ.replace(/^#\/?/, '').split('/').filter(Boolean);
    const query = {};
    (qs || '').split('&').filter(Boolean).forEach(pair => {
      const [k, v] = pair.split('=');
      query[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });

    if (!parts.length) return { path:'#/', rest:[], query, raw:beforeQ };

    // نطابق أطول مسار مُعرَّف أولًا حتى لا يبتلع "#/admin" مسار "#/admin/login"
    let path = '#/' + parts.join('/');
    let rest = [];
    while (parts.length && !Router.routes[path]) {
      rest.unshift(parts.pop());
      path = '#/' + parts.join('/');
    }
    // لم يُطابَق شيء: نُرجع المسار كما هو ليصل إلى صفحة ٤٠٤،
    // ولا نُسقطه على الجذر — وإلا صار كل رابط خاطئ يفتح الرئيسية بصمت.
    if (!parts.length) return { path: beforeQ, rest:[], query, raw: beforeQ };
    return { path, rest, query, raw: beforeQ };
  },

  resolve(hash){
    const m = Router.parse(hash);
    const def = Router.routes[m.path];
    return def ? Object.assign({}, m, { def }) : Object.assign({}, m, { def: Router.notFound });
  },

  render(hash){
    const main = document.getElementById('main');
    if (!main) return null;
    const r = Router.resolve(hash);
    Router.current = r;

    main.innerHTML = '';
    const view = r.def && typeof r.def.view === 'function' ? r.def.view(r) : null;
    if (view) main.appendChild(view);

    document.title = (r.def && r.def.title ? r.def.title + ' · ' : '') + 'مراجعة';
    /* ★ منطقة المشرف عالمها مستقل: صنف على الجسد يخفي غلاف الطالب
       (الشريط السفلي وروابطه) عبر CSS — فلا زرّ يعيد المشرف لواجهة الطالب سهوًا */
    try {
      document.body.classList.toggle('is-admin', r.path.indexOf('#/admin') === 0);
    } catch(e){}
    Router.paintNav(r.path);
    /* ★ الترويسة تتبع الجلسة لا تجمد عليها.
       كان زرّ «دخول» مكتوبًا في هيكل الصفحة ولا يمسّه أحد، فيبقى معروضًا
       على من دخل فعلًا — يظنّ أن دخوله لم يُقبل فيعيده مرة بعد مرة. */
    if (QBANK.authChip) QBANK.authChip();
    /* ★ النبضة تتبع الشاشة: «متصل» وحدها نصفُ خبر، و«في اختبار السموم»
       خبرٌ كامل. والإرسال يُهمَل إن لم يتبدّل الحال — لا نداء بلا جديد. */
    if (QBANK.presence) QBANK.presence.beat();
    // نُعيد التركيز إلى المحتوى كي يعرف قارئ الشاشة أن الصفحة تبدّلت
    if (Router.booted) { try { main.focus(); } catch(e){} }
    Router.booted = true;
    return r;
  },

  paintNav(path){
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), a => {
      const isOn = a.getAttribute('data-nav') === path;
      if (isOn) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
  },

  go(hash){
    if (location.hash === hash) Router.render(hash);   // نفس الوجهة: نُعيد الرسم يدويًا
    else location.hash = hash;
  },

  init(){
    window.addEventListener('hashchange', () => Router.render(location.hash));
    Router.render(location.hash || '#/');
  }
};
QBANK.router = Router;


/* ===== 24-exam.js ===== */
/*
  محرك الاختبار التجريبي — منطق نقي بلا DOM كي يُفحص بمعزل عن الواجهة.
  المبدآن الثابتان:
  ١) خلط فيشر-ييتس للأسئلة ولمواضع الخيارات — عادل رياضيًا.
  ٢) تتبّع الإجابة الصحيحة بالموضع الرقمي لا بالحرف — الحروف تنكسر عند الخلط.
*/
const Exam = {
  // rng قابل للحقن: الفحوص تمرّر مولّدًا حتميًا فتصير النتائج قابلة للتكرار
  shuffle(arr, rng){
    const r = rng || Math.random;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  },

  /* اختيار الأسئلة: النطاق ثم أولوية ما أُخطئ فيه سابقًا */
  select(questions, opts){
    opts = opts || {};
    let pool = questions.slice();
    if (opts.scope === 'topic' && opts.topic) pool = pool.filter(q => q.topic === opts.topic);
    if (opts.scope === 'important') pool = pool.filter(q => q.important);
    if (opts.scope === 'wrong') pool = pool.filter(q => (opts.wrongMap || {})[q.id]);

    const wrongMap = opts.wrongMap || {};
    // الأسئلة الخاطئة سابقًا تتقدّم: نخلط كل فئة على حدة ثم نقدّم الخاطئة
    const wrong = Exam.shuffle(pool.filter(q => wrongMap[q.id]), opts.rng);
    const rest  = Exam.shuffle(pool.filter(q => !wrongMap[q.id]), opts.rng);
    let picked = wrong.concat(rest);
    if (opts.count && opts.count < picked.length) picked = picked.slice(0, opts.count);
    return picked;
  },

  create(questions, opts){
    opts = opts || {};
    const picked = Exam.select(questions, opts);
    const items = picked.map(q => {
      // خلط مواضع الخيارات مع تتبّع موضع الصحيح رقميًا
      const order = Exam.shuffle(q.options.map((_, i) => i), opts.rng);
      return {
        id: q.id, q: q.q, topic: q.topic || '',
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.answer),   // الموضع الجديد للإجابة الصحيحة
        translation: q.translation || '', expl_ar: q.expl_ar || ''
      };
    });
    return {
      items,
      i: 0,
      answers: new Array(items.length).fill(null),
      mode: opts.mode || 'instant',        // فوري (افتراضي) أو بعد الانتهاء
      timerMin: opts.timerMin || 0,
      startedAt: opts.now || Date.now(),
      finished: false
    };
  },

  answer(exam, choice){
    if (exam.finished || exam.answers[exam.i] !== null) return null;
    const item = exam.items[exam.i];
    const correct = choice === item.correct;
    exam.answers[exam.i] = { choice, correct };
    return { correct, correctIndex: item.correct };
  },

  next(exam){ if (exam.i < exam.items.length - 1) exam.i++; return exam.i; },
  prev(exam){ if (exam.i > 0) exam.i--; return exam.i; },

  grade(pct){
    if (pct >= 90) return 'ممتاز';
    if (pct >= 80) return 'جيد جدًا';
    if (pct >= 70) return 'جيد';
    if (pct >= 60) return 'مقبول';
    return 'يحتاج مراجعة';
  },

  finish(exam, now){
    exam.finished = true;
    const total = exam.items.length;
    const correct = exam.answers.filter(a => a && a.correct).length;
    const pct = total ? Math.round(correct / total * 1000) / 10 : 0;

    // تحليل حسب المحاور: أين القوة وأين الخلل
    const byTopic = {};
    exam.items.forEach((item, idx) => {
      const t = item.topic || 'عام';
      byTopic[t] = byTopic[t] || { total:0, correct:0 };
      byTopic[t].total++;
      if (exam.answers[idx] && exam.answers[idx].correct) byTopic[t].correct++;
    });

    return {
      total, correct, pct,
      grade: Exam.grade(pct),
      duration_s: Math.round(((now || Date.now()) - exam.startedAt) / 1000),
      byTopic,
      wrongIds: exam.items.filter((it, idx) => !exam.answers[idx] || !exam.answers[idx].correct).map(it => it.id),
      review: exam.items.map((it, idx) => ({
        q: it.q, options: it.options, correct: it.correct,
        chosen: exam.answers[idx] ? exam.answers[idx].choice : null,
        ok: !!(exam.answers[idx] && exam.answers[idx].correct),
        expl_ar: it.expl_ar
      }))
    };
  }
};
QBANK.exam = Exam;

/* ١ · الرئيسية — بطاقات المواد: «موادي» ثم «مواد أخرى متاحة» */
/*
  أحرف الخيارات بالعربية: أ ب ج د — لا A B C D.
  هذه لغة ورقة الامتحان التي جلس عليها الطالب طوال دراسته، ويقول بها
  «الجواب ج» لزميله. والحرف عرضٌ فقط: موضع الإجابة يبقى رقمًا في القاعدة
  فلا ينكسر شيء عند خلط الخيارات.
*/
const OPT_LETTERS = ['أ','ب','ج','د','هـ','و','ز','ح','ط','ي'];
function optLetter(i){ return OPT_LETTERS[i] || String(i + 1); }

/* الأرقام العربية الهندية — كما تُطبع في الكتاب المدرسي العربي */
function arNum(n){
  return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
}

function subjectColor(c){
  // اللون اسم متغيّر من نظام التصميم — لا hex حر من قاعدة البيانات
  return /^subject-[1-6]$/.test(c || '') ? 'var(--' + c + ')' : 'var(--subject-1)';
}
function daysLeft(dateStr, now){
  if (!dateStr) return null;
  const d = new Date(dateStr).getTime() - (now || Date.now());
  return Math.ceil(d / 86400000);
}
function mySubjects(){ return QBANK.store.get('my_subjects', []); }

function subjectCard(sub){
  const mine = mySubjects().indexOf(sub.id) !== -1;
  const left = daysLeft(sub.exam_date);
  const past = left !== null && left < 0;
  const pct = QBANK.progress.pctDone(sub.id, sub.q_count);
  const color = subjectColor(sub.color);

  // العدد المطلق قبل النسبة: «٤٧ من ١٢٠» يقول للطالب ما بقي عليه فعلًا،
  // والنسبة وحدها تخفي أن ٩٠٪ من مادة صغيرة أقل عملًا من ٣٠٪ من مادة كبيرة.
  const done = Math.round((sub.q_count || 0) * pct / 100);
  const topics = (sub.topics && sub.topics.length) || 0;

  /*
    بطاقة AMSU: منطقة فنية بتدرّج لون المادة وأيقونتها، شارة «N سؤالًا»،
    الاسم وتحته الإنجليزي، سطر موعد الاختبار بعدّه، شريط تقدّم، و«ابدأ المراجعة».
    اللون يُحقن مرة واحدة في --acc فيتلوّن كل ما بالداخل من نظام التصميم.
  */
  const card = el('article', {
    class:'sub-card' + (past ? ' exam-done' : ''), tabindex:'0', role:'link',
    style:'--acc:' + color, 'aria-label':'مادة ' + sub.name }, [
    past ? el('span', { class:'stamp', 'aria-hidden':'true', text:'تم الانتهاء' }) : null,
    el('div', { class:'art', 'aria-hidden':'true' }, [
      el('span', { class:'art__ico', text: sub.icon || '▤' }),
      el('span', { class:'badge num', text: QBANK.views.arNum(sub.q_count || 0) + ' سؤالًا' })
    ]),
    el('div', { class:'meta' }, [
      el('h3', { text: sub.name }),
      sub.name_en ? el('span', { class:'qn ltr', text: sub.name_en })
        : (sub.course_code ? el('span', { class:'qn ltr', text: sub.course_code }) : null),
      left !== null ? el('div', { class:'examline num' }, [
        el('span', { class:'when', text: past ? 'انتهى موعده' : 'موعد الاختبار' }),
        past ? null : el('b', { class: left <= 2 ? 'urgent' : '',
          text:'متبقٍ ' + QBANK.views.arNum(left) + (left === 1 ? ' يوم' : ' أيام') })
      ]) : null,
      el('div', { class:'prog', 'aria-label':'أنجزت ' + pct + '٪' }, [
        el('i', { style:'width:' + pct + '%' })
      ]),
      el('div', { class:'foot num' }, [
        el('span', { text:'راجعت ' + QBANK.views.arNum(done) + ' من ' +
          QBANK.views.arNum(sub.q_count || 0) + ' · ' + QBANK.views.arNum(pct) + '٪' }),
        sub.free ? el('span', { class:'badge badge--ok', text:'مجانية' }) : null,
        el('span', { class:'cta', text:'ابدأ المراجعة ‹' })
      ])
    ])
  ]);
  card.addEventListener('click', () => QBANK.router.go('#/subject/' + sub.id));
  card.addEventListener('keydown', e => { if (e.key === 'Enter') QBANK.router.go('#/subject/' + sub.id); });
  return card;
}

const ViewHome = {
  title:'الرئيسية',
  view(){
    // الزائر يرى صفحة تعريفية تشرح وتُقنع؛ والطالب المسجَّل يرى مواده فورًا.
    // السبب: لكلٍّ حاجة مختلفة — إقناع أولًا، ومذاكرة سريعة ثانيًا.
    if (!QBANK.api.user()) return QBANK.views.landingView();

    const pack = QBANK.data.pack();
    const subjects = (pack.subjects || []).slice();
    const body = [];

    /*
      شريط جامعتي أعلى كل شيء — أو دعوة لاختيارها.

      الطالب الذي حدّد جامعته يفتح المنصة فيرى بابها لا قائمة عامة، ومن لم
      يحدّدها يرى سببًا واضحًا ليفعل. وضعناه فوق دعوة الرفع لأن الانتماء
      يسبق المساهمة: من لا يعرف أين يرفع لا يرفع.
    */
    body.push(campusBand());

    /*
      ★ «راجع اليوم» أعلى الرئيسية.
      كل ما تحتها يفترض أن الطالب يعرف من أين يبدأ، وهو لا يعرف — فيؤجّل.
      رقمٌ واحد وزرٌّ واحد يُنهيان التردّد، ويُعطيان المنصة سببًا للفتح كل
      صباح لا عند الاختبار وحده. ومن لم يبدأ بعد لا يرى شيئًا: بطاقةٌ
      فارغة تعليمٌ ناقص، وغيابُها أصدق.
    */
    if (QBANK.views.reviewCard) {
      const rc = QBANK.views.reviewCard();
      if (rc) body.push(rc);
    }

    /*
      ★ تذكير الجوال — إلزامٌ يُذكَّر به لا يُحاصَر.
      الحقل مطلوب في الملف، لكن من سجّل قبل اليوم لن يفتح ملفه من تلقائه.
      شريط واحد يظهر لمن جواله فارغ ويختفي أبدًا بعد الحفظ — ولا يحجب
      المذاكرة: الطالب جاء ليراجع، ونحن نطلب لا نبتزّ.
    */
    const phoneNudge = el('div');
    body.push(phoneNudge);
    QBANK.api.myProfile().then(r => {
      if (!phoneNudge.isConnected) return;
      const p = (r.ok && r.data) ? r.data : null;
      if (!p || String(p.phone || '').replace(/\D/g,'').length >= 9) return;
      phoneNudge.appendChild(el('a', { class:'campus-band campus-band--ask', href:'#/login' }, [
        el('span', { class:'campus-band__ico', 'aria-hidden':'true', text:'☎' }),
        el('span', { class:'campus-band__x' }, [
          el('span', { class:'campus-band__t', text:'أكمل ملفك: رقم جوالك' }),
          el('span', { class:'campus-band__d', text:'حقل مطلوب في ملفك — دقيقة واحدة ويختفي هذا التنبيه.' })
        ]),
        el('span', { class:'campus-band__go', 'aria-hidden':'true', text:'←' })
      ]));
    });

    // دعوة الرفع: الطالب لا يبحث عن ميزة لا يعرف بوجودها
    body.push(el('a', { class:'upsell', href:'#/upload' }, [
      el('span', { class:'upsell__ico', 'aria-hidden':'true', text:'⇪' }),
      el('span', { class:'upsell__x' }, [
        el('span', { class:'upsell__t', text:'عندك بنك أسئلة لمادة ناقصة؟' }),
        el('span', { class:'upsell__d', text:'ارفعه، وجرّبه عشر دقائق مجانًا، وشاركه مع زملائك بكوينز لك على كل بيعة.' })
      ]),
      el('span', { class:'upsell__go', 'aria-hidden':'true', text:'←' })
    ]));

    if (pack.settings && pack.settings.welcome_text)
      body.push(el('div', { class:'card' }, [ el('p', { style:'margin:0', text: pack.settings.welcome_text }) ]));

    if (!subjects.length) {
      body.push(empty('▤', 'لا مواد بعد',
        QBANK.config.ready()
          ? 'لم تُنشر مواد حتى الآن — عد قريبًا، أو تأكد من الاتصال لمزامنة الجديد.'
          : 'المنصة تبدأ فارغة عن قصد. يضيف المشرف المواد من لوحة التحكم وستظهر هنا فور نشرها.',
        el('div', { class:'row', style:'justify-content:center;margin-top:16px' }, [
          el('a', { class:'btn', href:'#/admin', text:'افتح لوحة التحكم' })
        ])));
      body.push(el('div', { class:'grid', id:'subjectsGrid' }));
      return page('موادي', 'اختر مادة لتبدأ المراجعة.', body);
    }

    // المنتهية تنزل آخر القائمة تلقائيًا
    const order = arr => arr.slice().sort((x, y) => {
      const px = (daysLeft(x.exam_date) ?? 1) < 0 ? 1 : 0;
      const py = (daysLeft(y.exam_date) ?? 1) < 0 ? 1 : 0;
      return px - py || (x.ord || 0) - (y.ord || 0);
    });
    const mineIds = mySubjects();
    const mine = order(subjects.filter(su => mineIds.indexOf(su.id) !== -1));
    const other = order(subjects.filter(su => mineIds.indexOf(su.id) === -1));

    if (mine.length) {
      body.push(el('h2', { text:'موادي' }));
      body.push(el('div', { class:'grid', id:'subjectsGrid' }, mine.map(subjectCard)));
    }
    if (other.length) {
      body.push(el('h2', { text: mine.length ? 'مواد أخرى متاحة' : 'المواد المتاحة' }));
      body.push(el('div', { class:'grid', id: mine.length ? null : 'subjectsGrid' }, other.map(su => {
        const c = subjectCard(su);
        const add = el('button', { class:'btn btn--sm btn--soft', type:'button',
          'aria-label':'أضف ' + su.name + ' إلى موادي', text:'+ أضف إلى موادي' });
        add.addEventListener('click', e => {
          e.stopPropagation();
          const list = mySubjects();
          if (list.indexOf(su.id) === -1) { list.push(su.id); QBANK.store.set('my_subjects', list); }
          QBANK.api.rest('enrollments', { method:'POST', body: JSON.stringify({
            user_id: (QBANK.api.user() || {}).id, subject_id: su.id }) });
          QBANK.toast('أُضيفت «' + su.name + '» إلى موادك');
          QBANK.router.render('#/');
        });
        c.appendChild(el('div', { class:'row', style:'margin-top:8px' }, [add]));
        return c;
      })));
    }
    return page('موادي', 'اختر مادة لتبدأ المراجعة.', body);
  }
};

/* ٢ · دخول الطالب — رابط سحري + جوجل + آبل */
function loginCard(opts){
  // بطاقة دخول واحدة للطالب والمشرف — الفرق في العنوان والوجهة بعد النجاح فقط
  const email = el('input', { class:'input', type:'email', id:opts.emailId,
    placeholder:'name@example.com', dir:'ltr', autocomplete:'email' });
  const btn = el('button', { class:'btn btn--block', type:'button', text:'أرسل رابط الدخول' });
  const msg = el('p', { class:'field__hint', role:'status' });

  async function send(){
    const val = (email.value || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val)) { msg.textContent = 'اكتب بريدًا صحيحًا أولًا.'; email.focus(); return; }
    if (!QBANK.config.ready()) { msg.textContent = 'المنصة غير موصولة بالخادم بعد — يضبطها المشرف من الإعدادات.'; return; }
    btn.setAttribute('aria-disabled','true'); btn.textContent = 'جارٍ الإرسال…';
    const r = await QBANK.api.auth.magic(val);
    btn.removeAttribute('aria-disabled'); btn.textContent = 'أرسل رابط الدخول';
    if (r.ok) {
      msg.textContent = 'تم! افتح بريدك: اضغط رابط الدخول، أو اكتب الرمز هنا.';
      QBANK.toast('أُرسل بريد الدخول');
      rememberAfter();                  // رابط البريد يعود للأصل — الوجهة تنتظره هنا
      otpBox.hidden = false;            // ★ داخل التطبيق المغلّف الرمز هو الطريق
      otp.focus();
    }
    else if (r.offline) msg.textContent = 'لا اتصال بالإنترنت — الدخول يحتاج اتصالًا مرة واحدة فقط.';
    /* ★ ٤٢٩ يُسمّى باسمه: «تعذّر الإرسال» العامة أوهمت أن المنصة معطوبة،
       والحقيقة أن حصة البريد نفدت مؤقتًا — والفرق يغيّر تصرف الطالب كليًا */
    else if (r.status === 429) msg.textContent =
      'طلبت الدخول مرات كثيرة خلال ساعة — انتظر قليلًا ثم حاول، أو ادخل بحساب جوجل الآن.';
    else msg.textContent = 'تعذّر الإرسال. تحقق من البريد وحاول ثانية.';
  }
  btn.addEventListener('click', send);
  email.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  /*
    ★ الدخول بالرمز — للتطبيق المثبّت خاصة.
    رابط البريد يفتح في متصفح الجوال لا داخل التطبيق فيبقى التطبيق زائرًا،
    أما الرمز فيُكتب هنا فتولد الجلسة هنا. الحقل يظهر بعد الإرسال فقط —
    لا معنى لرمز قبل أن يوجد بريد يحمله.
  */
  const otp = el('input', { class:'input', type:'text', inputmode:'numeric',
    autocomplete:'one-time-code', maxlength:'6', placeholder:'••••••',
    'aria-label':'رمز الدخول من البريد', dir:'ltr',
    style:'text-align:center; letter-spacing:.45em; font-weight:800; font-size:1.15rem' });
  const otpBtn = el('button', { class:'btn btn--block', type:'button', text:'ادخل بالرمز' });
  const otpBox = el('div', { class:'stack', hidden:true }, [
    el('span', { class:'field__hint', text:'وصلك في نفس الرسالة رمز من ٦ أرقام — اكتبه هنا وادخل مباشرة:' }),
    otp, otpBtn
  ]);
  async function verify(){
    const code = (otp.value || '').replace(/\D/g, '');
    if (code.length < 6) { msg.textContent = 'الرمز ٦ أرقام — انسخه من رسالة البريد.'; otp.focus(); return; }
    otpBtn.setAttribute('aria-disabled','true'); otpBtn.textContent = 'جارٍ التحقق…';
    const r = await QBANK.api.auth.verifyOtp((email.value || '').trim(), code);
    otpBtn.removeAttribute('aria-disabled'); otpBtn.textContent = 'ادخل بالرمز';
    if (r.ok && QBANK.api.user()){
      QBANK.toast('تم الدخول');
      QBANK.data.refreshPack().finally(() => QBANK.router.go(opts.after || '#/'));
    } else {
      msg.textContent = 'الرمز غير صحيح أو انتهت مدته — أرسل بريدًا جديدًا وحاول خلال دقائق.';
    }
  }
  otpBtn.addEventListener('click', verify);
  otp.addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });

  /*
    ★ جوجل مفعّل (OAuth «In production» منذ ٢٠٢٦/٩) — زرّه ظاهر.
    آبل مطفأ لا محذوف: يشترط حساب Apple Developer المدفوع، والزر الظاهر
    المعطوب أسوأ من الغائب. يوم يُفعَّل يُعاد aBtn إلى القائمة أدناه.
  */
  /* ★ الوجهة تُحفظ قبل مغادرة الصفحة: جوجل والرابط البريدي يعودان إلى
     أصل الموقع (الهاش يحمله رمز الجلسة)، فمن أين نعرف أن القاصد كان
     اللوحة؟ من هذا المفتاح — يقرؤه الإقلاع بعد التقاط الجلسة ثم يمحوه. */
  const rememberAfter = () => { if (opts.after) QBANK.store.set('after_login', opts.after); };
  const gBtn = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'الدخول بحساب جوجل' });
  const aBtn = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'الدخول بحساب آبل' });
  gBtn.addEventListener('click', () => { const u = QBANK.api.auth.oauthUrl('google'); if (u) { rememberAfter(); location.href = u; } else QBANK.toast('المنصة غير موصولة بالخادم بعد'); });
  aBtn.addEventListener('click', () => { const u = QBANK.api.auth.oauthUrl('apple');  if (u) { rememberAfter(); location.href = u; } else QBANK.toast('المنصة غير موصولة بالخادم بعد'); });
  void aBtn;   // يبقى جاهزًا ليوم حساب المطوّر

  return el('div', { class:'card stack' }, [
    el('label', { class:'field', style:'margin:0' }, [
      el('span', { class:'field__label', text: opts.label }),
      email,
      el('span', { class:'field__hint', text:'يصلك رابط دخول ورمز — بلا كلمة مرور.' })
    ]),
    btn, msg, otpBox,
    el('hr', { class:'divider', style:'margin:0' }),
    gBtn
  ]);
}

/*
  شاشة «حسابي»: الاسم، الصورة الرمزية، التقدّم، المزامنة، الخروج، الحذف النهائي.
  الحذف شرط متجر آبل — زر حقيقي يمسح كل شيء، لا وعد شكلي.
*/
const AVATARS = ['🧑‍⚕️','👩‍⚕️','🩺','🚑','💉','🧠','🫀','🦴','🔬','📚'];

/*
  ★ رفع الصورة الشخصية إلى مخزن Supabase.
  تُصغَّر في المتصفح إلى ٢٥٦ بكسل قبل الرفع: صورة جوال خام ٥ ميغابايت
  تصير ~٣٠ كيلوبايت — أرحم ببيانات الطالب وأسرع ظهورًا في كل مكان.
*/
async function uploadAvatar(file){
  const u = QBANK.api.user();
  const c = QBANK.config.get();
  const s = QBANK.api.session();
  if (!u || !c || !s) return { ok:false };
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = rej;
    i.src = URL.createObjectURL(file);
  });
  const size = 256;
  const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
  const g = cv.getContext('2d');
  // قصّ مربع من المنتصف — الوجه غالبًا في الوسط، والمربع هو شكل الصورة في كل مكان
  const m = Math.min(img.width, img.height);
  g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', .85));
  const path = u.id + '/avatar.jpg';
  const f = QBANK.api.fetchFn();
  const res = await f(c.url + '/storage/v1/object/avatars/' + path, {
    method:'POST',
    headers:{ 'Authorization':'Bearer ' + s.access_token, 'apikey': c.anonKey,
              'Content-Type':'image/jpeg', 'x-upsert':'true' },
    body: blob
  });
  if (!res.ok) return { ok:false };
  // ?v= يكسر كاش المتصفح — الرابط ثابت والصورة تتبدل
  return { ok:true, url: c.url + '/storage/v1/object/public/avatars/' + path + '?v=' + Date.now() };
}

function accountBody(){
  const u = QBANK.api.user();
  if (!u) return el('div');
  /*
    ★ الطبقة الأخيرة: الملف المخزّن يقول لمن هو.
    الكنس عند تبدّل الهوية يكفي نظريًا، لكن نسخةً قديمة من التطبيق قد تكون
    كتبت ملفًا بلا هوية، أو يفتح التطبيقُ هذه الشاشةَ قبل أن تُحفظ الجلسة.
    فنسأل الملف نفسه: أأنت لصاحب هذه الجلسة؟ ومن لا يجيب لا يُعرض.
  */
  const EMPTY = { name:'', avatar: AVATARS[0], phone:'', bio:'', avatar_url:'' };
  const cached = QBANK.store.get('profile', null);
  const prof = (cached && cached.uid === u.id) ? cached
             : Object.assign({ uid: u.id }, EMPTY);
  prof.uid = u.id;   // كل حفظٍ بعد اليوم يخرج موسومًا بصاحبه

  /* ═══ بطل الملف: الصورة والاسم والبريد في صدر الصفحة ═══ */
  const avImg = el('img', { class:'pf-hero__img', alt:'صورتك الشخصية', hidden: prof.avatar_url ? null : true });
  if (prof.avatar_url) avImg.src = prof.avatar_url;
  const avEmoji = el('span', { class:'pf-hero__emoji', 'aria-hidden':'true',
    text: prof.avatar || AVATARS[0], hidden: prof.avatar_url ? true : null });
  const file = el('input', { type:'file', accept:'image/*', hidden:true, 'aria-label':'ارفع صورة شخصية' });
  const camBtn = el('button', { class:'pf-hero__cam', type:'button', 'aria-label':'غيّر صورتك', text:'📷' });
  camBtn.addEventListener('click', () => file.click());
  file.addEventListener('change', async () => {
    if (!file.files || !file.files[0]) return;
    camBtn.textContent = '…';
    const r = await uploadAvatar(file.files[0]);
    camBtn.textContent = '📷';
    if (!r.ok) return QBANK.toast('تعذّر رفع الصورة — تحقق من الاتصال');
    prof.avatar_url = r.url;
    avImg.src = r.url; avImg.hidden = false; avEmoji.hidden = true;
    QBANK.store.set('profile', prof);
    await QBANK.api.saveProfile({ avatar_url: r.url });
    QBANK.toast('صورتك الجديدة في كل مكان الآن');
  });

  const hero = el('div', { class:'card pf-hero' }, [
    el('div', { class:'pf-hero__avwrap' }, [avImg, avEmoji, camBtn, file]),
    el('div', { class:'pf-hero__x' }, [
      el('strong', { class:'pf-hero__n', id:'pfName', text: prof.name || 'طالب مراجعة' }),
      el('span', { class:'pf-hero__mail ltr', text: u.email || '' }),
      el('p', { class:'pf-hero__bio', id:'pfBio', text: prof.bio || '' })
    ])
  ]);

  const nameInput = el('input', { class:'input', id:'accName', value: prof.name || '', placeholder:'اسمك الظاهر في المنصة' });
  const phoneInput = el('input', { class:'input ltr', type:'tel', inputmode:'tel', dir:'ltr',
    value: prof.phone || '', placeholder:'05xxxxxxxx' });
  const bioInput = el('textarea', { class:'input', rows:'3',
    placeholder:'نبذة قصيرة: تخصصك، دفعتك، ما تراجعه هذه الأيام…' });
  bioInput.value = prof.bio || '';
  const avatarRow = el('div', { class:'row avpick', role:'radiogroup', 'aria-label':'الصورة الرمزية البديلة' },
    AVATARS.map(a => {
      const b = el('button', { class:'iconbtn', type:'button', role:'radio',
        'aria-checked': a === (prof.avatar || AVATARS[0]) ? 'true' : 'false', 'aria-label':'صورة ' + a }, [
        el('span', { class:'iconbtn__ico', text:a })
      ]);
      b.addEventListener('click', () => {
        avatarRow.querySelectorAll('[role="radio"]').forEach(x => x.setAttribute('aria-checked','false'));
        b.setAttribute('aria-checked','true');
      });
      return b;
    })
  );

  /*
    ★ الجوال إلزامي — قرار علي.
    التحقق هنا مرن عمدًا: نقبل ٩ أرقام فأكثر بعد تجريد الرموز والمسافات،
    فتمرّ ‎+966‎ و‎05‎ وأرقام خارج السعودية معًا. التشدّد في صيغة واحدة
    يطرد طالبًا رقمه صحيح، وهذا أسوأ من فراغ الحقل.
  */
  const phoneMsg = el('span', { class:'field__hint', role:'status' });
  const saveBtn = el('button', { class:'btn btn--block', type:'button', text:'احفظ ملفي' });
  saveBtn.addEventListener('click', async () => {
    const digits = (phoneInput.value || '').replace(/\D/g, '');
    if (digits.length < 9){
      phoneMsg.textContent = 'رقم الجوال مطلوب — اكتبه كاملًا (مثل ٠٥xxxxxxxx).';
      phoneMsg.className = 'field__hint is-bad';
      phoneInput.focus();
      return;
    }
    phoneMsg.textContent = ''; phoneMsg.className = 'field__hint';
    const picked = avatarRow.querySelector('[aria-checked="true"] .iconbtn__ico');
    const data = { name: nameInput.value.trim(), avatar: picked ? picked.textContent : AVATARS[0],
                   phone: phoneInput.value.trim(), bio: bioInput.value.trim() };
    Object.assign(prof, data);
    QBANK.store.set('profile', prof);
    const r = await QBANK.api.saveProfile(data);
    const n = hero.querySelector('#pfName'), b = hero.querySelector('#pfBio');
    if (n) n.textContent = data.name || 'طالب مراجعة';
    if (b) b.textContent = data.bio || '';
    QBANK.toast(r.ok ? 'حُفظ ملفك' : 'حُفظ في جهازك، وسيتزامن عند الاتصال');
  });

  /* الخادم هو الحقيقة: جهاز جديد يفتح الملف فيجد اسمه وصورته ونبذته
     كما تركها على جهازه الأول — لا نموذجًا فارغًا يظن أنها ضاعت */
  QBANK.api.myProfile().then(r => {
    if (!r.ok || !r.data || !hero.isConnected) return;
    const d = r.data;
    if (d.name && !nameInput.value) nameInput.value = d.name;
    if (d.phone && !phoneInput.value) phoneInput.value = d.phone;
    if (d.bio && !bioInput.value) bioInput.value = d.bio;
    if (d.avatar_url && !prof.avatar_url){
      prof.avatar_url = d.avatar_url;
      avImg.src = d.avatar_url; avImg.hidden = false; avEmoji.hidden = true;
    }
    const n = hero.querySelector('#pfName'), b = hero.querySelector('#pfBio');
    if (n && d.name) n.textContent = d.name;
    if (b && d.bio) b.textContent = d.bio;
    Object.assign(prof, { name: d.name || prof.name, phone: d.phone || prof.phone,
                          bio: d.bio || prof.bio });
    QBANK.store.set('profile', prof);
  });

  /* ═══ تقييماتي — رأي الطالب المعلن جزء من هويته ═══ */
  const ratesBox = el('div', { class:'card' }, [ el('h2', { text:'تقييماتي' }),
    el('p', { class:'field__hint', text:'جارٍ الجلب…' }) ]);
  QBANK.api.rest('subject_ratings?user_id=eq.' + u.id + '&select=subject_id,stars,note').then(r => {
    if (!ratesBox.isConnected) return;
    ratesBox.innerHTML = ''; ratesBox.appendChild(el('h2', { text:'تقييماتي' }));
    const rows = (r.ok && Array.isArray(r.data)) ? r.data : [];
    if (!rows.length){
      ratesBox.appendChild(el('p', { class:'field__hint',
        text:'لم تقيّم مادة بعد — تقييمك يرفع البنوك النافعة لزملائك.' }));
      return;
    }
    const byId = {}; (QBANK.data.pack().subjects || []).forEach(s => byId[s.id] = s);
    rows.forEach(x => {
      const s = byId[x.subject_id];
      ratesBox.appendChild(el('div', { class:'row' }, [
        el('span', { text: (s ? (s.icon || '▤') + ' ' + s.name : 'مادة') }),
        el('span', { class:'spacer' }),
        el('span', { class:'badge badge--warn', 'aria-label': x.stars + ' من ٥',
          text: '★'.repeat(x.stars) + '☆'.repeat(5 - x.stars) })
      ]));
      if (x.note) ratesBox.appendChild(el('p', { class:'field__hint', style:'margin:2px 0 8px', text:'«' + x.note + '»' }));
    });
  });

  return el('div', { class:'stack' }, [
    hero,
    el('div', { class:'card stack' }, [
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'الاسم' }), nameInput
      ]),
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'رقم الجوال *' }), phoneInput, phoneMsg
      ]),
      el('label', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'نبذة عني' }), bioInput
      ]),
      el('div', { class:'field', style:'margin:0' }, [
        el('span', { class:'field__label', text:'رمز مؤقّت — يظهر حتى ترفع صورتك' }), avatarRow
      ]),
      saveBtn
    ]),
    ratesBox
  ]);
}

/*

  شاشة الطالب الأولى، وخانات الرفع المملوءة تلقائيًا، ورابط القسم الذي يشاركه.
  لهذا هي هنا في الحساب لا في الإعدادات: انتماء لا تفضيل.

function campusCard(){
  const box = el('div', { class:'card' });
  const head = el('div', { class:'row', style:'justify-content:space-between;align-items:center;gap:8px' }, [
    el('h2', { style:'margin:0', text:'جامعتي' }), el('span', { id:'campusGo' })
  ]);
  const hint = el('p', { class:'field__hint', style:'margin:4px 0 12px',
    text:'اخترها مرة، فتفتح المنصة على قسم جامعتك وتُملأ خاناتها عند رفع أي مادة.' });
  const slot = el('div');
  box.appendChild(head); box.appendChild(hint); box.appendChild(slot);

  const draw = c => {
    slot.innerHTML = '';
    slot.appendChild(QBANK.campus.picker(c || {}, drawn => draw(drawn)));
    const go = head.querySelector('#campusGo');
    go.innerHTML = '';
    if (c && c.university_id)
      go.appendChild(el('a', { class:'btn btn--sm btn--soft',
        href: QBANK.campus.href(c.university_id), text:'افتح قسمي ←' }));
  };

  draw(QBANK.campus.cached());
  QBANK.campus.load().then(c => { if (slot.isConnected) draw(c); });
  return box;
}

/*
  ═══ موادي المرفوعة ═══
  الطالب الذي رفع بنكًا يريد أن يعرف مصيره: أنُشر؟ كم اشترك فيه؟ كيف قُيّم؟
  هذه البطاقة تجيب الثلاثة، ومنها يقفز إلى صفحة مادته أو إلى ملفه العام.
*/
function myUploadsCard(){
  const u = QBANK.api.user();
  const box = el('div', { class:'card stack' }, [ el('h2', { style:'margin:0', text:'موادي المرفوعة' }),
    el('p', { class:'field__hint', style:'margin:0', text:'جارٍ الجلب…' }) ]);
  if (!u) return box;
  QBANK.api.rest('subjects?created_by=eq.' + u.id +
    '&select=id,name,icon,color,q_count,published,status,price,free,rating_avg,rating_n&order=created_at.desc')
    .then(r => {
      if (!box.isConnected) return;
      box.innerHTML = ''; box.appendChild(el('h2', { style:'margin:0', text:'موادي المرفوعة' }));
      const rows = (r.ok && Array.isArray(r.data)) ? r.data : [];
      if (!rows.length){
        box.appendChild(el('p', { class:'field__hint', style:'margin:0',
          text:'لم ترفع مادة بعد — بنك أسئلتك ينفع دفعتك كلها، ويكسبك كوينز وسمعة.' }));
        box.appendChild(el('a', { class:'btn btn--soft btn--block', href:'#/upload', text:'⇪ ارفع مادتك الأولى' }));
        return;
      }
      rows.forEach(s => {
        const st = s.published ? el('span', { class:'badge badge--ok', text:'منشورة' })
                 : el('span', { class:'badge badge--warn', text:'قيد المراجعة' });
        box.appendChild(el('a', { class:'up-row', href:'#/subject/' + s.id }, [
          el('span', { class:'up-row__ico', 'aria-hidden':'true', text: s.icon || '▤' }),
          el('span', { class:'up-row__x' }, [
            el('span', { class:'up-row__t', text: s.name }),
            el('span', { class:'up-row__s num', text:
              QBANK.views.arNum(s.q_count || 0) + ' سؤالًا' +
              (Number(s.rating_n) ? ' · ★ ' + Number(s.rating_avg).toFixed(1) +
                ' (' + QBANK.views.arNum(s.rating_n) + ')' : ' · بلا تقييم بعد') })
          ]),
          st
        ]));
      });
      box.appendChild(el('a', { class:'btn btn--ghost btn--block', href:'#/upload', text:'+ ارفع مادة أخرى' }));
    });
  return box;
}

/* ═══ نشاطي بالأرقام — لمحة تُقرأ في ثانية ═══ */
function myStatsCard(){
  const pack = QBANK.data.pack();
  const subs = pack.subjects || [];
  const mine = QBANK.views.mySubjects();
  let done = 0, total = 0;
  subs.forEach(s => {
    if (mine.indexOf(s.id) === -1) return;
    const pct = QBANK.progress.pctDone(s.id, s.q_count);
    done += Math.round((s.q_count || 0) * pct / 100); total += (s.q_count || 0);
  });
  const pct = total ? Math.round(done * 100 / total) : 0;
  return el('div', { class:'peer-stats' }, [
    el('div', { class:'peer-stat' }, [
      el('b', { class:'num', text: QBANK.views.arNum(mine.length) }), el('span', { text:'مادة عندي' }) ]),
    el('div', { class:'peer-stat' }, [
      el('b', { class:'num', text: QBANK.views.arNum(done) }), el('span', { text:'سؤالًا راجعته' }) ]),
    el('div', { class:'peer-stat' }, [
      el('b', { class:'num', text: QBANK.views.arNum(pct) + '٪' }), el('span', { text:'من موادي' }) ])
  ]);
}

    const active = (route && ACC_TABS.some(t => t.id === route.rest[0])) ? route.rest[0] : 'profile';

    const shareBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'⤴ انشر ملفي' });
    shareBtn.addEventListener('click', async () => {
      const r = await QBANK.share.sharePlain(QBANK.share.profileUrl(u.id),

      if (r.ok && r.via === 'copy') QBANK.toast('نُسخ رابط ملفك العام');

    const openMine = el('a', { class:'btn btn--sm btn--soft', href:'#/p/' + u.id, text:'👁 ملفي كما يراه زملائي' });

      el('div', { class:'ad-bar', style:'margin-bottom:8px' }, [ openMine, shareBtn ]),
      tabs, body

/* ═══════════════════════════════════════════════════════════════
   بطاقة الحساب في الترويسة — الشريط يعرف من أنت
   ═══════════════════════════════════════════════════════════════
   ★ العطل الذي كانت تُخفيه بساطته: زرّ «دخول» كان نصًّا ثابتًا في
   هيكل الصفحة، لا يمرّ عليه كود بعد أول رسم. فالطالب يدخل بنجاح ثم
   يرى الزرّ نفسه في مكانه، فيظنّ أن دخوله لم يُقبل — يعيد الكرّة،
   ويطلب رابطًا ثالثًا، ثم يقتنع أن المنصة معطوبة وينصرف.

   والبديل ليس إخفاء الزرّ: مكانه في الترويسة أثمن من أن يُترك فارغًا.
   وجهُك واسمُك هناك يقولان «أنت داخل» بلا كلمة، ويختصران طريق العودة
   إلى حسابك من كل شاشة.
*/
function authChip(){
  const slot = document.getElementById('authSlot');
  if (!slot) return;
  const u = QBANK.api.user();

  if (!u) {
    // خارج الجلسة: زرّ الدخول كما كان — ولا نعيد بناءه إن كان قائمًا
    if (slot.querySelector('[data-nav="#/login"]')) return;
    slot.innerHTML = '';
    slot.appendChild(el('a', { class:'btn btn--sm', href:'#/login',
                               'data-nav':'#/login', text:'دخول' }));
    return;
  }

  /* داخل الجلسة: الصورة ثم الاسم. والملف المخزّن يُقرأ بشرط أن يكون
     لصاحب هذه الجلسة (انظر حارس الهوية في accountBody) — فلا تظهر
     صورة من خرج قبل قليل على من دخل بعده. */
  const cached = QBANK.store.get('profile', null);
  const prof = (cached && cached.uid === u.id) ? cached : {};
  const name = (prof.name || '').trim() || (u.email || '').split('@')[0] || 'حسابي';

  // لا نعيد الرسم بلا تغيير: كل رسمٍ للترويسة يومض ويُربك قارئ الشاشة
  const admOk = (function(){ const a = QBANK.store.get('is_admin_check', null);
                             return !!(a && a.uid === u.id && a.ok); })();
  const sig = u.id + '|' + (prof.avatar_url || '') + '|' + (prof.avatar || '') + '|' + name +
              '|' + (admOk ? 'a' : '');
  if (slot.dataset.sig === sig) return;
  slot.dataset.sig = sig;

  const face = prof.avatar_url
    ? el('img', { class:'authchip__img', src: prof.avatar_url, alt:'' })
    : el('span', { class:'authchip__ico', 'aria-hidden':'true',
                   text: prof.avatar || '◍' });

  slot.innerHTML = '';

  /*
    ★ بابٌ دائم إلى اللوحة للمشرف.
    اللوحة تُخفي شريط الطالب، فمتى خرج المشرف منها إلى أي شاشة طالب —
    بزرٍّ، أو برابط مادة، أو بفضولٍ — فقد طريقَ العودة ولزمه أن يكتب
    المسار بيده. زرٌّ صغير في الترويسة يحلّ هذا كله، ولا يراه الطالب.
    والصلاحية من الذاكرة لا من نداءٍ جديد: الترويسة تُرسم مع كل شاشة.
  */
  const adm = QBANK.store.get('is_admin_check', null);
  if (adm && adm.uid === u.id && adm.ok) {
    slot.appendChild(el('a', { class:'iconbtn authchip__adm', href:'#/admin',
      'aria-label':'لوحة التحكم', title:'لوحة التحكم' }, [
      el('span', { class:'iconbtn__ico', 'aria-hidden':'true', text:'⚙' })
    ]));
  }

  slot.appendChild(el('a', { class:'authchip', href:'#/account', 'data-nav':'#/account',
                             'aria-label':'حسابي — ' + name }, [
    face,
    el('span', { class:'authchip__n', text: name })
  ]));
}
QBANK.authChip = authChip;
