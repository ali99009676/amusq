/* ===== 34-upload.js ===== */
/*
  معالج رفع الأسئلة — أربع خطوات ظاهرة للمشرف:
  ١ اقرأ الملف · ٢ افهمه بالذكاء · ٣ راجِع · ٤ انشر.
  المنطق في AMUSQ.admin (قابل للفحص)؛ هنا الواجهة فقط.
*/
let wizard = null;   // حالة المعالج تعيش بين إعادة الرسم داخل الجلسة

function stepsBar(current){
  const names = ['اقرأ الملف','افهمه بالذكاء','راجِع','انشر'];
  return el('ol', { class:'steps' }, names.map((n, i) =>
    el('li', { class:'steps__item' + (i + 1 === current ? ' is-on' : '') + (i + 1 < current ? ' is-done' : ''),
      'aria-current': i + 1 === current ? 'step' : null }, [
      el('span', { class:'steps__num num', text: String(i + 1) }),
      el('span', { text: n })
    ])));
}

/* الخطوة ١: سحب وإفلات أو اختيار ملف */
function stepRead(box, rerender){
  const drop = el('div', { class:'drop', tabindex:'0', role:'button', 'aria-label':'اختر ملف أسئلة' }, [
    el('span', { class:'empty__ico', 'aria-hidden':'true', text:'⇪' }),
    el('p', { class:'empty__title', text:'أسقط ملف الأسئلة هنا أو اضغط للاختيار' }),
    el('p', { class:'empty__text', text:'PDF أو DOCX أو TXT — حتى ١٥ ميغابايت. يفهم شكلين: خيارات A-D، وقوائم سؤال-ثم-إجابة.' })
  ]);
  const fileIn = el('input', { type:'file', accept:'.pdf,.docx,.txt', style:'display:none', 'aria-hidden':'true' });
  const msg = el('p', { class:'field__hint', role:'status' });

  async function handle(file){
    if (!file) return;
    msg.textContent = 'جارٍ قراءة «' + file.name + '»…';
    const b64 = await new Promise(resolve => {
      const rd = new FileReader();
      rd.onload = () => resolve(String(rd.result).split(',')[1] || '');
      rd.readAsDataURL(file);
    });
    wizard = await AMUSQ.admin.wizardIngest(wizard, file.name, b64);
    if (wizard.error) { msg.textContent = '⚠ ' + wizard.error; return; }
    rerender();
  }
  drop.addEventListener('click', () => fileIn.click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileIn.click(); });
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('is-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('is-over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('is-over'); handle(e.dataTransfer.files[0]); });
  fileIn.addEventListener('change', () => handle(fileIn.files[0]));

  box.appendChild(drop); box.appendChild(fileIn); box.appendChild(msg);
}

/* الخطوة ٢: التقدير ثم التشغيل بدفعات مع شريط «٨٠ من ٣٠٠» */
function stepEnrich(box, rerender){
  const est = AMUSQ.admin.estimate(wizard);
  const bar = el('div', { class:'meter', role:'progressbar', 'aria-valuemin':'0',
    'aria-valuemax': String(wizard.total), 'aria-valuenow': String(wizard.done) }, [
    el('div', { class:'meter__fill', style:'width:' + (wizard.total ? wizard.done / wizard.total * 100 : 0) + '%' })
  ]);
  const label = el('p', { class:'page__sub num', text: wizard.done + ' من ' + wizard.total });
  const msg = el('p', { class:'field__hint', role:'status' });
  const go = el('button', { class:'btn btn--block', type:'button',
    text: wizard.done ? 'أكمل من حيث توقفت (' + wizard.done + ')' : 'شغّل الذكاء الآن' });

  go.addEventListener('click', async () => {
    go.setAttribute('aria-disabled','true'); go.textContent = 'جارٍ المعالجة…';
    wizard = await AMUSQ.admin.wizardEnrich(wizard, (done, total) => {
      label.textContent = done + ' من ' + total;
      bar.setAttribute('aria-valuenow', String(done));
      bar.firstChild.style.width = (done / total * 100) + '%';
    });
    if (wizard.error) { msg.textContent = '⚠ ' + wizard.error + ' — المحفوظ لا يضيع، أعد المحاولة.'; go.removeAttribute('aria-disabled'); go.textContent = 'أعد المحاولة'; return; }
    rerender();
  });

  box.appendChild(el('div', { class:'card stack' }, [
    el('h2', { text:'قبل التشغيل — التقدير' }),
    el('div', { class:'row' }, [
      el('span', { class:'badge num', text: est.questions + ' سؤالًا' }),
      el('span', { class:'badge num', text: est.batches + ' دفعة ذكاء' }),
      el('span', { class:'badge', text:'المسوّدة تُحفظ بعد كل دفعة' })
    ]),
    bar, label, go, msg
  ]));
}

/* الخطوة ٣: المراجعة — بطاقة لكل سؤال، تغيير الإجابة بضغطة، وسوم حمراء للمستنتَج */
function stepReview(box, rerender){
  const dups = AMUSQ.admin.findDuplicates(wizard.enriched);
  const dupSet = new Set(dups.map(d => d.index));
  if (dups.length) box.appendChild(el('p', { class:'row' }, [
    el('span', { class:'badge badge--warn num', text: 'تنبيه: ' + dups.length + ' سؤالًا مكررًا — موسوم لا محذوف' })
  ]));

  wizard.enriched.forEach((q, qi) => {
    const opts = el('div', { class:'stack q__opts' }, q.options.map((opt, oi) => {
      const b = el('button', { class:'opt' + (q.answer === oi ? ' is-answer' : ''), type:'button' }, [
        el('span', { class:'opt__mark', 'aria-hidden':'true', text: q.answer === oi ? '✓' : '' }),
        el('span', { class:'ltr', text: opt })
      ]);
      // المشرف يغيّر الإجابة بضغطة على أي خيار — والتغيير يمسح وسم «مستنتجة»
      b.addEventListener('click', () => { q.answer = oi; q.derived = false; rerender(); });
      return b;
    }));
    const badges = el('div', { class:'row' }, [
      el('span', { class:'badge num', text:'س' + (qi + 1) }),
      q.derived ? el('span', { class:'badge badge--bad', text:'⚠ إجابة مستنتجة' }) : null,
      q.opts_built ? el('span', { class:'badge badge--bad', text:'⚠ خيارات مبنية' }) : null,
      dupSet.has(qi) ? el('span', { class:'badge badge--warn', text:'مكرر' }) : null,
      q.topic ? el('span', { class:'badge', text: q.topic }) : null
    ]);
    const impBtn = el('button', { class:'btn btn--sm ' + (q.important ? 'btn--soft' : 'btn--ghost'), type:'button',
      text: q.important ? '★ مهم' : 'وسمه مهمًا' });
    impBtn.addEventListener('click', () => { q.important = !q.important; rerender(); });
    box.appendChild(el('article', { class:'card stack q' }, [
      badges,
      el('p', { class:'ltr q__text', text: q.q }),
      opts,
      el('div', { class:'row' }, [ impBtn ])
    ]));
  });

  const next = el('button', { class:'btn btn--block', type:'button', text:'راجعتُ الكل — تابع للنشر' });
  next.addEventListener('click', async () => { wizard.step = 4; await AMUSQ.admin.saveDraft(wizard); rerender(); });
  box.appendChild(next);
}

/* الخطوة ٤: زران — اعتماد ذرّي أو حفظ مخفي */
function stepPublish(box){
  const derived = wizard.enriched.filter(q => q.derived).length;
  const pub = el('button', { class:'btn btn--block', type:'button', text:'اعتمد وانشر للطلاب' });
  const hide = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'احفظ مخفية' });
  const msg = el('p', { class:'field__hint', role:'status' });
  async function fire(publish){
    const r = await AMUSQ.admin.approve(wizard, publish);
    if (r.ok) { AMUSQ.toast(publish ? 'نُشرت المادة للطلاب' : 'حُفظت مخفية'); wizard = null; AMUSQ.router.go('#/admin/content'); }
    else msg.textContent = '⚠ ' + ((r.data && r.data.message) || 'تعذّر الاعتماد — لم يتغير شيء في قاعدة البيانات.');
  }
  pub.addEventListener('click', () => fire(true));
  hide.addEventListener('click', () => fire(false));
  box.appendChild(el('div', { class:'card stack' }, [
    el('h2', { text:'الاعتماد' }),
    el('p', { class:'page__sub num', text: wizard.total + ' سؤالًا جاهزًا' +
      (derived ? ' — منها ' + derived + ' بإجابة مستنتجة راجعتَها' : '') }),
    el('p', { class:'field__hint', text:'الاعتماد عملية ذرّية: إما تُنشأ المادة وكل أسئلتها أو لا يتغير شيء.' }),
    pub, hide, msg
  ]));
}

const ViewUpload = {
  title:'رفع الأسئلة',
  view(route){
    if (!AMUSQ.api.user()) return AMUSQ.views.ViewAdminLogin.view();
    if (!wizard) wizard = AMUSQ.admin.newWizard();
    // استئناف مسوّدة من القائمة: نجلبها بحمولتها ونقفز للخطوة الصحيحة
    if (route.query.draft && wizard.draftId !== route.query.draft) {
      wizard = AMUSQ.admin.newWizard();
      wizard.draftId = route.query.draft;
      AMUSQ.api.rest('drafts?id=eq.' + route.query.draft + '&select=*').then(r => {
        if (r.ok && r.data && r.data[0]) {
          const d = r.data[0];
          wizard.filename = d.source_name; wizard.enriched = d.payload || [];
          wizard.total = d.total; wizard.done = d.done;
          wizard.step = d.done >= d.total ? 3 : 2;
          AMUSQ.router.render(location.hash);
        }
      });
    }
    const body = el('div', { class:'stack' });
    const rerender = () => AMUSQ.router.render(location.hash);
    [null, stepRead, stepEnrich, stepReview, stepPublish][wizard.step](body, rerender);
    return AMUSQ.views.page('رفع الأسئلة', 'من ملف الدكتور إلى مادة يذاكرها الطلاب — بأربع خطوات.', [
      stepsBar(wizard.step), body
    ]);
  },
  _reset(){ wizard = null; },       // للفحوص
  _get(){ return wizard; },
  _set(w){ wizard = w; }
};
AMUSQ.views.ViewUpload = ViewUpload;


/* ===== 35-subject.js ===== */
/*
  صفحة المادة — أربعة تبويبات: نظرة عامة · الشرح · بنك الأسئلة · طريقة الحفظ.
  الأسئلة تُجلب مرة واحدة ثم من جهاز الطالب (IndexedDB) — تعمل بعدها بلا إنترنت.
  البنك مصمَّم لخمسمئة سؤال: عرض على دفعات، وأقسام مطوية افتراضيًا.
*/
const SUBJ_TABS = [
  { id:'overview', label:'نظرة عامة' },
  { id:'explain',  label:'الشرح' },
  { id:'bank',     label:'بنك الأسئلة' },
  { id:'memo',     label:'طريقة الحفظ' }
];
const BANK_PAGE = 50;   // دفعة العرض — التمرير يطلب المزيد بدل رسم ٥٠٠ عنصر دفعة واحدة

function findSubject(sid){
  return (AMUSQ.data.pack().subjects || []).filter(s => s.id === sid)[0] || null;
}

/* شريط سؤال واحد في البنك (وضع القائمة) */
function bankRow(sub, q, prog){
  const starred = !!prog.star[q.id];
  const starBtn = el('button', { class:'iconbtn', type:'button',
    'aria-label': starred ? 'أزل النجمة' : 'ميّز بنجمة', 'aria-pressed': String(starred) }, [
    el('span', { class:'iconbtn__ico', text: starred ? '★' : '☆',
      style: starred ? 'color:var(--star)' : '' })
  ]);
  starBtn.addEventListener('click', () => {
    AMUSQ.progress.toggleStar(sub.id, q.id);
    AMUSQ.router.render(location.hash);
  });

  const opts = el('div', { class:'stack q__opts', hidden:true },
    q.options.map((opt, oi) => el('div', { class:'opt' + (oi === q.answer ? ' is-answer' : '') }, [
      el('span', { class:'opt__mark', 'aria-hidden':'true', text: oi === q.answer ? '✓' : '' }),
      el('span', { class:'ltr', text: opt })
    ])));
  const trans = el('p', { class:'field__hint', hidden:true, text: q.translation || 'لا ترجمة بعد.' });
  const transBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'عرض الترجمة' });
  transBtn.addEventListener('click', () => {
    trans.hidden = !trans.hidden;
    transBtn.textContent = trans.hidden ? 'عرض الترجمة' : 'إخفاء الترجمة';
  });

  const head = el('button', { class:'rowbtn', type:'button', 'aria-expanded':'false' }, [
    el('span', { class:'ltr q__text', text: q.q })
  ]);
  head.addEventListener('click', () => {
    const open = opts.hidden;
    opts.hidden = !open;
    head.setAttribute('aria-expanded', String(open));
    if (open) AMUSQ.progress.markSeen(sub.id, q.id);   // فتح السؤال = رُوجع
  });

  return el('article', { class:'q', 'data-qid': q.id }, [
    el('div', { class:'row' }, [
      head, starBtn,
      prog.wrong[q.id] ? el('span', { class:'badge badge--bad num', text:'أخطأت ×' + prog.wrong[q.id] }) : null,
      q.important ? el('span', { class:'badge badge--warn', text:'مهم' }) : null
    ]),
    opts, el('div', { class:'row' }, [transBtn]), trans
  ]);
}

/* بطاقة مقلوبة (وضع البطاقات) */
function flipCard(sub, q){
  const card = el('div', { class:'flip', tabindex:'0', role:'button', 'aria-label':'بطاقة: اضغط لقلبها' }, [
    el('div', { class:'flip__in' }, [
      el('div', { class:'flip__face' }, [ el('p', { class:'ltr q__text', text: q.q }) ]),
      el('div', { class:'flip__face flip__face--back' }, [
        el('p', { class:'ltr', style:'font-weight:700', text: q.options[q.answer] }),
        q.expl_ar ? el('p', { class:'field__hint', text: q.expl_ar }) : null
      ])
    ])
  ]);
  const flip = () => {
    card.classList.toggle('is-flipped');
    AMUSQ.progress.markSeen(sub.id, q.id);
  };
  card.addEventListener('click', flip);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  return card;
}

/* تبويب البنك: بحث + فلاتر + وضعان + أقسام مطوية بالمحاور */
function bankTab(sub, questions){
  const state = AMUSQ.store.get('bank_ui', { filter:'all', mode:'list' });
  const prog = AMUSQ.progress.forSubject(sub.id);
  const box = el('div', { class:'stack' });

  const search = el('input', { class:'input', type:'search', id:'bankSearch',
    placeholder:'ابحث في ' + questions.length + ' سؤالًا…', 'aria-label':'بحث في بنك الأسئلة' });

  const FILTERS = [
    ['all','الكل'], ['unseen','لم أراجعه'], ['wrong','أخطأت فيه'], ['star','بنجمة']
  ];
  const filters = el('div', { class:'row', role:'group', 'aria-label':'تصفية الأسئلة' },
    FILTERS.map(([id, label]) => {
      const b = el('button', { class:'btn btn--sm ' + (state.filter === id ? 'btn--soft' : 'btn--ghost'),
        type:'button', 'aria-pressed': String(state.filter === id), text: label });
      b.addEventListener('click', () => {
        state.filter = id; AMUSQ.store.set('bank_ui', state);
        AMUSQ.router.render(location.hash);
      });
      return b;
    }));

  const modeBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button',
    text: state.mode === 'list' ? 'وضع البطاقات ▦' : 'وضع القائمة ☰' });
  modeBtn.addEventListener('click', () => {
    state.mode = state.mode === 'list' ? 'cards' : 'list';
    AMUSQ.store.set('bank_ui', state);
    AMUSQ.router.render(location.hash);
  });
  filters.appendChild(el('span', { class:'spacer' }));
  filters.appendChild(modeBtn);

  const listBox = el('div', { class:'stack', id:'bankList' });

  function applyFilters(){
    const term = (search.value || '').trim().toLowerCase();
    return questions.filter(q => {
      if (state.filter === 'unseen' && prog.seen[q.id]) return false;
      if (state.filter === 'wrong' && !prog.wrong[q.id]) return false;
      if (state.filter === 'star' && !prog.star[q.id]) return false;
      if (term && (q.q + ' ' + q.options.join(' ')).toLowerCase().indexOf(term) === -1) return false;
      return true;
    });
  }

  function render(){
    listBox.innerHTML = '';
    const filtered = applyFilters();
    if (!filtered.length) {
      listBox.appendChild(AMUSQ.views.empty('؟', 'لا نتائج', 'جرّب فلترًا آخر أو كلمة بحث أقصر.'));
      return;
    }
    // أقسام حسب المحاور — مطوية افتراضيًا مع عدد أسئلة كل قسم
    const topics = {};
    filtered.forEach(q => { const t = q.topic || 'عام'; (topics[t] = topics[t] || []).push(q); });
    Object.keys(topics).forEach(t => {
      const qs = topics[t];
      const inner = el('div', { class: state.mode === 'cards' ? 'grid grid--2' : 'stack' });
      let shown = 0;
      const more = el('button', { class:'btn btn--soft btn--block', type:'button' });
      function fill(){
        // دفعات العرض: ٥٠ سؤالًا في كل طلب — البنك يظل سلسًا على ٥٠٠ سؤال
        const next = qs.slice(shown, shown + BANK_PAGE);
        next.forEach(q => inner.appendChild(state.mode === 'cards' ? flipCard(sub, q) : bankRow(sub, q, prog)));
        shown += next.length;
        more.textContent = 'عرض المزيد (' + (qs.length - shown) + ' متبقٍ)';
        more.hidden = shown >= qs.length;
      }
      more.addEventListener('click', fill);
      fill();
      const fold = el('details', { class:'fold' }, [
        el('summary', {}, [ t + ' ', el('span', { class:'badge num', text: qs.length + ' سؤالًا' }) ]),
        inner, more
      ]);
      if (Object.keys(topics).length === 1) fold.setAttribute('open','');
      listBox.appendChild(fold);
    });
  }
  let debounce = null;
  search.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(render, 150); });

  render();
  box.appendChild(search); box.appendChild(filters); box.appendChild(listBox);
  return box;
}

/* تبويب الشرح: مطوي لكل سؤال — لماذا الصحيح صحيح ولماذا غيره خاطئ */

/* تبويب طريقة الحفظ: البطاقة الذهنية لكل سؤال */
function memoTab(sub, questions){

      el('div', { class:'row' }, [
        el('span', { class:'badge', text:'الكلمة الدالة' }),

        el('span', { class:'badge badge--ok', text:'المفتاح' }),

}

/* ===== 36-examview.js ===== */
/*
  واجهة الاختبار التجريبي — المادة مثبّتة من مسار الدخول فلا خطوة اختيار.
  المحرك في 24-exam.js؛ هنا الشاشات الثلاث: الإعداد ← الأسئلة ← النتيجة.
*/
let examState = null;   // {exam, sub, timerId, secondsLeft}

function examSetup(sub, questions){
  const prog = AMUSQ.progress.forSubject(sub.id);
  const topics = Array.from(new Set(questions.map(q => q.topic || 'عام')));

  const scopeSel = el('select', { class:'input', id:'exScope', 'aria-label':'نطاق الاختبار' }, [
    el('option', { value:'all', text:'كل الأسئلة (' + questions.length + ')' }),
    el('option', { value:'important', text:'الأسئلة المهمة (' + questions.filter(q => q.important).length + ')' }),
    el('option', { value:'wrong', text:'أخطائي السابقة (' + Object.keys(prog.wrong).length + ')' })
  ].concat(topics.map(t => el('option', { value:'topic:' + t, text:'قسم: ' + t }))));

  const timerSel = el('select', { class:'input', id:'exTimer', 'aria-label':'المؤقت' }, [
    el('option', { value:'0', text:'بلا مؤقت' }),
    el('option', { value:'10', text:'١٠ دقائق' }),
    el('option', { value:'20', text:'٢٠ دقيقة' }),
    el('option', { value:'45', text:'٤٥ دقيقة' })
  ]);

  // التصحيح الفوري بعد كل سؤال هو الافتراضي
  const modeSel = el('select', { class:'input', id:'exMode', 'aria-label':'نمط التصحيح' }, [
    el('option', { value:'instant', text:'تصحيح فوري بعد كل سؤال (الافتراضي)' }),
    el('option', { value:'end', text:'التصحيح بعد الانتهاء' })
  ]);

  const start = el('button', { class:'btn btn--block', type:'button', text:'ابدأ الاختبار' });
  start.addEventListener('click', () => {
    const sv = scopeSel.value;
    const opts = {
      scope: sv.indexOf('topic:') === 0 ? 'topic' : sv,
      topic: sv.indexOf('topic:') === 0 ? sv.slice(6) : '',
      mode: modeSel.value,
      timerMin: parseInt(timerSel.value, 10),
      wrongMap: prog.wrong
    };
    const exam = AMUSQ.exam.create(questions, opts);
    if (!exam.items.length) { AMUSQ.toast('لا أسئلة في هذا النطاق'); return; }
    examState = { exam, sub, secondsLeft: opts.timerMin * 60, timerId: null };
    if (opts.timerMin) {
      examState.timerId = setInterval(() => {
        examState.secondsLeft--;
        const t = document.getElementById('exClock');
        if (t) {
          t.textContent = Math.floor(examState.secondsLeft / 60) + ':' + String(examState.secondsLeft % 60).padStart(2,'0');
          t.classList.toggle('is-low', examState.secondsLeft <= 60);
        }
        if (examState.secondsLeft <= 0) finishExam();   // انتهى الوقت: تسليم تلقائي
      }, 1000);
    }
    AMUSQ.router.render(location.hash);
  });

  return el('div', { class:'card stack' }, [
    el('h2', { text:'إعداد الاختبار' }),
    el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'النطاق' }), scopeSel ]),
    el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'المؤقت' }), timerSel ]),
    el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'التصحيح' }), modeSel ]),
    el('p', { class:'field__hint', text:'الأسئلة التي أخطأت فيها سابقًا لها أولوية الظهور، والخيارات تُخلط في كل مرة.' }),
    start
  ]);
}

function finishExam(){
  const st = examState;
  if (!st || st.exam.finished) return;
  if (st.timerId) clearInterval(st.timerId);
  st.result = AMUSQ.exam.finish(st.exam);
  // تسجيل المحاولة: محليًا فورًا، وللحساب في الخلفية
  AMUSQ.progress.recordExam(st.sub.id, st.result.pct);
  st.result.wrongIds.forEach(qid => AMUSQ.progress.markWrong(st.sub.id, qid));
  st.exam.items.forEach((it, i) => {
    if (st.exam.answers[i] && st.exam.answers[i].correct) AMUSQ.progress.clearWrong(st.sub.id, it.id);
  });
  if (AMUSQ.api.user()) AMUSQ.api.rest('attempts', { method:'POST', body: JSON.stringify({
    user_id: AMUSQ.api.user().id, subject_id: st.sub.id, scope:'all', topic:'',
    correct: st.result.correct, total: st.result.total, pct: st.result.pct,
    duration_s: st.result.duration_s }) });
  AMUSQ.router.render(location.hash);
}

function examRunner(){
  const st = examState;
  const exam = st.exam;
  const item = exam.items[exam.i];
  const answered = exam.answers[exam.i];

  const opts = el('div', { class:'stack q__opts' }, item.options.map((opt, oi) => {
    let cls = 'opt', mark = '';
    if (answered && exam.mode === 'instant') {
      // فوري: اللون والأيقونة معًا — ✓ للصحيح و ✗ للاختيار الخاطئ
      if (oi === item.correct) { cls += ' is-answer'; mark = '✓'; }
      else if (oi === answered.choice) { cls += ' is-wrong'; mark = '✗'; }
    } else if (answered && answered.choice === oi) { cls += ' is-answer'; mark = '●'; }
    const b = el('button', { class: cls, type:'button', disabled: answered ? true : null }, [
      el('span', { class:'opt__mark', 'aria-hidden':'true', text: mark }),
      el('span', { class:'ltr', text: opt })
    ]);
    b.addEventListener('click', () => {
      AMUSQ.exam.answer(exam, oi);
      AMUSQ.router.render(location.hash);
    });
    return b;
  }));

  const answeredCount = exam.answers.filter(a => a !== null).length;
  const nav = el('div', { class:'row' }, [
    el('button', { class:'btn btn--ghost btn--sm', type:'button', id:'exPrev',
      disabled: exam.i === 0 ? true : null, text:'→ السابق' }),
    el('span', { class:'spacer' }),
    el('span', { class:'badge num', text: (exam.i + 1) + ' / ' + exam.items.length }),
    st.secondsLeft ? el('span', { class:'timer badge num', id:'exClock',
      text: Math.floor(st.secondsLeft / 60) + ':' + String(st.secondsLeft % 60).padStart(2,'0') }) : null,
    el('span', { class:'spacer' }),
    exam.i < exam.items.length - 1
      ? el('button', { class:'btn btn--sm', type:'button', id:'exNext', text:'التالي ←' })
      : el('button', { class:'btn btn--sm', type:'button', id:'exFinish',
          text:'أنهِ الاختبار (' + answeredCount + '/' + exam.items.length + ')' })
  ]);
  nav.addEventListener('click', e => {
    if (e.target.id === 'exPrev') { AMUSQ.exam.prev(exam); AMUSQ.router.render(location.hash); }
    if (e.target.id === 'exNext') { AMUSQ.exam.next(exam); AMUSQ.router.render(location.hash); }
    if (e.target.id === 'exFinish') finishExam();
  });

  return el('div', { class:'stack' }, [
    el('div', { class:'card stack q' }, [
      el('p', { class:'ltr q__text', text: item.q }), opts,
      (answered && exam.mode === 'instant' && item.expl_ar)
        ? el('p', { class:'field__hint', text: item.expl_ar }) : null
    ]),
    nav
  ]);
}

function examResult(){
  const st = examState, r = st.result;
  const topicRows = Object.keys(r.byTopic).map(t => {
    const d = r.byTopic[t];
    const pct = Math.round(d.correct / d.total * 100);
    return el('div', { class:'row' }, [
      el('span', { text: t }),
      el('span', { class:'spacer' }),
      el('span', { class:'badge num ' + (pct >= 70 ? 'badge--ok' : 'badge--bad'), text: d.correct + '/' + d.total })
    ]);
  });
  const retryWrong = el('button', { class:'btn btn--soft btn--block', type:'button',
    text:'أعد اختبار الأخطاء فقط (' + r.wrongIds.length + ')' , disabled: r.wrongIds.length ? null : true });
  retryWrong.addEventListener('click', async () => {
    const qs = (await AMUSQ.data.subjectQuestions(st.sub.id)).data;
    const wrongSet = {};
    r.wrongIds.forEach(id => wrongSet[id] = 1);
    const exam = AMUSQ.exam.create(qs, { scope:'wrong', wrongMap: wrongSet, mode: st.exam.mode });
    examState = { exam, sub: st.sub, secondsLeft: 0, timerId: null };
    AMUSQ.router.render(location.hash);
  });

  const review = el('details', { class:'fold' }, [
    el('summary', {}, ['مراجعة كاملة للأسئلة']),
    el('div', { class:'stack' }, r.review.map((rv, i) => el('div', { class:'card card--flat stack q' }, [
      el('div', { class:'row' }, [
        el('span', { class:'badge num', text:'س' + (i + 1) }),
        rv.ok ? el('span', { class:'badge badge--ok', text:'✓ صحيح' })
              : el('span', { class:'badge badge--bad', text:'✗ خطأ' })
      ]),
      el('p', { class:'ltr q__text', text: rv.q }),
      el('div', { class:'stack q__opts' }, rv.options.map((o, oi) =>
        el('div', { class:'opt' + (oi === rv.correct ? ' is-answer' : (oi === rv.chosen ? ' is-wrong' : '')) }, [
          el('span', { class:'opt__mark', 'aria-hidden':'true', text: oi === rv.correct ? '✓' : (oi === rv.chosen ? '✗' : '') }),
          el('span', { class:'ltr', text: o })
        ]))),
      rv.expl_ar ? el('p', { class:'field__hint', text: rv.expl_ar }) : null
    ])))
  ]);

  return el('div', { class:'stack' }, [
    el('div', { class:'card', style:'text-align:center' }, [
      el('div', { class:'result__pct num', text: r.pct + '٪' }),
      el('div', { class:'result__grade', text: r.grade }),

/* ===== 37-print.js ===== */
/*
  الطباعة / PDF — تنسيق مستقل تمامًا عن الشاشة:
  يبني وثيقة داخل حاوية مخفية تظهر وحدها عند الطباعة، بترويسة بلون المادة،
  وأسئلة لا تنقسم بين صفحتين، وتذييل يتكرر أسفل كل صفحة.
*/
function buildPrintDoc(sub, questions, opts){
  const root = el('div', { class:'print-root' + (opts.economic ? ' print--eco' : ''), dir:'rtl' });
  root.appendChild(el('header', { class:'print-head', style: opts.economic ? '' :
    'border-color:' + AMUSQ.views.subjectColor(sub.color) }, [
    el('h1', { text: sub.name }),
    el('p', { text: { bank:'بنك الأسئلة', explain:'الشرح', memo:'بطاقات الحفظ', overview:'نظرة عامة' }[opts.what] })
  ]));

  let qs = questions;
  if (opts.range === 'important') qs = qs.filter(q => q.important);
  if (opts.range === 'starred') {
    const star = AMUSQ.progress.forSubject(sub.id).star;
    qs = qs.filter(q => star[q.id]);
  }

  if (opts.what === 'overview') {
    root.appendChild(el('p', { text: sub.descr || '' }));
    (sub.topics || []).forEach(t => root.appendChild(el('p', { text:'• ' + t })));
  } else if (opts.what === 'memo') {
    qs.forEach((q, i) => {
      const m = q.mnemonic || {};
      if (!m.cue && !m.key) return;
      root.appendChild(el('div', { class:'q print-q' }, [
        el('p', { text: (i + 1) + ') ' + (m.cue || '') + ' ← ' + (m.key || '') }),
        m.link ? el('p', { text:'🔗 ' + m.link }) : null
      ]));
    });
  } else {
    qs.forEach((q, i) => {
      const block = el('div', { class:'q print-q' }, [
        el('p', { class:'ltr', style:'font-weight:700', text: (i + 1) + ') ' + q.q })
      ]);
      q.options.forEach((o, oi) => {
        const isAns = oi === q.answer && opts.answers;
        block.appendChild(el('p', { class:'ltr print-opt' + (isAns ? ' print-ans' : ''),
          text: String.fromCharCode(65 + oi) + ') ' + o + (isAns ? '  ✓' : '') }));
      });
      if (opts.expl && q.expl_ar) block.appendChild(el('p', { class:'print-expl', text: q.expl_ar }));
      if (opts.translation && q.translation) block.appendChild(el('p', { class:'print-expl', text: q.translation }));
      root.appendChild(block);
    });
  }

  // التذييل الثابت أسفل كل صفحة — يفرضه تنسيق الطباعة
  root.appendChild(el('footer', { class:'print-foot', text:'برمجة وتصميم علي الصقور' }));
  return root;
}

function openPrintDialog(sub){
  const old = document.querySelector('.print-root, .print-dialog');
  if (old) old.remove();

  const what = el('select', { class:'input' }, [
    el('option', { value:'bank', text:'بنك الأسئلة' }),
    el('option', { value:'explain', text:'الشرح' }),
    el('option', { value:'memo', text:'بطاقات الحفظ' }),
    el('option', { value:'overview', text:'نظرة عامة' })
  ]);
  const range = el('select', { class:'input' }, [
    el('option', { value:'all', text:'كل الأسئلة' }),
    el('option', { value:'important', text:'المهمة فقط' }),
    el('option', { value:'starred', text:'ما ميّزته بنجمة' })
  ]);
  function check(label, checked){
    const c = el('input', { type:'checkbox' });
    c.checked = checked;
    return { node: el('label', { class:'row' }, [c, el('span', { text: label })]), input: c };
  }
  const ans = check('إظهار الإجابات', true);
  const expl = check('إظهار الشرح', false);
  const trans = check('إظهار الترجمة', false);
  const eco = check('وضع اقتصادي (حبر أقل)', false);

  const go = el('button', { class:'btn btn--block', type:'button', text:'اطبع الآن' });
  const cancel = el('button', { class:'btn btn--ghost btn--block', type:'button', text:'إلغاء' });
  const dialog = el('div', { class:'card print-dialog', role:'dialog', 'aria-label':'خيارات الطباعة' }, [
    el('h2', { text:'طباعة / PDF' }),
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'ماذا تطبع؟' }), what ]),
    el('label', { class:'field' }, [ el('span', { class:'field__label', text:'النطاق' }), range ]),
    ans.node, expl.node, trans.node, eco.node, go, cancel
  ]);
  cancel.addEventListener('click', () => dialog.remove());
  go.addEventListener('click', async () => {
    const r = await AMUSQ.data.subjectQuestions(sub.id);
    const doc = buildPrintDoc(sub, r.data, {
      what: what.value, range: range.value,
      answers: ans.input.checked, expl: expl.input.checked,
      translation: trans.input.checked, economic: eco.input.checked
    });
    document.body.appendChild(doc);
    dialog.remove();
    window.print();
    // بعد الطباعة تُزال الوثيقة كي لا تبقى في DOM
    setTimeout(() => doc.remove(), 500);
  });
  document.body.appendChild(dialog);
}

/* ===== 38-landing.js ===== */
/*
  صفحة الهبوط التعريفية — تُعرض للزائر غير المسجَّل فقط.
  الطالب المسجَّل يرى بطاقات مواده مباشرة كما كان، فلا نضيف له خطوة.
  لماذا؟ لأن الزائر يحتاج إقناعًا وشرحًا، والمسجَّل يحتاج مذاكرة فورية.
*/
/*
  خط تخطيط القلب: دورة PQRST كاملة تتكرر عبر عرض الشاشة.
  نبنيه برمجيًا لا كصورة، فيبقى الملف واحدًا ويتلوّن بمتغيّرات التصميم.
*/
function ecgPath(cycles, w, baseline){
  const parts = [];
  for (let i = 0; i < cycles; i++) {
    const x = i * w;
    parts.push(
      (i === 0 ? 'M' : 'L') + x + ',' + baseline,                 // خط القاعدة
      'L' + (x + 14) + ',' + baseline,
      'Q' + (x + 20) + ',' + (baseline - 9) + ' ' + (x + 26) + ',' + baseline,  // موجة P
      'L' + (x + 32) + ',' + baseline,
      'L' + (x + 36) + ',' + (baseline + 6),                      // Q
      'L' + (x + 41) + ',' + (baseline - 30),                     // R — الذروة
      'L' + (x + 46) + ',' + (baseline + 14),                     // S
      'L' + (x + 51) + ',' + baseline,
      'L' + (x + 60) + ',' + baseline,
      'Q' + (x + 70) + ',' + (baseline - 13) + ' ' + (x + 80) + ',' + baseline, // موجة T
      'L' + (x + w) + ',' + baseline
    );
  }
  return parts.join(' ');
}

function lpEcg(){
  const W = 100, CYCLES = 4, BASE = 40;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'lp-ecg');
  svg.setAttribute('viewBox', '0 0 ' + (W * CYCLES) + ' 80');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', ecgPath(CYCLES, W, BASE));
  svg.appendChild(path);
  return svg;
}

/*

  عدّاد امتحاناته، سؤال يجرّبه فعلًا، بطاقة حفظ حيّة، ونصائح مراجعة مبنية على أدلة.

/* ===== ١ · عدّاد الامتحانات القادمة — من المواد المنشورة فعلًا ===== */
function lpExams(subjects){
  const now = Date.now();
  const soon = subjects
    .filter(s => s.exam_date && new Date(s.exam_date).getTime() > now)
    .map(s => ({ s, d: Math.ceil((new Date(s.exam_date).getTime() - now) / 86400000) }))
    .sort((a, b) => a.d - b.d)
    .slice(0, 3);
  if (!soon.length) return null;

  return el('div', { class:'lp-exams' }, soon.map(x =>
    el('div', { class:'lp-exam' + (x.d <= 7 ? ' lp-exam--soon' : '') }, [
      el('div', { class:'lp-exam__d' }, [
        el('b', { class:'num', text: String(x.d) }),
        el('span', { text: x.d === 1 ? 'يوم' : 'أيام' })
      ]),
      el('div', {}, [
        el('div', { class:'lp-exam__n', text: (x.s.icon || '▤') + ' ' + x.s.name }),
        el('div', { class:'lp-exam__s', text: x.d <= 7 ? 'الامتحان قريب — ابدأ اليوم' : 'أمامك وقت كافٍ للمراجعة' })
      ])
    ])
  ));
}

/* ===== ٢ · سؤال تجريبي حقيقي — يجيب عنه الزائر ويرى الشرح فورًا =====
   عيّنة تعليمية موسومة بوضوح، لا تُنسب لملف دكتور. */
const LP_DEMO = {
  q: 'What is the recommended chest compression rate for an adult in CPR?',
  q_ar: 'ما معدّل ضغطات الصدر الموصى به للبالغ في الإنعاش القلبي الرئوي؟',
  options: ['60–80 / min', '80–100 / min', '100–120 / min', '130–150 / min'],
  answer: 2,
  why: 'المعدّل الموصى به عالميًا ١٠٠–١٢٠ ضغطة في الدقيقة. أبطأ من ذلك لا يولّد تدفقًا دمويًا كافيًا، وأسرع منه يمنع القلب من الامتلاء بين الضغطات فيقلّ الناتج القلبي.',
  wrong: 'الخياران الأول والثاني أبطأ من الموصى به، والرابع أسرع من أن يسمح بامتلاء البطينين.',
  mnemonic: { cue: 'compression rate', key: '100–120', link: 'إيقاع أغنية Stayin’ Alive' }
};

function lpTryQuestion(){
  const box = el('div', { class:'lp-try' });
  const feedback = el('div', { class:'lp-try__fb', hidden:true, role:'status' });
  let answered = false;

  const opts = el('div', { class:'lp-try__opts' }, LP_DEMO.options.map((text, i) => {
    const b = el('button', { class:'opt', type:'button' }, [
      el('span', { class:'opt__mark', 'aria-hidden':'true' }),
      el('span', { class:'ltr', text })
    ]);
    b.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      const right = i === LP_DEMO.answer;
      // نعلّم كل الخيارات: الصحيح دائمًا، والخاطئ المختار — باللون والأيقونة معًا
      opts.querySelectorAll('.opt').forEach((node, j) => {
        node.disabled = true;
        if (j === LP_DEMO.answer) { node.classList.add('is-answer'); node.firstChild.textContent = '✓'; }
        else if (j === i) { node.classList.add('is-wrong'); node.firstChild.textContent = '✗'; }
      });
      feedback.hidden = false;
      feedback.className = 'lp-try__fb ' + (right ? 'is-ok' : 'is-no');
      feedback.innerHTML = '';
      feedback.appendChild(el('b', { text: right ? '✓ إجابة صحيحة' : '✗ ليست الإجابة الصحيحة' }));
      feedback.appendChild(el('p', { style:'margin:0 0 8px', text: LP_DEMO.why }));
      feedback.appendChild(el('p', { class:'field__hint', style:'margin:0', text: LP_DEMO.wrong }));
    });
    return b;
  }));

  const transBtn = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'عرض الترجمة' });
  const trans = el('p', { class:'field__hint', hidden:true, text: LP_DEMO.q_ar });
  transBtn.addEventListener('click', () => {
    trans.hidden = !trans.hidden;
    transBtn.textContent = trans.hidden ? 'عرض الترجمة' : 'إخفاء الترجمة';
  });

  box.appendChild(el('div', { class:'row', style:'margin-bottom:12px' }, [
    el('span', { class:'badge', text:'عيّنة تعليمية' }),
    el('span', { class:'badge badge--ok', text:'BLS' })
  ]));
  box.appendChild(el('p', { class:'lp-try__q ltr', text: LP_DEMO.q }));
  box.appendChild(opts);
  box.appendChild(feedback);
  box.appendChild(el('div', { class:'row', style:'margin-top:12px' }, [transBtn]));
  box.appendChild(trans);
  return box;
}

/* ===== ٣ · بطاقة حفظ حيّة — يقلبها الزائر ليرى كيف تعمل ===== */
function lpMemoCard(){
  const m = LP_DEMO.mnemonic;
  let flipped = false;
  const card = el('div', { class:'lp-memo', tabindex:'0', role:'button', 'aria-label':'بطاقة حفظ — اضغط لقلبها' });

  function paint(){
    card.innerHTML = '';
    if (!flipped) {
      card.appendChild(el('p', { class:'lp-memo__hint', text:'وجه البطاقة · اضغط للقلب' }));
      card.appendChild(el('p', { class:'ltr', style:'font-weight:700;font-size:1.05rem', text: m.cue }));
      card.appendChild(el('p', { class:'field__hint', style:'margin:0', text:'ما الكلمة الدالة التي تربطها بالإجابة؟' }));
    } else {
      card.appendChild(el('p', { class:'lp-memo__hint', text:'الوجه الخلفي' }));
      card.appendChild(el('div', { class:'lp-memo__chain' }, [
        el('span', { class:'ltr', text: m.cue }),
        el('span', { 'aria-hidden':'true', text:'←' }),
        el('span', { class:'lp-memo__k ltr', text: m.key })
      ]));
      card.appendChild(el('p', { class:'field__hint', style:'margin:0', text:'🔗 ' + m.link }));
    }
  }
  const flip = () => { flipped = !flipped; paint(); };
  card.addEventListener('click', flip);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  paint();
  return card;
}

function boot(){
  if (AMUSQ.ready) return;   // الإقلاع مرة واحدة مهما تكرّر نداؤه
  AMUSQ.theme.init();

  // رموز الدخول تعود من Supabase في هاش الصفحة — نلتقطها قبل أن يفسّرها الموجّه كمسار
  if (AMUSQ.api.auth.captureFromHash(location.hash)) {
    try { history.replaceState(null, '', location.pathname + location.search + '#/'); }
    catch(e) { location.hash = '#/'; }
    AMUSQ.toast('تم تسجيل الدخول');
  }

  buildTabbar();
  registerRoutes();
  AMUSQ.router.init();
  registerSW();

  if (AMUSQ.api.user()) {
    AMUSQ.progress.pull();                       // دمج تقدّم الحساب مع الجهاز — بلا حذف
    AMUSQ.gate.refresh();                        // الاستحقاقات: ما اشتراه الطالب
    AMUSQ.api.rpc('heartbeat', { device_label: navigator.userAgent.slice(0, 60) });
  }
  if (AMUSQ.config.ready()) {
    AMUSQ.data.refreshPack().then(r => {         // تحديث قائمة المواد إن توفّر اتصال
      if (r.ok && AMUSQ.router.current && AMUSQ.router.current.path === '#/') AMUSQ.router.render('#/');
    });
  }
}

// PWA: عامل الخدمة يُسجَّل على https فقط — file:// يعمل بلا حاجة إليه أصلًا
function registerSW(){
  if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return false;
  if (location.protocol !== 'https:') return false;
  navigator.serviceWorker.register('sw.js').catch(() => {});   // فشله لا يعطل المنصة
  return true;
}

/* ===== 41-admin-charts.js ===== */
/*
  رسوم اللوحة — SVG مبني بيدنا لا مكتبة رسم.
  السبب: قاعدة «لا مكتبة خارجية في المتصفح»، والرسوم التي نحتاجها بسيطة
  (أعمدة وخط ومقاييس) فكتابتها أرخص من أي مكتبة وأخف على الجوال.
*/
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  if (attrs) Object.keys(attrs).forEach(k => {
    if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, String(attrs[k]));
  });
  return n;
}

/* أعمدة النشاط اليومي + خط متوسط النتيجة فوقها */
function chartActivity(series){
  const W = 640, H = 170, PAD_B = 22, PAD_T = 10;
  const svg = svgEl('svg', { class:'ad-chart', viewBox:'0 0 ' + W + ' ' + H,
    preserveAspectRatio:'none', role:'img', 'aria-label':'نشاط الاختبارات اليومي' });
  const n = series.length || 1;
  const maxN = Math.max(1, ...series.map(s => Number(s.n)));
  const bw = W / n, gap = Math.min(6, bw * .25);
  const plotH = H - PAD_B - PAD_T;

  // خطوط شبكة أفقية — ثلاثة تكفي لقراءة المقياس بلا ضجيج
  [0, .5, 1].forEach(f => {
    const y = PAD_T + plotH * (1 - f);
    svg.appendChild(svgEl('line', { class:'grid', x1:0, y1:y, x2:W, y2:y }));
    svg.appendChild(Object.assign(svgEl('text', { class:'lbl', x:2, y:y - 3 }),
      { textContent: String(Math.round(maxN * f)) }));
  });

  series.forEach((s, i) => {
    const v = Number(s.n);
    const h = Math.max(v > 0 ? 3 : 2, plotH * (v / maxN));
    svg.appendChild(svgEl('rect', {
      class: 'bar' + (v ? '' : ' bar--empty'),
      x: i * bw + gap / 2, y: PAD_T + plotH - h,
      width: Math.max(2, bw - gap), height: h, rx: 3
    }));
    // تسمية اليوم: نعرض كل يومين على الجوال كي لا تتداخل
    if (n <= 8 || i % 2 === 0) {
      const day = String(s.d).slice(8, 10);
      svg.appendChild(Object.assign(
        svgEl('text', { class:'lbl', x: i * bw + bw / 2, y: H - 6, 'text-anchor':'middle' }),
        { textContent: day }));
    }
  });

  // خط متوسط النتيجة — يقرأ على مقياس ٠–١٠٠ لا على مقياس العدد
  const pts = series.map((s, i) => [i * bw + bw / 2, PAD_T + plotH * (1 - Number(s.avg) / 100)]);
  if (pts.some((p, i) => Number(series[i].avg) > 0)) {
    svg.appendChild(svgEl('path', { class:'line',
      d: pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') }));
    pts.forEach((p, i) => { if (Number(series[i].avg) > 0)
      svg.appendChild(svgEl('circle', { class:'dot', cx:p[0], cy:p[1], r:2.4 })); });
  }
  return svg;
}

/* شرائح النتائج — أشرطة أفقية تُقرأ أسرع من دائرة */
function chartBuckets(buckets){
  const total = buckets.reduce((n, b) => n + Number(b.n), 0) || 1;
  const COLORS = ['var(--bad)','var(--warn)','var(--star)','var(--brand-2)','var(--ok)'];
  return el('div', {}, buckets.map((b, i) => {
    const pct = Number(b.n) / total * 100;
    return el('div', { class:'ad-bucket' }, [
      el('span', { class:'ad-bucket__l', text: b.label }),
      el('span', { class:'ad-bucket__t' }, [
        el('span', { class:'ad-bucket__f', style:'width:' + pct.toFixed(1) + '%;background:' + COLORS[i] })
      ]),
      el('span', { class:'ad-bucket__n', text: String(b.n) })
    ]);
  }));
}

/* بطاقة مؤشر */
function kpi(n, label, sub, tone){
  return el('div', { class:'ad-kpi' + (tone ? ' ad-kpi--' + tone : '') }, [
    el('span', { class:'ad-kpi__n', text: String(n) }),
    el('span', { class:'ad-kpi__l', text: label }),
    sub ? el('span', { class:'ad-kpi__s', text: sub }) : null
  ]);
}

/* وقت نسبي مختصر */
function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'الآن';
  if (s < 3600) return Math.floor(s / 60) + ' د';
  if (s < 86400) return Math.floor(s / 3600) + ' س';
  return Math.floor(s / 86400) + ' يوم';
}

AMUSQ.admin = AMUSQ.admin || {};
AMUSQ.admin.charts = { chartActivity, chartBuckets, kpi, ago, svgEl };

/* ===== 43-admin-subject.js ===== */
/*
  محرر المادة — كل ما يخصّ مادة واحدة في شاشة واحدة: هويتها، محاورها، وأسئلتها.

  قرار جوهري: نصّ السؤال وخياراته لا يُعدَّلان هنا ولا في أي مكان (قاعدة القداسة).
  ما يملك المشرف تعديله هو ما أضفناه نحن حول النص: موضع الإجابة، المحور، الشرح،
  الترجمة، بطاقة الحفظ، علامة الأهمية، والترتيب. الخطأ في نصّ الدكتور يُصلَح
  برفع الملف من جديد لا بالكتابة فوقه.
*/
const SUBJ_COLORS = ['subject-1','subject-2','subject-3','subject-4','subject-5','subject-6'];
const SUBJ_ICONS  = ['▤','☤','✚','♥','◈','⚕','☣','◐','⌁','⚗'];

const SubjEditor = {
  patchSubject(id, body){
    return AMUSQ.api.rest('subjects?id=eq.' + id, { method:'PATCH', body: JSON.stringify(body) });
  },
  patchQuestion(id, body){
    return AMUSQ.api.rest('questions?id=eq.' + id, { method:'PATCH', body: JSON.stringify(body) });
  },
  delQuestion(id){
    return AMUSQ.api.rest('questions?id=eq.' + id, { method:'DELETE' });
  },
  /* تصفية محلية: البحث في مادة واحدة لا يستحق ذهابًا إلى الخادم مع كل حرف */
  filter(list, q, topic, only){
    const needle = String(q || '').trim().toLowerCase();
    return list.filter(x => {
      if (topic && (x.topic || '') !== topic) return false;
      if (only === 'important' && !x.important) return false;
      if (only === 'derived'   && !x.derived)   return false;
      if (only === 'noexpl'    && x.expl_ar)    return false;
      if (!needle) return true;
      return (x.q + ' ' + (x.options || []).join(' ')).toLowerCase().indexOf(needle) !== -1;
    });
  }
};

/* ===== بطاقة هوية المادة ===== */

  let color = sub.color || SUBJ_COLORS[0];

    AMUSQ.toast(r.ok ? (sub.published ? 'أُخفيت المادة' : 'نُشرت المادة') : 'تعذّر التعديل');
    if (r.ok && refresh) refresh();

/* ===== المحاور ===== */
function subjTopics(sub, questions, refresh){
  const topics = Array.isArray(sub.topics) ? sub.topics.slice() : [];
  // العدّ من الأسئلة نفسها: يكشف محورًا مكتوبًا في القائمة وليس عليه سؤال واحد
  const counts = {};
  questions.forEach(q => { const t = q.topic || ''; if (t) counts[t] = (counts[t] || 0) + 1; });
  Object.keys(counts).forEach(t => { if (topics.indexOf(t) === -1) topics.push(t); });

  const list = el('div', { class:'stack' });
  function draw(){
    list.innerHTML = '';
    if (!topics.length) { list.appendChild(el('p', { class:'page__sub', text:'لا محاور بعد.' })); return; }
    topics.forEach((t, i) => {
      const up = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'↑', 'aria-label':'أعلِ ' + t });
      up.addEventListener('click', () => { if (i > 0){ topics.splice(i-1, 0, topics.splice(i,1)[0]); draw(); } });
      const del = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'✕', 'aria-label':'احذف ' + t });
      del.addEventListener('click', () => {
        if (counts[t]) return AMUSQ.toast('لا يُحذف محور عليه ' + counts[t] + ' سؤالًا — انقلها أولًا');
        topics.splice(i, 1); draw();
      });
      list.appendChild(el('div', { class:'row' }, [
        el('span', { text: t }),
        el('span', { class:'badge num', text: (counts[t] || 0) + ' سؤالًا' }),
        el('span', { class:'spacer' }), up, del
      ]));
    });
  }
  draw();

  const addIn = el('input', { class:'input', placeholder:'اسم محور جديد' });
  const add = el('button', { class:'btn btn--sm', type:'button', text:'أضف' });
  add.addEventListener('click', () => {
    const v = addIn.value.trim();
    if (!v) return;
    if (topics.indexOf(v) !== -1) return AMUSQ.toast('المحور موجود');
    topics.push(v); addIn.value = ''; draw();
  });
  const save = el('button', { class:'btn', type:'button', text:'احفظ المحاور' });
  save.addEventListener('click', async () => {
    const r = await SubjEditor.patchSubject(sub.id, { topics });
    AMUSQ.toast(r.ok ? 'حُفظت المحاور' : 'تعذّر الحفظ');
    if (r.ok && refresh) refresh();
  });

  return el('div', { class:'ad-panel' }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:'المحاور' }),
      el('span', { class:'ad-panel__s', text:'ترتيبها هنا هو ترتيب عرضها للطالب' })
    ]),
    list,
    el('div', { class:'ad-bar', style:'margin:16px 0 0' }, [ addIn, add, save ])
  ]);
}

/* ===== بطاقة سؤال واحد ===== */
function qCard(q, sub, refresh){
  const box = el('div', { class:'ad-q', 'data-qid': q.id });
  const head = el('div', { class:'ad-q__head' }, [
    el('span', { class:'badge num', text:'#' + (q.ord + 1) }),
    q.topic ? el('span', { class:'badge', text: q.topic }) : null,
    q.derived ? el('span', { class:'badge badge--warn', text:'إجابة مستنتجة' }) : null,
    q.opts_built ? el('span', { class:'badge badge--warn', text:'خيارات مبنية' }) : null,
    !q.expl_ar ? el('span', { class:'badge', text:'بلا شرح' }) : null,
    el('span', { class:'spacer' })
  ]);
  const star = el('button', { class:'btn btn--sm btn--ghost', type:'button',
    text: q.important ? '★ مهم' : '☆ علّمه مهمًا', 'aria-pressed': q.important ? 'true' : 'false' });
  star.addEventListener('click', async () => {
    const r = await SubjEditor.patchQuestion(q.id, { important: !q.important });
    if (!r.ok) return AMUSQ.toast('تعذّر التعديل');
    q.important = !q.important;
    star.textContent = q.important ? '★ مهم' : '☆ علّمه مهمًا';
    star.setAttribute('aria-pressed', q.important ? 'true' : 'false');
  });
  head.appendChild(star);

  const more = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'حرّر' });
  head.appendChild(more);
  box.appendChild(head);

  // النص والخيارات للعرض فقط — لا حقل إدخال عليهما (قاعدة القداسة)
  box.appendChild(el('p', { class:'ad-q__text', text: q.q }));
  const opts = el('div', {});
  (q.options || []).forEach((o, i) => {
    const b = el('button', { class:'ad-q__opt' + (i === q.answer ? ' is-a' : ''), type:'button',
      'data-i': String(i), text: o });
    b.addEventListener('click', async () => {
      if (i === q.answer) return;
      const r = await SubjEditor.patchQuestion(q.id, { answer: i, derived: false });
      if (!r.ok) return AMUSQ.toast('تعذّر تصحيح الإجابة');
      q.answer = i; q.derived = false;
      opts.querySelectorAll('.ad-q__opt').forEach((x, xi) =>
        x.className = 'ad-q__opt' + (xi === i ? ' is-a' : ''));
      AMUSQ.toast('صُحّحت الإجابة');
    });
    opts.appendChild(b);
  });
  box.appendChild(opts);

  // لوح التحرير يُبنى عند الطلب لا مع كل سؤال — القائمة قد تحمل مئات البطاقات
  let panel = null;
  more.addEventListener('click', () => {
    if (panel){ panel.remove(); panel = null; more.textContent = 'حرّر'; return; }
    more.textContent = 'أغلِق';
    const topicSel = el('select', { class:'input' });
    const tops = (Array.isArray(sub.topics) ? sub.topics : []).slice();
    if (q.topic && tops.indexOf(q.topic) === -1) tops.push(q.topic);
    topicSel.appendChild(el('option', { value:'', text:'— بلا محور —' }));
    tops.forEach(t => topicSel.appendChild(el('option', { value:t, text:t, selected: t === q.topic ? 'selected' : null })));
    topicSel.value = q.topic || '';

    const ar = el('textarea', { class:'input', rows:'3' }); ar.value = q.expl_ar || '';
    const en = el('textarea', { class:'input', rows:'2' }); en.value = q.expl_en || '';
    const tr = el('textarea', { class:'input', rows:'2' }); tr.value = q.translation || '';
    const m = q.mnemonic || {};
    const cue  = el('input', { class:'input', value: m.cue || '',  placeholder:'الطُّعم' });
    const key  = el('input', { class:'input', value: m.key || '',  placeholder:'المفتاح' });
    const link = el('input', { class:'input', value: m.link || '', placeholder:'الرابط الذهني' });
    const ordQ = el('input', { class:'input', type:'number', value: String(q.ord), 'aria-label':'ترتيب السؤال' });

    const save = el('button', { class:'btn btn--sm', type:'button', text:'احفظ' });
    save.addEventListener('click', async () => {
      const r = await SubjEditor.patchQuestion(q.id, {
        topic: topicSel.value, expl_ar: ar.value, expl_en: en.value, translation: tr.value,
        mnemonic: { cue: cue.value, key: key.value, link: link.value, strike: m.strike || '' },
        ord: parseInt(ordQ.value || String(q.ord), 10)
      });
      AMUSQ.toast(r.ok ? 'حُفظ السؤال' : 'تعذّر الحفظ');
      if (r.ok && refresh) refresh();
    });

    // الحذف بتأكيد صريح: الضغطة الأولى تحوّل الزر، الثانية تنفّذ
    const del = el('button', { class:'btn btn--sm btn--ghost', type:'button', text:'احذف السؤال' });
    let armed = false;
    del.addEventListener('click', async () => {
      if (!armed){ armed = true; del.textContent = 'اضغط ثانيةً للحذف نهائيًا'; del.className = 'btn btn--sm btn--danger'; return; }
      const r = await SubjEditor.delQuestion(q.id);
      AMUSQ.toast(r.ok ? 'حُذف السؤال' : 'تعذّر الحذف');
      if (r.ok){ if (refresh) refresh(); else box.remove(); }
    });

    panel = el('div', { class:'ad-edit ad-edit--2', style:'margin-top:12px' }, [
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'المحور' }), topicSel ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الترتيب' }), ordQ ]),
      el('label', { class:'field', style:'margin:0;grid-column:1/-1' }, [ el('span', { class:'field__label', text:'الشرح بالعربية' }), ar ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الشرح بالإنجليزية' }), en ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'الترجمة' }), tr ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'بطاقة الحفظ — الطُّعم' }), cue ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'المفتاح' }), key ]),
      el('label', { class:'field', style:'margin:0;grid-column:1/-1' }, [ el('span', { class:'field__label', text:'الرابط الذهني' }), link ]),
      el('div', { class:'ad-bar', style:'grid-column:1/-1;margin:0' }, [ save, el('span', { class:'spacer' }), del ])
    ]);
    box.appendChild(panel);
  });
  return box;
}

/* ===== متصفح الأسئلة ===== */
function subjQuestions(sub, questions, refresh){
  const search = el('input', { class:'input', type:'search', placeholder:'ابحث في نص السؤال أو خياراته…' });
  const topicSel = el('select', { class:'input', 'aria-label':'تصفية بالمحور' });
  topicSel.appendChild(el('option', { value:'', text:'كل المحاور' }));
  const seen = {};
  questions.forEach(q => { if (q.topic && !seen[q.topic]){ seen[q.topic] = 1;
    topicSel.appendChild(el('option', { value:q.topic, text:q.topic })); } });
  const onlySel = el('select', { class:'input', 'aria-label':'تصفية بالحالة' });
  [['','كل الأسئلة'],['important','المهمة فقط'],['derived','إجابة مستنتجة'],['noexpl','بلا شرح']]
    .forEach(o => onlySel.appendChild(el('option', { value:o[0], text:o[1] })));

  const count = el('span', { class:'ad-panel__s' });
  const list = el('div', { class:'stack', style:'margin-top:12px' });
  let shown = 40;   // نرسم دفعة أولى فقط: مادة فيها ٣٠٠ سؤال لا تُرسم كلها على جوال

  function draw(){
    const res = SubjEditor.filter(questions, search.value, topicSel.value, onlySel.value);
    count.textContent = res.length + ' من ' + questions.length + ' سؤالًا';
    list.innerHTML = '';
    res.slice(0, shown).forEach(q => list.appendChild(qCard(q, sub, refresh)));
    if (res.length > shown){
      const more = el('button', { class:'btn btn--block btn--soft', type:'button',
        text:'اعرض ' + Math.min(40, res.length - shown) + ' سؤالًا آخر' });
      more.addEventListener('click', () => { shown += 40; draw(); });
      list.appendChild(more);
    }
    if (!res.length) list.appendChild(AMUSQ.views.empty('⌕', 'لا نتائج', 'جرّب كلمة أخرى أو أزل التصفية.'));
  }
  [search, topicSel, onlySel].forEach(x =>
    x.addEventListener('input', () => { shown = 40; draw(); }));
  draw();

  return el('div', { class:'ad-panel' }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:'الأسئلة' }), count
    ]),
    el('p', { class:'page__sub', style:'margin-top:0',

    el('div', { class:'ad-bar' }, [ search, topicSel, onlySel ]),

/* ===== 44-admin-settings.js ===== */
/*
  الإعدادات — كل مقبض في المنصة في شاشة واحدة، مجموعًا بالمعنى لا بالجدول.
  الحفظ لكل مجموعة على حدة: المشرف يغيّر شيئًا واحدًا فلا نعيد كتابة الصف كله
  ولا نجعله يمرّ على عشرين حقلًا ليضغط زرًا واحدًا في القاع.
*/
const SET = {
  /* وصف الحقول في مكان واحد — الواجهة تُبنى منه، والفحص يقرأه، فلا يفترقان */
  GROUPS: [
    { id:'identity', title:'هوية المنصة', sub:'ما يراه الطالب في الترويسة والصفحة التعريفية', fields:[
      { k:'platform_name', t:'text',  label:'اسم المنصة' },
      { k:'tagline',       t:'text',  label:'الشعار — سطر واحد' },
      { k:'welcome_text',  t:'area',  label:'نص الترحيب' },
      { k:'support_email', t:'text',  label:'بريد الدعم', dir:'ltr' },
      { k:'whatsapp',      t:'text',  label:'رقم واتساب للتواصل', dir:'ltr' }
    ]},
    { id:'exam', title:'افتراضات الاختبار', sub:'يبدأ بها الطالب، وله تغييرها قبل كل اختبار', fields:[
      { k:'exam_count',       t:'num',  label:'عدد الأسئلة', min:1, max:200 },
      { k:'exam_minutes',     t:'num',  label:'المدة بالدقائق', min:1, max:300 },
      { k:'pass_mark',        t:'num',  label:'علامة النجاح ٪', min:0, max:100 },
      { k:'shuffle_q',        t:'bool', label:'خلط ترتيب الأسئلة' },
      { k:'shuffle_opts',     t:'bool', label:'خلط ترتيب الخيارات' },
      { k:'instant_feedback', t:'bool', label:'إظهار الصواب فور الإجابة' }
    ]},
    { id:'access', title:'الوصول والحسابات', sub:'من يدخل، وبكم جهاز، ومتى تُغلق المنصة', fields:[
      { k:'signup_open',   t:'bool', label:'التسجيل مفتوح للطلاب الجدد' },
      { k:'board_enabled', t:'bool', label:'لوحة المتصدرين ظاهرة' },
      { k:'device_limit',  t:'num',  label:'حد الأجهزة لكل حساب', min:1, max:10 },
      { k:'trial_days',    t:'num',  label:'أيام التجربة المجانية', min:0, max:365 },
      { k:'maintenance',   t:'bool', label:'وضع الصيانة — يُوقف دخول الطلاب' },
      { k:'maint_msg',     t:'area', label:'رسالة الصيانة' }
    ]}
  ],

  /* لا نُرسل إلا ما تغيّر فعلًا: أقل حمولة، وأثر أوضح في سجل القاعدة */
  diff(before, after){
    const out = {};
    Object.keys(after).forEach(k => { if (after[k] !== before[k]) out[k] = after[k]; });
    return out;
  },
  /* الأرقام تُقصّ إلى مداها قبل الإرسال — القاعدة سترفض الخارج، ونحن نمنع الرحلة أصلًا */
  clamp(v, min, max){
    const n = parseInt(v, 10);
    if (isNaN(n)) return min;
    return Math.min(max, Math.max(min, n));
  }
};

function setField(f, value, onChange){
  if (f.t === 'bool'){
    let on = !!value;
    const b = el('button', { class:'btn btn--sm ' + (on ? '' : 'btn--ghost'), type:'button',
      role:'switch', 'data-k':f.k, 'aria-checked': on ? 'true' : 'false',
      text: (on ? '✓ ' : '') + f.label });
    b.addEventListener('click', () => {
      on = !on;
      b.className = 'btn btn--sm ' + (on ? '' : 'btn--ghost');
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.textContent = (on ? '✓ ' : '') + f.label;
      onChange(f.k, on);
    });
    return b;
  }
  let inp;
  if (f.t === 'area'){ inp = el('textarea', { class:'input', rows:'2', 'data-k':f.k }); inp.value = value || ''; }
  else if (f.t === 'num'){
    inp = el('input', { class:'input', type:'number', 'data-k':f.k,
      min:String(f.min), max:String(f.max), value: String(value == null ? f.min : value) });
  } else {
    inp = el('input', { class:'input', type:'text', 'data-k':f.k, dir: f.dir || 'auto', value: value || '' });
  }
  inp.addEventListener('input', () => {
    onChange(f.k, f.t === 'num' ? SET.clamp(inp.value, f.min, f.max) : inp.value);
  });
  return el('label', { class:'field', style:'margin:0' }, [
    el('span', { class:'field__label', text:f.label }), inp
  ]);
}

function setGroup(g, row, refresh){
  const draft = {};
  g.fields.forEach(f => { draft[f.k] = row[f.k]; });
  const save = el('button', { class:'btn', type:'button', text:'احفظ ' + g.title, disabled:true });
  const mark = el('span', { class:'ad-panel__s' });

  function touched(){
    const d = SET.diff(row, draft);
    const n = Object.keys(d).length;
    save.disabled = n === 0;
    mark.textContent = n ? n + ' تغييرًا غير محفوظ' : 'محفوظ';
  }
  touched();

  const body = el('div', { class:'ad-edit ad-edit--2' },
    g.fields.map(f => setField(f, row[f.k], (k, v) => { draft[k] = v; touched(); })));

  save.addEventListener('click', async () => {
    const d = SET.diff(row, draft);
    if (!Object.keys(d).length) return;
    const r = await AMUSQ.api.rest('settings?id=eq.1', { method:'PATCH', body: JSON.stringify(d) });
    AMUSQ.toast(r.ok ? 'حُفظت ' + g.title : 'تعذّر الحفظ');
    if (r.ok && refresh) refresh();
  });

  return el('section', { class:'ad-panel', 'data-group':g.id }, [
    el('div', { class:'ad-panel__h' }, [
      el('h2', { class:'ad-panel__t', text:g.title }), mark
    ]),
    el('p', { class:'page__sub', style:'margin-top:0', text:g.sub }),
    body,
    el('div', { class:'ad-bar', style:'margin:16px 0 0' }, [ save ])
  ]);
}

/* ===== الربط: يعمل قبل الدخول لأنه أول ما يُضبط عند التركيب ===== */
function setConnection(){
  const c = AMUSQ.config.get() || {};
  const urlIn = el('input', { class:'input', dir:'ltr', id:'cfgUrl', value: c.url || '', placeholder:'https://xxxx.supabase.co' });
  const keyIn = el('input', { class:'input', dir:'ltr', id:'cfgKey', value: c.anonKey || '', placeholder:'anon key' });
  const apiIn = el('input', { class:'input', dir:'ltr', id:'cfgApi', value: AMUSQ.store.get('api_base',''),
    placeholder:'اتركه فارغًا على نفس الموقع' });
  const save = el('button', { class:'btn', type:'button', text:'احفظ الربط' });
  save.addEventListener('click', () => {
    const r = AMUSQ.config.set(urlIn.value.trim(), keyIn.value.trim());
    AMUSQ.store.set('api_base', apiIn.value.trim());
    AMUSQ.toast(r.ok ? 'حُفظ الربط — المنصة موصولة' : r.err);
  });
  return el('section', { class:'ad-panel' }, [
    el('div', { class:'ad-panel__h' }, [ el('h2', { class:'ad-panel__t', text:'ربط الخادم' }) ]),
    el('p', { class:'page__sub', style:'margin-top:0',
      text:'المفتاح العام (anon) عام بطبيعته — الحماية كلها في RLS داخل القاعدة، لا في إخفائه.' }),
    el('div', { class:'ad-edit' }, [
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'رابط Supabase' }), urlIn ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'المفتاح العام (anon)' }), keyIn ]),
      el('label', { class:'field', style:'margin:0' }, [ el('span', { class:'field__label', text:'رابط دوال الخادم (Vercel)' }), apiIn ])
    ]),
    el('div', { class:'ad-bar', style:'margin:16px 0 0' }, [ save ])
  ]);
}

/* ===== صحة المحتوى ===== */
function setHealth(){
  const box = el('section', { class:'ad-panel' }, [
    el('div', { class:'ad-panel__h' }, [ el('h2', { class:'ad-panel__t', text:'صحة المحتوى' }) ]),
    el('p', { class:'page__sub', text:'جارٍ الفحص…' })
  ]);
  AMUSQ.api.rpc('admin_health').then(r => {
    if (!box.isConnected) return;
    box.innerHTML = '';
    box.appendChild(el('div', { class:'ad-panel__h' }, [ el('h2', { class:'ad-panel__t', text:'صحة المحتوى' }) ]));
    if (!r.ok || !r.data || r.data.error){
      box.appendChild(el('p', { class:'page__sub', text:'يظهر بعد تشغيل SETTINGS-UPGRADE.sql على القاعدة.' }));
      return;
    }
    const h = r.data;
    const ITEMS = [
      ['bad_answer',  'إجابة خارج نطاق الخيارات', 'bad'],
      ['no_expl',     'سؤالًا بلا شرح',            'warn'],
      ['derived',     'إجابة استنتجها الذكاء',     'warn'],
      ['opts_built',  'سؤالًا خياراته مبنية',      'warn'],
      ['no_topic',    'سؤالًا بلا محور',           'warn'],
      ['empty_subj',  'مادة بلا سؤال واحد',        'warn'],
      ['unpublished', 'مادة غير منشورة',           null]
    ];
    const bad = ITEMS.filter(i => Number(h[i[0]]) > 0);
    if (!bad.length){
      box.appendChild(el('p', { class:'page__sub', text:'✓ لا ملاحظات — المحتوى جاهز للطالب.' }));
      return;
    }
    bad.forEach(i => box.appendChild(el('div', { class:'row' }, [
      el('span', { class:'badge num ' + (i[2] === 'bad' ? 'badge--bad' : i[2] === 'warn' ? 'badge--warn' : ''),
        text: String(h[i[0]]) }),
      el('span', { text: i[1] })
    ])));
  });
  return box;
}

/* ===== التصدير ومنطقة الخطر ===== */
function setData(){
  const btn = el('button', { class:'btn', type:'button', text:'صدّر نسخة كاملة (JSON)' });
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'جارٍ التصدير…';
    const r = await AMUSQ.api.rpc('admin_export');
    btn.disabled = false; btn.textContent = 'صدّر نسخة كاملة (JSON)';
    if (!r.ok || !r.data || r.data.error) return AMUSQ.toast('تعذّر التصدير');
    const blob = new Blob([JSON.stringify(r.data, null, 2)], { type:'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob),
      download: 'amusq-backup-' + new Date().toISOString().slice(0,10) + '.json' });
    document.body.appendChild(a); a.click(); a.remove();
    AMUSQ.toast('نُزّلت النسخة');
  });

  const clearLocal = el('button', { class:'btn btn--ghost', type:'button', text:'امسح ذاكرة هذا الجهاز' });
  let armed = false;
  clearLocal.addEventListener('click', () => {
    if (!armed){ armed = true; clearLocal.textContent = 'اضغط ثانيةً — يُمسح التقدّم المحلي'; clearLocal.className = 'btn btn--danger'; return; }
    AMUSQ.store.clearAll();
    AMUSQ.toast('مُسحت الذاكرة المحلية — أعد التحميل');
  });

  return el('section', { class:'ad-panel ad-danger' }, [
    el('div', { class:'ad-panel__h' }, [ el('h2', { class:'ad-panel__t', text:'البيانات' }) ]),
    el('p', { class:'page__sub', style:'margin-top:0',
      text:'التصدير يحفظ المواد والأسئلة والإعدادات كاملة. المسح يطال هذا الجهاز وحده ولا يلمس القاعدة.' }),
    el('div', { class:'ad-bar', style:'margin:0' }, [ btn, el('span', { class:'spacer' }), clearLocal ])
  ]);
}

/* ===== التبويب ===== */
function adminSettingsTabFull(box){
  box.appendChild(setConnection());
  const rest = el('div', { class:'stack' }, [ el('p', { class:'page__sub', text:'جارٍ جلب الإعدادات…' }) ]);
  box.appendChild(rest);

  function load(){
    AMUSQ.api.rest('settings?id=eq.1&select=*').then(r => {
      if (!rest.isConnected) return;
      rest.innerHTML = '';
      const row = (r.ok && r.data && r.data[0]) || null;
      if (!row){
        rest.appendChild(AMUSQ.views.empty('⚙', 'الإعدادات غير متاحة',
          'تُجلب بعد ربط الخادم والدخول كمشرف وتشغيل ملفات SQL.'));
        return;
      }
      SET.GROUPS.forEach(g => rest.appendChild(setGroup(g, row, load)));
      rest.appendChild(setHealth());
      rest.appendChild(setData());
    });
  }
  load();
}

AMUSQ.admin.settings = SET;
