# ═══════════════════════════════════════════════════════════════════
#  مراجعة · بناء تطبيق آيفون ورفعه إلى TestFlight — بلا جهاز ماك
# ═══════════════════════════════════════════════════════════════════
#  يعمل على أجهزة macOS التي توفّرها GitHub (مجانًا للمستودع العام):
#  يبني الموقع → يجهّز الغلاف (Capacitor) → يوقّع سحابيًا بمفتاح
#  App Store Connect → يرفع إلى TestFlight.
#
#  ★ لا شهادة ولا ملف توقيع يُحفظ في المستودع: التوقيع السحابي (Xcode
#    -allowProvisioningUpdates) يُنشئ الشهادات في حساب أبل ويستعملها.
#
#  الأسرار المطلوبة (Settings → Secrets and variables → Actions):
#    ASC_KEY_ID       معرّف مفتاح App Store Connect API (مثل 2X9R4HXF34)
#    ASC_ISSUER_ID    Issuer ID من الصفحة نفسها
#    ASC_API_KEY_P8   محتوى ملف AuthKey_XXXX.p8 كاملًا (بسطوره)
#  والمفتاح يجب أن يكون بدور Admin كي يستطيع إنشاء شهادات التوزيع.
#
#  التشغيل: يدويًا من تبويب Actions (Run workflow)، أو بدفع وسمٍ ios-v1.0.0
name: iOS · TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار الظاهر (مثل 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags: ['ios-v*']

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    # ★ macOS 26 (Xcode 26.6 افتراضيًا): أبل ترفض منذ أبريل ٢٠٢٦ أي رفعٍ بُني بغير iOS 26 SDK —
    #   وصورة macos-15 افتراضيُّها Xcode 16.4 (iOS 18.5 SDK) فتُرفض عند الرفع بعد بناءٍ كامل.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MARKETING_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      # ★ Node 22 لا 20: jsdom (للفحوص) يعتمد undici 8 الذي يشترط Node ≥ 22.19 —
      #   على Node 20 ينهار الفحص قبل أن يبدأ (markAsUncloneable is not a function)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تثبيت اعتمادات الجذر (jsdom للفحوص)
        run: npm ci --ignore-scripts

      # الفحوص تستدعي دوال الخادم نفسها (api/_lib) فتحتاج اعتماداتها: fflate وpdf-parse
      - name: اعتمادات دوال الخادم
        working-directory: api
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: بناء الموقع وفحصه — لا يُرفع ما لم يمرّ الفحص
        run: |
          node src/build.js
          node src/tests.js

      - name: اعتمادات الغلاف
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: تجهيز www من index.html المبني
        working-directory: mobile
        run: node prepare.js

      - name: إنشاء مشروع iOS ومزامنته
        working-directory: mobile
        run: |
          test -d ios || npx cap add ios
          npx cap sync ios

      - name: الأيقونات وشاشة البداية من mobile/assets
        working-directory: mobile
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#111722' --iconBackgroundColorDark '#111722' --splashBackgroundColor '#111722' --splashBackgroundColorDark '#111722'

      - name: ضبط Info.plist (muraja:// · الاسم العربي · بلا سؤال التشفير)
        working-directory: mobile
        run: node ios-patch.js

      - name: مفتاح App Store Connect API
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_API_KEY_P8" || { echo "✗ السرّ ASC_API_KEY_P8 غير مضبوط"; exit 1; }
          mkdir -p "$HOME/asc"
          # tr يحذف \r إن لُصق المفتاح من ويندوز؛ وopenssl يتحقق أنه مفتاح صالح قبل ٢٠ دقيقة بناء
          printf '%s\n' "$ASC_API_KEY_P8" | tr -d '\r' > "$HOME/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/asc/AuthKey_${ASC_KEY_ID}.p8"
          openssl pkey -in "$HOME/asc/AuthKey_${ASC_KEY_ID}.p8" -noout 2>/dev/null || { echo "✗ محتوى ASC_API_KEY_P8 ليس مفتاح .p8 صالحًا — الصق الملف كاملًا من BEGIN إلى END"; exit 1; }

      - name: اختيار Xcode (الافتراضي في الصورة — ٢٦ فأحدث)
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # ★ الأرشيف يُبنى بلا توقيع عمدًا: التوقيع الآلي في مرحلة الأرشفة يستعمل هوية
      #   «تطوير» ويحتاج جهازًا مسجَّلًا في الحساب (ولا جهاز على خادم GitHub)، وفرضُ هوية
      #   التوزيع عليه يتعارض مع الآلي. فالتوقيع كله في خطوة التصدير: هناك يوقّع Xcode
      #   بهوية التوزيع السحابية وينشئ ملف App Store بنفسه — بلا جهاز ولا شهادة محفوظة.
      #   وIPHONEOS_DEPLOYMENT_TARGET=15.0: أبل (ITMS-90068) تشترط من ربيع ٢٠٢٧ حدًّا أدنى iOS 15 — قالب Capacitor يضع 13.
      - name: أرشفة بلا توقيع (التوقيع في التصدير)
        working-directory: mobile
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=327HJYMMD2 \
            TARGETED_DEVICE_FAMILY=1 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          test -d build/App.xcarchive || { echo "✗ لم تُنشأ الأرشيفة — راجع السجل أعلاه"; exit 1; }

      # التوقيع السحابي هنا: -allowProvisioningUpdates مع مفتاح API يُنشئ شهادة توزيع
      # مُدارة سحابيًا وملف App Store للمعرّف com.alsoqoor.muraja ثم يرفع مباشرةً
      - name: التوقيع والرفع إلى App Store Connect (TestFlight)
        working-directory: mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/out \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "✓ رُفع البناء رقم ${{ github.run_number }} — يظهر في TestFlight بعد المعالجة (دقائق)"

      - name: تنظيف المفتاح
        if: always()
        run: rm -rf "$HOME/asc"
